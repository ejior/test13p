<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMTP測驗系統</title>
  <style>
        :root {
      --primary-color: #2c3e50;
      --primary-hover: #1a252f;
      --bg-color: #e9ecef;
      --card-bg: #ffffff;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
      --success: #2e7d32;
      --error: #c62828;
      --border-radius: 12px;
      --transition: all 0.2s ease-in-out;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, Avenir, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 3rem 1rem;
    }

    #app {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 2.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      transition: var(--transition);
      animation: fadeIn 0.4s ease-out forwards;
      margin-bottom: 2rem;
    }

    h1 { font-size: 2.2rem; color: var(--primary-color); margin-bottom: 0.5rem; text-align: center; }
    .chapter-title { font-size: 1.5rem; color: var(--text-muted); text-align: center; margin-bottom: 1.5rem; font-weight: normal; }
    h2 { font-size: 1.2rem; margin-bottom: 1.5rem; color: var(--text-main); text-align: center; }
    p { color: var(--text-muted); }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(106, 140, 175, 0.3);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .option-btn {
      display: block;
      width: 100%;
      text-align: left;
      background-color: #ffffff;
      color: #1e3a8a;
      border: 1px solid #e2e8f0;
      margin-bottom: 0.5rem;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 1.05rem;
    }

    .option-btn:hover:not(:disabled) {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
    }

    .option-btn.selected {
      background-color: #eff6ff;
      border-color: var(--primary-color);
      color: var(--primary-color);
      font-weight: 600;
    }
    
    .option-btn.correct {
      background-color: #f0fdf4 !important;
      border-color: #16a34a !important;
      color: #1e3a8a !important;
    }
    
    .explanation-box {
      margin-top: 1rem;
      padding: 1rem;
      background-color: #f8fafc;
      border-left: 4px solid var(--primary);
      border-radius: 0.25rem;
      font-size: 0.95rem;
      color: #334155;
      line-height: 1.5;
    }
    .option-btn.wrong {
      background-color: #fef2f2 !important;
      border-color: #ef4444 !important;
      color: #991b1b !important;
    }

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #f1f5f9;
    }

    .stat-badge {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 500;
      background: #e2e8f0;
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
    }

    .source-tag {
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: right;
    }

    .category-box {
      margin-top: 2rem;
      padding: 1rem;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
    }
    .category-box label {
      display: block;
      margin-bottom: 0.8rem;
      cursor: pointer;
    }
    .category-box input[type="text"] {
      padding: 0.4rem;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      margin-left: 0.5rem;
      font-size: 0.95rem;
      width: 70%;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 1rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      margin-top: 1rem;
      font-family: monospace;
      font-size: 0.9rem;
      resize: vertical;
    }

    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mt-4 { margin-top: 1rem; }
    .mb-4 { margin-bottom: 1rem; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }

    .review-item { margin-bottom: 2rem; padding: 1.5rem; border-radius: 12px; background: #f8fafc; border-left: 6px solid #e2e8f0; text-align: left; }
    .review-item.incorrect { border-left-color: var(--error); }
    .review-question { font-weight: 600; margin-bottom: 1rem; color: var(--text-main); }
    .review-options { list-style: none; margin-bottom: 1rem; }
    .review-options li { padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 6px; background: #fff; border: 1px solid #e2e8f0; }
    .review-options li.is-correct { background: #ecfdf5; border-color: #a7f3d0; color: #065f46; font-weight: 500; }
    .review-options li.is-wrong { background: #fef2f2; border-color: #fecaca; color: #991b1b; }
    .badge { display: inline-block; padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-error { background: #fee2e2; color: #991b1b; }
    .badge-success { background: #dcfce7; color: #166534; }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }
    .badge-gray { background: #f1f5f9; color: #475569; }
    .badge-blue { background: #dbeafe; color: #1e40af; }

    .image-container {
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .image-container img {
      max-width: 100%;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .source-tag {
      font-size: 0.85rem;
      color: #64748b;
      margin-top: 1rem;
      text-align: right;
    }
    .cat-tag {
      display: inline-block;
      padding: 0.25rem 0.5rem;
      background: #e2e8f0;
      color: #475569;
      border-radius: 4px;
      font-size: 0.85rem;
      margin-top: 0.5rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

          <button id="submit-btn" class="hidden" style="background-color: var(--success);">提交並看結果</button>
          <button id="next-btn" class="hidden">下一題</button>

      </div>

      <h3 style="margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0;">錯題回顧</h3>
      <div id="review-container">
        <!-- Review items will be injected here -->
      </div>
    </div>
  </div>

  <script>
    const questions = [{"id":1114,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於小孩之CPR，最重要優先之處置是？","options":{"A":"快速建立IV","B":"儘快給予電擊","C":"維持呼吸道通暢與呼吸動力","D":"注射藥物Epinephrine"},"answer":"C","manualChapter":"CH13"},{"id":2009,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關生理變化與年齡相關性，以下敘述何者為非？","options":{"A":"為新生兒施作巴賓斯基反射（Babinski reflex），其腳趾會往上往外翻開。","B":"在青春期階段其臉與身體的比例會變得接近成人。","C":"在成人晚期時，白血球、紅血球與血小板皆會逐漸增加。","D":"終點遽降現象（terminal drop）是指在生命的最後幾年，認知能力下降的現象。"},"answer":"C","manualChapter":"CH13"},{"id":2011,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於嬰兒的描述，何者為非？","options":{"A":"肌肉的控制發展是先從頭才到腳、且先從核心才到身體的週邊。","B":"嬰兒的「被動免疫」持續至出生後約六個月。","C":"出生一個月的嬰兒，視線會追隨物體移動。","D":"覓食反射( Rooting reflex)指的是輕柔的觸碰嬰兒的臉頰或嘴唇附近，嬰兒的頭會轉向刺激的方向、嘴巴噘起。"},"answer":"C","matchedChapters":["CH13"],"manualChapter":"CH13"},{"id":2108,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"從兒童發展里程碑的角度推測，下列受傷機轉何者最不合理？","options":{"A":"八個月大男童自己走路跌倒。","B":"七個月大女童坐在高背椅上不慎前趴撞到頭。","C":"九個月大男童乳牙撞斷。","D":"學步期幼兒活動力強且注意力集中時間短，故容易發生跌倒和嗆到。"},"answer":"A","matchedChapters":["CH13"],"manualChapter":"CH13"},{"id":2199,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"根據六到十二歲學齡兒童發展的里程碑，我們會發現到這時期的兒童發展有不同的重點。關於這些重點，下列敘述，何者為非？","options":{"A":"體重的增加開始以肌肉為主而非脂肪；力量增加。","B":"孩子的道德邏輯推理能力建立。","C":"雙親通常陪伴孩子的時間增加。","D":"孩子逐漸理解死亡的概念。"},"answer":"C","matchedChapters":["CH13"],"manualChapter":"CH13"},{"id":2293,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"根據科爾伯格的道德發展理論(Kohlberg ’ s Stages of Moral Development)，對孩子品行道德發展的描述，下列何者為非？","options":{"A":"「你搔我的背，我就會搔你的」這種『互惠』的概念是屬於天真的行為。","B":"『好孩子心理』是屬於習俗水準的道德推理。","C":"『法律與秩序』的心理是屬於後習俗水準的道德推理。","D":"由經教養過的良知來決定什麼是對的，屬於後習俗水準的道德推理。"},"answer":"C","manualChapter":"CH13","matchedChapters":["CH13"]},{"id":2569,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"人生不同時期會面臨不同階段的心理變化，也會影響我們對於該傷病患應採取的照護模式；下列關於不同時期的傷病患照護的相關敘述，何者最為適當？","options":{"A":"在評估九個月大哭鬧不安的女嬰時，應暫時區隔父母與小孩讓幼童能平靜下來接受評估。","B":"當三歲大男童通報外傷時，適度觀察父母婚姻、經濟情況有助於評估兒虐風險之高低。","C":"十六歲少女主訴腹痛合併噁心，在病史詢問時建議邀請父母在側才能正確了解月經週期。","D":"七十歲女性院前心跳停止，現場建議與伴侶簡單解釋，安撫支持會導致伴侶更難走出傷痛。"},"answer":"B","manualChapter":"CH13","matchedChapters":["CH13"]},{"question":"嬰兒與幼兒都會用腹式呼吸，他們的橫膈膜需要完全的向下移動來幫助正常呼吸。這樣使用腹部肌肉來呼吸的方式會持續到幾歲才會逐漸轉變成胸式呼吸？","options":{"A":"5歲","B":"6歲","C":"7歲","D":"8歲"},"answer":"C","manualChapter":"CH13","id":3433,"source":"TP題庫 (圖片匯入)"},{"question":"學齡兒童 (6-12 歲) 的神經系統發育中，頭顱骨的發育約在何時已完成95%？","options":{"A":"12歲","B":"10歲","C":"青春期","D":"6歲"},"answer":"B","manualChapter":"CH13","id":3434,"source":"TP題庫 (圖片匯入)"},{"question":"在評估一歲以內的小嬰兒時，高級救護技術員通常會藉由觸診「前囟門(Anterior fontanelle)」來初步評估其體液狀態。請問前囟門通常會在出生後多久時間閉合？","options":{"A":"出生後 2~3 歲","B":"出生後 9~18 個月","C":"出生後 3 個月內","D":"出生後 7 歲左右"},"answer":"B","manualChapter":"CH13","id":3441,"source":"TP題庫 (圖片匯入)"},{"id":45550,"question":"填入空格：寶寶腦部與神經系統為了要給予腦部成長的空間，後囟門，即頭顱骨間未癒合之關節，直到____個月大前都會保持開啟，前囟門於出生後____個月都不會閉合","options":{"A":"3、9~18","B":"9~18、3","C":"6、9~18","D":"9~18、6"},"answer":"A","source":"","manualChapter":"CH13"},{"id":45552,"question":"學齡前兒童的何種組織在比例上會比成人偏大，且免疫系統正經歷許多變化?","options":{"A":"淋巴組織","B":"腦組織","C":"肺泡組織","D":"肌肉組織"},"answer":"A","source":"大白p314","manualChapter":"CH13"},{"id":45558,"question":"幾歲進入成人晚期?","options":{"A":"51","B":"61","C":"71","D":"81"},"answer":"B","source":"大白p319","manualChapter":"CH13"},{"id":45626,"question":"對於學齡兒童(6至12歲)的生、心理發展的里程碑，下列敘述何者錯誤？","options":{"A":"由於兩側大腦功能提升，其專注力與學習能力快速發展","B":"身體的比例變得接近成人，但淋巴組織比例會較成人大","C":"其行為的控制會因發展，逐漸由內轉為外在來源的約束","D":"會跟別人比較，建立自我觀念，並逐漸理解死亡的概念"},"answer":"C","source":"同學出題","manualChapter":"CH13"},{"id":45638,"question":"關於不同特殊族群與休克的臨床特徵，下列敘述何者錯誤?","options":{"A":"老年對交感神經刺激反應較差，因此失血造成的心跳加速或心收縮力增加不如年輕人顯著","B":"運動員即使面臨大量失血，仍可能不會表現出明顯的休克徵兆","C":"懷孕婦女對失血極為敏感，通常只需少量失血就會迅速出現休克徵兆","D":"長期服用βblocker之患者因藥物減慢心跳，失血時可能心跳代償反應不明顯"},"answer":"C","source":"同學出題","manualChapter":"CH13"}];
    let currentQuestionIndex = 0;
    let selectedAnswers = new Array(questions.length).fill(null);
    let isReviewMode = false;
    
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const reviewContainer = document.getElementById("review-container");
    
    document.getElementById("start-btn").addEventListener("click", startQuiz);
    prevBtn.addEventListener("click", () => navigate(-1));
    nextBtn.addEventListener("click", () => navigate(1));
    submitBtn.addEventListener("click", showResults);
    function startQuiz() {
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      
      // Shuffle questions
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = questions[i];
        questions[i] = questions[j];
        questions[j] = temp;
      }
      
      // Shuffle options
      questions.forEach(q => {
        if (q.options) {
          let keys = Object.keys(q.options);
          for (let i = keys.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = keys[i];
            keys[i] = keys[j];
            keys[j] = temp;
          }
          q.shuffledKeys = keys;
        }
      });
      
      loadQuestion(0);
    }
    
    function loadQuestion(index) {
      currentQuestionIndex = index;
      const q = questions[index];
      
      questionText.textContent = q.question;
      
      const imgContainer = document.getElementById("image-container");
      const imgEl = document.getElementById("question-image");
      if (q.image) {
        imgEl.src = q.image;
        imgContainer.classList.remove("hidden");
      } else {
        imgContainer.classList.add("hidden");
      }
      
      optionsContainer.innerHTML = "";
      if (q.options) {
        let keysToUse = q.shuffledKeys || Object.keys(q.options);
        const displayLetters = ["A", "B", "C", "D", "E", "F", "G", "H"];
        keysToUse.forEach((key, optIdx) => {
          const value = q.options[key];
          const btn = document.createElement("button");
          btn.className = "option-btn";
          const dLetter = displayLetters[optIdx] || key;
          
          let html = "<strong>" + dLetter + ".</strong> " + value;
          
          if (isReviewMode || selectedAnswers[index] !== null) {
             btn.disabled = true;
             if (key === q.answer) {
               btn.classList.add("correct");
               html += ' <span style="float:right;">✓ 正確答案</span>';
             } else if (selectedAnswers[index] === key) {
               btn.classList.add("wrong");
               html += ' <span style="float:right;">✗ 你的作答</span>';
             }
          } else {
             btn.addEventListener("click", () => selectOption(key));
          }
          

          btn.innerHTML = html;
          optionsContainer.appendChild(btn);
        });
        
        if ((isReviewMode || selectedAnswers[index] !== null) && q.explanation) {
          const expDiv = document.createElement("div");
          expDiv.className = "explanation-box";
          expDiv.innerHTML = "<strong>💡 解析：</strong><br>" + q.explanation.replace(/\n/g, "<br>");
          optionsContainer.appendChild(expDiv);
        }

      }
      
      document.getElementById("source-tag").textContent = "ID: " + q.id + " | 來源: " + (q.source || "無");
      
      updateNavButtons();
      updateProgress();
    }
    
    function selectOption(key) {
      if (isReviewMode || selectedAnswers[currentQuestionIndex] !== null) return;
      selectedAnswers[currentQuestionIndex] = key;
      loadQuestion(currentQuestionIndex);
    }
    
    function navigate(direction) {
      const newIndex = currentQuestionIndex + direction;
      if (newIndex >= 0 && newIndex < questions.length) {
        loadQuestion(newIndex);
      }
    }
    
    function updateNavButtons() {
      prevBtn.classList.toggle("hidden", currentQuestionIndex === 0);
      nextBtn.classList.toggle("hidden", currentQuestionIndex === questions.length - 1);
      
      // Always show submit button, rename to "結束測驗" if not already done in HTML
      submitBtn.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = "提早結束作答";
    }
    
    function updateProgress() {
      progressText.textContent = "問題 " + (currentQuestionIndex + 1) + " / " + questions.length;
    }
    
    function showResults() {
      isReviewMode = true;
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      
      const answeredCount = selectedAnswers.filter(a => a !== null).length;
      const correctCount = selectedAnswers.filter((a, i) => a === questions[i].answer).length;
      const wrongCount = answeredCount - correctCount;
      const unansweredCount = questions.length - answeredCount;
      const percentage = Math.round((correctCount / questions.length) * 100);
      
      document.getElementById("final-stats").innerHTML = "答對 <span style='color: var(--success); font-weight: bold;'>" + correctCount + "</span> 題 / 答錯 <span style='color: var(--error); font-weight: bold;'>" + wrongCount + "</span> 題";
      
      reviewContainer.innerHTML = "";
      questions.forEach((q, i) => {
        if (selectedAnswers[i] !== null && selectedAnswers[i] !== q.answer) {
          const div = document.createElement("div");
          div.className = "review-item incorrect";
          
          let optionsHtml = '<ul class="review-options">';
          if (q.options) {
             let keysToUse = q.shuffledKeys || Object.keys(q.options);
             const displayLetters = ["A", "B", "C", "D", "E", "F", "G", "H"];
             keysToUse.forEach((k, optIdx) => {
                let v = q.options[k];
                let dLetter = displayLetters[optIdx] || k;
                let liClass = "";
                let label = "";
                if (k === q.answer) {
                   liClass = "is-correct";
                   label = " (正確答案)";
                } else if (k === selectedAnswers[i]) {
                   liClass = "is-wrong";
                   label = " (你的作答)";
                }
                optionsHtml += '<li class="' + liClass + '">' + dLetter + '. ' + v + label + '</li>';
             });
          }
          optionsHtml += "</ul>";
          
          
          let reviewExpHtml = '';
          if (q.explanation) {
            reviewExpHtml = '<div class="explanation-box"><strong>💡 解析：</strong><br>' + q.explanation.replace(/\n/g, "<br>") + '</div>';
          }
          
          div.innerHTML = '<div class="review-question">' + (i + 1) + '. ' + q.question + '</div>' +
            optionsHtml + reviewExpHtml +
            '<div class="source-tag">ID: ' + q.id + ' | 來源: ' + (q.source || '無') + '</div>';

          reviewContainer.appendChild(div);
        }
      });
      if (reviewContainer.innerHTML === "") {
        reviewContainer.innerHTML = '<p class="text-center">太棒了！您全答對了！</p>';
      }
    }
    
    
  </script>
</body>
</html>
