故移動前應以夾板施行長腿固定（long leg splint）","B":"傷患可能有左側股骨骨折，固定後應抬高患肢以避免肢體腫脹","C":"左側股骨骨折並不足以解釋目前的生命徵象，因此需積極尋找其他可能的創傷","D":"傷患因有高能量之創傷機轉，最好直接後送至最近且最高級的急救責任醫院"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":740,"source":"第五章 創傷急症(2012-2014).doc","question":"在房屋倒塌的現場，一35歲男性雙下肢被壓迫已超過12個鐘頭，現傷患即將脫困。請問下列敘述何者正確？","options":{"A":"為防止休克，在脫困前應給予大量乳酸林格氏液靜脈輸注","B":"傷患兩下肢長時間缺血，使用止血帶會加重下肢缺血狀況，因此禁止使用","C":"血液中的鈣離子透過被破壞的細胞膜流進細胞內，造成全身性的低血鈣","D":"產生腔室症候群的原因是下肢肢體受壓迫導致腔室空間變小、壓力變大所致"},"answer":"C","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":741,"source":"第五章 創傷急症(2012-2014).doc","question":"在一工廠火災的事故中，一位30歲男性傷患體重80kg，全身體表面積中20％為一度灼傷、50％為二度灼傷、10％為三度灼傷，現傷患已被救出且距受傷約已30分鐘，距後送醫院約30分鐘之車程。若你已為傷患建立大管徑的靜脈管路，且傷患無其他出血則依照Parkland formula，你在到院前大約該給多少的靜脈輸液？","options":{"A":"600毫升／小時","B":"800毫升／小時","C":"1,200毫升／小時","D":"1,600毫升／小時"},"answer":"C","manualChapter":"CH31"},{"id":742,"source":"第五章 創傷急症(2012-2014).doc","question":"創傷導致大量出血若未及時處置即可能發生「創傷致命三合症（Lethal Triad of Trauma）」，最後導致多重器官衰竭造成死亡。下列何者不屬於「創傷致命三合症」？","options":{"A":"凝血病變（coagulopathy）","B":"低血氧（hypoxia）","C":"低體溫（hypothermia）","D":"酸血症（acidosis）"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":743,"source":"第五章 創傷急症(2012-2014).doc","question":"有關創傷死亡三個高峰（Trimodal Distribution of Trauma Death）的敘述，下列何者錯誤？","options":{"A":"為Trunkey於1983年所發表，其中以受傷後1小時內死亡所佔的比率最高，約50％","B":"提升EMT-P對創傷急救的能力可以有效減少受傷後1小時內死亡的人數與比率","C":"早期死亡指受傷後1～4小時內死亡，主要原因為嚴重內臟損傷導致出血性休克","D":"晚期死亡指受傷1～4週後死亡，主要原因為感染導致敗血症及多重器官衰竭"},"answer":"B","manualChapter":"CH25"},{"id":744,"source":"第五章 創傷急症(2012-2014).doc","question":"你出勤到現場救護一名從天橋墜落、患有憂鬱症之19歲女性傷患時，發現傷患仰躺在馬路上，眼睛張開，一直在呻吟。此時你呼喊傷患，傷患眼睛仍一直張開並持續呻吟，對你的呼喊毫無回應。當你以疼痛刺激其胸骨時，傷患眼睛仍然張開、仍一直呻吟且手會動，但無法越過傷患身體中線及其肩膀。請問下列有關傷患GCS（Glasgow coma scale）評分，何者正確？","options":{"A":"E2M4V2","B":"E2M5V2","C":"E4M4V2","D":"E4M5V2"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":745,"source":"第五章 創傷急症(2012-2014).doc","question":"有關脊椎損傷的敘述，下列敘述何者為是？","options":{"A":"所謂神經性休克（neurogenic shock）係指脊髓受傷導致副交感神經失去對血管的控制，引起全身性的血管擴張","B":"脊髓性休克（spinal shock）指脊髓損傷後，脊髓的所有功能，表現如同完全脊髓損傷，但通常可在24小時內恢復脊髓的所有功能","C":"若頸椎受傷導致前脊髓症候群（anterior cord syndrome）時，會有四肢輕癱現象，且上肢較下肢嚴重。但痛覺及溫度感覺仍保留","D":"交感神經過度反射症候群（autonomic hyperreflexia syndrome）常見於胸椎下段脊髓（第6胸椎以下）損傷，與交感神經興奮、腎上腺素大量釋放有關"},"answer":"B","manualChapter":"CH27"},{"id":746,"source":"第五章 創傷急症(2012-2014).doc","question":"一50歲男性機車騎十與遊覽車發生碰撞事故後倒地。EMT到達現場後發現醒躺在遊覽重後輪旁。傷患主訴大腿疼痛無法行動，初步評估顯示傷患意識清醒、呼吸正常、脈每分120次、血壓100／60 mmHg、暴露身體顯示左大腿瘀青腫脹、靠近鼠蹊部有一約20公分寬之輪胎痕，其餘檢查並無明顯異常。請問下列敘述何者最正確？1.由創傷機轉來評估，應立刻送至創傷中心2.由解剖傷勢來評估，應可送至創傷中心3.由生命徵象來評估，應立刻送至創傷中心4.傷患可能有左側股骨骨折，固定後應抬高患肢以避免肢體腫脹","options":{"A":"1＋2","B":"2＋4","C":"1＋2＋4","D":"1＋2＋3＋4"},"answer":"A","manualChapter":"創傷"},{"id":747,"source":"第五章 創傷急症(2012-2014).doc","question":"下列狀況應考慮有高能量機轉，即使傷患現場生命徵象穩定，亦應視為嚴重多重創傷將其送往最近且最高層級的創傷急救責任醫院？甲：身體被車輛輾過。乙：機車或汽車碰撞事故中傷患被彈出車外，且距車體超過一公尺。丙：死亡車禍之同車倖存者（包括死者）。丁：由二樓以上（高6公尺以上）墜落。請問下列組合何者為是？","options":{"A":"只有甲","B":"只有甲、乙","C":"只有甲、乙、丙","D":"甲、乙、丙、丁都是"},"answer":"D","manualChapter":"CH25"},{"id":748,"source":"第五章 創傷急症(2012-2014).doc","question":"在到院前創傷性休克傷患給予靜脈輸液方面，以下何者是目前較被接受的原則？","options":{"A":"休克傷患且預計現場時間或後送時間超過10分鐘者，應給予靜脈輸液治療","B":"若須給予靜脈輸液，應以建立小管徑的靜脈管路為佳","C":"靜脈管路建立的部位，應盡量在骨折部位","D":"若要給予靜脈輸液，建議給予溫的生理食鹽水或林格氏液"},"answer":"D","manualChapter":"CH26"},{"id":750,"source":"第五章 創傷急症(2012-2014).doc","question":"下圖該患者姿勢是？該患者姿勢是？","options":{"A":"去大腦皮質姿勢","B":"去大腦姿勢","C":"去小腦姿勢","D":"去延腦姿勢"},"answer":"B","manualChapter":"CH27","image":"題庫圖片/750.png"},{"id":751,"source":"第五章 創傷急症(2012-2014).doc","question":"題目：下圖表示？該圖表示？","options":{"A":"氣胸","B":"連枷胸","C":"血胸","D":"氣管斷裂"},"answer":"A","manualChapter":"CH28","matchedChapters":["需要圖片"],"image":"題庫圖片/751.png"},{"id":752,"source":"第五章 創傷急症(2012-2014).doc","question":"下列有關創傷急救概念的敘述，何者為非？","options":{"A":"因創傷導致死亡的傷患，約有50％左右於受傷後一小時內死亡","B":"急救的重點在幫助「可避免的死亡」不致發生","C":"評估的重點在注意「診斷上的錯誤」，因為診斷只有一個","D":"初步評估的目的是讓傷患的生命徵象穩定，再度評估的目的則是整體而詳細的評估傷患"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":753,"source":"第五章 創傷急症(2012-2014).doc","question":"有關於胸部鈍傷方面，下列敘述何者為非？","options":{"A":"合併第一、二肋骨骨折時須高度懷疑主動脈的損傷","B":"張力性氣胸的病患不一定出現頸靜脈怒張","C":"合併第十到十二肋骨骨折須懷疑肝臟或脾臟的損傷","D":"目前在台灣，若EMT在院外發現懷疑張力性氣胸的傷患，可直接進行針刺減壓"},"answer":"D","manualChapter":"CH28"},{"id":754,"source":"第五章 創傷急症(2012-2014).doc","question":"陽明山發生小客車翻落山谷意外，救難人員到達現場後花了1個小時，才將某一傷患自變形的車體內救出，傷者意識模糊，臉色蒼白，四肢冰冷，脈搏微弱，雙下肢小腿處明顯變形。下列有關現場緊急救護人員之處置，何者最優先？","options":{"A":"因傷患傷勢嚴重，且困於現場時間太久，為爭取治療時效，立即送上救護車，前往距離現場最近的任何一家醫院","B":"為避免傷者於運送過程中因大量失血休克而死，必須立即給予大量點滴輸液，等到血壓穩定後，才能送往醫院","C":"立即將傷者的衣物移除，從頭檢查到腳，更不可遺忘背部，找出出血處，先進行初步止血，以免傷勢加重","D":"在為傷者戴上頸圈時若發現氣管偏右移，頸靜脈怒張，且左側呼吸音微弱，應考慮有左側張力性氣胸之可能，要先處理"},"answer":"D","manualChapter":"CH25"},{"id":755,"source":"第五章 創傷急症(2012-2014).doc","question":"建築工地灌漿時發生樓層坍塌，一名50歲男性工人受困其中，雙下肢被鋼樑壓住，救難人員花了6小時才將他救出，雙下肢外觀明顯腫脹且痛，腳趾蒼白無感覺，小便顏色為深褐色，下列敘述，何者為是？","options":{"A":"抽血檢驗可能會發現高血鉀、肌肉酵素升高、高血鈣","B":"為防止急性腎衰竭出現，必須要給予大量晶質輸液並酸化尿液","C":"若發生致命性心律不整，選擇急救藥物時，需要將葡萄糖酸鈣列入考慮","D":"筋膜切開術會造成更進一步的傷害，不可進行"},"answer":"C","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":756,"source":"第五章 創傷急症(2012-2014).doc","question":"一位25歲約60公斤的男性自火災現場被救出，意識模糊，聲音沙啞，全身多處灼傷，前額頭髮、眉毛及鼻毛均已燒焦，血壓100／65 mmHg，心跳120／min，血氧濃度85％，身體燒燙傷面積為1度10％，2度30％，3度20％，請問下列處置，何者不適當？","options":{"A":"給予一般型氧氣面罩，維持血氧濃度在94％以上即可","B":"問清楚火災現場環境，因為燒傷除了吸入性傷害及一氧化碳中毒外，仍要小心其他化學物質的傷害","C":"檢查身體是否有合併其他傷害","D":"按照Parkland formula，前8小時的輸液量要給予6,000ml的乳酸林格氏液（lactated Ringer's）"},"answer":"A","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":758,"source":"第五章 創傷急症(2012-2014).doc","question":"50歲男性小客車駕駛，因酒醉駕車高速撞上前方停紅燈車輛，EMT表示該駕駛身上繫有安全帶，且安全氣囊己爆開；到院時身上無明顯外傷，全身酒味，意識混亂，呼吸正常，血壓110／80 mmHg，心跳120／min，血氧濃度98％，請問下列敘述，何者為是？","options":{"A":"因繫有安全帶，且無頭部外傷，故可排除頸椎傷害","B":"超音波未見腹腔內出血，即可排除小腸出血的可能","C":"為了排除胰臟受傷，可以利用超音波有效判斷","D":"因受酒精影響，傷者腹部觸診無壓痛時，仍不能排除腹腔臟器受傷的可能"},"answer":"D","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":759,"source":"第五章 創傷急症(2012-2014).doc","question":"關於顱颜部創傷，下列敘述何者不適當？","options":{"A":"臉部中央骨骨折的傷患，其臉部浮腫，可能會有不穩定的上頷骨，因此呼吸道處置時，應盡快置入鼻咽呼吸道，以防臉骨塌陷，血水堵住呼吸道","B":"外耳道或鼻孔流出之血水，要用無菌紗布或棉花暫時給予填塞止血，再照會耳鼻喉科醫師評估","C":"急性硬腦膜上血腫（epidural hematoma）可能會出現清明期（lucid interval），通常是顳骨骨折，中硬腦膜動脈（middle meningeal artery）破裂造成","D":"巴氏徵候（Battle's sign）出現，要懷疑有岩樣骨折"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":760,"source":"第五章 創傷急症(2012-2014).doc","question":"一位從火場被救出的病患，外觀呈現臉部一度燒傷，鼻毛燒焦，目前意識清楚，血壓130／80，脈搏110，呼吸30，胸部有喘鳴聲，要建立其呼吸道時，下列何者為是？","options":{"A":"氣管內插管並給予高濃度氧氣","B":"有儲留袋之面罩給氧10～12 L／min","C":"傷患應有呼吸道灼傷，應使用LMA（喉罩呼吸道）以建立呼吸道","D":"若傷患應有有呼吸道灼傷，可使用口咽、鼻咽以建立呼吸道"},"answer":"A","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":761,"source":"第五章 創傷急症(2012-2014).doc","question":"20歲女性，燒炭自殺不慎引起火警。EMT從火場移出後傷患意識不清、對聲音有反應，無鼻毛燒焦、全身無燒燙傷痕跡、無明顯外傷。血壓120／70，脈搏100，呼吸20，呼吸平順無雜音。下列處置何者為是？","options":{"A":"立即建立呼吸道，包括口咽、鼻咽甚至於LMA","B":"可給予非再吸入型氧氣面罩並調整流速至15公升／分，以提供高濃度氧氣","C":"立即以鼻翼管給予氧氣治療以提高血氧濃度","D":"應以血氧監視器評估。若無缺氧現象，可以不用氧氣治療"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":763,"source":"第五章 創傷急症(2012-2014).doc","question":"有關失血量與生理變化的評估，下列何者為非？","options":{"A":"失血量超過50％者，將失去脈搏","B":"失血量30～40％者，意識混亂","C":"失血量高達30％者，血壓可能仍為正常","D":"失血量15～30％者，心率不變"},"answer":"D","manualChapter":"CH26"},{"id":764,"source":"第五章 創傷急症(2012-2014).doc","question":"有一車禍救護案件，摩托車撞倒的路人，主訴腹痛、頭暈、嘔心感，血壓80／50 mmHg，脈搏130／min，皮膚濕冷，臉色蒼白。最有可能是那一種休克？","options":{"A":"出血性休克","B":"神經性休克","C":"阻塞性休克","D":"敗血性休克"},"answer":"A","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":765,"source":"第五章 創傷急症(2012-2014).doc","question":"在創傷性休克傷患給予靜脈輸液時，下列何者為是？","options":{"A":"休克傷患一律給與靜脈輸液治療","B":"EMT-P應優先使用膠質輸液（colloids）而非晶質輸液（crystalloids）","C":"若須給予靜脈輸液，應以建立大管徑的靜脈管路為佳","D":"靜脈輸液的流速和留置導管的長度呈正比"},"answer":"C","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":766,"source":"第五章 創傷急症(2012-2014).doc","question":"關於創傷性休克的敘述，下列何者為非？","options":{"A":"創傷病患出現休克，最常見的是出血性休克","B":"可以用血液中的乳酸值，來評估休克的嚴重程度","C":"因低血容休克造成的代謝性酸中毒，施打sodium bicarbonate（碳酸氫鈉）就可以","D":"給予輸液復甦後，仍需評估患者對輸液復甦的反應，因為這可能會影響到接下來的方向，諸如是否手術等"},"answer":"C","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":767,"source":"第五章 創傷急症(2012-2014).doc","question":"你接獲通知有汽車撞擊護欄，到達現場發現一26歲男性為汽車駕駛，未繫安全帶，意識混亂，但可模糊說出自己姓名，呼吸速率28下／分，心跳126下／分，BP96／70 mmHg，下列敘述何者為非？","options":{"A":"傷患有休克狀況，應該要尋找可能出血的地方，如胸腔、腹腔、長骨骨折等","B":"考量可能出現頭部外傷，給予輸液應該小心，所以流速不可太快","C":"若是出血性休克，此狀況符合第三級休克（Class Ⅲ），預估出血量達30％以上","D":"應該要送至創傷中心，因為除了給予輸液復甦外，需要輸血甚至手術的機會很高"},"answer":"B","manualChapter":"CH25"},{"id":768,"source":"第五章 創傷急症(2012-2014).doc","question":"在處理頭部外傷的傷患，初步評估最重要的步驟是？","options":{"A":"維持呼吸道暢通","B":"戴上頸圈","C":"控制頭皮出血","D":"決定傷患現在GCS的分數"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":769,"source":"第五章 創傷急症(2012-2014).doc","question":"通報有一打架事件，當EMT抵達現場後，現場只有一名年輕男性，頭臉部有被毆打的傷囗，你發現他意識昏迷，觸診發現有頭骨凹陷性骨折，臉部瘀腫，呼吸有鼾音，且臉上和衣服上都有嘔吐物，在給予氧氣及以推下顎法打開呼吸道後，最適當的下一步是？","options":{"A":"以袋瓣罩給傷患通氣","B":"囗咽部抽吸","C":"予以頸圈固定","D":"快速檢查有無其他大出血"},"answer":"B","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":770,"source":"第五章 創傷急症(2012-2014).doc","question":"孕婦在捷運站被人刺傷，你被通知前往現場，發現他懷孕32周，右胸上方有一穿刺傷囗，無氣血泡在其上，但是她呼吸急促，極度焦慮，而且呼喊「救命」，血壓80／60 mmHg，右胸呼吸音聽起來有減弱，最適當的第一步驟是？","options":{"A":"聯絡線上醫療指導，考慮經囗插管","B":"聯絡線上醫療指導，考慮右胸針刺減壓","C":"考慮將子宮左推","D":"考慮打兩條大口徑I.V.，開始給予輸液復甦"},"answer":"B","manualChapter":"CH49"},{"id":771,"source":"第五章 創傷急症(2012-2014).doc","question":"一名57歲男性，從火場救出，意識清楚但躁動，臉上和前胸有大片灼傷，頭髮眉毛均燒焦，關於此病人敘述，下列何者為非？","options":{"A":"若咳出黑色痰液，出現stridor，需要先建立呼吸道","B":"需先終止繼續灼傷，包括沖水降溫","C":"快速評估灼傷面積，以Parkland formula計算輸液量，前八個小時要全部給予","D":"若上肢出現開放性骨折，也需要沖洗傷囗，以護木固定患肢"},"answer":"C","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":773,"source":"第五章 創傷急症(2012-2014).doc","question":"70歲男性，機車騎士車禍，左小腿上段變形，下列關於EMT的現場處置，何者為非？","options":{"A":"變形部分需要固定，固定前須先檢查脈搏、感覺、運動功能","B":"足部的搏動點，可以檢查足背動脈，也可以檢查脛後動脈（posterior tibial artery），脛後動脈在腳踝處是走在外踝（lateral malleolus）後方","C":"若腫脹非常厲害，除了考慮出血量多以外，也要注意是否出現腔室症候群","D":"患者頸部肌肉有疼痛，但無神經學症狀，依據加拿大頸椎守則，還是需要給予頸圈固定"},"answer":"B","manualChapter":"創傷"},{"id":774,"source":"第五章 創傷急症(2012-2014).doc","question":"勤務中心通知有一瓦斯行氣爆，當你抵達現場，救災人員將一名50歲男性（體重75 Kg）抬出，他意識混亂，但臉上有灼傷，鼻毛眉毛燒焦，呼吸急促，全身共有20％二度到三度灼傷，下列敘述何者為非？","options":{"A":"若是意識混亂，除了懷疑有頭部外傷外，也要注意是否因低血氧或休克造成","B":"若是血氧低下，除了呼吸道可能阻塞外，也有可能出現氣胸情形，或是因外傷造成氣血胸","C":"若是血壓太低，可能是身上灼傷造成體液流失，應該給予生理食鹽水點滴，流速約375 cc／hr","D":"意識混亂也可能是一氧化碳中毒造成，所以應給予高濃度氧氣"},"answer":"C","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":776,"source":"第五章 創傷急症(2012-2014).doc","question":"根據ATLS第9版，目前對於休克病患的急救概念，以下「何者為非」？","options":{"A":"Controlled resuscitation（控制性的輸液急救治療）","B":"Balanced resuscitation（平衡性的輸液急救治療）","C":"Hypotension resuscitation（維持可接受性的低血壓）","D":"Aggressive resuscitation（積極性的輸液急救治療）"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":777,"source":"第五章 創傷急症(2012-2014).doc","question":"關於改良式創傷指數（RTS）評估內容，以下「何者為非」？","options":{"A":"GCS昏迷指數","B":"MAP平均動脈壓","C":"R·R·呼吸速率","D":"只要傷患在到院前RTS沒有滿分（＜12），救護技術員即應視之為嚴重創傷"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":778,"source":"第五章 創傷急症(2012-2014).doc","question":"關於確切呼吸道，以下「何者為非」？","options":{"A":"插置氣管內管（endotrachealtube）","B":"環甲狀軟骨膜切開術（cricothyroidotomy）","C":"喉罩呼吸道（LMA）","D":"氣切管（tracheostomy）"},"answer":"C","manualChapter":"CH27"},{"id":779,"source":"第五章 創傷急症(2012-2014).doc","question":"關於GCS（昏迷指數）的評估敘述，以下「何者為非」？","options":{"A":"去皮質姿勢（decorticate posturing）：患者呈現現上肢彎屈、下肢僵直伸展，表示大腦皮質的損傷","B":"去大腦姿勢（decerebrate posturing）：昏迷傷患呈現上、下肢均呈僵直伸展，表示腦幹的損傷","C":"若病患因腦中風導致左側肢體偏癱無力，右側肢體仍可以依照命令活動，則此病患GCS評估時，M應該為滿分","D":"若病患與以疼痛刺激時，眼睛才會睜開，並且手可以準確撥開疼痛刺激的位置，口中僅能發出無意義的聲音，則此病患的GCS為9分"},"answer":"A","manualChapter":"CH36"},{"id":780,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於一氧化碳的敘述，下列「何者為非」？","options":{"A":"一氧化碳是一種無色、無味的氣體，多發生在有機物質的不完全燃燒。它和血液中的血紅素的親和力是氧氣的250倍","B":"一氧化碳中毒病患皮膚大多會呈現櫻桃紅顏色","C":"一氧化碳血紅素的半衰期，在一大氣壓100％氧氣，半衰期為40～60分鐘","D":"一氧化碳血紅素的半衰期，在一般室內氣體，半衰期為4～5小時"},"answer":"B","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":784,"source":"第五章 創傷急症(2012-2014).doc","question":"皮膚遭灼傷的局部反應有三區變化：甲、充血區；乙、靜滯區；丙：凝固區。請問以灼傷點為圓心，由內向外依序是：","options":{"A":"乙→丙→甲","B":"丙→乙→甲","C":"甲→乙→丙","D":"乙→甲→丙"},"answer":"B","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":785,"source":"第五章 創傷急症(2012-2014).doc","question":"火場搶救出中年男性約60公斤，傷勢：「前胸及腹部為二度及三度燒傷，雙腿全部為三度燒傷，雙手臂為一度燙傷」。依巴克蘭公式（Parkland formula），在燒傷後的第一個8小時中應給林格氏液的量大約為？","options":{"A":"6,500cc","B":"8,500cc","C":"2,000cc","D":"15,000cc"},"answer":"A","manualChapter":"CH31"},{"id":786,"source":"第五章 創傷急症(2012-2014).doc","question":"一位45歲病患因頭部外傷需要急救，病患數小時前意識尚清楚，數小時後突然越來越模楜且瞳孔一邊放大對光無光反應。請問控制瞳孔光反應之傳導路徑為何？","options":{"A":"CN Ⅱ進CN Ⅲ出","B":"CN Ⅲ進CN Ⅱ出","C":"CN Ⅱ進CN Ⅱ出","D":"CN Ⅲ進CN Ⅲ出"},"answer":"A","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":787,"source":"第五章 創傷急症(2012-2014).doc","question":"如下圖的傷口，應該被描述成？","options":{"A":"挫傷","B":"穿剌傷","C":"剝離傷","D":"撕裂傷"},"answer":"D","manualChapter":"CH30","matchedChapters":["NeedImage"],"image":"題庫圖片/787.png"},{"id":788,"source":"第五章 創傷急症(2012-2014).doc","question":"35歲男性自約6米高處墜樓後送醫，到院時意識清楚，但血壓低合併休克症狀，同時患者失去對大腸及膀胱的感覺，且合併陰莖持續勃起，此時你認為其休克的原因最可能為？","options":{"A":"心因性休克（cardiogenic shock）","B":"神經性休克（neurogenic shock）","C":"脊隨性休克（spinal shock）","D":"低血容性休克（hypovolemic shock）"},"answer":"B","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":789,"source":"第五章 創傷急症(2012-2014).doc","question":"如下圖的傷囗，應該被描述成？","options":{"A":"挫傷","B":"撕裂傷","C":"剝離傷","D":"穿剌傷"},"answer":"C","manualChapter":"CH30","image":"題庫圖片/789.png"},{"id":790,"source":"第五章 創傷急症(2012-2014).doc","question":"某夏日下午，你正與朋友約在高爾夫球場咖啡廳聊天，聊的正開心的時候外面突然下起大雷雨且雷電交加，此時聽到球場工作人員大叫：「有一組球友被雷擊了！」；身為高級救護技術員的你，此時當然放下手中的飲料飛奔至現場幫忙。映入眼簾的是有三名病患倒在地上，另有一名病患在旁邊呆站著喃喃自語，請問下列敘述何者為非？","options":{"A":"在做現場評估救護以前，應先確認環境安全，考慮請人幫忙將倒地三人移至安全處，以免再遭雷擊","B":"甲病患倒在地上但意識清楚，看起來非常緊張且不斷請求你幫忙，說著他全身好麻無起身，除呼吸每分鐘32下外，生命徵象看來穩定，全身無明顯外傷，橈動脈摸的到，此病患應判成綠色。","C":"乙病患有意識，外觀除右下肢嚴重變形外看起來均正常，橈動脈摸的到且可以遵從你的指令做動作，此病患應判為黃色。","D":"丙病患無意識無呼吸，打開呼吸道兩次仍然沒有自發性呼吸，此病患應判為黑色傷患但需優先救治。"},"answer":"B","manualChapter":"CH52"},{"id":864,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"年輕孕婦懷孕3週突然感到嚴重呼吸困難而打119求救，你到現場發現她有發紺、胸痛及休克現象，似乎快要窒息。此時急救的處置何者不正確？","options":{"A":"若量到她血壓偏低，建議以休克病患之頭低腳高方式運送","B":"可能的診斷為肺栓塞或是羊水栓塞","C":"為增加母親心輸出量，應該要左側躺或進行子宮左推手勢","D":"若母親心跳停止，應該在心跳停止後四到五分鐘內緊急剖腹產產出胎兒"},"answer":"A","manualChapter":"CH49"},{"id":865,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於子宮外孕（ectopic pregnancy），以下何者不正確？","options":{"A":"最常發生在受精後胚胎發育於輸卵管中","B":"可能會因腹腔內出血而有突發性腹痛、頭暈、昏倒或休克","C":"通常發生在懷孕第6到12週","D":"子宮外孕一定會有陰道出血"},"answer":"D","manualChapter":"CH49"},{"id":866,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於子癇前症及子癇症（eclampsia／pre-eclampsia），以下何者不正確？","options":{"A":"子癇前症亦稱妊娠毒血症，發生原因不明，通常發生於第一胎，最常發生在懷孕第二期","B":"病人在懷孕時會出現高血壓、水腫及尿蛋白三種症狀","C":"高血壓之定義為收縮壓≧140毫米汞柱或舒張壓≧90毫米汞柱","D":"子癇症則是子癇前症同時發生癲癇的情況。抽筋多為大發作，必須給予氧氣及硫酸鎂治療"},"answer":"A","manualChapter":"CH49"},{"id":867,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於產後大出血，以下何者不正確？","options":{"A":"產後大出血定義為產後出血大於500 cc","B":"產後子宮無法適當收縮（uterine atony）是出血最常見原因","C":"若為會陰部嚴重撕裂傷應避免會陰部檢查，但若合併大量出血應直接加壓止血","D":"可讓胎兒吸吮母親乳頭，使子宮分泌子宮收縮素"},"answer":"D","manualChapter":"combine"},{"id":868,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於孕婦重大外傷，以下何者不正確？","options":{"A":"除穿刺傷及嚴重腹部頓傷外，胎兒鮮少因外傷造成死亡","B":"母體可能耐受大量失血而無休克之症狀時，胎兒卻有可能因缺氧而面臨死亡","C":"孕婦懷孕過程中增加血量，所以約15％之出血量就會產生血壓低休克之症狀","D":"需將創傷之孕婦左側躺，並轉送至外傷中心或醫學中心"},"answer":"C","manualChapter":"CH49"},{"id":869,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"年輕孕懷孕40週突然感覺意識不清，119到現場發現她沒有脈搏，AED顯示為心室纖維震顫。此時急救的處置與一般ACLS略有不同，正確的作法是？","options":{"A":"Amiodarone在孕婦屬於C級用藥會導致畸，禁止使用於孕婦","B":"若有需要插管，應該選用口徑較大的氣管內管（例如7.5#或8#）","C":"依照AHA最新指導原則，應該要左側躺比子宮左推手是適合孕婦","D":"為了胎兒預後，若母親心跳停止，應該在心跳停止五分鐘內產生胎兒"},"answer":"D","manualChapter":"CH49"},{"id":870,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"年輕孕婦懷孕40週，急產產出一足月胎兒。剛出生時新生兒抽吸口鼻不會哭泣臉部也無表情，呼吸不規則，且每分鐘約20下。脈搏微弱且約每分鐘80下，刺激時手腳僅有一些無力的收縮。外觀發現四肢發紺，身體比較紅潤。請問其第一分鐘的APGAR分數是？","options":{"A":"3分","B":"4分","C":"5分","D":"6分"},"answer":"B","manualChapter":"CH49"},{"id":871,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於急產後新生兒之處置，以下何者為非？","options":{"A":"新生兒出生後必須執行擦乾－擺位－抽吸－刺激四項處置","B":"新生兒呼吸約每分鐘40～60下，若有呼吸衰竭，應盡早給予正壓給氧","C":"檢查臍動脈脈搏，若是小於每分鐘100下即需正壓給氧，小於每分鐘60下即需CPR","D":"可以搓揉新生兒背部來刺激呼吸，危急時可以倒吊新生兒並擊打臀部的方式來刺激呼吸"},"answer":"D","matchedChapters":["CH48"],"manualChapter":"CH48"},{"id":872,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關小兒與大人之呼吸道在結構上之差異何者不正確？","options":{"A":"舌頭相對於囗腔之比例較大","B":"咽喉呈漏斗狀","C":"最窄的部位在聲帶","D":"為防止昏迷平躺的小朋友呼吸道受到壓迫，可將肩部墊高預防"},"answer":"C","manualChapter":"CH48"},{"id":873,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一病人因為使用過多的海洛因造成中毒，下列敘述何者錯誤？","options":{"A":"常用解藥為naloxone","B":"具有呼吸抑制的作用","C":"可造成意識昏迷","D":"瞳孔放大"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":875,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"溺水病人之處置，何者為非？","options":{"A":"需考慮頸椎受傷之可能","B":"水中救援時，盡量將病患保持垂直姿勢","C":"病患可能因喉部痙攣導致呼吸停止，水並未吸入肺部","D":"溺水病人常合併低體溫，故不能輕易放棄CPR"},"answer":"B","manualChapter":"CH44"},{"id":876,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"兒童心室頻脈/心室顫動VTⅣF之去顫術的起始計量為","options":{"A":"10焦耳/kg","B":"5焦耳/kg","C":"2焦耳/kg","D":"1焦耳/kg"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":877,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位新生兒出生時，您已經給予乾燥、保暖、適當之姿勢、抽吸及給予刺激，但此新生兒仍發紺、心搏過慢、呼吸困難，您下一步要做的是？","options":{"A":"以抽吸管抽吸囗鼻","B":"強力刺激新生兒的背部或足底","C":"使用簡單型面罩給予氧氣","D":"使用BVM給予100％氧氣正壓通氧"},"answer":"D","manualChapter":"CH48"},{"id":878,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一3歲15 kg男童突然失去意識，沒有反應、無呼吸及脈搏。醫護人員立即給予胸部按壓及bag-mask換氣呼吸。Monitor呈現如下：下列何者為最適當之後續治療？","options":{"A":"I.V.注射amiodarone 5 mg/kg","B":"I.V.注射epinephrine 0.01 mg/kg","C":"I.V.注射lidocaine 1 mg/kg","D":"電擊去顫30J後立即繼續胸部按壓"},"answer":"D","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/878.png"},{"id":879,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一男童無反應且無自發性呼吸，你給予通暢呼吸道、100％氧氣及bag-mask換氣呼吸後，你不確定他是否有脈搏，EKG monitor呈現下面波形：下列何者為最適當之後續治療？","options":{"A":"立即開始高品質胸部按壓及換氣呼吸","B":"準備經皮心臟節律器（transcutaneous pacing）","C":"建立IV途徑後，I.V.注射atropine 0.02 mg/kg","D":"建立IV途徑後，I.V.注射epinephrine 0.01 mg/kg（0.1 ml/kg Of 1:10,000）"},"answer":"A","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/879.png"},{"id":880,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於新生兒急救，如果發現呼吸暫停或心跳低於幾下，須施行正壓呼吸（bag-mask ventilation）？","options":{"A":"0／min","B":"＜60／min","C":"＜100／min","D":"＜120／min"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":881,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位38歲女士，懷孕第一胎32週，在家裡看電視時突然有尖銳的下腹痛，EMT到達現場時已無反應，無呼吸，無脈搏，下列急救步驟何者有誤？","options":{"A":"儘早插管、氣管內管size和一般成人一樣","B":"將孕婦左側躺約15～30度","C":"胎兒＞245～25週：母親心跳停止大於4分鐘，可考慮緊急剖腹產","D":"I.V.管路宜在上半身（橫膈以上）"},"answer":"A","manualChapter":"CH49"},{"id":883,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"「根據2010年美國心臟醫學會所建議的心肺復甦術指引，以下關於兒童心肺復甦術的敘述何者為非？","options":{"A":"在建立高級呼吸道之前，單一施救者對於兒童的胸部按壓與通氣建議為30：2","B":"在建立高級呼吸道之前，兩名醫護人員對於兒童的胸部按壓與通氣建議為15：2","C":"如果已建立高級呼吸道，建議呼吸應配合胸部按壓進行，每次呼吸約1秒且可見胸部起伏","D":"如果已建立高級呼吸道，建議每6～8秒給予1次呼吸，也就是每分鐘約給予8～10次呼吸"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":885,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2010年美國心臟醫學會所建議的心肺復甦術指引，以下關於新生兒心肺復甦術的敘述，何者為非？","options":{"A":"一旦開始正壓通氣或氧氣補充供給，應評估新生兒的充氧狀態，而且以脈衝式血氧計會比單純評估膚色來得更為可靠","B":"新生兒心臟停止的病例大部分為心臟問題，因此仍維持C-A-B的復甦步驟，並配合3：1的按壓通氣比率","C":"對於足月出生的嬰兒，開始進行急救時最好使用空氣，而不要使用100％的氧氣","D":"只有發生明顯自行呼吸障礙或需要正壓通氣的嬰兒，才需要在出生後立即進行抽吸（包c括使用球形注射器抽吸）的動作"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":887,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2010年美國心臟醫學會所建議的心肺復甦術指引，以下敘述何者為非？","options":{"A":"為避免毒液活化並阻擋毒液進一步侵入體內，受到水母螫傷時，應儘快使用大量醋（4～6％的乙酸溶液）沖洗傷處至少30秒","B":"如果患者上肢被毒蛇咬傷，那麼以介於40與70毫米汞柱的力量，將壓力穩定繃帶捲繞被咬傷的整個肢段，是減緩淋巴流從而減少毒液散播的有效安全方式","C":"建議所有呼吸短促或胸部不適的患者，都應例行給予氧氣","D":"伸展、冰敷和按摩因為熱痙攣而疼痛的肌肉，可能會有所幫助"},"answer":"C","manualChapter":"CH50"},{"id":890,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"兒童的生存之鏈與成人的不同之處，在於特別強調哪一環？","options":{"A":"事故預防","B":"儘早CPR","C":"有效的高級救護（ALS）","D":"整合性復甦後照顧"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":891,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"小兒呼吸衰竭，插呼吸管時，其氣管內管的大小號碼選擇為多少？","options":{"A":"Age（Y）／4＋4","B":"［Age（Y）＋4］1／4","C":"Age（Y）／2＋4","D":"［Age（Y）＋4］／2"},"answer":"A","manualChapter":"CH48"},{"id":892,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位十一個月大，有反應的嬰兒，發燒體溫39℃、燥動不安、皮膚出現斑塊、並有四冰冷。心跳速率為168下/分、呼吸速率為62下/分、血壓為78∕56 mmHg，酸鹼度為7.25。進行評估此嬰兒之後何者為是？","options":{"A":"外觀正常","B":"呼吸正常","C":"循環正常","D":"血壓正常"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":893,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位6歲的孩童被一輛汽車撞傷之後，意識警醒、組織灌流正常，但是有呼吸窘迫的現象，他的頸椎已經被固定並已經使用100％的氧氣面罩，呼吸速率為60次/每分鐘，血壓為60 mmHg，右側胸部呼吸音減弱，氣管向左偏移，此時最合適的處置是:","options":{"A":"立即給予氣管內插管","B":"等待胸部X光的檢查報告","C":"立即給予氣管內插管並於右側胸部放置胸管","D":"先於右側胸部施行針頭減壓，再於右側胸部放置胸管"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":894,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"現在是冬季，你接獲救護指揮中心通報到達一住家內，現場一位10歲的男孩主訴胸痛且呼吸不順，根據母親訴病人之前無任何病史，約一周前開始覺得倦怠就沒再上課去，今天因為呼吸時覺得不順且起身走路時會更覺得更喘而求助。你發現病人意識清楚但是說話費力臉色蒼白且有輕微發紺現象，初步評估如下呼吸每分鐘32下，心跳速率每分鐘130下，血壓90/65毫米汞柱，血氧濃度92％，耳溫37·8℃，微血管充填時間約4～5秒，兩側呼吸音稍減低且使用輔助呼吸肌肉呼吸，心電圖顯示如下。下列描述何者最適當？","options":{"A":"根據病人心電圖顯示為PSVT（陣發性心室上心搏過速），心跳過快是造成病人症狀的主因盡速使用atropine降低病人心跳","B":"根據病人血氧濃度，使用鼻導管4 L/min使用即可","C":"病人有休克現象，立即給予大量輸液，在15分鐘，內給予500毫升的點滴注射","D":"病人休克原因最可能是心因性休克，可能是心肌炎造成"},"answer":"D","matchedChapters":["需要圖片"],"manualChapter":"CH33","image":"題庫圖片/894.png"},{"id":895,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"依據我國緊急醫療救護法第二十五條的規定，有關醫療指導醫師的工作內容，下列何者為非？","options":{"A":"對救災救護指揮中心的人員進行教育訓練","B":"到救災救護指揮中心分析報案與派遣資料","C":"到救災救護指揮中心審查救護技術員填寫的救護紀錄表","D":"到救災救護指揮中心執勤，擔任線上醫療指導"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":896,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位76歲男性於下午2點被人通報倒臥在農田中，高級救護技術員到達現場發現病人意識不清且口吐白沫，心電圖顯示如下圖，血壓70/40毫米汞柱，血氧濃度75％，耳溫39℃，送醫途中發生抽搐現象。下列處置何者最不適當？","options":{"A":"病人意識不清且血氧濃度過低，應考慮使用BVM給予強迫給氧或先插管給氧","B":"因病人體溫過高且有休克現象立即給予適當輸液，可在15分鐘內給予500毫升的點滴注射","C":"病人發生抽搐現象，可以根據預立醫囑使用diazepam或lorazepam控制抽搐","D":"因病人體溫過高可將病人泡在冰水或冷水中，盡速降低病人體溫"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/896.png"},{"id":897,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"是一位高級救護技術員，你接獲勤務中心指派前往一汽車旅館執行救護，你到現場發現一位年輕男性囗鼻部有不知名白色粉末，意識不清、雙側瞳孔放大、囗吐白沫、不斷抽搐，心電圖顯示如下圖，血壓200/120毫米汞柱，血氧濃度75％，體溫40℃，全身濕透。下列處置何者最不適當？","options":{"A":"應先給予輔助呼吸道及高濃度氧氣，必要時給予插管給氧","B":"病患若持續抽搐，必要時可以給予diazepam或lorazepam","C":"可以給予適當輸液，避免高燒出汗後脫水","D":"病人心電圖心律呈現PSVT，盡早給予adenosine使用"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/897.png"},{"id":898,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關活性碳（activated charcoal）的敘述，何者為非？","options":{"A":"可以在腸胃道中吸附毒藥的分子，使用適當的話可以吸附多達50％的食入毒藥","B":"假如食入的毒藥有囗服的解毒藥時，不要給予活性碳","C":"在出勤時常見的酒醉路倒病人，也可以給予活性碳幫助解酒","D":"毒藥食入已經發生超過一個小時的話，給予活性碳的幫助不大"},"answer":"C","manualChapter":"CH50"},{"id":899,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關毒蛇咬傷的敘述，何者為是？","options":{"A":"毒蛇咬傷的傷口可以冰敷來消腫止痛","B":"鎖鏈蛇的毒液成分為混合性毒，所以施打毒蛇血清時可以將抗出血性以及抗神經性毒蛇血清共用來治療","C":"切開毒蛇咬傷的傷口進行抽吸對病人有絕對的好處，所以要在現場緊急處置","D":"百步蛇咬傷的病人，抽血可以發現血小板低下以及凝血時間延長"},"answer":"D","manualChapter":"CH50","explanation":"切開傷口與抽吸是絕對禁忌！ 到院前急救嚴禁切開傷口或用嘴/器具抽吸，因為毒液會迅速擴散至皮下組織，切開傷口不僅無法有效排出毒素，反而會造成血管神經損傷、加重組織壞死及引發嚴重的二次細菌感染。\n\n鎖鏈蛇毒液雖屬混合毒（兼具出血與神經毒性），但疾管署針對鎖鏈蛇咬傷設有專門的「抗鎖鏈蛇毒血清」。臨床治療應直接施打專一性的抗鎖鏈蛇毒血清，而非將一般雙價的抗出血性（龜殼花/赤尾青竹絲）與抗神經性（雨傘節/眼鏡蛇）血清混合塗抹或注射。\n\n毒蛇咬傷嚴禁冰敷！ 冰敷會導致周邊血管劇烈收縮，造成局部組織嚴重缺血，反而會顯著加重腫脹、潰爛與組織壞死（特別是含有細胞毒素與出血毒的蛇毒）。","analysis":"切開傷口與抽吸是絕對禁忌！ 到院前急救嚴禁切開傷口或用嘴/器具抽吸，因為毒液會迅速擴散至皮下組織，切開傷口不僅無法有效排出毒素，反而會造成血管神經損傷、加重組織壞死及引發嚴重的二次細菌感染。\n\n鎖鏈蛇毒液雖屬混合毒（兼具出血與神經毒性），但疾管署針對鎖鏈蛇咬傷設有專門的「抗鎖鏈蛇毒血清」。臨床治療應直接施打專一性的抗鎖鏈蛇毒血清，而非將一般雙價的抗出血性（龜殼花/赤尾青竹絲）與抗神經性（雨傘節/眼鏡蛇）血清混合塗抹或注射。\n\n毒蛇咬傷嚴禁冰敷！ 冰敷會導致周邊血管劇烈收縮，造成局部組織嚴重缺血，反而會顯著加重腫脹、潰爛與組織壞死（特別是含有細胞毒素與出血毒的蛇毒）。"},{"id":901,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關身體體溫調節的敘述，何者為非？","options":{"A":"皮膚血管的擴張以及出汗可以增加體熱的散失","B":"環境相對溼度越高，身體蒸發散熱的效果越好","C":"溺水病人容易產生失溫的現象和身體的傳導散熱有關","D":"環境風速越快，身體對流散熱的效果越好"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":903,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於兒科病患的休克，下列敘述何者？","options":{"A":"兒科病患因為代償功能較差，休克早期血壓就會顯著下降","B":"微血管沖填延遲雖是一種休克的生理指標，但是對於診斷休克沒有幫助","C":"雖不同年齡的血壓值有所不同，但收縮壓的下限值估算可以用70＋（年齡X 2）估是否為低血壓","D":"對於低血容性休克病患給予輸液急救是指快速給予0.33％G/S，劑量為20 ml/kg，最多給兩次"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":904,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於熱急症，下列敘述何者為是？","options":{"A":"中暑時中心體溫可能升高至41℃或以上","B":"目標在希望能快速降低體溫，越快越好。將病患移至陰涼處，給予冰水浴或是低輸液可以幫助病患快速降溫","C":"老人及小孩對於溫度反應較為敏感，且調節功能比較好，較不易發生中暑等熱急","D":"若病患出現高體溫（＞41℃）合併意識不清，需先排除感染急症後再給予降溫以免延治療"},"answer":"A","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":905,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於溺水及溺斃，下列敘述何者為是？","options":{"A":"溺斃的病人幾乎都是因為大量液體吸入肺中造成缺氧導致死亡","B":"溺水事件的受難者有高風險會發生浸泡性低體溫，在現場及轉送途中應考慮體外回溫以及給予加溫潮溼的氧氣","C":"應盡早給予病患呼吸施救，若懷疑有異物阻塞呼吸道，可以施行橫膈下推擠的哈姆立克急救法施救","D":"溺水時根據吸入不同的液體，及溫度，水的濁度等而有不同的預後"},"answer":"B","manualChapter":"CH44"},{"id":906,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於高山疾病，下列敘述何者為是？","options":{"A":"緩慢上升高度，保持身體活動及補充大量水份有助於預防高山疾病","B":"若出現頭痛，頭暈，食慾不佳，虛弱及嘔吐等症狀多是體力不好或不常爬山不適應，做好充分休息就可以","C":"使用藥物即可以完全預防高山症的發生","D":"高山腦水腫應盡速處理，到院前緊急醫療照護著重於支持呼吸道，呼吸，循環並盡快降低高度"},"answer":"D","manualChapter":"CH44"},{"id":907,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於行為急症，下列敘述何者為是？","options":{"A":"救護技術員在警察告知後就可以強制將病患約束及送醫","B":"盡量避免使用開放性問題而被病患引導進而讓場面失控","C":"盡量穩定病患情緒及情勢，儘速轉介至精神科接受評估","D":"病患家屬較清楚病患情形，可以幫忙協助介入以穩定病患情緒"},"answer":"C","manualChapter":"CH46","explanation":"在許多行為急症的案例中，家屬不一定能協助穩定情緒；有時家屬反而是誘發或激化病患情緒的壓力源（例如家暴、言語爭執或家庭關係緊張）。救護人員應觀察現場情勢，必要時應將病患與可能激化其情緒的對象分開。"},{"id":908,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於老人急症，下列敘述何者為是？","options":{"A":"老人突發意識混亂原因多是因腦部退化及年老失智所致","B":"老人因為常穿著過多衣物，因此容易造成體溫過高，量測不準的情形","C":"老人多有心肺功能不佳或本身就有慢性疾病，情緒及心理及自殺問題反而較年輕人少","D":"創傷為老人第五大死因，大部分創傷死亡原因為車禍，跌倒也是老人失能和死亡的原因"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":909,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於懷孕婦女的創傷處理，下列敘述何者為是？","options":{"A":"胎兒極為脆弱，懷孕婦女的創傷極易造成胎兒死亡","B":"胎兒的死亡大多因母親死亡或嚴重休克所造成","C":"因父母護子心切，所以孕婦創傷之救護首重於是否傷及胎兒及胎兒評佸","D":"因胎盤供給胎兒血液及營養，即使少量出血也容易造成孕婦休克，因此必須儘快打上點點滴給予輸液治療"},"answer":"B","manualChapter":"CH49"},{"id":911,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列何種情況需考慮老人虐待及忽視之情況？","options":{"A":"多處瘀傷","B":"反覆性無治療的壓瘡","C":"無法解釋的陰道或肛門出血","D":"以上皆是"},"answer":"D","manualChapter":"CH47"},{"id":912,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於安非他命類中樞神經興奮劑中毒時的可能症狀，下列敘述何者為是？","options":{"A":"嗜睡","B":"低體溫","C":"腦出血","D":"低血壓休克"},"answer":"C","manualChapter":"CH50"},{"id":913,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於懷孕的敘述，下列敘述何者為是？","options":{"A":"懷孕一般以3個月為一期，分為三個3月期。在第二個3月期之後，胎兒快速成長並逐漸進入產程準備，胎兒在此時期產出多可存活","B":"懷孕第四個月時子宮將會增大至肚臍附近","C":"懷孕末期平躺時子宮將會壓迫下腔靜脈造成血壓降低，故急救時需讓孕婦維持右側躺","D":"前置胎盤常引起陣痛性陰道出血，有可能危及生命。若孕婦出現低血容休克時即容易發生胎兒窘迫的情形"},"answer":"A","manualChapter":"CH49"},{"id":914,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於事故指揮系統（Incident Command System），以下敘述何者最不適當？","options":{"A":"事故指揮系統是由功能的需求，而非個人原有的頭銜，來組織整個架構","B":"應該要等上級指示之後再啟動事故指揮系統，越晚成立越能夠有完整的架構與功能，也才能發揮越大的作用","C":"事故指揮系統具有明確的架構，但並非每個事故都必須要啟動所有的功能群","D":"不論事故的本質如何，事故指揮系統的架構都是類似的，差異主要是核心人士的特殊專業考量"},"answer":"B","manualChapter":"CH52"},{"id":915,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"處理危害物質事故時，必須注意工作人員的安全。因此對於參與處理危害物質事件之工作人員，必須要有醫療評估及監測機制。以下觀念何者為非？","options":{"A":"就輻射事故而言、過往曾參與類似事故的工作人員通常經驗較為豐富，應該優先派到汙染區工作","B":"在進入現場工作中，應監測其工作時間及生命徵象；如果其中一位工作人員不適，則全組人員應全部撤離，換上另一組人員","C":"在進入現場前，應評估工作人員的意識狀態、體溫、心跳、血壓、過往病史、目前服用藥物，以了解對熱傷害的忍受力","D":"體重變化可以做為工作人員是否脫水的重要依據"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":916,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於輻災事故的應變觀念，以下何者敘述最不正確？","options":{"A":"輻射會影響傷囗癒合，所以輻射汙染病患的傷囗應該儘可能延遲24小時後再進行縫合","B":"相較於化學物質事故，輻射事故通常不會造成受污染傷者立即性的危害，因此病患除污的急迫性較低","C":"在輻災事故，如果病患的衣物可能沾有輻射物質粉末，應該在移除病患衣物時，先將衣物潤濕，以防止輻射物質擴散至空氣中","D":"輻射污染可以用輻射偵檢器檢測出，通常可以精確地定出污染範圍"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":918,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於空中救護的觀念，以下敘述何者為非？","options":{"A":"依照政府公告的「空中救護適應症」，創傷指數小於12，或年齡小於5歲，創傷指數小於9得以申請空中救護","B":"依照政府公告的「空中救護適應症」，昏迷指數小於10的傷病患得以申請空中救護","C":"依照政府公告的「空中救護適應症」，二度、三度燒面積達10％或特殊部位（如顏面、會陰）燒傷的傷病患得以申請空中救護","D":"符合空中救護適應症的傷病患，都應該啟動空中救護，預後會比較好"},"answer":"D","manualChapter":"CH58"},{"id":919,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"就緊急醫療系統的品質指標，「結構、過程、結果」三大構面是廣泛使用的醫療品量模式。關於品質指標的觀念，以下敘述何者為是？","options":{"A":"「結構面」的指標，是指在照護提供者與傷病患之間發生的過程","B":"「過程面」的指標，是指傷病患在接受醫療救護後，其健康狀態所發生的改變，通常可以分成臨床預後及經濟預後兩大類指標","C":"「每一千次出勤之交通事故比例」是屬於過程面的指標","D":"「結果面」的指標，是指緊急醫療救護系統所擁有的人力、設備、資源等"},"answer":"C","manualChapter":"CH09"},{"id":921,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於事故指揮系統（incident command system，ICS）的描述，以下觀念何者為非？","options":{"A":"事故指揮官（incident commander）必須確認指揮權順利轉移，並決定解除動員的時機和流程","B":"安全官（safety officer）必須評估事故的安全環境與危害物質的狀況，依狀況擬定防護措施","C":"執行部門（operation section）通常是事故現場最先成立的部門，如果後續來協助的人員和器材相當多，應該自行選定不同地點開始工作，以免混亂","D":"後勤部門（logistic section）負責提供工作人員醫療照護、餐飲，處理設備和補給品；這個部門所提供服務的直接對象是工作人員，而不是災民"},"answer":"C","manualChapter":"CH52"},{"id":922,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於多重傷病患事故（multiple casualty incident）和大量傷病患事故（mass casualty incident）的觀念，以下何者為非？","options":{"A":"「多照重傷病患事故」是指傷病患人數多於一人，但尚未超過該地區或系統所能負荷的能量","B":"依照「多照重傷病患事故」的觀念，現場傷勢最嚴重的病患，即使已無呼吸心跳，也應該優先搶救","C":"依照「大量傷病患事故」檢傷分類的觀念，最應該優先處理的，是傷勢危急但是還可能得救的傷病患，而不是那些即使耗用很多資源也無法拯救生命的瀕死傷病患","D":"依照國際慣例，所有的「大量傷病患檢傷法」都把傷病患區分為黑、紅、黃、綠這四種顏色，優先搶救紅色病患"},"answer":"D","manualChapter":"CH52"},{"id":923,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於事故應變的原則，以下何者為非？","options":{"A":"依照管理範疇（span of command）的觀念，可以有效管理的人數或單位通常是有限的，所以每個單位底下的子單位最好可以控制在3～7個之間","B":"如果有更適任或階層更高的人員已經抵達現場加入應變，那麼，在專業技術或法律規範的考量下，可以考量轉移指揮權","C":"平常一起工作的人員，或是同一個機構的人員，應該都要儘可能打散重新編組，使得記錄及通訊連絡更有效率","D":"報案電話應該保留給緊急事故通報之用，所以應該宣導民眾，盡量不要撥打119或110來詢問傷病患的動向"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":924,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"在事故應變中，有幾個應變地點相當重要，必須及早建立。以下關於事故指揮所（incident command post，ICP）的觀念，何者最不正確？","options":{"A":"事故指揮所最好可以位於事故現場附近，但又必須確保在危險區域之外","B":"隨著事故進展，事故指揮所可能必須變動位置","C":"尚未指派任務的工作人員或物資，必須先在事故指揮所裡集結，等後派遣","D":"無論事故的型態或規模，每個事故都必須建立某種形式的事故指揮所"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":925,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"在事故應變時，「危機溝通」相當重要。與民眾或是新聞媒體溝通時，以下作法何者為非？","options":{"A":"發言時不應該偏袒特定的媒體，但如果有媒體特別想要了解某些專業的問題，可以轉介給適合的專家","B":"對大眾發言時應儘量使用專業術語，以提升應變工作人員的專業形象","C":"發言時，盡可能不要接受或引用未經證實的消息","D":"發言官必須監控新聞媒體或群眾之間是否出現謠言。如果謠言可能造成群眾嚴重的負面效應，甚至影響到事故應變進行，發言官應及時向事故指揮官報告，並在授權之下儘速澄清"},"answer":"B","manualChapter":"CH53"},{"id":927,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"在大量傷病患事故的屍體處理，以下觀念何者為非？","options":{"A":"明顯死亡的屍體，只有在獲得許可之後，才能夠移動位置，因為這牽涉到死因鑑識和其它的法律問題","B":"如果橫陳的屍體阻礙了逃生或援救的通道，這種緊急狀況下可以搬動屍體來開通通道","C":"在危害物質事故中，考量除污的問題，遺體通常先留置在原先地點，等到事故控制至一定階段後再移動","D":"為了表示對死者的尊重，應該儘可能使用救護車把屍體載送到殯儀館或其他暫時安厝的場所"},"answer":"D","manualChapter":"CH52"},{"id":929,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"於災難的描述，以下觀念何者最不適當？","options":{"A":"自然災難時，通常民眾善良的本性會激發出來，自助互助的狀況非常常見","B":"目前的科技有很多方法可以協助鑑識大量屍體，應該儘可能鑑識屍體身分","C":"在自然災難中，最貧窮的區域通常死傷最嚴重","D":"災難後的大量屍體會造成瘟疫，處理大量屍體最有效的方法就是集體埋入土坑"},"answer":"D","matchedChapters":["CH10"],"manualChapter":"CH10"},{"id":931,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列台灣常見的毒蛇咬傷後，哪一種可能會引起呼吸衰竭？","options":{"A":"赤尾青竹絲","B":"龜殼花","C":"百步蛇","D":"眼鏡蛇"},"answer":"D","manualChapter":"CH50"},{"id":932,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關acetaminophen中毒之敘述何者為非？","options":{"A":"反覆嘔吐為中毒初期常見的症狀","B":"導致中毒的劑量多在150mg/kg以上","C":"中毒後，除引起肝傷害外，也可以導致腎衰竭、胰臟炎、昏迷或代謝性酸中毒等症狀","D":"中毒後引起肝傷害，一般於中毒24小時產生，且多為不可逆性的"},"answer":"D","manualChapter":"CH50"},{"id":933,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列敘述哪一個是為非？","options":{"A":"被有毒海洋生物咬螫的毒素通常為對熱穩定的蛋白質","B":"大多數蜘蛛的毒素對人體是無害的","C":"蜈蚣咬傷一般僅有局部的組織反應，不至於危害生命","D":"腔腸動物螫傷常於皮膚上呈現特殊紅棕色長條狀的風疹塊"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":934,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於野外醫學，以下敘述何者為是？","options":{"A":"高山症的初期症狀和感冒或是宿醉很類似，所以常被忽略。如果懷疑是高山症，應該避免繼續登高、考慮下山，並且給予acetazolamide和dexamethasone","B":"潛水者所併發的氣泡栓塞症，通常在浮到水面的幾分鐘內就會出現。如果沒有嚴重症狀，表示沒有產生潛水夫症，當天便可以搭民航機長途旅行","C":"低伏特數的交流電所造成的心律不整常常是無心律（asystole）；而高伏特數的交流電或是直流電所造成的致命心律不整常常是心室纖維顫動（ventricular fibrillation）","D":"海水溺水的病患比淡水溺水的病患存活率差"},"answer":"A","manualChapter":"CH45"},{"id":935,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"「北美應變指南」主要是協助初期應變人員，可迅速確認事件所波及物質的危害，並保護自身與民眾的安全。根據2008年中文版的北美應變指南，危險物質的指引可以根據以下哪種方式查到？甲：聯合國數字編號（UN number）乙：物質的英文名稱丙：物質的中文名稱丁：物質的輻射量","options":{"A":"只有甲正確，其他錯誤","B":"只有甲、乙正確，其他錯誤","C":"只有甲、乙、丙正確，其他錯誤","D":"甲、乙、丙、丁都可以"},"answer":"C","manualChapter":"CH53"},{"id":936,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2008年中文版的北美應變指南，以下對於「初期隔離距離」和「防護行動區域」的敘述，何者為誤？","options":{"A":"如果危害物質的蒸氣雲穿越數棟高層建築物或流經峽谷，因為蒸氣雲與大氣較不容易混合，所以防護距離可能比應變指南所表列的建議距離更長","B":"一般而言，小洩漏是指等於或小於兩百公升的液體洩漏，或是等於或小於三百公斤的固體洩漏至水中","C":"防護行動距離有可能因為天候、事故嚴重度、地形等等因素而必須調整","D":"一般而言，在夜晚時，空氣比較平穩，使得化學品擴散較慢，因此毒性影響區域範圍會小於發生在白天的狀況"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":937,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2008年中文版的北美應變指南，對於危害物質事故的應變原則，以下何者為非？","options":{"A":"應該從上風處小心地接近事故現場；如果方向許可，應該從地勢高處接近事故現場","B":"必須小心處理空的容器，因為在容器未完全清除或排淨所有危害物質之前，空容器仍然存在著危險性","C":"可以試著由標示牌、容器標示、運送聯單、物質安全資料表、現場專業人員等等，來辨識危害物質種類","D":"大多數為危害物質都有特殊異味；穿著防護衣處理"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":938,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2008年中文版的北美應變指南，以下對於「初期隔離距離」和「防護行動區」的敘述，何者錯誤？","options":{"A":"一般而言，大洩漏的初期隔離距離比起小洩漏來得長","B":"一般而言，具有強烈逆溫又加上穩定的風向，這時候應該增加防護行動距離","C":"一般而言，發生在白天的事故，防護行動區域比起夜晚來得廣","D":"一般而言，事故下風處的防護行動區域比起上風處來得廣"},"answer":"C","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":939,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關活性碳（activated charcoal）的敘述，何者為非？","options":{"A":"可以在腸胃道中吸附毒藥的分子，使用適當的話可以吸附多達50％的食入毒藥","B":"假如食入的毒藥有囗服的解毒劑時，給活性碳會同時吸附解毒劑而降低療效","C":"在出勤時常見的酒醉路倒病人，也可以給予活性碳幫助解酒","D":"病人在給予活性碳之前，必須先確保病人的呼吸道可以維持暢通"},"answer":"C","manualChapter":"CH50"},{"id":940,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關洗胃（gastric lavage）的注意事項以及禁忌症，何者為非？","options":{"A":"病人如果意識不清，在洗胃之前應該要先確保呼吸道可以維持暢通","B":"幼兒病人洗胃時的沖洗液不需指定生理食鹽水，用一般蒸餾水也可以","C":"清醒的病人不會有嘔吐的問題，所以洗胃時左側躺是沒有意義的","D":"在洗胃之前就先給予活性碳是可以被接受的"},"answer":"C","manualChapter":"CH50"},{"id":941,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關肉毒桿菌素中毒的敘述，何者為是？","options":{"A":"肉毒桿菌素是一種很強的毒素，在醫學上沒有任何用途","B":"是因為被肉毒芽孢梭狀桿菌污染的泥土進人傷囗所導致的","C":"中毒病人的症狀是由末梢傳回中樞，先是四肢麻痺，再來才出現複視、眼瞼下垂以及吸衰竭等症狀","D":"中毒病人的死因是因為呼吸衰竭"},"answer":"D","manualChapter":"CH50"},{"id":942,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"30歲的男性士官長被發現在浴室中陷入昏迷，你和伙伴（都是合格的高級救護技術員）到達現場後發現士官長倒臥在寢室中的浴室，現場有濃重的農藥惡臭，牆角有兩個被撕掉標籤的空瓶，經初評發現病人完全昏迷（對痛沒有反應）、口鼻分泌物大量增加、口吐白沫、呼吸每分鐘6下、頸動脈摸的到（每分鐘68下）、四肢癱瘓、全身皮膚蒼白濕冷、血糖值為218 mg/dL、距離急救責任醫院約45分鐘車程；下列敘述何者為非？","options":{"A":"高級救護技術員在這種情況下須特別注意自我防護，以免吸入過量農藥而造成中毒","B":"需要立即建立進階呼吸道以確保呼吸道暢通，並在病人呼吸停止時給予強迫給氧","C":"病人的瞳孔是針狀瞳，可以線上醫療指導注射atropine解毒","D":"此種農藥中毒並無特別的解毒劑"},"answer":"D","manualChapter":"非創傷"},{"id":943,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關毒蛇咬傷的敘述，何者為是？","options":{"A":"毒蛇咬傷的傷口可以冰敷來消腫止痛","B":"百步蛇的毒液成分為很強的出血性毒，所以施打毒蛇血清時可以將青竹絲用的抗出血性毒蛇血清加倍來使用，效果相同","C":"切開毒蛇咬傷的傷囗進行抽吸並且在咬傷部位的近心端綁上止血帶對病人有絕對的好處，所以要在現場緊急處置","D":"百步蛇咬傷的病人，抽血可以發現血小板低下以及凝血時間延長"},"answer":"D","manualChapter":"CH50","explanation":"切開傷口與抽吸是絕對禁忌！ 到院前急救嚴禁切開傷口或用嘴/器具抽吸，因為毒液會迅速擴散至皮下組織，切開傷口不僅無法有效排出毒素，反而會造成血管神經損傷、加重組織壞死及引發嚴重的二次細菌感染。\n\n鎖鏈蛇毒液雖屬混合毒（兼具出血與神經毒性），但疾管署針對鎖鏈蛇咬傷設有專門的「抗鎖鏈蛇毒血清」。臨床治療應直接施打專一性的抗鎖鏈蛇毒血清，而非將一般雙價的抗出血性（龜殼花/赤尾青竹絲）與抗神經性（雨傘節/眼鏡蛇）血清混合塗抹或注射。\n\n毒蛇咬傷嚴禁冰敷！ 冰敷會導致周邊血管劇烈收縮，造成局部組織嚴重缺血，反而會顯著加重腫脹、潰爛與組織壞死（特別是含有細胞毒素與出血毒的蛇毒）。","analysis":"切開傷口與抽吸是絕對禁忌！ 到院前急救嚴禁切開傷口或用嘴/器具抽吸，因為毒液會迅速擴散至皮下組織，切開傷口不僅無法有效排出毒素，反而會造成血管神經損傷、加重組織壞死及引發嚴重的二次細菌感染。\n\n鎖鏈蛇毒液雖屬混合毒（兼具出血與神經毒性），但疾管署針對鎖鏈蛇咬傷設有專門的「抗鎖鏈蛇毒血清」。臨床治療應直接施打專一性的抗鎖鏈蛇毒血清，而非將一般雙價的抗出血性（龜殼花/赤尾青竹絲）與抗神經性（雨傘節/眼鏡蛇）血清混合塗抹或注射。\n\n毒蛇咬傷嚴禁冰敷！ 冰敷會導致周邊血管劇烈收縮，造成局部組織嚴重缺血，反而會顯著加重腫脹、潰爛與組織壞死（特別是含有細胞毒素與出血毒的蛇毒）。"},{"id":949,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"救護員運送這兩歲半清醒女童，發燒39℃、燥動不安、皮膚有出血性紫斑、四肢冰冷並有酸血症的現象，心跳速率為148下/分、呼吸速率為38下/分、血壓為80/56 mmHg，酸鹼度為7.25，運送後救護員除了標準車內清潔消毒外，應注意的事為：","options":{"A":"EMT應儘速返隊全車高規格消毒並靜置車輛6小時後才能再使用","B":"EMT應追蹤病患診斷並尋求醫師建議暴露後預防性投藥","C":"EMT應立即掛急診施打抗生素及免疫球蛋白","D":"EMT應掛門診追蹤胸部X光檢查"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":950,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關身體體溫調節的敘述，何者為是？1.皮膚血管的擴張以及出汗可以增加體熱的散失2.環境相對溼度越高、身體蒸發散熱的效果越不好3.溺水病人容易產生失溫的現象和身體的傳導散熱有關4.環境風速越快，身體對流散熱的效果越好","options":{"A":"1","C":"1、2、3","B":"1、2","D":"1、2、3、4"},"answer":"D","manualChapter":"CH44"},{"id":952,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關生物咬螫刺傷的敘述，下列何者為是？","options":{"A":"鎖鏈蛇的蛇毒為混合性毒，所以對於被鎖鏈蛇咬傷的傷患可以使用抗出血性蛇毒以及抗神經性蛇毒血清合併使用來治療","B":"被石頭魚（石狗公）的鰭刺傷的傷患會感到患部異常疼痛，所以可以冰敷來減輕疼痛感","C":"蜂類離體的毒刺毒囊不具活性，所以救護技術員到達現場發現傷患身上有離體的毒刺毒囊時不需要特別的處置","D":"水母的觸手離開水母的身體仍會保持活性一段時間"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":953,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關酒精對人體的危害，下列敘述何者為非？","options":{"A":"酒精會抑制維生素B1的在小腸的吸收而造成病患Wernicke-Korsakoff syndrome","B":"喝酒以後排尿量增加，是因為酒精抑制抗利尿激素的分泌，會造成脫水以及電解質不平衡","C":"長期酗酒可能和病患的腸胃道出血以及肝硬化沒有相關","D":"酒精會影響心臟的肌肉而使心臟收縮的力量降低"},"answer":"C","manualChapter":"CH46"},{"id":955,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關評估以及和行為急症的病患會談的技巧，下列敘述何者為非？","options":{"A":"許多病患有暴力傾向，救護技術員首先必須確認現場環境安全","B":"為了要和行為急症的病患建立好彼此的關係，適當的肢體接觸是必須的","C":"精神狀態檢查五步驟包括:觀察病患外觀、病患言語特徵、病患情緒特徵、評估病患思想以及決定病患定向感","D":"使用開放式的問題，讓病患描述自己的情況，誘導病患說話才較容易評估病患的病情"},"answer":"B","manualChapter":"CH46"},{"id":956,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關自殺以及準自殺行為的危險因素，下列敘述何者為非？","options":{"A":"執行一次或多次的準自殺行為","B":"單身，分居或離婚","C":"沒有職業或退休","D":"與家人或社會有良好的互動"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":957,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關老人預防跌倒與降低跌倒有關傷害的措施，何者敘述為非？","options":{"A":"使用輔助器","B":"保持適當的照明","C":"提供和使用扶手","D":"柔軟易移動的小地毯收納方便又可吸收老人跌倒時的衝擊力，建議使用"},"answer":"D","manualChapter":"CH47"},{"id":960,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"以下關於老年病患到院前照護的敘述，何者為是？","options":{"A":"老年病患跌倒送往醫院時，EMT應蒐集資訊判斷是否可能有內科急重症問題讓病患跌倒，並告知檢傷相關訊息","B":"老年病患因為代謝比較慢，所以比起一般成年人容易低體溫。也因為代謝慢，所以比較不會高體溫","C":"老年病患若有自殺的行為，通常成功的比例比其他年齡層低","D":"老年病患若遇到外傷所致之顱內出血，因為頭骨與腦部之間的空間增加，因此出血早期就會出現顱內壓升高之症狀"},"answer":"A","matchedChapters":["CH47"],"manualChapter":"CH47"},{"id":961,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於有機磷中毒患者的到院前辨認與處理，以下何者正確？","options":{"A":"Atropine的使用很重要，因為可以再活化乙醯膽鹼酶，讓無力的呼吸肌肉再度強化","B":"Atr。pine的使用劑量需要根據病患體重計算，不可超出上限","C":"由於有機磷會使得病患無力，因此一旦發生癲癇，不可以使用會讓病患更無力的diazepam或是lorazepam","D":"有機磷中毒的主要症狀是針狀瞳孔，流鼻水，呼吸道分泌物增多，流淚，流口水，全身出汗與腹瀉"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":962,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"新生兒（第一個月）發生癲癇重積狀態，常見的原因不包括？","options":{"A":"生產受傷","B":"先天性代謝異常","C":"腦部感染","D":"腦部腫瘤"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":963,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"新生兒急救時，所需的急救措施，依頻率而言，最常用到的措施是？","options":{"A":"擦乾、保暖、抽吸、剌激","B":"胸外按壓","C":"氣管插管","D":"強心劑藥物"},"answer":"A","matchedChapters":["CH48"],"manualChapter":"CH48"},{"id":966,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關毒藥物以及解毒藥劑的配對，下列何者為非？","options":{"A":"普拿疼中毒的解毒劑是N-acetylcysteine（Fluimucil）","B":"甲醇中毒的解毒劑是乙醇","C":"嗎啡類藥物中毒的解毒劑是naloxone","D":"氰化物中毒的解毒劑是flumazenil"},"answer":"D","manualChapter":"CH16"},{"id":967,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據北美應變指南，以下對於「初期隔離距離」和「防護行動區域」的敘述，何者為非？","options":{"A":"如果危害物質的蒸氣雲穿越數棟高層建築物或流經峽谷，因為蒸氣雲與大氣較不容易混合，所以防護距離可能比應變指南所表列的建議距離更長","B":"應該從上風處小心地接近事故現場；如果方向許可，應該從地勢高處接近事故現場","C":"防護行動距離有可能因為天候、事故嚴重度、地形等等因素而必須調整","D":"一般而言，在夜晚時空氣比較平穩，使得危害物質擴散較慢，因此毒性影響區域範圍會小於發生在白天的狀況"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":1034,"source":"第四章 非創傷急症(2012-2014).doc","question":"OHCA現場急救，你在插管時發現看不見氣管入口。下列作法可幫助聲帶三角容易呈現，但何者除外？","options":{"A":"選擇適當大小的喉鏡葉片","B":"將病患雙肩下墊高","C":"插管者姿勢蹲低或趴在地上","D":"請人施行環狀軟骨按壓術"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1035,"source":"第四章 非創傷急症(2012-2014).doc","question":"根據復甦醫學界著名的心臟停止後三階段急救模式（3-Phase Time-Sensitive Resuscitative Model），下列敘述正確的是？","options":{"A":"心跳剛停止後的4分鐘內是circulatory phase，此時徒手的CPR將是最有效的治療","B":"心跳停止後的4～10分鐘是metabolic phase，此時最有效的治療是以各種急救藥物進行處理","C":"心跳停止後的10分鐘以上是electrical phase，此時往往必須靠多次的電擊去顫術才能恢復心跳","D":"以上皆非"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1036,"source":"第四章 非創傷急症(2012-2014).doc","question":"ACLS建議在CPR的過程中，應儘量全程使用ETCO2。連續監測，乃是基於三個重要原因，何者除外？","options":{"A":"它是CPR品質的生理性指標之一","B":"它是過度換氣的生理性指標之一","C":"它是確認插管位置是否正確最客觀的工具","D":"它能在不中斷壓胸的情形下顯示病人是否回復心跳"},"answer":"B","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":1037,"source":"第四章 非創傷急症(2012-2014).doc","question":"急救常用的epinephrine。在下列成人重症與給藥的組合，何者錯誤？","options":{"A":"無脈搏急救：1 mg I.V.，每3～5分鐘一次","B":"氣喘重積症發作：0.3 mg S.C.，每20分鐘一次","C":"過敏性休克：0.5 mg S.C.，每5～15分鐘一次","D":"不穩定的緩脈：2～10 mcg／min連續滴注"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":1039,"source":"第四章 非創傷急症(2012-2014).doc","question":"你接獲指揮中心通報，到某安養中心救護病人，求救原因為意識不清，到現場後發現病人平躺床上，且護理人員已將心電圖監測器接上，如下圖：請問下列敘述何者最正確？","options":{"A":"此心電圖一定是PSVT","B":"此病人需立刻同步整流電擊","C":"此病人需立刻非同步去顫電擊","D":"此病人需先確認頸動脈再決定下一步行動"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":1040,"source":"第四章 非創傷急症(2012-2014).doc","question":"關於心包膜填塞，有所謂的貝克式三症狀（Beck's triad），下列何者不包含在內？","options":{"A":"低血壓","B":"頸靜脈怒張","C":"意識不清","D":"心音變弱且模糊"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":1041,"source":"第四章 非創傷急症(2012-2014).doc","question":"某天，你正在分隊作教育訓練時，有來訪民眾突然倒下，與以「快看電擊板」後發現病人心律為VF，你身為訓練有素的EMT-P，馬上給與去顫電擊，請問電擊完後，接下來的最適當處置為？","options":{"A":"予以再次去顫電擊","B":"予以確認病人脈搏","C":"予以繼續高品質CPR","D":"予以插置氣管內管"},"answer":"C","manualChapter":"非創傷"},{"id":1042,"source":"第四章 非創傷急症(2012-2014).doc","question":"心律不整的處理以下何者為非：","options":{"A":"不論快的（tachycardia）與慢的（bradycardia）心律不整都有危及生命的可能性。十二導程心電圖可供判定心律","B":"心房撲動（atrial flutter），心房顫動（atrial fibrillation）屬於快的心律不整，若是因此產生休克，同步整流電擊是可用的治療的方式","C":"Atropine是可以逆轉副交感神經所造成的症狀，可用在有症狀的心搏過緩","D":"針對心律不整且意識狀態改變的病人，儘速取得電擊器，施於至少一次的去顫電擊"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH33"]},{"id":1043,"source":"第四章 非創傷急症(2012-2014).doc","question":"以下何者心律可以出現窄的QRS波：","options":{"A":"VF","B":"VT","C":"Torsades de pointes","D":"2度Ⅱ型AV block"},"answer":"D","manualChapter":"CH33"},{"id":1044,"source":"第四章 非創傷急症(2012-2014).doc","question":"70歲男性因呼吸困難來到急診，脈搏40次／min，血壓70／40mmHg，以下處置何者為是：","options":{"A":"儘快做完12 lead的EKG，若為3度AV block，給予同步電擊150 J","B":"O2 I.V. monitor，準備做心導管，因為心肌梗塞可能以bradycardia來表現","C":"病人呈現心因性休克合併肺水腫應優先快速大量體液補充，並密切觀察心律變化","D":"可重複給atropine 0.5 mg I.V. push 5到6次，並觀察病人反應，若反應不佳，節律器使用"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1045,"source":"第四章 非創傷急症(2012-2014).doc","question":"有關心電圖的敘述，下列何為為韭？","options":{"A":"右心房擴大在心電圖上的變化主要為P波變高（＞25 mm）而寬度不變，形成所謂的P pulmonale","B":"左心房擴大的變化主要為P波變寬（＞02秒），形成所謂的P mitrale","C":"右心室肥厚時，QRS的變化主要為胸前導程V5的R波變高、V1的S波變深","D":"三個以上連續出現的心室性期外收縮則稱為short-run ventricular tachycardia"},"answer":"C","manualChapter":"CH16"},{"id":1046,"source":"第四章 非創傷急症(2012-2014).doc","question":"心電圖出現p-R區間逐漸地拉長，終至傳導不下去而出現僅有p波而無跟隨的QRS複合波的情形，這心電圖的判讀是：","options":{"A":"一級房室結傳導阻斷","B":"Mobitz第二型二級房室結傳導阻斷","C":"Mobitz第一型二級房室結傳導阻斷","D":"三級房室結傳導阻斷"},"answer":"C","manualChapter":"CH33"},{"id":1047,"source":"第四章 非創傷急症(2012-2014).doc","question":"下列敘述何者有誤？","options":{"A":"於無意識的病人，最常見的呼吸道阻塞原因為會厭倒下造成","B":"CPR時由施救者囗中吹出的氧氣濃度約17%","C":"CPR經評估脈搏恢復後應維持吹氣每分鐘10～12次","D":"LMA可以在到院前使用以暫時取代氣管內管"},"answer":"A","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":1048,"source":"第四章 非創傷急症(2012-2014).doc","question":"下列打開呼吸道的方式及輔助呼吸道的使用何者較適當？","options":{"A":"非外傷昏迷病人一律以下巴推擠法打開呼吸道","B":"意識昏迷併有鎖骨以上創傷病人一律以壓額抬下巴法來打開呼吸道","C":"教導一般民眾不論創傷或非創傷病患一律使用壓額抬下巴法（頭後斜／下顎上提法）來打開呼吸道","D":"意識不清，顏面部創傷病人使用鼻咽呼吸道較適合"},"answer":"C","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":1049,"source":"第四章 非創傷急症(2012-2014).doc","question":"30歲男性病患在公車站突然發生抽搐的現象。根據他的朋友描述，病患突然倒地，先是全身僵硬，牙關緊閉；接著有適當呼吸，但四肢開始抽動，口吐白沫。病患之前並沒有發生過類似的情形。你發現病患意識不清仰躺於地，已經沒有抽搐的情形。下列何項評估或處置為佳？","options":{"A":"應將病患擺成復甦姿勢，以利囗水等分泌物的引流，同時給予病患高流量的氧氣","B":"病患的意識不清有可能是因為他現正處於抽搐後的混淆期，會慢慢恢復清醒","C":"病患的抽搐屬於所謂的「大發作」，一般包含三個階段，其中以陣攣（clonic）期時問最短","D":"在到院前應測量病患的指尖血糖值，因為低血糖可能是造成病患抽搐的原因"},"answer":"C","manualChapter":"非創傷"},{"id":1050,"source":"第四章 非創傷急症(2012-2014).doc","question":"對於張力性氣胸進行針刺減壓的正確位置是？","options":{"A":"鎖骨中線第二肋間","B":"腋中線第二肋間","C":"腋中線第三肋間","D":"鎖骨中線第三肋間"},"answer":"A","matchedChapters":["暫存區"],"manualChapter":"暫存區"},{"id":1051,"source":"第四章 非創傷急症(2012-2014).doc","question":"對於休克描述，下列何者為韭？","options":{"A":"收縮壓小於90 mmHg就是休克","B":"休克患者會有皮膚冰冷，心跳過速，冒冷汗，呼吸困難症狀","C":"休克主要是組織灌流不足，造成氧氣運送不能應付組織代謝所需","D":"依rate→volume→pump，對休克做初步處理"},"answer":"A","manualChapter":"CH26"},{"id":1052,"source":"第四章 非創傷急症(2012-2014).doc","question":"一個年約60歲男性，路倒、意識昏迷、沒有正常呼吸、頸動脈摸不到脈搏，需要CPR且心電圖監視器如下：請問下列何者正確？","options":{"A":"這種一定有脈搏，不需要CPR","B":"應使用電擊器去顫","C":"應立即CPR","D":"應先打上點滴給予大量的輸液，若未改善就需CPR"},"answer":"C","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/1052.png"},{"id":1054,"source":"第四章 非創傷急症(2012-2014).doc","question":"想要在短時間內找出PEA／Asystole病人可能原因，快速的理學檢查是不可缺的一環，下列何者不包含在內？","options":{"A":"查看病人頸靜脈是否怒張","B":"測量病人的深肌腱反射","C":"聽診病人兩側呼吸音","D":"以超音波檢視病患的心臟、肺部及腹部"},"answer":"B","manualChapter":"CH20"},{"id":1055,"source":"第四章 非創傷急症(2012-2014).doc","question":"您（EMT-P）在擁擠車站的候車室目睹站在前方的男性突然倒地，心臟停止，下列處置何者最正確：","options":{"A":"立即做5個循環的CPR→請他人求救並取得AED→CPR至AED到時，立即以AED分析是否建議去顫（defibrillation）","B":"請他人求救並取得AED→立即做5個循環的CPR後，再以AED分析是否建議去顫","C":"請他人求救並取得AED→CPR至AED到時，立即以AED分析是否建議去顫（defibrillation）→若去顫，立即做5個循環的CPR","D":"立即做5個循環的CPR→請他人求救並取得AED→CPR至AED到時，先檢查是否有脈搏，若無脈搏再以AED分析是否建議去顫（defibrillation）"},"answer":"C","manualChapter":"CH23"},{"id":1056,"source":"第四章 非創傷急症(2012-2014).doc","question":"一位81歲尿毒症患者，每週一、五上午洗腎治療。星期日晚上，忽然呼吸困難、意識昏迷，EMT到達現場時已無脈搏，EKG如下圖：請問以下何者最有可能是造成此病人PEA的原因？","options":{"A":"氣喘發作","B":"高血鉀症","C":"高血糖","D":"低體溫"},"answer":"B","matchedChapters":["需要圖片"],"manualChapter":"CH33","image":"題庫圖片/1056.png"},{"id":1058,"source":"第四章 非創傷急症(2012-2014).doc","question":"有關成人「生存之鏈（chainofsurvival）」排列順序，何者正確？（1）早期心肺甦醒術（early CPR）；（2）早期高級心臟救命術（early ACLS）；（3）早期求救（early access）；（4）早期電擊治療（early defibrillation）；（5）整合之心臟停止後照護","options":{"A":"1，2，3，4，5","B":"2，3，1，4，5","C":"3，1，4，2，5","D":"4，2，1，3，5"},"answer":"C","manualChapter":"CH23","matchedChapters":["CH23"]},{"id":1061,"source":"第四章 非創傷急症(2012-2014).doc","question":"病患的EKG出現asystole時，最早給予最適當的處置為何？","options":{"A":"給BVM O2","B":"給予電擊200～300焦耳","C":"開始CPR","D":"給予epinephrine"},"answer":"C","manualChapter":"CH23"},{"id":1062,"source":"第四章 非創傷急症(2012-2014).doc","question":"一名50歲男性病患，主訴有呼吸困難，血壓低89／30 mmHg，橈動脈弱，心音聽起來非常小聲，頸靜脈怒張。請問病患最有可能的診斷為何？","options":{"A":"Pericardial tamponade心包填塞","B":"Pulmonary contusion肺挫傷","C":"Paradoxical hypotension低血壓","D":"Flail chest連枷胸"},"answer":"A","manualChapter":"呼吸急症","matchedChapters":["CH20"]},{"id":1064,"source":"第四章 非創傷急症(2012-2014).doc","question":"根據2010年美國心臟醫學會的建議，自動體外電擊器在胸部的貼片位置，以下何者是可以接受的？甲：胸壁前方一側壁乙：胸壁前方一後方丙：胸壁前方一左肩胛下方丁：胸壁前方一右肩胛下方","options":{"A":"只有甲可以接受","B":"只有甲、乙可以接受","C":"只有甲、乙、丙可以接受","D":"甲、乙、丙、丁都可以接受"},"answer":"D","manualChapter":"CH23"},{"id":1069,"source":"第四章 非創傷急症(2012-2014).doc","question":"下列有關心包膜填塞的描述，何者為非？","options":{"A":"臨床表現包括：低血壓、呼吸急促、倦怠無力，甚而發紺","B":"理學檢查方面：頸靜脈怒張，心音變弱且模糊，心包膜摩擦音，有時會有奇脈（pulsus paradoxus）發生","C":"心電圖有時會有電氣交替（electrical alternans）現象","D":"貝克氏三症狀（Beck's triad）即指常見於急性心包膜填塞的「低血壓」「頸靜脈怒張」、以及「心電圖的電氣交替」"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":1070,"source":"第四章 非創傷急症(2012-2014).doc","question":"關於心包膜填塞（cardiac tamponade）的敘述，何者為是？","options":{"A":"會造成胸痛，可以比照缺血性胸痛給予MONA","B":"心包膜腔液體過多的話，會先壓迫左心房以及左心室，造成無脈性的電氣活動（PEA）","C":"會影響到回心血流是在心臟收縮期時","D":"高度懷疑心包膜填塞之病患，可以考慮到院前建立靜脈管路，給予生理食鹽水等靜脈注射"},"answer":"D","manualChapter":"CH34"},{"id":1071,"source":"第四章 非創傷急症(2012-2014).doc","question":"病患有陣發性心房纖維顫動（paroxysmal atrial fibrillation）以及WPW的病史，此時發生陣發性上心室心搏過速（PSVT），病患臨床症狀穩定，使用非藥物的方式均無法改善，如要使用藥物應選擇何種藥物較為安全？","options":{"A":"Amiodarone","B":"Adenosine","C":"Digoxin（毛地黃）","D":"Beta blockers（乙型阻斷劑）"},"answer":"A","manualChapter":"CH16"},{"id":1072,"source":"第四章 非創傷急症(2012-2014).doc","question":"一名30歲男性病患被路人發現倒臥橋邊，經高級救護技術員到達現場評估後發現摸得到微弱的頸動脈，心臟監視器呈現下列心律，何者為是？","options":{"A":"Torsades de pointes","B":"Ventricular fibrillation","C":"Ventricular tachycardia","D":"Atrial fibrillation"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/1072.png"},{"id":1076,"source":"第四章 非創傷急症(2012-2014).doc","question":"在心臟整流（cardioversion）的過程中，病患突然變成VF，你應該馬上採取下列那一步驟？","options":{"A":"開始胸部按壓，建立氣管內管","B":"立即靜脈快速注射epinephrine 1 mg然後給予去顫電擊","C":"關掉同步開關，立即進行非同步的心臟電擊","D":"立即進行第二次同步的心臟整流"},"answer":"C","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":1077,"source":"第四章 非創傷急症(2012-2014).doc","question":"VF電擊完，CPR兩分鐘五個循環後，心電圖監視器的心律呈現二度二型房室傳導障礙（2度AV block typeⅡ）波形，你下一步該如何？","options":{"A":"檢查頸動脈是否有脈搏","B":"給予atropine 0.5 mg靜脈注射","C":"給予體外經皮式心律調節器（TCP）","D":"已急救成功，趕快將病患送醫"},"answer":"A","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1078,"source":"第四章 非創傷急症(2012-2014).doc","question":"一位年輕病患因心悸至急診，EKG顯示PSVT，心跳180／min，血壓120／80mmHg，呼吸尚平順，下列處置何者最優先？","options":{"A":"跟病患解釋後，予以鎮靜，給予同步電擊50焦耳","B":"給予adenosine 6 mg快速I.V.注射","C":"給予amiodarone 150 mg，I.V.滴注10分鐘","D":"確定無carotid bruits後，給予頸動脈竇按摩"},"answer":"D","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1079,"source":"第四章 非創傷急症(2012-2014).doc","question":"心跳停止的病患（OHCA）恢復自發性循環（ROSC）之後，依據ACLS 2010年的建議，哪種病患應該進行低體溫治療？","options":{"A":"所有ROSC病患皆應進行","B":"僅限於高度懷疑心肌梗塞病患","C":"僅限於意識不清無法聽從指令的病患","D":"僅限於成人非創傷病患"},"answer":"C","matchedChapters":["CH24"],"manualChapter":"CH24"},{"id":1080,"source":"第四章 非創傷急症(2012-2014).doc","question":"依ACLS 2010年建議，須作15：2按壓換氣比的情況是？","options":{"A":"成人急救，兩名一般施救者","B":"兒童急救，一名一般施救者","C":"兒童急救，兩名專業醫療人員","D":"新生兒急救，一名專業醫療人"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":45465,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列台灣常見的毒蛇咬傷後，哪一種可能會引起呼吸衰竭？","options":{"A":"赤尾青竹絲","B":"龜殼花","C":"百步蛇","D":"眼鏡蛇"},"answer":"D","manualChapter":"背誦題"},{"id":45710,"source":"第五章 創傷急症(2012-2014).doc","question":"以過度換氣（hyperventilation）來降低顱內壓時，應將動脈血液血的PaCO2控制在約：","options":{"A":"40～45 mmHg","B":"30～40 mmHg","C":"20～25 mmHg","D":"15～20 mmHg"},"answer":"B","manualChapter":"暫存區","matchedChapters":["暫存區"]}];

      } catch (e) {
        return [];
      }
    }
    function isFavorited(id) {
      return getFavorites().includes(id);
    }
    function toggleFavorite(id) {
      let favs = getFavorites();
      const idx = favs.indexOf(id);
      let added = false;
      if (idx > -1) {
        favs.splice(idx, 1);
      } else {
        favs.push(id);
        added = true;
      }
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
      } catch (e) {}
      return added;
    }
    function updateFavBtn(id) {
      const favBtn = document.getElementById("fav-btn");
      if (!favBtn) return;
      const fav = isFavorited(id);
      favBtn.textContent = fav ? "★" : "☆";
      favBtn.style.color = fav ? "#f59e0b" : "#94a3b8";
      favBtn.title = fav ? "已加入我的最愛 (點擊移除)" : "加入我的最愛 (點擊加入)";
    }
    function handleReviewFav(btn, id) {
      const isFav = toggleFavorite(id);
      btn.textContent = isFav ? "★" : "☆";
      btn.style.color = isFav ? "#f59e0b" : "#94a3b8";
    }
    
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const reviewContainer = document.getElementById("review-container");
    
    document.getElementById("start-btn").addEventListener("click", startQuiz);
    prevBtn.addEventListener("click", () => navigate(-1));
    nextBtn.addEventListener("click", () => navigate(1));
    submitBtn.addEventListener("click", showResults);

    const favBtnEl = document.getElementById("fav-btn");
    if (favBtnEl) {
      favBtnEl.addEventListener("click", () => {
        const q = questions[currentQuestionIndex];
        if (!q) return;
        toggleFavorite(q.id);
        updateFavBtn(q.id);
        favBtnEl.style.transform = "scale(1.35)";
        setTimeout(() => { favBtnEl.style.transform = "scale(1)"; }, 150);
      });
    }

    function startQuiz() {
      if (!questions || questions.length === 0) {
        alert("目前沒有可測驗的題目！請先將題目加入收藏。");
        return;
      }
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      
      // Shuffle questions
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = questions[i];
        questions[i] = questions[j];
        questions[j] = temp;
      }
      
      // Shuffle options
      questions.forEach(q => {
        if (q.options) {
          let keys = Object.keys(q.options);
          for (let i = keys.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = keys[i];
            keys[i] = keys[j];
            keys[j] = temp;
          }
          q.shuffledKeys = keys;
        }
      });
      
      loadQuestion(0);
    }
    
    function loadQuestion(index) {
      currentQuestionIndex = index;
      const q = questions[index];
      
      questionText.textContent = q.question;
      updateFavBtn(q.id);
      
      const catDiv = document.getElementById("question-category");
      if (catDiv && ('2012-2014年 歷屆試題全彙整'.includes('隨機') || '2012-2014年 歷屆試題全彙整'.includes('最愛'))) {
          catDiv.style.display = "block";
          catDiv.textContent = q.manualChapter ? "分類：" + q.manualChapter : "分類：未分類";
      }
      
      const imgContainer = document.getElementById("image-container");
      const imgEl = document.getElementById("question-image");
      if (q.image) {
        imgEl.src = q.image;
        imgContainer.classList.remove("hidden");
      } else {
        imgContainer.classList.add("hidden");
      }
      
      optionsContainer.innerHTML = "";
      if (q.options) {
        let keysToUse = q.shuffledKeys || Object.keys(q.options);
        const displayLetters = ["A", "B", "C", "D", "E", "F", "G", "H"];
        keysToUse.forEach((key, optIdx) => {
          const value = q.options[key];
          const btn = document.createElement("button");
          btn.className = "option-btn";
          const dLetter = displayLetters[optIdx] || key;
          
          let html = "<strong>" + dLetter + ".</strong> " + value;
          
          if (isReviewMode || selectedAnswers[index] !== null) {
             btn.disabled = true;
             if (key === q.answer) {
               if (q.multiAnswer) {
                 btn.classList.add("multi-correct");
                 html += ' <span style="float:right; font-weight:bold; color:#854d0e;">✓ 正確答案 (官方複選: ' + q.multiAnswer + ')</span>';
               } else {
                 btn.classList.add("correct");
                 html += ' <span style="float:right;">✓ 正確答案</span>';
               }
             } else if (selectedAnswers[index] === key) {
               btn.classList.add("wrong");
               html += ' <span style="float:right;">✗ 你的作答</span>';
             }
          } else {
             btn.addEventListener("click", () => selectOption(key));
          }
          

          btn.innerHTML = html;
          optionsContainer.appendChild(btn);
        });
        
        const curExp = q.explanation || q.analysis;
        if ((isReviewMode || selectedAnswers[index] !== null) && curExp) {
          const expDiv = document.createElement("div");
          expDiv.className = "explanation-box";
          expDiv.innerHTML = "<strong>💡 解析：</strong><br>" + curExp.replace(/\n/g, "<br>");
          optionsContainer.appendChild(expDiv);
        }

      }
      
      document.getElementById("source-tag").textContent = "ID: " + q.id + " | 來源: " + (q.source || "無");
      
      updateNavButtons();
      updateProgress();
    }
    
    function selectOption(key) {
      if (isReviewMode || selectedAnswers[currentQuestionIndex] !== null) return;
      selectedAnswers[currentQuestionIndex] = key;
      loadQuestion(currentQuestionIndex);
    }
    
    function navigate(direction) {
      const newIndex = currentQuestionIndex + direction;
      if (newIndex >= 0 && newIndex < questions.length) {
        loadQuestion(newIndex);
      }
    }
    
    function updateNavButtons() {
      prevBtn.classList.toggle("hidden", currentQuestionIndex === 0);
      nextBtn.classList.toggle("hidden", currentQuestionIndex === questions.length - 1);
      
      // Always show submit button, rename to "結束測驗" if not already done in HTML
      submitBtn.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = (currentQuestionIndex === questions.length - 1) ? "結束作答" : "錯題回顧";
    }
    
    function updateProgress() {
      progressText.textContent = "問題 " + (currentQuestionIndex + 1) + " / " + questions.length;
    }
    
    function showResults() {
      isReviewMode = true;
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      
      const answeredCount = selectedAnswers.filter(a => a !== null).length;
      const correctCount = selectedAnswers.filter((a, i) => a === questions[i].answer).length;
      const wrongCount = answeredCount - correctCount;
      const unansweredCount = questions.length - answeredCount;
      const percentage = Math.round((correctCount / questions.length) * 100);
      
      let scoreHtml = "";
      if ('2012-2014年 歷屆試題全彙整'.includes('隨機')) {
          const scorePerQuestion = questions.length === 25 ? 4 : (questions.length === 50 ? 2 : 0);
          const totalScore = correctCount * scorePerQuestion;
          scoreHtml = "<br><br><span style='color: #0369a1; font-size: 1.5rem; font-weight: bold;'>測驗分數：" + totalScore + " 分</span>";
      }
      document.getElementById("final-stats").innerHTML = "答對 <span style='color: var(--success); font-weight: bold;'>" + correctCount + "</span> 題 / 答錯 <span style='color: var(--error); font-weight: bold;'>" + wrongCount + "</span> 題" + scoreHtml;
      
      reviewContainer.innerHTML = "";
      questions.forEach((q, i) => {
        if (selectedAnswers[i] !== null && selectedAnswers[i] !== q.answer) {
          const div = document.createElement("div");
          div.className = "review-item incorrect";
          
          let optionsHtml = '<ul class="review-options">';
          if (q.options) {
             let keysToUse = q.shuffledKeys || Object.keys(q.options);
             const displayLetters = ["A", "B", "C", "D", "E", "F", "G", "H"];
             keysToUse.forEach((k, optIdx) => {
                let v = q.options[k];
                let dLetter = displayLetters[optIdx] || k;
                let liClass = "";
                let label = "";
                if (k === q.answer) {
                   if (q.multiAnswer) {
                      liClass = "is-multi-correct";
                      label = " (正確答案 - 官方複選: " + q.multiAnswer + ")";
                   } else {
                      liClass = "is-correct";
                      label = " (正確答案)";
                   }
                } else if (k === selectedAnswers[i]) {
                   liClass = "is-wrong";
                   label = " (你的作答)";
                }
                optionsHtml += '<li class="' + liClass + '">' + dLetter + '. ' + v + label + '</li>';
             });
          }
          optionsHtml += "</ul>";
          
          
          let reviewExpHtml = '';
          const reviewExp = q.explanation || q.analysis;
          if (reviewExp) {
            reviewExpHtml = '<div class="explanation-box"><strong>💡 解析：</strong><br>' + reviewExp.replace(/\n/g, "<br>") + '</div>';
          }
          
          const favState = isFavorited(q.id);
          const favStar = favState ? '★' : '☆';
          const favColor = favState ? '#f59e0b' : '#94a3b8';
          div.innerHTML = '<div class="review-question" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">' +
            '<div>' + (i + 1) + '. ' + q.question + '</div>' +
            '<button type="button" onclick="handleReviewFav(this, ' + q.id + ')" style="background: none; border: none; cursor: pointer; font-size: 1.5rem; line-height: 1; color: ' + favColor + '; padding: 0 4px; flex-shrink: 0;" title="加入/取消我的最愛">' + favStar + '</button>' +
          '</div>' +
            optionsHtml + reviewExpHtml +
            '<div class="source-tag">ID: ' + q.id + ' | 來源: ' + (q.source || '無') + '</div>';

          reviewContainer.appendChild(div);
        }
      });
      if (reviewContainer.innerHTML === "") {
        reviewContainer.innerHTML = '<p class="text-center">太棒了！您全答對了！</p>';
      }
    }
    
    
  </script>
</body>
</html>
