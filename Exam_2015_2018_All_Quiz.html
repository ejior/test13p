9,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關潛水急症的敘述，何者為非？","options":{"A":"因潛水下降時的壓力創傷又叫擠壓性（squeeze）創傷","B":"縱膈腔氣腫.皮下氣腫及氣胸都常見於下降時所產生的擠壓性創傷","C":"任何病患在潛水後12至36小時內出現症狀，都應懷疑減壓病（decompression sickness）的可能","D":"氮醉（Nitrogen narcosis）是因為在較深的水下，血中的氮分壓較正常高，產生類似酒精的鎮靜作用"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":980,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"50歲男性於台北市登象山（海拔約183公尺）返家後，於家中產生頭暈及步態不穩之現象，家人發現後打119求助。經到場初步評估後，病患生命徵象穩定但有步態不穩及口齒不清之狀況，現場處置後轉送醫院。請問下列有關此病患的敘述何者為非？","options":{"A":"此病患疑似急性腦中風，應送往有能力處置急性腦中風之急救責任醫院","B":"此病患因為登象山後產生神經學異常，應該將急性高山病列入鑑別診斷，情況惡化有可能產生腦水腫","C":"急性高山病是常見的高山疾病，症狀可在到高地4～6小時內產生，最嚴重的症狀常在到達高地的24～48小時內發生","D":"急性高山病可用藥物預防，如丹木斯（Diamox）.類固醇（Steroid）等等，但發生急性高山病症狀後，最重要的是趕緊下降高度"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":981,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"在面對兒童急症時，我們常常會使用到兒童評估評估三角來初步評估兒童的病情，有關兒童評估三角，何者為非？","options":{"A":"兒童外觀，視其意識狀態及肌肉張力","B":"兒童呼吸，視其呼吸速率及其呼吸費力程度","C":"兒童瞳孔，視其有無放大或縮小","D":"兒童循環，視其膚色及皮膚狀況"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":982,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"年輕媽媽神情緊張的抱著出生不久的小孩衝進分隊，表示小朋友剛在家餵完奶後，呼吸淺慢且呼吸音嘈雜。你診視後發現此名嬰兒膚色發紺，意識不清，於是在請求支援後馬上進行復甦。請問下列有關小兒呼吸道及胸腔的敘述，何者為非？","options":{"A":"小於6個月的嬰兒主要是依賴鼻部呼吸，鼻孔被分泌物阻塞即會造成嬰兒呼吸窘迫，適時的抽吸鼻部分泌物是很重要的","B":"將折疊之毛巾置於大於3歲的兒童枕部，有助於建立嗅吸姿勢以維持呼吸道暢通","C":"兒童呼吸道最窄的位置在聲帶下方的環狀軟骨，這點與大人不同","D":"兒童胸腔肋骨因含有較多軟骨而有彈性，故發生胸腔創傷時較能吸收外來的能量，不易產生肺挫傷和壓力損傷"},"answer":"D","manualChapter":"CH48"},{"id":983,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"80歲的老先生在家中大吼大叫亂摔東西，被家人發現打119求助。你到了現場初步評估，發現老先生雖然胡言亂語但生命徵象均正常，聞起來酒氣很重，進一步詢問下其家人提及老先生還有失智的病史，請問下列有關行為急症及老人神經症狀的表現，何者為非？","options":{"A":"失智症是對時間和地點慢慢進展的記憶喪失，但即使病患有失智症的病史，也應該把病患當作譫妄來處理，因為有可能是危及生命的急症","B":"酒癮判定可以用CAGE（Cut down.Annoyance.Guilty.Eye opener）來輔助篩檢","C":"精神狀態檢查五步驟包括觀察病患外觀.病患言語特徵.病患情緒特徵.評估病患思想以及決定病患定向感","D":"這位80歲的老先生酒氣很重，而且沒有局部神經學症狀，不會是腦血管疾病所引起之意識障礙"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":984,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關婦產科急症的相關敘述，何者為非？","options":{"A":"前置胎盤可能跟前胎剖腹產.胎盤較大及子宮血管循環不良有關。通常會引起下腹劇烈疼痛，出血量可能會危及生命","B":"早產的危險因子包括外傷.前胎早產.泌尿道感染.多胎妊娠及子宮構造異常","C":"產後出血為產後期常見的併發症，其定義為產後大於500cc的出血。變大的子宮排空後必須收縮以控制出血，產後子宮無法適當收縮是出血最常見的原因","D":"子癇前症亦稱妊娠毒血症，通常發生於第一胎。病患在懷孕時會出現高血壓.水腫及尿蛋白，通常發生於懷孕第三期。若同時發生癲癇情況則稱為子癇症"},"answer":"A","manualChapter":"CH49","matchedChapters":["CH49"]},{"id":985,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"18歲女性病患，去KTV唱歌因喝下他人請的飲料後自覺有異，於是起身離開並由室友打119求助。你抵達時發現此名病患情緒高亢且焦躁不安，生命徵象如下：呼吸每分鐘28下、脈搏每分鐘136下、血壓為190/100 mmHg、體溫為37.8℃。理學檢查可見瞳孔略放大、光反射不明顯，另有全身發汗的現象，其他部分則未見明顯異常。請問下列敘述及處置何者為非？","options":{"A":"這名女性病患很有可能是攝入了中樞神經刺激劑的物質","B":"古柯鹼在美國是最受歡迎的非法藥物之一，藥物治療一開始的首選為鎮靜安眠藥（ben-zodiazepines）","C":"安非他命成癮的病患，突然停用會產生所謂的“當機crash”階段，會變的憂鬱.想自殺，沒有條理的思考.行為或接近昏迷","D":"搖頭丸（MDMA）當初在醫療上的用途是用來治療注意力障礙或活動過渡症（ADHD），後來才衍生出濫用問題"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":986,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"72歲男性病，在家中因不明原因將漂白水及無煙鹽酸於密閉的浴室中混合，病患因吸入產生的氣體，約30分鐘開始感覺頭暈，並於5小時後愈來愈喘，其他臨床症狀包括頭暈、盜汗、眼睛疼痛流淚、鼻腔疼痛、流鼻水還有咳嗽。經家人撥打119後送醫，到院後的胸部X光顯示病患有急性肺水腫。請問下列有關此病患及有毒氣體的敘述，何者為非？","options":{"A":"以此病患的症狀及臨床表現加理學檢查，病患很可能是吸入了混合後產生的氯氣","B":"常見的家用瓦斯若吸入過量，同樣也會產生呼吸道刺激的問題而進一步產生肺水腫","C":"工廠及燃燒的塑膠.家具還有建築物會產生氰酸，此為高度毒性的細胞窒息劑，需趕決就醫使用氰酸的解毒劑","D":"硫化氫為類似氰酸的高毒性細胞窒息劑，具有易於辨認的特殊臭蛋味"},"answer":"B","manualChapter":"CH50"},{"id":987,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於冷熱急症的特色，何者為是？","options":{"A":"熱痙攣多因劇烈運動或做吃重的工作，產生肌肉疲憊所致，通常為短暫的.間歇性的，但也可以很嚴重","B":"熱衰竭的特質是有輕度的神智失常.頭暈.噁心.頭痛等症狀，及輕度至中度的中心體溫升高，可高至39℃","C":"重度低體溫病人可能沒有生命徵象，包括測不到呼吸.脈搏及血壓","D":"以上皆是"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":988,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於老人急症的說明，何者為是？","options":{"A":"腎血流量從30歲到80歲時平均會降低50%","B":"瞻妄是突然對時間和地點產生混亂，通常是身體疾病造成的。失智症是對時間和地點慢慢進展的記憶喪失，通常是腦部疾病的結果","C":"腸胃道出血最常發生在60歲到90歲的病人中，死亡率大約10%","D":"以上皆是"},"answer":"D","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":989,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關新生兒急救流程，何者為是？","options":{"A":"只要心跳有大於每分鐘100下，都不需要正壓給氧","B":"給予正壓呼吸後，心跳仍小於每分鐘60次，則開始胸部按壓","C":"新生兒在還有心跳時都不需給予腎上腺素","D":"保暖並非初步穩定措施的選項"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":990,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列何者為兒童評估三角的要素？","options":{"A":"意識狀態","B":"肌肉張力","C":"呼吸速率","D":"以上皆是"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":991,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於小兒無脈搏心跳停止的評估處置，下列何者為是？","options":{"A":"分為可電擊（心室頻脈/心室顫動）以及不可電擊（無脈搏電氣活動/心搏停止）","B":"可電擊的情況下，第一次電擊電量為4焦耳/公斤","C":"腎上腺素只能靜脈給予，不可骨內注射或經氣管內管給予","D":"低血容，鹼中毒，高低血鉀，高體溫均為可能之原因"},"answer":"A","manualChapter":"CH48"},{"id":993,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關毒蛇咬傷處置，何者為是？","options":{"A":"避開毒蛇的攻擊範圍（大約是毒蛇的一半長度），將病人移至安全的區域","B":"提供病人暢通的呼吸道.維持足夠的通氣狀況以及循環的支持，持續監視病人的生命徵象以及使用心律監視器","C":"在受咬傷的患肢上建立靜脈輸液並且使用容積擴張溶液","D":"傷囗局部的冰敷應該要持續，因為如此可延遲毒液擴散"},"answer":"B","manualChapter":"CH50"},{"id":994,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關中毒症候群的區分，何者為是？","options":{"A":"抗膽鹼性症候群徵候包括心搏過速.皮膚潮紅乾熱.瞳孔擴大.及顏面潮紅","B":"膽鹼性症候群包括頭痛.頭暈.虛弱.心搏過緩.噁心以及“濕的”表現，特點是嚴重的唾液分泌（salivation）.流淚（lacrimation）.排尿（urination）.排便（defecation）.腸胃道不適（gastrointestinal upset）以及嘔吐（emesis）","C":"仿交感神經作用徵候包括血壓升高.心搏過速.瞳孔放大以及意識改變（包括偏執性妄想症）。嚴重的病人會產生心血管衰竭。到院前的緊急處置包括：確保人身安全以及提供呼吸道.通氣以及循環的支持性治療","D":"以上皆是"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":995,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"外傷救護勤務，病患為懷孕36周孕婦，車禍無明顯外傷，血壓80/60 mmHg，您在運送時想採取左側躺是為了？","options":{"A":"避免脹大子宮壓迫腹主動脈","B":"避免脹大子宮壓迫下腔靜脈而影響血液回流","C":"較易運送","D":"避免脹大子宮壓迫骨盆神經叢"},"answer":"B","manualChapter":"CH49"},{"id":996,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"妊娠20週時，子宮底高度大約在何處？","options":{"A":"骨盆腔邊緣處","B":"肚臍附近","C":"肚臍下二指寬處","D":"肚臍與劍突中間"},"answer":"B","manualChapter":"CH49"},{"id":997,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"某女士因為情場不如意又失業，在家裡燒木炭自殺，您到達現場，發現某女士已呈現昏迷的狀態，下列何者為非？","options":{"A":"到達現場必須注意通風，注意施救者的安全","B":"可以使用血氧偵測器（Pulse oximeter）測量其血一氧化碳濃度","C":"一氧化碳中毒的解毒劑是氧氣","D":"必須注意病人呼吸道"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":998,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於低體溫病人之處理，何者為非？","options":{"A":"體溫若攝氏三十二度以上，身體會顫抖來產熱","B":"若是重度低體溫，應該以主動體內回溫處理","C":"體溫低於攝氏三十度，存活機會不大，可直接宣布死亡","D":"台灣低體溫患者以低血糖和敗血症為多"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":999,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"小兒急救最重要的是？","options":{"A":"呼吸道暢通。","B":"建立輸液途徑（IV lines）","C":"拿電擊器Quick look paddle看是否心律不整","D":"給予毛毯，以免失溫"},"answer":"A","manualChapter":"CH48"},{"id":1000,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"人體被咬螫後常於皮膚上呈現特殊性淋巴分佈紅線的有毒海洋生物為？","options":{"A":"水母","B":"河豚","C":"海膽","D":"海葵"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1001,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於野外醫學，以下敘述何者為是？","options":{"A":"高山症的初期症狀和感冒或是宿醉很類似，所以常常被忽略。如果懷疑是高山症，應該避免繼續登高，考慮下山，並且考慮給予Acetazolamide和Dexamethasone","B":"潛水者所併發的氣泡栓塞症，通常在浮到水面的幾分鐘內就會出現。如果沒有嚴重症狀，表示沒有產生潛水伕症，當天便可以搭民航機長途旅行","C":"低伏特數的交流電所造成的致命心律不整常常是無心律（Asystole），而高伏特數的交流電或是直流電所造成的致命心律不整常常是心室顫動（Ventricular fibrillation）","D":"Lichtenberg figure是雷擊病患特有的皮膚表徵，會留下永久的疤痕"},"answer":"A","manualChapter":"CH45"},{"id":1002,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關人體體溫調節的敘述，何者為非？","options":{"A":"皮膚是調節熱散失最重要的組織","B":"人體熱散失主要的機轉為輻射.傳導.對流與蒸發","C":"增加食慾可以增加熱產生","D":"環境溼度越高，蒸發散熱的效果越好"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":1003,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"你到鐵人三項比賽執行醫療組的駐點醫療，目擊一位35歲男性參賽者在你面前抽搐後倒下，你跑到參賽者所在的位置，抽搐已停止（抽搐時間不超過1分鐘），但病人仍躁動不安，皮膚摸起來乾熱發燙，耳溫槍顯示體溫為42.5℃，當時的氣溫為32.0℃，相對濕度為80%，以下敘述何者為是？","options":{"A":"此參賽者為抽搐所造成的惡性高體溫","B":"此參賽者為傳統型中暑","C":"此參賽者為典型的熱衰竭","D":"病患應立即脫除所有衣物並開始降溫"},"answer":"D","manualChapter":"CH55"},{"id":1006,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關於老年病患的譫妄以及失智症的比較，下列敘述何者為非?","options":{"A":"譫妄是突然對時間和地點的認知產生混亂，失智症則是對時間和地點慢慢進展的記憶喪失","B":"譫妄的原因通常和器質性腦病變有關，也和酒精或藥物作用有關","C":"失智症的病患可能會嘗試虛構故事來取代記憶的缺陷","D":"譫妄和失智症一樣，並不會產生危及生命急症的狀況"},"answer":"D","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":1007,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"一位55歲的男性帶著一只布袋到消防分隊，自訴遭到布袋內的毒蛇（如圖）咬傷右手掌，現在右手掌異常疼痛並腫脹，咬傷處並發現清晰的毒牙咬痕與血泡，以下敘述何者為是？","options":{"A":"應該盡速在右手腕處綁上止血帶，以避免毒液擴散","B":"腫脹疼痛的右手掌應立刻給予冰敷以消腫止痛","C":"這是出血性毒蛇咬傷，根據一般原則，龜殼花咬傷以及百步蛇咬傷可以使用同一種血清治療","D":"依據外型判斷，布袋內的毒蛇是百步蛇"},"answer":"D","manualChapter":"CH50","image":"題庫圖片/1007.png"},{"id":1008,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"救護出勤，現場為一名75歲男性老農夫，倒臥半封閉的浴室內，現場充滿農藥味。初評發現病患意識昏迷、全身出汗、口鼻充滿分泌物、瞳孔雙側皆為針狀瞳孔。關於此病患的狀況，以下敘述何者為非？","options":{"A":"這是有機磷農藥中毒，會經由呼吸以及皮膚接觸造成中毒，所以現場為不安全的環境，須盡速將病患移至通風處評估處置。","B":"病患可能會無預警的產生呼吸癱瘓或停止呼吸的現象，須考慮進階呼吸道處置。","C":"病患在送醫途中可能會產生癲癇發作的情況，可用Diazepam治療。","D":"此種農藥中毒的解毒劑是Diazepam"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1009,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"有關酒精對人體的影響，下列敘述何者為非？","options":{"A":"酒精的利尿效果會造成電解質不平衡","B":"長期酗酒可能造成嚴重的消化系統疾病，如：肝硬化.腸胃道出血或胰臟炎","C":"酒精可以擴張血管，所以對心血管系統不會造成任何影響","D":"長期濫用酒精會造成免疫系統的抑制"},"answer":"C","manualChapter":"CH46"},{"id":1010,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於新生兒須接受正壓呼吸的適應症，下列何者為非？","options":{"A":"呼吸暫停","B":"呼吸窘迫","C":"心跳小於每分鐘120下","D":"雖然給予100%氧氣仍有持續發紺的情況"},"answer":"C","manualChapter":"CH48"},{"id":1011,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於嬰幼兒發生陣發性心室上頻脈（PSVT），下列何者為非？","options":{"A":"在嬰兒陣發性心室上頻脈速率多大於每分鐘220下，小孩心跳速率多大於每分鐘180下","B":"可藉由刺激迷走神經而延緩房室結傳導來終結陣發性心室上頻脈，所以應該優先使用頸動脈竇按摩","C":"Adenosine是治療陣發性心室上頻脈首選藥物，快速靜脈注射0.1 mg/kg，也可經由骨針給予","D":"在嬰幼兒，最有效的迷走刺激為冰敷臉10至15秒"},"answer":"B","manualChapter":"CH48"},{"id":1012,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於重度低體溫中心體溫＜攝氏30度病人的照顧，下列何者為是？","options":{"A":"評估呼吸及脈搏10秒，再決定是否開始心肺復甦術","B":"如脈搏摸不到，立即每5分鐘靜脈給予急救藥腎上腺（Epinephrine）1 mg","C":"竇性心搏過慢，須使用心臟節律器","D":"根據2015新版美國心臟學會（AHA）建議，對心跳停止後恢復自發性循環（ROSC）維持32～36℃至少24小時"},"answer":"D","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":1013,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於精神狀態檢查五步驟，下列何者為非？","options":{"A":"觀察病患外觀，例如亢奮／冷漠／混亂／理性","B":"病患言語與情緒特徵","C":"評估病患生命徵象","D":"決定病患定向感（人.事.時.地.物）"},"answer":"C","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":1014,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"老人急症中，關於瞻妄與失智的敘述，下列何者為是？","options":{"A":"瞻妄為對時間和地點慢慢進展的記憶喪失","B":"失智症為突然對時間和地點產生混亂","C":"瞻妄跟器質性腦病變有關，也跟酒精中毒和戒斷、藥物作用、發燒、代謝性疾病、腫瘤有關，多為不可逆","D":"失智症通常和中風、基因、病毒、阿茲海默症有關，多為不可回復"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1015,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"對於常見毒素或毒藥物相對應的解毒劑，下列何者為非？","options":{"A":"有機磷（Organophosphates）：Atropine.PAM（Pralidoxime）","B":"三環抗憂鬱劑（Cyclic antidepressants）：N-acetylcysteine（Fluimucil）","C":"鴉片類麻醉劑（Opiates）：Naloxone","D":"甲醇（Methanol）：Ethanol（乙醇）"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1016,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於疑似性侵案件的處理，下列何者為是？","options":{"A":"盡可能問到病患被性侵之詳細過程","B":"應該於現場進行會陰部的檢查，檢視有無傷口","C":"需儘快以生理食鹽水清洗傷口及會陰部","D":"將病患移至救護車以提供病患之隱私"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":1018,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下面這張12導程心電圖，最可能發生在下列何種狀況的病患身上？","options":{"A":"低體溫","B":"急性心肌梗塞","C":"低血鉀","D":"毛地黃中毒"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/1018.png"},{"id":1019,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列於憂鬱症的描述，何者為非？","options":{"A":"可能與腦內生物傳導.內分泌.大腦構造等有關","B":"與基因遺傳無關","C":"與生活壓力.重大創傷.和嚴重失落打擊有關","D":"有些婦女在產後會有憂鬱症的狀況產生"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1020,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列病史或症狀最不可能是肺栓塞的危險因子？","options":{"A":"單侧下肢腫脹水腫","B":"惡性腫病史","C":"長期臥床","D":"糖尿病"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1021,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"根據2015年美國心臟學會與美國兒科醫學會所共同制定的最新版新生兒急救術（Neonatal Resuscitation Program），下列敘述何者為是？","options":{"A":"黃金一分鐘是指情況緊急的新生兒，自開始接觸評估後一分鐘內要開始給予壓胸急救","B":"新生兒是否需要開始急救要先評估是否足月.膚色是否紅潤.有無呼吸與哭泣.與肌張力，上述任一項不正常則要開始進行新生兒急救術的系列評估與處置","C":"足月兒若只需要正壓呼吸，剛開始的時候給予室內空氣（Room air）即可","D":"正壓呼吸的速度為每3～5秒給一口氣"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1022,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"氣喘與急性細支氣管炎都是造成小兒哮鳴（wheezing）的常見呼吸道急症，下列關於兩者的比較敘述何者為是？","options":{"A":"細支氣管炎好發在3歲以上的幼兒，而氣喘兒大多從嬰兒時期就被診斷出來","B":"兩者的X光表現都為單側肺部過度換氣","C":"類固醇為氣喘的建議用藥，但卻不是細支氣管炎病童的標準治療","D":"吸入性氣管擴張劑可減緩兩者的症狀，且縮短兩者的住院天數"},"answer":"C","manualChapter":"CH48"},{"id":1023,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"詢問產婦過去生產史時，常以G與P來記錄。請已經問一位G4P2的孕婦，過去總共流產或墮胎幾次？","options":{"A":"一次","B":"二次","C":"四次","D":"六次"},"answer":"A","manualChapter":"CH49"},{"id":1024,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"救護技術員在野外常需照護傷口，有時甚至可能長達數天。在野外環境，對傷囗照護的描述何者為非？","options":{"A":"靜眽出血也可能會致死","B":"對於有被泥土或其他髒東西污染的傷囗，可以使用針筒配上針頭給予高壓沖洗","C":"在野外可以拿來喝的水就可以用來沖洗傷囗","D":"野外環境下，建議為傷囗暴露24小時之後，再進行初步縫合以避免後續感染發生"},"answer":"D","manualChapter":"CH45"},{"id":1025,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"某青年因感情因素服用大量不明物質。你到達現場時發現病患大吼大叫，神智不清，瞳孔放大，心跳加速，臉色脹紅但皮膚與嘴唇囗腔乾燥。下列何者最可能是此病患服用的物質？","options":{"A":"抗組織胺","B":"安非他命","C":"有機磷","D":"海洛因"},"answer":"A","manualChapter":"CH16"},{"id":1026,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關台灣常見六大毒蛇及其血清的敘述，何者為是？","options":{"A":"青竹絲和無毒的青蛇在外觀上無法區分","B":"龜殼花和百步蛇同屬出血性毒液毒蛇，所以血清可共用","C":"飯匙倩以及雨傘節同屬神經性毒液毒蛇","D":"毒蛇咬傷後，須立即以止血帶綁住近心端，並在局部冰敷，以防止毒液擴散全身"},"answer":"C","manualChapter":"CH50"},{"id":1027,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"急性高山症的敘述，下列何者為非？","options":{"A":"症狀可能在到達高地後數個小時內發生","B":"緊急處置包括給氧及盡快降低高度","C":"吃低碳水化合物食物可預防高山症","D":"位於梨山賓館還不至於會引發高山症"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":1028,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"出勤馬拉松賽事救護，到達現場發現30歲男性，身上別有馬拉松比賽選手的號碼布，意識昏迷對痛無反應，皮膚乾燥，呼吸10秒鐘5下，橈動脈摸得到，耳溫槍顯示41℃。下列敘述何者最正確？","options":{"A":"病人是心肌梗塞，須立即後送至可做心導管的醫院","B":"病人是急性熱衰竭，須立即降溫以保全生命","C":"病人是急性熱中暑，須立即降溫以保全生命","D":"病人是腦中風，需送至二十四小時有神經內外科醫師待命的院"},"answer":"C","manualChapter":"CH55"},{"id":1029,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"長期酗酒對人體消化系統的影響，下列敘述何者最正確？","options":{"A":"長期酗酒病人腸胃道出血的原因只和食道靜脈曲張有關，和胃潰瘍無關","B":"長期酗酒病人會產生肝硬化以及腹水，但是不會影響凝血因子的生成","C":"長期酗酒病人會有急慢性胰臟炎生成的可能性，並誘發糖尿病的產生","D":"長期酗酒病人生成肝硬化的機轉未知，急性胰臟炎則是酒精的毒性引起"},"answer":"C","manualChapter":"CH46"},{"id":1030,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"觀光客誤闖果園，吃了堆放路邊的橘子後昏倒。你出勤到達現場，發現約50歲男性，滿臉汗水眼淚口吐白沫，意識昏迷對痛無反應，皮膚溼冷發紺，呼吸呈現瀕死式呼吸但頸動脈得到，兩側瞳孔呈現針孔。當地果農說，病人吃的橘子是用來毒殺猴子的。下列敘述何者最正確？","options":{"A":"病人是巴拉刈中毒，預後不佳","B":"病人是除蟲菊精中毒，須施打解毒劑並需要呼吸支持","C":"病人是有機磷農藥中毒，解毒劑包括Atropine以及Pralidoxime","D":"病人是年年春中毒，需插管維持呼吸道以避免吸入性肺炎"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH40"]},{"id":1031,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"有關海洋生物產生的毒素，下列敘述何者最正確？","options":{"A":"海洋生物特化的毒液裝置皆是用來防衛的，很少用來捕捉獵物","B":"水母的毒液中毒程度和刺囊細胞刺人的數目有關，和受害者身體狀況無關","C":"海洋生物產生的毒素對熱敏感，將受傷部位浸泡溫水可以破壞毒素","D":"被水母螫傷後須立即以大量清水清洗，如此可以破壞刺囊細胞"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1032,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"你和山域搜救隊搭乘直升機直達海拔3,311公尺的嘉明湖畔紮營。一夜失眠後，你在隔天清晨發現自己劇烈頭痛，頭重腳輕，食不下嚥。下列敘述何者為是？","options":{"A":"這是感冒症狀，為了完成任務，可往更高海拔的地方前進","B":"這急性高山病，除了降低高度和給氧，沒有任何藥物和其他方式可以治療","C":"如果開始出現步態不穩，可能會在24小時內昏迷","D":"如果會對丹木斯（Diamox）過敏，則沒有其他可替代的治療藥物"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":1033,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關準自殺行為與自殺病患的描述，何者為是？","options":{"A":"女性的準自殺行為較多，而且女性的自殺成功率也比男性高","B":"酒精成癮病患因為有酒精的鎮靜效果，所以自殺危險性較低","C":"自殺的危險因素包括單身或離婚或分居，退休或沒有職業","D":"自殺及準自殺病患大多是臨時起意，和精神疾病沒有相關"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1082,"source":"第四章 非創傷急症(2015-2018).doc","question":"一位平時有酒癮的病患，突然發生抽搐，造成頭部外傷，且意識不清，以下作法何者為非？","options":{"A":"應測量血糖並給予維他命B1補充","B":"為了避免影響判斷是否為酒精戒斷所引起的抽搐，應避免給予Lorazepam此類鎮靜藥物","C":"此時不應給予Flumazenil此類鎮靜劑之拮抗藥物，因可能再引發抽搐","D":"有可能是酒精造成的意識不清，但仍需注意是否有腦出血的可能"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1083,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於有冠狀動脈性心臟病病史的急性胸痛病患，以下敘述何者為非？","options":{"A":"進行到院前12導程心電圖檢查有助於縮短ST波段上升型心肌梗塞進行心導管的時問","B":"對於典型胸痛且無相關禁忌症的病患，應給予Aspirin服用","C":"建議給予氧氣鼻管3L/min，以改善潛在的心臟缺氧狀況","D":"如果使用NTG，無論男女應先確認病患有無服用Viagra這類磷酸二酯抑制劑藥物"},"answer":"C","manualChapter":"CH34"},{"id":1084,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於穩定規則窄QRS波頻脈，以下敘述何者為非？","options":{"A":"若發生於孕婦身上，因可能影響胎兒心律，因此不應使用Adenosine","B":"除了Adenosine之外，亦可選擇乙型腎上腺受體阻斷劑、毛地黃加以治療","C":"若使用鈣離子阻斷劑不必擔心引發有氣喘病史病患的氣喘","D":"若藥物治療無效，可考慮電擊整流"},"answer":"A","manualChapter":"CH49"},{"id":1085,"source":"第四章 非創傷急症(2015-2018).doc","question":"一位25歲年輕女性，出現眼睛凸出、脖子腫的情形，以下敘述何者為非？","options":{"A":"心電圖可能出現竇性心搏過速或心房纖維顫動","B":"病史上常可發現體重減輕、怕熱的情形","C":"此疾病俗稱「大脖子」，應補充碘鹽","D":"若出現發燒、意識不清、肚子痛的情形，是危及生命的緊急狀況，應立刻就醫"},"answer":"C","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":1086,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於身上突然出現多處瘀斑的病患，以下敘述何者為非？","options":{"A":"此為凝血功能障礙，應檢查血小板數量與功能以及肝臟製造凝血因子能力","B":"血友病病患雖無外傷，也可能有自發性出血，但多以深部組織出血為主","C":"對於自發性出血的病患，為避免造成傷口及出血不止，不應進行靜留置針注射","D":"即便血小板數量正常，仍有可能出現自發性的出血"},"answer":"C","manualChapter":"CH39"},{"id":1087,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於過敏的描述，以下敘述何者為非？","options":{"A":"局部性的過敏反應並不會影響到全身，治療最有效的藥物是Diphenhydramine","B":"嚴重過敏病患休克的原因是因為呼吸道阻塞、水腫，最好的治療是給予氣管擴張劑","C":"如果出現聲音沙啞舌頭水腫、喘鳴等，應評估是否要早期插管","D":"嚴重過敏最有效的治療藥物是腎上腺素"},"answer":"B","manualChapter":"CH16"},{"id":1089,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於疥瘡，以下敘述何者為非？","options":{"A":"若病患有在使用類固醇，病症會較不典型，不易診斷","B":"治療疥瘡常用的疥瘡乳劑不適用於孕婦","C":"疥瘡患者接觸過的床單、被褥、枕頭套應以塑膠袋密封兩週使成蟲及蟲卵死亡","D":"疥蟲孵化只需3天，因此若懷疑接觸疥瘡患者，一週以上沒有症狀，就不用擔心感染"},"answer":"D","manualChapter":"CH42"},{"id":1091,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關於成人呼吸窘迫症（adult respiratory distress syndrome,ARDS）的敘述，下列何者為非？","options":{"A":"是一種猛爆型的呼吸衰竭","B":"急性的肺發炎和廣泛性的肺泡及微血管傷害為特徵","C":"這症候群通常不會因為其他的傷害或疾病所引起","D":"這類病患的肺部會變得又濕又重，肺泡彈性變差使氣體擴散能力大幅下降"},"answer":"C","manualChapter":"CH35"},{"id":1092,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關洛杉磯到院前腦中風評量表的評量項目，以下敘述何者為非？","options":{"A":"症狀發生在24小時內。","B":"下列三項中任何之一有單側不對稱的情形：臉部表情、握力、手臂力量的強度","C":"年紀大於35歲","D":"病患平常不是坐輪椅或長期臥床"},"answer":"C","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":1094,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關於肺動脈栓塞的維爾氏評分系統（well's scoring system），下列敘述何者為是？","options":{"A":"臨床上懷疑深部靜脈血栓：3.0分","B":"其他替代診斷可能性低：3.0分","C":"在過去四周曾接受外科手術或臥床少動：1.5分","D":"以上敘述皆為正確"},"answer":"D","manualChapter":"CH34"},{"id":1095,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關於急性肺水腫無合併低血壓及休克第一線治療的敘述，下列何者為非？","options":{"A":"furosemide（lasix）靜脈注射是第一線治療","B":"morphine靜脈注射是第一線治療","C":"nitroglycerin舌下片是第一線治療，nitroglycerin靜脈滴注則是第二線治療","D":"此類病患心臟不佳，氣管插管的刺激太大會惡化病情，故絕不考慮使用"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":1097,"source":"第四章 非創傷急症(2015-2018).doc","question":"65歲男性病患因為意識昏迷，家屬發現後報案，指揮中心派遣高救隊到現場，現場患者意識昏迷對痛沒有反應，膚色蒼白濕冷，呼吸每分鐘6下，脈搏每分鐘24下，血壓50/量不到mmHg，pulse oximeter：60%；病患過去病史為腎衰竭合併洗腎，但根據家屬表示，病患已經有半個月沒有接受血液透析治療，家屬也表示病患拒絕插管以及任何壓胸電擊等急救治療，只要給予藥物；下列敘述何者為是？（送醫時間30分鐘）","options":{"A":"病患不可能是高血鉀引起的腎衰竭病患的併發症","B":"可以線上醫療指導靜脈注射calcium及sodium bicarbonate來治療","C":"病患是腎衰竭患者，因此要絕對限水，不可以幫他打上點滴","D":"腎衰竭病患若是有接受血液透析治療，就絕對不可能有尿液的產生"},"answer":"B","manualChapter":"CH41"},{"id":1098,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關致命性過敏反應，下列敘述何者為非？","options":{"A":"過敏性抗原進入人體後造成白血球釋放組織胺以及白三烯素等物質有關","B":"組織胺以及白三烯素會造成血管擴張以及氣管痙攣而引起循環崩潰和休克進而致命","C":"人體接受抗原的刺激次數越多，越容易產生免疫作用而使過敏反應越輕微","D":"治療的藥物包括腎上腺素、抗組織胺以及類固醇等"},"answer":"C","manualChapter":"CH40"},{"id":1099,"source":"第四章 非創傷急症(2015-2018).doc","question":"44歲男性病患在與朋友飲酒後吐大量鮮血，指揮中心派遣高救隊到現場，現場病患臉色蒼白冒冷汗，意識對痛有反應，脈搏每分鐘120下，血壓80/50mmHg，呼吸每分鐘30次，過去病史以及過敏史不詳，下列敘述何者為是？1.病患疑似為上消化道出血合併休克，Mallory-Weiss症候群不可能為病因2.病患一定有解黑便的症狀3.在時間以及裝備許可的情況下，病患應接受生理食鹽水的輸液治療4.長期酗酒的病患有可能是因為食道靜脈曲張出血造成大量吐血","options":{"A":"1，2，3，4","B":"2，3","C":"3，4","D":"1，4"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":1103,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於後天免疫缺乏症候群（愛滋病）病患的處置原則何者為非？","options":{"A":"愛滋病病患在無症狀潛伏期不易由外表觀察得知，而病患也往往不知道自己已經被感染","B":"對於已知有愛滋病之患者也不要輕忽同時有其他傳染性疾病，例如肺結核的可能","C":"要避免發生針扎事件，萬一不幸發生時，應該立刻擠壓傷口，使血液流出並在流動水下清洗傷口五分鐘","D":"感染愛滋病毒感的機率，遠比B型肝炎來得低，若針扎事件對象已確知有愛滋病之病患，可待檢驗確診後，再開始使用抗病毒藥物以降低感染率"},"answer":"D","matchedChapters":["CH42"],"manualChapter":"CH42"},{"id":1105,"source":"第四章 非創傷急症(2015-2018).doc","question":"一名65歲男性過去僅有高血壓病史，無抽搐或癲癇之病史，突然感到右側肢體無力無法行走而立即打119求救，你到現場發現嘴歪、口齒不清、右手無法平舉現象，他的血糖130mg/dL、血壓210/80mmHg，以下明何者為非？","options":{"A":"依據辛辛那提到院前腦中風評量表（CPSS），該病患有85%可能性為腦中風","B":"依據洛杉磯到院前腦中風評量表（LAPSS），其陽性預測值為97%","C":"為了改善血液灌流不足，可以給予含糖的輸液，以增加腦細胞之存活性","D":"血栓溶解劑（t-PA）被證實可以有效減輕缺血性腦中風的神經症"},"answer":"C","manualChapter":"CH36"},{"id":1107,"source":"第四章 非創傷急症(2015-2018).doc","question":"一位65歲高血壓、心臟病合併慢性腎病之病患，近日經常噁心、嘔吐及食慾不佳，因呼吸困難而打119求救，你到達現場發現雙側肺音囉音，監視器顯示如下圖，以下何者為非？","options":{"A":"此病患呼吸困難可能是因為發生肺水腫","B":"此病患有可能發生致命性心律不整而猝死，建議可以使用calciumchloride","C":"嚴重高血鉀（＞6.5mmol/L）因腎衰竭引起是罕見的","D":"此病患接受規則血液透析治療後不久，發生頭痛、嘔吐急抽搐現象，可能發生不平衡症候群"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/1107.png"},{"id":1110,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關全身立即致命過敏性休克，下列敘述何者為非？","options":{"A":"組織胺釋放","B":"發生血管舒張","C":"心輸出增加，循環崩潰與休克","D":"發生氣管痙攣"},"answer":"C","manualChapter":"CH40"},{"id":1111,"source":"第四章 非創傷急症(2015-2018).doc","question":"根據2010年美國心臟醫學會的建議，以下關於成人心肺復甦術的敘述，何者錯誤？","options":{"A":"腎衰竭病患如果突然發生心肺功能停止時，要把嚴重高血鉀列入鑑別診斷當中","B":"病史詢問時如發現心肺功能停止病患有腎衰竭病史，在醫療指導醫師指示下，可以考慮靜脈注射calcium及sodium bicarbonate","C":"部分不平衡症候群（disequilibrium syndrome）患者於透析的過程中或是結束後八小時內發生","D":"不平衡症候群（disequilibrium syndrome），是末期腎臟病患者因透析過度緩慢所產生的中樞性神經症狀群"},"answer":"D","manualChapter":"CH41"},{"id":1113,"source":"第四章 非創傷急症(2015-2018).doc","question":"以下何者心律是出現窄的QRS波？","options":{"A":"VF","B":"VT","C":"Torsadesdepoints","D":"2度II AV block"},"answer":"D","manualChapter":"CH16"},{"id":1114,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於小孩之CPR，最重要優先之處置是？","options":{"A":"快速建立IV","B":"儘快給予電擊","C":"維持呼吸道通暢與呼吸動力","D":"注射藥物Epinephrine"},"answer":"C","manualChapter":"CH13"},{"id":1115,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於呼吸道處置與給藥的叙述，何者正確？","options":{"A":"有顔面創傷，或疑顱底骨折的病患，最適合使用鼻咽呼吸道","B":"若患者頭或頸部受傷，應使用推顎法，避免移動頸部","C":"LMA（喉罩氣道）可以防止吸入性肺炎，是很好的氣管插管替代品","D":"當建立氣管内管後，非脂溶性的藥物皆可經由氣管内管給藥"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1116,"source":"第四章 非創傷急症(2015-2018).doc","question":"電擊與雷擊的急救處理原則，以下何者為非？","options":{"A":"閃電擊中，多人需急救時，應睬反向檢傷分類","B":"閃電擊中導致心臟停止比其他原因造成者，具有較高救活成功率，因些儘管在急救前心臟停止比較久，努力急救仍可能有效地救治","C":"閃電擊中常常造成VF，在急救過程需要多加注意是否需要去顫","D":"雖然大的電流比較會造成嚴重的傷害，家用電也有致死的可能"},"answer":"C","manualChapter":"CH30"},{"id":1117,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於懷孕婦女的急救，以下何者為非？","options":{"A":"應先急救母親，再考慮胎兒","B":"孕婦只要很小的失血量，就會出現壓下降與週邊灌流不足（休克）的徵象","C":"若懷孕大於24週，孕婦儘可能保持左側躺的姿勢。右髖部墊高、長背板左傾15～30度，以減少子宮對主動脈、下腔靜脈的壓迫","D":"當母親心跳停止5分鐘內，剖腹產救出大於24～25週的胎兒，此時胎兒存活機率最高"},"answer":"B","manualChapter":"CH49"},{"id":1118,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於休克描述，下列何者為非？","options":{"A":"只要收縮壓小於90mmHg就是休克","B":"休克患者會有皮膚冰冷，心跳過速，冒冷汗，呼吸困難症狀","C":"休克主要是組織灌流不足，造成氧氣運送不能應付組織代謝所需","D":"可依rate、volume、pump（律水壓）的原則，對休克依序做初步處理"},"answer":"A","manualChapter":"CH26"},{"id":1119,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關量張十二導程心電圖的描述何者為非？","options":{"A":"此為Sinus Bradycardia","B":"心率約每分鐘30～36次","C":"心臟下壁的急性心肌梗塞","D":"V1～V4的ST段下降是對應變化（reciprocal changes）"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/1119.png"},{"id":1120,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關內分泌及代謝急症的配對，何者為非？","options":{"A":"愛迪生疾病（Addison disease）：腎上腺素不足","B":"黏液性水腫（Myxedema）：腎上腺素亢進","C":"酮酸血症：胰島素的缺乏","D":"葛瑞夫茲病：甲狀腺機能亢進"},"answer":"B","manualChapter":"CH37"},{"id":1121,"source":"第四章 非創傷急症(2015-2018).doc","question":"50歲男性，求救原因為意識改變，到達現場時，家人描述今天早上開始解數次大量的便剛突然大吐血了一次後就不省人事，過去病史有肝硬化與肝癌，現場初評發現，病患皮冷，呼吸淺快有雜音，血自口鼻持續冒出，頸動脈微弱且橈動脈摸不到，脈搏約135下/分，呼吸次數約25次/分，血氧濃度85%，意識對痛有些微反應，下列哪個步驟應最優先處置？","options":{"A":"給予高濃度氧氣面罩，提升血氧濃度","B":"接上三導程心律監測器，評估心律","C":"打上兩條大號靜脈管路，快速輸液","D":"清除口鼻血塊，維持呼吸道暢通"},"answer":"D","manualChapter":"非創傷","matchedChapters":["Combine"]},{"id":1122,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關血液的組成與功能，何者為非？","options":{"A":"成人的血液約佔體重的1/13","B":"血球組成中，最多的是血小板","C":"血漿中水約占了90%","D":"血漿中的白蛋白可維持血液與組織液間滲透壓的恆定性"},"answer":"B","manualChapter":"CH12"},{"id":1123,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關嚴重高血鉀的處置與敘述，何者為非？","options":{"A":"靜脈注射Calcium可以最快減少高血鉀對心臟的影響","B":"靜脈注射Sodium bicarbonate可以將鉀離子移除到身體外面","C":"心電圖可以看到QRS變寬和高聳的T波","D":"容易發生在末期腎病變的病患身上"},"answer":"B","manualChapter":"CH16"},{"id":1126,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於藥物給予與路徑選擇，下列何者為非？","options":{"A":"幫孕婦建立IV路徑一般建議在下半身（橫膈以下）","B":"若緊急時無法建立IV路徑，除了IM肌肉注射，Naloxone也可以由氣管內管給藥","C":"大部份的急救藥物都可以由IO骨內注射給予，吸收速度相當於IV靜脈注射","D":"在心臟衰竭合併喘鳴、或洗腎合併血壓降低病患身上給予點滴靜脈輸注須特別小心謹慎，因流速太快可能引發肺水腫導致呼吸困難惡化"},"answer":"A","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":1127,"source":"第四章 非創傷急症(2015-2018).doc","question":"您幫一位OHCA病患緊急氣管內插管，插上後幫病患接上潮氣末二氧化碳監測器（end_tidal C02 monitor/Capnography），繼續進行CPR後，二氧化碳濃度（PETCO2）監測時二氧化碳分壓一直達不到10mmHg，可能原因有好幾個，但以下何者為非？","options":{"A":"心肺功能停止過久，肺部血流無循環","B":"氣管內管前端反折或被血塊等異物塞住","C":"插管位置過深","D":"壓胸下壓深度不足，CPR品質效率不好"},"answer":"C","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":1128,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關影響腦部灌流壓力高低，與下列何項因素無關？","options":{"A":"收縮壓","B":"舒張壓","C":"顱內壓","D":"頸動脈壓"},"answer":"D","manualChapter":"CH26"},{"id":1129,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關周邊型眩暈和中樞型眩暈的區分，下列敘述何者為非？","options":{"A":"周邊型眩暈多因內耳迷路問題造成","B":"周邊型眩暈經多次轉頭可減輕眩暈程度","C":"中樞型眩暈的眼震方向多為單向，且合併對側肢體無力","D":"中樞型眩暈常合併如手腳不協調等症狀"},"answer":"C","manualChapter":"CH36"},{"id":1130,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關腎上腺危象的常見臨床表現，下列敘述何者為非？","options":{"A":"常合併高滲透壓高血糖非酮酸性昏迷症狀表現。","B":"多合併鈉、鉀離子等電解質異常","C":"多合併低血壓","D":"需補充大量輸液"},"answer":"A","manualChapter":"CH37"},{"id":1131,"source":"第四章 非創傷急症(2015-2018).doc","question":"你執行創傷救護時，傷患告訴你他有人類免疫病毒（HIV）感染但有規則服藥、且上次回診時醫師說他的病毒量已測不到。請問下列敘述何者為非？","options":{"A":"若病毒量已經量測不到，即不具有傳染性","B":"不論是接觸懷疑感染或已確認感染的病人，都應須遵守標準防護措施","C":"若遇到此類患者，應戴兩層手套並穿B級以上防護衣才能避免感染","D":"落實個人防護觀念及步驟是最有效的保護方法"},"answer":"C","manualChapter":"CH05"},{"id":1132,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於中風的敘述，何者為非？","options":{"A":"單純從病人臨床上的症狀表現很難區分此病人發生出血性或缺血性腦中風","B":"一般急性腦中風除了大片腦梗塞、腦出血或腦幹中風外，鮮少會造成病患意識不清，所以如病患發生意識不清時，應先排除其他造成病患意識不清的情形，例如低血糖","C":"一般來說，缺血性腦中風特別容易發生在睡眠中或剛睡醒時","D":"如病患之辛辛那提到院前腦中風評量表為陽性時，由於其可能是腦中風的機會高達七成，而高血糖會造成腦中風病患腦部進一步的傷害，因此就算檢測發現病患發生低血糖的情形，也不應給予50%的葡萄糖水或含糖輸液"},"answer":"D","manualChapter":"CH36"},{"id":1133,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於心電圖操作與判定的敘述，下列何者為非？","options":{"A":"黏貼十二導程的胸前導程時，V3是貼在左胸第五肋間的鎖骨中線處","B":"一般正常的PR區間（PR interval）為0.12～0.20秒","C":"V1和V2導程主要是在觀察心室中膈的解剖位置","D":"右心室傳導束傳導阻斷（right bundle branch block，RBBB）在心電圖最大的特徵是在V1及V2導程出現RSR'型態（RSR' pattern）"},"answer":"A","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1134,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於糖尿病酮酸血症（DKA）常見的臨床症狀與表徵，下列何者為非？","options":{"A":"心搏過速","B":"姿態性低血壓","C":"蒼白濕冷的皮膚","D":"腹痛"},"answer":"C","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":1135,"source":"第四章 非創傷急症(2015-2018).doc","question":"中年男性昏倒求救。你在救護車上幫他接上三導程心電圖如下。請問此心律為何？","options":{"A":"第二度第一型房室傳導阻滯","B":"第二度第二型房室傳導阻滯","C":"第三度房室傳導阻滯","D":"竇性心搏過緩併單型性早期心房收縮"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/1135.png"},{"id":1136,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於心包膜填塞的貝克式三症狀（Beck's triad），下列何者不包含？","options":{"A":"低血壓","B":"頸靜脈怒張","C":"意識不清","D":"心音變弱且模糊"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":1138,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關院外「成人生存之鏈（Adult chain of survival）」之排列順序，何者正確？1.進行快速去顫（rapid defibrillation）2.儘早CPR，並強調先作胸部按壓（early CPR）3.立即確認心臟停止並啟動緊急應變系統（Immediate recognition and activation）4.整合的心臟停止後照護（integrated post-cardiac arrest care）5.有效高級救命術（effective advanced life support）","options":{"A":"1，2，3，4，5","B":"2，3，1，5，4","C":"3，2，1，5，4","D":"5，2，1，3，4"},"answer":"C","manualChapter":"CH24"},{"id":1139,"source":"第四章 非創傷急症(2015-2018).doc","question":"50歲男性，與友人聊天時，突然昏倒不醒人事，EMT到現場時發現病患對痛有反應，左側肢體無力。目前生命徵象為：血壓210/140mmHg，脈搏86次/分鐘，呼吸22次/分鐘，SPO2 90％。以下敘述何者為非？","options":{"A":"可給與氧氣","B":"可能為腦血管疾病","C":"為預防呼吸抑制的發生，應放置oral airway","D":"可檢測病人的血糖值（one touch）"},"answer":"C","manualChapter":"非創傷"},{"id":1140,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於「Nitroglycerin」下列敘述何者為非？","options":{"A":"可有效治療狹心病（angina pectoris）","B":"可降低鬱血性心衰竭（CHF）病人之前後負荷（preload）","C":"主要作用是增加心肌收縮，有效治療心臟衰竭","D":"可能會造成低血壓（hypotension）"},"answer":"C","manualChapter":"CH16"},{"id":1141,"source":"第四章 非創傷急症(2015-2018).doc","question":"請問此為何種心率？","options":{"A":"1st degree AV block","B":"Mobitz type I","C":"Mobitz type II","D":"3rd degree AV block"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/1141.png"},{"id":1143,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列何者不屬於體液分佈形休克（Distributive Shock）？","options":{"A":"敗血性休克","B":"神經性休克","C":"過敏性休克","D":"張力性氣胸導致休克"},"answer":"D","manualChapter":"CH26"},{"id":1145,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於會厭炎的敘述，何者為非？","options":{"A":"某些族群罹患會厭炎的盛行率比較高，包括免疫功能低下、脾臟切除的病患","B":"引起會厭炎的病原菌，以A型嗜血桿菌感染最常見","C":"會厭炎通常會使病患出現發燒和喉嚨痛","D":"到院前照護主要是給予病患支持性療法，但要特別注意病患是否出現呼吸窘迫的徵兆"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1146,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於周邊型眩暈和中樞型眩暈的敘述，何者為非？","options":{"A":"周邊型眩暈病患會出現聽力減弱、耳鳴、耳痛及腫脹","B":"周邊型眩暈病患發生眼震時，為多方向眼震","C":"多次轉頭不會減輕中樞型眩暈病患的眩暈程度","D":"中樞型眩暈病患可出現言語不清、站立不穩、手腳不協調等其他神經症狀"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":1147,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列何者為典型胸痛的表現？","options":{"A":"與呼吸相關的胸痛","B":"與姿勢相關的胸痛","C":"有壓痛點的胸痛","D":"與運動相關的胸痛"},"answer":"D","manualChapter":"CH34"},{"id":1148,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於內分泌及代謝急症的敘述，何者為非？","options":{"A":"糖尿病酮酸血症很少會導致病患出現嚴重的意識不清，因此對於出現意識不清的病患，必須要考慮同時合併其他的疾病，例如頭部外傷、中風等","B":"高滲透壓高血糖非酮酸性昏迷的早期症狀通常和水分的流失有關，包括心悸、疲累、意識混亂甚至昏迷","C":"甲狀腺風暴臨床的徵狀包括嚴重的心跳加速、心臟衰竭、心律不整、體溫升高、休克、意識混亂甚至昏迷等","D":"腎上腺危象的病患，容易有血糖濃度上升、鈉鉀離子不平衡、身體含水量流失及血壓下降，使得身體無法維持正常血液循環，而導致病患有生命危險情形"},"answer":"D","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":1149,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列對於腸胃急症的敘述，何者為非？","options":{"A":"大部分的急性腸胃炎是由細菌所引起的，包括沙門氏桿菌、大腸桿菌、志賀氏桿菌等","B":"機械性腸阻塞最常見的原因為手術後的粘黏","C":"憩室炎的臨床症狀包括發燒與腹痛。而因為憩室通常在乙狀結腸較多，因此常常是以左下腹痛為表現","D":"痔瘡分為內痔與外痔，以肛門的梳狀線為分界"},"answer":"A","manualChapter":"CH38"},{"id":1150,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列對於血液疾病的敘述，何者為非？","options":{"A":"地中海型貧血屬於小球性貧血","B":"缺乏第八因子稱為B型血友病","C":"如果血小板小於20,000/uL，可能引起重要器官自發性出血，如腦出血、腸胃道或肺部出血","D":"非何杰金氏淋巴癌早期通常沒有明顯症狀，大多數人開始的症狀就是頸部、腋下或鼠蹊部出現腫大的淋巴結、發燒、夜間流汗或疲倦等"},"answer":"B","manualChapter":"CH39","matchedChapters":["CH39"]},{"id":1151,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列對於腎臟泌尿系統急症的敘述，何者為非？","options":{"A":"在台灣最常見的泌尿道結石成分為草酸鈣","B":"泌尿道感染大多是逆行性的感染，也就是細菌經由尿道逆行而上，造成尿道炎、膀胱炎或急性腎盂腎炎","C":"不平衡症候群的症狀表現可以從輕微的頭痛、頭暈，以至嚴重的意識不清及抽搐","D":"急性副睪炎的病患，讓其躺臥時，並用手輕輕地往上抬起疼痛側的睪丸，並不能緩解病患的疼痛感"},"answer":"D","manualChapter":"CH41"},{"id":1152,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列傳染性疾病，何者非為蟲媒傳染病？","options":{"A":"流行性斑疹傷寒","B":"萊姆病","C":"Q熱","D":"黃熱病"},"answer":"C","manualChapter":"CH43"},{"id":1154,"source":"第四章 非創傷急症(2015-2018).doc","question":"許多藥物可能引發血壓偏低，但下列藥物何者為非？","options":{"A":"Amiodarone","B":"Naloxone","C":"Nitroglycerin","D":"Lasix（Furosemide）"},"answer":"B","manualChapter":"CH16"},{"id":1155,"source":"第四章 非創傷急症(2015-2018).doc","question":"請問下列何種診斷較不會出現喘鳴（stridor）？","options":{"A":"肺動脈栓塞","B":"火場救出傷患疑似吸入性灼傷","C":"過敏產生的上呼吸道血管性水腫","D":"急性會厭炎"},"answer":"A","matchedChapters":["Combine"],"manualChapter":"非創傷"},{"id":1156,"source":"第四章 非創傷急症(2015-2018).doc","question":"34歲女性，求救原因為心悸併呼吸困難與腹瀉。初評生命跡象為心跳204下/分，血壓126/74mmHg，呼吸30下/分，血氧99%（無用氧下），體溫38.1℃。上救護車後，發現病人身材消瘦，意識躁動不安。執行12導程心電圖如下：請問此病人最不可能是以下哪一種鑑別診斷？","options":{"A":"葛瑞夫茲病（Grave’s disease）合併甲狀腺風暴(thyroid storm)","B":"糖尿病酮酸血症（Diabetic ketoacidosis）","C":"庫欣氏症候群（Cushing syndrome）","D":"可能使用古柯鹼或安非他命等違禁藥物"},"answer":"C","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/1156.png"},{"id":1157,"source":"第四章 非創傷急症(2015-2018).doc","question":"64歲女性，求救原因為剛剛看電視時突發右側肢體無力。初評生命跡象為血壓169/63mmHg，心跳54下/分，呼吸12下/分，給予鼻導管氧氣2L/分後血氧99％，體溫36.1℃。家人說她平時有吃高血壓跟糖尿病藥物，35分鐘之前突然走路往右偏倒，說話也咬字不清。依據中風流程AHA/ASA Guidelines，以下步驟何者必須先執行？","options":{"A":"12導程心電圖","B":"快速血糖檢測","C":"腦部電腦斷層掃描","D":"腦部核磁共振掃描"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":1158,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於快速程序插管（Rapid Sequence Intubation，RSI），以下七個P的口訣步驟，正確順序為？","options":{"A":"Preparation準備→Pretreatment前置給藥→Positionin擺位→Preoxygenation前置給氧→Paralysis鎮靜肌肉麻痺Placement插管→Post-intubationmanagement插管後處置。","B":"Preparation準備→Pretreatment前置給藥→Positionin擺位→Paralysis鎮靜肌肉麻痺→Preoxygenation前置給氧→Positionin擺位→Placement插管→Post-intubation management插管後處置","C":"Preparation準備→Preoxygenation前置給氧→Pretreatment前置給藥→Positionin擺位→Paralysis鎮靜肌肉麻痺→Placement插管→Post-intubation management插管後處置。","D":"Preparation準備→Pretreatmentfifj前置給藥→Positionin擺位→Preoxygenation前置給氧→Placement插管→Paralysis鎮靜肌肉麻痺→Post-intubationmanagement插管後處置。"},"answer":"C","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1159,"source":"第四章 非創傷急症(2015-2018).doc","question":"根據高級救護技術員教科書，以下何者不是讓插管病患肌肉鬆弛的神經肌肉阻斷劑？","options":{"A":"Succinylcholine","B":"Midazolam","C":"Vecuronium","D":"Pancuronium"},"answer":"B","manualChapter":"CH16"}];
    let currentQuestionIndex = 0;
    let selectedAnswers = new Array(questions.length).fill(null);
    let isReviewMode = false;

    const FAV_KEY = "emtp_favorite_question_ids";
    function getFavorites() {
      try {
        const data = localStorage.getItem(FAV_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }
    function isFavorited(id) {
      return getFavorites().includes(id);
    }
    function toggleFavorite(id) {
      let favs = getFavorites();
      const idx = favs.indexOf(id);
      let added = false;
      if (idx > -1) {
        favs.splice(idx, 1);
      } else {
        favs.push(id);
        added = true;
      }
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
      } catch (e) {}
      return added;
    }
    function updateFavBtn(id) {
      const favBtn = document.getElementById("fav-btn");
      if (!favBtn) return;
      const fav = isFavorited(id);
      favBtn.textContent = fav ? "★" : "☆";
      favBtn.style.color = fav ? "#f59e0b" : "#94a3b8";
      favBtn.title = fav ? "已加入我的最愛 (點擊移除)" : "加入我的最愛 (點擊加入)";
    }
    function handleReviewFav(btn, id) {
      const isFav = toggleFavorite(id);
      btn.textContent = isFav ? "★" : "☆";
      btn.style.color = isFav ? "#f59e0b" : "#94a3b8";
    }
    
    const startScreen = document.getElementById("start-screen");
    const quizScreen = document.getElementById("quiz-screen");
    const resultScreen = document.getElementById("result-screen");
    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const submitBtn = document.getElementById("submit-btn");
    const progressText = document.getElementById("progress-text");
    const scoreText = document.getElementById("score-text");
    const reviewContainer = document.getElementById("review-container");
    
    document.getElementById("start-btn").addEventListener("click", startQuiz);
    prevBtn.addEventListener("click", () => navigate(-1));
    nextBtn.addEventListener("click", () => navigate(1));
    submitBtn.addEventListener("click", showResults);

    const favBtnEl = document.getElementById("fav-btn");
    if (favBtnEl) {
      favBtnEl.addEventListener("click", () => {
        const q = questions[currentQuestionIndex];
        if (!q) return;
        toggleFavorite(q.id);
        updateFavBtn(q.id);
        favBtnEl.style.transform = "scale(1.35)";
        setTimeout(() => { favBtnEl.style.transform = "scale(1)"; }, 150);
      });
    }

    function startQuiz() {
      if (!questions || questions.length === 0) {
        alert("目前沒有可測驗的題目！請先將題目加入收藏。");
        return;
      }
      startScreen.classList.add("hidden");
      quizScreen.classList.remove("hidden");
      
      // Shuffle questions
      for (let i = questions.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = questions[i];
        questions[i] = questions[j];
        questions[j] = temp;
      }
      
      // Shuffle options
      questions.forEach(q => {
        if (q.options) {
          let keys = Object.keys(q.options);
          for (let i = keys.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const temp = keys[i];
            keys[i] = keys[j];
            keys[j] = temp;
          }
          q.shuffledKeys = keys;
        }
      });
      
      loadQuestion(0);
    }
    
    function loadQuestion(index) {
      currentQuestionIndex = index;
      const q = questions[index];
      
      questionText.textContent = q.question;
      updateFavBtn(q.id);
      
      const catDiv = document.getElementById("question-category");
      if (catDiv && ('2015-2018年 歷屆試題全彙整'.includes('隨機') || '2015-2018年 歷屆試題全彙整'.includes('最愛'))) {
          catDiv.style.display = "block";
          catDiv.textContent = q.manualChapter ? "分類：" + q.manualChapter : "分類：未分類";
      }
      
      const imgContainer = document.getElementById("image-container");
      const imgEl = document.getElementById("question-image");
      if (q.image) {
        imgEl.src = q.image;
        imgContainer.classList.remove("hidden");
      } else {
        imgContainer.classList.add("hidden");
      }
      
      optionsContainer.innerHTML = "";
      if (q.options) {
        let keysToUse = q.shuffledKeys || Object.keys(q.options);
        const displayLetters = ["A", "B", "C", "D", "E", "F", "G", "H"];
        keysToUse.forEach((key, optIdx) => {
          const value = q.options[key];
          const btn = document.createElement("button");
          btn.className = "option-btn";
          const dLetter = displayLetters[optIdx] || key;
          
          let html = "<strong>" + dLetter + ".</strong> " + value;
          
          if (isReviewMode || selectedAnswers[index] !== null) {
             btn.disabled = true;
             if (key === q.answer) {
               if (q.multiAnswer) {
                 btn.classList.add("multi-correct");
                 html += ' <span style="float:right; font-weight:bold; color:#854d0e;">✓ 正確答案 (官方複選: ' + q.multiAnswer + ')</span>';
               } else {
                 btn.classList.add("correct");
                 html += ' <span style="float:right;">✓ 正確答案</span>';
               }
             } else if (selectedAnswers[index] === key) {
               btn.classList.add("wrong");
               html += ' <span style="float:right;">✗ 你的作答</span>';
             }
          } else {
             btn.addEventListener("click", () => selectOption(key));
          }
          

          btn.innerHTML = html;
          optionsContainer.appendChild(btn);
        });
        
        const curExp = q.explanation || q.analysis;
        if ((isReviewMode || selectedAnswers[index] !== null) && curExp) {
          const expDiv = document.createElement("div");
          expDiv.className = "explanation-box";
          expDiv.innerHTML = "<strong>💡 解析：</strong><br>" + curExp.replace(/\n/g, "<br>");
          optionsContainer.appendChild(expDiv);
        }

      }
      
      document.getElementById("source-tag").textContent = "ID: " + q.id + " | 來源: " + (q.source || "無");
      
      updateNavButtons();
      updateProgress();
    }
    
    function selectOption(key) {
      if (isReviewMode || selectedAnswers[currentQuestionIndex] !== null) return;
      selectedAnswers[currentQuestionIndex] = key;
      loadQuestion(currentQuestionIndex);
    }
    
    function navigate(direction) {
      const newIndex = currentQuestionIndex + direction;
      if (newIndex >= 0 && newIndex < questions.length) {
        loadQuestion(newIndex);
      }
    }
    
    function updateNavButtons() {
      prevBtn.classList.toggle("hidden", currentQuestionIndex === 0);
      nextBtn.classList.toggle("hidden", currentQuestionIndex === questions.length - 1);
      
      // Always show submit button, rename to "結束測驗" if not already done in HTML
      submitBtn.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = (currentQuestionIndex === questions.length - 1) ? "結束作答" : "錯題回顧";
    }
    
    function updateProgress() {
      progressText.textContent = "問題 " + (currentQuestionIndex + 1) + " / " + questions.length;
    }
    
    function showResults() {
      isReviewMode = true;
      quizScreen.classList.add("hidden");
      resultScreen.classList.remove("hidden");
      
      const answeredCount = selectedAnswers.filter(a => a !== null).length;
      const correctCount = selectedAnswers.filter((a, i) => a === questions[i].answer).length;
      const wrongCount = answeredCount - correctCount;
      const unansweredCount = questions.length - answeredCount;
      const percentage = Math.round((correctCount / questions.length) * 100);
      
      let scoreHtml = "";
      if ('2015-2018年 歷屆試題全彙整'.includes('隨機')) {
          const scorePerQuestion = questions.length === 25 ? 4 : (questions.length === 50 ? 2 : 0);
          const totalScore = correctCount * scorePerQuestion;
          scoreHtml = "<br><br><span style='color: #0369a1; font-size: 1.5rem; font-weight: bold;'>測驗分數：" + totalScore + " 分</span>";
      }
      document.getElementById("final-stats").innerHTML = "答對 <span style='color: var(--success); font-weight: bold;'>" + correctCount + "</span> 題 / 答錯 <span style='color: var(--error); font-weight: bold;'>" + wrongCount + "</span> 題" + scoreHtml;
      
      reviewContainer.innerHTML = "";
      questions.forEach((q, i) => {
        if (selectedAnswers[i] !== null && selectedAnswers[i] !== q.answer) {
          const div = document.createElement("div");
          div.className = "review-item incorrect";
          
          let optionsHtml = '<ul class="review-options">';
          if (q.options) {
             let keysToUse = q.shuffledKeys || Object.keys(q.options);
             const displayLetters = ["A", "B", "C", "D", "E", "F", "G", "H"];
             keysToUse.forEach((k, optIdx) => {
                let v = q.options[k];
                let dLetter = displayLetters[optIdx] || k;
                let liClass = "";
                let label = "";
                if (k === q.answer) {
                   if (q.multiAnswer) {
                      liClass = "is-multi-correct";
                      label = " (正確答案 - 官方複選: " + q.multiAnswer + ")";
                   } else {
                      liClass = "is-correct";
                      label = " (正確答案)";
                   }
                } else if (k === selectedAnswers[i]) {
                   liClass = "is-wrong";
                   label = " (你的作答)";
                }
                optionsHtml += '<li class="' + liClass + '">' + dLetter + '. ' + v + label + '</li>';
             });
          }
          optionsHtml += "</ul>";
          
          
          let reviewExpHtml = '';
          const reviewExp = q.explanation || q.analysis;
          if (reviewExp) {
            reviewExpHtml = '<div class="explanation-box"><strong>💡 解析：</strong><br>' + reviewExp.replace(/\n/g, "<br>") + '</div>';
          }
          
          const favState = isFavorited(q.id);
          const favStar = favState ? '★' : '☆';
          const favColor = favState ? '#f59e0b' : '#94a3b8';
          div.innerHTML = '<div class="review-question" style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;">' +
            '<div>' + (i + 1) + '. ' + q.question + '</div>' +
            '<button type="button" onclick="handleReviewFav(this, ' + q.id + ')" style="background: none; border: none; cursor: pointer; font-size: 1.5rem; line-height: 1; color: ' + favColor + '; padding: 0 4px; flex-shrink: 0;" title="加入/取消我的最愛">' + favStar + '</button>' +
          '</div>' +
            optionsHtml + reviewExpHtml +
            '<div class="source-tag">ID: ' + q.id + ' | 來源: ' + (q.source || '無') + '</div>';

          reviewContainer.appendChild(div);
        }
      });
      if (reviewContainer.innerHTML === "") {
        reviewContainer.innerHTML = '<p class="text-center">太棒了！您全答對了！</p>';
      }
    }
    
    
  </script>
</body>
</html>
