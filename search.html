敏造成的支氣管痙攣","D":"可以增加升糖素分泌，並抑制胰島素分泌來增加血糖"},"answer":"D","manualChapter":"CH16"},{"id":638,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"心臟的傳導系統有：（甲）竇房節、（乙）希氏束、（丙）房室節、（丁）普金吉氏纖維。請問心動的動作電位傳導的順序是？","options":{"A":"甲→乙→丙→丁","B":"甲→丙→乙→丁","C":"丙→甲→丁→乙","D":"丙→乙→甲→丁"},"answer":"B","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":639,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"下列何者不是心肌的特性？","options":{"A":"具自動節律性（autorhythmicity/automaticity）","B":"具有相當長的不反應期（refractory period）","C":"可誘發強真收縮（tetanus）抽筋的現象","D":"細胞間彼此緊密連接·使動作電位可以同時快速地傳給其他細胞引發一致收縮"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":641,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"關於Amiodarone，下列何者為非？","options":{"A":"可能導致血管擴張及血壓下降","B":"也會降低心跳","C":"不可以使用在Torsades de pointes心律上","D":"藥效很短，半衰期（half life）1～2個小時，所以常需連續使用"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":642,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"關於藥物給予與路徑，下列何者為非？","options":{"A":"在過敏性休克的病患身上給子Epinephrine，皮下注射SC優於肌肉注射IM","B":"幫孕婦建立IV路徑一般建議在上半身（橫膈以上）","C":"若緊急時無法建立IV路徑，除了IM肌肉注射，Naloxone也可以由氣管內管給藥","D":"大部份的急救藥物都可以由IO骨内注射給予，吸收速度相當於IV靜脈注射"},"answer":"A","manualChapter":"CH16"},{"id":643,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"以下十種給藥路徑：（1）靜脈注射、（2）骨內注射、3）肌肉注射、（4）皮下注射、（5）口服給藥、（6）舌下給藥、（7）直腸給藥、（8）霧氣吸入、（9）氣管内管、（10）局部給藥，關於它們的吸收與作用速度快慢，下列何者為非？","options":{"A":"（1）≧（2）＞（3）＞（4）","B":"（9）＞（2）＞（7）","C":"（1）＞（6）＞（5）","D":"（8）＞（9）＞（10）"},"answer":"B","manualChapter":"CH16"},{"id":644,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"關於小兒氣管内插管與氣管内管選擇，下列何者為是？","options":{"A":"因為嬰兒骨頭脆弱，所以插管時挑起來不可將葉片前端直接壓在會厭軟骨上","B":"可能為嬰兒猝死症的初生嬰兒應選擇3.5#（mm）無氣囊","C":"太小的嬰兒插管喉頭鏡不宜使用直式葉片","D":"4歲女童疑似家暴，無呼吸心跳，選擇5.0#（mm）有氣囊"},"answer":"B","manualChapter":"CH48"},{"id":645,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"你幫一位OHCA患者緊急氣管内插管，插上後幫病患接上潮末二氧化碳監測器（end-tidal CO2 monitor/Capnography），續進行CPR後，二氧化碳濃度（PETCO2）監測卻無正常波形且二氧化碳分壓一直達不到10mmHg，可能原因以下何者為非？","options":{"A":"未確實進行五點聽診，插到胃裡","B":"氣管内管前端反折、或被血塊等異物塞住","C":"插管位置過深","D":"心肺功能停止過久，肺部血流無循環，故呼出的氣體不會有二氧化碳"},"answer":"C","manualChapter":"CH14"},{"id":646,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"到院前處置中，我們可以依照成人傷患骨折的部位估計其出血量。以下何者為非？","options":{"A":"單側肱骨骨折出血量約250mL","B":"雙側股骨骨折出血量約1,000mL","C":"骨盆骨折出血量約1,500～3000mL","D":"雙側脛腓骨骨折約1,000mL"},"answer":"B","manualChapter":"背誦題","matchedChapters":["背誦題"]},{"id":647,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"人體有不同的肌肉組織。以下說明何者為是？","options":{"A":"皮膚中的豎毛肌可以造成顫抖產熱，幫助人體維持體溫，是隨意肌的一種","B":"心肌存在於心臟，它的收縮不需要意識提醒，是自發性的（automaticity）最特別的是會有強直收縮現象（抽筋），心律不整就是一種心肌的強直收縮現象","C":"人體具有將近700條骨骼肌，每一塊肌肉都有起端、止端和主要作用。這些骨骼肌由自主神經系統（ANS）及激素所控制，可由人體隨意控制活動","D":"神經與所控制的肌肉會形成神經肌肉聯合（neuromuscular junction），釋放神經傳導物（如Ach）至肌肉細胞引起肌肉細胞的收縮"},"answer":"D","manualChapter":"CH12"},{"id":648,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"下列對於腺甘酸（Adenosine）的敘述何者為是？","options":{"A":"為一外生性的核酸嘌呤，可短暫地抑制房室節（AV node）和竇房結（sinus node）的活性","B":"對毒、藥物引起之心搏過速特別有用，是控制心率的首選藥物","C":"因為可能引起病患發生臉潮紅及胸悶症狀，所以應緩慢注射，避免不適","D":"病患若為心房撲動（AF），在注射Adenosine之後，可能會在心電圖監視器上出現鋸齒狀波形"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":649,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"傷病患的預立醫囑是0.9％氯化鈉溶液（生理食鹽水）500毫升，使用標準輸液套管滴注4小時，請問滴速每分鐘約幾滴？","options":{"A":"30滴","B":"40滴","C":"50滴","D":"60滴"},"answer":"B","manualChapter":"CH17"},{"id":651,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"血紅素（紅血球）將氧氣送至週邊組織後，將它釋放至組織，而釋放過程是依「血紅素與氧氣」的親和力決定·以下何種情況，氧合血紅素飽合度曲線往左移？","options":{"A":"溫度下降","B":"PCO2上升","C":"pH下降","D":"[H+]上升"},"answer":"A","manualChapter":"CH12"},{"id":652,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"以下不同之給氧裝置，請依照可提供之氣氣濃度，由低至高排列。（1）鼻管。（2）簡單型氧氣面罩。（3）非再吸入型氧氣面罩（4）面罩+甦醒球（使用純氧+氧氣儲存袋）","options":{"A":"（1）（3）（2）（4）","B":"（4）（3）（2）（1）","C":"（1）（2）（3）（4）","D":"（4）（1）（2）（3）"},"answer":"C","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":653,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"以下針對LMA（Laryngeal mask airway喉罩呼吸道）的敘何者為非？","options":{"A":"與氣管内管相比，LMA的置放不僅學習容易、又不必使用喉頭鏡，不需要求目視聲帶，不須張大嘴巴，所以成功率較高","B":"在局限空間及外傷頸椎固定的考量下，喉罩呼吸道有其獨到的優點，而且又可以保護呼吸道，避免呼吸道吸入性嗆傷，所以成為到院前救護的標準配備","C":"不宜使用在腐蝕性喉部傷害、食道外傷或病變的病患","D":"一般成人可選擇使用5號"},"answer":"B","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":654,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關呼吸的敘述，下列何者為非？","options":{"A":"呼吸的動作可以用流體力學的原理來說明","B":"因胸内壓上升，肺臟被拉大，肺泡內壓高於大氣壓而產生吸氣","C":"先吸氣然後吐氣","D":"肺內壓大約與海平面之大氣壓力相同"},"answer":"B","manualChapter":"CH12"},{"id":655,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關呼氣的機轉，下列何者為是？","options":{"A":"由呼吸肌收縮用力造成","B":"因胸内壓下降，肺臟被拉大，肺泡内壓低於大氣壓而產生呼氣","C":"胸部及肺部擴張及縮小的容易程度稱之為順應性或柔軟度","D":"若因疾病造成順應性增加，呼氣時就會變得吃力，如氣喘及肺氣腫"},"answer":"C","manualChapter":"CH14"},{"id":656,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關呼吸的敘述，下列何者為是？","options":{"A":"在休息的情況下，成人每分鐘呼吸約12～20次","B":"呼吸時，大部份的氣體阻力來自於咽喉及氣管","C":"呼吸道若發生如肺氣腫等情況，解剖性無效腔可能會大於生理性無效腔","D":"劇烈運動後呼吸費力多為氣喘發作"},"answer":"A","manualChapter":"CH14"},{"id":657,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關肺容量的敘述，下列何者為是？","options":{"A":"用力呼氣可將肺部氣體排空","B":"救護技術員在急救時所觀察到的胸部起伏，就是間接觀察潮氣容積","C":"吸氣量等於潮氣容積加上呼氣儲備容積","D":"肺活量為潮氣積加上吸氣儲備容積再加上呼氣儲備容積及餘容積"},"answer":"B","manualChapter":"CH14"},{"id":658,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關氧氣，二氧化碳及血紅素的敘述，下列何者為是？","options":{"A":"氧氣在血液中主要以直接溶解的形式存在","B":"通常血紅素在氧氣分子80～100mmHg時達到飽和","C":"二氧化碳在血液中主要與血中蛋白質結合為主","D":"在組織中有攜帶氧氣的血紅素較易接受二氧化碳"},"answer":"B","manualChapter":"CH12"},{"id":659,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關呼吸的調控，下列敘述何者為非？","options":{"A":"故意的過度換氣可以降低血中的二氧化碳濃度","B":"憋氣時，二氧化碳分壓上昇，氧氣分壓下降","C":"呼氣中樞在正常呼吸時不會動作","D":"呼吸調節中樞位於大腦，為意志可控制"},"answer":"D","manualChapter":"CH12"},{"id":660,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關呼吸病理生理學，下列敘述何者為是？","options":{"A":"肺氣腫的患者因其缺氧，應給予高濃度氧氣治療為佳","B":"急救項目中首要目標就是暢通呼吸道","C":"意識清醒者呼吸道阻塞的原因多是由於自身舌頭失去張力所致","D":"意識不清患者呼吸道阻塞的原因大多是因分泌物過多造成阻塞"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":662,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關氧氣供應裝置的比較，下列敘述何者為非？","options":{"A":"凡德里面罩可以提供40～80％的氧氣濃度。","B":"簡單型氧氣面罩，在流速6～10L/min時，可以提供35～60％的氧氣濃度","C":"非再吸入型氣面罩，使用氧氣流速10～15L/min時，可以提供80～100％的氧氣濃度","D":"鼻管用於提供低濃度氧氣，最高流速為6L/min"},"answer":"A","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":663,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關抽吸的敘述，下列敘述何者為非？","options":{"A":"抽吸管依型式可分為軟式管及硬式管","B":"固定式抽吸裝置應可提供超過300mmHg的吸力，以及40L/min的流量","C":"抽吸時盡量以無菌方式操作，先將管子放到入口，再邊旋轉邊向內插入抽吸管","D":"抽吸時同時做一壓一放的動作，避免做連續性的抽吸動作，以免吸住呼吸道管壁造成傷害"},"answer":"C","matchedChapters":["CH15"],"manualChapter":"CH15"},{"id":664,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"成年的腦可分為六個區域，分別為大腦（cerebrum）、小腦（cerebellum）、間腦（diencephalon）、中腦（midbrain）、橋腦（pons）、和延腦（medulla oblongata）。請問下列敘述，何者為非？","options":{"A":"中腦：負責處理視覺和聽覺訊息並産生隨意的運動反應，例如瞳孔的光反射","B":"橋腦：連結小腦於腦幹上，含有涉及身體運動和內臟運動控制的神經核，例如顏面神經","C":"延髓：將腦連結到脊髓，它是人體的生命中樞，包括控制心搏速率、心收縮力及循環血流量的心臟血管中樞、呼吸節律中樞、吞嚥中樞、嘔吐中樞等","D":"中腦、橋腦和延髓，此三區可合稱為腦幹"},"answer":"A","manualChapter":"CH12"},{"id":665,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關緊急救護藥理學下列的名詞解釋，何者為非？","options":{"A":"首渡效應：在藥物到一般循環之前，先由肝門靜脈經過肝臟而發生的最初生物轉化作用","B":"增強：因為同時給予兩種藥物，而使其中一種藥物增加了另一種藥物效果的增強反應","C":"治療作用（therapeutic action）：藥物無法預期的效果","D":"治療指數（therapeutic index）：某個藥物的安全性指標"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":666,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關藥理學相關名詞，何者為非？","options":{"A":"拮抗作用（Antagonism）：當併用兩種或兩種以上藥物時，藥物效果出現相互阻抑而使藥物效果的總和大於個別使用藥物的效果加總（1+1＞2）","B":"副作用（Side effect）：在藥物治療劑量內發生不希望出現但常常是無法避免的效果。而這些效果是不是原先給予這個藥物所想要的","C":"累積效應（Cumulative action）：重複給予某藥物時會有藥物積在血液或器官中的情形，造成藥物效果增加甚至中毒發生。這種情形常出現在給予多個劑量的藥物之後，或藥物的吸收作用比其排泄或代謝來得快的情況下","D":"禁忌症（Contraindication）：因醫學或生理因素，使得藥物的給予出現治療效果以外的傷害"},"answer":"A","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":667,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"各種藥物投途徑的種類、縮寫及速度比較，何者為非？","options":{"A":"經腸胃道藥物給予的吸收速度：舌下給藥＞口服給藥","B":"非經腸胃道藥物給予的方式包含皮下注射、肌肉注射、靜脈注射、及骨内注射等等","C":"非經腸胃道藥物給予的吸收速度：肌肉注射＞骨内注射","D":"經肺部給藥中的“霧氣吸入”英文縮寫為“I.H”"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":668,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"下列對於腎上腺素（Epinephrine）的敘述何者為非？","options":{"A":"治療劑量時可讓支氣管平滑肌鬆弛、支氣管擴張，用以解除致命性氣喘、嚴重過敏造的支氣管痙攀","B":"治療劑量時可收縮小動脈、皮膚和黏膜血管，讓收縮壓上升，增加冠狀動脈之血液灌流","C":"高劑量使用不能增加存活率或改善神經系統之預後，而可能造成急救後心肌功能不全","D":"治療脈搏情況，如心室顫動、無脈性心室頻脈、無收縮、無脈搏電氣活動時，應從靜脈途徑緩慢滴注"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":669,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"傷病患的預立醫囑是0.9％氯化鈉溶液（生理食鹽水）500毫升，使用標準輸液套管滴注2小時，請問滴速每分鐘約幾滴？","options":{"A":"80滴","B":"60滴","C":"40滴","D":"20滴"},"answer":"A","manualChapter":"CH17"},{"id":670,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"在照護意識不清之外傷出血性休克傷患的時候，以下描述何者為非？","options":{"A":"嚴重意識不清可能會因為舌頭後倒產生呼吸道阻塞，所以應該評估是否給予輔助呼吸道","B":"靜脈導管建立之後，應盡快給予腎上腺素推注，以提升病人血壓","C":"留置導管部位應視為傷口，宜避免暴露在髒污或灰塵處","D":"靜脈輸液應選用生理食鹽水或林格氏液"},"answer":"B","manualChapter":"創傷"},{"id":671,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"您照一位罹患慢性阻塞性疾病，主訴呼吸喘的病人。經評估您決定使用鼻管避免二氧化碳蓄積。請問當您將氧氣流速流速調整至2L/min時，您預估可提供多少％之氣氣供應？","options":{"A":"28％","B":"32％","C":"36％","D":"40％"},"answer":"A","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":672,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"以下針對氣管內管相關的敘述何者為非？","options":{"A":"病人無法維持呼吸道通暢、或無法自行呼吸需提供人工呼吸都是氣管內管插管的適應症","B":"小於8歲的兒童因為環狀軟骨段的氣管較大，所以一定要選擇有氣囊的氣管内管","C":"兒童的會厭軟骨較為細長柔軟，不易控制，故常使用直式葉片","D":"插管前先以100％氧氣給病人自行呼吸或施以人工呼吸至少15～30秒"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH15"]},{"id":674,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"下列都是造成代謝性酸中毒（metabolic acidosis）的可能原因，何者為非？","options":{"A":"過度換氣症候群","B":"糖尿病控制不良","C":"急性腎衰竭","D":"嚴重腹瀉"},"answer":"A","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":675,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"關於口咽呼吸道的敘述，下列何者為是？","options":{"A":"對於意識喪失的病人如果使用口咽呼吸道就無須注意頭部的姿勢","B":"使用口咽呼吸道可解決所有上呼吸道阻塞（upper airway obstruction）的問題","C":"口咽呼吸道使用簡單，未受過訓練的一般急救者也可直接操作","D":"對於意識半昏迷的病人使用口咽呼吸道會增加病人嘔吐或喉頭痙攀的危險"},"answer":"D","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":677,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"在下列何種情形下不能放置鼻咽呼吸道（Nasopharyngeal Airway）？","options":{"A":"呼吸困難時","B":"單側鼻孔內放置有阻力時","C":"鼻子和嘴巴有血絲時","D":"檢查病患發現有熊貓眼（raccoon eye）和鼻漏的情況"},"answer":"D","manualChapter":"CH15"},{"id":678,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"為了讓胸腔内產生負壓，使空氣吸入肺部，横隔膜會收縮向解剖學位置的哪一個方向移，來擴大胸腔的體積？","options":{"A":"向上移動","B":"向下移動","C":"向外移動","D":"向內移動"},"answer":"B","manualChapter":"CH14"},{"id":679,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"在嚴重過敏反應期間，循環系統的血管會____，而呼吸道會變得____。依序應填入：","options":{"A":"收縮、擴張","B":"收縮、狹窄","C":"舒張、擴張","D":"舒張、狹窄"},"answer":"D","manualChapter":"CH40"},{"id":680,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"高級救護技術員的關鍵思考步驟順序為何？a.應用原則；b.資料判讀；c.反應評估；d.概念形成；e.事後回顧","options":{"A":"a，b，c，e，d","B":"b，d，c，a，e","C":"b，d，a，c，e","D":"d，b，a，c，e"},"answer":"D","manualChapter":"CH22"},{"id":681,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"55歲男性，早上起床時現自己臉歪一邊，右眼無法緊閉且口水會自右嘴角不自主流下，擔心自己是中風，所以請求119協助。現場估現發現，病患除了臉歪以外，說話表達流暢且無肢體無力的情形，下列敘述何者為非？","options":{"A":"是第七對腦神經有病灶","B":"受影響的腦神經源自延腦","C":"此腦神經為包含感覺與運動的混合型神經","D":"可以評估抬頭紋來區分是中樞型或是周邊型"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":682,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"依據「法蘭克－史達林」心臟定律，來解釋各類休克的原因，以下敘述何者為非？","options":{"A":"敗血性休克是由於總周邊血管阻力（total peripheral resistance）下降，所以才產生低血壓","B":"神經性休克是因為自律神經失能，導致總周邊血管阻力（total peripheral resistance）下降且心跳速率（heart rate）無法反應性上升，而產生低血壓","C":"心因性休克是於心臟功能受損，心搏出量（stroke volume）下降，才導致低血壓","D":"阻塞性休克是因為總周邊血管阻力（total peripheral resistance）上升與心搏出量（stroke volume）下降，所以才產生低血壓"},"answer":"D","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":683,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"人體自律神經系統的作用，下列何者為非？","options":{"A":"交感神經作用引起氣管擴張","B":"副交感神經在用引起腸蠕動增加","C":"交感神經作用引起膀胱排空延遲","D":"副交感神經作用引起唾疲分泌"},"answer":"A","manualChapter":"CH12"},{"id":684,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"有關藥理學相關的名詞與作用，何老為非？","options":{"A":"治療指標（Therapeutic Index，TI）用來評估一個藥物的治療效用與反應","B":"藥物動力學就是研究身體在一定時間內，如何處理藥物","C":"競爭性抑制劑（Competitive antagonis）反應多為可逆反應","D":"副作用（Side effect）在藥物治療劑量内發生不希望出現但常常是無法避免的效果·而這些效果是不是原先給予這個藥物所想要的"},"answer":"A","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":685,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"Amiodarone是院前常使用的抗心律不整藥物，就您對此的了解，以下敘述何者為非？","options":{"A":"屬於第三類（Class III）的抗心律不整藥物","B":"可能引致血管擴張及血壓下降","C":"與第四類抗心律不整藥物併用時，易導致torsades de point","D":"藥效半生期短，易累積在體內"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":686,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"35歲男性從火場被救出，體重目測約75公斤，燒燙傷面積一度約為10％，二度約為18％，三度約佔9％，依據Parkland Formula的方式計算，使用兩套標準輪液套管滴住，請推算前八小時每一套標準輸液套管每分鐘須調整為幾滴最為合適？","options":{"A":"85","B":"75","C":"60","D":"50"},"answer":"A","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":687,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"依據您所了解的呼吸生理學，有關右圖的敘述何者為非？","options":{"A":"甲是指正常吸氣之後，再故意用力吸氣，所能吸入的最大氧體量","B":"肺容量（Pulmonary capacity）是指丙+丁","C":"肺活量（Vital capacity）指甲+乙+丙","D":"乙稱為潮氣容積（Tidal volume），成人平均約為500～600mL"},"answer":"B","matchedChapters":["NeedImage"],"manualChapter":"CH14","image":"題庫圖片/687.png"},{"id":688,"source":"第二章 基礎醫學與呼吸處置(2015-2018).doc","question":"下列何者不是困難插管的評估與預測因子？","options":{"A":"嘴巴張大超過3指幅","B":"下巴尖端至舌骨距離超過3指幅","C":"舌骨至甲狀軟骨距離超過2指幅","D":"下頷骨至環狀軟骨距離超過3指幅"},"answer":"D","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":689,"source":"第五章 創傷急症(2012-2014).doc","question":"一位60公斤男性傷者，體表有10％一度灼傷，20％二度灼傷，與10％三度灼傷，則根據Parkland Formula，其前八小時應給予的靜脈輸液總量為？","options":{"A":"3,600 ml","B":"4,800 ml","C":"7,200 ml","D":"9,600 ml"},"answer":"A","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":690,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於腹部外傷的敘述，何者為非？","options":{"A":"爆炸傷時，需懷疑中空器官（如腸胃道）破裂","B":"中空器官破裂引發的腹膜炎，傷者死亡速度往往較實質器官（如肝脾）破裂致死來得快","C":"Turner sign為後腹腔損傷的皮膚表現，可見傷者腰部出現瘀青","D":"右上腹損傷者，還需考慮右下肺及肋骨損傷可能"},"answer":"B","manualChapter":"CH06"},{"id":691,"source":"第五章 創傷急症(2012-2014).doc","question":"一輛汽車因故撞上電線桿，下例何種傷情不是送往創傷中心的要件？","options":{"A":"評估後確認有骨盆骨折的駕駛","B":"被從車內拋出的前座乘客","C":"脫困時間10分鐘的後座乘客","D":"GCS昏迷指數12的後座乘客"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":692,"source":"第五章 創傷急症(2012-2014).doc","question":"根據皮膚灼傷範圍評估法「九的法則」（rule of nines），一位30歲成年男性，其受灼傷範圍包括整個右上肢、整個右下肢，與整個前胸部，而頭頸部、腹部、背部、外陰部與其他肢體並無灼傷，則其灼傷之體表面積為：","options":{"A":"27％","B":"31.5％","C":"36％","D":"45％"},"answer":"C","manualChapter":"CH31"},{"id":693,"source":"第五章 創傷急症(2012-2014).doc","question":"一機車騎士因車禍掉入排水溝，頭部有受到撞擊，並被發現上腹部有擦傷及疼痛感。下列對於傷者的評估與處置，何者有誤？","options":{"A":"須評估兩側瞳孔大小與對光反應，若有不正常的瞳孔反應，可能意味顱內壓升高或是腦神經的受損","B":"須保護頸椎與維持呼吸道暢通，若傷者氧氣濃度無法維持，或昏迷指數小於9分，建議插管治療","C":"要考慮患者有腹部挫傷合併腹內出血的可能性，須監控其血壓與脈搏","D":"若患者血壓正常但脈搏為115下／分，如果考慮為出血性休克所造成，則其出血性休克已惡化到第三期"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":694,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於腔室症候群的描述，何者為非？","options":{"A":"最常發生於小腿，可能導致截肢等併發症，故須早期診斷","B":"臨床上用七個P開頭的英文字描述其症狀（7Ps），其中pain與pulselessness為早期症狀須儘早介入處理","C":"若已經出現paralysis症狀，多為晚期，發生併發症的機會也將上升","D":"到院後監測腔室內壓力，與及早接受筋膜切開手術（fasciotomy）為其重要處置"},"answer":"B","manualChapter":"CH30"},{"id":695,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於電傷害的評估與處置，何者為非？","options":{"A":"須給予大量點滴輸液，以維持至少有每小時70～100 ml的尿輸出量，用Parkland Formula即可估算每小時大約要給予的點滴流速","B":"輸液中可加入碳酸氫鈉溶液（sodiun bicarbonate）鹼化尿液，須注意碳酸氫鈉不可和鈣離子同時輸注","C":"嚴重者使用mannitol給予滲透壓性利尿至每小時300 ml尿輸出量","D":"若尿液顏色呈現深咖啡色如可樂狀，可能意味橫紋肌溶解，要盡可能增加輸液以促進量增加，並注意是否有腎衰竭之情況發生"},"answer":"A","manualChapter":"CH30"},{"id":697,"source":"第五章 創傷急症(2012-2014).doc","question":"一位50歲女性因車禍導致其頭部受到撞擊。評估其昏迷指數（GCS）為7分，血壓量測為170／90 mmHg，心跳速率為每分鐘48下，檢測兩側瞳孔均為3mm且均對光有反應。暴露身體後無其他明顯外傷。若預立醫囑允許EMT-P可在現場進行插管及給予RSI物，下列關於傷者的評估與處置，何者為非？","options":{"A":"屬重度頭部創傷，應考慮插管以維持呼吸道，必要時用ketamine鎮靜與麻醉患者以協助插管","B":"患者若出現不規則的呼吸，須小心是Cushing's triad的症狀之一，表示其顱內壓上升","C":"若患者出現癲癇，可使用diazepam，以避免因抽搐而引起顱內壓的上升","D":"若耳後乳突瘀青，要懷疑後顱底骨折，此稱為Battle's sign"},"answer":"A","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":698,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於骨盆骨折的描述與處置，何者為誤？","options":{"A":"不穩定的骨盆骨折，可能合併膀胱、尿道、直腸、子宮及陰道等損傷","B":"若患者無其他外傷而呈現休克狀態，應高度懷疑合併後腹腔出血","C":"其出血量可高達1,000～2,000 ml以上，而適當的骨折固定可減少疼痛及出血量","D":"按壓骨盆時出現不正常移動或疼痛，表示為不穩定骨盆骨折，待適當骨折固定後須再次按壓以確認是否已使骨盆趨於穩定"},"answer":"D","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":699,"source":"第五章 創傷急症(2012-2014).doc","question":"一名50歲男性，因車禍造成頭部外傷合併血腫。病患於事發當時有失去意識，但隨即清醒。但將患者送至醫院後，意識又開始模糊並且沒有恢復，GCS下降至7分，且瞳孔不等大。考慮其有頭部外傷，推測傷者最有可能是何種出血？","options":{"A":"硬腦膜上出血（epidural hemorrhage）","B":"硬腦膜下出血（subdural hemorrhage）","C":"蜘蛛腦膜下出血（subarachnoid hemorrhage）","D":"腦內出血（intracerebral hemorrhage）"},"answer":"A","manualChapter":"CH27"},{"id":700,"source":"第五章 創傷急症(2012-2014).doc","question":"會立刻威脅生命的胸部創傷，何者為非？","options":{"A":"心包填塞","B":"連枷胸","C":"肺挫傷","D":"張力性氣胸"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":701,"source":"第五章 創傷急症(2012-2014).doc","question":"創傷引起的休克成因有很多種，下列配對何者錯誤？","options":{"A":"胸部穿刺傷造成心包膜填塞：心因性休克","B":"腹部挫傷導致脾臟破裂：出血性休克","C":"腸道破裂引發腹膜炎：敗血性休克","D":"脊髓損傷造成交感神經系統控制消失：神經性休克"},"answer":"A","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":702,"source":"第五章 創傷急症(2012-2014).doc","question":"燒燙傷時若患處出現水泡，表示其為幾度灼傷？","options":{"A":"一度灼傷","B":"二度灼傷","C":"三度灼傷","D":"四度灼傷"},"answer":"B","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":703,"source":"第五章 創傷急症(2012-2014).doc","question":"一位60歲女性自用小客車駕駛人高速追撞前車。當您到現場時發現方向盤變形，傷患沒有使用安全帶。患者意識清楚可對話，表示胸口不適。此時血壓80／60 mmHg，心跳130／min，呼吸20／min，理學檢查發現頸靜脈鼓脹而氣管沒有偏移，胸部無明顯傷口，兩側呼吸音等大對稱，心音則模糊，此外頭頸部、腹部、背部及四肢等處皆無不適亦無傷口。則針對可能造成的胸部損傷，則您懷疑患者最可能為：","options":{"A":"張力性氣胸","B":"開放性氣胸","C":"心包膜填塞","D":"連枷胸"},"answer":"C","manualChapter":"創傷"},{"id":706,"source":"第五章 創傷急症(2012-2014).doc","question":"有關創傷性主動脈斷裂（traumatic aortic rupture）敘述，下列何者為非？","options":{"A":"大部分傷患最後仍然死亡","B":"若是胸部鈍挫傷引起，主動脈破裂斷裂的位置通常是在動脈韌帶的位置","C":"傷患會因主動脈斷裂而導致右側胸腔內積血","D":"理學檢查可發現兩側肢體的脈搏不對稱"},"answer":"C","manualChapter":"CH28"},{"id":707,"source":"第五章 創傷急症(2012-2014).doc","question":"二十歲男性騎摩托車發生車禍，被貨車撞擊造成腹部鈍挫傷。經EMTP理學檢查懷疑有腹腔內出血。請問以下的理學檢查發現與可能的內出血部位敘述，何者為非？","options":{"A":"腰部瘀青（Turner sign）為後腹腔出血之徵候","B":"肚臍周圍瘀青（Cullen sign）為後腹腔出血之徵候","C":"安全帶徵候（Seat-belt sign）為骨盆腔出血之徵候","D":"Kehr徵象（Kehr sign）可能為脾臟血腫之徵候"},"answer":"C","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":708,"source":"第五章 創傷急症(2012-2014).doc","question":"一位30歲男性車禍翻車，右腿壓在車下約2小時後才脫困，EMTP理學檢查發現右腿冰冷、腫脹、瘀青、疼痛且無法移動，右小腿有一個0.5公分的小傷囗，雖然生命跡象穩定沒有休克，但右腿量不到動脈脈搏，該病人最有可能受到下列何種傷害？","options":{"A":"壓碎傷症候群（crush syndrome）","B":"右大腿大血管損傷","C":"右小腿開放性骨折","D":"腔室症候群"},"answer":"D","manualChapter":"創傷"},{"id":709,"source":"第五章 創傷急症(2012-2014).doc","question":"一位30歲男性車禍翻車，右腿壓在車下約2小時後才脫困，理學檢查發現右腿冰冷、腫脹、瘀青、疼痛且無法移動，右小腿有一個0.5公分的小傷囗，雖然生命跡象穩定沒有休克，但右腿量不到動脈脈搏，該病人經初部處理後，下列何步驟可增加右腿存活率?","options":{"A":"應考慮在重物被移除前，於患肢暫時使用止血帶","B":"到院前處置重點為加壓止血，並迅速後送至適合的急救責任醫院，接受血管修補或重建手術","C":"使用骨骼牽引術","D":"到院前處置包括移除束縛物及不可以包紮太緊，並儘速送醫，到院後則須監測腔室內壓力，及早接受筋膜切開手術（fasciotomy）"},"answer":"D","manualChapter":"CH30"},{"id":710,"source":"第五章 創傷急症(2012-2014).doc","question":"一位從火場被救出的中年男性傷患，外觀呈現臉部一度燒傷，鼻毛燒焦，目前意識楚，血壓為130／80 mmHg，脈搏110，呼吸35，呼吸有哮吼聲（stridor），要建立其呼吸道時，下列何者為最佳？","options":{"A":"可在地方醫療指導的預立醫授權下，考慮給予氣管插管","B":"鼻管給氧4L／min","C":"簡單面罩給氧（simple mask）10L／min","D":"有儲留袋之面罩給氧10L／min"},"answer":"A","manualChapter":"CH31"},{"id":711,"source":"第五章 創傷急症(2012-2014).doc","question":"創傷死亡分三個高峰期，包括事故現場、急診急救期以及住院期，要降低創傷傷患所造成的死亡或傷殘，除必須加強EMS系統功能外，並需整合區域內創傷醫療資源。而創傷照護體系建立的目的在於：","options":{"A":"降低創傷可預防之死亡率","B":"減少對家人的衝擊（二次創傷）","C":"減少創傷傷患數及降低創傷嚴重度","D":"以上皆是"},"answer":"D","manualChapter":"CH25"},{"id":712,"source":"第五章 創傷急症(2012-2014).doc","question":"30歲男性騎摩托車發生車禍，沒有戴安全帽。請問以下何者的理學檢查發現與可能顱骨骨折的部位不相符？","options":{"A":"浣熊眼（Raccoon's eyes）懷疑有中顱底之骨折","B":"耳漏（otorrhea）懷疑有中顱底之骨折","C":"鼻漏（rhinorrhea）懷疑有前顱底之骨折","D":"巴氏徵候（Battle's sign）懷疑有岩樣骨骨折、後顱底骨折"},"answer":"A","manualChapter":"CH20"},{"id":714,"source":"第五章 創傷急症(2012-2014).doc","question":"創傷病患有骨盆骨折，應注意是否有尿道損傷的可能。以下何者徵象較不懷疑尿道受傷？","options":{"A":"尿道口有血跡","B":"雙下肢疼痛","C":"陰囊腫脹","D":"攝護腺於指診時高位或摸不到"},"answer":"B","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":715,"source":"第五章 創傷急症(2012-2014).doc","question":"在嬰幼兒休克時給予輸液急救，建議每次的輸液量為？","options":{"A":"10c.c.／kg normal saline or L-R solution","B":"20c.c.／kg normal saline or L-R solution","C":"30c.c.／kg normal saline or L-R solution","D":"20c.c.／kg D5 & 1／4 saline"},"answer":"B","manualChapter":"CH48"},{"id":716,"source":"第五章 創傷急症(2012-2014).doc","question":"下列何者生命徵象，最不可能是低血容性休克？","options":{"A":"心跳加快，血壓降低，尿量減少","B":"心跳加快，血壓降低，臉色潮紅","C":"心跳變慢，血壓降低，意識清楚","D":"心跳加快，血壓降低，下肢水腫"},"answer":"C","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":717,"source":"第五章 創傷急症(2012-2014).doc","question":"有關連枷胸（flail chest）下列敘述何者為非？","options":{"A":"身體檢查常可能有捻髮音crepitus","B":"臨床上這類病人常有缺氧的現象","C":"不應該用止痛藥，以免抑制呼吸功能","D":"有需要給予氣管插管"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":719,"source":"第五章 創傷急症(2012-2014).doc","question":"頭部外傷病人因顱內出血及顱內壓上升引起左側瞳孔放大5 mm，請問是那一條腦神經受損及最可能是那一側顱內出血所引？","options":{"A":"第二對腦神經，左側腦部","B":"第二對腦神經，右側腦部","C":"第三對腦神經，左側腦部","D":"第三對腦神經，右側腦部"},"answer":"C","manualChapter":"CH12"},{"id":721,"source":"第五章 創傷急症(2012-2014).doc","question":"關於骨骼肌肉系統外傷之處理，下列何者為錯？","options":{"A":"應注意受傷機轉、現場狀況、受傷前病人的狀況","B":"理學檢查重點包括肢體顏色、血液循環、關節或肢體可活動的範圍、神經分佈有無缺等","C":"應辨識有無潛在危及生命的電解質不平衡，例如高血鈣及高血鉀","D":"辨識有無危及肢體存活的傷害"},"answer":"C","manualChapter":"CH30"},{"id":725,"source":"第五章 創傷急症(2012-2014).doc","question":"一名40歲男性自三樓高處墜落，你到達現場評估意識時，病人雙眼自行睜開，予以病人胸骨疼痛刺激病人左手可以準確將你手撥開，右手則癱軟無力舉起，現場則一直喃喃自語：我有三太子附身，我不會死。請問依據ATLS第八版定義此傷患屬於何種頭部外傷？","options":{"A":"輕度頭部創傷（minor brain injury）","B":"中度頭部創傷（moderate brain injury）","C":"嚴重頭部創傷（severe brain injury）","D":"昏迷（coma）"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":726,"source":"第五章 創傷急症(2012-2014).doc","question":"黃忠，70歲男性、某日於練習射箭時，不慎自射箭平台墜落約兩公尺高，你接獲通報到後，病人意識清楚，BP＝80／60 mmHg，HR：120／min，RR：20／min，病人拼命叫喊背痛且自肚臍以下明顯均無感覺，雙腿偏癱無法抬起，請問下列何者敘述最為正確？","options":{"A":"此病人應該是T4受損且合併有神經性休克（neurogenic shock）","B":"此病人應該是T4受損且合併有脊椎性休克（spinal shock）","C":"此病人應該是T10受損且合併有神經性休克（neurogenic shock）","D":"此病人應該是T10受損且合併有脊椎性休克（spina lshock）"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":727,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於心包膜填塞及張力性氣胸，下列何者並非共通點（請選最適合的答案）？","options":{"A":"血壓低","B":"頸靜脈怒張","C":"氣管偏移","D":"均可能造成PEA"},"answer":"C","manualChapter":"CH28"},{"id":728,"source":"第五章 創傷急症(2012-2014).doc","question":"請問下列何者並非造成連枷胸病人喘的主要原因（請選最適合的答案）？","options":{"A":"反向呼吸","B":"疼痛","C":"肺挫傷","D":"因受傷機轉大造成其他相關淺在的肺部傷害"},"answer":"A","manualChapter":"CH28"},{"id":729,"source":"第五章 創傷急症(2012-2014).doc","question":"你接獲中心通報至某工地救護，到達現場後一名30歲男性阿華，已遭磚塊壓住小腿約8小時以上，若你所在縣市已開放相關藥物使用，現場予以心電圖監測且十二導程心電圖如下，請問下列何者並非適當治療方式（請選最適合的答案）？","options":{"A":"大量給予點滴水分補充（Hydration）","B":"給予sodium bicarbonate","C":"給予diuresis","D":"給予dopamine維持血壓"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/729.png"},{"id":730,"source":"第五章 創傷急症(2012-2014).doc","question":"獅潭仙山發生遊覽車翻覆事件，你與一新進EMT2同仁共同到現場，指揮官指定你們救護一名兩歲幼童，體重約12公斤，左小腿明顯大量出血，此EMT2同仁，於測量血壓時突然詢問，學長此小孩最低可接受的收縮壓為多少？點滴打上後EMT2同仁又詢問，學長我要先給多少normal saline？","options":{"A":"74 mmHg，120 c.c.","B":"74 mmHg，240 c.c.","C":"84 mmHg，120 c.c.","D":"84 mmHg，240 c.c."},"answer":"B","manualChapter":"CH48"},{"id":732,"source":"第五章 創傷急症(2012-2014).doc","question":"依據ATLS第八版，創傷後死亡分成三個時期：立即死亡，早期死亡及後期死亡，請問以下何者為非？","options":{"A":"立即死亡最好的方式是預防","B":"其中死亡數最多的是早期死亡","C":"EDH（硬腦膜上出血）屬於早期死亡","D":"敗血症屬於後期死亡"},"answer":"B","manualChapter":"CH08"},{"id":733,"source":"第五章 創傷急症(2012-2014).doc","question":"有關創傷的概念，下列敘述何者為非？","options":{"A":"現場檢傷分類指引（Field Triage）」與「創傷中心（Trauma Center）」是創傷照護體系兩大支柱","B":"由於受傷至接受確切照護的間期越短，傷患的存活率越高，因此EMT應將嚴重傷患送至最近的急救責任醫院以縮短處置時效","C":"損傷預防3E包括：教育訓練（Education）、法律強制（Enforcement）與安全計（Engineering）","D":"創傷之急性死亡約發生於受傷後1～4小時，主要原因為嚴重內臟損傷，其中仍以出血性克為最多"},"answer":"B","manualChapter":"CH25"},{"id":734,"source":"第五章 創傷急症(2012-2014).doc","question":"有關創傷嚴重度與現場檢傷分類的敘述，下列何者為非？","options":{"A":"所謂改良式創傷分數（Revised Trauma score，RTS）係以「昏迷指數（GCS）」、「平均動脈壓」和「呼吸速率」三個變項運算得來","B":"臨床上只要傷患在到院前RTS中任一變項的分數未達滿分（4分），即應將其視為嚴重創傷傷患","C":"所謂「檢傷不足（under-triage）」係指現場判定為「非嚴重創傷」，最後才發現是「嚴重創傷」者。一般可接受的比率為5～10％以內","D":"所謂「過度檢傷（over-triage）」係指現場判斷為「嚴重創傷」，最後卻診斷為「非嚴重創傷」者。一般可接受的比率為30～50％以內"},"answer":"A","manualChapter":"CH25"},{"id":735,"source":"第五章 創傷急症(2012-2014).doc","question":"25歲男性機車騎士，因閃避前方小狗而撞上安全島。你到達現場時發現傷患仰躺在對向車道，安全帽仍在頭上。移除安全帽後進行初步評估，發現傷患：胸部起伏對稱、呼吸每分鐘24次、頸部及胸部無開放性傷口及壓痛；脈搏規律，每分鐘110次、血壓80／50 mmHg、SPO2 92％、GCS E3V5M6、兩側瞳孔各約3 mm、對光有反應。在感覺方面，四肢感覺正常；在運動方面，兩上肢僅能水平移動，而兩下肢則可垂直移動，但活動時骨盆有疼痛現象。暴露傷患時發現傷患右手腕及右腳踝腫脹變形但無開放性傷口，而頸椎及骨盆則有壓痛現象，根據初步評估，下列敘述何者為是？","options":{"A":"傷患因頸椎受傷導致中央脊髓症候群，因此需以頸圈及長背板固定","B":"傷患因有休克現象，應將長背板尾端墊高，以維持腦部灌流","C":"導致休克最可能的原因為內出血，快速靜脈輸液對傷患有絕對的好處","D":"神經性休克亦是可能的原因，因此在到院前應儘速使用血管收縮劑以穩定傷患血壓"},"answer":"A","manualChapter":"創傷"},{"id":736,"source":"第五章 創傷急症(2012-2014).doc","question":"一位機車騎士撞上電線桿後安全帽破裂，EMT在現場發現傷患，呼吸每分鐘12次，脈搏58次/分，血壓180/100毫米汞柱，神經學檢查顯示GCS為E1V2M3，瞳孔檢查如下圖所示。下列敘述何者為是？","options":{"A":"傷患可能為右側硬膜上出血","B":"傷患可能為右側硬膜下出血","C":"瞳孔不等大的原因為鉤疝（uncal herniation）導致第三對腦神經受壓迫","D":"傷患已呈現腦壓升高現象，應立即插管，並給予過度換氣維持血中二氧化碳濃度在25～30 mmHg"},"answer":"C","manualChapter":"CH12","image":"題庫圖片/736.png"},{"id":737,"source":"第五章 創傷急症(2012-2014).doc","question":"在一汽車碰撞事故中，一位坐於副駕駛座年約三十歲的男性傷患意識模糊且出現奇異式呼吸（paradoxical respiration），此時傷患生命徵象為：血壓74／48 mmHg、呼吸每分鐘42下、脈搏每分鐘132下、指端血氧濃度無法測量到。理學檢查發現病患結膜略顯蒼白，頸靜脈怒張且氣管偏移至右側，肺部聽診發現左肺部呼吸音較小。初步給予BVM正壓呼吸，發現通氣有阻力，因懷疑傷患有張力性氣胸，考慮細針減壓而請求線上醫療指導。請問下列有關細針減壓定位之方式，何者為是？","options":{"A":"從患側鎖骨中線，鎖骨的位置往下數兩個肋間即是","B":"從Louis angle（胸骨角）往患側平移，摸到肋骨後，往上一個肋間，與鎖骨中線交會點即是","C":"從Louis angle（胸骨角）往患側平移，摸到肋骨後，往下一個肋間，與鎖骨中線交會點即是","D":"從患側乳頭往上數兩個肋間即是"},"answer":"C","manualChapter":"創傷"},{"id":738,"source":"第五章 創傷急症(2012-2014).doc","question":"20歲男性與他人發生囗角，胸囗被對方揍了一拳之後突然倒地，EMT到達現場後發現傷患已無生命徵象，急救當中心電圖監視器顯示如下：請問該傷患最可能的診斷為？","options":{"A":"心肌挫傷（cardiac contusion）","B":"心臟震盪（commotio cordis）","C":"心包膜填塞（cardiac tamponade）","D":"創傷性窒息（traumatic asphyxia）"},"answer":"B","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/738.png"},{"id":739,"source":"第五章 創傷急症(2012-2014).doc","question":"一50歲女性機車騎士與遊覽車發生碰撞事故後倒地。EMT到達現場後發現醒躺在遊覽車右後輪旁。傷患主訴大腿疼痛無法行動，初步評估顯示傷患意識清醒、呼吸正常、脈搏每分110次、血壓100／60 mmHg、暴露身體顯示左大腿瘀青腫脹、靠近鼠蹊部有一約20公分寬之輪胎痕，其餘檢查並無明顯異常。請問下列敘述何者最正確？","options":{"A":"傷患可能有左側股骨骨折，故移動前應以夾板施行長腿固定（long leg splint）","B":"傷患可能有左側股骨骨折，固定後應抬高患肢以避免肢體腫脹","C":"左側股骨骨折並不足以解釋目前的生命徵象，因此需積極尋找其他可能的創傷","D":"傷患因有高能量之創傷機轉，最好直接後送至最近且最高級的急救責任醫院"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":740,"source":"第五章 創傷急症(2012-2014).doc","question":"在房屋倒塌的現場，一35歲男性雙下肢被壓迫已超過12個鐘頭，現傷患即將脫困。請問下列敘述何者正確？","options":{"A":"為防止休克，在脫困前應給予大量乳酸林格氏液靜脈輸注","B":"傷患兩下肢長時間缺血，使用止血帶會加重下肢缺血狀況，因此禁止使用","C":"血液中的鈣離子透過被破壞的細胞膜流進細胞內，造成全身性的低血鈣","D":"產生腔室症候群的原因是下肢肢體受壓迫導致腔室空間變小、壓力變大所致"},"answer":"C","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":741,"source":"第五章 創傷急症(2012-2014).doc","question":"在一工廠火災的事故中，一位30歲男性傷患體重80kg，全身體表面積中20％為一度灼傷、50％為二度灼傷、10％為三度灼傷，現傷患已被救出且距受傷約已30分鐘，距後送醫院約30分鐘之車程。若你已為傷患建立大管徑的靜脈管路，且傷患無其他出血則依照Parkland formula，你在到院前大約該給多少的靜脈輸液？","options":{"A":"600毫升／小時","B":"800毫升／小時","C":"1,200毫升／小時","D":"1,600毫升／小時"},"answer":"C","manualChapter":"CH31"},{"id":742,"source":"第五章 創傷急症(2012-2014).doc","question":"創傷導致大量出血若未及時處置即可能發生「創傷致命三合症（Lethal Triad of Trauma）」，最後導致多重器官衰竭造成死亡。下列何者不屬於「創傷致命三合症」？","options":{"A":"凝血病變（coagulopathy）","B":"低血氧（hypoxia）","C":"低體溫（hypothermia）","D":"酸血症（acidosis）"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":743,"source":"第五章 創傷急症(2012-2014).doc","question":"有關創傷死亡三個高峰（Trimodal Distribution of Trauma Death）的敘述，下列何者錯誤？","options":{"A":"為Trunkey於1983年所發表，其中以受傷後1小時內死亡所佔的比率最高，約50％","B":"提升EMT-P對創傷急救的能力可以有效減少受傷後1小時內死亡的人數與比率","C":"早期死亡指受傷後1～4小時內死亡，主要原因為嚴重內臟損傷導致出血性休克","D":"晚期死亡指受傷1～4週後死亡，主要原因為感染導致敗血症及多重器官衰竭"},"answer":"B","manualChapter":"CH25"},{"id":744,"source":"第五章 創傷急症(2012-2014).doc","question":"你出勤到現場救護一名從天橋墜落、患有憂鬱症之19歲女性傷患時，發現傷患仰躺在馬路上，眼睛張開，一直在呻吟。此時你呼喊傷患，傷患眼睛仍一直張開並持續呻吟，對你的呼喊毫無回應。當你以疼痛刺激其胸骨時，傷患眼睛仍然張開、仍一直呻吟且手會動，但無法越過傷患身體中線及其肩膀。請問下列有關傷患GCS（Glasgow coma scale）評分，何者正確？","options":{"A":"E2M4V2","B":"E2M5V2","C":"E4M4V2","D":"E4M5V2"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":745,"source":"第五章 創傷急症(2012-2014).doc","question":"有關脊椎損傷的敘述，下列敘述何者為是？","options":{"A":"所謂神經性休克（neurogenic shock）係指脊髓受傷導致副交感神經失去對血管的控制，引起全身性的血管擴張","B":"脊髓性休克（spinal shock）指脊髓損傷後，脊髓的所有功能，表現如同完全脊髓損傷，但通常可在24小時內恢復脊髓的所有功能","C":"若頸椎受傷導致前脊髓症候群（anterior cord syndrome）時，會有四肢輕癱現象，且上肢較下肢嚴重。但痛覺及溫度感覺仍保留","D":"交感神經過度反射症候群（autonomic hyperreflexia syndrome）常見於胸椎下段脊髓（第6胸椎以下）損傷，與交感神經興奮、腎上腺素大量釋放有關"},"answer":"B","manualChapter":"CH27"},{"id":746,"source":"第五章 創傷急症(2012-2014).doc","question":"一50歲男性機車騎十與遊覽車發生碰撞事故後倒地。EMT到達現場後發現醒躺在遊覽重後輪旁。傷患主訴大腿疼痛無法行動，初步評估顯示傷患意識清醒、呼吸正常、脈每分120次、血壓100／60 mmHg、暴露身體顯示左大腿瘀青腫脹、靠近鼠蹊部有一約20公分寬之輪胎痕，其餘檢查並無明顯異常。請問下列敘述何者最正確？1.由創傷機轉來評估，應立刻送至創傷中心2.由解剖傷勢來評估，應可送至創傷中心3.由生命徵象來評估，應立刻送至創傷中心4.傷患可能有左側股骨骨折，固定後應抬高患肢以避免肢體腫脹","options":{"A":"1＋2","B":"2＋4","C":"1＋2＋4","D":"1＋2＋3＋4"},"answer":"A","manualChapter":"創傷"},{"id":747,"source":"第五章 創傷急症(2012-2014).doc","question":"下列狀況應考慮有高能量機轉，即使傷患現場生命徵象穩定，亦應視為嚴重多重創傷將其送往最近且最高層級的創傷急救責任醫院？甲：身體被車輛輾過。乙：機車或汽車碰撞事故中傷患被彈出車外，且距車體超過一公尺。丙：死亡車禍之同車倖存者（包括死者）。丁：由二樓以上（高6公尺以上）墜落。請問下列組合何者為是？","options":{"A":"只有甲","B":"只有甲、乙","C":"只有甲、乙、丙","D":"甲、乙、丙、丁都是"},"answer":"D","manualChapter":"CH25"},{"id":748,"source":"第五章 創傷急症(2012-2014).doc","question":"在到院前創傷性休克傷患給予靜脈輸液方面，以下何者是目前較被接受的原則？","options":{"A":"休克傷患且預計現場時間或後送時間超過10分鐘者，應給予靜脈輸液治療","B":"若須給予靜脈輸液，應以建立小管徑的靜脈管路為佳","C":"靜脈管路建立的部位，應盡量在骨折部位","D":"若要給予靜脈輸液，建議給予溫的生理食鹽水或林格氏液"},"answer":"D","manualChapter":"CH26"},{"id":750,"source":"第五章 創傷急症(2012-2014).doc","question":"下圖該患者姿勢是？該患者姿勢是？","options":{"A":"去大腦皮質姿勢","B":"去大腦姿勢","C":"去小腦姿勢","D":"去延腦姿勢"},"answer":"B","manualChapter":"CH27","image":"題庫圖片/750.png"},{"id":751,"source":"第五章 創傷急症(2012-2014).doc","question":"題目：下圖表示？該圖表示？","options":{"A":"氣胸","B":"連枷胸","C":"血胸","D":"氣管斷裂"},"answer":"A","manualChapter":"CH28","matchedChapters":["需要圖片"],"image":"題庫圖片/751.png"},{"id":752,"source":"第五章 創傷急症(2012-2014).doc","question":"下列有關創傷急救概念的敘述，何者為非？","options":{"A":"因創傷導致死亡的傷患，約有50％左右於受傷後一小時內死亡","B":"急救的重點在幫助「可避免的死亡」不致發生","C":"評估的重點在注意「診斷上的錯誤」，因為診斷只有一個","D":"初步評估的目的是讓傷患的生命徵象穩定，再度評估的目的則是整體而詳細的評估傷患"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":753,"source":"第五章 創傷急症(2012-2014).doc","question":"有關於胸部鈍傷方面，下列敘述何者為非？","options":{"A":"合併第一、二肋骨骨折時須高度懷疑主動脈的損傷","B":"張力性氣胸的病患不一定出現頸靜脈怒張","C":"合併第十到十二肋骨骨折須懷疑肝臟或脾臟的損傷","D":"目前在台灣，若EMT在院外發現懷疑張力性氣胸的傷患，可直接進行針刺減壓"},"answer":"D","manualChapter":"CH28"},{"id":754,"source":"第五章 創傷急症(2012-2014).doc","question":"陽明山發生小客車翻落山谷意外，救難人員到達現場後花了1個小時，才將某一傷患自變形的車體內救出，傷者意識模糊，臉色蒼白，四肢冰冷，脈搏微弱，雙下肢小腿處明顯變形。下列有關現場緊急救護人員之處置，何者最優先？","options":{"A":"因傷患傷勢嚴重，且困於現場時間太久，為爭取治療時效，立即送上救護車，前往距離現場最近的任何一家醫院","B":"為避免傷者於運送過程中因大量失血休克而死，必須立即給予大量點滴輸液，等到血壓穩定後，才能送往醫院","C":"立即將傷者的衣物移除，從頭檢查到腳，更不可遺忘背部，找出出血處，先進行初步止血，以免傷勢加重","D":"在為傷者戴上頸圈時若發現氣管偏右移，頸靜脈怒張，且左側呼吸音微弱，應考慮有左側張力性氣胸之可能，要先處理"},"answer":"D","manualChapter":"CH25"},{"id":755,"source":"第五章 創傷急症(2012-2014).doc","question":"建築工地灌漿時發生樓層坍塌，一名50歲男性工人受困其中，雙下肢被鋼樑壓住，救難人員花了6小時才將他救出，雙下肢外觀明顯腫脹且痛，腳趾蒼白無感覺，小便顏色為深褐色，下列敘述，何者為是？","options":{"A":"抽血檢驗可能會發現高血鉀、肌肉酵素升高、高血鈣","B":"為防止急性腎衰竭出現，必須要給予大量晶質輸液並酸化尿液","C":"若發生致命性心律不整，選擇急救藥物時，需要將葡萄糖酸鈣列入考慮","D":"筋膜切開術會造成更進一步的傷害，不可進行"},"answer":"C","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":756,"source":"第五章 創傷急症(2012-2014).doc","question":"一位25歲約60公斤的男性自火災現場被救出，意識模糊，聲音沙啞，全身多處灼傷，前額頭髮、眉毛及鼻毛均已燒焦，血壓100／65 mmHg，心跳120／min，血氧濃度85％，身體燒燙傷面積為1度10％，2度30％，3度20％，請問下列處置，何者不適當？","options":{"A":"給予一般型氧氣面罩，維持血氧濃度在94％以上即可","B":"問清楚火災現場環境，因為燒傷除了吸入性傷害及一氧化碳中毒外，仍要小心其他化學物質的傷害","C":"檢查身體是否有合併其他傷害","D":"按照Parkland formula，前8小時的輸液量要給予6,000ml的乳酸林格氏液（lactated Ringer's）"},"answer":"A","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":758,"source":"第五章 創傷急症(2012-2014).doc","question":"50歲男性小客車駕駛，因酒醉駕車高速撞上前方停紅燈車輛，EMT表示該駕駛身上繫有安全帶，且安全氣囊己爆開；到院時身上無明顯外傷，全身酒味，意識混亂，呼吸正常，血壓110／80 mmHg，心跳120／min，血氧濃度98％，請問下列敘述，何者為是？","options":{"A":"因繫有安全帶，且無頭部外傷，故可排除頸椎傷害","B":"超音波未見腹腔內出血，即可排除小腸出血的可能","C":"為了排除胰臟受傷，可以利用超音波有效判斷","D":"因受酒精影響，傷者腹部觸診無壓痛時，仍不能排除腹腔臟器受傷的可能"},"answer":"D","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":759,"source":"第五章 創傷急症(2012-2014).doc","question":"關於顱颜部創傷，下列敘述何者不適當？","options":{"A":"臉部中央骨骨折的傷患，其臉部浮腫，可能會有不穩定的上頷骨，因此呼吸道處置時，應盡快置入鼻咽呼吸道，以防臉骨塌陷，血水堵住呼吸道","B":"外耳道或鼻孔流出之血水，要用無菌紗布或棉花暫時給予填塞止血，再照會耳鼻喉科醫師評估","C":"急性硬腦膜上血腫（epidural hematoma）可能會出現清明期（lucid interval），通常是顳骨骨折，中硬腦膜動脈（middle meningeal artery）破裂造成","D":"巴氏徵候（Battle's sign）出現，要懷疑有岩樣骨折"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":760,"source":"第五章 創傷急症(2012-2014).doc","question":"一位從火場被救出的病患，外觀呈現臉部一度燒傷，鼻毛燒焦，目前意識清楚，血壓130／80，脈搏110，呼吸30，胸部有喘鳴聲，要建立其呼吸道時，下列何者為是？","options":{"A":"氣管內插管並給予高濃度氧氣","B":"有儲留袋之面罩給氧10～12 L／min","C":"傷患應有呼吸道灼傷，應使用LMA（喉罩呼吸道）以建立呼吸道","D":"若傷患應有有呼吸道灼傷，可使用口咽、鼻咽以建立呼吸道"},"answer":"A","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":761,"source":"第五章 創傷急症(2012-2014).doc","question":"20歲女性，燒炭自殺不慎引起火警。EMT從火場移出後傷患意識不清、對聲音有反應，無鼻毛燒焦、全身無燒燙傷痕跡、無明顯外傷。血壓120／70，脈搏100，呼吸20，呼吸平順無雜音。下列處置何者為是？","options":{"A":"立即建立呼吸道，包括口咽、鼻咽甚至於LMA","B":"可給予非再吸入型氧氣面罩並調整流速至15公升／分，以提供高濃度氧氣","C":"立即以鼻翼管給予氧氣治療以提高血氧濃度","D":"應以血氧監視器評估。若無缺氧現象，可以不用氧氣治療"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":763,"source":"第五章 創傷急症(2012-2014).doc","question":"有關失血量與生理變化的評估，下列何者為非？","options":{"A":"失血量超過50％者，將失去脈搏","B":"失血量30～40％者，意識混亂","C":"失血量高達30％者，血壓可能仍為正常","D":"失血量15～30％者，心率不變"},"answer":"D","manualChapter":"CH26"},{"id":764,"source":"第五章 創傷急症(2012-2014).doc","question":"有一車禍救護案件，摩托車撞倒的路人，主訴腹痛、頭暈、嘔心感，血壓80／50 mmHg，脈搏130／min，皮膚濕冷，臉色蒼白。最有可能是那一種休克？","options":{"A":"出血性休克","B":"神經性休克","C":"阻塞性休克","D":"敗血性休克"},"answer":"A","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":765,"source":"第五章 創傷急症(2012-2014).doc","question":"在創傷性休克傷患給予靜脈輸液時，下列何者為是？","options":{"A":"休克傷患一律給與靜脈輸液治療","B":"EMT-P應優先使用膠質輸液（colloids）而非晶質輸液（crystalloids）","C":"若須給予靜脈輸液，應以建立大管徑的靜脈管路為佳","D":"靜脈輸液的流速和留置導管的長度呈正比"},"answer":"C","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":766,"source":"第五章 創傷急症(2012-2014).doc","question":"關於創傷性休克的敘述，下列何者為非？","options":{"A":"創傷病患出現休克，最常見的是出血性休克","B":"可以用血液中的乳酸值，來評估休克的嚴重程度","C":"因低血容休克造成的代謝性酸中毒，施打sodium bicarbonate（碳酸氫鈉）就可以","D":"給予輸液復甦後，仍需評估患者對輸液復甦的反應，因為這可能會影響到接下來的方向，諸如是否手術等"},"answer":"C","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":767,"source":"第五章 創傷急症(2012-2014).doc","question":"你接獲通知有汽車撞擊護欄，到達現場發現一26歲男性為汽車駕駛，未繫安全帶，意識混亂，但可模糊說出自己姓名，呼吸速率28下／分，心跳126下／分，BP96／70 mmHg，下列敘述何者為非？","options":{"A":"傷患有休克狀況，應該要尋找可能出血的地方，如胸腔、腹腔、長骨骨折等","B":"考量可能出現頭部外傷，給予輸液應該小心，所以流速不可太快","C":"若是出血性休克，此狀況符合第三級休克（Class Ⅲ），預估出血量達30％以上","D":"應該要送至創傷中心，因為除了給予輸液復甦外，需要輸血甚至手術的機會很高"},"answer":"B","manualChapter":"CH25"},{"id":768,"source":"第五章 創傷急症(2012-2014).doc","question":"在處理頭部外傷的傷患，初步評估最重要的步驟是？","options":{"A":"維持呼吸道暢通","B":"戴上頸圈","C":"控制頭皮出血","D":"決定傷患現在GCS的分數"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":769,"source":"第五章 創傷急症(2012-2014).doc","question":"通報有一打架事件，當EMT抵達現場後，現場只有一名年輕男性，頭臉部有被毆打的傷囗，你發現他意識昏迷，觸診發現有頭骨凹陷性骨折，臉部瘀腫，呼吸有鼾音，且臉上和衣服上都有嘔吐物，在給予氧氣及以推下顎法打開呼吸道後，最適當的下一步是？","options":{"A":"以袋瓣罩給傷患通氣","B":"囗咽部抽吸","C":"予以頸圈固定","D":"快速檢查有無其他大出血"},"answer":"B","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":770,"source":"第五章 創傷急症(2012-2014).doc","question":"孕婦在捷運站被人刺傷，你被通知前往現場，發現他懷孕32周，右胸上方有一穿刺傷囗，無氣血泡在其上，但是她呼吸急促，極度焦慮，而且呼喊「救命」，血壓80／60 mmHg，右胸呼吸音聽起來有減弱，最適當的第一步驟是？","options":{"A":"聯絡線上醫療指導，考慮經囗插管","B":"聯絡線上醫療指導，考慮右胸針刺減壓","C":"考慮將子宮左推","D":"考慮打兩條大口徑I.V.，開始給予輸液復甦"},"answer":"B","manualChapter":"CH49"},{"id":771,"source":"第五章 創傷急症(2012-2014).doc","question":"一名57歲男性，從火場救出，意識清楚但躁動，臉上和前胸有大片灼傷，頭髮眉毛均燒焦，關於此病人敘述，下列何者為非？","options":{"A":"若咳出黑色痰液，出現stridor，需要先建立呼吸道","B":"需先終止繼續灼傷，包括沖水降溫","C":"快速評估灼傷面積，以Parkland formula計算輸液量，前八個小時要全部給予","D":"若上肢出現開放性骨折，也需要沖洗傷囗，以護木固定患肢"},"answer":"C","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":773,"source":"第五章 創傷急症(2012-2014).doc","question":"70歲男性，機車騎士車禍，左小腿上段變形，下列關於EMT的現場處置，何者為非？","options":{"A":"變形部分需要固定，固定前須先檢查脈搏、感覺、運動功能","B":"足部的搏動點，可以檢查足背動脈，也可以檢查脛後動脈（posterior tibial artery），脛後動脈在腳踝處是走在外踝（lateral malleolus）後方","C":"若腫脹非常厲害，除了考慮出血量多以外，也要注意是否出現腔室症候群","D":"患者頸部肌肉有疼痛，但無神經學症狀，依據加拿大頸椎守則，還是需要給予頸圈固定"},"answer":"B","manualChapter":"創傷"},{"id":774,"source":"第五章 創傷急症(2012-2014).doc","question":"勤務中心通知有一瓦斯行氣爆，當你抵達現場，救災人員將一名50歲男性（體重75 Kg）抬出，他意識混亂，但臉上有灼傷，鼻毛眉毛燒焦，呼吸急促，全身共有20％二度到三度灼傷，下列敘述何者為非？","options":{"A":"若是意識混亂，除了懷疑有頭部外傷外，也要注意是否因低血氧或休克造成","B":"若是血氧低下，除了呼吸道可能阻塞外，也有可能出現氣胸情形，或是因外傷造成氣血胸","C":"若是血壓太低，可能是身上灼傷造成體液流失，應該給予生理食鹽水點滴，流速約375 cc／hr","D":"意識混亂也可能是一氧化碳中毒造成，所以應給予高濃度氧氣"},"answer":"C","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":776,"source":"第五章 創傷急症(2012-2014).doc","question":"根據ATLS第9版，目前對於休克病患的急救概念，以下「何者為非」？","options":{"A":"Controlled resuscitation（控制性的輸液急救治療）","B":"Balanced resuscitation（平衡性的輸液急救治療）","C":"Hypotension resuscitation（維持可接受性的低血壓）","D":"Aggressive resuscitation（積極性的輸液急救治療）"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":777,"source":"第五章 創傷急症(2012-2014).doc","question":"關於改良式創傷指數（RTS）評估內容，以下「何者為非」？","options":{"A":"GCS昏迷指數","B":"MAP平均動脈壓","C":"R·R·呼吸速率","D":"只要傷患在到院前RTS沒有滿分（＜12），救護技術員即應視之為嚴重創傷"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":778,"source":"第五章 創傷急症(2012-2014).doc","question":"關於確切呼吸道，以下「何者為非」？","options":{"A":"插置氣管內管（endotrachealtube）","B":"環甲狀軟骨膜切開術（cricothyroidotomy）","C":"喉罩呼吸道（LMA）","D":"氣切管（tracheostomy）"},"answer":"C","manualChapter":"CH27"},{"id":779,"source":"第五章 創傷急症(2012-2014).doc","question":"關於GCS（昏迷指數）的評估敘述，以下「何者為非」？","options":{"A":"去皮質姿勢（decorticate posturing）：患者呈現現上肢彎屈、下肢僵直伸展，表示大腦皮質的損傷","B":"去大腦姿勢（decerebrate posturing）：昏迷傷患呈現上、下肢均呈僵直伸展，表示腦幹的損傷","C":"若病患因腦中風導致左側肢體偏癱無力，右側肢體仍可以依照命令活動，則此病患GCS評估時，M應該為滿分","D":"若病患與以疼痛刺激時，眼睛才會睜開，並且手可以準確撥開疼痛刺激的位置，口中僅能發出無意義的聲音，則此病患的GCS為9分"},"answer":"A","manualChapter":"CH36"},{"id":780,"source":"第五章 創傷急症(2012-2014).doc","question":"下列關於一氧化碳的敘述，下列「何者為非」？","options":{"A":"一氧化碳是一種無色、無味的氣體，多發生在有機物質的不完全燃燒。它和血液中的血紅素的親和力是氧氣的250倍","B":"一氧化碳中毒病患皮膚大多會呈現櫻桃紅顏色","C":"一氧化碳血紅素的半衰期，在一大氣壓100％氧氣，半衰期為40～60分鐘","D":"一氧化碳血紅素的半衰期，在一般室內氣體，半衰期為4～5小時"},"answer":"B","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":784,"source":"第五章 創傷急症(2012-2014).doc","question":"皮膚遭灼傷的局部反應有三區變化：甲、充血區；乙、靜滯區；丙：凝固區。請問以灼傷點為圓心，由內向外依序是：","options":{"A":"乙→丙→甲","B":"丙→乙→甲","C":"甲→乙→丙","D":"乙→甲→丙"},"answer":"B","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":785,"source":"第五章 創傷急症(2012-2014).doc","question":"火場搶救出中年男性約60公斤，傷勢：「前胸及腹部為二度及三度燒傷，雙腿全部為三度燒傷，雙手臂為一度燙傷」。依巴克蘭公式（Parkland formula），在燒傷後的第一個8小時中應給林格氏液的量大約為？","options":{"A":"6,500cc","B":"8,500cc","C":"2,000cc","D":"15,000cc"},"answer":"A","manualChapter":"CH31"},{"id":786,"source":"第五章 創傷急症(2012-2014).doc","question":"一位45歲病患因頭部外傷需要急救，病患數小時前意識尚清楚，數小時後突然越來越模楜且瞳孔一邊放大對光無光反應。請問控制瞳孔光反應之傳導路徑為何？","options":{"A":"CN Ⅱ進CN Ⅲ出","B":"CN Ⅲ進CN Ⅱ出","C":"CN Ⅱ進CN Ⅱ出","D":"CN Ⅲ進CN Ⅲ出"},"answer":"A","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":787,"source":"第五章 創傷急症(2012-2014).doc","question":"如下圖的傷口，應該被描述成？","options":{"A":"挫傷","B":"穿剌傷","C":"剝離傷","D":"撕裂傷"},"answer":"D","manualChapter":"CH30","matchedChapters":["NeedImage"],"image":"題庫圖片/787.png"},{"id":788,"source":"第五章 創傷急症(2012-2014).doc","question":"35歲男性自約6米高處墜樓後送醫，到院時意識清楚，但血壓低合併休克症狀，同時患者失去對大腸及膀胱的感覺，且合併陰莖持續勃起，此時你認為其休克的原因最可能為？","options":{"A":"心因性休克（cardiogenic shock）","B":"神經性休克（neurogenic shock）","C":"脊隨性休克（spinal shock）","D":"低血容性休克（hypovolemic shock）"},"answer":"B","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":789,"source":"第五章 創傷急症(2012-2014).doc","question":"如下圖的傷囗，應該被描述成？","options":{"A":"挫傷","B":"撕裂傷","C":"剝離傷","D":"穿剌傷"},"answer":"C","manualChapter":"CH30","image":"題庫圖片/789.png"},{"id":790,"source":"第五章 創傷急症(2012-2014).doc","question":"某夏日下午，你正與朋友約在高爾夫球場咖啡廳聊天，聊的正開心的時候外面突然下起大雷雨且雷電交加，此時聽到球場工作人員大叫：「有一組球友被雷擊了！」；身為高級救護技術員的你，此時當然放下手中的飲料飛奔至現場幫忙。映入眼簾的是有三名病患倒在地上，另有一名病患在旁邊呆站著喃喃自語，請問下列敘述何者為非？","options":{"A":"在做現場評估救護以前，應先確認環境安全，考慮請人幫忙將倒地三人移至安全處，以免再遭雷擊","B":"甲病患倒在地上但意識清楚，看起來非常緊張且不斷請求你幫忙，說著他全身好麻無起身，除呼吸每分鐘32下外，生命徵象看來穩定，全身無明顯外傷，橈動脈摸的到，此病患應判成綠色。","C":"乙病患有意識，外觀除右下肢嚴重變形外看起來均正常，橈動脈摸的到且可以遵從你的指令做動作，此病患應判為黃色。","D":"丙病患無意識無呼吸，打開呼吸道兩次仍然沒有自發性呼吸，此病患應判為黑色傷患但需優先救治。"},"answer":"B","manualChapter":"CH52"},{"id":791,"source":"第五章 創傷急症(2015-2018).doc","question":"對於胸部創傷之陷阱及注意事項，下列何者為是？","options":{"A":"懷疑主動脈不完全破裂時，繼續積極處理不需考慮轉診至有能力處理的醫院","B":"插入胸管後仍有持續性氣胸，且肺臟無法擴張時，可先不用懷疑氣管.支氣管之破食道破裂","C":"橫隔破裂容易診斷，除了會影響呼吸功能外，更可能造成移位到胸腔之腹內器官缺血.壞死及破裂","D":"肋骨骨折之傷患可給予止痛藥物以免影響呼吸功能，造成進一步之肺部併發症及腸胃問題"},"answer":"D","manualChapter":"CH28"},{"id":792,"source":"第五章 創傷急症(2015-2018).doc","question":"關於壓碎性傷害，以下敘述何者為非？","options":{"A":"肢體長期壓迫，導致受傷肌肉釋放毒性物質引起急性腎衰竭","B":"可能出現高CK.高鉀.高磷.低鈣的情形","C":"可以大量輸液，以及鹼化尿液來治療","D":"受傷後數個小時內，CK值不高即可排除"},"answer":"D","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":794,"source":"第五章 創傷急症(2015-2018).doc","question":"幼兒的各項受傷中，可能懷疑有兒童虐待的情形何者為非？","options":{"A":"Corner骨折","B":"Epiphyseal-metaphyseal的肋骨骨折","C":"旋轉性上臂肱骨骨折","D":"二次以上的肘關節脫臼"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":795,"source":"第五章 創傷急症(2015-2018).doc","question":"某一工人在建築工地倒塌中被卡在瓦礫中，約6個小時後被救，送至急診室，經檢查並無明顯骨折，但傷患下半身酸痛無力，再來應做那些檢查？","options":{"A":"電腦斷層","B":"血糖測定","C":"血液生化.CPK及Myoglobulin測定","D":"神經傳導及肌電圖檢查"},"answer":"C","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":796,"source":"第五章 創傷急症(2015-2018).doc","question":"五十歲男性，因車禍被送入急診，意識清楚，自訴駕車不慎撞擊及路墩，並抱怨胸痛，此時您認為下列何種病史最具診斷價值？","options":{"A":"是否使用安全帶","B":"方向盤是否變形","C":"開車前是否喝酒","D":"是否邊開車邊使用行動電話"},"answer":"B","manualChapter":"CH22"},{"id":797,"source":"第五章 創傷急症(2015-2018).doc","question":"20歲男性，騎機車發生車禍，送至急診室時，血壓70／50 mmHg、意識模糊、對痛有反應、喃喃自語、頭皮有血腫，經大量輸液後，血壓90/50 mmHg，皮膚仍然溼冷，微血管再填充時間為5秒，電腦斷層顯示額葉散在性的出血，下列何者處置為佳？","options":{"A":"給予mannitol，積極治療顱內壓昇高，以期治療低血壓","B":"給予昇壓劑，以提高腦灌注壓，改善腦部灌流","C":"安排胸部X光，與腹部超音波，積極地找尋其他的出血","D":"安排緊急開顱手術"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":798,"source":"第五章 創傷急症(2015-2018).doc","question":"KTV發生打架互毆事件，其中一傷患自行步人急診，主訴腹部被棒球鋁棒重擊後，疼痛異常，經你檢查此腹部鈍傷的傷患後，安排腹部Ⅹ-光檢查，你於X-光影像中發現腰肌影像（psoas shadow）旁有游離空氣（free air），此時要高度懷疑傷患何處受傷？","options":{"A":"脾臟","B":"十二指腸","C":"胰臟","D":"空腸"},"answer":"B","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":799,"source":"第五章 創傷急症(2015-2018).doc","question":"高女士40歲，走樓梯時不慎滑倒，經送醫檢查診斷為中央脊髓症候群（Central cord syndorme），下列有關此脊髓受傷之敘述中何者為是？","options":{"A":"後脊髓動脈分支的損傷可能是主要原因","B":"下肢運動喪失比上肢嚴重","C":"用steroid治療，先Solu-medrol 54mg/kg滴注，之後再持續23小時以3.0 mg/kg/hr滴注","D":"恢復時依先後次序為下肢.膀胱.近側上肢.手"},"answer":"D","manualChapter":"CH27"},{"id":800,"source":"第五章 創傷急症(2015-2018).doc","question":"關於創傷到院前救護的觀念，以下何者為是？","options":{"A":"越是嚴重的傷患，越需要就近送醫","B":"良好的到院前創傷救護系統能夠降低的是「不可預防死亡（non-preventable death）」，至於「可預防死亡」，（preventable death）則是要透過公衛手法，例如宣導騎機車使用安全帽，才能降低","C":"創傷出血性休克傷患的確定照護（Definite care）是緊急輸血","D":"現場創傷檢傷比較能夠容忍過度檢傷（over triage）而不是檢傷不足（under triage）"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":801,"source":"第五章 創傷急症(2015-2018).doc","question":"關於損傷預防的3個E，以下敘述何者為是？","options":{"A":"有權制定損傷預防相關法規的官員或議員都是被教育（education）的對象之一","B":"法律強制（enforcement）的效果最差，若非不得已，不建議使用","C":"緊急狀態宣告（emergency），針對天災人禍，對適用地區宣告緊急狀態，有助於避免傷害的發生","D":"安全設計（engineering）的例子：以科學方法測量煞車痕，推算車禍發生時的車速來幫助釐清肇事責任"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":802,"source":"第五章 創傷急症(2015-2018).doc","question":"初步評估的目標是抓出可能立即致死之創傷狀況，以下敘述何者為是？","options":{"A":"創傷性主動脈剝離死亡率極高，是以需在初度評估診斷並予以治療","B":"心包膜填塞的理學檢查體徵包括雙側頸動脈怒張與遙遠模糊的心音","C":"左側張力性氣胸的會造成左側單側的頸靜脈怒張，右側張力性氣胸則是造成右側單側頸靜脈怒張","D":"開放性氣胸若導致傷患死亡，其機轉是因為出血性休克所致"},"answer":"B","manualChapter":"CH28"},{"id":803,"source":"第五章 創傷急症(2015-2018).doc","question":"貴單位的醫療指導決定明年1月1日起將創傷現場檢傷送創傷中心的條件，由GCS＜13改成≦14，假設醫療水準與人口組成，交通狀況均相似的假設下，請問您預估明年度的送醫狀況相較於今年度，下列敘述何者為是？","options":{"A":"會有更多的ISS≧16（嚴重創傷）傷患因為這個改變被正確送到創傷中心","B":"明年度創傷中心收治的總人數會下降","C":"會有更多的ISS＜16傷患被正確送到就近急救責任醫院","D":"不會有影響"},"answer":"A","manualChapter":"CH25"},{"id":804,"source":"第五章 創傷急症(2015-2018).doc","question":"關於創傷休克的敘述，以下何者為是？","options":{"A":"頸靜脈不可能同時又怒張又塌陷，所以低血溶性休克不可能跟阻塞性休克同時發生","B":"若研判創傷傷患有心因性休克，需立刻給予傷患阿斯匹靈（Aspirin）300 mg口服","C":"顱內硬腦膜上出血最容易造成神經性休克","D":"出血性休克第二期為失償性休克，常見的理學檢查體徵是脈搏壓變小"},"answer":"D","manualChapter":"CH26"},{"id":805,"source":"第五章 創傷急症(2015-2018).doc","question":"自火場救出的傷患二隻手臂均有二度及三度灼傷，並主訴頭痛噁心，以下之敘述？","options":{"A":"初評時，傷患能對話，研判呼吸道正常，以排除吸入性灼傷的可能","B":"常規為傷患量測血壓及血氧值，以決定是否進行氧氣治療","C":"病史詢問除應依循一般通則外，現場資訊也很重要。例如：現場可能的燃燒物為何？是否有涉及化學物品的燃燒或接觸等","D":"傷患屬於嚴重灼傷，應通報為重大創傷個案並送往創傷中心治療"},"answer":"C","manualChapter":"CH31"},{"id":806,"source":"第五章 創傷急症(2015-2018).doc","question":"關於創傷型式與機轉之敘述何者為是？","options":{"A":"高級救護技術員除應依循創傷初步與二度評估處置原則處置傷傷患外，特別強調創傷機轉的詢問，以判斷潛藏傷害並預防併發症發生","B":"爆炸傷是一種複合性的傷害，當爆炸發生時會有四階段的受傷機轉，首當其衝是呼吸道的吸入性傷害，屬於第一階段傷害，因此處置爆炸傷的傷患都必須立即穩定其呼吸道","C":"高速公路上，自小客車失事撞上右側護欄，車身嚴重擠壓變形，高級救護技術員到達現場評估脫困後之傷患，若其生命徵象穩定且無胸腹部疼痛，就不須後送創傷中心","D":"根據國外相關文獻統計，高處墜落是造成鈍挫傷最主要的原因，因其直接造成骨盆骨折及骨盆腔內器官之損傷"},"answer":"A","manualChapter":"CH25"},{"id":807,"source":"第五章 創傷急症(2015-2018).doc","question":"關於腹部創傷之敘述何者為是？","options":{"A":"傷患被他人用尖刀刺入右前胸第6肋間位置，這個高度已經沒有腹部臟器，不會造成腹內傷害","B":"後腹腔創傷之體徵包括Turner sign（腰部瘀青）與Cullen sign（肚臍周圍瘀青），為早期病程之常見發現","C":"傷患被他人以步槍射擊，彈孔出現於右上背肩胛骨脊，此位置已經高於後腹腔，不會造成腹內傷害","D":"腹部創傷是所有創傷中最容易被忽略或延誤者。尤其是當傷患意識不清.頸椎受傷導致感覺異常.其他部位有嚴重傷勢.老年人或兒童，均可能影響理學檢查的正確性"},"answer":"D","manualChapter":"CH29"},{"id":808,"source":"第五章 創傷急症(2015-2018).doc","question":"評估疑似頭部創傷意識不清患者，檢查患者二側瞳孔對光反應時，發現單側瞳孔放大，對光反應消失，以下研判及處置何者為是？","options":{"A":"傷患可能同時出現Cushing's triad，造成收縮壓升高.脈搏變快以及不規則的呼吸","B":"可能為視神經遭到壓迫","C":"嚴判顱內壓升高，應立即予以過度換氣，目標是PaC02＜30 mmHg","D":"很快的傷患可能會呈現GCS評估中，M3去大腦皮質（Decorticate）或M2去大腦（Decerebrate）姿勢"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":809,"source":"第五章 創傷急症(2015-2018).doc","question":"四肢肌肉若遭受外力創傷，可能產生腔室症候群或壓碎傷症候群（Crush syndrome），關於兩者以下敘述何者為是？","options":{"A":"腔室症候群可能起因於壓碎傷症候群","B":"開放性骨折因為已經打破腔室，所以不會造成腔室症候群","C":"高血鉀是腔室症候群患者常見的致命性併發症，因此應給予大量輸液與監測心電圖","D":"壓碎傷症候群一旦發生，該患處肢體一定不保，因此治療方針是儘速截肢以挽救生命"},"answer":"A","manualChapter":"CH30"},{"id":810,"source":"第五章 創傷急症(2015-2018).doc","question":"在多重外傷病患之急救時，pulse oximetry為一種非常有用的非侵襲性之工具，被用來偵測血中血紅素氧氣之飽和度。Pulse oximeter的感應器可方便的置於許多體表處。但是下列何處並不適合？","options":{"A":"手指","B":"耳垂","C":"量自動血壓計的四肢","D":"腳趾"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":811,"source":"第五章 創傷急症(2015-2018).doc","question":"一名32歲男性病患，因車禍受傷送醫。理學檢查顯示病患的血壓為70/40 mmHg，心跳速率為110/min，昏迷指數為13，呼吸速率為30/min，呼吸道內沒有異物，頸靜脈鼓脹，氣管移到右側，左側呼吸聲降低，腹部稍微鼓脹且有壓痛。此時該做什麼處置？","options":{"A":"插入氣管插管","B":"在左胸側第二肋間，靠近鎖骨中線處迅速插入大號針頭","C":"照胸部X部光","D":"緊急輸血及輸液"},"answer":"B","manualChapter":"CH20"},{"id":812,"source":"第五章 創傷急症(2015-2018).doc","question":"於頭部外傷病人的初期處理，最重要的步驟為：","options":{"A":"保護呼吸道","B":"保持頸椎不隨意移動","C":"維持血壓","D":"控制頭皮出血"},"answer":"A","manualChapter":"CH27"},{"id":814,"source":"第五章 創傷急症(2015-2018).doc","question":"一名28歲男性，因邊走邊玩手機遊戲，穿越馬路時被時速40公里的汽車撞倒，你和分隊同仁到達現場時發現，患者意識清楚但左大腿變型，患者表示左腹部及左下肢疼痛，現場生命徵象如下：體溫36.8，心跳110/min，呼吸25/min，血壓130/85，血氧98%，根據以上描述，下列處置何者較不適當？","options":{"A":"該患者改良創傷指數（RTS）10分，依據此項評估應立即送往創傷中心","B":"患者左腹有受傷疼痛須考慮脾臟損傷併腹內出血，則依休克評估屬第2級休克","C":"因外傷機轉為行人被汽車撞擊且汽車車速達40/小時，依據此項評估應立即轉送創傷中心","D":"若意識清楚且鎖骨以上無外傷，同時無頸部疼動與上肢神經學症狀，可不上頸圈"},"answer":"A","manualChapter":"CH25"},{"id":815,"source":"第五章 創傷急症(2015-2018).doc","question":"針對創傷傷患，臨床上會使用超音波來協助找尋可能之內臟損傷或出血，下列對應何者為非？","options":{"A":"劍突下界面（subxiphoid view）：看是否有心包膜積液","B":"恥骨上界面（suprapubic view）：看骨盆腔是否有積液","C":"右側肋間側面（right intercostal oblique view）：看胰臟周圍是否有積液","D":"左側肋間側面（left intercostal oblique view）：看脾臟周圍是否有積液"},"answer":"C","manualChapter":"CH21","matchedChapters":["CH21"]},{"id":816,"source":"第五章 創傷急症(2015-2018).doc","question":"對於創傷傷患，下列何者處置無法協助改善患者狀況？","options":{"A":"意識不清的患者給予口咽呼吸道（oropharyngeal airway）以暢通呼吸道","B":"氣管斷裂使用氣管內管插管","C":"張力性氣胸使用空針減壓及胸管置入","D":"低血容休克使用大管徑點滴溫暖輸液"},"answer":"B","manualChapter":"CH25"},{"id":817,"source":"第五章 創傷急症(2015-2018).doc","question":"一名小客車駕駛，年約40歲，因市區酒駕自撞護欄，被附近商家報警處理，你與分隊同仁到達現場時，傷患仍困於車內且胸前及腹部有紅腫，在協助拖困上救護車後患者表示頭暈且冒冷汗，還有胸腹部疼痛，此時生命徵象如下：體溫36.2℃、心跳130/min、呼吸22/min、血壓100/80 mmHg、血氧96%，下列評估與處置，何者最不恰當？","options":{"A":"懷疑有腹內出血，應儘早打上點滴，必要時給予生理食鹽水1.000 c.c.快速灌注（normal saline 1.000 c.c. challenge）","B":"因有胸部挫傷，若懷疑心肌挫傷可做心電圖，但不能因檢查延後送醫過久","C":"可能有頸部創傷，在未完全排除前應上頸圈","D":"患者若出現低血壓，對輸液反應不佳，應考慮給予升壓劑"},"answer":"D","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":818,"source":"第五章 創傷急症(2015-2018).doc","question":"燒傷傷患可依據Parkland Formula給予輸液補充，若一位傷患體重60公斤，全身體表面積中10%為一度灼傷，10%為二度灼傷，10%為三度灼傷，則下列評估與處置何者為非？","options":{"A":"前24小時的估算輸液量為7.200mL","B":"灼傷發生後的前8小時輸液流速為150 mL/hr","C":"之後16小時的輸液流速為前8小時的一半","D":"可以視傷患臨床表現調整流速，如出現血壓低，微血管再充填時間延長，小便量減少，可再給予更多輸液補充"},"answer":"A","manualChapter":"CH31"},{"id":819,"source":"第五章 創傷急症(2015-2018).doc","question":"一名50歲左右男性，自約10公尺高處墜落，你與分隊同仁到達現場時，傷患意識清楚，但血壓低合併休克症狀，同時傷患失去對大腸及膀胱的感覺，且合併陰莖持續勃起，此時你認為其休克的原因最可能為？","options":{"A":"心因性休克（cardiogenicshock）","B":"脊髓性休克（spinalshock）","C":"阻塞性休克（obstructiveshock）","D":"敗血性休克（septicshock）"},"answer":"B","manualChapter":"CH26"},{"id":821,"source":"第五章 創傷急症(2015-2018).doc","question":"下列關於腹部創傷傷患的處置，何者為非？","options":{"A":"維持呼吸道暢通，並保護頸椎","B":"給予足夠氧氣，維持血氧濃度95%以上","C":"對於不穩定骨盆骨折患者，給予骨盆固定及適當輸液治療","D":"外露臟器可嘗試一次將其推回腹腔，若失敗則以無菌濕敷料保護，避免因乾燥而壞死"},"answer":"D","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":822,"source":"第五章 創傷急症(2015-2018).doc","question":"頭部外傷導致意識模糊之病患，下列理學檢查何者和顱底骨折最無相關？","options":{"A":"眼眶周圍瘀青","B":"耳後瘀青","C":"疑似腦脊髓液鼻漏","D":"鼻骨斷裂"},"answer":"D","manualChapter":"CH20"},{"id":823,"source":"第五章 創傷急症(2015-2018).doc","question":"一位45歲女性因汽車車禍，汽車翻滾導致同車乘客死亡，傷患被拋出車外，車禍現場傷患意識清醒抱怨嚴重頭痛，血壓130/80 mmHg，心跳每分鐘68次，呼吸次數每分鐘20下，下列何者為是？","options":{"A":"由生命徵象評估應送至創傷中心","B":"由年齡評估應送至創傷中心","C":"由傷害程度評估應送至創傷中心","D":"由創傷機轉評估應送至創傷中心"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":824,"source":"第五章 創傷急症(2015-2018).doc","question":"一位45歲經火場搶救之女性傷患，現場評估發現，身上多處燒燙傷，前胸約有9%二度燒燙傷，後背約有9%三度傷燙傷，雙上肢共約有9%一度燒燙傷，患者約60公斤，請問該傷患在前8小時建議應給予多少輸液？","options":{"A":"2.160 C.C","B":"4.320 C.C","C":"6.480 C.C","D":"3.240 C.C"},"answer":"A","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":825,"source":"第五章 創傷急症(2015-2018).doc","question":"52歲男性傷患，現場機車與汽車對撞，在現場評估病患意識時，病患眼睛需疼痛刺激才可睜開眼睛，口中僅能發出無意義的聲音，但是手卻可以準確撥開同仁的手，而測量生命徵象時發現，傷患：血壓BP = 80/43 mmHg，心率HR = 132/min，體溫BT = 36.7℃，O2 sat血氧濃度= 87%，呼吸速率（R.R）= 30/min，請問依照改良創傷指數（RTS），此傷患之正確RTS是？","options":{"A":"8","B":"9","C":"10","D":"11"},"answer":"B","manualChapter":"CH25"},{"id":826,"source":"第五章 創傷急症(2015-2018).doc","question":"高速撞擊事故中，以下均為高能量機轉，何者為非？","options":{"A":"機動車事故車速每小時64公里以上","B":"行人被車速每小時35公里以上之車輛撞到","C":"撞擊時車輛凹陷達75公分以上","D":"與傷患對邊之車側凹陷達45公分以上"},"answer":"D","manualChapter":"CH25"},{"id":828,"source":"第五章 創傷急症(2015-2018).doc","question":"關於Kehr徵象（Kehr sign）主要為描述下列何種器官受損？","options":{"A":"肝臟","B":"脾臟","C":"小腸","D":"胰臟"},"answer":"B","manualChapter":"CH29"},{"id":829,"source":"第五章 創傷急症(2015-2018).doc","question":"以下針對創傷形式與機轉”的描述，何者為非？","options":{"A":"所謂鈍挫傷係指因外力直接撞擊所造成的傷害。造成傷害的機轉包括壓迫及剪力","B":"刀刺傷屬低能量傷害，可為刀子.玻璃或剪刀等造成，僅會造成穿過部位損傷","C":"爆炸傷是一種複合性的傷害，當爆炸發生時會有四階段的受傷機轉，其中第二階段一被彈出撞擊地面或其他物體","D":"汽車碰撞事故中傷患被彈出車外，且距車體超過一公尺，是屬於高能量機轉，即傀現場生命徵象穩定，亦應視為嚴重多重創傷將其送往最近且最高層級的急救責任醫"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":830,"source":"第五章 創傷急症(2015-2018).doc","question":"出血性休克是嚴重創傷傷患最重要的致命原因之一，針對「出血」的描述何者為非？","options":{"A":"大部分外出血肇因於軟組織損傷，且多可以直接加壓方式止血，較少有致命性的出血","B":"體內可能因穿刺傷或鈍傷而出血，血液流失於血管外的體腔內，容易從外觀判定出血","C":"身體為防止持續失血，一些自我防衛機轉如局部血管收縮，血小板凝結，血栓形成，纖維結締組織生長，血管修補等便開始啟動","D":"動脈出血的失血量往往較多，較不易止血，處理不當常會導致低血容性休克；靜脈出血的失血速度相對較慢，止血比較容易"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":831,"source":"第五章 創傷急症(2015-2018).doc","question":"35歲男性機車騎士於十字路口自摔，未戴安全帽有頭部外傷，軀幹以及肢體處皆無明顯外傷，當您抵達現場後快速又專業的執行救護評估及處置，以下描述何者為是？","options":{"A":"在與傷患溝通時，患者自覺聽力受損但耳部外觀正常，要小心顱底骨折的可能","B":"眼眶周圍發覺有類似浣熊眼（Raccoon's eyes）瘀青則要懷疑有中顱底骨折","C":"頭皮一處15公分的撕裂傷正在流血，等到二評時再來包紮止血就好","D":"自行走上救護車，卻在送醫途中暫時失去意識，可能是硬腦膜下出血的清明期表現"},"answer":"A","manualChapter":"CH25"},{"id":832,"source":"第五章 創傷急症(2015-2018).doc","question":"45歲女性開車停紅綠燈時遭後方小貨車撞擊後受困於駕駛座上，有繫安全帶但安全氣啟動，傷患的雙腳夾困於儀表板跟座椅之間但無明顯外出血。您是抵達現場的高級救彟術員。在救助隊建立脫困途徑的同時，您被指派執行現場救護處置。下列描述何者為非？","options":{"A":"接近傷患前先與指揮官充分溝通，確保環境安全如車輛漏油控制，車輛已熄火等","B":"依據該創傷機轉，傷患頸部可能因為過度伸展的作用力而造成損傷","C":"體感溫暖，血壓為76/55 mmHg，心跳為每分鐘78下，出血性休克最有可能要立刻建立靜脈輸液來治療","D":"經過25分鐘後終於將傷患脫困而出，雖屬危急個案，但不需要將止血帶綁於雙腳夾傷處上方"},"answer":"C","matchedChapters":["CH25"],"manualChapter":"CH25"},{"id":833,"source":"第五章 創傷急症(2015-2018).doc","question":"72歲老農修理自家水塔時不慎由三公尺高處跌落，鄰居報案後十分鐘鄰近分隊救護車抵達現場。傷患自述左上背著地後左手因疼痛無法舉起，左胸痛而且呼吸困難，頭頸部沒有受傷，其他肢體無明顯外傷；理學檢查上發現身體濕冷，左側呼吸音不明顯。現場生命徵象如下BP：152/102 mmHg、HR：112 beat/min、SpO2：88%，當傷患送至醫院後立刻推入急救區進行急救處置。請問下列描述何者為非？","options":{"A":"當時老農很痛也很難配合檢查，可視為危急個案，給予高濃度氧氣治療，趕緊送醫","B":"在救護車上，老農的氣管偏向右側，應考慮張力性氣胸","C":"老農的老婆說他心臟不好，如果雙手橈動脈脈搏不對稱，創傷性主動脈剝離也是有可能","D":"如果老農頸靜脈怒脹而且還咳血，就能判定是左側大量血胸"},"answer":"D","manualChapter":"創傷"},{"id":834,"source":"第五章 創傷急症(2015-2018).doc","question":"關於腹部臟器創傷，下列描述何者為非？","options":{"A":"胰臟損傷很常見，最常見的機轉為外力直接撞擊上腹部壓迫胰臟撞擊脊椎所致，例如向盤或機踏車把手直接撞擊上腹部症狀包括上腹部瘀青.傷口，上腹痛並放射至背部","B":"脾臟為腹部鈍挫傷中最常見的臟器損傷，約佔40～55%。60%傷患有Kehr徵象，即疼痛會放射至左肩","C":"肝臟為腹部最大的實質器官，為腹部刀刺傷中最常受損的器官，約佔40%。部分傷患疼痛會放射至右肩。小腸為腹部槍傷中最常見的臟器損傷，約佔40%","D":"小腸損傷初期主要症狀為腹部疼痛，理學檢查沒有腹膜炎徵象並不能排除小腸損傷的可能"},"answer":"A","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":835,"source":"第五章 創傷急症(2015-2018).doc","question":"地震獲救的傷患中，有多人因為壓碎傷症候群（Crush syndrome）需住院治療，尤其是在事故後4到6小時以後才被脫困救出的傷患。該類傷患可能於斷瓦殘壁間，在肢體被重物壓迫的狀態存活數天，但卻可能在重物被移除，脫困數分鐘內死亡。下列描述何者為非？","options":{"A":"受壓迫的肢體突然被鬆開時，會造成以下現象：休克(低血壓)、急性腎功能衰竭跟緊急的代謝異常","B":"在脫困出傷患、鬆開受壓迫的肢體前，應給予大量靜脈輸液","C":"監測心律，注意有無高血鉀之變化，必要時尋求醫療指導，使用碳酸氫鈉輸注控制高血鉀、酸血症並鹼化尿液減低腎衰竭","D":"注意有無其他併發症，如腔室症候群、肢體無力及麻痺是腔室症候群最早期的症狀"},"answer":"D","manualChapter":"CH30"},{"id":836,"source":"第五章 創傷急症(2015-2018).doc","question":"電傷害是電流通過身體組織所造成的傷害，而其嚴重度端看電流本身的強度與性質、接觸電流的時間長短、電流經過的身體部位來決定。依電源的不同可分為：閃電電擊、高壓電及家用電，下列描述何者為是？","options":{"A":"閃電電擊的死亡率最高；高壓電所造成的軟組織併發症最多，且住院時間最長","B":"高壓電電傷害的致命性心律不整通常可在12小時內完全緩解，使用連續性的心電圖監測不宜超過一天","C":"電阻以骨骼最低，血管.肌肉.皮膚介於中間，神經最高。傷害的嚴重度跟單位肢體截面積與通過的電流密度相關","D":"表皮燒傷遠比深部的軟組織傷害更多更嚴重，越是高壓電所造成的傷害越是如此"},"answer":"A","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":837,"source":"第五章 創傷急症(2015-2018).doc","question":"有關重大創傷（Major Trauma）的敘述，以下何者為是？","options":{"A":"所有孕婦或小兒創傷，都應視為重大創傷","B":"傷患的昏迷指數以及生命跡象都正常，則可排除重大創傷","C":"應後送到最近的任何醫院，以讓傷患儘快獲得初步治療","D":"應後送到最近的創傷中心，以讓傷患獲得確定處置改善"},"answer":"D","manualChapter":"CH49"},{"id":840,"source":"第五章 創傷急症(2015-2018).doc","question":"所謂勒福型骨折（Le-Fort Fracture）指的是何處的骨折？","options":{"A":"頭部骨折","B":"頸部骨折","C":"掌骨骨折","D":"臉中心區域骨折"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":841,"source":"第五章 創傷急症(2015-2018).doc","question":"有關骨折或脫臼的固定，以下配對何者為非？","options":{"A":"肩關節脫臼，可用三角巾固定","B":"髖關節脫臼，可用骨盆固定帶","C":"骨盆骨折，可用KED固定","D":"股骨頸骨折，可用板夾或副木固定"},"answer":"B","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":842,"source":"第五章 創傷急症(2015-2018).doc","question":"您是被派遣去火災現場支援救護的高級救護技術員，據無線電通報，其他同仁已從火場救出兩名中年女性OHCA傷患。請問以下敘述，何者為非？","options":{"A":"要準備一氧化碳偵測器","B":"要準備比平常大半號的氣管內管（如8.0及8.5號）","C":"要準備AED及急救藥物包","D":"要準備比平常多的生理食鹽水及紗布"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":843,"source":"第五章 創傷急症(2015-2018).doc","question":"有關斷指的處理，以下現場處理順序何者為是？","options":{"A":"用生理食鹽水紗布濕敷→放入塑膠袋內→放入冰水之中→送往醫院","B":"用無菌紗布泡稀釋Epinephrine包起來→放入塑膠袋內→把冰水倒入塑膠袋內→送往醫院","C":"用無菌紗布包起來放入塑膠袋內→把常溫水倒入塑膠袋內→送往醫院","D":"不須包覆，直接放入塑膠袋內→倒入冰塊→送往醫院"},"answer":"A","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":844,"source":"第五章 創傷急症(2015-2018).doc","question":"上圖顯示轎車駕駛被砂石車從後追撞，掀開上衣後發現有安全帶的明顯勒痕。以下敘述，何者為非？","options":{"A":"依據該創傷機轉，傷患可能有頸椎損傷","B":"依據該創傷機轉，傷患可能有肩關節脫臼","C":"依據該創傷機轉，傷患可能有肝臟破裂","D":"依據該創傷機轉，傷患可能有橫膈膜疝氣"},"answer":"B","manualChapter":"CH25","matchedChapters":["NeedImage"],"image":"題庫圖片/844.png"},{"id":845,"source":"第五章 創傷急症(2015-2018).doc","question":"40歲男性，騎摩托車與卡車相撞，主訴胸痛。其心跳每分鐘85下，血壓110/80 mmHg，呼吸速率每分鐘24次；血氧：90%，意識清醒。理學檢查：氣管無偏移，呼吸音：右側音'無呼吸音減弱，腹部無明顯壓痛。以下描述何者為是？","options":{"A":"需立即靜脈給予2,000 cc生理食鹽水","B":"可能合併肋骨骨折","C":"須立即給予針刺減壓","D":"院後需常規給予胸管治療"},"answer":"B","manualChapter":"創傷"},{"id":846,"source":"第五章 創傷急症(2015-2018).doc","question":"50歲男性，騎摩托車與汽車相撞，其心跳每分鐘120次，血壓80/50 mmHg，呼吸速率每分鐘24次；血氧90%，意識E2M5V4。理學檢查：頸靜脈怒張，氣管無偏移，呼吸音正常，腹部無明顯壓痛。傷患吸氣時，脈搏明顯變得更微弱。以下描述何者為非？","options":{"A":"可靜脈給予1,000cc生理食鹽水灌注","B":"使用超音波對於診斷可能有幫忙","C":"需送到創傷中心","D":"應立即給予胸管治療"},"answer":"D","manualChapter":"CH20"},{"id":847,"source":"第五章 創傷急症(2015-2018).doc","question":"50歲男性，騎摩托車撞擊安全島，其心跳每分鐘110下，血壓120/50 mmHg，呼吸速率每分鐘18次，血氧98%，意識清醒。理學檢查發現氣管無偏移，呼吸音正常，腹部無明顯壓痛。左膝及大腿明顯腫脹變形，左大腿上有個3公分開放性傷口在噴血。以下描述何者為非？","options":{"A":"須注意遠端足背動脈有無脈搏","B":"膝脫臼常造成後脛神經受傷","C":"固定骨折處可以減少疼痛","D":"應直接使用止血帶"},"answer":"D","manualChapter":"創傷"},{"id":849,"source":"第五章 創傷急症(2015-2018).doc","question":"60歲男性.騎摩托車與汽車相撞，現場意識清楚，主訴頭痛，但在救護車上突然意識變化。意識E2M5V1，其心跳每分鐘60下，血壓180/90 mmHg，呼吸速率每分鐘10次，血氧90%，理學檢查：瞳孔不等大（左3/右5），氣管無偏移，呼吸音正常。以下描述何者為非？","options":{"A":"暢通呼吸道並給予氧氣","B":"可考盧給予過度換氣","C":"病患表現為清明期，為硬腦膜上出血的典型症狀","D":"血壓太高，需立即降血壓"},"answer":"D","manualChapter":"創傷"},{"id":850,"source":"第五章 創傷急症(2015-2018).doc","question":"40歲男性，騎摩托車與貨車撞擊，主訴腹痛，同時有聲音沙啞。病患心跳每分鐘120下，血壓70/50 mmHg，意識E4V5M6，呼吸速率每分鐘30次，血氧80%。理學檢查：頸部皮下氣腫，頸靜脈無怒張，氣管無偏移，右側呼吸音減弱，腹部明顯壓痛。以下處置，何者為優先？","options":{"A":"維持呼吸道暢通，評估是否有喘鳴（stridor）","B":"立即給予右側針刺減壓","C":"立即給予靜脈注射1,000cc生理食鹽水","D":"立即給予斷血炎（Transamine，也就是Tranexamic acid）1公克"},"answer":"A","manualChapter":"創傷"},{"id":851,"source":"第五章 創傷急症(2015-2018).doc","question":"根據美國外科醫學會訂定「現場檢傷分類指引」，下列傷患狀況何者不需後送創傷中心？","options":{"A":"3歲小孩從約一公尺高的床上跌落，造成頭部受傷","B":"45歲女性搭乘小客車發生車禍，臉部擦傷，頸部痠痛，小客車駕駛當場死亡","C":"25歲男性機車車禍受傷，目前昏迷指數（GCS）14，呼吸速率22次/分","D":"35歲男性從火場救出，臉部及頭部有多處毛髮燒焦的痕跡"},"answer":"C","manualChapter":"CH25"},{"id":852,"source":"第五章 創傷急症(2015-2018).doc","question":"50歲女性騎機車與小客車擦撞，意識嗜睡，昏迷指數E2V3M5。右大腿明顯腫脹變形。血壓80/40mmHg，脈搏130下/分鐘，血氧濃度為95%。到院前的初步評估及處置，下列何者為是？","options":{"A":"為了保持呼吸道通暢，須立即給予口咽呼吸道（oralpharyngealairway）","B":"評估發現氣管偏移至右側，可能為右側張力性氣胸，需考慮給予右側胸部針刺減壓","C":"初評顯示傷患有休克現象，休克鑑別診斷中，優先考慮出血性休克，需立即給予輸液","D":"神經學評估傷患四肢運動功能正常，不需要施行脊椎保護"},"answer":"C","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":853,"source":"第五章 創傷急症(2015-2018).doc","question":"關外傷病人呼吸道處置，下列何者為非？","options":{"A":"喉罩呼吸管（Laryngeal mask airway，LMA）的置放，可作為困難插管時的選擇，是屬於確切呼吸道（Definitive airway）","B":"需要插氣管內管的病患，如無特殊禁忌，應考慮施行快速程序插管（Rapid Sequence Intubation，RSI）","C":"顏面部嚴重受傷病人，如無法以氣管內管建立呼吸道，應考慮外科呼吸道如環甲切開術（cricothyrotomy）","D":"鼻咽呼吸道可用於半昏迷或仍有喉頭反射（gag reflex）的病人，但疑似顱底骨折的病人應避免使用"},"answer":"A","manualChapter":"CH35"},{"id":854,"source":"第五章 創傷急症(2015-2018).doc","question":"60歲女性騎機車沒有戴安全帽，被砂石車撞倒。檢查時發現昏迷指數E2V2M4，頭部及四肢多處擦傷及撕裂傷，右側頭皮血腫，右眼瞳孔放大，血氧濃度為89%。在線上醫療指導開放處置權限下，到院前的初步評估及處置，下列何者為是？","options":{"A":"為了保持呼吸道通暢，須考慮氣管內管插管治療","B":"嚴重頭部外傷可能會出現庫興三症狀（Cushing's triad），包括收縮壓上升，心跳加快和呼吸不規則","C":"評估此傷患其他生命徵象，血壓為80/40 mmHg，需考慮顱內出血造成的出血性休克","D":"傷患有呈現浣熊眼（Raccoon's eyes），需考慮中顱窩顱底骨折"},"answer":"A","manualChapter":"創傷"},{"id":855,"source":"第五章 創傷急症(2015-2018).doc","question":"下列有關脊椎外傷敘述，何者為非？","options":{"A":"若已排除脊髓損傷疑慮，可考慮移除長背板","B":"脊髓性休克是指脊髓神經受傷後導致副交感神經失去對血管的控制，造成低血壓","C":"為避免發生褥瘡，長背板之使用一般不建議超過2小時","D":"懷疑頸椎受傷病人，需做仔細的神經學評估，不能僅從影像無明顯骨折就排除"},"answer":"B","manualChapter":"CH27"},{"id":856,"source":"第五章 創傷急症(2015-2018).doc","question":"壓傷症候群的敘述，下列何者為非？","options":{"A":"病患可能併發急性腎衰竭","B":"症狀可能有患肢癱瘓和深色的尿液","C":"血液檢查，常可見代謝性酸中毒，低血鉀，高血鈣","D":"需密切監測生命徵象，檢查尿量及尿液pH值"},"answer":"C","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":857,"source":"第五章 創傷急症(2015-2018).doc","question":"有關治療懷孕的外傷病患，下列敘述何者為是？","options":{"A":"評估處置的順序與未懷孕女性不同","B":"先治療孕婦的傷勢再對胎兒做早期評估","C":"X光檢查在懷孕初期不可使用","D":"孕婦傷患在到院前若呈現休克狀態，可以給予右側躺"},"answer":"B","manualChapter":"CH49"},{"id":858,"source":"第五章 創傷急症(2015-2018).doc","question":"有關外傷病患出血性休克的處置，下列何者為是？","options":{"A":"治療出血性休克，最重要的是積極補充體液或血液，好讓血壓恢復正常","B":"為了盡快恢復血壓，出血性休克病人應該常規使用升壓藥","C":"接受輸血的病人，應常規補充鈣離子，因為血袋中添加的檸檬酸鹽會造成低血鈣","D":"如果沒有加溫器，可考慮以微波爐加溫晶質液，以避免大量輸液造成低體溫"},"answer":"D","manualChapter":"CH26"},{"id":859,"source":"第五章 創傷急症(2015-2018).doc","question":"落實「損傷預防」重點有三，稱為損傷預防3E。下列何者不屬於損傷預防3E？","options":{"A":"流病研究（Epidemiology）","B":"教育訓練（Education）","C":"法律強制（Enforcement）","D":"安全設計（Engmeering）"},"answer":"A","manualChapter":"CH25"},{"id":860,"source":"第五章 創傷急症(2015-2018).doc","question":"交通事故傷患應送外傷中心的條件，下列何者為非？","options":{"A":"機車或汽車碰，車輛凹陷20公分","B":"軀幹被車輛輾過","C":"死亡車禍的同車倖存者","D":"行人被車速每小時大於35公里以上的車輛撞到"},"answer":"A","manualChapter":"CH25"},{"id":862,"source":"第五章 創傷急症(2015-2018).doc","question":"創傷照護體系的組成，下列何者為非？","options":{"A":"損傷預防","B":"到院前照護","C":"慢性照護","D":"住院後照護"},"answer":"C","manualChapter":"CH25"},{"id":863,"source":"第五章 創傷急症(2015-2018).doc","question":"有關創傷嚴重度的評估，下列何者為非？","options":{"A":"根據國外的經驗，救護技術員是可依定量的方法來評估創傷嚴重度","B":"臨床上創傷嚴重度的評估方式可分為生理學指數，解剖學指數與混合型指數","C":"對救護技術員而言'改良式創傷指數（Revised Trauma Score，RTS）常用來評估創傷的嚴","D":"昏迷指數無法用來判斷創傷的嚴重度"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":864,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"年輕孕婦懷孕3週突然感到嚴重呼吸困難而打119求救，你到現場發現她有發紺、胸痛及休克現象，似乎快要窒息。此時急救的處置何者不正確？","options":{"A":"若量到她血壓偏低，建議以休克病患之頭低腳高方式運送","B":"可能的診斷為肺栓塞或是羊水栓塞","C":"為增加母親心輸出量，應該要左側躺或進行子宮左推手勢","D":"若母親心跳停止，應該在心跳停止後四到五分鐘內緊急剖腹產產出胎兒"},"answer":"A","manualChapter":"CH49"},{"id":865,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於子宮外孕（ectopic pregnancy），以下何者不正確？","options":{"A":"最常發生在受精後胚胎發育於輸卵管中","B":"可能會因腹腔內出血而有突發性腹痛、頭暈、昏倒或休克","C":"通常發生在懷孕第6到12週","D":"子宮外孕一定會有陰道出血"},"answer":"D","manualChapter":"CH49"},{"id":866,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於子癇前症及子癇症（eclampsia／pre-eclampsia），以下何者不正確？","options":{"A":"子癇前症亦稱妊娠毒血症，發生原因不明，通常發生於第一胎，最常發生在懷孕第二期","B":"病人在懷孕時會出現高血壓、水腫及尿蛋白三種症狀","C":"高血壓之定義為收縮壓≧140毫米汞柱或舒張壓≧90毫米汞柱","D":"子癇症則是子癇前症同時發生癲癇的情況。抽筋多為大發作，必須給予氧氣及硫酸鎂治療"},"answer":"A","manualChapter":"CH49"},{"id":867,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於產後大出血，以下何者不正確？","options":{"A":"產後大出血定義為產後出血大於500 cc","B":"產後子宮無法適當收縮（uterine atony）是出血最常見原因","C":"若為會陰部嚴重撕裂傷應避免會陰部檢查，但若合併大量出血應直接加壓止血","D":"可讓胎兒吸吮母親乳頭，使子宮分泌子宮收縮素"},"answer":"D","manualChapter":"combine"},{"id":868,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於孕婦重大外傷，以下何者不正確？","options":{"A":"除穿刺傷及嚴重腹部頓傷外，胎兒鮮少因外傷造成死亡","B":"母體可能耐受大量失血而無休克之症狀時，胎兒卻有可能因缺氧而面臨死亡","C":"孕婦懷孕過程中增加血量，所以約15％之出血量就會產生血壓低休克之症狀","D":"需將創傷之孕婦左側躺，並轉送至外傷中心或醫學中心"},"answer":"C","manualChapter":"CH49"},{"id":869,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"年輕孕懷孕40週突然感覺意識不清，119到現場發現她沒有脈搏，AED顯示為心室纖維震顫。此時急救的處置與一般ACLS略有不同，正確的作法是？","options":{"A":"Amiodarone在孕婦屬於C級用藥會導致畸，禁止使用於孕婦","B":"若有需要插管，應該選用口徑較大的氣管內管（例如7.5#或8#）","C":"依照AHA最新指導原則，應該要左側躺比子宮左推手是適合孕婦","D":"為了胎兒預後，若母親心跳停止，應該在心跳停止五分鐘內產生胎兒"},"answer":"D","manualChapter":"CH49"},{"id":870,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"年輕孕婦懷孕40週，急產產出一足月胎兒。剛出生時新生兒抽吸口鼻不會哭泣臉部也無表情，呼吸不規則，且每分鐘約20下。脈搏微弱且約每分鐘80下，刺激時手腳僅有一些無力的收縮。外觀發現四肢發紺，身體比較紅潤。請問其第一分鐘的APGAR分數是？","options":{"A":"3分","B":"4分","C":"5分","D":"6分"},"answer":"B","manualChapter":"CH49"},{"id":871,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於急產後新生兒之處置，以下何者為非？","options":{"A":"新生兒出生後必須執行擦乾－擺位－抽吸－刺激四項處置","B":"新生兒呼吸約每分鐘40～60下，若有呼吸衰竭，應盡早給予正壓給氧","C":"檢查臍動脈脈搏，若是小於每分鐘100下即需正壓給氧，小於每分鐘60下即需CPR","D":"可以搓揉新生兒背部來刺激呼吸，危急時可以倒吊新生兒並擊打臀部的方式來刺激呼吸"},"answer":"D","matchedChapters":["CH48"],"manualChapter":"CH48"},{"id":872,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關小兒與大人之呼吸道在結構上之差異何者不正確？","options":{"A":"舌頭相對於囗腔之比例較大","B":"咽喉呈漏斗狀","C":"最窄的部位在聲帶","D":"為防止昏迷平躺的小朋友呼吸道受到壓迫，可將肩部墊高預防"},"answer":"C","manualChapter":"CH48"},{"id":873,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一病人因為使用過多的海洛因造成中毒，下列敘述何者錯誤？","options":{"A":"常用解藥為naloxone","B":"具有呼吸抑制的作用","C":"可造成意識昏迷","D":"瞳孔放大"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":875,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"溺水病人之處置，何者為非？","options":{"A":"需考慮頸椎受傷之可能","B":"水中救援時，盡量將病患保持垂直姿勢","C":"病患可能因喉部痙攣導致呼吸停止，水並未吸入肺部","D":"溺水病人常合併低體溫，故不能輕易放棄CPR"},"answer":"B","manualChapter":"CH44"},{"id":876,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"兒童心室頻脈/心室顫動VTⅣF之去顫術的起始計量為","options":{"A":"10焦耳/kg","B":"5焦耳/kg","C":"2焦耳/kg","D":"1焦耳/kg"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":877,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位新生兒出生時，您已經給予乾燥、保暖、適當之姿勢、抽吸及給予刺激，但此新生兒仍發紺、心搏過慢、呼吸困難，您下一步要做的是？","options":{"A":"以抽吸管抽吸囗鼻","B":"強力刺激新生兒的背部或足底","C":"使用簡單型面罩給予氧氣","D":"使用BVM給予100％氧氣正壓通氧"},"answer":"D","manualChapter":"CH48"},{"id":878,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一3歲15 kg男童突然失去意識，沒有反應、無呼吸及脈搏。醫護人員立即給予胸部按壓及bag-mask換氣呼吸。Monitor呈現如下：下列何者為最適當之後續治療？","options":{"A":"I.V.注射amiodarone 5 mg/kg","B":"I.V.注射epinephrine 0.01 mg/kg","C":"I.V.注射lidocaine 1 mg/kg","D":"電擊去顫30J後立即繼續胸部按壓"},"answer":"D","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/878.png"},{"id":879,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一男童無反應且無自發性呼吸，你給予通暢呼吸道、100％氧氣及bag-mask換氣呼吸後，你不確定他是否有脈搏，EKG monitor呈現下面波形：下列何者為最適當之後續治療？","options":{"A":"立即開始高品質胸部按壓及換氣呼吸","B":"準備經皮心臟節律器（transcutaneous pacing）","C":"建立IV途徑後，I.V.注射atropine 0.02 mg/kg","D":"建立IV途徑後，I.V.注射epinephrine 0.01 mg/kg（0.1 ml/kg Of 1:10,000）"},"answer":"A","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/879.png"},{"id":880,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於新生兒急救，如果發現呼吸暫停或心跳低於幾下，須施行正壓呼吸（bag-mask ventilation）？","options":{"A":"0／min","B":"＜60／min","C":"＜100／min","D":"＜120／min"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":881,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位38歲女士，懷孕第一胎32週，在家裡看電視時突然有尖銳的下腹痛，EMT到達現場時已無反應，無呼吸，無脈搏，下列急救步驟何者有誤？","options":{"A":"儘早插管、氣管內管size和一般成人一樣","B":"將孕婦左側躺約15～30度","C":"胎兒＞245～25週：母親心跳停止大於4分鐘，可考慮緊急剖腹產","D":"I.V.管路宜在上半身（橫膈以上）"},"answer":"A","manualChapter":"CH49"},{"id":883,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"「根據2010年美國心臟醫學會所建議的心肺復甦術指引，以下關於兒童心肺復甦術的敘述何者為非？","options":{"A":"在建立高級呼吸道之前，單一施救者對於兒童的胸部按壓與通氣建議為30：2","B":"在建立高級呼吸道之前，兩名醫護人員對於兒童的胸部按壓與通氣建議為15：2","C":"如果已建立高級呼吸道，建議呼吸應配合胸部按壓進行，每次呼吸約1秒且可見胸部起伏","D":"如果已建立高級呼吸道，建議每6～8秒給予1次呼吸，也就是每分鐘約給予8～10次呼吸"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":885,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2010年美國心臟醫學會所建議的心肺復甦術指引，以下關於新生兒心肺復甦術的敘述，何者為非？","options":{"A":"一旦開始正壓通氣或氧氣補充供給，應評估新生兒的充氧狀態，而且以脈衝式血氧計會比單純評估膚色來得更為可靠","B":"新生兒心臟停止的病例大部分為心臟問題，因此仍維持C-A-B的復甦步驟，並配合3：1的按壓通氣比率","C":"對於足月出生的嬰兒，開始進行急救時最好使用空氣，而不要使用100％的氧氣","D":"只有發生明顯自行呼吸障礙或需要正壓通氣的嬰兒，才需要在出生後立即進行抽吸（包c括使用球形注射器抽吸）的動作"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":887,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2010年美國心臟醫學會所建議的心肺復甦術指引，以下敘述何者為非？","options":{"A":"為避免毒液活化並阻擋毒液進一步侵入體內，受到水母螫傷時，應儘快使用大量醋（4～6％的乙酸溶液）沖洗傷處至少30秒","B":"如果患者上肢被毒蛇咬傷，那麼以介於40與70毫米汞柱的力量，將壓力穩定繃帶捲繞被咬傷的整個肢段，是減緩淋巴流從而減少毒液散播的有效安全方式","C":"建議所有呼吸短促或胸部不適的患者，都應例行給予氧氣","D":"伸展、冰敷和按摩因為熱痙攣而疼痛的肌肉，可能會有所幫助"},"answer":"C","manualChapter":"CH50"},{"id":890,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"兒童的生存之鏈與成人的不同之處，在於特別強調哪一環？","options":{"A":"事故預防","B":"儘早CPR","C":"有效的高級救護（ALS）","D":"整合性復甦後照顧"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":891,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"小兒呼吸衰竭，插呼吸管時，其氣管內管的大小號碼選擇為多少？","options":{"A":"Age（Y）／4＋4","B":"［Age（Y）＋4］1／4","C":"Age（Y）／2＋4","D":"［Age（Y）＋4］／2"},"answer":"A","manualChapter":"CH48"},{"id":892,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位十一個月大，有反應的嬰兒，發燒體溫39℃、燥動不安、皮膚出現斑塊、並有四冰冷。心跳速率為168下/分、呼吸速率為62下/分、血壓為78∕56 mmHg，酸鹼度為7.25。進行評估此嬰兒之後何者為是？","options":{"A":"外觀正常","B":"呼吸正常","C":"循環正常","D":"血壓正常"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":893,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位6歲的孩童被一輛汽車撞傷之後，意識警醒、組織灌流正常，但是有呼吸窘迫的現象，他的頸椎已經被固定並已經使用100％的氧氣面罩，呼吸速率為60次/每分鐘，血壓為60 mmHg，右側胸部呼吸音減弱，氣管向左偏移，此時最合適的處置是:","options":{"A":"立即給予氣管內插管","B":"等待胸部X光的檢查報告","C":"立即給予氣管內插管並於右側胸部放置胸管","D":"先於右側胸部施行針頭減壓，再於右側胸部放置胸管"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":894,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"現在是冬季，你接獲救護指揮中心通報到達一住家內，現場一位10歲的男孩主訴胸痛且呼吸不順，根據母親訴病人之前無任何病史，約一周前開始覺得倦怠就沒再上課去，今天因為呼吸時覺得不順且起身走路時會更覺得更喘而求助。你發現病人意識清楚但是說話費力臉色蒼白且有輕微發紺現象，初步評估如下呼吸每分鐘32下，心跳速率每分鐘130下，血壓90/65毫米汞柱，血氧濃度92％，耳溫37·8℃，微血管充填時間約4～5秒，兩側呼吸音稍減低且使用輔助呼吸肌肉呼吸，心電圖顯示如下。下列描述何者最適當？","options":{"A":"根據病人心電圖顯示為PSVT（陣發性心室上心搏過速），心跳過快是造成病人症狀的主因盡速使用atropine降低病人心跳","B":"根據病人血氧濃度，使用鼻導管4 L/min使用即可","C":"病人有休克現象，立即給予大量輸液，在15分鐘，內給予500毫升的點滴注射","D":"病人休克原因最可能是心因性休克，可能是心肌炎造成"},"answer":"D","matchedChapters":["需要圖片"],"manualChapter":"CH33","image":"題庫圖片/894.png"},{"id":895,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"依據我國緊急醫療救護法第二十五條的規定，有關醫療指導醫師的工作內容，下列何者為非？","options":{"A":"對救災救護指揮中心的人員進行教育訓練","B":"到救災救護指揮中心分析報案與派遣資料","C":"到救災救護指揮中心審查救護技術員填寫的救護紀錄表","D":"到救災救護指揮中心執勤，擔任線上醫療指導"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":896,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"一位76歲男性於下午2點被人通報倒臥在農田中，高級救護技術員到達現場發現病人意識不清且口吐白沫，心電圖顯示如下圖，血壓70/40毫米汞柱，血氧濃度75％，耳溫39℃，送醫途中發生抽搐現象。下列處置何者最不適當？","options":{"A":"病人意識不清且血氧濃度過低，應考慮使用BVM給予強迫給氧或先插管給氧","B":"因病人體溫過高且有休克現象立即給予適當輸液，可在15分鐘內給予500毫升的點滴注射","C":"病人發生抽搐現象，可以根據預立醫囑使用diazepam或lorazepam控制抽搐","D":"因病人體溫過高可將病人泡在冰水或冷水中，盡速降低病人體溫"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/896.png"},{"id":897,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"是一位高級救護技術員，你接獲勤務中心指派前往一汽車旅館執行救護，你到現場發現一位年輕男性囗鼻部有不知名白色粉末，意識不清、雙側瞳孔放大、囗吐白沫、不斷抽搐，心電圖顯示如下圖，血壓200/120毫米汞柱，血氧濃度75％，體溫40℃，全身濕透。下列處置何者最不適當？","options":{"A":"應先給予輔助呼吸道及高濃度氧氣，必要時給予插管給氧","B":"病患若持續抽搐，必要時可以給予diazepam或lorazepam","C":"可以給予適當輸液，避免高燒出汗後脫水","D":"病人心電圖心律呈現PSVT，盡早給予adenosine使用"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/897.png"},{"id":898,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關活性碳（activated charcoal）的敘述，何者為非？","options":{"A":"可以在腸胃道中吸附毒藥的分子，使用適當的話可以吸附多達50％的食入毒藥","B":"假如食入的毒藥有囗服的解毒藥時，不要給予活性碳","C":"在出勤時常見的酒醉路倒病人，也可以給予活性碳幫助解酒","D":"毒藥食入已經發生超過一個小時的話，給予活性碳的幫助不大"},"answer":"C","manualChapter":"CH50"},{"id":899,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關毒蛇咬傷的敘述，何者為是？","options":{"A":"毒蛇咬傷的傷口可以冰敷來消腫止痛","B":"鎖鏈蛇的毒液成分為混合性毒，所以施打毒蛇血清時可以將抗出血性以及抗神經性毒蛇血清共用來治療","C":"切開毒蛇咬傷的傷口進行抽吸對病人有絕對的好處，所以要在現場緊急處置","D":"百步蛇咬傷的病人，抽血可以發現血小板低下以及凝血時間延長"},"answer":"D","manualChapter":"CH50"},{"id":901,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關身體體溫調節的敘述，何者為非？","options":{"A":"皮膚血管的擴張以及出汗可以增加體熱的散失","B":"環境相對溼度越高，身體蒸發散熱的效果越好","C":"溺水病人容易產生失溫的現象和身體的傳導散熱有關","D":"環境風速越快，身體對流散熱的效果越好"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":903,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於兒科病患的休克，下列敘述何者？","options":{"A":"兒科病患因為代償功能較差，休克早期血壓就會顯著下降","B":"微血管沖填延遲雖是一種休克的生理指標，但是對於診斷休克沒有幫助","C":"雖不同年齡的血壓值有所不同，但收縮壓的下限值估算可以用70＋（年齡X 2）估是否為低血壓","D":"對於低血容性休克病患給予輸液急救是指快速給予0.33％G/S，劑量為20 ml/kg，最多給兩次"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":904,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於熱急症，下列敘述何者為是？","options":{"A":"中暑時中心體溫可能升高至41℃或以上","B":"目標在希望能快速降低體溫，越快越好。將病患移至陰涼處，給予冰水浴或是低輸液可以幫助病患快速降溫","C":"老人及小孩對於溫度反應較為敏感，且調節功能比較好，較不易發生中暑等熱急","D":"若病患出現高體溫（＞41℃）合併意識不清，需先排除感染急症後再給予降溫以免延治療"},"answer":"A","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":905,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於溺水及溺斃，下列敘述何者為是？","options":{"A":"溺斃的病人幾乎都是因為大量液體吸入肺中造成缺氧導致死亡","B":"溺水事件的受難者有高風險會發生浸泡性低體溫，在現場及轉送途中應考慮體外回溫以及給予加溫潮溼的氧氣","C":"應盡早給予病患呼吸施救，若懷疑有異物阻塞呼吸道，可以施行橫膈下推擠的哈姆立克急救法施救","D":"溺水時根據吸入不同的液體，及溫度，水的濁度等而有不同的預後"},"answer":"B","manualChapter":"CH44"},{"id":906,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於高山疾病，下列敘述何者為是？","options":{"A":"緩慢上升高度，保持身體活動及補充大量水份有助於預防高山疾病","B":"若出現頭痛，頭暈，食慾不佳，虛弱及嘔吐等症狀多是體力不好或不常爬山不適應，做好充分休息就可以","C":"使用藥物即可以完全預防高山症的發生","D":"高山腦水腫應盡速處理，到院前緊急醫療照護著重於支持呼吸道，呼吸，循環並盡快降低高度"},"answer":"D","manualChapter":"CH44"},{"id":907,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於行為急症，下列敘述何者為是？","options":{"A":"救護技術員在警察告知後就可以強制將病患約束及送醫","B":"盡量避免使用開放性問題而被病患引導進而讓場面失控","C":"盡量穩定病患情緒及情勢，儘速轉介至精神科接受評估","D":"病患家屬較清楚病患情形，可以幫忙協助介入以穩定病患情緒"},"answer":"C","manualChapter":"CH46"},{"id":908,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於老人急症，下列敘述何者為是？","options":{"A":"老人突發意識混亂原因多是因腦部退化及年老失智所致","B":"老人因為常穿著過多衣物，因此容易造成體溫過高，量測不準的情形","C":"老人多有心肺功能不佳或本身就有慢性疾病，情緒及心理及自殺問題反而較年輕人少","D":"創傷為老人第五大死因，大部分創傷死亡原因為車禍，跌倒也是老人失能和死亡的原因"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":909,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於懷孕婦女的創傷處理，下列敘述何者為是？","options":{"A":"胎兒極為脆弱，懷孕婦女的創傷極易造成胎兒死亡","B":"胎兒的死亡大多因母親死亡或嚴重休克所造成","C":"因父母護子心切，所以孕婦創傷之救護首重於是否傷及胎兒及胎兒評佸","D":"因胎盤供給胎兒血液及營養，即使少量出血也容易造成孕婦休克，因此必須儘快打上點點滴給予輸液治療"},"answer":"B","manualChapter":"CH49"},{"id":911,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列何種情況需考慮老人虐待及忽視之情況？","options":{"A":"多處瘀傷","B":"反覆性無治療的壓瘡","C":"無法解釋的陰道或肛門出血","D":"以上皆是"},"answer":"D","manualChapter":"CH47"},{"id":912,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於安非他命類中樞神經興奮劑中毒時的可能症狀，下列敘述何者為是？","options":{"A":"嗜睡","B":"低體溫","C":"腦出血","D":"低血壓休克"},"answer":"C","manualChapter":"CH50"},{"id":913,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於懷孕的敘述，下列敘述何者為是？","options":{"A":"懷孕一般以3個月為一期，分為三個3月期。在第二個3月期之後，胎兒快速成長並逐漸進入產程準備，胎兒在此時期產出多可存活","B":"懷孕第四個月時子宮將會增大至肚臍附近","C":"懷孕末期平躺時子宮將會壓迫下腔靜脈造成血壓降低，故急救時需讓孕婦維持右側躺","D":"前置胎盤常引起陣痛性陰道出血，有可能危及生命。若孕婦出現低血容休克時即容易發生胎兒窘迫的情形"},"answer":"A","manualChapter":"CH49"},{"id":914,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於事故指揮系統（Incident Command System），以下敘述何者最不適當？","options":{"A":"事故指揮系統是由功能的需求，而非個人原有的頭銜，來組織整個架構","B":"應該要等上級指示之後再啟動事故指揮系統，越晚成立越能夠有完整的架構與功能，也才能發揮越大的作用","C":"事故指揮系統具有明確的架構，但並非每個事故都必須要啟動所有的功能群","D":"不論事故的本質如何，事故指揮系統的架構都是類似的，差異主要是核心人士的特殊專業考量"},"answer":"B","manualChapter":"CH52"},{"id":915,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"處理危害物質事故時，必須注意工作人員的安全。因此對於參與處理危害物質事件之工作人員，必須要有醫療評估及監測機制。以下觀念何者為非？","options":{"A":"就輻射事故而言、過往曾參與類似事故的工作人員通常經驗較為豐富，應該優先派到汙染區工作","B":"在進入現場工作中，應監測其工作時間及生命徵象；如果其中一位工作人員不適，則全組人員應全部撤離，換上另一組人員","C":"在進入現場前，應評估工作人員的意識狀態、體溫、心跳、血壓、過往病史、目前服用藥物，以了解對熱傷害的忍受力","D":"體重變化可以做為工作人員是否脫水的重要依據"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":916,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於輻災事故的應變觀念，以下何者敘述最不正確？","options":{"A":"輻射會影響傷囗癒合，所以輻射汙染病患的傷囗應該儘可能延遲24小時後再進行縫合","B":"相較於化學物質事故，輻射事故通常不會造成受污染傷者立即性的危害，因此病患除污的急迫性較低","C":"在輻災事故，如果病患的衣物可能沾有輻射物質粉末，應該在移除病患衣物時，先將衣物潤濕，以防止輻射物質擴散至空氣中","D":"輻射污染可以用輻射偵檢器檢測出，通常可以精確地定出污染範圍"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":918,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於空中救護的觀念，以下敘述何者為非？","options":{"A":"依照政府公告的「空中救護適應症」，創傷指數小於12，或年齡小於5歲，創傷指數小於9得以申請空中救護","B":"依照政府公告的「空中救護適應症」，昏迷指數小於10的傷病患得以申請空中救護","C":"依照政府公告的「空中救護適應症」，二度、三度燒面積達10％或特殊部位（如顏面、會陰）燒傷的傷病患得以申請空中救護","D":"符合空中救護適應症的傷病患，都應該啟動空中救護，預後會比較好"},"answer":"D","manualChapter":"CH58"},{"id":919,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"就緊急醫療系統的品質指標，「結構、過程、結果」三大構面是廣泛使用的醫療品量模式。關於品質指標的觀念，以下敘述何者為是？","options":{"A":"「結構面」的指標，是指在照護提供者與傷病患之間發生的過程","B":"「過程面」的指標，是指傷病患在接受醫療救護後，其健康狀態所發生的改變，通常可以分成臨床預後及經濟預後兩大類指標","C":"「每一千次出勤之交通事故比例」是屬於過程面的指標","D":"「結果面」的指標，是指緊急醫療救護系統所擁有的人力、設備、資源等"},"answer":"C","manualChapter":"CH09"},{"id":921,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於事故指揮系統（incident command system，ICS）的描述，以下觀念何者為非？","options":{"A":"事故指揮官（incident commander）必須確認指揮權順利轉移，並決定解除動員的時機和流程","B":"安全官（safety officer）必須評估事故的安全環境與危害物質的狀況，依狀況擬定防護措施","C":"執行部門（operation section）通常是事故現場最先成立的部門，如果後續來協助的人員和器材相當多，應該自行選定不同地點開始工作，以免混亂","D":"後勤部門（logistic section）負責提供工作人員醫療照護、餐飲，處理設備和補給品；這個部門所提供服務的直接對象是工作人員，而不是災民"},"answer":"C","manualChapter":"CH52"},{"id":922,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於多重傷病患事故（multiple casualty incident）和大量傷病患事故（mass casualty incident）的觀念，以下何者為非？","options":{"A":"「多照重傷病患事故」是指傷病患人數多於一人，但尚未超過該地區或系統所能負荷的能量","B":"依照「多照重傷病患事故」的觀念，現場傷勢最嚴重的病患，即使已無呼吸心跳，也應該優先搶救","C":"依照「大量傷病患事故」檢傷分類的觀念，最應該優先處理的，是傷勢危急但是還可能得救的傷病患，而不是那些即使耗用很多資源也無法拯救生命的瀕死傷病患","D":"依照國際慣例，所有的「大量傷病患檢傷法」都把傷病患區分為黑、紅、黃、綠這四種顏色，優先搶救紅色病患"},"answer":"D","manualChapter":"CH52"},{"id":923,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"對於事故應變的原則，以下何者為非？","options":{"A":"依照管理範疇（span of command）的觀念，可以有效管理的人數或單位通常是有限的，所以每個單位底下的子單位最好可以控制在3～7個之間","B":"如果有更適任或階層更高的人員已經抵達現場加入應變，那麼，在專業技術或法律規範的考量下，可以考量轉移指揮權","C":"平常一起工作的人員，或是同一個機構的人員，應該都要儘可能打散重新編組，使得記錄及通訊連絡更有效率","D":"報案電話應該保留給緊急事故通報之用，所以應該宣導民眾，盡量不要撥打119或110來詢問傷病患的動向"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":924,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"在事故應變中，有幾個應變地點相當重要，必須及早建立。以下關於事故指揮所（incident command post，ICP）的觀念，何者最不正確？","options":{"A":"事故指揮所最好可以位於事故現場附近，但又必須確保在危險區域之外","B":"隨著事故進展，事故指揮所可能必須變動位置","C":"尚未指派任務的工作人員或物資，必須先在事故指揮所裡集結，等後派遣","D":"無論事故的型態或規模，每個事故都必須建立某種形式的事故指揮所"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":925,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"在事故應變時，「危機溝通」相當重要。與民眾或是新聞媒體溝通時，以下作法何者為非？","options":{"A":"發言時不應該偏袒特定的媒體，但如果有媒體特別想要了解某些專業的問題，可以轉介給適合的專家","B":"對大眾發言時應儘量使用專業術語，以提升應變工作人員的專業形象","C":"發言時，盡可能不要接受或引用未經證實的消息","D":"發言官必須監控新聞媒體或群眾之間是否出現謠言。如果謠言可能造成群眾嚴重的負面效應，甚至影響到事故應變進行，發言官應及時向事故指揮官報告，並在授權之下儘速澄清"},"answer":"B","manualChapter":"CH53"},{"id":927,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"在大量傷病患事故的屍體處理，以下觀念何者為非？","options":{"A":"明顯死亡的屍體，只有在獲得許可之後，才能夠移動位置，因為這牽涉到死因鑑識和其它的法律問題","B":"如果橫陳的屍體阻礙了逃生或援救的通道，這種緊急狀況下可以搬動屍體來開通通道","C":"在危害物質事故中，考量除污的問題，遺體通常先留置在原先地點，等到事故控制至一定階段後再移動","D":"為了表示對死者的尊重，應該儘可能使用救護車把屍體載送到殯儀館或其他暫時安厝的場所"},"answer":"D","manualChapter":"CH52"},{"id":929,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"於災難的描述，以下觀念何者最不適當？","options":{"A":"自然災難時，通常民眾善良的本性會激發出來，自助互助的狀況非常常見","B":"目前的科技有很多方法可以協助鑑識大量屍體，應該儘可能鑑識屍體身分","C":"在自然災難中，最貧窮的區域通常死傷最嚴重","D":"災難後的大量屍體會造成瘟疫，處理大量屍體最有效的方法就是集體埋入土坑"},"answer":"D","matchedChapters":["CH10"],"manualChapter":"CH10"},{"id":931,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列台灣常見的毒蛇咬傷後，哪一種可能會引起呼吸衰竭？","options":{"A":"赤尾青竹絲","B":"龜殼花","C":"百步蛇","D":"眼鏡蛇"},"answer":"D","manualChapter":"CH50"},{"id":932,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關acetaminophen中毒之敘述何者為非？","options":{"A":"反覆嘔吐為中毒初期常見的症狀","B":"導致中毒的劑量多在150mg/kg以上","C":"中毒後，除引起肝傷害外，也可以導致腎衰竭、胰臟炎、昏迷或代謝性酸中毒等症狀","D":"中毒後引起肝傷害，一般於中毒24小時產生，且多為不可逆性的"},"answer":"D","manualChapter":"CH50"},{"id":933,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列敘述哪一個是為非？","options":{"A":"被有毒海洋生物咬螫的毒素通常為對熱穩定的蛋白質","B":"大多數蜘蛛的毒素對人體是無害的","C":"蜈蚣咬傷一般僅有局部的組織反應，不至於危害生命","D":"腔腸動物螫傷常於皮膚上呈現特殊紅棕色長條狀的風疹塊"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":934,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於野外醫學，以下敘述何者為是？","options":{"A":"高山症的初期症狀和感冒或是宿醉很類似，所以常被忽略。如果懷疑是高山症，應該避免繼續登高、考慮下山，並且給予acetazolamide和dexamethasone","B":"潛水者所併發的氣泡栓塞症，通常在浮到水面的幾分鐘內就會出現。如果沒有嚴重症狀，表示沒有產生潛水夫症，當天便可以搭民航機長途旅行","C":"低伏特數的交流電所造成的心律不整常常是無心律（asystole）；而高伏特數的交流電或是直流電所造成的致命心律不整常常是心室纖維顫動（ventricular fibrillation）","D":"海水溺水的病患比淡水溺水的病患存活率差"},"answer":"A","manualChapter":"CH45"},{"id":935,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"「北美應變指南」主要是協助初期應變人員，可迅速確認事件所波及物質的危害，並保護自身與民眾的安全。根據2008年中文版的北美應變指南，危險物質的指引可以根據以下哪種方式查到？甲：聯合國數字編號（UN number）乙：物質的英文名稱丙：物質的中文名稱丁：物質的輻射量","options":{"A":"只有甲正確，其他錯誤","B":"只有甲、乙正確，其他錯誤","C":"只有甲、乙、丙正確，其他錯誤","D":"甲、乙、丙、丁都可以"},"answer":"C","manualChapter":"CH53"},{"id":936,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2008年中文版的北美應變指南，以下對於「初期隔離距離」和「防護行動區域」的敘述，何者為誤？","options":{"A":"如果危害物質的蒸氣雲穿越數棟高層建築物或流經峽谷，因為蒸氣雲與大氣較不容易混合，所以防護距離可能比應變指南所表列的建議距離更長","B":"一般而言，小洩漏是指等於或小於兩百公升的液體洩漏，或是等於或小於三百公斤的固體洩漏至水中","C":"防護行動距離有可能因為天候、事故嚴重度、地形等等因素而必須調整","D":"一般而言，在夜晚時，空氣比較平穩，使得化學品擴散較慢，因此毒性影響區域範圍會小於發生在白天的狀況"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":937,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2008年中文版的北美應變指南，對於危害物質事故的應變原則，以下何者為非？","options":{"A":"應該從上風處小心地接近事故現場；如果方向許可，應該從地勢高處接近事故現場","B":"必須小心處理空的容器，因為在容器未完全清除或排淨所有危害物質之前，空容器仍然存在著危險性","C":"可以試著由標示牌、容器標示、運送聯單、物質安全資料表、現場專業人員等等，來辨識危害物質種類","D":"大多數為危害物質都有特殊異味；穿著防護衣處理"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":938,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據2008年中文版的北美應變指南，以下對於「初期隔離距離」和「防護行動區」的敘述，何者錯誤？","options":{"A":"一般而言，大洩漏的初期隔離距離比起小洩漏來得長","B":"一般而言，具有強烈逆溫又加上穩定的風向，這時候應該增加防護行動距離","C":"一般而言，發生在白天的事故，防護行動區域比起夜晚來得廣","D":"一般而言，事故下風處的防護行動區域比起上風處來得廣"},"answer":"C","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":939,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關活性碳（activated charcoal）的敘述，何者為非？","options":{"A":"可以在腸胃道中吸附毒藥的分子，使用適當的話可以吸附多達50％的食入毒藥","B":"假如食入的毒藥有囗服的解毒劑時，給活性碳會同時吸附解毒劑而降低療效","C":"在出勤時常見的酒醉路倒病人，也可以給予活性碳幫助解酒","D":"病人在給予活性碳之前，必須先確保病人的呼吸道可以維持暢通"},"answer":"C","manualChapter":"CH50"},{"id":940,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關洗胃（gastric lavage）的注意事項以及禁忌症，何者為非？","options":{"A":"病人如果意識不清，在洗胃之前應該要先確保呼吸道可以維持暢通","B":"幼兒病人洗胃時的沖洗液不需指定生理食鹽水，用一般蒸餾水也可以","C":"清醒的病人不會有嘔吐的問題，所以洗胃時左側躺是沒有意義的","D":"在洗胃之前就先給予活性碳是可以被接受的"},"answer":"C","m
