d":2087,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"你是大量傷患現場的後送小組成員，你手上還有三個重傷與十多個輕傷傷患，最近的醫院是地區醫院等級，已經被自行前往的病人癱瘓。合理距離內還有一家區域醫院與醫學中心是急救責任醫院，請問以下的處置何者最為正確？","options":{"A":"可以將剩下三位重傷病人『輪送』這三家醫院，避免通通都送往醫學中心。","B":"十多個輕傷傷患可以採用『群送』到醫學中心，避免他們脫離現場自動前往最近地區醫院加深壅塞。","C":"地區醫院要求消防局協助將某些處理過的重傷傷患轉至醫學中心，由於我國法律禁止消防單位做『院際轉診』，所以應予以婉拒並提供民間救護車聯絡方式。","D":"重傷傷患可採取『繞道』跳過最近的地區醫院，在跟地區醫院溝通後，某些重傷患者可以送至該院，而不用送到醫學中心。"},"answer":"D","matchedChapters":["CH52"],"manualChapter":"CH52"},{"id":2088,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"核生化事件中，有關應變人員的防護衣，下列敘述何者錯誤？","options":{"A":"在冷區執行醫療工作時，穿著C級防護衣即可。","B":"化災防護衣，對於穿透式的輻射線沒有防護作用。","C":"進入毒化災現場，當毒物不明時，應穿戴A級防護衣。","D":"C級防謢衣是包括全面式面罩加上供氧呼吸裝備及全身防潑濺的防護衣。"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2089,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於輻射災害事件的現場救護，以下何者為是？","options":{"A":"救護人員照護輻射汙染的傷患，即使有適當防護，也會有嚴重危害。","B":"輻射事故極有可能造成立即性的傷害。","C":"照護輻射汙染傷患，應該以除汙為優先考量、醫療其次。","D":"有生命危險的傷患應盡速後送至最近可處理之醫院，不限於核災急救責任醫院。"},"answer":"D","manualChapter":"CH53"},{"id":2090,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"空中救護體系分為直昇機及固定翼航空器兩種，兩者差異以下何者為非？","options":{"A":"直昇機機動性高，起降較不受限制。","B":"直昇機為垂直起降，較不受天候影響。","C":"固定翼航空器單架次運送人數較多。","D":"固定翼航空器醫療條件好，途中可執行醫護作業。"},"answer":"B","manualChapter":"CH58"},{"id":2091,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"高級救護技術員在閱讀研究文獻時，可以使用Bradford Hill criteria，來審查究竟為因果關係與否，還是僅只有相關性。有關於Bradford Hill criteria，不包括下列哪一項？","options":{"A":"一致性（consistency）。","B":"類比（analogy）。","C":"敏感性（sensitivity）。","D":"特異性（specificity）。"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2092,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"緊急醫療系統研究的實施有幾種標準的方法。在研究開始前，特定的問題、假設、和資料收集的方式早就被定義好，請問這種研究方法稱為下列哪一項？","options":{"A":"實驗型（experimental）方法。","B":"回溯性（retrospective）方法。","C":"前瞻性（prospective）方法。","D":"橫斷面（cross-sectional）方法。"},"answer":"C","manualChapter":"CH11"},{"id":2093,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"美國學者Avedis Donabedian提出的評估架構，是當今廣泛被使用的醫療品質測量模式。其品質測量的評估架構包括三大構面，不包括下列哪一項？","options":{"A":"有效（effectiveness）。","B":"結構（structure）。","C":"過程（process）。","D":"結果（outcome）。"},"answer":"A","manualChapter":"CH09","matchedChapters":["CH09"]},{"id":2094,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"反饋對話的結構有非常多種模式，美國心臟協會和WISER（the Winter Institute for Simulation, Education and Research）所共同創建的GAS模式為一種反饋對話模式。其GAS分別代表哪些步驟，不包括下列哪一項？","options":{"A":"獲取資訊（Gather）。","B":"評估原因（Assess）。","C":"分析原因（Analyze）。","D":"結論重點（Summary）。"},"answer":"B","manualChapter":"CH60"},{"id":2095,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於救護紀錄表的填寫原則，以下何者最不正確？","options":{"A":"適時完成。","B":"詳細填寫。","C":"主觀呈現。","D":"保護隱私。"},"answer":"C","manualChapter":"CH03","matchedChapters":["CH03"]},{"id":2096,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"發現有路倒民眾趕緊撥打119報案，下列何者為最正確？","options":{"A":"根據優先派遣(priority dispatch)的觀念，優先派遣高級救護隊(ALS team)前往緊急傷病現場。","B":"救護技術員在現場治療的原則是「儘速送醫」Go and Play，爭取黃金時間。","C":"事件發生在離島，勤務中心派遣空中救護運輸作為緊急傷病初級運送。","D":"標準作業流程屬前瞻性的醫療指導，缺點是與救護過程不直接相關。"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2097,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關救護技術員管理辦法於114年所施行之新法，請問下列敘述何者最不正確？","options":{"A":"「常見急症的評估、處置與情境操作」為救護技術員常見之情況，故新增於中級救護技術員的繼續教育課程中。","B":"高級救護技術員證書需每年24小時以上，三年累計達96小時才得以展延。","C":"抽吸呼吸道分泌物、血糖監測和十二導程心電圖使用為初級救護技術員可施行的新增救護項目。","D":"中級救護技術員可協助病患使用NTG舌下含片和自備腎上腺素注射筆。"},"answer":"B","manualChapter":"CH03"},{"id":2098,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"EMT阿志過去無精神科病史，在參與大地震救災後三個月，開始對平時喜歡的釣魚失去興趣、經常鬱鬱寡歡、一點小事就感到憤怒、會不斷地出現事件的痛苦回憶與情緒，即使換單位這個情況仍持續了一年多，下列敘述何者為最適當？","options":{"A":"阿志經歷創傷事件後的這些情況首先考慮急性壓力症(Acute Stress Disorder，ASD)。","B":"被診斷為急性壓力症的病人，兩年內有較少機率會形成創傷後壓力症。","C":"精神科醫師治療阿志的這種情況最常使用的治療藥物為抗憂鬱劑。","D":"最可能的原因是日常業務的壓力超過阿志所能承受，因此出現適應障礙的問題。"},"answer":"C","manualChapter":"CH06","matchedChapters":["CH06"]},{"id":2099,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於救護人員出勤傷病患救護的保護措施，以下何者最不正確？","options":{"A":"面對可以接觸傳播的疾病(如疥瘡)，要配戴手套。","B":"面對空氣傳播疾病(如麻疹)，要配戴一般外科口罩。","C":"若可能有體液或血液噴濺，應戴上護目鏡。","D":"面對飛沫傳播疾病(如流行性感冒)，要配戴一般外科口罩。"},"answer":"B","manualChapter":"CH42"},{"id":2100,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"在社區層級的緊急醫療反應中，當旁觀者進行心肺復甦術( CPR )，下列哪項敘述最符合「第一反應員」制度的實務作用？","options":{"A":"第一反應員應具備高級救護技術員的訓練資歷。","B":"第一反應員的主要目的是於救護人員到達前控制現場局勢。","C":"第一反應員不具備替代救護人員的能力，但能提供基本急救協助。","D":"第一反應員的唯一責任是指導旁觀者正確進行CPR。"},"answer":"C","manualChapter":"CH08","matchedChapters":["CH08"]},{"id":2101,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於緊急救護派遣員的敘述，下列敘述何者最正確？","options":{"A":"大部分的報案者在報案時無法冷靜回答問題，派遣員常需要從報案者情緒化的反應中抽絲剝繭，獲取關鍵訊息。","B":"約有70%是來自第二方(指傷病患身旁的人)報案者，相較於自第一方(指傷病患本人)，派遣員仍可以從從他們身上取得關鍵的資訊。","C":"派遣員可以在報案電話裡迅速辨識出心跳停止的跡象，藉由詢問兩個關鍵問題“意識是否清醒？”以及“脈搏是否摸到？”來辨識報案電話中的OHCA。","D":"派遣員除了執行救護派遣及提供線上指導之外，如任務有需要，也可以幫忙聯繫救護員所需要的支援，例如警察、搜救隊、或電力公司等。"},"answer":"D","manualChapter":"CH02"},{"id":2102,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於常見的急救藥物使用時機及描述，下列何者最正確？","options":{"A":"Amiodarone可使用於寬QRS波頻脈的病人，給藥途徑為快速靜脈注射。","B":"腺甘酸(Adenosine)可用於窄波頻脈之區分診斷，給藥途徑為靜脈滴注。","C":"氯化鈣(Calcium chloride)可以用於毛地黃中毒所引起之高血鉀，給藥途徑為靜脈注射。","D":"Midazolam可用於因癲癇發作痙攣時抑制痙攣的病人，給藥途徑為肌肉注射。"},"answer":"D","manualChapter":"CH16"},{"id":2103,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於成人骨內注射(intraosseous injection)的注意事項，最不正確的描述是？ (多選)","options":{"A":"脛骨近端、遠端、肱骨近端及股骨遠端均是可以選擇的注射點。","B":"腎上腺素、阿托品及碳酸氫鈉均可以從骨內注射途徑給藥。","C":"選擇骨折的部位作為注射點是絕對禁忌症，穿刺部位紅腫也應避免。","D":"給藥前，先給1~2ml生理食鹽水確定骨內留置針是通暢的或沖洗留置針。"},"answer":"A,D","manualChapter":"CH17"},{"id":2104,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"請問下列各種臨床情況中，哪種最不可能導致潮氣末二氧化碳分壓值( EtCO 2 )下降？","options":{"A":"體溫下降。","B":"休克。","C":"中風。","D":"肺栓塞。"},"answer":"C","manualChapter":"CH14","matchedChapters":["CH15"]},{"id":2106,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"當病人右側枕葉發生梗塞，可能會產生何種視野缺損？","options":{"A":"雙眼鼻側(內側)視野缺損。","B":"雙眼顳側(外側)視野缺損。","C":"左眼顳側(外側)及右眼鼻側(內側)視野缺損。","D":"左眼鼻側(內側)及右眼顳側(外側)視野缺損。"},"answer":"C","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":2107,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列哪一種心律不整，是由於心臟存在額外的傳導路徑，導致電流「再迴旋異常」(Re - entrant)？","options":{"A":"多發性心房心搏過速(Multifocal Atrial Tachycardia)。","B":"陣發性上心室頻脈(Paroxysmal Supraventricular Tachycardia, PSVT)。","C":"心房顫動(Atrial Fibrillation)。","D":"心室顫動(Ventricular Fibrillation)。"},"answer":"D","manualChapter":"CH16"},{"id":2108,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"從兒童發展里程碑的角度推測，下列受傷機轉何者最不合理？","options":{"A":"八個月大男童自己走路跌倒。","B":"七個月大女童坐在高背椅上不慎前趴撞到頭。","C":"九個月大男童乳牙撞斷。","D":"學步期幼兒活動力強且注意力集中時間短，故容易發生跌倒和嗆到。"},"answer":"A","matchedChapters":["CH13"],"manualChapter":"CH13"},{"id":2109,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"45歲男性，近日診斷為A型流感，今日因呼吸喘報案，您到達現場後使用結構式溝通模式(SOAP)收集資訊，下列哪一項為O的描述？","options":{"A":"病人表示看電視時覺得愈來愈喘，有吸不到氣的感覺。","B":"病人血氧濃度85%，呼吸急促，每分鐘約30下。","C":"過去病史有糖尿病及高血壓。","D":"病人可能是A型流感併發重症。"},"answer":"B","manualChapter":"CH18"},{"id":2110,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列關於現病史之口訣與其內容，何者最正確？","options":{"A":"P(Pain)：症狀的發生部位，有無轉移痛。","B":"Q(Quality)：症狀的特性。","C":"R(Relief)：減緩或加劇症狀的因子。","D":"S(Situation)：症狀發生的時間與當時狀況。"},"answer":"B","manualChapter":"CH19","matchedChapters":["CH19"]},{"id":2111,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"50歲女性病人表示頭痛不適，關於病史詢問的敘述，何者為最不正確？","options":{"A":"詢問病人說出除了頭痛，還有其他不舒服嗎？病人回復：還有噁心及嘔吐的症狀，是使用促進(facilitation)的技巧。","B":"承上選項，您回答病人「嗯，所以還有噁心嘔吐」，是屬於運用同理心(empathic responses)的技巧。","C":"可以使用疼痛評估量表詢問病人疼痛1-10分，您覺得你的疼痛是幾分？這是屬於運用澄清(clarification)技巧。","D":"請病人描述頭痛的感覺是運用開放性問句，詢問病人頭痛是像有針在戳或是悶悶脹脹的是引導型問句。"},"answer":"B","manualChapter":"CH19"},{"id":2112,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列關於使用昏迷指數(Glasgow Coma Scale，GCS)評估傷患意識狀態之敘述，何者為最不正確？","options":{"A":"傷患經由疼痛刺激後張開雙眼，Eye Opening指數應為2。","B":"對傷患進行疼痛刺激時，不應該採用胸骨上按壓之方式。","C":"脊椎受損且四肢癱瘓之傷患無法配合舉起右手之指令，Motor response為1。","D":"詢問傷患有何不適時，傷患僅能回答「痛...」，Verbal response為3。"},"answer":"C","manualChapter":"CH22"},{"id":2113,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"78歲男性因主訴腹痛求救。您到達現場後進行身體檢查，視診時發現患者肚臍周圍出現瘀青(Cullen's sign)，也發現患者腹部出現大範圍反射性腹部肌肉持續僵直收縮(即是所謂的muscle guarding)。以下評估結果何者最適當？","options":{"A":"肚臍周圍出現瘀青須考慮腹部中空器官破裂，如胃穿孔、十二指腸穿孔。","B":"muscle guarding代表腹膜受到化學性刺激(如胃酸)或出現炎症反應(腹膜炎)而產生。","C":"腹部叩診對此病人有害，應避免操作。","D":"若病人身體檢查同時出現移動性濁音(shifting dullness)應考慮是腹水感染引發腹膜炎所導致。"},"answer":"B","manualChapter":"CH20"},{"id":2114,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列關於病患評估與決策，何者為最不正確？","options":{"A":"傷病患具多重主訴的情況時，較適合使用收斂式的資料判讀。","B":"對於滿身酒氣之意識改變的傷病患直接判定為飲酒過多的酒鬼，此為<標籤效應>偏見。","C":"即使面臨有控管之現場，仍應具備沒有所謂安全環境的預期心態。","D":"當傷病患之病情出現改變或對治療反應不佳時，應重新評估並修改治療計畫。"},"answer":"A","manualChapter":"CH22","matchedChapters":["CH22"]},{"id":2115,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"一位30歲男性在打籃球時，突然目擊暈倒，您到現場後給予高品質的CPR、epinephrine、amiodarone、2次電擊，並進行插管，病人瞳孔3mm/3mm對光無反應，車上後送時ROSC，後續處置描述何者最不正確？","options":{"A":"經急救復甦成功的患者進行治療性微低溫療法(即目標體溫管理)。","B":"治療性微低溫療法(目標體溫管理)可以保護缺血後的大腦。","C":"可能的原因包含急性心肌炎、急性心肌梗塞、各種心肌病變。","D":"葉克膜"},"answer":"D","manualChapter":"非創傷"},{"id":2116,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"年輕男性機車騎士自摔，現場評估該傷患呼吸24次/分鐘、脈搏120次/分鐘、血壓100/50mmHg、血氧95%、GCS：E3V5M6、右上臂及右大腿骨折，關於該傷患創傷嚴重度評估，下列敘述何者最適當？","options":{"A":"依救護現場對緊急傷病人所使用的二級檢傷分類，該傷患為非危急個案。","B":"到院前依改良式創傷指數(RTS)評估該傷患分數為7.84，數值愈低預後愈好。","C":"到院前可用簡易創傷分數(AIS)評估該傷患，AIS分數愈高代表損傷愈輕。","D":"到院後可用創傷嚴重度分數(ISS)回顧該傷患的傷情嚴重度，若ISS ≧ 16即屬嚴重創傷。"},"answer":"D","manualChapter":"CH25"},{"id":2117,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"創傷嚴重度的評估方式可分為生理學指數、解剖學指數及混合型指數，生理學指數包含昏迷指數(GCS)、創傷指數(TS)、與改良式創傷指數(RTS)，試問下列哪一項非RTS評估項目？","options":{"A":"收縮壓。","B":"昏迷指數。","C":"脈搏速率。","D":"呼吸速率。"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2118,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"對於嚴重創傷到院前處置的原則下列何者最適當？","options":{"A":"視情況請求支援，勿從事可能延誤送醫的救護。","B":"嚴重創傷傷患現場處置時間盡量以15分鐘為限。","C":"嚴重創傷傷患通常生命徵象不穩，應往最近的醫院送。","D":"嚴重創傷傷患休克應在現場為傷患執行靜脈輸液。"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2119,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"一名50歲男性工人不慎從15公尺高處墜落，經急救人員抵達現場後發現其意識模糊，呼吸8次/分鐘，脈搏140次/分鐘，血壓80/50 mmHg，皮膚蒼白濕冷，腹部腫脹且觸診疼痛明顯，右腿異常扭曲且出現開放性骨折。現場無明顯的大出血。以下敘述何者最適當？","options":{"A":"現場立即進行開放性骨折的固定與包紮，並持續監測生命體徵，後送至最近的醫院以進行手術。","B":"迅速施行ABC處置，現場打上IV給予液體復甦並加強鎮痛劑的使用，以減少患者痛苦，後送至創傷中心。","C":"立即進行腹部壓迫以減少可能的內出血，並同時進行大量液體復甦以穩定血壓，後送至創傷中心。","D":"保護頸椎、維持呼吸道暢通，並視情況於後送途中進行輸液，務求盡快後送至創傷中心，同時通知創傷小組啟動。"},"answer":"D","manualChapter":"CH25"},{"id":2120,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"40歲男性傷患意外墜落，下半身著地，到現場時發現右側大腿明顯變形腫脹，右側腰部有瘀青，其心跳140次/分鐘，血壓92/50 mmHg，呼吸24次/分鐘，CRT 3秒，血氧89%，傷患GCS 13分，四肢濕冷。以下敘述何者最適當？","options":{"A":"此傷患收縮壓>90mmHg，此傷患非休克狀態。","B":"此傷患依照受傷機轉需先考慮神經性休克。","C":"單純的肢體骨折通常不會造成出血性休克。","D":"出血性休克的傷患，脈搏壓會比血壓先降低。"},"answer":"D","manualChapter":"創傷"},{"id":2121,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於出血性休克傷患輸血注意事項，下最何者最正確？","options":{"A":"為避免低體溫，輸血前需將血品放入溫水槽或微波爐中加熱至39°C。","B":"對於有懷孕能力的婦女，為避免造成將來懷孕時之併發症，建議可使用Rh陽性血輸血。","C":"傳明酸(Tranexamic acid)主要功能為促進血小板凝集，加速血栓形成以達到止血效果。","D":"大量輸血時，以濃縮紅血球：血漿：血小板=1：1：1的比例給予，進行平衡式的復甦(Balanced resuscitation)。"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2122,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於休克下列敘述何者最適當？","options":{"A":"阻塞性休克因為進入心臟的血流受阻，所以一定會看見頸靜脈怒張。","B":"代償性休克因為周邊血管收縮，皮膚變得濕冷蒼白。","C":"神經性休克雖然也會微血管充填時間延長，卻無反射性心跳增快，皮膚也非冰冷。","D":"當傷患休克時，生命徵象最先反應的是脈搏上升，這時出血程度為第一級休克。"},"answer":"B","manualChapter":"CH26"},{"id":2123,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關中央脊髓症候群(central cord syndrome)的敘述，下列何者最不適當？","options":{"A":"通常是由於脊椎過度的伸展或彎曲所造成的。","B":"主要的影響是阻礙了運動神經左邊到右邊，以及右邊到左邊的傳導。","C":"在頸椎受傷時，則有四肢輕癱現象，且下肢較上肢嚴重。","D":"有薦髓機能保留(sacral sparing)。"},"answer":"C","manualChapter":"CH27"},{"id":2124,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於脊椎創傷傷患發生低血壓時，下列敘述何者最適當？","options":{"A":"應優先考慮患者發生神經性休克，並加以處置。","B":"神經性休克傷患會有皮膚溼冷及心搏過速的情形。","C":"當給予輸液1-2公升仍無法改善低血壓時，可給予升壓劑改善休克。","D":"只有頸椎的受傷才可能造成神經性休克。"},"answer":"C","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2125,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於眼睛損傷的描述，下列何者最不適當？","options":{"A":"複視的原因可能為支配眼球運動的肌肉受傷所致。","B":"眼球挫傷後的瞳孔反應不正常，最常見的原因是瞳孔括約肌撕裂傷。","C":"眼睛被化學物品灼傷時，可在醫療指導醫師指示下，將隱形眼鏡拔除。","D":"檢查視力時，要將一眼遮住，由沒受傷的眼睛先檢查，分別測試兩眼視力。"},"answer":"D","manualChapter":"CH27"},{"id":2126,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於顏面創傷的敘述，請問以下何者描述最適當？","options":{"A":"脫落的牙齒經過適當的保存可以有較高的再植入率，保存法包括將牙齒含在嘴巴裡或泡在牛奶裡。","B":"評估傷患眼球運動時是否有複視、視力模糊或視野局限的問題，主要是在評估第二、三、六對腦神經的功能。","C":"上頜骨骨折是除了鼻骨之外最常見的顏面骨骨折。","D":"耳朵撕裂傷的傷患，如果有組織脫落應該要直接包在濕紗裡一起帶到醫院。"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2127,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"60歲男性傷患喝酒後騎腳踏車摔落，臉部有多處擦挫傷、左側浣熊眼(Raccoon’s eye)，頭皮有撕裂傷經加壓後可止血，口鼻有些許鮮血、呼吸淺快。經過評估，該名患者意識清楚、可配合指令，但無法回想起剛剛發生了什麼事且一直問重複的問題。以下關於此傷患的評估內容與相對處置，何者最不適當？","options":{"A":"應強烈懷疑患者有顱底骨折，並且應密切留意其意識狀態、瞳孔大小、對光反射等顱內出血徵象。","B":"傷患現意識清楚，但仍應擔憂其正處於硬腦膜上出血的「清明期(Lucid interval」，無法排除顱內出血、顱骨骨折的可能性。","C":"患者於評估過程突然大量嘔吐、意識不清僅對痛有反應，此時除了要擔心可能是顱內出血惡化，亦有可能是喝醉酒引起的反應。","D":"為了確保患者的呼吸道，應考慮以口咽、鼻咽呼吸道或聲門上呼吸道治療。"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2128,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關針刺減壓的敘述下列何者最適當？","options":{"A":"適應症必須符合：頸靜脈怒張且氣管偏移，且患側呼吸聲音變小或聽不到，且收縮壓＜90mmHg。","B":"成人因前胸較厚，故較佳的針刺減壓的位置應在患側第五肋間腋中線前側。","C":"針刺減壓是張力性氣胸確切治療方式。","D":"為統一作法，針對兒童，針刺減壓位置也是患側第五肋間腋中線前側。"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2129,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於胸部創傷的描述，下列何者最適當？","options":{"A":"氣管支氣管破裂，以喉頭周圍2.5公分內的氣管破裂最常見。","B":"連枷胸常造成呼氣時胸壁凹陷，吸氣時胸壁凸出的奇異式呼吸運動。","C":"創傷性主動脈剝離，最常好發處為動脈韌帶(Ligmentum arteriosum)的位置。","D":"創傷性窒息常因下腔靜脈遭受壓迫，而造成臉部及頸部呈現青紫色及結膜出血。"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2130,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"70歲女性，本身因有心律不整長期服用心得安(inderal，乙型阻斷劑)，因機車碰撞事故請求救護。抵達現場時發現傷患神情痛苦、身體捲曲、大喊腹痛。初步評估傷患意識清醒，呼吸24次/分鐘，血氧95%，脈搏95次/分鐘，血壓100/65mmHg。身體檢查發現上腹部有疑似把手撞擊的瘀痕，腹部檢查發現上腹部有明顯壓痛。基於上述臨床徵象，以下敘述何者最適當？","options":{"A":"送醫過程中可使用e-FAST檢查有無腹水，若檢查無腹水則可排除出血可能性。","B":"依據傷患的生命徵象顯示，目前可以排除低血容休克。","C":"肚臍周圍身體檢查若有瘀青時，名為Turner sign。","D":"救護過程需再次檢查生命跡象，若需要輸液治療，維持收縮壓90mmHg即可。"},"answer":"D","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":2131,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"28歲女性，機車車禍。仰躺在離事發地點約5公尺遠的地上，現場無明顯大量血跡，不斷發出呻吟聲，橈動脈摸不到，但頸動脈摸得到，脈搏約130下/分鐘，理學檢查時發現右上腹有瘀傷，觸診會皺眉，發現傷患的會陰部有出血的情況，關於現場處置，請問以下何者最適當？","options":{"A":"就算會陰部有瘀青，但若骨盆觸診沒有壓痛，可以不用上骨盆固定帶。","B":"右上腹痛合併休克，因解剖位置的考量需懷疑是脾臟損傷造成出血。","C":"如果懷疑有腹內出血，可以考慮在現場掃FAST確認。","D":"像這樣的腹腔內出血，可通知院後考慮使用血管內氣球阻斷術(Resuscitative Endovascular Balloon Occlusion of the Aorta, REBOA)止血。"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2132,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於骨骼肌肉的創傷，下列敘述何者最適當？","options":{"A":"長骨骨折可造成出血，如脛骨及腓骨骨折出血量可達500ml以上。","B":"當傷患因嚴重創傷造成意識不清，可適時的給予止痛劑。","C":"壓碎傷症候群(Crush syndrome)的傷患，容易發生在事故後1到2小時。","D":"處理截肢可直接放在冰塊上，放置在密閉塑膠袋送至醫療機構。"},"answer":"A","manualChapter":"CH30"},{"id":2133,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於骨骼肌肉損傷之評估與處置，下列敘述何者最不適當？","options":{"A":"外傷所造成的開放性骨折容易因外露的骨頭與外界環境接觸而造成感染，嚴重時甚至造成骨髓炎。","B":"老年人常於跌倒後造成鎖骨骨折，其中有80%鎖骨骨折是發生在鎖骨中三分之一處，無需特別考慮手術治療。","C":"肘關節損傷容易造成併發症，需評估有無合併神經及血管損傷，尤其是橈動脈及橈神經損傷。","D":"由高處墜落且腳先著地之患者都要考慮有無跟骨骨折的可能，其中約有10%患者會合併脊椎骨折。"},"answer":"C","manualChapter":"CH30"},{"id":2134,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"於地震救災現場有一名傷患雙下肢被壓在瓦礫堆中已四小時，請問關於此傷患狀況及處置下列何者最不適當？","options":{"A":"於脫困前應給予大量輸液，每小時可給予1,000毫升生理食鹽水。","B":"脫困時因血液進入壓傷部位可能導致低血壓。","C":"受傷組織於再灌流後可能導致高血鉀、高血磷、高血鈣。","D":"可考慮鹼化尿液以矯正酸血症及高血鉀。"},"answer":"C","manualChapter":"CH56","matchedChapters":["CH56"]},{"id":2135,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"一位30歲約60公斤的男性自火災現場救出，評估時傷患意識模糊，眉毛有燒焦，口鼻部有明顯碳粒，身上多處燒燙傷，體表面積(BSA)分別為1度10%，2度16%，3度14%，其生命徵象心跳：110下/分鐘，呼吸：30下/分鐘，血壓：100/80mmHg，SpO 2：83%，請問下列處置何者最不適當？","options":{"A":"傷患救出時除燒燙傷外仍應考慮頭頸部傷害，若無法排除應戴上頸圈。","B":"為預防吸入性灼傷造成喉頭水腫，應盡早建立進階呼吸道處置。","C":"根據修正後布魯克公式(modified Brooke formula)，傷患在灼傷後的前8小時要給予1,500-2,000 ml的乳酸林格氏液。","D":"移除傷患身上的衣物及飾品，並在燒燙傷傷口以冰敷降溫。"},"answer":"D","manualChapter":"CH31"},{"id":2136,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"出勤一件颱風過後，台電人員搶修電線觸電救助案件(該案件處所電壓為1 , 000伏特以上)，下列處置何者最適當？","options":{"A":"高電壓情境下與患者保持距離，可利用樹枝將電線撥開救援患者。","B":"電流造成的內部損傷在觸電時便決定傷害深淺，通常不會持續惡化。","C":"應建立兩條大口徑的靜脈輸液管路，輸液選擇以含葡萄糖的生理食鹽水為主。","D":"電弧在高壓電下產生，應警戒環境中的金屬物及高壓電線，保持距離患者3~9公尺。"},"answer":"D","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":2137,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"一名50歲男性爬山時不慎跌落山谷，EMT接觸評估時發現時地上有一大攤血跡，傷患意識躁動，臉上有擦傷，左胸及左腹部皆有瘀傷，骨盆不穩固，左大腿開放性骨折且有持續出血情形，生命徵象心跳：136下/分鐘，呼吸：30下/分鐘，血壓：74/53mmHg，SpO 2：88%，CRT 3秒，關於接下來首要處置，以下何者最優先？","options":{"A":"應立即給予高濃度氧氣維持血氧飽和率95%以上。","B":"傷患有休克現象，應立即準備大量輸液及通知醫院備血。","C":"應立即包紮止血，若考慮使用止血帶須注意勿打在受傷骨折處。","D":"應立即將股骨固定，減少其出血量以及有利後續搬運。"},"answer":"C","manualChapter":"CH25"},{"id":2138,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於止血治療的敘述，下列何者最不適當？","options":{"A":"傷口非常靠近鼠蹊部或腋下等連接部位，首選方式為傷口填塞。","B":"C.A.T.戰術止血帶放在接近肢體出血處的近心端，距離傷口約5~8公分。","C":"C.A.T.戰術止血帶打上後，應確認止血且遠端脈搏摸不到。","D":"止血帶無法使用在胸部及腹部傷口，傷口填塞的方式也一樣。"},"answer":"A","manualChapter":"CH26"},{"id":2139,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"56歲男性，過去每天抽一包菸，菸齡約30年。過去病史有慢性阻塞性肺病(COPD, chronic obstructive pulmonary disease)。最近在照顧感冒的家人後，已經呼吸喘兩天，關於此病患的敘述，何者最適當？","options":{"A":"COPD惡化主要臨床表現為胸痛及胸悶。","B":"長時間維持血氧100%，可能導致高碳酸血症(hypercapnia)。","C":"可以做12導程心電圖來排除STEMI以及肺栓塞(pulmonary embolism)。","D":"到院前可以考慮給予乙型阻斷劑(beta- blocker)來減緩支氣管痙攣。"},"answer":"B","manualChapter":"呼吸急症"},{"id":2140,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"25歲女性有氣喘病史，在門診定期拿藥，今日表示呼吸喘，救護車到場病人表示呼吸道症狀(咳嗽、痰多)數日，今有發燒情形，血氧88%，雙側明顯喘鳴音。有關氣喘急性發作處置，下列何者敘述最不適當？","options":{"A":"可協助給予短效型支氣管擴張劑吸入使用，如albuterol。","B":"可考慮給予類固醇、硫酸鎂等藥物。","C":"若病人意識不清，但還有呼吸，則給予非侵入性正壓呼吸(NIPPV)使用。","D":"嚴重氣喘若心跳停止，需考慮缺氧、張力性氣胸。"},"answer":"C","manualChapter":"CH35"},{"id":2141,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"48歲男性突發性構音不清，臉部表情不對稱，右側肢體麻木。關於此患者可能為中風的敘述，下列何者最不適當？","options":{"A":"臉部表情的表現為貝爾氏麻痺(Bell's palsy)。","B":"巴賓斯基反射(Babinski sign)可能呈陽性。","C":"若洋娃娃眼徵象(doll's eye sign)呈陽性，代表腦幹功能正常。","D":"若符合條件，血栓溶解劑t-PA可以在症狀發生3~4.5小時內施打。"},"answer":"A","manualChapter":"CH36"},{"id":2142,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於急性腦中風的到院前處置，何者最不適當？","options":{"A":"選擇區域內合適的急性中風處理醫院，必要時繞過(bypass)中風照護資源不足的醫院。","B":"後送時讓病人維持平躺的姿勢，若病人意識不清懷疑有IICP的徵兆時，可將病人頭部抬高但不要超過30度。","C":"必要時建立靜脈路徑，若有低血壓的情形必須積極處理。","D":"輸液選擇首選為5%葡萄糖溶液，提供腦細胞直接養分來源，以避免二度傷害。"},"answer":"D","manualChapter":"CH36"},{"id":2143,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於下面心電圖的判讀與後續處置，下列何者最適當？","options":{"A":"應立即協助給以舌下硝化甘油錠(NTG)來緩解胸痛症狀。","B":"V4R的ST節段上升表示有右心室心肌梗塞。","C":"心律不整是做完心導管後常見的情形，後送期間，無須使用生理監視器，以避免不必要的焦慮。","D":"懷孕患者為使用tPA的絕對禁忌症。"},"answer":"B","manualChapter":"CH33","image":"題庫圖片/2143.png"},{"id":2144,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"患有心臟病及高血壓的60歲阿伯感到胸痛及冒汗而打119求救，現場做一張EGK如下，心肌梗塞最可能的位置是？","options":{"A":"側壁心肌梗塞。","B":"前壁心肌梗塞。","C":"下壁心肌梗塞。","D":"中隔區心肌梗塞。"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/2144.png"},{"id":2145,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關於腎上腺異常疾病之敘述，下列何者最適當？","options":{"A":"庫欣氏症候群通常由腎上腺皮質功能異常所引起，常見症狀包括月亮臉、肌肉萎縮、低血壓和體重減輕。","B":"愛迪森疾病的特徵包括皮膚色素沉著、體重減輕和高血鉀，並可能在心理、生理壓力下急性發作引發腎上腺危象。","C":"腎上腺髓質主要分泌皮質醇和醛固酮，腎上腺皮質產生必須的其他激素，以維持體液平衡和電解質穩定。","D":"腎上腺危象發作的急性處置包括給予適時補充水分並矯正低血糖、高劑量止痛藥緩解不適及使用降壓藥以控制高血壓。"},"answer":"B","manualChapter":"CH37"},{"id":2146,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"一位病人疲倦感、呼吸淺快、噁心嘔吐、血壓低有休克情形，皮膚色素沉著，綜合判斷，最有可能是罹患下列何種疾病？","options":{"A":"庫欣氏症候群(Cushing's syndrome)。","B":"葛瑞夫茲病(Graves' disease)。","C":"愛迪森疾病(Addison disease)。","D":"何杰金氏病(Hodgkin's disease )。"},"answer":"C","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":2147,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於腸阻塞與急性闌尾炎的病因、臨床表現及，下列何者最適當？(選擇「急性闌尾炎的臨床表徵為噁心、食慾變差與右下腹痛，典型疼痛位置(McBurney point)是指肚臍與右側前上腸骨脊連線外三分之二的點。」也給分)","options":{"A":"機械性腸阻塞多見於大腸，以粘黏為主要原因，麻痺性腸阻塞則通常由腸道受到外力擠壓所致，兩者均易導致糞便嵌塞。","B":"急性闌尾炎的臨床表徵為噁心、食慾變差與右下腹痛，典型疼痛位置(McBurney point)是指肚臍與右側前上腸骨脊連線外三分之二的點。","C":"急性闌尾炎的轉移痛常由肚臍周圍轉至右下腹，而機械性腸阻塞的原因多為粘黏或疝氣，嚴重者可能發生腸壞死或穿孔。","D":"麻痺性腸阻塞多由腫瘤或異物嵌塞所致，而急性闌尾炎的疼痛發展較緩慢，初期僅表現為輕微的肚臍周圍不適，易被誤認為一般腸胃不適。"},"answer":"C","manualChapter":"CH38"},{"id":2148,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"以下關於胰臟與胰臟炎相關的描述，何者最不適當？","options":{"A":"胰臟同時有外分泌與內分泌的功能。","B":"膽結石在膽囊管(cystic duct)造成阻塞，是常見急性胰臟炎的原因。","C":"慢性胰臟炎，常見於酒癮的病人。","D":"長期反覆的慢性胰臟炎，容易引起糖尿病。"},"answer":"B","manualChapter":"CH38","matchedChapters":["CH38"]},{"id":2149,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列關於血液組成及相關疾病之敘述何者最不適當？","options":{"A":"當肝臟製造不足或由腎臟、腸道流失太多白蛋白時，就容易造成水腫，患有肝病的病人的腹水便是如此造成的。","B":"當血友病的病人受傷時，出血速度與正常人無明顯差異，但血液不容易凝固是因為缺乏凝血因子。","C":"腫瘤溶解症候群之病人，可能有高尿酸血症、高血鉀症、高磷酸血症、低血鈣症等症狀。","D":"惡性淋巴瘤包括了非何杰金氏(non- Hodgkin lymphoma )淋巴瘤與何杰金氏症( Hodgkin lymphoma)兩種類型。東方人以何杰金氏症居多。"},"answer":"D","manualChapter":"CH39"},{"id":2150,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"以下關於貧血的描述，何者最不適當？","options":{"A":"缺鐵性的貧血，很容易出現黃疸的症狀。","B":"貧血嚴重者可能會有嗜睡、食慾不振、心臟擴大，甚至心衰竭等症狀產生。","C":"臨床上輕微的貧血並不會干擾到脈衝式血氧計的判讀。","D":"貧血可以血球的大小，大致分為三類(大球性、正球性、小球性貧血)。"},"answer":"A","manualChapter":"CH39","matchedChapters":["CH39"]},{"id":2151,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"貧血的分類，可依血球之大小分類，下列何者會造成正球性貧血？","options":{"A":"葉酸缺乏。","B":"缺鐵性貧血。","C":"維他命B12缺乏。","D":"急性腸胃出血。"},"answer":"D","manualChapter":"CH39"},{"id":2152,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"25歲男性，在務農時遭到蜜蜂螫傷求救，你到達時發現病人意識清楚，呼吸淺快、膚色蒼白、冒冷汗，血壓為70/40mmHg，針對病患的評估及處置，何者最適當？","options":{"A":"病人因為蜂毒的毒性反應而導致呼吸窘迫。","B":"肥大細胞和嗜鹼性細胞去顆粒化釋出白三烯素是導致低血壓的主因。","C":"可以給予病人Epinephrine 0.5 mg皮下注射。","D":"若對腎上腺素反應不佳，可給予1-2公升生理食鹽水輸液。"},"answer":"D","manualChapter":"CH40","matchedChapters":["CH40"]},{"id":2153,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"25歲女性在露營區突發性呼吸喘，病患意識清楚，橈動脈對稱但微弱、脈搏105次/分鐘、SpO 2：85%、體溫35.5 °C、末梢皮膚濕冷。朋友表示病人無特別過去病史及過敏史，剛在玩大地遊戲時病人突然呼吸喘、身上有多處紅疹，下列敘述何者最適當？","options":{"A":"詢問病人無藥物過敏史，則可排除過敏性休克，須盡速找尋其他休克原因。","B":"過敏反應可能會影響心臟血管系統，導致心臟的後負荷減少，進而造成心輸出量減少。","C":"嚴重過敏反應對呼吸系統而言，可能產生上呼吸道阻塞及下呼吸道支氣管痙攣、造成呼吸窘迫。","D":"致命性過敏易引起上呼吸道阻塞，考慮早期插管時，需使用鎮靜劑及肌肉鬆弛劑輔助插管。"},"answer":"C","manualChapter":"CH40"},{"id":2154,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關於急性副睪炎及睪丸扭轉的疼痛特徵描述，下列敘述何者最適當？","options":{"A":"急性副睪炎疼痛為緩慢出現且逐漸加劇，並伴隨陰囊紅腫與壓痛感。","B":"睪丸扭轉疼痛可延伸至腹股溝部位，身體視察時會有單側陰囊紅腫。","C":"急性副睪炎疼痛通常為突發性劇痛，常會合併有噁心、嘔吐的情形。","D":"睪丸扭轉通常會出現陰囊紅腫，可經由上抬患側睪丸緩解痛感。"},"answer":"A","manualChapter":"CH41","matchedChapters":["CH41"]},{"id":2155,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於慢性腎衰竭病人的敘述，何者最不適當？","options":{"A":"病人若需要透析治療，可分為血液透析及腹膜透析。","B":"透析用雙腔導管常置於右側鎖骨下動脈。","C":"剛開始血液透析的病人容易出現不平衡症候群。","D":"不平衡症候群是因為水分及滲透壓快速改變，造成腦水腫及顱內壓升高。"},"answer":"B","manualChapter":"CH41"},{"id":2156,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列何者最不是影響溺水事件病人的臨床預後因素？","options":{"A":"水溫。","B":"淡水或海水。","C":"水的乾淨度。","D":"受難者年齡。"},"answer":"B","manualChapter":"CH44"},{"id":2157,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關於野外救護的敘述，何者最不適當？","options":{"A":"從事野外救護，最重要的就是環境安全評估與分析。","B":"脫臼或是變形的骨折可能會在數小時後才造成傷肢的缺血，若是天氣寒冷的環境下，有保護的效果，可能延長這個時間。","C":"抗休克褲(PASG)目前並不建議使用在野外做為所有休克的治療，但是可以利用它來固定骨折的骨盆、大腿骨折，達到控制出血的效果。","D":"在野外由於運送的時間比較長，即使病人需要手術，還是可以給予病人食物與飲水。"},"answer":"B","manualChapter":"CH45"},{"id":2158,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有一位男性30歲傷患疑似左小腿骨折無法行走在深山待救，病患意識清醒，生命徵象穩定，但仍需約2天搬運才能下山，下列敘述何者最不適當？","options":{"A":"傷患的排泄問題應當被注重，不理會任由其排泄在褲內會有壓瘡的風險。","B":"因傷患骨折可能有開刀手術的需求，因此應從接觸開始就讓傷患禁食以維持空腹。","C":"用長背板搬運傷患時要注意有壓瘡的可能，考慮讓傷患在擔架上時可以翻身。","D":"若患者後續意識不清，需額外注意防曬問題，以免因傷患無法表達而忽略有曬傷的風險。"},"answer":"B","manualChapter":"CH45"},{"id":2159,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關精神疾病敘述與處置，何者最適當？","options":{"A":"思覺失調症通常會有視幻覺。","B":"思覺失調症通常由於多巴胺(dopamine)在腦中傳導增強，藥物可用多巴胺受器的拮抗劑(dopamine receptor antagonist)治療。","C":"依據統計，女性比男性更容易自殺成功。","D":"精神病人情緒不穩定時，必須維持病人情緒平靜，盡量多與病人身體接觸安撫病人。"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2160,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"判定酒癮病人，其中以「CAGE」提及四個問題最為簡單，其中若有兩個陽性，則有約七成的機會為酒精成癮病人。關於「CAGE」的敘述，下列何者最不適當？","options":{"A":"C代表Cut down：必須詢問病人對於戒酒是否有困難。","B":"A代表Annoyance：必須詢問病人是否因喝酒而造成家人或朋友的厭惡。","C":"G代表Guilty：必須詢問病人是否覺得因長期喝酒而有罪惡感。","D":"E代表Eye closer：必須詢問病人是否晚上睡覺前要找酒喝才閉眼。"},"answer":"D","manualChapter":"CH46"},{"id":2161,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"陳先生有頭暈、左上腹有不適感，生命徵象穩定。病人擔心自己有可能是心肌梗塞的可能，要求要送兩小時外的醫學中心。病人表示自從股票大賠後，這種情形已經有半年了，每次都會感覺心臟跳很慢就像要停止一樣恐怖。試問病人最有可能是哪一種精神急症？","options":{"A":"焦慮症(anxirty diordor)。","B":"思覺失調症(schizophrenia)。","C":"憂鬱症(depression)。","D":"躁鬱症(bipolar disorder)。"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2162,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關老年人心臟衰竭常見症狀和徵候的敘述，何者最不適當？","options":{"A":"疲勞。","B":"夜尿。","C":"頭暈。","D":"食慾不振、肝腫大、腹水。"},"answer":"C","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":2163,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關於哮吼病(Croup)的敘述，何者最不適當？","options":{"A":"常見的感染源為病毒：Parainfluenza virus(副流行感冒病毒)，經常會微燒，但通常不需要使用抗生素。","B":"臨床上常有哮鳴(stridor)聲，普遍會發生(90%)。","C":"頸部(Neck Soft tissue)X光側面照可見似歐洲教堂的尖塔(Steeple sign)。","D":"使用類固醇可較快改善，減少氣管內管插管及縮短住院天數。"},"answer":"C","manualChapter":"CH35"},{"id":2164,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於新生兒急救的四大措施：A.給予腎上腺素(epinephrine)或輸液、B.胸部按壓、C.保暖、擺位、清呼吸道、擦乾、刺激及重新擺位、D.正壓通氣與修正通氣步驟。依急救措施的相對頻率由多至少，也是急救先後次序，以下何者最適當？","options":{"A":"CBAD","B":"CDAB","C":"CDBA","D":"CABD"},"answer":"C","manualChapter":"CH48"},{"id":2165,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關婦產科病人的敘述，下列何者最不適當？","options":{"A":"子癇前症(pre-eclampsia)亦稱為妊娠毒血症，通常發生於第一胎。","B":"子癇症(eclampsia)一般發生在懷孕第二期。","C":"胎盤早期剝離、前置胎盤則發生於懷孕第三期。","D":"黃體破裂(Corpus luteum cyst)常發生於經期來潮後一週，特別容易在劇烈性行為時發生破裂的現象，會造成內出血。"},"answer":"D","manualChapter":"CH49","matchedChapters":["CH49"]},{"id":2166,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列關於孕婦懷孕過程中母體之變化，下列何者最不適當？","options":{"A":"孕婦若發生創傷事件，和正常成人相比更易有休克症狀。","B":"潮氣容積及每分鐘換氣量於懷孕後期增加30%。","C":"孕婦之總血量在34週時將可增加30%。","D":"破水但尚未臨盆之孕婦，如有破水之情形，為避免胎兒感染，需要住院施打抗生素。"},"answer":"A","manualChapter":"CH49"},{"id":2167,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關於中毒病人的處理敘述，下列何者最不適當？","options":{"A":"當病人口服解毒劑(N-acetylcysteine，福喜，acetaminophen普拿疼的解毒劑)，不應該給予活性碳。","B":"洗胃是腸胃道除污的一種方式，通常在食入的時間在一小時內執行。","C":"假酒中毒會造成身體一系列的徵候，包括眼盲瞳孔放大以及代謝性酸血症最主要是因為甲醛的毒性。","D":"乙二醇可用於散熱器防凍劑以及冷卻劑，如發生食入中毒，可使用真酒(乙醇)來治療。"},"answer":"C","manualChapter":"CH50"},{"id":2168,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"臨床發現瞳孔縮小、口水多、痰多、呼吸或嘔吐物中有濃烈大蒜味、全身汗濕等臨床症狀，最可能為何種中毒症候群？","options":{"A":"膽鹼性症候群。","B":"抗膽鹼性症候群。","C":"鴉片類止痛劑。","D":"仿交感神經作用症候群。"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":2169,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關於大量傷病患事故指揮系統(Incident Command System，ICS)，以下敘述何者最不適當？","options":{"A":"事故指揮官通常由最早抵達的人員中，位階最高或經驗最豐富的人來擔任，執行部門通常是事故現場最先成立的部門。","B":"如果事故規模不大，指揮官可以視狀況兼任其他工作人員的任務，例如安全官、聯絡官等。","C":"在系統內的每個人都只有一個直屬長官，只接受這位長官派遣的任務，也回報訊息給這位長官。","D":"事故指揮官發派的任務，安全官評估認為有危險，須先與指揮官溝通討論後，才可以制止危險的救援行動。"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2170,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關於大量傷患後送原則，下列敘述何者最不適當？","options":{"A":"當有一群傷患產生，且傷情都差不多，可以採取「群送」的概念，送往較遠的醫院。","B":"當醫院已經超過負荷，可以採取「滿載」的概念，避免送往該家醫院。","C":"當出現特殊傷病患時，可以採取「繞道」的概念，將患者送往醫學中心救治。","D":"當附近醫院能量都差不多時，可以採取「輪送」的概念，避免醫院短時間接收太多傷患。"},"answer":"B","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":2171,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於毒化災事件現場應變，下列敘述何者最不適當？","options":{"A":"冷區是相對安全的區域，在這個區域可穿戴基本防護裝備。","B":"在熱區中不做任何醫療處置，以快速將傷患脫困為重點。","C":"在除汙區進行除汙時，救護人員需穿戴至少C級(或更高等級)防護衣。","D":"初期隔離區域的距離取決於物質本身、風向、日夜、洩漏量及是否起火。"},"answer":"B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2172,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"毒化物災害發生時正確的防護裝備等級的敘述，下列何者最適當？ (多選)","options":{"A":"電動車起火現場待火勢撲滅後，消防人員穿著特搜工作服加上SCBA(自給式的呼吸設備)，具有B級防護裝備以上之等級，即可前往現場處理。","B":"C級防護裝備能阻止液體性毒物潑濺，所以可做為暖區除汙的工作人員的防護裝備等級。","C":"冷凍工廠氨氣外洩時，需要著A級防護裝備，提供最高等級的皮膚黏膜及呼吸保護。","D":"石英工廠的氫氟酸發生洩漏，負責後送已經除汙之病人的工作人員需穿著B級防護裝備。"},"answer":"C,B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2173,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於馬拉松比賽，醫療站的設計規劃，下列敘述何者最不適當？","options":{"A":"醫療小組一般要求具備基本救命術(BLS)能力即可。","B":"醫療小組應在5分鐘內到達活動的任一個位置。","C":"醫療救護的時間規劃應至少從活動前半小時到活動後半小時。","D":"醫療小組應事先與鄰近責任醫院建立溝通。"},"answer":"A","manualChapter":"CH55"},{"id":2174,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"大型路跑活動現場緊急醫療站的設置考驗主辦單位的應變能力，下列敘述何者正確？","options":{"A":"當有意外造成傷患出現時，應立即通報消防機關，請求119救護人員提供專業後送協助。","B":"救護站的設置應考量能否在五分鐘內提供救護服務為主。","C":"大型活動現場總指揮應由醫師擔任，以維護現場醫療品質。","D":"當發生災難，法定救護團隊到場時，應配合大型活動總指揮進行災難應變機制。"},"answer":"B","manualChapter":"CH54"},{"id":2175,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"關於運動賽事的緊急醫療救護以下敘述何者最不適當？","options":{"A":"現場醫療團隊需要專注於選手的醫療服務工作，所以若是現場工作人員、觀眾等有醫療需求，需打119求助。","B":"即使選手有醫療需求，多數項目還是需要有裁判許可或指示才能進行處理，僅有少數不須裁判指示即可進入場上處理。","C":"有些賽事場上處置時間有限制，但選手經評估傷勢嚴重無法繼續比賽，會被判定該場比賽結束，對手獲勝。","D":"有些處置是受到限制的，須向主辦單位確認，有些賽事場上禁止任何醫療處置。"},"answer":"A","manualChapter":"CH55"},{"id":2176,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"運動賽事中的救護是相當重要的一環，有關於籌備考量的事項，下列敘述何者最適當？","options":{"A":"針對現場救護工作流程，應完全依照當地到院前緊急救護指引。","B":"當選手受傷時，應由大會救護人員先行上場評估及處置。","C":"針對救護動線，除路線順暢、應有緊急疏散備案。","D":"選手受傷需要送醫時，應考量現場救護量能，先送往最近醫院診治。"},"answer":"C","manualChapter":"CH55"},{"id":2177,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列新興感染症的出現及增加原因的相關敘述何者最不適當？","options":{"A":"日本腦炎的感染症增加是因為生態改變及農業發展導致。","B":"愛滋病因國際間旅遊與貿易頻繁而助長蔓延。","C":"肺結核病最容易在人口高度密集的地方散播，這是人口學之改變的影響。","D":"鼠疫從中亞草原被帶進歐洲，正是藉由戰爭及貿易的途徑。"},"answer":"B","matchedChapters":["CH43"],"manualChapter":"CH43"},{"id":2178,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列有關生物恐怖攻擊事件線索，何者最不適當？","options":{"A":"染病的病人疾病潛伏期相近且密集。","B":"某一疾病或症狀的病人數逐漸增加。","C":"近期忽然出現許多同症狀的年輕病人。","D":"出現相同症狀的病人集中於限定區域。"},"answer":"B","manualChapter":"CH43"},{"id":2179,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"颱風期間，出勤執行緊急救護任務，徒步前進時發現路段積水且有電線落於其中。下列處置，何者最適當？","options":{"A":"立即撤回並待命。","B":"穿戴絕緣防護裝備並繼續執行。","C":"等待當地單位確認電源狀況。","D":"使用船隻繞過危險區域。"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":2180,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"影響地震傷亡的因素，下列何者最不適當？","options":{"A":"主要為物理力量引起。","B":"多不需要手術治療。","C":"傷亡者多分散在不同建築物。","D":"沒有清理的大量死亡屍體，並不是疫病的來源。"},"answer":"C","manualChapter":"CH56","matchedChapters":["CH56"]},{"id":2181,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"以下降落地點條件，最符合直升機空中救護需求？","options":{"A":"可見度至少達到1,000公尺，降落區域地面平整，半徑為直升機全長的1倍。","B":"視野能見度達1,500公尺以上，降落區域平整且寬度至少為直升機全長的1.5倍。","C":"降落區域位於市中心空曠地點，面積不小於直升機全長的2倍，但能見度800公尺。","D":"降落地點為鄉村平地，區域長寬為直升機全長的1.5倍，能見度無限制要求。"},"answer":"B","manualChapter":"CH58"},{"id":2182,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"您所服務地區的消防局正與急診部門合作研究一項針對心肺復甦急救的新技術。今日您接獲派遣出勤的OHCA病人需立即接受救治，現場無法即時取得病人或家屬的同意，但醫院的研究倫理委員會已批准在特殊情況下的「同意替代方案」。較適合採用哪種替代方案以符合法律與倫理標準？","options":{"A":"遠處同意，由基地醫院的醫師透過無線電取得病人家屬同意。","B":"經代理人同意，由救護技術員於現場說明後向家屬取得同意。","C":"群體同意，病人於事前已同意在未來急救情況下參與研究。","D":"推遲同意，病人先接受救治，穩定後再向家屬取得完整同意。"},"answer":"D","manualChapter":"CH11"},{"id":2183,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"下列何者最隸屬於「醫療品質測量模式」之「結構面」項目當中？","options":{"A":"OHCA病人接到電話至電擊給予之時間間距。","B":"現場檢傷分級為重度外傷(major trauma)，其被送至外傷中心(trauma center)之比例。","C":"傷病患能存活至離開醫院之比例。","D":"救護人員離職率。"},"answer":"D","manualChapter":"CH09"},{"id":2184,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"根據反饋的技巧與時間點，下列哪一種方式最能有效促進學員的自省與學習？","options":{"A":"提供所有學員一份標準的反饋問卷。","B":"在訓練過程中，由老師即時引導學員進行反饋。","C":"在課程結束後，讓學員各自評估自己的表現。","D":"提供所有學員一份標準的反饋問卷。"},"answer":"B","manualChapter":"CH60"},{"id":2185,"source":"113年度EMTP筆試-題目卷(100題)(含答案)-1131227公告版","question":"有關「課程設計架構與模式(model)」中「情境模式(situation model)」之敘述。何者最不適當？","options":{"A":"又稱「文化分析模式」。","B":"易被社會的意識形態所操控。","C":"易有具體的課程藍圖。","D":"課程目標是在傳授學生文化中最重要的部分。"},"answer":"C","manualChapter":"CH60"},{"id":2186,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"建立完善的緊急醫療救護體系須從四個面向努力，下列有關四個面向的敘述，何者為是？","options":{"A":"卓越領導：依緊急醫療救護法第25條，建立醫療指導制度，由醫療指導醫師領導緊急醫療救護體系發展。","B":"完整系統：完整系統的要素，舉凡人才招募、教育訓練、醫療設施、品質管理等，都必須逐項建立。","C":"健全財務：公家機關資源有限，民間資源無窮，訓練經費與器耗材不足等的資金缺口都可依賴募款補足。","D":"妥善立法：依緊急醫療救護法第2條，社區緊急醫療救護系統之運作，主管機關在各縣市，相關法規應由各縣市自行立法。"},"answer":"B","manualChapter":"CH01"},{"id":2187,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有關法律與救護倫理的敘述，下列何者為非？","options":{"A":"法律是這個社會評價中的最低標準，符合倫理的行為必定為合法的行為。","B":"對於同樣的困境，每個人會有不同的倫理價值判斷，也不一定具有標準答案。","C":"道德觀是建構個人倫理價值的重要元素。每個人的倫理標準也會因為道德觀的不同而有所差異。","D":"透過經常的練習及不斷的思考，有助於個人在面對倫理困境時，迅速做出判斷及採取適當的行動。"},"answer":"A","manualChapter":"CH04","matchedChapters":["CH04"]},{"id":2188,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"消防隊員小志支援火警任務。現場發生閃燃，分隊很照顧他的資深學長不幸往生。事發後小志腦裡還常浮現閃燃和急救學長的畫面，不斷地出現自責、生氣、失眠的現象，也不願意靠近救護車。請問您覺得小志怎麼了還有可以如何幫助他的以下敘述，何者最為正確？","options":{"A":"事件造成小志極大的痛苦並且影響到日常生活，可能會持續一個月以上。","B":"事發了解小志曾罹患焦慮症，但這病史不會讓他更容易得到創傷後壓力症。","C":"經歷嚴重的創傷事件後，出現短期急性壓力症是常見的，不用擔心。","D":"創傷後壓力症與急性壓力症的首選治療方式為「藥物治療」，所以要陪同他盡快就醫服藥。"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2189,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"根據高級救護技術員教科書(第二版)提到，當救護技術員遇到精神異常的救護時，應該快速地評估病人狀況，以下何者相對較不重要？","options":{"A":"主要求救原因。","B":"是否有攻擊行為。","C":"是否有自殺意圖或計畫。","D":"是否有精神病史。"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2190,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"執行愛滋病病人救護時病人不配合，救護員被尖銳物扎傷左手，接著噴濺的血液飛入救護員眼中，關於處理流程建議何者正確？","options":{"A":"以肥皂及水清潔左手傷口，眼睛沖水即可，一周內向工作單位通報。","B":"被扎者並不需要立即檢測HIV，因為會有空窗期。","C":"預防性投藥不要超過72小時，超過7天則無預防效果。","D":"定期追蹤3次抗體，3個月後追蹤結果為陰性，即可排除感染之虞。"},"answer":"C","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":2191,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"第一反應員(first responder)為緊急醫療救護系統中第一位到達現場的受過訓練之專業人員，下列敘述何者為非？","options":{"A":"透過社區層級的醫療反應及第一反應員的設立，可以改善時間急症患者的預後。","B":"第一反應員可以是消防人員、警察、民間救護人員、警衛安全人員或社區志工等。","C":"經過合格受訓的第一反應員，可以取代緊急醫療救護人員並提升社區存活率。","D":"辨識傷病人疾病的嚴重程度或受傷的情形為第一反應員的訓練的主要內容之一。"},"answer":"C","manualChapter":"CH01"},{"id":2192,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於派遣員協助心肺復甦術(Dispatcher Assisted CPR，以下稱DA - CPR)敘述，何者正確？","options":{"A":"研究顯示，在緊急救護人員接觸病人之前，旁觀者先執行CPR，OHCA病人的存活機率並無明顯提升。","B":"在辨識階段，派遣員必須詢問兩個關鍵問題「意識是否清醒？」以及「呼吸是否正常？」。","C":"派遣員執行DA-CPR時需要另一端的報案者積極配合，並且學過CPR，才能為突發性心跳停止的病人爭取更佳的救活機率。","D":"詢問句型「有無呼吸」與「有無正常呼吸」，對於同一病人這兩個問題的OHCA辨識率相似。"},"answer":"B","manualChapter":"CH07"},{"id":2193,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有一種果實，食用方式是咀嚼與唾液混和後吐出，咀嚼後很快會有提神的效果，服用過量會產生分泌物增加、縮瞳、緩脈、支氣管痙攣，下列以藥理學敘述吃的過程何者為非？","options":{"A":"吸收方式為口腔內吸收。","B":"植物鹼會經過肝臟首渡效應再進入循環系統。","C":"以症狀來看檳榔毒性應該是乙醯膽鹼。","D":"長期越吃越多才有提神效果是因為適應性(tolerance)。"},"answer":"B","manualChapter":"CH16"},{"id":2194,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"插管病人運送途中常常會發生血氧下降、ETCO2異常，以下關於插管後的評估照護的敘述何者為非？","options":{"A":"圖一二氧碳濃度圖儀顯示管路可能滑脫。","B":"超音波上發現Double trachea sign代表氣管內管位置正確。","C":"BVM有阻力、聽診單側呼吸音減弱、可能是氣胸。","D":"圖二二氧碳濃度圖儀顯示氣囊可能破損。"},"answer":"B","manualChapter":"CH14","image":"題庫圖片/2194.png"},{"id":2195,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"一位罹患慢性阻塞性疾病病人，主訴呼吸喘。臨床發現雙側有哮喘音(Wheezing)，病人未使用氧氣時，血氧濃度88%。以下敘述，何者為非？","options":{"A":"病人噘嘴呼吸，肋間肌凹陷，有呼吸窘迫現象。","B":"病人有下呼吸道阻塞現象。","C":"可考慮使用Ventri-mask(凡德里面罩)，以提供低流速、高濃度氧氣。","D":"考慮給予吸入型支氣管擴張劑。"},"answer":"C","manualChapter":"CH35"},{"id":2196,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於潮氣末二氧化碳濃度的臨床應用，何者為非？","options":{"A":"正常潮氣末二氧化碳分壓值(EtCO2)為45~50 mmmHg。","B":"可評估CPR的按壓品質，並確認是否恢復自主循環。","C":"嚴重低體溫的病人，潮氣末二氧化碳分壓值可能偏低。","D":"嚴重頭部外傷的病人，潮氣末二氧化碳分壓值可能偏高。"},"answer":"A","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":2197,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"以下對於人體神經系統的描述，何者為非？","options":{"A":"自律神經系統的神經傳遞物質中，最常見的是多巴胺（Dopamine）。","B":"許多藥物或毒物，都是由類似神經傳遞物質，或阻礙神經傳遞物質的構造而產生作用的。","C":"延髓是人體的生命中樞，包括多項生命中樞，如心臟血管中樞、呼吸節律中樞、吞嚥中樞、嘔吐中樞等。","D":"交感神經系統，主要負責人體在面對壓力的反應。"},"answer":"A","manualChapter":"CH12"},{"id":2198,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"以下對於「酸鹼不平衡」中，對應的檢驗、症狀、原因與處置，何者為非？ (多選)","options":{"A":"呼吸性酸中毒：pH<7.35，常見於換氣不足，可利用機器輔助呼吸改善。","B":"代謝性酸中毒：深且快的庫式呼吸、應根據病因給予治療。","C":"呼吸性鹼中毒：感覺麻木、通常因為過度換氣使得血中氧氣減少造成。","D":"代謝性鹼中毒：pH>7.35，可因為大量嘔吐，胃酸流失造成。"},"answer":"C,D","manualChapter":"CH12"},{"id":2199,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"根據六到十二歲學齡兒童發展的里程碑，我們會發現到這時期的兒童發展有不同的重點。關於這些重點，下列敘述，何者為非？","options":{"A":"體重的增加開始以肌肉為主而非脂肪；力量增加。","B":"孩子的道德邏輯推理能力建立。","C":"雙親通常陪伴孩子的時間增加。","D":"孩子逐漸理解死亡的概念。"},"answer":"C","matchedChapters":["CH13"],"manualChapter":"CH13"},{"id":2200,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"55歲男性病人突然意識改變與全身抽搐。您到達現場時，病人仍意識不清無法溝通並嘴角抽動，請問此時最適合的醫病互動模式為何？","options":{"A":"「主動—被動」模式。","B":"「指導—合作」模式。","C":"「共同參與」模式。","D":"「遵從法規」模式。"},"answer":"A","manualChapter":"CH18"},{"id":2201,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"55歲男性病人主訴早上起床後發現自己右側肢體無力。您到達後與病人採用「SOAP」溝通模式，下列描述哪一項屬於「O」的敘述？","options":{"A":"早上起床病人表示發現自己右側無力。","B":"請病人雙手平舉，發現病人右手明顯下垂。","C":"最後一次正常時間為昨晚10點睡覺前。","D":"過去病史有高血壓。"},"answer":"B","manualChapter":"CH18"},{"id":2202,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"您和一位資深救護員接獲一趟行為急症的救護，現場為35歲女性，左手前臂多處刀傷，病人一直在哭泣，反覆大喊；｢我是沒有用的人，不如早點離開人間。｣。和您一起出勤的學長，走到病人身邊，蹲下輕拍病人肩膀，和病人說：｢您願不願意和我多聊聊？跟我多說一些？｣。此學長所利用的溝通技巧為何？","options":{"A":"促進(facilitation)。","B":"反射(reflection)。","C":"澄清(clarification)。","D":"同理心(empathic responses)。"},"answer":"A","manualChapter":"CH19","matchedChapters":["CH19"]},{"id":2203,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"以下呼吸模式與對應的可能的臨床疾病組合，何者正確？","options":{"A":"庫斯毛耳氏呼吸(Kussmaul respiration) –慢性阻塞性肺病。","B":"陳施氏呼吸(Cheyne-Stokes respiration) –糖尿病酮酸中毒。","C":"逆理式呼吸(paradoxical respiration) –呼吸衰竭。","D":"畢歐氏呼吸(Biot’s respiration) –大腦損傷。"},"answer":"C","manualChapter":"呼吸型態(含肺音)","matchedChapters":["CH20"]},{"id":2204,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"病人主訴頭暈及嘔吐，對於協助區分此病人為中樞型或周邊型眩暈之相關檢查何者為非？","options":{"A":"病人以腳跟接著腳尖連續直線行進(tandem walking)。","B":"病人以手指頭摸鼻子接著摸您的手指頭之反覆點對點運動(point-to-point movement)。","C":"觀察患者眼球活動，檢查患者眼球活動及眼震方向。","D":"利用叩診槌檢查患者深部肌腱反射(deep tendon reflexes)。"},"answer":"D","manualChapter":"CH36"},{"id":2205,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"當您出勤派遣救護時，收集及彙整有關現場環境、主訴、病史及實施初評等病人資訊，為執行關鍵思考之哪一步驟？","options":{"A":"資料判讀。","B":"概念形成。","C":"應用原則。","D":"反應評估。"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2206,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於成人基本救命術(basic life support)目前的科學證據與急救指引，以下敘述何者最適當？","options":{"A":"因心室顫動或無脈性心室頻脈的OHCA病人，每延遲一分鐘的心肺復甦術會使存活率下降17~20%。","B":"電擊去顫前，目擊者有施行心肺復甦術，OHCA病人的存活率下降會比較慢，大約每分鐘降3~4%。","C":"高品質心肺復甦術包含盡量減少中斷壓胸時間，是指胸部按壓時間須佔所有搶救時間的50%以上。","D":"從病人心跳停止導致腦部沒有血液供應的那一刻起，10分鐘後腦細胞就會因為缺氧而開始分解破壞。"},"answer":"B","matchedChapters":["背誦題"],"manualChapter":"背誦題","explanation":"p629 CH23 研究顯示，對於發生心室顫動或無脈性心室頻脈而猝死的病人，每延遲一分鐘的心肺復甦術會使存活率下降7~10％，當目擊者有施行心肺復甦術時，存活率的下降會比較慢，大約每分鐘降3~4％。"},{"id":2207,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"在復甦醫學的新進展中，關於葉克膜體外維生系統(Extracorporeal Membrane Oxygenation，ECMO)的敘述，下列敘述最不適當？","options":{"A":"ECMO對於急性心衰竭的病人，可有效改善心臟收縮功能，增加組織灌流改善循環。","B":"VV-ECMO取代肺臟氣體交換的功能，對心臟的循環沒有助益，只能用在肺部疾病病人。","C":"VA-ECMO將靜脈血經氣體交換後送回到病人動脈，可用於心臟衰竭或肺功能衰竭的病人。","D":"頭頸部外傷併顱內出血72小時內、缺氧至腦部嚴重受損為不適用於葉克膜的禁忌症。"},"answer":"A","manualChapter":"CH24"},{"id":2208,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列有關爆炸傷的描述，何者為是？","options":{"A":"爆炸傷是複合性傷害，但並非所有爆炸傷都會經歷所有階段。","B":"爆炸傷第一階段傷害為燒傷。","C":"因爆炸彈出之患者，並非全部都視為頸椎受傷傷患。","D":"到達爆炸現場，應先將患者救出避免再次爆炸進而造成患者二次傷害。"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2209,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"依據PHTLS的初級評估，下列部位發現創傷大量外出血(Exsanguinating hemorrhage)時的立即止血方式，何者最不適當？","options":{"A":"前臂：止血帶。","B":"腋下：止血紗布和壓力敷料。","C":"頸部：傳明酸(Tranexamic acid)靜脈注射。","D":"腹股溝處：肢幹交界型(junctional)止血帶。"},"answer":"C","manualChapter":"CH25"},{"id":2210,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"您抵達一名機車騎士騎車自撞路樹的車禍現場，傷患意識清楚無頸部疼痛或是上肢不適情形，但是呼吸淺快，血氧90%、臉色蒼白、皮膚明顯濕冷、脈搏較弱、腹部紅腫併明顯壓痛，左小腿有瘀青合併明顯變形，請問下列何者是您最應先做的處置？","options":{"A":"左小腿骨折固定。","B":"現場幫病人打點滴。","C":"給予氧氣協助呼吸。","D":"擦傷傷口包紮。"},"answer":"C","manualChapter":"CH25"},{"id":2211,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"出血性休克傷患，若對初始輸液反應不佳，則需要考慮輸血。下列有關輸血時的注意事項，何者為非？","options":{"A":"血品的選擇：對於有懷孕能力的婦女，為避免母體產生抗體，造成將來懷孕時之併發症，建議可使用O型Rh陰性血輸血。","B":"避免低體溫：最有效避免大量輸血或輸液後低體溫的方法，是輸液前先將輸液加熱至39°C，晶質液可使用微波加熱及血液可放在保溫器加熱。","C":"大量輸血：預測需要大量輸血的方法為ABC score，其內容包含心跳>100次/分，血壓<90mmHg，穿刺傷及FAST超音波呈陽性，符合2項或以上。","D":"凝血功能異常：嚴重創傷出血可能會快速消耗凝血因子，大量輸液亦會造成血小板及凝血因子被稀釋而影響功能，低體溫則可能影響血小板凝集。"},"answer":"C","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":2212,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"一位24歲男性騎機車自撞電線杆，您抵達現場時發現傷患安全帽已脫落，頭部雖無出血變形，但嘴唇撕裂傷合併口腔變形，病人持續出血躁動，請問下列處置何者最不適當？","options":{"A":"放置口咽呼吸道以維持暢通。","B":"準備大口徑的抽吸管抽吸，避免肺部吸入性傷害。","C":"使用下頷推擠法暢通呼吸道並給予頸椎固定。","D":"若傷患因呼吸困難躁動無法配合戴頸圈，維持呼吸道暢通比頸椎固定重要。"},"answer":"A","manualChapter":"創傷"},{"id":2213,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"您接獲指揮中心通報，據同車友人表示，病人開車自撞山壁後意識不清，但您抵達現場後發現病人意識清楚，主訴頭部疼痛，理學檢查發現頭部有5公分撕裂傷合併頭皮血腫，其餘各部分都無明顯外傷，後續轉送至醫院後，病人於留院觀察中突然失去意識、肢體癱瘓。請問有關此傷患最可能的傷害何者正確？","options":{"A":"硬腦膜上出血(epidural hemorrhage)。","B":"硬腦膜下出血(subdural hemorrhage)。","C":"蜘蛛膜下腔出血(subarachnoid hemorrhage)。","D":"腦內出血(Intracerebral hemorrhage)。"},"answer":"A","manualChapter":"CH27"},{"id":2214,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於眼睛損傷的描述，下列何者最不適當？","options":{"A":"若被強酸、強鹼灼傷，需儘快以大量清水沖洗。","B":"支配眼球運動的肌肉受傷時，可能產生複視的現象。","C":"眼球挫傷後的瞳孔反應不正常，最常見的原因是第三對腦神經損傷。","D":"眼睛被化學物品灼傷時，可在醫療指導醫師指示下，將隱形眼鏡拔除。"},"answer":"C","manualChapter":"CH27"},{"id":2215,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列有關於頸部創傷的敘述，何者為非？","options":{"A":"高位頸椎創傷須密切注意傷患使否進展至呼吸衰竭。","B":"罹患中央脊髓症候群(central cord syndrome)的傷患，可能有四肢輕癱現象，且上肢較下肢嚴重。","C":"根據加拿大頸椎守則(Canadian C-Spine Rule，簡稱CCR)，清醒且生命徵象穩定的傷患，即使沒有頸椎損傷的高危險及低危險因素，CCR建議應令傷患自行轉動頸部才能排除頸椎損傷。","D":"脊髓性休克(spinal shock)主要機轉為脊髓受傷導致交感神經受到影響，交感神經失去對血管的控制，引起全身性的血管擴張，治療為適度輸液，必要可以適度使用升壓劑。"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2216,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於下列胸部創傷的描述，下列何者為是？","options":{"A":"創傷性主動脈剝離，最常好發處為升主動脈。","B":"氣管支氣管破裂，以肺內細支氣管破裂最常見。","C":"心臟震盪(commotio cordis)的傷患，最常見的心律是心室顫動。","D":"創傷性窒息，常見受壓迫位置以下皮膚呈現藍紫色，而以上的皮膚顏色正常。"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2217,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"30歲男性自述右胸中彈，無肢體大出血，呼吸速率正常，經檢視後發現右胸壁前後各有一開放性傷口，給予塑膠包裝貼三邊覆蓋傷口後送醫，但在送醫途中傷患突然意識變化、呼吸急促。請問有關此患者相關處置，下列何者最不適當？","options":{"A":"再次檢查胸腹部是否有其他傷口。","B":"執行延伸性創傷超音波(e-FAST)評估傷患病情改變原因。","C":"移除傷口原塑膠包裝改用急救填塞止血敷料。","D":"若是評估為張力性氣胸，在第五肋間腋中線前側給予針刺減壓。"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2218,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於胸部創傷敘述，下列何者為是？","options":{"A":"執行超音波e-FAST，在劍突處進行掃描，主要是確認橫膈膜是否破裂。","B":"執行胸部超音波時看到條碼徵候（barcode sign）表示傷患可能有氣胸的情形。","C":"發現開放性氣胸時，應進行針刺減壓，減低胸內壓力。","D":"針刺減壓時應選擇第五肋間腋中線前側肋骨下緣下針。"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2219,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"50歲男性駕駛汽車發生交通事故，因車體變形受困車內，脫困後膚色蒼白、呼吸淺快，請問以下哪個徵候會讓您最合理懷疑傷患可能有脾臟損傷？","options":{"A":"腰部瘀青(Turner sign)。","B":"肚臍周圍瘀青(Cullen sign)。","C":"右上腹挫傷。","D":"Kehr徵象(Kehr sign)。"},"answer":"D","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":2220,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"23歲男性工地高處跌落，右下腹遭巨型鋼片穿刺留於腹壁上，下列關於腹骨盆創傷評估與處置何者最不適當？","options":{"A":"血壓測量80/50毫米水銀柱，直接給予大量生理食鹽水2公升。","B":"穿刺傷口周圍出血，給予直接加壓止血，並嘗試固定穿刺物。","C":"按壓骨盆不穩定懷疑骨盆骨折，使用骨盆固定帶進行固定。","D":"評估患者出現休克徵候，呼吸急促，給予氧氣面罩使用。"},"answer":"A","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":2221,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"院前的FAST超音波檢查可以改變20~30%外傷傷患的處置或後送，有關院前FAST檢查腹部掃描的注意事項下列何者錯誤？","options":{"A":"注意掃描時需上、下仔細去檢查，而非只看一個面。","B":"掃描肝腎交界時把探頭橫放在右側肋骨下緣，腋前線的位置。","C":"掃描脾腎交界時把探頭橫放在左側肋骨下緣，腋後線的位置。","D":"掃瞄膀胱時探頭放在恥骨上緣，並把探頭往恥骨聯合方向掃描。"},"answer":"B","manualChapter":"CH21"},{"id":2222,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列有關骨骼肌肉創傷的敘述，下列何者為非？","options":{"A":"肩部創傷到院前評估處置重點為：評估有無合併神經及血管損傷、三角巾或八字肩帶固定、冰敷患處。","B":"肱骨遠端或中段骨折容易合併腋神經損傷。","C":"拳擊者骨折是因直接撞擊造成掌骨骨折，最常見為第五掌骨折。","D":"根據統計高處墜落跟骨骨折傷患中，10％會合併脊椎骨折；5％為雙側跟骨骨折。"},"answer":"B","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":2223,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於骨骼肌肉創傷，以下何者錯誤？","options":{"A":"腹部鈍挫傷中最常見的受傷器官是脾臟及肝臟。","B":"脫臼復位通常傷患會極度疼痛，因此不建議在現場執行。","C":"遇到截肢傷，應直接將斷肢放在冰上以增加保存及手術復原機率。","D":"在脫困出傷患、尤其在受壓迫超過4小時以上，鬆開受壓迫的肢體前應給予大量靜脈輸液或使用碳酸氫鈉鹼化。"},"answer":"C","manualChapter":"CH30"},{"id":2224,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"50歲女性駕駛汽車出車禍，初步評估中發現全身多處擦挫傷，左小腿變形合併有一處深部撕裂傷口，沒有持續出血，現場亦無明顯外出血。下列關於這位傷患處置，何者最不適當？","options":{"A":"若遠端脈搏摸不到，可考慮牽引移動到原解剖位置。","B":"牽引過程中，傷患明顯疼痛或過程中有阻力時應停止動作。","C":"發現為開放性骨折，將外露的骨折或軟組織塞回傷口內。","D":"搬運過程中傷口開始出血，加壓仍無法控制出血，打上止血帶。"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2225,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於燒燙傷與電灼傷，下列描述何者最不適當？","options":{"A":"當傷患有顏面灼傷、鼻毛燒焦、呼吸有喘鳴聲(stridor)、聲音沙啞時，要高度懷疑有呼吸道灼傷。應考慮儘早放置氣管內管。","B":"嚴重燒燙傷傷患之輸液補充，可採修正後布魯克公式(modified Brooke formula)：初始24小時靜脈輸液量= 2ml/公斤體重×傷患體重×灼傷面積(無計入一度燒傷面積)。","C":"若閃電傷害現場同時造成多位傷患，應優先急救呼吸中止者(不論有無脈搏)。","D":"若暴露在粉末之化學物質情況下，應儘快用清水或生理食鹽水沖洗，以免粉末持續對皮膚產生化學性灼傷。"},"answer":"D","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":2226,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"搜救人員將傷患從火場中抬出，患者表示胸口很痛，呼吸不順，右手前臂灼傷，下列處置何者最為適當？ (多選)","options":{"A":"血氧量測96%，應先觀察患者狀況，再決定是否給予氧氣治療。","B":"傷患右前臂有一個手鍊，表示很有紀念價值，拒絕將其拿下來，協助將手鍊降溫。","C":"除了詢問基本病史外，應詢問搜救人員傷患所在位置，燃燒物質等。","D":"傷患從火場抬出，意識清楚可以講話，並持續表示胸口很痛，呼吸道正常，吸入性灼傷機會小。"},"answer":"C,B","manualChapter":"CH31"},{"id":2227,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"指揮中心通報，化工廠有一名員工接觸到不明物質，請您協助前往救護。有關此病人的處置與敘述何者為是？","options":{"A":"到場發現患者身上有不明白色粉末，雙手暴露有紅腫起水泡，立即使用大量清水沖洗。","B":"鹼性燒傷通常比酸性燒傷來的嚴重，因為強鹼性物質造成的傷害方式是液化性壞死。","C":"廠區員工查出化學物質後提供中和試劑，隊員應使用中和試劑來沖洗化學性灼傷的部位。","D":"眼睛遭受到鹼性燒傷初期，不建議使用乳酸林格氏液持續沖洗。"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":2228,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"某男於河堤路跑時不慎遭流浪犬隻攻擊造成臉部一處咬傷，請問咬傷的傷口處理原則下列敘述何者為非？","options":{"A":"給予抗生素治療。","B":"確實清洗傷口。","C":"給予破傷風治療。","D":"到院後傷口立即進行清創及縫合以免造成感染。"},"answer":"D","manualChapter":"CH45","matchedChapters":["CH45"]},{"id":2229,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"反應複雜的凝血機制可以精要地分為三大基本步驟，下列何者為非？","options":{"A":"由受傷處釋放出血小板因子。","B":"凝血因子串聯反應形成凝血酶(thrombin)。","C":"凝血酶結合纖維蛋白原(fibrinogen)形成(血)纖維蛋白，進而網住紅血球形成血塊。","D":"血塊因血小板因子作用黏附後成形，大過傷口並將其完整封閉。"},"answer":"","manualChapter":"CH39"},{"id":2230,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"一名病人因蜜蜂螫傷後全身紅疹過敏送醫，途中開始呼吸喘且出現喘鳴音(Stridor)，血氧濃度下降，下列何者為此病人呼吸困難最可能的成因？","options":{"A":"通氣。","B":"擴散。","C":"灌流。","D":"滲透。"},"answer":"A","manualChapter":"CH14"},{"id":2231,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於肺栓塞之敘述，下列何者為是？","options":{"A":"血栓會造成肺靜脈系統堵塞，造成病人有低血氧的症狀產生。","B":"靜脈疾病為肺栓塞危險因子之一，而骨盆以及下肢靜脈系統為最常形成血栓的部位。","C":"肺栓塞病人最常見的表現為心電圖S1Q3T3與右側束支傳導阻滯(RBBB)。","D":"對於高度懷疑急性肺栓塞之病人，可依預立醫囑於院前給予抗血小板藥物。"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":2232,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列對於肺氣腫病人臨床症狀的描述，何者為非？","options":{"A":"胸廓拉長、桶狀胸。","B":"發出哮鳴音(wheezing)及乾囉音。","C":"體重增加、身形肥胖。","D":"膚色呈現粉紅色。"},"answer":"C","manualChapter":"CH35"},{"id":2233,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"阻塞性呼吸道疾病是三種不同疾病的統稱，分別是慢性支氣管炎、肺氣腫以及氣喘，關於此疾病下列敘述何者為是？","options":{"A":"在氣喘及慢性支氣管炎病人身上，肺泡不能吐出空氣是因為肺泡壁受到破壞和失去回復的彈力，造成吐氣時氣道的狹窄。","B":"在肺氣腫病人身上，肺泡不能吐出空氣是因為黏液塊和氣道狹窄造成吐氣時氣體無法流出而造成肺泡過度擴張。","C":"慢性支氣管炎的病人在吸氣跟吐氣時都會有呼吸道阻力升高的現象，但肺氣腫的病人卻只有在吐氣時才會有呼吸道阻力升高的情形。","D":"肺氣腫的病人會出現紅血球增生(polycythemia)的情形，這在慢性支氣管炎的病人中並不常見。"},"answer":"C","manualChapter":"CH35"},{"id":2234,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"病人因急性呼吸衰竭被插上氣管內管使用呼吸器，但氧氣濃度持續下降，關於可能原因下列何者最不適當？","options":{"A":"氣管內管放置位置錯誤。","B":"呼吸道因痰塊阻塞。","C":"因插管通氣引起氣胸。","D":"鎮靜藥物造成呼吸抑制。"},"answer":"D","manualChapter":"CH51","matchedChapters":["CH15"]},{"id":2235,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"58歲男性，有高血壓、糖尿病等過去病史，因半小時前發現右側肢體無力報案，對於此病人之到院前處置，下列敘述何者為非？","options":{"A":"若病人意識清楚，可以排除低血糖情形，不需要測量血糖。","B":"可以用洛杉磯到院前腦中風評量表(LAPSS)，協助評估病人是否可能為腦中風。","C":"若病人有低血壓狀況，應將主動脈剝離列為可能之鑑別診斷。","D":"將此病人送醫時，應直接送至可以給予血栓溶解劑的醫院。"},"answer":"A","manualChapter":"CH22"},{"id":2236,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"腦脊髓液的產生處及流動路徑何者為是？","options":{"A":"由側腦室流向第二腦室，經由大腦導水管通向第三腦室，最後流入蜘蛛網膜上腔，再藉由蜘蛛膜絨毛被吸收進入血管。","B":"由側腦室流向第三腦室，經由大腦導水管通向第四腦室，最後流入蜘蛛網膜上腔，再藉由蜘蛛膜絨毛被吸收進入血管。","C":"由側腦室流向第二腦室，經由大腦導水管通向第三腦室，最後流入蜘蛛網膜下腔，再藉由蜘蛛膜絨毛被吸收進入血管。","D":"由側腦室流向第三腦室，經由大腦導水管通向第四腦室，最後流入蜘蛛網膜下腔，再藉由蜘蛛膜絨毛被吸收進入血管。"},"answer":"D","manualChapter":"CH12"},{"id":2237,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"救護現場1名55歲女性主訴一小時前開始心悸，身體無其他任何不適，經量測生命徵象GCS 15分，血壓：121/70mmHg，心電圖監測如下，針對該病人的評估及處置何者最適當？","options":{"A":"經靜脈給予adenosine 6mg緩慢推注。","B":"該名患者的心律可能為心房顫動(atrial fibrillation)。","C":"可考使用慮迷走神經刺激術(vagal maneuvers)。","D":"給予amiodarone 150mg靜脈快速注射。"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/2237.png"},{"id":2238,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"依據下圖心電圖判斷，最可能屬於何種區域之心肌梗塞？","options":{"A":"前壁(Anterior wall)。","B":"側壁(Lateral wall)。","C":"後壁(Posterior wall)。","D":"下壁(Inferior wall)。"},"answer":"B","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/2238.png"},{"id":2240,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有關心電圖判讀，下列敘述何者為非？","options":{"A":"心肌缺血可能會出現T波反轉的心電圖變化。","B":"肺動脈狹窄常導致右心房擴大，造成心電圖中P波變高。","C":"左心房擴大時，會形成P mitrale，常見於肢體導程。","D":"一般正常的心室去極化時，胸前導極R波的大小將逐漸變小，而S波則逐漸變大。"},"answer":"D","manualChapter":"CH50"},{"id":2241,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"40歲男性無過去病史，因全身無力一個月報案，現場初步評估無休克現象，但病史詢問部分發現病人最近有體重增加，皮膚容易瘀青出血，視野模糊問題，其外觀如下圖所示，請問此病人如產生視野缺損，最有可能產生哪種型態視野缺損？","options":{"A":"雙眼顳側視野缺損。","B":"雙眼鼻側視野缺損。","C":"單眼視野缺損。","D":"一眼鼻側，另一眼顳側視野缺損。"},"answer":"A","manualChapter":"CH36","matchedChapters":["CH36"],"image":"題庫圖片/2241.png"},{"id":2242,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於高滲高血糖非酮酸症候群(HHNS)及糖尿病酮酸血症(DKA)，以下敘述何者錯誤？","options":{"A":"HHNS比起DKA病人發病時通常血糖濃度較高。","B":"HHNS比起DKA通常體內製造胰島素較少。","C":"HHNS比起DKA通常疾病形成時間較慢。","D":"HHNS比起DKA病人年紀通常較高。"},"answer":"B","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":2243,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"當人體內的紅血球數目或血紅素不足時，就會出現貧血的症狀，針對貧血的敘述何者正確？","options":{"A":"造成貧血的常見原因可分為紅血球的製造出問題或是紅血球的破壞增加。","B":"貧血本身是一個疾病的診斷、可能會有會有頭暈目眩、蒼白、氣喘、心悸等症狀。","C":"臨床上不論何種貧血種類皆不會干擾到脈衝式血氧計的判讀。","D":"貧血症狀和它的成因、輕重程度、及進展的速度與是否合併其他疾病無關。"},"answer":"A","manualChapter":"CH39"},{"id":2244,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"人體的血液量約佔體重的1/13，主要是由血漿和血球所組成，關於血漿和血球的描述何者正確？","options":{"A":"血球可分為紅血球、白血球和血小板，其中又以白血球為最多。","B":"血漿的主要成分是水與蛋白質，以及無機鹽類和有機物。","C":"血球佔所有血液組成的70~75%。","D":"血漿是含有多種物質的液體，呈紅色。"},"answer":"B","manualChapter":"CH12"},{"id":2245,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"根據下列各種白血球分類計數，相對應對抗致病菌功能，下列何者為非？","options":{"A":"嗜中性白血球(neutrophil) 85%，臨床上偏向細菌感染。","B":"嗜酸性白血球(eosinophil) 15%，可能為寄生蟲感染。","C":"單核球(monocyte) 15%，可能為結核菌感染。","D":"淋巴球(lymphocyte) 60%，臨床上偏向過敏反應。"},"answer":"D","manualChapter":"CH39"},{"id":2246,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"肥大細肥和嗜鹼性細胞內的去顆粒化，會釋放出誘發過敏反應的物質，下列物質何者為非？","options":{"A":"組織胺。","B":"白三稀素。","C":"肝素。","D":"抗凝血因子。"},"answer":"D","manualChapter":"CH40"},{"id":2247,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列有關泌尿急症描述，何者錯誤？","options":{"A":"尿滯留會導致老人家譫妄。","B":"泌尿道結石好發於女性，需區別是否為婦產科急症。","C":"腎盂腎炎發生時，病人通常會有強烈的疼痛感(flank knocking pain)。","D":"有關泌尿道結石，台灣常見之結石種類以草酸鈣最多。"},"answer":"B","manualChapter":"CH41"},{"id":2248,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"泌尿道感染(Urinary Tract Infection, UTI)的定義是細菌在泌尿道滋生而產生感染的症狀。泌尿道感染大多是逆行性的感染，下列不屬於泌尿道感染？","options":{"A":"尿道炎。","B":"膀胱炎。","C":"腎盂腎炎(pyonephritis)。","D":"腎絲球腎炎(glomerular nephritis)。D(A"},"answer":"D","manualChapter":"CH41"},{"id":2249,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"病原體進入體內後，帶有記憶能力並放出抗體來進行中和作用以避免進一步傷害的是？(複選：選「白血球」也給分)","options":{"A":"白血球。","B":"巨嗜細胞。","C":"T型淋巴球。","D":"B型淋巴球。"},"answer":"D","manualChapter":"CH42"},{"id":2250,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於局部皮膚冷傷害的描述，下列何者最不適當？","options":{"A":"吸菸、酒精及穿著限制性的衣服是皮膚冷傷害的加重因子。","B":"身體最容易發生凍瘡的部位為下肢。","C":"當處置患肢時，應以溫毯或其他回溫器材緩慢的回溫。","D":"大風、潮濕的環境以及病人本身的內科問題亦會加重傷害的程度。"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2251,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"一位30歲男性於東北角龍洞潛水50米後因憋氣上升，至水面後立即喪失意識，呼吸急促，您是EMTP到現場進行處置，下列何者最不適當？","options":{"A":"現場立即進行氣管內管插管。","B":"應該要考慮進行基本救命術與給予氧氣。","C":"病人的鑑別診斷可能是動脈氣體栓塞。","D":"應考慮送往高壓氧的醫療院所進行高壓氧治療。"},"answer":"A","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2252,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"您獲派前往一山域救援行動。傷患資訊如下：女性，60歲有糖尿病史，求救原因為天雨路滑不慎摔倒導致左前臂約2公分撕裂傷及左側髖部挫傷以致於不能移動。傷患待援地點為該區最高點的一個涼亭。您接觸她的時候離受傷已過8小時。關於此傷患最適當的評估與處置描述為何？","options":{"A":"病人意識清楚但可能因為疼痛無法順利進食，應立即建立含糖輸液之管路以避免低血糖。","B":"因病人無法順利自行移動，應優先尋求直升機吊掛撤離，以及早進行手術。","C":"應同時評估是否有因維持同一姿勢過久而產生壓瘡或橫紋肌溶解症的風險。","D":"若左前臂之撕裂傷已無出血，表示傷口無進一步感染，可不必再重新清創。"},"answer":"C","manualChapter":"CH45"},{"id":2253,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"當您執行野外救護進行長時間搬運時，應留意脊椎固定或是使用長背板運送的病人，可能會出現壓瘡或深部靜脈血栓。以下關於避免長時間搬運產生可能的傷害，在權宜安全與避免傷害間，下列做法何者最不適當？","options":{"A":"抬長背板時，不應讓身體兩側輪流抬高。","B":"固定病人時要讓下肢能夠活動。","C":"允許病人能夠在擔架上翻身。","D":"全身的抽氣式護木(vacuum splint)取代長背板。"},"answer":"A","manualChapter":"CH45"},{"id":2254,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"您被派遣到一個跳樓救助的現場，一名女性在十層樓高的陽台外揚言要輕生，情緒非常激動。請問在這個情形下，病人評估及處置技巧的敘述，下列何者為非？","options":{"A":"由於病人的思緒處在相當混亂的階段，採取讓病人回答「是」或「不是」的是非問題，以免刺激到病人的情緒。","B":"可以考慮減少外界對病人的刺激，並減少現場的噪音、光亮，維持相對舒適的環境會對控制病人有所幫助。","C":"憂鬱症病人最令人擔心的是自殺問題，據國內研究統計，自殺死者中97%生前有精神疾病。","D":"此類病人危急處置的目標包含穩定情勢或病人的情緒、善用現場的人力資源並使病人恢復正常情緒。"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2255,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"在確立精神疾病的診斷前，應先排除其他內科急症。下列診斷何者最不可能有類似躁症的臨床表現？","options":{"A":"紅斑性狼瘡。","B":"腎衰竭。","C":"吸食安非他命。","D":"低血鉀症。"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2256,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列有關失智的敘述，何者錯誤？","options":{"A":"突然的情緒不穩或是令人尷尬的行為可能是失智症的第一個徵候。","B":"失智症通常和中風、基因、病毒或阿茲海默症有關。","C":"目前失智症只要好好配合醫師治療，是可回復的。","D":"失智有時和譫妄不好區分，如果病人本身的病史可能不可靠，先把病人當成譫妄來處置，因為這可能是危及生命的急症。"},"answer":"C","manualChapter":"CH47"},{"id":2257,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列針對老年病人的敘述，何者為是？","options":{"A":"譫妄(Delirium)的症狀包含注意力變差、失去定向感及意識清醒程度時好時壞等，病程緩慢發展，是一種慢性且不可逆的老年疾病。","B":"白內障是老年病人常見的眼疾之一，機轉為眼內壓上升造成視神經受傷，通常發生於雙眼，但不會造成全盲。","C":"老年病人有動脈粥狀硬化疾病會造成高血壓，高血壓定義為血壓持續大於140/90mmHg，且常以非典形症狀表現出來(如頭痛、健忘等)。","D":"老年傷患在遭遇胸部外傷時，加減速傷害應考慮主動脈剝離，但主動脈剝離通常不會立即死亡，適當的評估和治療可以挽救其生命。"},"answer":"D","manualChapter":"CH47"},{"id":2258,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有關兒童族群的院外心跳停止(OHCA)處置與敘述，下列何者為非？","options":{"A":"嬰兒OHCA幾乎皆為呼吸問題導致，故不使用AED或電擊器，以提升急救效率。","B":"兒童急救時，胸外按壓的建議深度為胸廓前後徑的三分之一，大約為5公分。","C":"兒童OHCA靜脈管路難以建立時，替代給藥途徑為骨內注射或從氣管內管給予。","D":"因呼吸問題為常見原因，故尚未建立進階呼吸道時，雙人操作的按壓通氣比為15:2"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2259,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列有關新生兒急救時的擺位與呼吸道清理的相關敘述，何者為是？","options":{"A":"新生兒出生後，建議常規性進行口、鼻的抽吸，以確保呼吸道暢通。","B":"進行呼吸道抽吸的步驟，建議以吸球先抽吸鼻部，再做口部的抽吸。","C":"為了維持呼吸道通暢，可將毛巾置於新生兒的枕部，以保持嗅吸姿勢。","D":"目前準則並不建議常規性地為羊水胎便染色的新生兒進行呼吸道抽吸。"},"answer":"D","manualChapter":"CH48"},{"id":2260,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"關於婦產急症，下列何者最為適當？","options":{"A":"如發生產後大出血，讓胎兒吸吮媽媽乳頭是可以考慮的處置。","B":"如有監測裝備，孕婦OHCA建議同時監測胎兒心跳。","C":"子癇前症通常發生在懷孕的第三期，癲癇發作時可以給予硫酸鎂。","D":"胎盤早期剝離最常發生於懷孕第二期會有突然的無痛大出血。"},"answer":"A","manualChapter":"CH49"},{"id":2261,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"30歲女性，懷孕30週，騎機車與小客車擦撞，您到現場發現她全身多處有擦傷，右下肢腫脹變形，主訴腹部疼痛。初步生命徵象：意識略顯焦躁，血壓85/40 mmHg，脈搏140次/min，血氧濃度為99%。胎心音監測胎兒心跳為110次/min。關於孕婦創傷的處置，下列敘述何者最為適當？","options":{"A":"常規給予氧氣並無益處，此病人血氧99%不建議給予氧氣治療。","B":"此病人出血量預估至少30%，建議盡快進行輸血。","C":"腹部疼痛須注意是否有子宮破裂或胎盤前置等情形。","D":"懷孕婦女不建議施打破傷風疫苗，避免造成畸胎。"},"answer":"B","manualChapter":"CH49"},{"id":2262,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"口服以下哪一種物質中毒，是可以考慮給予活性碳除污？","options":{"A":"氰化物(cyanide)。","B":"酒精中毒(ethanol intoxication)。","C":"鋰鹽(lithium)。","D":"鴉片類止痛藥(opioids)。"},"answer":"D","manualChapter":"CH50"},{"id":2263,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列何種毒蛇之蛇毒為單純的神經毒？","options":{"A":"","B":"","C":"","D":""},"answer":"D","manualChapter":"CH50"},{"id":2264,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有一名患者吸食過多海洛英(heroin)，到院後要給予何者解毒劑？","options":{"A":"Acetylcysteine。","B":"Benzodiazepines。","C":"Flumazenil。","D":"Naloxone。"},"answer":"D","manualChapter":"CH16"},{"id":2265,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"工廠爆炸多人被救出，現場採START/JumpSTART檢傷，其中rapid treatment快速治療，何者不是？","options":{"A":"暢通呼吸道。","B":"直接加壓止血。","C":"給予胸封貼。","D":"給予人工呼吸。"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":2266,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"事故指揮系統( Incident Command System，ICS )將事故指揮官下轄的工作人員區劃為管理幕僚(management staff)與功能幕僚(supportive staff)兩大類型。對於規劃在管理幕僚的人員裡，下列何者為非？","options":{"A":"發言官(Public Information Officer，PIO)。","B":"安全官(Safety Officer)。","C":"聯絡官(Iiaison Officer)。","D":"財務官(Finance Officer)。"},"answer":"D","manualChapter":"CH52"},{"id":2267,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有關輻射災害現場救護的觀念，下列何者為非？","options":{"A":"照護輻射污染的傷患，適當防護下，對救護人員、設備和設施不會有嚴重危害。","B":"輻射污染傷患，除污優先，醫療其次，避免後續醫療人員、醫療處所受輻射影響。","C":"有生命危險的傷患，應儘速後送至最近或最快可處理之醫院不限於核災急救責任醫院。","D":"傷患轉送前應脫除身上衣物，從頭到腳、從上而下的方式，剪下衣物，並向內捲。"},"answer":"B","manualChapter":"CH53"},{"id":2268,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列危害物質GHS標示說明，何者為是？ (多選)","options":{"A":"氧化性物質。","B":"刺激性物質。","C":"急毒性物質。","D":"爆炸性物質。"},"answer":"C,B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2269,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"有關大型活動醫療設站考量，可分為「人、事、時、地、物」5個部份，以下考量何者為是？","options":{"A":"現場如需要高級救命術人力，一般要求高級救命術(ALS)小組或備有自動電擊器小組應在5分鐘內到達活動的任何一個位置。","B":"醫療站的地點選擇以開放場所為佳，位置最好10分鐘路程內可到達所有活動區域，醫療站對內及對外的動線要保持順暢及安全。","C":"大型活動在人群移動時容易產生傷病人，因此緊急醫療救護的規劃，至少應從活動開始前至活動結束1小時。","D":"預估參加人數須先有初步粗略的估算，參加人員包含所有工作人員及觀眾，現場遊客人數無法預估，不列入考量。"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2270,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"鳳凰馬拉松比賽在您所屬的縣市舉辦，在離抵達終點的500公尺處，主辦單位無線電通報最近的救護站有一名30多歲的男性突然目擊倒地，鄰近的跑者已經在執行CPR，請趕緊前往現場評估處置，下列描述何者最不適當？","options":{"A":"經救命術處置後的救活率可高達80%。","B":"經由自動體外電擊器治療的效果明顯。","C":"高級救命術小組應在十五分鐘內抵達活動。","D":"現場插管並給予氧氣亦是處置的方向。"},"answer":"C","manualChapter":"CH55"},{"id":2271,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"在台灣，每年皆有腸病毒重症的發生，下列有關腸病毒的敘述，何者為是？","options":{"A":"根據基因分A、B、C三型，其中腸病毒71型被歸類於人類腸病毒A型。","B":"人類是唯一腸病毒的傳染來源。","C":"主要藉由腸胃道傳染及接觸傳染，不太會藉由呼吸道傳播。","D":"嬰兒急性心肌炎及成人心包膜炎由A族克沙奇病毒引起。"},"answer":"B","manualChapter":"CH43"},{"id":2272,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"穿戴防護裝備越高等級的防護裝備會使活動更加的困難。因此永遠要有風險與利益的平衡分析，若已知將遭遇有飛濺危害的已知液體，但蒸氣接觸皮膚有害的可能性低時。請問您出勤前該如何選擇最適當之個人防護裝備？","options":{"A":"A級防護衣。","B":"B級防護衣。","C":"C級防護衣。","D":"D級防護衣。"},"answer":"B","matchedChapters":["CH53"],"manualChapter":"CH53"},{"id":2273,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"台灣位處地震帶上，地震災害頻傳，造成人員的傷亡及財產的損失。下列有關地震災害的敘述，何者為非？(選「地震災害造成的大量死亡，屍體沒有清理，除了環境上的臭味，同時也是疾病的來源。」也給分)","options":{"A":"地震的規模，在九二一地震後，重新修訂為七級。","B":"根據世界各國的地震報告顯示，重大地震所造成的傷患，百分之六十以上都是在平常以外的醫療機構尋求治療。","C":"地震災害造成的大量死亡，屍體沒有清理，除了環境上的臭味，同時也是疾病的來源。","D":"台灣的地震，死亡人數最多的是西元1999年的集集地震。"},"answer":"D","manualChapter":"CH57","matchedChapters":["CH56"]},{"id":2274,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"依據台灣衛生福利部空中轉診審核中心之轉診申請表，對於申請空中緊急救護其適應症，以下何者為非？","options":{"A":"昏迷指數小於10。","B":"單手2根以上手指碾碎性斷指。","C":"脊椎、脊髓嚴重或已導致肢體癱瘓的創傷。","D":"溺水、並併發嚴重呼吸系統病症。"},"answer":"B","manualChapter":"CH58"},{"id":2275,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"下列敘述空中救護所具備的優點，何者為非？","options":{"A":"縮短治療時間。","B":"降低死亡機率。","C":"降低運送風險。","D":"節省醫療資源。"},"answer":"C","manualChapter":"CH58"},{"id":2276,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"英國統計學家Sir Austin Bradford Hill提出Bradford Hill criteria，來審查確認推定原因與研究結果，之間因果關係。包括條件何者為非？","options":{"A":"強度(strength)：有較大的相對風險(relative risk)。","B":"可逆轉性(reversibility)：降低曝露導致較小的疾病機率產生。","C":"時序性(temporality)：因在果前面發生。","D":"特異性(specificity)：數個因導致一個特定的果。"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2277,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"緊急醫療系統研究可以有許多應用，例如收集相關資料來知道何種處置、技術或是設備比較有效，也可以用來回答臨床的問題，藉此改善整個系統。請問緊急醫療系統研究的實施標準方法下列何者為非？","options":{"A":"描述型方法。","B":"前瞻性方法。","C":"橫斷面方法。","D":"功能型方法。"},"answer":"D","manualChapter":"CH11","matchedChapters":["CH11"]},{"id":2278,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"某縣市救護科決定對於所有胸痛病人都要做院前12導程心電圖，請問他最可能是僅基於品質目標六大面向中的哪一項做出這個決策？","options":{"A":"有效(effectiveness)。","B":"傷病人為中心(patient-centeredness)。","C":"安全(safety)。","D":"效率(efficiency)。"},"answer":"A","manualChapter":"CH09"},{"id":2279,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"醫學教育學者Dr. David Kern的著作「醫學教育課程發展六大步驟」，將臨床教育訓練的課程發展，具體的劃分出六個階段何者為非？","options":{"A":"第三階段：開發教學資源(resources developer)。","B":"第四階段：教育策略(educational strategies)。","C":"第五階段：課程執行與推廣(implementation)。","D":"第六階段：評估與回饋(evaluation and feedback)。"},"answer":"A","manualChapter":"CH60"},{"id":2280,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"以下哪一個行動顯著地有助於GAS反饋模型的「分析」階段？","options":{"A":"提供練習時的影像紀錄或旁觀者筆記。","B":"鼓勵每個學員反思，討論為何會發生缺失。","C":"討論缺失會打擊團隊士氣，應盡量避免。","D":"應指派隊長提出演練缺失的解決方案。"},"answer":"B","manualChapter":"CH60"},{"id":2281,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"如果您是因為「不想進火場、那麼只跑救護好像也不錯」的想法而參訓EMTP，根據馬斯洛需求理論，這樣的動機層次是屬於？","options":{"A":"生理需求。","B":"愛與歸屬。","C":"安全需求。","D":"自我實現。"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2282,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關選擇後送醫院的「分流政策」與「繞道政策」，何者正確？","options":{"A":"分流政策指的是將重症病人後送到可以做確切治療的醫院。","B":"繞道政策指的是將輕症病人避開鄰近壅塞的醫院而送至其他的醫院。","C":"生命徵象穩定但遭受高能量機轉的外傷病人應分流至無壅塞的醫院。","D":"生命徵象穩定且在黃金時間內的腦中風病人應繞道至栓溶或取栓的醫院。"},"answer":"D","manualChapter":"CH03","matchedChapters":["CH03"]},{"id":2283,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"救護行為構成法律上「過失」必須同時符合四項要件，下列何者最不符合過失要件？","options":{"A":"下班時對病人進行CPR造成肋骨骨折，病人死亡。","B":"執勤中以氧氣導管直接插入病人氣切口，病人張力性氣胸死亡。","C":"送醫途中車禍，救護車載送之月經痛病人飛出車外，頭部外傷死亡。","D":"氣管內管插管，誘發病人嘔吐造成吸入性肺炎，併發敗血性休克死亡。"},"answer":"A","manualChapter":"CH04","matchedChapters":["CH04"]},{"id":2284,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"民眾報案家中16歲的女兒因感情因素想跳樓，救護人員到場後，母親(報案者)擋在門口、表示女兒只是一時情緒不穩定，沒有精神病史，目前也已穩定且在房間裡休息、也有朋友陪同。病人母親要求救護人員不要打擾她、且表示拒絕救護與警察人員入內。此時的處置方式，何者最為適當？","options":{"A":"只要確定病人母親身份並請她於救護紀錄表簽名後，即可離開，不須作過多的解釋與說明，以免侵犯病人隱私。","B":"母親是病人的法定代理人，能代理法律行為(如簽約)，但不能代理事實行為(如急病狀態與否)，所以最好還是持續溝通、要見到病人。","C":"即使接觸傷病患弊大於利，救護人員也絕對不可聽信二手資訊(如病人母親轉述)，必須堅持見到病人本人並完整評估，才可返隊。","D":"這個情境符合法律上的緊急避難，而消防救護人員因具有執行公務的身份，可直接援引行政執行法之規定，進行強制進入。"},"answer":"B","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":2285,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關台灣醫療指導制度，下列敘述何者為非？","options":{"A":"醫療指導醫師實施辦法為衛生福利部制訂，並自民國99年7月1日正式施行。","B":"線上醫療指導係指由消防局聘任之醫療指導醫師所執行的即時醫療指導。","C":"直轄市、縣（市）消防主管機關應指定醫療指導醫師，建立醫療指導制度。","D":"訂定各級救護技術員品質指標、執行品質監測為醫療指導醫師的法定任務。"},"answer":"B","manualChapter":"CH02"},{"id":2286,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"醫療倫理四基本原則，不包括下列哪一項？","options":{"A":"尊重自主原則。","B":"行善原則。","C":"利他原則。","D":"公正原則。"},"answer":"C","manualChapter":"CH03"},{"id":2287,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列何者最不可能是我國高級救護技術員法定之緊急救護範圍？","options":{"A":"在支援大型活動醫療站時給予頭痛病人服用普拿疼(Acetaminophen)。","B":"在高山偏遠地區，對疑似高山肺水腫低血氧病患進行氣管內管插管。","C":"在送醫途中對有脈博不穩定之心室頻脈病患進行心臟整流(Cardioversion)。","D":"在救護現場依預立醫療流程執行TOR(Termination-of-resuscitation)現場判定死亡。"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2288,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關新冠病毒的傳播描述，以下何者為非？","options":{"A":"新冠病毒傳播主要為飛沫傳染。","B":"濕洗手對新冠病毒的傳播不具阻斷與防護作用。","C":"新冠病毒有可能經結膜感染，所以應戴護目鏡防護。","D":"對COVID-19病人抽痰，會產生氣溶膠，所以應做好空氣傳染防護。"},"answer":"B","manualChapter":"CH43"},{"id":2289,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"107年消防署的「派遣員指導旁觀者心肺復甦術」的品管指標，以下何者為非？","options":{"A":"可接觸之報案電話的OHCA辨識比率：設定指標為95％。","B":"辨識出OHCA之報案者接受DA-CPR的壓胸比率：設定指標為60％。","C":"電話報案後至辨識出OHCA時間的中位數：<120秒。","D":"從報案電話到開始做CPR的時間中位數：<180秒。"},"answer":"A","manualChapter":"CH07"},{"id":2290,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"派遣員初始流程的四大戒律(the Four commandments)，何者為非？","options":{"A":"他(傷病患者)現場有個人需要幫忙","B":"他(傷病患者)大概幾歲？","C":"他(傷病患者)的意識是清醒的嗎？","D":"他(傷病患者)的呼吸是正常的嗎？"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2291,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"全球復甦聯盟(GRA)「增加OHCA存活的十個步驟」中，名列第一步驟最重要的基石為？","options":{"A":"落實快速派遣。","B":"高品質心肺復甦。","C":"建立OHCA登錄系統。","D":"完整的AED部署計畫。"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2292,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"新生兒出生時為了脫離母體血液循環，會做出一些生理上的調整與變化，下列何者為非？","options":{"A":"體循環血管阻力的上升。","B":"主動脈、左心室與左心房壓力的上升。","C":"肺循環的血管阻力上升。","D":"右心室與右心房的壓力下降。"},"answer":"C","manualChapter":"CH48"},{"id":2293,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"根據科爾伯格的道德發展理論(Kohlberg ’ s Stages of Moral Development)，對孩子品行道德發展的描述，下列何者為非？","options":{"A":"「你搔我的背，我就會搔你的」這種『互惠』的概念是屬於天真的行為。","B":"『好孩子心理』是屬於習俗水準的道德推理。","C":"『法律與秩序』的心理是屬於後習俗水準的道德推理。","D":"由經教養過的良知來決定什麼是對的，屬於後習俗水準的道德推理。"},"answer":"C","manualChapter":"CH13","matchedChapters":["CH13"]},{"id":2294,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關抽吸，下列何者為非？","options":{"A":"抽吸過程中，若病人心跳加快，表示病人缺氧，須立刻停止抽吸。","B":"抽吸可能引發肺部塌陷，連帶引發缺氧，導致心律干擾甚至心跳停止。","C":"抽吸引發咳嗽可使顱內壓上升，使頭部外傷病人增加腦疝脫的危險。","D":"抽吸因呼吸道受刺激可導致血壓升高及心律不整。"},"answer":"A","matchedChapters":["CH15"],"manualChapter":"CH15"},{"id":2295,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關二氧化碳濃度圖儀解析(虛線表示40mmHg)，下列何者為非？","options":{"A":"下圖圖形表示氣管內管突然滑脫，鬆脫或拗折。","B":"下圖圖形表示CPR中，二氧化碳分壓值僅能大約維持在10-20mmHg左右。","C":"下圖圖形表示CPR後疑似ROSC。","D":"下圖圖形表示呼吸極不規則。"},"answer":"D","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":2296,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列何者是細胞的發電機，可進行有氧代謝產生細胞的能量來源？","options":{"A":"高基氏體。","B":"內質網。","C":"中心粒。","D":"粒線體。"},"answer":"D","manualChapter":"CH12"},{"id":2297,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"2歲兒童因誤食硬幣求救。您到達現場後進行身體檢查，目視其呼吸淺快，進一步胸部聽診發現異常呼吸音，以下評估結果何者為非？","options":{"A":"此異常呼吸音為喘鳴音(Stridor)，為連續性雜音，清楚的聽診位置常位於頸部。","B":"此異常呼吸音為空氣通過阻塞狹窄的胸腔外上呼吸道氣管，為中頻連續音。","C":"此異常呼吸音也常發現於腫瘤、氣管內結核、痰液阻塞的病人。","D":"此異常呼吸音於呼吸期出現時間，以吸氣期為主，嚴重狹窄時呼氣期亦會出現。"},"answer":"C","manualChapter":"CH48"},{"id":2298,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"以下各種方式為救護技術員用來評估病人呼吸道是否暢通的方法，何者為非？","options":{"A":"評估病人是否順暢說話。","B":"檢查病人血氧濃度是否大於94%。","C":"檢查病人是否有發出喘鳴聲(stridor)。","D":"檢視病人口腔內是否有異物的存在。"},"answer":"B","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":2299,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"高級救護技術員在面臨臨床決策時，可以有效率的將臨床決策按順序以六個以R開頭的步驟付諸行動，以下何者為非？","options":{"A":"評估傷病患(Read the patient)。","B":"評估環境(Read the scene)。","C":"診斷治療(React)。","D":"回報指導醫師(Report to medical director )。"},"answer":"D","manualChapter":"CH01","matchedChapters":["CH01"]},{"id":2300,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"公眾去顫系統(PAD)計畫要成功，除了經費充足與立法保護施救者外，還有四大要素，以下敘述何者為非？","options":{"A":"由醫療專業人員規畫與監督整個計畫的進行。","B":"加強訓練去顫器管理人員負責急救流程運作。","C":"與當地的緊急醫療救護系統緊密配合。","D":"定期的品管回顧檢討改進。"},"answer":"B","manualChapter":"CH02"},{"id":2301,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於葉克膜(ECMO)的敘述，以下何者為是？","options":{"A":"VA-ECMO為取代肺臟氣體交換的功能，對心臟的循環沒有幫助。","B":"VV-ECMO將靜脈血經氣體交換後送回到動脈，可同時支持心肺功能。","C":"頭部外傷合併顱內出血72小時內的患者為葉克膜的禁忌症。","D":"ECMO僅限於用於心臟疾病患者，肺部疾病如肺臟移植並非適應症。"},"answer":"C","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":2302,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"意識不清的原因素可利用口訣『AEIOUTIPS』來鑑別，以下配對何者為非？","options":{"A":"A：例如酒精(Alcohol)。","B":"E：例如觸電(Electric shock)。","C":"O：例如缺氧(Hypoxemia)。","D":"I：例如中毒(Intoxication)。"},"answer":"B","manualChapter":"CH22"},{"id":2303,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"「SOAP」是高級救護技術員常用的結構式溝通模式。下列哪一項是屬於「SOAP」中的Objective data (O:客觀評估)的部份？","options":{"A":"病患平時使用的藥物。","B":"每次胸痛發作的時間。","C":"家屬提供的最後一次正常時間。","D":"意識狀態。"},"answer":"D","manualChapter":"CH18"},{"id":2304,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關損害預防的3E，下列何者為非？","options":{"A":"法律強制(enforcements)。","B":"教育訓練(education)。","C":"安全設計(engineering)。","D":"建立創傷中心(establish)。"},"answer":"D","manualChapter":"CH25"},{"id":2305,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"一位50歲女性，站在椅子上跌落，撞擊右後背，理學檢查：心跳每分鐘90次，血壓110/80mmHg，呼吸速率每分鐘18次；血氧93%，意識E4M6V5，右後背瘀青，無開放性傷口；但胸壁在吸氣時有凹陷的情況，超音波無明顯異常，以下描述何者為非？","options":{"A":"病人不需要轉送創傷中心。","B":"超音波無明顯異常可亦可能為後腹腔出血。","C":"可以給予正壓給氧氣。","D":"常會發展為呼吸衰竭。"},"answer":"A","manualChapter":"創傷"},{"id":2306,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於「外傷現場檢傷分類指引」的敘述，以下描述何者為是？","options":{"A":"包括年紀性別、生命徵象、受傷機轉、特殊傷患等四大項。","B":"過度檢傷會造成創傷中心壅擠。","C":"對老人的敏感度比較高。","D":"過度檢傷應該越低越好。"},"answer":"B","manualChapter":"CH25"},{"id":2307,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於脈壓(pulse pressure)的生理描述，以下何者為是？","options":{"A":"脈壓主要反映動脈系統張力。","B":"出血性休克時脈壓會變寬。","C":"對於周邊組織灌流變化不敏感。","D":"其定義為收縮壓加上舒張壓。"},"answer":"A","manualChapter":"CH26"},{"id":2308,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"50歲男性，報案人說被人刺傷腹部後倒地，有明顯臟器外露，現場GCS：E2V2M5，其心跳每分鐘150次，血壓70/30mmHg，呼吸速率每分鐘30次，血氧85%，理學檢查：腹部有明顯壓痛及反彈痛，瞳孔等大且對光有反應(左3/右3)，氣管無偏移，頸靜脈無怒張，呼吸音：正常，以下描述何者為非？","options":{"A":"在到院前收縮壓可以控制在80~90mmHg。","B":"此病患不需要戴頸圈。","C":"此病患需要大量輸血。","D":"可以先快速給予靜脈輸液2000ml林格式液。"},"answer":"D","manualChapter":"CH29"},{"id":2309,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於頭部創傷的到院前處置，下列敘述何者為是？","options":{"A":"若傷患合併低血容性休克，應給予靜脈輸液以維持收縮壓≥90mmHg。","B":"雖然可能延長送醫時間，但GCS<9分時仍應執行氣管內插管。","C":"頭皮撕裂傷的出血量有限，應優先處理其他傷勢。","D":"已知過度換氣可以降低腦壓保護腦部，應常規執行並維持EtCO2介於40~45mmHg之間。"},"answer":"A","manualChapter":"CH27"},{"id":2310,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於脊髓創傷的到院前處置，下列敘述何者為是？","options":{"A":"儘早給予高劑量類固醇注射可以有效改善傷患預後。","B":"若傷患低血壓合併四肢癱瘓，應優先考慮神經性休克。","C":"若為長時間運送，長背板固定效果比鏟式擔架更好且併發症更少。","D":"若胸部穿刺傷的傷患意識清楚，不需要常規執行脊椎固定。"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2311,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於神經性休克(neurogenic shock)和脊髓性休克(spinal shock)，下列敘述何者為非？ (多選)","options":{"A":"脊髓性休克是脊髓損傷後產生暫時性的失能。","B":"神經性休克通常表現為四肢溫暖、心搏過緩和低血壓。","C":"脊髓性休克通常在第六節胸椎之上的脊髓損傷才會產生。","D":"神經性休克屬於分佈性休克的一種。B(送分) 32對於胸部創傷時，適時使用超音波可以協助診斷，下列胸腔超音波的敘述何者為是？(A)若在M-mode下看到條碼症候(barcode sign)，代表傷患一定有氣胸。(B)若在胸腔超音波看到肺點(lung point)，代表傷患一定有氣胸。(C)若在M-mode下看到海浪徵候(seashore sign)，代表傷患一定沒有氣胸。(D)若在胸腔超音波下看到與肋膜平行的A line，代表傷患一定沒有氣胸。"},"answer":"C,B","manualChapter":"CH26"},{"id":2312,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列胸部創傷的敘述何者為非？ (多選)","options":{"A":"兒童遭遇胸部創傷時，會比成人容易肋骨骨折。","B":"創傷性主動脈破裂的位置通常是在動脈韌帶。","C":"張力性氣胸針刺減壓在第五肋間腋前線的成功率較第二肋間鎖骨中線處高。","D":"肺部比起腹部受到層層保護，因此肺挫傷在初期症狀通常不明顯。"},"answer":"A,C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2313,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於腹部創傷之描述下列何者為是？ (多選)","options":{"A":"小腸損傷初期症狀為腹部疼痛，但沒有腹膜炎徵候無法排除小腸損傷。","B":"胰臟損傷在電腦斷層上仍不易評估，藉由澱粉酶的指數評估較準確。","C":"脾臟為腹部鈍挫傷最常見的臟器損傷，60%傷患會有Kehr’s徵候。","D":"前胸傷害若非第9~12肋間，不需考慮腹部臟器損傷。"},"answer":"A,C","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":2314,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"34歲男性，騎機車車禍，到達現場時傷患初評外觀無明顯可見出血，病人可講話，呼吸淺快，四肢蒼白濕冷，且左腰側瘀青有壓痛情形，輔助檢查血壓70/40mmHg，心跳每分鐘130下，請問下列何者為是？","options":{"A":"傷患可能後腹腔出血，包含腹主動脈、第一部分之十二指腸、腎臟和胰臟的損傷。","B":"此時給予超音波e-FAST檢查，無法很準確的檢查是否有後腹腔出血。","C":"若患者脾臟撕裂傷出血，則一定可以利用超音波在脾腎交界看到黑色的積液。","D":"超音波骨盆的掃描僅需橫向掃描即可容易判斷有無出血。"},"answer":"B","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":2315,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列有關骨骼肌肉的創傷描述何者為是？","options":{"A":"鎖骨骨折常因肩部挫傷所致，所以80%的鎖骨骨折發生在外側三分之一處。","B":"打鬥造成之拳擊者骨折是因直接撞擊導致，所以最常見的為較長的第三掌骨骨折。","C":"髖關節脫臼中常見為後位脫臼，會導致患肢長度縮短及髖關節外轉。","D":"膝關節創傷常見膕動脈損傷，尤其容易發生在膝關節後脫臼的傷患上。"},"answer":"D","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":2316,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"自小客車自撞安全島引發引擎起火，當您將傷患脫困後發現其痰液中有炭粒，眉毛、鼻毛有燒焦情形，軀幹有大面積的二度燒傷。以下評估何者為是？","options":{"A":"聲門以上吸入性灼傷為吸入過熱的氣體時所造成，有喘鳴聲(stridor)時，應放置LMA。","B":"聲門以下吸入性灼傷多是傷患吸入火場微細煙塵或有毒物質所導致，症狀通常又快又急。","C":"若病人血中一氧化碳濃度高達10％~20％時，通常就會出現昏迷的症狀。","D":"為防止休克及休克處理，應盡速給予靜脈注射及輸液。"},"answer":"D","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":2317,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"一名台電工人，於維修地面高壓電變電箱時突然觸電倒地，目擊者說她看到火花後，傷患四肢抽搐約2分鐘，然後一動也不動地躺在地面。此時你將進行傷患評估及處置，何者為是？","options":{"A":"聯繫相關專業人員切斷電源或就地取材尋找樹枝(木頭)將傷患移至安全區域。","B":"皮膚接觸處可能會有牛眼形狀傷口，電流出口處潰爛、爆炸翻出傷口、局部組織缺損。","C":"早期輸液補充應以葡萄糖液為主，可預防低血容量和後繼相關的腎衰竭，並避免低血糖。","D":"神經組織為較佳的電流導體，所以受到電損傷影響通常較低，受傷後復原的速度也較快。"},"answer":"B","manualChapter":"非創傷"},{"id":2318,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"在KTV火警救護案件中，你迅速評估一位病人：全身滿佈煙灰，僅有臉部與頸前頸後處有燒傷，呼吸深快並伴有咳出碳粒痰。目前呼吸次數30下/min，血氧95%，HR：106/min，BP：140/80mmHg，下列評估何者為是？","options":{"A":"吸入性灼傷判斷很重要，特別是一氧化碳中毒時要利用血氧機(oximeter)加以確認。","B":"有吸入性灼傷或呼吸道腫脹時，可在地方醫療指導授權下考慮給予氣管插管。","C":"若無發現其它燒傷處，依灼傷嚴重度區分此病人為中度灼傷。","D":"若有環狀灼傷會出現止血帶效應，但在此病人應該不會發生。"},"answer":"B","manualChapter":"CH31","matchedChapters":["CH31"]},{"id":2319,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"請問C.A.T.戰術止血帶正確的順序為何？(1)將束帶透過扣環拉緊，旋桿朝肢體外側。(2)將旋桿旋緊至出血減緩且遠端脈搏摸不到。(3)註記時間之固定帶貼緊固定槽，於固定帶上並記錄時間。(4)將創傷用止血帶放在接近肢體出血處的近心端，距離傷口約5~8公分。","options":{"A":"(4)→(2)→(1)→(3)。","B":"(4)→(1)→(3)→(2)。","C":"(2)→(1)→(4)→(3)。","D":"(4)→(1)→(2)→(3)。"},"answer":"D","manualChapter":"CH26"},{"id":2320,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於止血方式的描述，下列何者為是？","options":{"A":"直接加壓止血的效果，不如傳統的止血點止血法來得有效。","B":"加壓式包紮是於出血點上方加厚敷料以達到局部加壓，纏越寬止血效果越好。","C":"止血敷料直接於出血處加壓也很有效，現代止血敷料使用幾乎不需要太多額外的訓練。","D":"止血帶應該作為最後一線的止血手段，且每30分鐘要鬆開，組織才不易壞死。"},"answer":"C","manualChapter":"CH26"},{"id":2321,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"35歲男性因騎機車與汽車擦撞，患者外觀無明顯大出血，能說話，但意識混亂E4V3M5，頭頸部無傷口及疼痛情形。胸腹部大面積瘀傷，右上腹處疼痛，輔助檢查評估心率124下/分鐘，血壓110/82mmHg，血氧值為92%，呼吸次數24下/分鐘。若以出血性休克評估最可能為第幾期？","options":{"A":"第一期(出血量<15%)。","B":"第二期(出血量15~30%)。","C":"第三期(出血量31-40%)。","D":"第四期(出血量>40%)。"},"answer":"C","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":2322,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"中年男性車禍被送到醫院時診斷為右側張力性氣胸，經細針減壓以及右側胸管置入後，生命徵象都獲得改善。五分鐘後，該患者突然又再度呼吸困難、血壓下降。下列敘述何者最為適當？","options":{"A":"因生命徵象不穩定，應重新進行初級評估。","B":"再次進行細針減壓最適當位置是右腋中線第五肋間。","C":"先安排電腦斷層確定是否有其他內出血。","D":"可能胸管功能不佳，應再插上第二根胸管強化引流效果。"},"answer":"A","manualChapter":"CH28"},{"id":2323,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"50歲男性騎摩托車自摔未戴安全帽，頭部外傷現場意識清楚，但在救護車上突然意識變化。意識E2V1M5，血壓180/90mmHg，心跳每分鐘55下，呼吸速率每分鐘10次，血氧89%，理學檢查：瞳孔不等大(左2/右5)，氣管無偏移，呼吸音正常。以下敘述何者為非？","options":{"A":"病患一開始表現為清明期，有可能是硬腦膜上出血的表現。","B":"顱內出血造成腦壓上升，會引發收縮壓升高與脈搏變慢。","C":"血壓太高會加重顱內出血，需控制收縮壓80~90mmHg。","D":"血氧不佳需給氧氣治療，同時意識不佳需維持呼吸道暢通。"},"answer":"C","manualChapter":"創傷"},{"id":2324,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"使用NEXUS Low Risk Criteria來評估是否有頸椎受傷，下列相關敘述何者正確？","options":{"A":"E：Extension向前伸頸時、頸部不會覺得疼痛。","B":"X：eXtreme distracting injury無其它劇痛的傷勢。","C":"U：Up向上提頸時、頸部不會覺得疼痛。","D":"S：Sense病人顏面與四肢感覺皆正常。"},"answer":"B","manualChapter":"CH27"},{"id":2325,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"到院前懷疑傷患為張力性氣胸，欲進行針剌減壓的三個要件，不包括？","options":{"A":"意識不清到對疼痛無反應。","B":"嚴重呼吸窘迫或通氣困難。","C":"患側呼吸音變小或聽不到。","D":"病人收縮壓小於90mmHg。"},"answer":"A","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2326,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"創傷出血性死亡的三兄弟(hemorrhagic trauma triad of death)，何者正確？","options":{"A":"低血鈣、低血氧、高腦壓。","B":"低血氧、酸血症、凝血異常。","C":"低血鈣、低體溫、高腦壓。","D":"低體溫、酸血症、凝血異常。"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2327,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"慢性阻塞性肺病包含肺氣腫與慢性支氣管炎；下列有關兩者的敘述，何者不正確？","options":{"A":"肺氣腫的病患，外表瘦、胸廓拉長、會有桶狀胸。","B":"慢性支氣管炎的病患，會呈現慢性發紺。","C":"肺氣腫的病患，咳嗽通常無痰，為乾咳。","D":"慢性支氣管炎的病患，較常出現噘嘴呼吸。"},"answer":"D","manualChapter":"CH35"},{"id":2328,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"家屬報案，50歲男性癲癇持續發作，過去有創傷性腦傷與癲癇的病史；您到達現場，發現病患倒臥在客廳地上，意識不清，膚色發紺，持續抽搐中，最優先的處置為？","options":{"A":"測量血氧，使用BVM給氧。","B":"確認意識，施打Midazolam。","C":"給予口咽呼吸道，保護頸椎。","D":"打開呼吸道，確認脈搏。"},"answer":"D","manualChapter":"非創傷"},{"id":2329,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"45歲女性長期抽菸喝酒病史，凌晨突發急性上腹痛，下列敘述何者正確？","options":{"A":"急性肝炎常以急性上腹痛做為表現。","B":"從疼痛位置來考慮的話，不會是闌尾炎的表現。","C":"有可能是膽結石，東方人膽結石以色素結石為主。","D":"如為十二指腸潰瘍，通常進食會刺激胃酸分泌，導致症狀加重。"},"answer":"C","manualChapter":"CH38","explanation":"急性闌尾炎在早期病程中，因內臟神經傳導（內臟痛）常表現為上腹部（心窩處）或肚臍周圍的隱痛/悶痛，數小時後發炎擴散至壁層腹膜，才會轉移並局限於右下腹（麥氏點，McBurney's point）。因此，急性上腹痛不能排除闌尾炎的可能。\n\n急性肝炎大多以全身倦怠、食慾不振、噁心、茶色尿、黃疸等為主要表現，腹部若有不適多為右上腹隱痛或脹痛，極少以突發性急性劇烈上腹痛作為首要表現。"},{"id":2330,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"一位50歲女性為右側乳癌病人做過乳房及淋巴切除，三天前剛做完化療出院。家屬表示今日開始發燒昏迷。現場的評估與處置，下列敘述何者為非？","options":{"A":"若量到她血壓偏低，可選擇在右上肢建立大管徑的靜脈途徑以補充輸液。","B":"雖然發燒可能讓病人意識不清，但仍須排除低血糖或嗎啡過量的問題。","C":"骨頭轉移好發於乳癌病人，因此須詢問病人的腫瘤分期與治療的近況。","D":"病人的發燒可能與化療後的白血球低下有關，打針處置時須更加小心無菌措施。"},"answer":"A","manualChapter":"CH39"},{"id":2331,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"44歲男性農夫，自述開始工作20分鐘後呼吸困難。你到達現場後發現病人意識清楚，生命徵象如下：體溫36.8°C，心跳110/分鐘，呼吸24次/分鐘，血壓80/50 mmHg。關於接下來的處置與評估，下列何者為非？ (選「即使沒有看到皮膚紅疹也可以考慮給予腎上腺素肌肉注射治療。」也給分)","options":{"A":"需詢問病人是否有氣喘、心臟疾病等慢性病史以列入鑑別診斷。","B":"即使沒有看到皮膚紅疹也可以考慮給予腎上腺素肌肉注射治療。","C":"病人可能合併有嚴重的腹絞痛、噁心或嘔吐等腸胃道症狀。","D":"若病人有明顯黏膜與眼皮水腫，則不適合給予靜脈輸液注射。"},"answer":"D","manualChapter":"非創傷"},{"id":2332,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"無明顯外傷OHCA病人成功氣管內管插管並接上EtCO2偵測器後，你維持6秒鐘給一次通氣，每次通氣得到的穩定EtCO2數值約在50~60 mmHg之間，根據這項數值，最正確的作法是？","options":{"A":"通氣仍維持6秒鐘一次，每次不特別增加換氣量，維持與急救指引一致。","B":"改為3~4秒鐘通氣一次，且增加每次擠入的潮氣量，才能將病人體內的CO2帶出來。","C":"由於數值明顯高於40 mmHg，表示ROSC應該立即停止CPR，只要給予通氣就好。","D":"這是單側插管的現象，可以每循環外拔一公分後持續監測，直到降到40 mmHg以下。"},"answer":"A","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":2333,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"67歲男性過去有下背痛及眩暈病史，今天他突然覺得嚴重下背痛，求助於119，身體檢查發現病人臉色蒼白，盜汗，體溫36.7°C，脈搏130次/分鐘，血壓80/50 mmHg，最有可能的診斷為何？","options":{"A":"急性心肌梗塞。","B":"乙狀結腸憩室破裂。","C":"腎結石。","D":"腹主動脈瘤破裂。"},"answer":"D","manualChapter":"非創傷","explanation":"臨床上突發嚴重下背痛/腹痛 + 低血壓/休克徵象（＋/－ 搏動性腹部腫塊），為腹主動脈瘤破裂的典型三聯徵（Classic Triad）。這屬於到院前與急診極度危急、需立即啟動大量輸血與緊急血管介入/手術修補的急症。\n\n腎結石可能引起劇烈腰背痛並伴隨轉移痛，疼痛發作時多因交感神經興奮而呈現血壓偏高、心跳快，本身不會直接引起嚴重的低血壓休克（除非合併嚴重的阻塞性尿路感染導致敗血性休克，但病患體溫 36.7°C 且為急性突發，不符此臨床進程）。"},{"id":2334,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關主動脈剝離（aortic dissection）之陳述，下列何者為非？","options":{"A":"可能造成心肌梗塞，急性心包膜填塞或主動脈破裂。","B":"所有主動脈剝離皆應早期施行外科手術治療。","C":"電腦斷層攝影有相當高的診斷率。","D":"血壓過高建議使用交感神經乙型阻斷劑控制血壓。"},"answer":"B","manualChapter":"CH34"},{"id":2335,"source":"111年度EMTP筆試-題目卷(100題)(含答案)112
