0113公告","question":"依據2020年ACLS成人心臟停止急救流程，以下何者為非？","options":{"A":"不可電擊心律之成人心臟停止應儘速給與腎上線素。","B":"可電擊心律去顫，若使用雙相電擊器，依據製造商建議劑量。","C":"成人心臟停止流程在VF，第三次電擊後給予藥物可以為Lidocaine 1-1.5mg/kg。","D":"當去顫器抵達後，需等五個循環CPR後才可分析心律。"},"answer":"D","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":2336,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於泌尿生殖系統急症之描述，下列何者為是？","options":{"A":"會陰部壞死性筋膜炎為嚴重的皮膚及軟組織感染，僅需以抗生素治療不用手術治療。","B":"嵌頓性疝氣會因掉入陰囊內之腸子血液循環不佳而導致缺血性疼痛，但不會有腹脹、嘔吐及食慾不振等症狀。","C":"睪丸扭轉常會造成突發性劇痛，但外觀不會有明顯的紅腫現象，須儘早手術治療。","D":"急性副睪炎病人，若用手輕輕往上抬起疼痛側之睪丸，仍不能緩解疼痛感。"},"answer":"C","manualChapter":"CH41","matchedChapters":["CH41"]},{"id":2337,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"65歲男性過去病史為肺癌接受治療中，主訴右側胸痛及呼吸急促，身體檢查發現病人臉部及頸部水腫、頸靜脈怒張及胸壁靜脈擴張，關於此病人之診斷及處置何者為是？","options":{"A":"為肺癌導致之續發性張力性氣胸，須給予針刺減壓。","B":"為腫瘤治療過程中導致之腫瘤溶解症候群，須給予適當輸液補充及矯正電解質。","C":"為腫瘤影響到心包膜導致之心包膜填塞，須給予心包膜穿刺術處置。","D":"為腫瘤造成之上腔靜脈症候群，應抬高頭部及上肢並給氧。"},"answer":"D","manualChapter":"CH39","matchedChapters":["CH39"]},{"id":2338,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"50歲男性十分鐘前開始胸悶及冒冷汗，到院前12導程心電圖如下，請問下列何者為是？","options":{"A":"為下壁心肌梗塞，應立即聯絡可行心導管之醫院。","B":"若無禁忌，應立即給予口服Aspirin 100mg。","C":"至急診應確認心肌酵素指數升高後才施行再灌流治療。","D":"到院後，應儘快執行心導管(PCI)於90分鐘內打通血管。"},"answer":"D","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/2338.png"},{"id":2339,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"以下何種理學檢查無法協助判斷病人是否適合給予大量輸液？","options":{"A":"頸靜脈是否怒張。","B":"病人是否呈現端坐呼吸。","C":"聽診兩側肺部是否呈現濕囉音。","D":"呼吸是否呈現Kussmaul式呼吸。"},"answer":"D","manualChapter":"CH20"},{"id":2340,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"使用傳統式水銀血壓計時，何種情況所對應到的血壓值代表舒張壓？","options":{"A":"壓脈帶壓力升高且雜音消失時。","B":"壓脈帶壓力升高且雜音出現時。","C":"壓脈帶壓力下降且雜音消失時。","D":"壓脈帶壓力下降且雜音出現時。"},"answer":"C","manualChapter":"CH51","matchedChapters":["CH51"]},{"id":2341,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於休克的敘述，下列何者正確？","options":{"A":"心包膜填塞屬於心因性休克(Cardiogenic shock)。","B":"張力性氣胸屬於再分佈性休克(Redistributive shock)。","C":"休克定義雖然為組織灌流不足，但四肢不一定呈現冰冷。","D":"休克代表組織灌流不足，心跳會變快，只有神經性休克會以緩脈表現。"},"answer":"C","manualChapter":"CH26"},{"id":2342,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"70歲女性早上05：00起床時發現右側無力，你是到場的EMT，關於此病人的處置，下列何者最為適當？","options":{"A":"病患發作時間明確，建議轉送至最近可施打血栓溶解劑的醫院。","B":"病患符合r-tPA施打條件，應該在08：00前施打完成。","C":"如過去病史有曾經服用抗凝血劑，就不建議施打r-tPA。","D":"即使只是事先通報醫院，也可以提升病人接受r-tPA施打的機率。"},"answer":"D","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":2343,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"根據2020 ACLS指引，下列何種情形最不需要及早心導管介入治療？","options":{"A":"90歲男性主訴胸痛，心電圖顯示II、III、aVF出現ST段上升。","B":"38歲女性長期使用口服避孕藥，運動後猝死，經急救後恢復自發性循環，心電圖顯示S1Q3T3。","C":"70歲男性冠心病史，到院前心跳停止，電擊兩次後恢復自發性循環，心電圖無ST段上升。","D":"45歲男性主訴胸痛，至急診就診後，診斷為非ST段上升心肌梗塞，在急診待床時，出現急性肺水腫、心室頻脈。"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":2344,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於內分泌系統的敘述，下列何者正確？","options":{"A":"黏液性水腫(myxedema)是一種甲狀腺能亢進的疾病。","B":"胰臟僅具有內分泌而沒有外分泌的功能。","C":"糖尿病酮酸血症（DKA）的治療目標是讓血糖恢復正常數值。","D":"高滲透高血糖非酮酸症候群（HHNS）比糖尿病酮酸血症（DKA）容易產生昏迷。"},"answer":"D","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":2345,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於顏面神經的敘述，下列何者正確？","options":{"A":"顏面神經可分為上、中、下三支。","B":"周邊性顏面神經麻痺可能合併舌頭後三分之一的味覺喪失。","C":"貝爾氏麻痺（Bell’s palsy）如未治療，大部份會造成永久性眼歪嘴斜之後遺症。","D":"中樞性的顏面神經麻痺，僅對側臉下半部麻痺，無法做露齒、吹口哨、鼓氣等動作，但仍可以皺前額、皺眉頭、閉眼。"},"answer":"D","matchedChapters":["CH36"],"manualChapter":"CH36"},{"id":2346,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"溺水事件救護，病患從上游高山清澈溪水中搜救出後交到你的手上；目測約為一名20歲男性，溺水時間初估為10分鐘，當地水溫預估8度C，初步評估發現病人意識不清(GCS=3)，體溫31度，全身濕冷蒼白，血壓血氧仍在量測當中。請問關於此起溺水救護，以下描述何者正確？","options":{"A":"此年紀男性發生溺水事件，意識不清應為低體溫、溺水缺氧造成，不需考量其他因素。","B":"溺斃者常產生嚴重的喉部呼吸道痙攣，因此幾乎沒有或很少液體吸入肺中，約佔15%。","C":"除了積極回溫之外，低體溫病人脈搏不易偵測，應延長評估脈搏時間跟增加藥物使用量。","D":"水源清澈、時間不長以及年輕病人是預後較佳因素，但水溫過低則會導致死亡率上升。"},"answer":"B","manualChapter":"CH44"},{"id":2347,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"當你今天出勤一個山區墜落山崖開放性骨折的病人時，你應該要考量許多重要且不同於城市中的特別考量，請問以下何者並不屬於其中？","options":{"A":"我採用長背板以及止血帶搬運對此病患的好處是什麼？可能面臨的危害是什麼？","B":"今天的天氣是雷雨天，我在運送此病患最適合他的照護是什麼？需要避免失溫？","C":"此骨折是否應該要先進行適當固定、復位後再搬運，避免將來可能發生的殘疾？","D":"若選用直升機吊掛的方式，病人是否有足夠的金錢來負擔費用，國家是否給付？"},"answer":"D","manualChapter":"CH56","matchedChapters":["CH56"]},{"id":2348,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"76歲女性於凌晨三點通報胡言亂語、精神異常，請你至現場進行相關救護。你抵達現場後，病人表示聽到佛祖在跟她說話，說話顛三倒四，缺乏現實感；家屬表示病人過去病史為高血壓及糖尿病，並精神科相關病史，昨天睡覺前對答也都很正常。現場量測生命徵象為E4V5M6、體溫37.6度、心跳每分鐘110下、呼吸每分鐘24下、血壓130/100 mmHg。請問關於此病人的相關敘述何者最適當？","options":{"A":"有明顯聽幻覺應為思覺失調症發作，需送往精神科醫師值班之醫院。","B":"年齡和性別都是思覺失調症高盛行率族群，應詢問有無相關家族史。","C":"雖然GCS滿分，但意識混亂，根據過去病史，仍應先進行血糖量測。","D":"心跳較快應與情緒激動、胡言亂語有關，需要現場施作心電圖。"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2349,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"請問關於下列四位自殺病人的風險評估，何者錯誤？","options":{"A":"22歲跟男友分手後賭氣服安眠藥自殺的女性病人，其自殺高風險因素為單身。","B":"70歲退休獨居男性於家中上吊自殺，其自殺高風險因素包含老年退休男性。","C":"33歲憂鬱症女性合併酒精成癮在家燒炭，其高風險因素包含物質濫用及精神疾病。","D":"35歲無過去病史、家庭支持良好、事業有成男性作勢跳樓，並無明顯高風險因素。"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2350,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列何者不是老年人心臟衰竭常見的症狀和徵候？","options":{"A":"疲勞。","B":"夜尿。","C":"皮膚搔癢、傷口癒和緩慢。","D":"食慾不振、肝腫大、腹水。"},"answer":"C","manualChapter":"CH47"},{"id":2351,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列有關於新生兒使用腎上腺素，何者為非？","options":{"A":"新生兒急救很少使用到急救藥物。","B":"不論何種途徑均稀釋10倍後才可使用。","C":"若有需要，可在3～5分鐘重覆給予相同劑量。","D":"經臍靜脈給予腎上腺素是最快速且方便的途徑。"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":2352,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列有關產婦羊水栓塞之敘述，何者為非？","options":{"A":"常見症狀為突然的缺氧、低血壓、休克及凝血功能障礙。","B":"可能為羊水雜質經子宮頸靜脈進入母體肺部血管造成。","C":"胎兒娩出後，就不可能發生產婦羊水栓塞。","D":"最好犯於多胞胎產婦第一產程。"},"answer":"C","manualChapter":"CH48"},{"id":2353,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列有關臺灣毒蛇之敘述，何者為非？","options":{"A":"台灣目前的抗蛇毒血清共有四種。","B":"最容易造成急性腎臟衰竭為鎖鍊蛇。","C":"眼鏡蛇的毒牙為管牙。","D":"被眼鏡蛇咬傷後，局部傷口易造成組織腫脹、腐爛，有些甚至會進展壞死性筋膜炎。"},"answer":"C","manualChapter":"CH50"},{"id":2354,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"指揮中心通報一名40歲孕婦生產後大量出血，EMT的現場處置何者最正確？","options":{"A":"將手深入產道中，進行加壓止血。","B":"按摩子宮底促進陰道收縮，減少出血。","C":"避免會陰部檢查，並給予大量靜脈輸液維持灌流。","D":"讓胎兒吸吮母親乳頭，促使乳腺分泌子宮收縮素，幫助止血。"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2355,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"王先生聽信民間偏方，服用了大量的大花曼陀羅治療氣喘，發生中毒，下列敘述何者為非？","options":{"A":"臨床徵候包括心搏過速、瞳孔擴大。","B":"全身皮膚潮濕，口水、淚液分泌增多。","C":"以呼吸道、通氣及循環的支持性療法為主。","D":"症狀嚴重，有解毒劑physostigmine可注射使用。"},"answer":"B","manualChapter":"CH50"},{"id":2356,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"哮吼(Croup)的常見症狀，何者為非？ (多選)","options":{"A":"犬吠咳嗽聲(Barking cough)。","B":"呼吸出現喘鳴音(Stridor)。","C":"說話聲音沙啞(Hoarseness)。","D":"呼吸出現喘鳴音(Wheezing)。"},"answer":"D,B","manualChapter":"CH35"},{"id":2357,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"45歲潛水教練於工作中發生溺水意外，當你抵達現場病人已經直接升至水面，意識不清且呼吸淺快；據同事表示此次使用氣瓶為氮氧混和氣且下潛深度較過往深，事件發生前病患已連續工作多日，曾表示有些胸悶不適、關節疼痛等症狀，有關這位病人的可能臆斷何者最不適當？","options":{"A":"氮醉(nitrogen narcosis)是造成病人意識不清的可能臆斷。","B":"若肺音聽起來對稱且正常，可以排除空氣栓塞(air embolism)。","C":"下水前就有症狀，減壓病(decompression sickness)惡化是可能臆斷","D":"低體溫造成的心室心律不整也是可能的臆斷。"},"answer":"B","manualChapter":"CH44"},{"id":2358,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"你參與旅行團前往玉山攻頂，在排雲山莊睡到凌晨時，發現室友嚴重失眠並且抱怨自己頭痛難耐，吃了止痛藥也沒有效果，你懷疑他高山症(Acute Mountain Sickness)發作；連忙跟導遊反應，決定透過無線電與山下支援醫院求助。下列的描述，何者最不適當？ (多選)","options":{"A":"以無線電回報時，應一併報告有無呼吸道症狀、感覺疲憊/虛弱或頭暈 /頭重腳輕等症狀，以利支援後線判斷高山症的嚴重程度。","B":"病人表示登山前有吃丹木斯(Acetazolamide)，也有攜帶上山，這個藥也可用來當作治療建議病人服用。","C":"病人出現呼吸困難、咳嗽帶粉紅色泡泡，此時應立即摸黑下山不該再等。","D":"在下山途中病人開始步態不穩、意識不清，此時應給予氧氣治療，並選擇有加壓艙的醫院。"},"answer":"A,C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2359,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列關於低體溫病人救護的相關敘述，何者最不適當？","options":{"A":"心律監測器可能會發現無脈搏性電氣活動(PEA)，也可能發現如駱駝峰突起的Osborn波。","B":"應輕柔地處置病人，輕微的動作都可能誘發病人發生心室纖維顫動(Vf)等致命性的心律不整。","C":"在中心體溫未接近正常體溫時，我們不該假設病人已經死亡，應該持續積極回溫並持續治療。","D":"積極施救及回溫下病人常會有不錯的預後，中斷壓胸評估脈搏不該超過10秒。"},"answer":"D","manualChapter":"CH44"},{"id":2360,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列有關COVID - 19（Coronavirus Disease - 2019）新冠病毒的描述何者最為適當？","options":{"A":"症狀以腸胃道為主，症狀包括食慾不振、噁心嘔吐、腹瀉等症狀。","B":"可能的傳播途途徑為糞口傳染，故感染者的排泄物需謹慎處理。","C":"為預防感染，應避免前往人潮擁擠、空氣不流通的地方、維持手部衛生及佩戴口罩。","D":"載送疑似病患時，個人防護裝備的等級越高越好，不需要考慮其他因素。"},"answer":"C","matchedChapters":["CH43"],"manualChapter":"CH43"},{"id":2361,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"美國Pediatric Education for Paramedics (PEP)課程發展出的兒童評估三角(Pediatric Assessment Triangle，PAT)為兒童急救教育的核心，請問下列何者不屬於評估的內容？","options":{"A":"昏迷指數。","B":"膚色循環。","C":"肌肉張力。","D":"呼吸作功。"},"answer":"A","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":2362,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"當你在轉送一名6歲主訴胸悶的病童至醫院的路上，生理監測器上發現病童突然心跳加快、呼吸急促，關於下列相關治療的敘述何者最為適當？","options":{"A":"當病童尚為有脈的心室頻脈(VT)時，應採用同步整流的劑量為2 J/kg。","B":"當你判斷此病童心律為心室上頻脈(PSVT)時，不得進行迷走神經刺激術。","C":"當病童已進展至致命性的心室顫動(VF)時，首次的電擊劑量為2 J/kg。","D":"當第一次電擊無法成功結束心室顫動，需要再次嘗試的電擊劑量為3 J/kg。"},"answer":"C","manualChapter":"CH48"},{"id":2363,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於三級檢傷，下列敘述何者為非？","options":{"A":"在現場進行的檢傷分類稱為現場檢傷(field triage)，也有人稱為初級檢傷(primary triage)。","B":"初級檢傷，口訣BASIC，也就是B (Bleeding，控制出血)，A(Airway，呼吸道)，S (Shock，預防休克)，I(Ice packing，冰敷)，C(Classification，分類)。","C":"SAVE檢傷法是目前較為人所知的次級檢傷方式。","D":"傷病患後送到醫療院所之後，在醫院內進行的檢傷稱為三級檢傷(tertiary triage)。"},"answer":"B","manualChapter":"CH52"},{"id":2364,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關輻射傷害的現場救護敘述，何者錯誤？","options":{"A":"照護輻射污染的傷患，適當防護下，對救護人員、設備和設施不會有嚴重危害。","B":"有生命危險的輻射污染傷患，仍應先除汙再進行醫療急救處置，以免污染救護人員。","C":"有生命危險的傷患，應儘速後送至最近或最快可處理之醫院，而不限於核災急救責任醫院。","D":"以輻射偵檢器檢測非有生命危險病患身上是否仍有輻射殘留，如果傷患污染區域之輻射劑量在背景值的2~3倍以上，則繼續上述清洗除污步驟。"},"answer":"B","manualChapter":"CH53"},{"id":2365,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列有關危害物質對健康的影響，何者最正確？","options":{"A":"有機磷殺蟲劑會造成神經系統作用失常，造成意識障礙或痙攣，或是導致呼吸及循環系統不穩，甚至於心肺衰竭而致命。","B":"氰化物會使血液無法攜帶氧氣至組織中而造成窒息。","C":"所有毒化災物質的病患皆可以用清水除汙。","D":"毒化物進入人體可能經由呼吸、口服、注射等方式，但不會經皮膚吸收。"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":2366,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於大型運動緊急醫療救護的敘述，下列何者錯誤？","options":{"A":"參賽對象的年齡層與特性關係到該運動賽事常見傷害的發生率，以及醫療救護團隊所該準備的器材與耗材數量。","B":"支援大型運動緊急醫療救護需了解運動賽事的比賽規則及醫護規則。","C":"多數項目需要經裁判許可或指示，才能進行傷害處理，只有少部分項目不須等候裁判指示，就可以進入比賽場地進行傷害處理。","D":"運動選手是場館醫療服務工作必須服務的對象。現場運動團隊的隊職員、裁判、場地工作人員則須自行就醫，緊急時則打119求助。"},"answer":"D","manualChapter":"CH55"},{"id":2367,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"感染發生的過程稱為『感染鏈』(chain of infection)，其中包含六個條件，下列敘述何者為非？","options":{"A":"感染源(infectious agent)為其中條件之一。","B":"傳染途徑(modes of transmission)為感染鏈的六種條件中最難防範與打斷者。","C":"傳染窩(reservoir)指感染源賴以生存和繁殖，並可逸出使得易感宿主遭受感染的處所。","D":"易感宿主(susceptible hosts)指能被感染源感染的人或動物。"},"answer":"B","manualChapter":"CH43","matchedChapters":["CH43"],"explanation":"感染源進入人體並感染人體的過程，為感染鏈的六種條件中最容易打斷者"},{"id":2368,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"有關生物戰劑的敘述，何者為是？","options":{"A":"生物戰劑可能造成大量傷亡，但也有其限制，如很難進行有效率的傳播。","B":"依造成疾病的嚴重程度或死亡率分成A、B、C、D四類。","C":"炭疽病(Anthrax)，黃熱病(Yellow fever)，及天花(Smallpox)皆屬於A類生物戰劑。","D":"生物戰劑所需費用製程複雜，相較其他種類武器要昂貴許多。"},"answer":"A","manualChapter":"CH43"},{"id":2369,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"某中學宿舍約20%的學生今天發病，他們有發燒，倦怠和淋巴結腫大等症狀。校護告訴119派遣員說三天前有一學生在宿舍自助餐廳噴撒不明液體。你第一時間被派遣到現場，有關下列防護衣穿著，何者最為恰當？","options":{"A":"在宿舍自助餐廳的清掃阿姨應著等級D防護衣。","B":"救護技術員當處理未知濃度的未知化學物質，應著等級D防護衣。","C":"校護因第一線接觸學生，建議著等級C以上防護衣。","D":"後送至醫院端，醫院相關人員應著等級A防護衣。"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2370,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"地震及颱風為台灣常見天然災害，常常造成緊急醫療救護的衝擊及人員的傷亡。有關常見天然災害敘述，何者為是？","options":{"A":"天然災害造成的大量死亡，若遺體沒有清理，雖然造成臭味，但並不是疾病的來源。","B":"依照現行災防體系，水災的主管機關為內政部。","C":"地震所發生的災害以外傷為主，其他非創傷的病患較地震前差不多。","D":"搜救黃金時間72小時，表示超過72小時救出的傷患存活率大幅降低，應考慮停止救援。"},"answer":"A","manualChapter":"CH56","matchedChapters":["CH56"]},{"id":2371,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"離島常因設備或專長無法提供治療，需要空中救護的協助，保障病患生命的安全。下列病人何者不符合現行空中轉診適應症？","options":{"A":"病人因急性胸痛，經超音波診斷為主動脈剝離。","B":"病人診斷為自發性腦出血，昏迷指數9分。","C":"傷患工作時遭砂輪機截斷右手食指。","D":"自然產後，產後大出血的產婦。"},"answer":"C","manualChapter":"CH58"},{"id":2372,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"救護直升機執行空中緊急救護或空中轉診時，除駕駛員外，至少應有一名空中救護人員隨機執行救護。前項空中救護人員，下列何者可以擔任？","options":{"A":"呼吸治療師。","B":"實習醫學生。","C":"初級救護技術員。","D":"65歲即將退休的醫師。"},"answer":"D","manualChapter":"CH58"},{"id":2373,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"研究是緊急醫療系統一個重要的活動，因為研究可以幫助緊急醫療系統不停向前演進。而研究的實施有5種標準的方法，請問下列對於研究方法的敘述，何者為非？","options":{"A":"描述型(descriptive)方法：又叫觀察型(observational)方法。僅是觀察分析事件的發生和結果，而沒有嘗試去操弄或改變事件的結果。","B":"實驗型(experimental)方法：在研究中導入某種介入措施，然後觀察此種介入措施的效果。","C":"前瞻性(prospective)方法：在研究開始前，特定的問題、假設、和資料收集的方式早就被定義好。","D":"回溯性(retrospective)方法：研究在一個特定時間點或一段很短時期內的一群人。"},"answer":"D","manualChapter":"CH11"},{"id":2374,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"研究的方法有很多種，問卷調查也是一種收集病人資料的重要方式，試問以下設計問卷的基本流程何者正確？(1)問卷的測試(2)確定研究問題和目標族群(3)向度(dimension)和議題(issue)的產生與選擇(4)議題的實體化","options":{"A":"(3)→(2)→(4)→(1)","B":"(2)→(1)→(3)→(4)","C":"(2)→(3)→(4)→(1)","D":"(3)→(2)→(4)→(1)"},"answer":"C","manualChapter":"CH11","matchedChapters":["CH11"]},{"id":2375,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"下列何者不是「事故指揮系統ICS」之核心價值？","options":{"A":"共通詞彙：使用標準化詞彙，在跨部會應變通訊時，避免誤解。","B":"模組化：採由上而下的設計，根據事故種類跟發展，可將基本架構擴編或者縮編，具有彈性。","C":"指揮：事故一開始就必須建立明確的指揮系統，並且隨事故發展轉移指揮權。","D":"發言：根據事故指揮官指示，設定發言人，提供正確且正式的新聞。"},"answer":"D","manualChapter":"CH52"},{"id":2376,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於安全官的任務，下列何者最不適當？","options":{"A":"審核應變行動計畫的安全議題。","B":"緊急制止危險的應變行動。","C":"參與計畫會議。","D":"評估現場狀況。"},"answer":"D","manualChapter":"CH52"},{"id":2377,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"高級救護技術員要能夠勝任救護訓練的指導者需要一些教育理論與教學方法的基礎與培育，而課程設計有許多架構與模式，了解課程設計的架構與模式能讓臨床教師在設計課程時掌握邏輯性並容易勾勒出課程的整體輪廓。以下對於課程設計模式的敘述何者為非？","options":{"A":"歷程模式(process model)：強調教育方式與教學過程，而非教育的目標內容，重視學習者的主動學習以及教師的專業思考。","B":"情境模式(situation model)：又稱「文化分析模式」，與當代社會文化分析密不可分，主張從文化選擇的角度來詮釋課程，情境模式強調課程的目標是在傳授學生文化中最重要的部分。","C":"試誤模式(try and error model)：指在學習過程中，最初總是要經歷一些錯誤的嘗試動作，以後隨著動作的不斷反覆，錯誤的動作逐漸減少，成功動作逐漸增多，最後完全獲得成功。","D":"目標模式(objective model)：由學者泰勒(Tyler)提出，最核心的概念就是課程設計需要有明確一致的教育目標。"},"answer":"C","manualChapter":"CH60"},{"id":2378,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"高級救護技術員的初訓課程，是屬於哪一種的醫療指導模式？","options":{"A":"前瞻性。","B":"培育性。","C":"即時性。","D":"任務性。"},"answer":"A","manualChapter":"CH02"},{"id":2379,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"救護技術員對於確定罹患新冠肺炎(COVID - 19)的病人救護時，因擔心自身受到感染而未進行必要之急救，在法律的觀點上，何者正確？","options":{"A":"家屬可以主張救護技術員未依法行政而提出告訴。","B":"家屬若要提出民事告訴，其時效為六個月。","C":"救護技術員符合因正當防衛與緊急避難而免除其過失。","D":"救護技術員可以主張病人在法理上符合與有過失。"},"answer":"A","manualChapter":"CH04"},{"id":2380,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"依據「國際緊急派遣協會」定義，公共場所目擊OHCA的派遣等級是？","options":{"A":"E (ECHO)。","B":"A (ALPHA)。","C":"C (CHARLIE)。","D":"O (OMEGA)。"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2381,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"在進行區域EMS重大外傷品管時，針對下列哪一類傷患的死亡，我們應該深入了解院前院後是否有品管可改進之處？","options":{"A":"ISS低且RTS低的傷患。","B":"ISS低且RTS高的傷患。","C":"ISS高且RTS低的傷患。","D":"ISS高且RTS高的傷患。"},"answer":"B","manualChapter":"CH25"},{"id":2382,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"如果教師想要以G - A - S模式進行教學反饋時，在學員操作完XXX情境但表現不佳時，教師針對「獲取資訊(Gathering)」以以下哪一個詢問方式最為恰當？","options":{"A":"當病人發生XXX時，您為什麼沒有進行OOO的處置呢？","B":"您今天表現欠佳，之前是否沒有遇過病人發生XXX的情境呢？","C":"如果我是您，在病人發生XXX，您覺得我會怎麼作呢？","D":"當病人發生XXX時，您當時的心情或想法是什麼的呢？"},"answer":"D","manualChapter":"CH60"},{"id":2383,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"高級救護技術員以google表單發送給認識的同仁與學弟，完成「喝酒與工作壓力關係」的碩士論文。關於上述研究，何者正確？","options":{"A":"請認識的同仁或學弟填寫問卷，通常不需要受試者知情同意書。","B":"要減少選擇偏差，在議題設計時必須進行專家內容效度的檢測。","C":"要減少測量偏差，在問卷發放對象的選擇時必須進行分層與抽樣。","D":"要增加研究信度，可以在經過一段時間後再次請受訪者填答。"},"answer":"D","manualChapter":"CH11","explanation":"「專家內容效度檢測」是用來確認問卷題目是否能準確涵蓋與測量欲評估的研究概念（提升內容效度，減少測量偏差），而不是用來減少「選擇偏差（Selection bias）」；「進行分層隨機抽樣」是用來確保樣本對母體的代表性，以減少選擇偏差（Selection bias），而非減少測量偏差（Measurement bias）。測量偏差通常來自問卷設計瑕疵、填答者社會期望心態或儀器測量誤差；經過一段時間後對同一群受試者再次施測（即重測信度 / Test-Retest Reliability），用來評估測量工具跨時間的一致性與穩定度，是檢驗並確立研究工具信度（Reliability）的標準做法之一"},{"id":2384,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於血液中的氧氣與二氧化碳運輸，以下何者為是？","options":{"A":"氧氣在血液中以二種形式存在，直接溶解以及與血紅素結合。而直接溶解的氧氣量大於與血紅素結合。","B":"一個血紅素分子可以攜帶4個氧氣分子，這樣的狀態稱為飽和。通常在氧氣分壓80~100mmHg時達到飽和。","C":"二氧化碳在血液中有兩種型態，直接溶於血漿以及以碳酸根離子型式存在，直接溶解態約佔8%。","D":"在氧分壓40mmHg時，90%以上的血紅素均已攜帶氧分子。超過40mmHg以上時，增加的攜氧量有限。"},"answer":"B","manualChapter":"CH12"},{"id":2385,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"下列關於腦部解剖構造的敘述，何者為是？","options":{"A":"丘腦的功能是監督維持身體姿勢的肌肉，並以感覺的訊息為基礎，調節隨意和不隨意的大動作。","B":"下視丘含有口渴中樞、體溫中樞、攝食中樞等調控中樞，亦可調節自主神經功能與內分泌。","C":"控制心搏速率、心收縮力及循環血流量的心臟血管中樞及呼吸節律中樞都位於腦幹中的橋腦。","D":"大腦包含感覺訊息的轉遞與處理中樞，是所有上行感覺訊息傳遞的最後轉遞點，也擔任訊息過濾器。"},"answer":"B","manualChapter":"CH12"},{"id":2386,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"Amiodarone是院前常使用的抗心律不整藥物，關於此藥以下敘述何者為非？","options":{"A":"屬於第三類(Class III)的抗心律不整藥物。","B":"可能引致心臟收縮力降低、血管擴張及血壓下降。","C":"嚴禁用於已知有嚴重心臟功能受損的患者的心律不整。","D":"藥效半生期長，可至40天，易累積在體內。"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":2387,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"60歲男性從火場被救出，體重目測75公斤，燒燙傷面積一度約為10%，二度約為18%，三度約佔9%。依據最新版PHTLS，使用兩套標準輸液套管滴注，請推算前八小時每一套標準輸液套管每分鐘須調整為幾滴最為合適？","options":{"A":"84。","B":"42。","C":"21。","D":"63。"},"answer":"B","manualChapter":"CH31"},{"id":2388,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於血液的組成，何者為是？","options":{"A":"血液大部分由紅血球組成，佔55~60%。","B":"紅血球壽命約為120天，血球比例僅次於白血球。","C":"O型血中血漿抗體不含A或B抗體，只可接受O型血輸血。","D":"血漿中水份約佔九成。"},"answer":"D","manualChapter":"CH39"},{"id":2389,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關藥理學相關名詞，何者正確？","options":{"A":"拮抗作用(Antagonism)：當併用兩種或兩種以上藥物時，藥物效果出現相互阻抑而使藥物效果的總和小於個別使用藥物的效果加總(1＋1 < 2)。","B":"禁忌症(Contraindication)：在藥物治療劑量內發生不希望出現但常常是無法避免的效果。","C":"藥物過敏(drug allergy)：一種藥物被另一種先前給予藥物所影響，產生增加或減少藥效作用。","D":"適應性(tolerance)：重複使用藥物因藥物濃度累積，出現治療效果增強，需要調低藥物劑量。"},"answer":"A","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":2390,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"呼吸中通氣量和潮氣容積的描述，何者為是？","options":{"A":"正常呼吸下的潮氣容積為5,000~6,000毫升。","B":"計算真正肺泡潮氣量時，需要減掉氣道的容積。","C":"潮氣容積等於通氣量乘以每分鐘的呼吸次數。","D":"通氣量每個人是固定不變的。"},"answer":"B","manualChapter":"CH14"},{"id":2391,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"正常生理狀況下，有關二氧化碳濃度圖儀監測，何者為是？","options":{"A":"二氧化碳分壓值在吸氣階段，正常時可以降至0。","B":"潮氣末二氧化碳分壓值，位於吐氣的起點。","C":"開始吐氣的階段，二氧化碳分壓值最高之後開始下降。","D":"CPR時突然上升的潮氣末二氧化碳分壓值，代表插管滑脫。"},"answer":"A","manualChapter":"CH14"},{"id":2392,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於病患病史詢問的內容，正確的觀念是？","options":{"A":"主訴包括一個或多個主要的自覺症狀，同時也必須記錄症狀發生或持續的時間。","B":"現病史的第一個重點，就是要釐清主要患者身分的特徵。","C":"詢問發生當時狀況，指的是症狀發生病患的反應以及是否有人協助處置。","D":"加劇或緩解因素是協助高級救護技術員判斷是否為危急個案的必要條件。"},"answer":"A","manualChapter":"CH19"},{"id":2393,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"病史詢問之目的與作法何者為非？","options":{"A":"藉由訪談傷病患、家屬或相關目擊者，以瞭解傷病患的症狀表現及相關醫療狀況。","B":"經由與傷病患及家屬在病情詢問時的交談過程，同時安撫傷病患情緒。","C":"危急病人應先先評估現場病人的意識與生命徵象，完成初級評估。","D":"病人沒有生命徵象而必須立即接受心肺復甦術，高級救護技術員應優先專注於急救及後送，病史詢問可等到院後由醫師協助。"},"answer":"D","manualChapter":"CH19"},{"id":2394,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"75歲男性求救，牙痛數天未就醫，左臉部及左頸部腫脹而打119求救，你到現場發現他有發燒、吞嚥困難、喉嚨痛，似乎快要窒息。此時問診及身體檢查其相關症狀，形成臆斷的配對何者為非？","options":{"A":"身體檢查可發現體溫上升、口腔內口水積聚、頸部皮下氣腫。","B":"誘發因子可能為頸部異物(魚刺、骨頭)傷害、牙源性感染。","C":"主要危象表現：漸進式呼吸困難。","D":"臆斷疾病：嚴重過敏合併咽喉水腫。"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":2395,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"48歲男性因腳腫、呼吸喘求救，你到現場發現他呼吸淺快、心跳120下/分鐘、下列何者視觸診線索可以支持他最可能為肺栓塞？","options":{"A":"單側肢體紅腫合併水泡產生、疼痛劇烈。","B":"單側肢體腫脹、肢體溫熱。","C":"雙下肢脈搏消失或減弱。","D":"雙下肢出現網狀青斑。"},"answer":"B","manualChapter":"CH20"},{"id":2396,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"派遣令任務是要您至檢疫所護送COVID - 19快篩陽性的病患至專責醫院，請問此時最適合的醫病互動模式為何？","options":{"A":"「主動—被動」模式。","B":"「指導—合作」模式。","C":"「共同參與」模式。","D":"「遵從法規」模式。"},"answer":"B","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":2397,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"50歲男性，求救原因為視力突然變模糊，不敢自行騎摩托車就醫，你現場評估的結果發現，只有病患往右看時，會出現複視的現象，做神經學檢查時，視力是正常的，但右眼無法往右看，但往上往左往下的旋轉都是正常的，左眼沒有轉動限制的問題，下列敘述何者最適當？","options":{"A":"第三對腦神經出現病灶。","B":"第四對腦神經出現病灶。","C":"受影響的腦神經是屬於具備感覺與運動功能的混合型神經。","D":"第六對腦神經出現病灶。"},"answer":"D","manualChapter":"CH36"},{"id":2398,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"下列有關於「哮喘音(Wheezes)」和「喘鳴音(Stridor)」兩種肺音的比較，下列敘述何者有誤？","options":{"A":"「哮喘音」屬於肺內異常肺音；「喘鳴音」屬於肺外異常肺音。","B":"「哮喘音」以呼氣期為主；「喘鳴音」以吸氣期為主。","C":"「哮喘音」較為高頻；「喘鳴音」較為中頻。","D":"「哮喘音」為空氣通過狹窄的上呼吸道氣管；「喘鳴音」為空氣收縮狹窄的小細支氣管。"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":2399,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"「您好，我是xx91的EMTP，同事報案主訴意識不清，病患為60歲男性，有高血壓、糖尿病史，現場評估GCS為E2V2M5，我們現場量測血糖值為50，已經給予D50W兩隻，現在GCS回復至E4V4M6」，以上敘述關於「SBAR」的應用，何者是錯誤的？","options":{"A":"「同事報案主訴意識不清」，屬於「S」Situation。","B":"「病患為60歲男性，有高血壓、糖尿病史」，屬於「B」Background。","C":"「現場評估GCS為E2V2M5，我們現場量測血糖值為50」，屬於「A」Assessment。","D":"「給予D50W兩隻，現在GCS回復至E4V4M6」，屬於「R」Recommendation。"},"answer":"D","manualChapter":"CH22"},{"id":2400,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一位20歲男性無過去病史，20分鐘前感覺心悸，心電圖監測如下。依照2020年AHA guidelines for CPR and ECC，下列處置何者最適當？","options":{"A":"若病人的血壓80/50mmHg，先完成12導程心電圖再繼續下一個處置。","B":"若病人的血壓120/80mmHg，給予Diltiazem 15mg靜脈緩慢注射。","C":"若病人的血壓120/80mmHg，嘗試Adenosine 6mg靜脈快速注射。","D":"若病人的血壓80/50mmHg，給予Amiodarone 150mg靜脈快速注射。"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/2400.png"},{"id":2401,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於甲狀腺急症的相關敘述，下列何者為是？","options":{"A":"黏液性水腫(myxedema)病人臨床表現會有皮膚粗糙、聲音尖銳及肌腱反射增強等症狀。","B":"嚴重的黏液性水腫病人會有嗜睡、體溫下降等症狀，但仍需與低血糖等急症鑑別。","C":"甲狀腺機能亢進(thyrotoxicosis)臨床病人會有亢奮、煩躁、心悸或體重增加等症狀。","D":"甲狀腺風暴(thyroid storm)病人可能會有發燒、意識昏迷，需與嗎啡類中毒鑑別診斷。"},"answer":"B","manualChapter":"CH37"},{"id":2402,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一位50歲男性，主訴突然上腹劇烈疼痛持續30分鐘，現場生命徵象如下：體溫36.5°C，心跳130下/分鐘，呼吸18次/分鐘，血壓110/60mmHg。病人有抽菸及酗酒病史，意識清楚，自述嘔吐多次及冒冷汗。關於接下來的評估與處置，何者為非？","options":{"A":"病人可能有低血容，若送醫距離較長，可依縣市預立醫囑考慮給予靜脈輸液。","B":"送醫途中須注意呼吸道暢通與血氧濃度，必要時給予氧氣維持SpO2>94%。","C":"病人能清楚闡明自己身體的痛點，可排除心血管疾病而不需考慮心電圖監測。","D":"若觸診腹部有明顯僵硬，表示可能有腸道穿孔所導致的腹膜炎，到院前應請病人禁食。"},"answer":"C","manualChapter":"非創傷","matchedChapters":["Combine"]},{"id":2403,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名中年男子主訴昨晚起喉嚨疼痛呼吸困難而報案，評估時發現頸部肌肉用力，且吸氣時有明顯喘鳴聲(stridor)。現場接觸時體溫38.7°C，心跳111次/分鐘，血壓146/88 mmHg，呼吸30次/分鐘，血氧92%。EMT給予氧氣面罩8L/分鐘，並協助病人於擔架床半坐臥。上車後發現病人的喘鳴聲減少到幾乎聽不到，接下來最先需要做什麼？","options":{"A":"檢查攜帶氧是否已經用盡。","B":"確認血氧是否仍維持在94%以上。","C":"協助給予病人退燒藥物。","D":"觀察病人呼吸動力是否足夠。"},"answer":"D","manualChapter":"呼吸急症"},{"id":2404,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"病人主訴吐血，以下處理何者正確？","options":{"A":"由於血液碰到胃酸會呈現咖啡色，因此若是口吐鮮紅色的血，就表示不是胃部或十二指腸出血。","B":"糖尿病病人吐血，由於預期到院後要空腹，因此院前處理休克應給予大量含糖輸液。","C":"肝硬化病人食道靜脈曲張出血，相較於常見的消化道潰瘍出血，死亡率反而較高。","D":"只要病人意識清醒，吐血的病人能夠自行保護呼吸道，EMT不需介入維持呼吸道。"},"answer":"C","manualChapter":"非創傷","matchedChapters":["Combine"]},{"id":2405,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"以下何種疾病為空氣傳染？","options":{"A":"水痘。","B":"腸病毒。","C":"流行性感冒。","D":"鏈球菌肺炎。"},"answer":"A","manualChapter":"CH42"},{"id":2406,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於成人的致命性過敏反應，請問以下何者為最可能的主訴與病徵？","options":{"A":"病人主訴喘，呼吸有喘鳴聲，同時合併持續腹痛。","B":"病人全身皮膚起疹子且發紅發癢。","C":"病人主訴昏厥，EMT接觸時已清醒，血壓120/74 mmHg。","D":"病人持續胸悶胸痛冒冷汗，心跳90次/分鐘，血壓126/92 mmHg。"},"answer":"A","manualChapter":"CH40","matchedChapters":["CH40"]},{"id":2407,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名主訴呼吸困難病患經評估發現皮膚發紺、血壓降低及脈搏壓變窄。並且出現奇異脈(paradoxical pulse)及深吸氣時脈搏變弱等徵象。最可能為下列何種診斷？","options":{"A":"心肌炎。","B":"心包膜填塞。","C":"心肌梗塞。","D":"房室傳導阻斷。"},"answer":"B","manualChapter":"非創傷"},{"id":2408,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名急性右心室心肌梗塞合併右心室衰竭病患，血壓80/46 mmHg，心跳53次/分鐘，呼吸18次/分鐘，肺部聽診發現有兩側濕囉音。下列何種處置最適當？","options":{"A":"靜脈注射乙型阻斷劑(β blocker)。","B":"靜脈滴注心臟收縮藥物Dopamine。","C":"靜脈滴注心臟收縮藥物Dobutamine。","D":"Normal saline快速靜脈注射。"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":2409,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"40歲女性被家人發現倒臥家中，GCS=E1V1M4，無外傷，理學檢查無其他異常發現。血壓110/70 mmHg、心跳100次/分鐘、呼吸10次/分鐘、體溫正常。未使用氧氣治療下，動脈氣體分析：pH=7.20、PaCO 2 =80mmHg、PaO 2 =40mmHg，HCO 3 =25mmHg、SaO 2 =75%。最可能的病因為？","options":{"A":"安眠藥過量使用。","B":"氣喘急性發作。","C":"肺炎併呼吸衰竭。","D":"心因性肺水腫。"},"answer":"A","manualChapter":"CH20"},{"id":2410,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"60歲男性，因高血壓造成左側基底核顱內出血，併發經天幕疝脫(transtentorial herniation)導致昏迷，最可能伴隨以下哪一種狀況？","options":{"A":"右眼瞳孔放大，右側肢體無力。","B":"左眼瞳孔放大，左側肢體無力。","C":"右眼瞳孔放大，左側肢體無力。","D":"左眼瞳孔放大，右側肢體無力。"},"answer":"D","manualChapter":"CH36"},{"id":2411,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"您在救護車上監視一位病患，他的胸悶在使用舌下NTG含片後緩解，可是EKG監視器突然出現下圖，並主訴胸悶冒汗及頭暈，量測生命徵象發現血壓70/40mmHg，以下最佳處置為何？","options":{"A":"給予同步電擊100 Joule。","B":"給予非同步電擊200 Joule。","C":"給予Atropine 1 mg IV。","D":"給予Adenosine 6mg IV。"},"answer":"A","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/2411.png"},{"id":2412,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關中風病人到院前處置，何者最適當？","options":{"A":"皆須建立靜脈路徑，並快速且大量給予輸液避免低血壓。","B":"若病人出現高血壓狀況，立即請病人服用平常之降血壓藥物。","C":"若病人意識不清懷疑有IICP的徵兆時，可將病人頭部抬高超過45度。","D":"選擇合適的急救責任醫院，必要時繞過中風照護資源不足的醫院。"},"answer":"D","manualChapter":"CH36"},{"id":2413,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關眩暈(vertigo)描敘，何者為非？","options":{"A":"是一種神經學的症狀，感覺自身或環境在轉動的現象。","B":"周邊型眩暈常為短暫發作，中樞型持續時間則不一定。","C":"周邊型眩暈可能伴隨聽力減弱、耳鳴、耳痛及腫脹。","D":"周邊型眩暈會合併多方向、持續性眼震。"},"answer":"D","manualChapter":"CH36"},{"id":2414,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"75歲女士主訴呼吸喘、呼吸困難、頭暈且全身無力、同時合併胸痛不適，血壓78/49mmHg，心跳約40次/分鐘，心電圖監視器顯示如下圖，下列敘述何者為是？","options":{"A":"此為第一度房室傳導阻斷(1 o AV Block)，不需要緊急治療心律，可以先觀察症狀。","B":"此為第二度房室傳導阻斷(2o AV Block) M obitz第一型，不需要緊急治療心律，可以先觀察症狀。","C":"此為第二度房室傳導阻斷(2o AV Block) M obitz第二型，先給予Atropine 1mg靜脈推注。","D":"此為第三度房室傳導阻斷(3 o AV Block)，因病人症狀不穩定，可考慮使用TCP。"},"answer":"D","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/2414.png"},{"id":2415,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"80歲男性病人，過去病史有慢性阻塞性肺病(COPD)，近期呼吸較喘且吐氣時有哮鳴聲，請問下列何者為非？","options":{"A":"COPD病人是依賴低氧驅力來維持呼吸，故血氧低於90%時，不可給氧以免導致患者不呼吸。","B":"若病人備有支氣管擴張劑吸入器，可協助家屬幫助病人使用。","C":"若病人出現呼吸急促、精神混亂、躁動則可能是血氧過低或者是血中二氧化碳過多所致。","D":"若聽診兩側肺音聽不到哮鳴聲，仍須考慮可能為嚴重之急性發作。"},"answer":"A","manualChapter":"CH28"},{"id":2416,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"56歲女士，無特殊過去病史，被家人發現倒在客廳沙發，檢查後發現右側手腳無力，疑似中風，以下何者符合施打血栓溶解劑之適應症？","options":{"A":"四個月前有腸胃道出血病史。","B":"量測血糖為30 mg/dL。","C":"經藥物控制後血壓為190/115 mmHg。","D":"最後一次看見病人正常時間為5小時前。"},"answer":"A","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":2417,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於腦膜炎雙球菌感染之敘述，何者為非？","options":{"A":"為葛蘭氏陰性球菌，常存在鼻部和咽喉的粘膜中。","B":"好發於老年人，年輕人及兒童較少見。","C":"屬於飛沫傳染，在未適當防護下接觸病人飛沫者需預防性抗生素投藥。","D":"約10%的人會成為不具感染症狀的帶原者，但仍具有傳染力。"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH42"},{"id":2418,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"創傷嚴重度評估指數，以下何者為非？","options":{"A":"改良式創傷指數(RTS)，依據「昏迷指數」、「收縮壓」和「呼吸速率」三個變項，每一個變項分數0~4分，分數愈高則傷害愈高。每一個變項分數再乘以該項係數之後，三者相加即為創傷指數值。","B":"簡易創傷分數(AIS)，將身體分成六個解剖區域,包括:頭頸(head/neck )、顏面( face )、胸部( thorax )、腹部(abdomen)、肢體(extremity)、外觀軟組織(external)，每個解剖區域依損傷嚴重程度,由0~6分代表，分數越高表示越嚴重。","C":"ISS定義為「三個最嚴重創傷解剖區域之最高AIS分數平方總合」。ISS分數越高，死亡率越高。臨床上凡ISS ≧ 16即屬嚴重創傷。","D":"昏迷指數(GCS)最低3分，最高15分，分數高低與死亡率有明顯相關。"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2419,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"70歲男性有末期腎病變病史，最近因家裡辦喪事一個禮拜未到診所洗腎，兒子今天發現病人呼吸急促和昏迷因而報案。初步評估發現病人只對痛有反應且病人有休克徵象，輔助檢查發現心跳40次/分鐘，血壓70/40mmHg，血氧濃度86%，關於此病人可能之用藥選擇何者最不適當？","options":{"A":"MgSO4。","B":"Sodium bicarbonate。","C":"Atropine。","D":"Calcium gluconate。"},"answer":"A","manualChapter":"CH16"},{"id":2420,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"下列哪一個疾病較會造成低血壓？","options":{"A":"子癲前症。","B":"急性腦梗塞。","C":"腎上腺危象。","D":"安非他命中毒。"},"answer":"C","manualChapter":"非創傷"},{"id":2421,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"48歲男性，有第二型糖尿病以及高血壓病史，因呼吸困難求救，到達現場時發現病人有快而深的呼吸，兩下肢並無水腫情形，血糖450mg/dL，體溫36°C，血壓170/80mmHg，心跳130次/分鐘，下列敘述何者為是？","options":{"A":"因病人血壓高，不建議給予大量輸液。","B":"必須考量病人是否有潛在的感染問題。","C":"此種狀況病人容易出現頭痛。","D":"治療上建議常規給予碳酸氫鈉。"},"answer":"B","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":2422,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於心電圖的敘述，下列何者為是？","options":{"A":"心肌梗塞時出現的超急性T波(hyper acute T)，可以持續一到兩個小時。","B":"Lead I、aVL的ST段上升，通常暗示供應心室中膈的冠狀動脈出現阻塞。","C":"右心室傳導束傳導阻斷(Right Bundle Branch Block)通常暗示病人有嚴重的心臟疾病。","D":"三度房室結傳導阻斷(third degree AV block)的定義包含QRS波型均會超過心電圖的三小格。"},"answer":"A","manualChapter":"CH33"},{"id":2423,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"40歲女性有氣喘病史，未規則服用藥物，近日有感冒情形，今日因感到呼吸困難求救，現場血氧95%、血壓125/80mmHg、心跳100次/分鐘、呼吸24次/分鐘，臉色蒼白，關於病人處置何者為非？","options":{"A":"應把心肌炎、肺栓塞列入鑑別診斷，詳細詢問病史。","B":"如聽診出現哮鳴音(wheezing)，可以根據預立醫囑給予支氣管擴張劑。","C":"病人如有懷孕情形則不建議於院前給予支氣管擴張劑。","D":"即使血氧正常、聽診無哮鳴音(wheezing)也不可以排除氣喘急性發作。"},"answer":"C","manualChapter":"呼吸急症","matchedChapters":["Combine"]},{"id":2424,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一位50歲女性，站在椅子上跌落，撞擊右後背，理學檢查：心跳120次/分鐘、血壓80/50mmHg、呼吸24次/分鐘、血氧：96%、GCS=E3V5M6、右後背腰瘀青、無開放性傷口；超音波無明顯異常，至以下描述何者為非？","options":{"A":"可給予1000cc生理食鹽水灌注。","B":"超音波無明顯異常，可證明後腹腔無明顯出血。","C":"患者腰部瘀青可能是後腹腔出血，為Turner sign。","D":"急救性血管內氣球阻斷術(REBOA)可以從血管內部達到暫時控制出血的效果，為傷患爭取開刀或作栓塞的時間。"},"answer":"B","manualChapter":"創傷"},{"id":2425,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於孕婦外傷，以下敘述何者最適當？","options":{"A":"孕婦需要供應胎兒所需，只要輕微出血(<10%總血量)，便會有明顯的血壓下降、心跳加速。","B":"安全帶使用可能增加子宮破裂的機會。","C":"如無脊髓外傷疑慮，孕婦可以考慮以右側躺方式運送，避免壓迫下腔靜脈。","D":"子宮貫穿傷中，胎兒較母親有較佳的預後。"},"answer":"B","manualChapter":"CH49"},{"id":2426,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"13歲男童，體重目測35公斤，現場GCS=E2V2M4，心跳150次/分鐘、血壓70/30mmHg、呼吸30次/分鐘、血氧75%，理學檢查：腹部有安全帶徵象、瞳孔等大（左2mm/右2mm)、氣管向右偏移、頸靜脈怒張、呼吸音：左側減低，左側胸部敲診為鼓音，以下描述何者最適當？","options":{"A":"腹部有安全帶徵象通常與嚴重腹內損傷無關。","B":"小兒組織柔軟，如果有肋骨骨折，胸腔內的損傷的機會不高。","C":"考慮患者有左側張力性氣胸，應於左胸第五肋間腋後線前側實行針刺減壓。","D":"可以先以700ml林格氏液快速輸注。"},"answer":"D","manualChapter":"CH32","matchedChapters":["CH32"]},{"id":2427,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一位18歲男高中生，騎腳踏車與公車發生車禍，發現病患離事故現場20公尺，患者持續胸痛，心跳70次/分鐘、血壓110/70mmHg、GCS=E4V5M6、呼吸16次/分鐘、血氧98%，理學檢查僅全身多處擦傷，以下描述何者為非？","options":{"A":"應考慮創傷性主動脈破裂。","B":"兩側肢體的脈搏可能強弱不同。","C":"超音波無心包膜及肋膜積液可排除創傷性主動脈破裂。","D":"心音聽診可能有心雜音。"},"answer":"C","manualChapter":"創傷"},{"id":2428,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於出血性休克，以下敘述何者為非？","options":{"A":"所有創傷性休克傷患需積極排除出血性休克的可能性。","B":"輸液首選為林格氏液，其次為生理食鹽水。","C":"給予1,000cc生理食鹽水，生命跡象短暫改善後，復發性心跳上升，血壓下降，預估出血量為總血量的15-40%。","D":"同時合併腦外傷病患血壓低時，應按照允許性低血壓維持≧ 90mmHg即可。"},"answer":"D","manualChapter":"CH26"},{"id":2429,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"48歲男性因汽車車禍、呼吸喘、右上腹痛求救，你到現場發現他呼吸淺快、心跳120次/分鐘、有一地區醫院距離現場8分鐘車程，創傷中心距離20分鐘車程。你運用e-FAST評估如下影像，以下敘述何者錯誤？","options":{"A":"e-FAST適當的訓練可以提供良好的敏感度與特異度。","B":"e-FAST的部分掃描部位皆為身體躺平時身體最低的部位。","C":"此肝腎交界有黑色的水積液，配合情境要高度懷疑肝臟破裂內出血。","D":"盡速送往路程最近的醫院，增加存活率。"},"answer":"D","manualChapter":"CH21","matchedChapters":["需要圖片"],"image":"題庫圖片/2429.png"},{"id":2430,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關顱底骨折的描述，以下敘述何者為非？","options":{"A":"眼眶周圍如果有類似浣熊眼(Raccoon's eyes)瘀青及鼻漏(rhinorrhea)，要懷疑有前顱底骨折。","B":"有耳漏(otorrhea)則要懷疑有中顱底骨折。","C":"耳後有瘀青，巴氏徵侯(Battle's sign)，要懷疑有後顱底骨折。","D":"顱底骨折第一時間易忽略，要跟醫師交班輔以X光檢查確診。"},"answer":"D","manualChapter":"CH27"},{"id":2431,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關頭部創傷的急救處置觀念，何者為非？","options":{"A":"在現場處理頭部創傷最重要的就是在保護頸椎的前提下，維持呼吸道的通暢並給予足夠的通氣與氧合。","B":"到院前低血氧(SpO2<90%)與低血壓(SBP < 90mmHg)都會增加創傷性腦損傷的死亡率。","C":"到院前使用BVM給氧治療頭部外傷傷患時，其換氣速率同一般急救(每分鐘10~12次通氣)。","D":"創傷性腦損傷血壓的控制要維持在90mmHg以下，避免平均動脈壓過高增加顱內壓或增加顱內出血風險。"},"answer":"D","manualChapter":"CH27"},{"id":2432,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名35歲男性倒臥在工廠內，左下肢被捲入滾輪機器，您到達現場發現患者已脫困，但左下小腿傷勢十分嚴重，一直有鮮血冒出。根據PHTLS處置原則XABCDE，請問以下敘述何者為非？","options":{"A":"X：為控制可見的大出血。","B":"A：呼吸道處置、頸椎保護。","C":"C：確認循環相關問題，控制中度、輕度出血。","D":"D：鑑別診斷致命傷害。"},"answer":"D","matchedChapters":["CH25"],"manualChapter":"CH25"},{"id":2433,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名70歲男性病患主訴胸痛而報案，生命徵象穩定，現場心電圖如下圖所示，下列敘述何者最適當？","options":{"A":"需立刻再做一張右側心電圖。","B":"通報後送醫院啟動心導管小組。","C":"等到達醫院後再追蹤EKG，由醫師決定是否啟動心導管。","D":"給予初步藥物治療，就近送往一般級醫院，密切觀察追蹤。"},"answer":"B","matchedChapters":["需要圖片"],"manualChapter":"CH33","image":"題庫圖片/2433.png"},{"id":2434,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"35歲男性，被發現倒臥在大樓中庭，意識不清、心跳150次/分鐘、血壓80/50mmHg、呼吸24次/分鐘、血氧98%、傷患兩側跟骨明顯腫脹變形。以下敘述何者為非？","options":{"A":"判斷受傷機轉有可能為墜樓。","B":"休克原因需考慮出血性休克。","C":"受傷機轉不會造成腰椎骨折。","D":"病患無法檢查頸椎壓痛故需進行頸椎保護。"},"answer":"C","manualChapter":"創傷"},{"id":2435,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於出血性休克分級與表現徵候，下列敘述何者為非？","options":{"A":"Class I代表出血量小於全身血量的15%。","B":"Class II臨床表徵可能會出現脈搏壓減少。","C":"Class III通常是需要輸血治療。","D":"Class IV代表出血量大於全身血量的30%。"},"answer":"D","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":2436,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名男性於火場救出，其傷勢描述及範圍如下圖所示，分別為右臂背側皮膚如曬傷，胸腹部正面出現皮膚紅腫及水泡，右下肢及生殖器皮膚出現死白焦黑及水泡，請問含2度以上燒燙傷面積計算為多少%？","options":{"A":"22.5%。","B":"28%。","C":"32.5%。","D":"37%。"},"answer":"B","manualChapter":"CH31","matchedChapters":["需要圖片"],"image":"題庫圖片/2436.png"},{"id":2437,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"重大創傷時「創傷致命三合症(Lethal triad of trauma)」，不包含以下何者？","options":{"A":"凝血病變。","B":"酸血症。","C":"低體溫。","D":"低血氧。"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2438,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"40歲男性工作時被火灼傷，全身多處大面積燒傷，意識清楚表示疼痛，下列處置何者最適當？","options":{"A":"傷患顏面燒傷，眉毛鼻毛燒焦捲曲，若尚可講話不用考慮插管。","B":"計算靜脈輸液治療時，燒燙傷面積不需加入一度燒傷面積。","C":"三度燒傷區域，可以為乾硬不具彈性的皮膚稱為焦痂(eschar)，會有嚴重疼痛表現。","D":"輸液補充量計算改用修正後布魯克公式(modified Brooke formula)，為了增加體液的補充量，避免體液流失造成休克惡化。"},"answer":"B","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":2439,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於創傷性主動脈斷裂(traumatic aortic rupture)，下列何者最適當？","options":{"A":"常見主動脈破裂或斷裂的位置是胸腹主動脈交接處。","B":"80~90%的傷患會有右側胸腔內積血。","C":"最常見於高處跌落創傷機轉。","D":"因動脈韌帶(ligamentum arteriosum)固定住主動脈，拉扯造成斷裂。"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2440,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一位23歲男性病人在停車場因停車糾紛，左胸部被刺一刀，意識清楚但血壓只有90/70 mmHg，心跳160次/分鐘、呼吸18次/分鐘，下列描述何者最適當？","options":{"A":"若左邊肺部無呼吸聲音且氣管偏移有可能是心包膜填塞。","B":"若雙邊肺部皆有呼吸聲音且氣管沒有偏移需考慮張力性氣胸。","C":"超音波檢查需注意跳動的心臟周邊，有無像心臟內一樣的黑色的水在周邊。","D":"開放性傷口若有氣泡或冒泡聲，首要任務是完全封閉胸壁開放性傷口。"},"answer":"C","manualChapter":"創傷"},{"id":2441,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"20歲男性在夏日馬拉松賽跑後，全身冒汗且神智不清，現場量測體溫為42°C，請問關於此病患的診斷與治療，下列何者最適當？","options":{"A":"病人若發生抽搐，可使用Lorazepam控制。","B":"降溫的主要目標，是快速將體溫降到38°C以下。","C":"中暑病人的皮膚通常是乾燥無汗，因此這位病人熱中暑機會很低。","D":"使用4°C的生理食鹽水點滴輸液降溫比用灑水併吹風扇降溫安全快速。"},"answer":"A","manualChapter":"CH55"},{"id":2442,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"30歲女性被困在冷涷庫中30分鐘，救出時身上無明顯外傷，但已無生命徵象，量測病人中心體溫為20°C。請問關於此病患的急救，下列何者最適當？","options":{"A":"呼吸及脈搏不易評估，評估脈搏至少需45秒以上。","B":"氧氣需求量少，因此氣管內插管對病人並無幫助。","C":"若發現病人身體已完全結凍、口鼻已冰封，則可以停止急救。","D":"在體溫回升到30°C前不應給予Epinephrine，以免造成組織毒性。"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2443,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於足月新生兒接受正壓通氣的描述，下列何者最適當？","options":{"A":"娩出時若無哭聲，需立即給予正壓通氣。","B":"給予正壓給氧的速率約為40-60下/分鐘。","C":"為避免缺氧，通氣時應使用100%的氧氣。","D":"除非心跳小於60下/分鐘，否則不需給予正壓通氣。"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":2444,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關產婦急救敘述，下列何者最適當？","options":{"A":"維持正常去顫電擊的位置和電量。","B":"務必以左側躺姿勢進行壓胸急救。","C":"點滴注射時，儘量打在下肢靜脈。","D":"插管時應選用較大號的氣管內管。"},"answer":"A","manualChapter":"CH49","matchedChapters":["CH49"]},{"id":2445,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"33歲男性到綠島水肺潛水，最後一次潛水後約12小時產生突發性雙下肢無力、完全無法走路的症狀。關於這位病人的描述，下列何者最適當？","options":{"A":"發生此症狀的原因，最可能是血中的氧氣氣泡阻塞血管所致。","B":"轉送過程中需給予高濃度氧氣，並以頭低腳高的姿勢運送。","C":"病人可能罹患減壓病，需轉送至有高壓氧治療的適合醫院。","D":"病人如需空中轉送，機艙內壓力應儘量維持較海平面壓力為低。"},"answer":"C","manualChapter":"CH44"},{"id":2446,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"70歲男性，通報意識不清，現場發現全身冒汗、嘔吐、大小便失禁。理學檢查發現呼吸明顯濕囉音。血壓160/80 mmHg、脈搏40次/分鐘、呼吸30次/分鐘、體溫36.5°C、血氧92%、GCS= E3V4M5、雙側瞳孔大小1mm且對光有反應。請問這位病人的症狀，與哪種中毒症候群最符合？","options":{"A":"膽鹼性中毒症候群。","B":"抗膽鹼性中毒症候群。","C":"致幻覺性中毒症候群。","D":"仿交感神經作用中毒症候群。"},"answer":"A","manualChapter":"CH50"},{"id":2447,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於準自殺行為的危險因子，下列何者為非？","options":{"A":"退休狀態。","B":"完美主義人格。","C":"婚姻處於分居狀態。","D":"曾執行一次的準自殺行為。"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2448,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於臺灣毒蛇的敘述，下列敘述何者正確？","options":{"A":"眼鏡蛇的毒牙為管牙，被咬傷後因組織被破壞導致疼痛腫脹與腐爛。","B":"雨傘節的神經性毒液的毒性為台灣陸生毒蛇中毒液最強者。","C":"百步蛇蛇毒常會引起急性賢衰竭與全身性出血的症狀。","D":"台灣目前的抗蛇毒血清共有六種，僅有醫學中心六種皆有備藥隨時可用。"},"answer":"B","manualChapter":"CH50"},{"id":2449,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"下列皆是腸病毒71型感染併發重症的常見病徵，但何者為非？","options":{"A":"肌躍型抽搐(myoclonic jerks)。","B":"低血糖(hypoglycemia)。","C":"肢體顫抖(tremor)。","D":"心搏過速(tachycardia)。"},"answer":"B","manualChapter":"CH43"},{"id":2450,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"王太太因情緒不佳，去藥局買了一些普拿疼(Acetaminophen, ACT)企圖自殺，服用一小時由119送來急診。下列敘述何者為非？","options":{"A":"其主要毒性傷害為肝毒性，如未治療，症狀在第3、4天最為嚴重。","B":"病人到院時就要馬上抽測血中ACT濃度，並立刻給解毒劑治療。","C":"解毒劑是N-Acetylcysteine，8小時內使用有很高的機會完全康復。","D":"服用解毒劑N-Acetylcysteine時，不應同時給予活性炭治療。"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2451,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"我們可以利用CAGE的簡易口訣，提早發現同仁可能有酗酒的問題，請問下列關於CAGE的敘述，何者錯誤？","options":{"A":"C代表Continuity，我們可以先詢問同仁是否已不自覺的連續多天飲酒？","B":"A代表Annoyance，可以接著詢問同仁是否因喝酒而造成家人或朋友的嫌惡？","C":"G代表Guilty，下一步是詢問同仁是否會覺得這樣長期飲酒有罪惡感？","D":"E代表Eye opener，可以詢問同仁是否一早起來就會覺得想要找酒來喝？"},"answer":"A","manualChapter":"CH46"},{"id":2452,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"救護現場一名36歲女性，明顯眼神紊亂，表示自己有超能力可以操縱氣體，且她聽到居禮夫人叫她操縱瓦斯進行發電；跟家人詢問後，家人表示病人無過去病史，但這半個月以來此類妄想此情形反覆發生，這次是因為已有明顯危害自己跟家人人身安全的疑慮，才報案處理。請問以下描述，何者最適當？","options":{"A":"根據病人臨床表現及家人提供的資訊，此病人有可能的臆斷應為躁症發作。","B":"以溝通原則來說，問答採用「是居禮夫人叫你開瓦斯嗎？」比「居禮夫人跟你說了什麼？」還要適合。","C":"除了過去病史之外，還應該詢問家族內是否有身心科病史、病人最近是否有使用娛樂性用藥或毒品。","D":"此病人已有明顯自傷傷人之疑慮，故在警察尚未抵達之前，救護員可以依法將病人強制約束及送醫。"},"answer":"C","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":2453,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"你接獲通報，前往協助一名酒醉路倒的病患送醫；當你到場時，發現病患渾身酒氣、意識不清、全身瘀青倒在店家門口，老闆表示病患這幾天都沒吃東西，剛剛半小時前又跟他買酒喝，希望你載他到附近醫院就醫；在運送過程中，病患突然牙關緊閉、眼睛上吊、疑似癲癇發作(seizure)，請問引起此病患癲癇發作的鑑別診斷何者最不可能？","options":{"A":"電解質異常(Electrolyte imbalance)。","B":"酒精戒斷(Alcohol withdrawal)。","C":"創傷性腦損傷(Traumatic brain jury)。","D":"低血糖(Hypoglycemia)。"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2454,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"8歲男童體重約30公斤。吃果凍吃到一半突然臉色紫青，而後轉為心跳停止。你抵達現場時已有家人在進行心肺復甦術。接下來的急救措施，何者正確？","options":{"A":"當預計進行氣管置入時，無氣囊的氣管內管號數應挑選為5.5號以上。","B":"當成功置入後，無氣囊氣的管內管置入深度應為15公分以上。","C":"在急救過程中，施打腎上腺素(Epinephrine)的劑量每次為0.03mg。","D":"在回復自主呼吸心跳後，此男童收縮壓的標準應維持在86mmHg以上。"},"answer":"D","manualChapter":"CH48"},{"id":2455,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"請問下列救護情境，何者最不像是兒童虐待的案件？","options":{"A":"母親表示3歲大女嬰在家人睡午覺時，自己從床上翻落導致腹部瘀傷。","B":"父親表示10個月男嬰練習走路時不慎跌倒，X光發現移位性股骨骨折。","C":"老師表示4歲女童早上跌倒導致頭部撕裂傷，傍晚帶來急診傷口縫合。","D":"教練表示6歲男童在跆拳道集訓過程中，雙側前臂瘀青疼痛活動困難。"},"answer":"D","manualChapter":"CH48"},{"id":2456,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"相較於固定翼航空器(小飛機)，以直昇機進行空中救護有哪項優點？","options":{"A":"機動性高。","B":"安全性佳。","C":"醫療條件較優。","D":"受天候影響小。"},"answer":"A","manualChapter":"CH58"},{"id":2457,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"大地震後災區病人的預期健康狀況，下列何者為非？","options":{"A":"急性心肌梗塞比例會增加。","B":"孕婦流產及早產的情形將較為少見。","C":"大部份嚴重的傷患，應該都是合併多處創傷。","D":"傷患常因頭、胸部嚴重壓傷造成立即死亡。"},"answer":"B","manualChapter":"CH52"},{"id":2458,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於事件指揮系統中後勤組的功能，下列何者為非？","options":{"A":"建立並維護通訊系統。","B":"維護電力及衛生設備。","C":"提供工作人員食物及飲水。","D":"追蹤應變人員的工作時間。"},"answer":"D","manualChapter":"CH53"},{"id":2459,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"使用START法進行檢傷時有些傷患的病情容易被誤判為重症，但下列何者除外？","options":{"A":"孕婦。","B":"失聰傷患。","C":"下肢殘障傷患。","D":"過度換氣傷患。"},"answer":"A","manualChapter":"CH52"},{"id":2460,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於不明化學物質外洩現場的災害處置與救護，下列何者正確？","options":{"A":"除污走廊應設在外洩點的下風上坡處。","B":"在熱區可對傷患進行簡單的呼吸道維持治療。","C":"在暖區執行除污時，傷口應以大量高壓水沖洗清潔。","D":"執行除污時，傷患身上的固體毒化物顆粒，需立刻以清水乾淨。"},"answer":"B","matchedChapters":["CH53"],"manualChapter":"CH53"},{"id":2461,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"颱風可能對醫療服務造成的影響，下列敘述何者最不適當？","options":{"A":"道路中斷，可能需要空中運輸。","B":"緊急救護時，行車安全的風險增加。","C":"醫療院所淹水及交通阻斷，影響醫院運作。","D":"造成新興傳染病盛行，耗費大量醫療資源。"},"answer":"D","manualChapter":"CH57"},{"id":2462,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於大型活動的醫療規劃原則，下列敘述何者最不適當？","options":{"A":"醫療規劃時，「保護自己的安全」為首要規劃重點。","B":"醫療站動線必須讓急救人員可攜帶急救裝備順利往返。","C":"醫療站位置最好設置在8分鐘路程內可到所有活動區域處。","D":"預估傷患人數通常與活動種類、持續時間、現場溫度與高度有關。"},"answer":"C","manualChapter":"CH54"},{"id":2463,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於核生化事件的防護衣，下列敘述何者最適當？","options":{"A":"C級防護衣不可在缺氧環境下使用。","B":"化災防護衣，可防護穿透式的輻射線。","C":"進入毒化災現場，當毒物不明時，應穿戴B級防護衣。","D":"C級防護衣是包括全面式面罩加上供氧呼吸裝備及全身防潑濺的防護衣。"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2464,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"核電廠發生輻射外洩事件，一名傷患經除汙之後，輻射應變隊偵測傷患身上沒有輻射反應，你獲派運送此傷患就醫。下列敘述何者最適當？","options":{"A":"偵測身上沒有輻射反應，表示該傷患輻射暴露劑量極低。","B":"救護人員治療此位傷患，仍需穿著防輻射衣進行。","C":"傷患出現嘔吐症狀距離輻射暴露的時間，和輻傷嚴重度有關。","D":"該傷患應至少會出皮膚紅、噁心、嘔吐或發燒其中之一的症狀。"},"answer":"C","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2465,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"事故指揮系統中，以下哪項應為執行部部長的任務？","options":{"A":"確保轄屬的工作人員都依照安全規範執行任務。","B":"收集、分析、散發資訊。","C":"提供資源和服務，以協助事故應變順利進行。","D":"保存災害復原記錄與損害記錄。"},"answer":"A","manualChapter":"CH52"},{"id":2466,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"大量傷患檢傷分類大部分的國家係分成四級，依照顏色來表示，下列敘述何者錯誤？","options":{"A":"紅色：重傷，屬於優先處理患者，患者通常傷勢嚴重危及生命，但若及時治療存活機會大，如身體大量出血，上呼吸道阻塞，張力性氣胸。","B":"黃色：中傷，暫緩治療，患者通常有顯著傷勢，但是稍微晚點處置不會危及生命，也不會造成嚴重的後遺症，如股骨骨折。","C":"綠色：皮肉輕傷，可自己行走，延遲處理也不會有後遺症。但需要小心有惡化成紅色或黃色的情形。","D":"黑色(白色)：瀕死，多處重大創傷或者已經是明顯死亡的傷病患，全世界處理順序都是最後處治。"},"answer":"D","manualChapter":"CH52"},{"id":2467,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"事故應變的現場作業又區分為現場評估→集結檢傷→現場救護→確適醫療。以下敘述何者錯誤？","options":{"A":"現場評估的重點包含4個S，也就是確保安全(Safety)，事故資訊(Size-up)，狀況回報(Send Information)，及建立指揮(Set up)。","B":"集結檢傷屬於現場檢傷，主要目的在決定醫療處理的優先順序，因此屬於初級檢傷。","C":"現場救護被視為事故現場與確適醫療之間的過渡階段，主要的重點有3T，檢傷(Triage)，治療(Treatment)，後送(Transport)。","D":"確適醫療是指醫院有足夠能力以及足夠容量來處理這個患者，不需要再轉介至其他醫療院所治療。"},"answer":"B","manualChapter":"CH52"},{"id":2468,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"對於大量傷患後送至確適醫療單位的原則與現況，下列敘述何者為非？","options":{"A":"相較於重症傷患，輕症傷患常在初期湧入醫院消耗大量處理能量，以致當重症傷患送達時沒有足夠人力和設備處理。","B":"輪送(rotating)適用於事故地點附近醫院的距離、處理能力和容量都相似時，將嚴重度類似的傷患輪流後送以避免醫院不堪負荷。","C":"當某醫院已超乎負荷，沒有能力接收新傷患時，應採取繞道(bypass)原則，避開這家無法負荷的醫院。","D":"群送(packaging)適合用於輕症傷患，將一整群傷患一起送到某家醫療院所，轉送前須確認該醫院有足夠的接收容量。"},"answer":"C","manualChapter":"CH52","explanation":"大量傷患後送原則有輪送、群送、分流及繞道\n輪送指醫院處理能力和容量都類似，避免某一家醫院在短時間接收太多病人，不堪負荷，是一種分配的方式。\n群送指將一整群輕傷病人以救護巴士等車輛一起送到較遠的醫療院所，降低\n病人追蹤困難，需事先確認該醫院有足夠的接收容量。\n分流指醫院已經超乎負荷，這時應該將病人後送到其他醫院。\n繞道指能處理重症或特殊病人的醫院較遠，為避免送到最近醫院無法處理而浪費時間轉院，故直接送較遠能處理之醫院。記憶技巧：大量傷患後送原則：輪送、群送、分流及繞道，各有不同情境。"},{"id":2469,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"有關現場救護的權責，下列敘述何者最適當？","options":{"A":"大量傷患現場醫療小組人數可能嚴重不足，而中重傷者常一下子湧入治療區，故只要傷患脫困後即應該馬上轉送醫院，毋須現場執行醫療處置。","B":"現場檢傷時先召喚可行走傷患集中於傷患集結區，確保人員安全；無法行走傷患則由檢傷人員評估並搬運至傷患集結區。","C":"明顯死亡的傷患，應該先做好現場蒐證後，再送達遺體區。在危害物質事故時，宜盡速移動遺體以免染污。","D":"醫療小組的醫療派遣員須和後送小組的後送管制員確認溝通傷病患人數及嚴重度，後送順序、方式、時間、車輛、接收醫院等事宜。"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2470,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"關於各種運動賽事場邊救護，以下觀念何者正確？","options":{"A":"進入冰上曲棍球場地執行救護必須著冰刀以免破壞場地。","B":"柔道跌打損傷多，冷凍噴劑是急救包必備項目。","C":"摔角賽事基本禮儀是救護人員應比照選手穿著短褲。","D":"橄欖球賽在醫護人員進入賽場時，比賽仍繼續進行中。"},"answer":"D","manualChapter":"CH55"},{"id":2471,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"新興傳染病感染鏈中，最容易被消滅或打斷以阻絕疾病傳染的部份是？","options":{"A":"傳染途徑。","B":"易感宿主。","C":"傳染病源。","D":"傳染窩。"},"answer":"A","manualChapter":"CH42"},{"id":2472,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"今天醫療指導醫師至您的分隊，先與隊員座談討論救護案例，然後參與正在進行的分隊心肺復甦術抽測講評、之後他又檢查本月的車廂內錄影急救過程，並且將發現的問題寫成醫療指導記錄交給承辦人及回傳救護科。請問在上述過程中，這位醫師進行了哪些模式的醫療指導？","options":{"A":"即時性與回溯性。","B":"前瞻性與即時性。","C":"前瞻性與回溯性。","D":"前瞻性、即時性與回溯性。"},"answer":"C","manualChapter":"CH02"},{"id":2473,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"當遇到救護倫理的困境時，我們可以假想「如果自己是病患、是否能接受這樣的處置與建議」，這種方法叫作？","options":{"A":"無私試驗。","B":"普及試驗。","C":"答辯試驗。","D":"自主試驗。"},"answer":"A","manualChapter":"CH04"},{"id":2474,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列何者是屬於緊急醫療救護「過程面」的指標？","options":{"A":"救護人員對單位的滿意度與離職比例。","B":"派遣中心報案電話中主訴創傷與非創傷的比例。","C":"缺血性胸痛病患接受到院前心電圖檢查的比例。","D":"社區心肺停止的病患在到院前即恢復自發性循環的比例。"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2475,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"中央衛生主管機關公告之公共場所，購置自動體外心臟電擊去顫器後，應送衛生主管機關備查後，轉登錄於哪一個單位？","options":{"A":"縣(市)政府衛生局。","B":"鄰近之急救責任醫院。","C":"衛生福利部網站。","D":"縣(市)消防機關之救災救護指揮中心。"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2476,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"對於減少頸椎之二次傷害，將脊椎固定(Spinal Immobilization)改為脊椎減移(Spinal Motion Restriction)。是符合「醫療照護品質」之哪一面向？","options":{"A":"有效(Effective ness)。","B":"安全(Safety)。","C":"傷病患為中心(Patient-centeredness)。","D":"效率(Efficiency)。"},"answer":"A","manualChapter":"CH09"},{"id":2477,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"品管有許多執行方式以及手法。若要觀察各品管特性隨時間變異之情形，比較適合使用那一種品管手法？","options":{"A":"柏拉圖。","B":"查核表。","C":"散布圖。","D":"管制圖。"},"answer":"D","manualChapter":"CH09"},{"id":2478,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"以下針對氣管內管相關的敘述何者為非？","options":{"A":"小於8歲的兒童因為環狀軟骨段的氣管較寬大，所以一定要選擇有氣囊的氣管內管。","B":"兒童的會厭軟骨較為細長柔軟，不易控制，故常使用直式葉片。","C":"若插管太深，通常是進入右側支氣管。","D":"潮氣末二氧化碳濃度可以用來評估插管是否正確置於氣管中。"},"answer":"A","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":2479,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"體重150公斤身高160公分男性OHCA救護，欲進行氣管插管，以下何者擺位最適當？","options":{"A":"墊高肩部。","B":"墊高頸部。","C":"墊高頭部。","D":"墊高胸部。"},"answer":"C","manualChapter":"CH15"},{"id":2480,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"體重150公斤身高160公分男性OHCA救護，欲進行氣管插管，墊高原則以下何者最適當？","options":{"A":"下巴對肩線。","B":"耳垂對肩線。","C":"嘴角對肩線。","D":"喉結對肩線。"},"answer":"B","manualChapter":"CH35"},{"id":2481,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"體重150公斤身高160公分男性OHCA救護，欲進行氣管插管，若嘗試插管兩次失敗，以下何者最適當？","options":{"A":"抽吸後再次嘗試插管。","B":"擺位後再次嘗試插管。","C":"抽吸後放置口咽呼吸道。","D":"選擇放置聲門上呼吸道。"},"answer":"D","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":2482,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"右圖為氧合血紅素飽合度與動脈血氧分壓的關係圖，有關此圖的敘述何者為非？","options":{"A":"此圖用來解釋內呼吸的生理作用。","B":"曲線右移時，代表氧氣易釋放至組織。","C":"體溫增加、血中PH上升時，曲線會往右移。","D":"血中二氧化碳分壓下降、血中2-3-DPG濃度下降，曲線會往左移。"},"answer":"C","manualChapter":"CH12","image":"題庫圖片/2482.png"},{"id":2483,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"55歲男性，早上九點在公司開會，突然出現眼睛無法對焦，看東西會出現複視的現象；然後接著自己右臉有麻木的感覺，想喝水卻發現自己連吞口水都會嗆到；趕緊請求119送醫，您9點30分至現場，評估後發現病患的辛辛那提中風指標皆呈現陰性反應，下列敘述何者為非？","options":{"A":"此病患仍可能為腦中風，須通報醫院啟動中風小組並送至可以施打血栓溶解劑的醫院。","B":"「眼睛無法對焦，看東西會出現複視」，有可能是第三、四、六對的腦神經當中，有某些神經受影響。","C":"「右臉有麻木的感覺」，應該是第七對腦神經有受影響。","D":"「連吞口水都會嗆到」，有可能是第九對腦神經有受影響。"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":2484,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"呼吸作用的過程包括下列四個步驟：換氣作用→外呼吸→循環→內呼吸；四個步驟中，任一發生問題，皆可以誘發其相對應的疾病；有關疾病與呼吸四步驟的配對，下列配對何者為非？","options":{"A":"肺栓塞–外呼吸。","B":"一氧化碳中毒–內呼吸。","C":"張力性氣胸–外呼吸。","D":"嚴重氣喘發作–換氣作用。"},"answer":"C","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":2485,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"78歲男性求救，突然感到嚴重胸部不適而打119求救，你到現場發現她有發紺、胸痛及休克現象，似乎快要窒息。此時問診相關症狀，形成臆斷錯誤的配對是？","options":{"A":"沉重壓迫感、心臟被捏住感：心絞痛。","B":"突發性撕裂般疼痛感：主動脈剝離。","C":"持續性疼痛：心包膜炎。","D":"胸骨後灼熱感：肺栓塞。"},"answer":"D","manualChapter":"CH19"},{"id":2486,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列身體理學檢查結果與臆斷配對錯誤的是？","options":{"A":"結膜蒼白：貧血。","B":"鞏膜黃疸：急性肝炎。","C":"耳道出血：鼓膜破裂、顱底骨折。","D":"瞳孔不等大：嗎啡中毒。"},"answer":"D","manualChapter":"CH20"},{"id":2487,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"關於醫病互動模式的比較，何者為是？","options":{"A":"指導–合作模式是一種以醫病互為中心的互動。","B":"共同參與模式是一種以病患和家屬為中心的互動。","C":"病患在送醫途中心跳停止，應先使用共同參與模式。","D":"主動–被動模式是醫療人員對病患的單向影響，並非互動。"},"answer":"D","manualChapter":"CH18"},{"id":2488,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"特殊的腹部診察方式，何者為非？","options":{"A":"移動式濁音在患者平躺及側臥時，叩診時濁音與實音的交界位置會改變。","B":"深觸診左下腹時會使傷病患右下腹疼痛，是為洛夫辛徵象( Rovsing's sign)。","C":"闌尾炎可能會有閉孔肌徵候(Obturator Sign)的出現。","D":"肋脊角的敲擊痛，代表後腹腔可能有出血或發炎。"},"answer":"A","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":2489,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"你深夜出勤一件路倒的案件，到達現場時病患渾身酒味，意識對痛有反應，暢通呼吸道後發現呼吸型態快且每次都進行深度換氣，下列敘述何者為是？","options":{"A":"此種呼吸稱為陳施氏呼吸(Cheyne-Stokes respiration)。","B":"病患可能是橋腦損傷，要檢查是否有頭部外傷。","C":"病患可能為高血糖引起的代謝性鹼中毒，要驗血糖。","D":"病患可能為喝到假酒，要搜尋四周是否有喝剩的酒。"},"answer":"D","manualChapter":"非創傷"},{"id":2490,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列關於病史詢問的技巧，何者為是？","options":{"A":"因救護現場環境因素及時間有限，一般會用專一性的問句來迅速獲得臨床上最重要的病史訊息。","B":"重複病患的句尾幾個字會打斷病患的思路，而且會讓病患有不被尊重的感受，應盡可能避免。","C":"澄清(clarification)的目的在於對病患含糊的描述加以釐清。可依程度量化的問句常會誤導病患對於症狀的描述。","D":"鼓勵病患描述病情的方式並不限於言語，適時的點頭，或是眼神接觸都可以達到順勢引導的效果。"},"answer":"D","manualChapter":"CH19"},{"id":2491,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"60歲女性兩週前剛因為左側股骨頸骨折開刀出院，回家後持續臥床休息。兩天前開始呼吸不順、胸痛、今日下床有昏厥跌倒被119送來醫院。理學檢查發現病人血壓90/50 mmHg、心跳106/分、血氧88%、頭部和前胸有擦傷、兩側呼吸音清晰、無明顯心雜音、有頸靜脈鼓張。病人最有可能的診斷是？","options":{"A":"肺炎。","B":"肺栓塞。","C":"心肌梗塞。","D":"心包膜填塞。"},"answer":"B","manualChapter":"非創傷"},{"id":2492,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"指揮中心通報某安養中心接救護案件，求救原因為意識不清。您們到現場後發現病人躺床上、看起來沒有反應、一旁護理人員已接上的心電圖監測如下，請問下列敘述何者正確？ (選「此病人目前為心房顫動併快速心室反應(A.fib with RVR)」也對)","options":{"A":"此病人目前為心房顫動併快速心室反應(A.fib with RVR)。","B":"此病人須立刻同步整律雙向波120焦耳。","C":"此病人須立刻去顫電擊雙向波150焦耳。","D":"此病人須先確認脈搏。"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH33","image":"題庫圖片/2492.png"},{"id":2493,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"有關糖尿病酮酸中毒(Diabetic Ketoacidosis, DK)之常見徵象，下列何者為是？","options":{"A":"皮膚濕冷或出汗。","B":"呼吸性酸中毒。","C":"出現Kussmaul’s呼吸。","D":"症狀發展非常快速。"},"answer":"C","manualChapter":"CH12"},{"id":2494,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"當病人發生全身立即致命性過敏反應，可考慮使用的藥物下列何者為非？","options":{"A":"Diphenhydramine抗組織胺","B":"Hydrocortisone腎上腺皮質素","C":"Nitroglycerin硝化甘油","D":"Epinephrine腎上腺素"},"answer":"C","manualChapter":"CH40"},{"id":2495,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"有關洗腎病人的血液透析不平衡症候群（disequilibrium syndrome）之描述，下列何者為是？","options":{"A":"最常發生於多次透析療程之後。","B":"可能因血液中尿素氮減少的速度比腦部慢所致。","C":"會出現神經症狀，如不安、意識程度降低、抽搐。","D":"會產生滲透壓不平衡，導致腦脫水、缺氧。"},"answer":"C","manualChapter":"CH41"},{"id":2496,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"46歲女性，因左半邊臉突然僵硬、臉歪嘴斜，自覺中風故求救119。若她有下列何種症狀，比較像是貝爾氏麻痹而非中風？","options":{"A":"右側肢體無力。","B":"吞嚥困難、流口水。","C":"舌頭前三分之二味覺異常。","D":"前額皺紋不受影響(仍可皺額頭與皺眉)。"},"answer":"C","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":2497,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"您載送一名長期臥床病人到院後，被醫院告知病人可能有疥瘡。下列說明，何者為是？","options":{"A":"疥瘡是由寄生在真皮層中的疥蟲所引發的疾病。","B":"病人發癢搔抓的部位，通常由臉和軀幹開始。","C":"救護車上病人接觸過的物品，可以日曬處理或是用塑膠布密封靜置兩週。","D":"您若因接觸到疥蟲被感染的，一般來說一週內就會出現搔癢症狀。"},"answer":"C","manualChapter":"CH42"},{"id":2498,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"18歲男性參加完學校體育課的籃球賽後感到陰囊劇烈的疼痛。病人否認有外傷或外力撞擊，下列敘述何者為是？","options":{"A":"突發的單側睪丸劇烈的疼痛，通常是急性副睪炎。","B":"給予熱敷改善循環，可以減輕疼痛。","C":"用手輕輕上抬疼痛側睪丸，可以緩解病人的疼痛感。","D":"避免睪丸壞死，須及早進行手術修復。"},"answer":"D","manualChapter":"CH41"},{"id":2499,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"45歲女性病人，因酒後呼吸困難而打119求救。您到場後發現病人意識嗜睡、呼吸急促，主訴：呼吸喘，四肢無力麻木，以及腹部不適，現場生命徵象：血壓102/66 mmHg、脈搏92/min、呼吸28/min、血氧濃度room air 100%。此病人的後續處置何者為是？","options":{"A":"此病人是過度換氣症候群，只要引導呼吸或以塑膠袋罩住口鼻即可改善。","B":"可盡速給予含糖點滴，以排除低血糖引起的症狀。","C":"可給予氣管擴張劑，以改善病人呼吸喘的不適。","D":"需評估現場是否有其他物質或藥物引起呼吸代償的可能。"},"answer":"D","manualChapter":"CH46"},{"id":2500,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"48歲男性病人家屬報案主訴突然昏倒，經派遣員線上評估疑似OHCA（到院前心肺停止），予以線上指導報案者施行心肺復甦術。您們到場後發現報案者正在為病人CPR，沒有使用AED。病人目前無意識且無適當呼吸，您們接上心電圖監視器顯示如下。下列處置何者為是？","options":{"A":"繼續心肺復甦術，盡速送醫。","B":"此病人為寬QRS不穩定心律，應立即200J去顫電擊。","C":"此病人為急性心肌梗塞，盡速給予Aspirin與NTG舌下碇。","D":"立即開始復甦後照護，給予人工呼吸並持續監控心律。"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH33","image":"題庫圖片/2500.png"},{"id":2501,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"承上題，病人送到醫院後恢復自發性循環(ROSC)，作12導程心電圖如下。下列說明，何者為是？","options":{"A":"心肌梗塞位置在右心室下壁。","B":"冠狀動脈阻塞位置在左前降支冠狀動脈近端。","C":"心電圖顯示已併發二度二房室傳導阻滯。","D":"需進行右側心電圖與後側心電圖檢查。"},"answer":"D","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/2501.png"},{"id":2502,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"一名70歲男性病人，過去病史有COPD，因突發性胸悶及呼吸困難而求救，你到現場發現病人呼吸急促，似乎快要窒息。下列敘述及處置，何者最為適當？","options":{"A":"若評估病人有心衰竭症候，到院前給予霧化氣管擴張劑吸入對病人沒有幫忙。","B":"呼吸速率愈快，病人嚴重程度愈高。","C":"若出現鼻翼搧動或是明顯的頭部上下移動伴隨急促呼吸，即表示病人呼吸動力不足。","D":"若病人意識混亂或昏迷即表示病人嚴重缺氧，應儘速給予高濃度氧氣。"},"answer":"C","manualChapter":"呼吸急症"},{"id":2503,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列情形皆可能引發抽搐現象(seizure - like movements)，但何者為非？","options":{"A":"頭部外傷head injury。","B":"藥物戒斷drug withdraw。","C":"慢性偏頭痛migraine。","D":"心室顫動ventricular fibrillations。"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2504,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"病人低血氧的原因可以來自通氣與灌流的配對異常。請問如右圖所示的通氣／灌流異常，是下列哪一個疾病的機轉？","options":{"A":"氣喘。","B":"肺栓塞。","C":"肺水腫。","D":"一氧化碳中毒。"},"answer":"B","manualChapter":"CH14","matchedChapters":["NeedImage"],"image":"題庫圖片/2504.png"},{"id":2505,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"美國心臟醫學會與中風醫學會提出的「腦中風病人的存活復原之鏈(stroke chain of survival and recovery)」7D，與119有關的“D”，不包括？","options":{"A":"Detection：教導民眾及時判斷腦中風的前兆。","B":"Dispatch：派遣緊急救護系統，事先通知送至醫院。","C":"Door：119快速到達病人家門、執行辛辛那提與黃金時間判斷。","D":"Delivery：119快速將病送達適當醫院的急診處。"},"answer":"C","manualChapter":"CH36"},{"id":2506,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列症狀或徵象都可能暗示病人有心包膜填塞，但何者為非？","options":{"A":"貝克氏三症狀(Beck's triad)。","B":"脈搏壓變窄且深呼吸時脈搏變弱。","C":"12導程心電圖出現電氣交替現象。","D":"吸氣收縮壓上昇與吐氣時收縮壓下降的奇脈現象。"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2507,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"白血病又稱「血癌」，可以分成四類，其中最常發生在年幼兒童身上的是哪一種？","options":{"A":"急性淋巴性白血病(ALL)。","B":"慢性淋巴性白血病(CLL)。","C":"急性骨髓性白血病(AML)。","D":"慢性骨髓性白血病(CML)。"},"answer":"A","manualChapter":"CH39"},{"id":2508,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"救護技術員載送已知診斷的下列病人時，應該要配戴N95口罩，但何者除外？","options":{"A":"水痘。","B":"麻疹。","C":"流行性感冒。","D":"開放性肺結核。"},"answer":"C","manualChapter":"CH42"},{"id":2509,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"呼吸疾病可以因為通氣、擴散或灌流問題引起。下列疾病皆是「擴散」問題，但何者除外？","options":{"A":"氣喘。","B":"肺水腫。","C":"肺纖維化。","D":"一氧化碳中毒。"},"answer":"A","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":2510,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"急性闌尾炎的典型臨床表徵為：食慾變差、噁心與右下腹痛點。請問此痛點的醫學名稱為？","options":{"A":"Morrison point。","B":"McBurney point。","C":"Charcot point。","D":"Zollinger-Ellison point。"},"answer":"B","manualChapter":"CH38","image":"題庫圖片/2510.png"},{"id":2511,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"根據ACLS 2015建議，提高社區猝死病人(OHCA)存活率的方法，不包括？","options":{"A":"請高風險病人家中購置自動體外去顫器(AED)以備不時之需。","B":"請119派遣中心在電話線上指導報案者作只壓胸的CPR。","C":"請119派遣中心善用社群軟體召喚週遭民眾協助CPR與取得AED。","D":"將OHCA病人儘量送到專責的猝死救治中心(cardiac arrest center)。"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2512,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"根據ACLS 2015建議，病人被插入氣管內管後要確認位置的方法，不包括？","options":{"A":"五點聽診(auscultations)。","B":"潮氣末二氧化碳監測(ETCO2)。","C":"超音波(ultrasound)。","D":"胸部X-光(CXR)。"},"answer":"D","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":2513,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"第十版ATLS提及外傷傷者初步評估有六大危及生命之傷害，下列何者為非？","options":{"A":"氣管支氣管傷害(Tracheobroncheal tree injury)。","B":"開放性氣胸(Open pneumothorax)。","C":"連枷胸合併肺挫傷(Flail chest and pulmonary contusion)。","D":"心包膜填塞(Cardiac tamponade)。"},"answer":"C","manualChapter":"CH27"},{"id":2514,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列敘述有關於張力性氣胸的描述，何者為非？","options":{"A":"張力性氣胸傷者，血氧濃度持續無法改善，不建議立即插氣管內管治療。","B":"頸靜脈怒張、單側呼吸音減弱或消失、及氣管偏移到對側可以強烈懷疑張力性氣胸。","C":"第十版ATLS建議成人張力性氣胸針刺減壓位置為第五肋間腋中線前方。","D":"身體評估會發現休克、頸靜脈怒張、以及模糊的心音。"},"answer":"D","manualChapter":"CH28"},{"id":2515,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"根據美國外科醫學會外傷委員會之現場檢傷指引，下列何者最應該直接送至創傷中心？","options":{"A":"懷孕36週之孕婦，騎摩托車不慎和摩托車發生擦撞，肚子疼痛，可自行站立。","B":"未戴安全帽頭部撞到的地上的50歲男子，現場GCS14分。","C":"汽車相撞後，被困於車內的駕駛，現場花了將近十分鐘才脫困。","D":"工地工人，未做好防護措施，從三公尺高之鷹架跌落。"},"answer":"A","manualChapter":"CH49"},{"id":2516,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"45歲男性，於地震中受困於倒塌的建築物，經過數小時後，救援隊到達現場，現場血壓70/40mmHg、心跳115/分，左大腿開放性骨折、右大腿腫脹變形、且雙下肢都對疼痛無感覺，下列敘述何者較適當？","options":{"A":"雙大腿骨折不會是造成患者休克的原因，需再評估是否有其他內出血。","B":"因雙大腿都懷疑有骨折情形，加上血壓偏低，建議使用抗休克褲來改善休克。","C":"開放性骨折處應嘗試加以復位再包紮，以免搬運時造成二次傷害。","D":"患者可能已出現腔室症候群，需考慮執行筋膜切開術。"},"answer":"D","manualChapter":"CH30"},{"id":2517,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"你接獲派遣令到火災現場進行救護，救出的男子，年約五十歲，左上臂以及背部約一半的範圍出現了二度以上的燒傷，但肢體仍可活動，意識清楚，講話聲音略帶沙啞，著急著想要回到房屋內搶救他心愛的狗，現場血壓120/60mmHg、心跳120下/每分鐘、呼吸速度約24下每分鐘，血氧92%，下列敘述何者最正確？","options":{"A":"患者血氧92%、呼吸偏快；建議給予鼻導管供給氧氣至血氧94%以上。","B":"根據九的法則(Rule of Nines)患者燒灼傷範圍超過20%，應送至燒傷中心處置。","C":"患者心跳偏快，應在患者雙上臂各建立一條靜脈輸液管路，進行輸液。","D":"如果患者臉上有碳粒、鼻毛有燒焦情形，可預防性先置入氣管內管。"},"answer":"D","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":2518,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列關於脊椎損傷的敘述，何者最適當？","options":{"A":"所謂脊髓性休克，指的是因胸椎或頸椎傷害造成的低血壓、週邊血管擴張之休克。","B":"交感神經過度反射症候群常見於低位脊髓損傷，與交感神經興奮、腎上腺素大量釋放有關。","C":"中央脊髓症候：通常是因為頸椎過度伸展所造成，下肢的麻木和無力感會比上肢嚴重。","D":"脊髓半切症候：症狀為受傷同側的運動功能喪失，受傷對側痛、溫覺喪失。"},"answer":"D","manualChapter":"CH27"},{"id":2519,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"50歲機車騎士與轎車發生車禍，送至急診室，到院時呼吸困難，血氧80%，血壓70/50mmHg，右胸有大片瘀青，聽診發現右側呼吸音減弱，經初步評估後，發現右側張力性氣胸，經細針減壓以及右側胸管置入後引流出大量氣體，血壓上升回復到90/70mmHg，血氧上升到94%；呼吸狀況也改善，過五分鐘後，突然該患者又再度呼吸困難、血壓下降至70/50mmHg，此時該如何處置最適當？","options":{"A":"可能是胸管引流功能變差，須再放置一條胸管。","B":"重新追蹤胸部X光看管路位置是否正確。","C":"因生命徵象不穩定，應重新進行初級評估。","D":"安排電腦斷層確定是否有大量血胸或腹內出血。"},"answer":"C","manualChapter":"創傷"},{"id":2520,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"25歲男性與人鬥毆後，在左胸被插入一水果刀，救護人員到達現場時，現場已被警察控制，接觸患者，發現刀子還插在胸前，患者意識清楚，橈動脈摸得到，血壓100/80mmHg、心跳115下/分，最近的急救責任醫院路程約15分鐘，下列何者敘述最適當？","options":{"A":"警察表示要取下刀子作為證物，在現場須將刀子取下避免破壞物證。","B":"即使患者橈動脈摸得到，也有休克可能，必須考慮建立靜脈管路。","C":"如果患者出現頸靜脈怒張，需懷疑張力性氣胸，盡快給予針刺減壓。","D":"胸腔創傷的傷者，建議及早正壓給氧，避免患者因缺氧而昏迷。"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2521,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"44歲男性傷者在與朋友飲酒後爭吵，跟對方打架，右手臂被酒瓶及刀子割傷，現場地上殘留大量鮮血，並持續噴血，指揮中心救護人員到現場，現場傷者臉色蒼白冒冷汗，意識對痛有反應，脈搏每分鐘140下，血壓80/50mmHg，呼吸每分鐘30次，現場離醫院為半小時車程，關於此傷者之處置，下列敘述何者為是？","options":{"A":"應立即以止血帶包紮傷者右手臂止血，但是避免組織缺氧到院前應定時鬆開。","B":"止血帶不建議使用兩條以上，避免增加組織壞死機會。","C":"盡量避免在衣物上直接打止血帶。","D":"目前因為止血帶止血功能良好，建議第一線使用。如果沒有，用三角巾代替效果也很好。"},"answer":"C","manualChapter":"CH25"},{"id":2522,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"在各種創傷嚴重度評估指數中，改良式創傷指數( RTS )與創傷嚴重度分數( ISS )是臨床上預測傷者存活率重要參考。請問下列傷者存活率最高的是？","options":{"A":"RTS分數高且ISS分數高的傷者。","B":"RTS分數高且ISS分數低的傷者。","C":"RTS分數低且ISS分數高的傷者。","D":"RTS分數低且ISS分數低的傷者。"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2523,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"年輕男性傷者騎機車自摔。您到達現場時，傷者因為意識混亂疑似酒駕，拒絕送醫，但身上無明顯外傷，呼吸每分鐘30下，脈搏每分鐘140下，血壓100/50mmHg，血氧測值：93％；請問下列那些徵兆，可能代表傷者有腹內出血？","options":{"A":"傷者腹部視診時腹脹、並出現鼓脹的腹部表淺靜脈。","B":"傷者腹部扣診為鼓音，並且肚子脹痛。","C":"傷者腹部聽診發現幾乎沒有腸音，並且偶有金屬聲。","D":"傷者腹部觸診時腹部僵直、有反彈痛。"},"answer":"D","manualChapter":"CH29"},{"id":2524,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"二十歲男性，機車騎士與砂石車擦撞後倒地，你到現場發現他全身多處有肢體骨骼的創傷，關於肢體骨骼創傷的潛在風險描述，以下何者敘述何者為是？","options":{"A":"右小腿腫脹且異常疼痛，此現象是屬於潛在危及生命的肢體創傷。","B":"左前臂撕裂傷，傷口處可見骨頭，此現象是屬於潛在危及生命的肢體創傷。","C":"雙側大腿腫脹變形，此現象是屬於潛在危及生命的肢體創傷。","D":"右膝關節脫臼，右足呈現垂足(drop foot)，此現象是屬於潛在危及生命的肢體創傷。"},"answer":"C","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":2525,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"四十歲男性，遭巨石壓傷左小腿已經超過五小時無法脫困，你到現場協助處治，以下有關該傷者的處置敘述何者為非？","options":{"A":"因肢體或身體長期受到壓迫，導致受傷肌肉釋放毒性物質，引起急性腎衰竭。","B":"症狀可能有患肢癱瘓和深色的小便等。","C":"需密切監測生命徵象，每小時檢查尿量及尿液pH值。","D":"血液檢查，常可見代謝性酸中毒、低血鉀、高血鈣。"},"answer":"D","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":2526,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"50歲女性騎機車與小客車擦撞，到院時經評估無頸椎及呼吸道問題，意識清楚，右大腿明顯腫脹變形。血壓80/40 mmHg，脈搏130/min，血氧濃度為95%。經輸液林格氏液1000ml後，血壓60/30 mmHg，脈搏140/min，意識混亂。接下來的臨床思考及處置何者較為適當？","options":{"A":"傷者出血量估計約為全身血量的15-30%左右。","B":"盡快幫傷者備血，選擇輸注經交叉配對的血液，以免因輸血造成傷者過敏。","C":"安排其他檢查，積極尋找出血的原因，傷者可能不是只有右大腿骨折。","D":"需考慮敗血性休克，盡速給予抗生素治療。"},"answer":"C","manualChapter":"創傷"},{"id":2527,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"30歲女性，懷孕30週，騎機車與小客車擦撞，你到現場發現她全身多處有擦傷，右下肢腫脹變形，主訴腹部疼痛。初步生命徵象:意識清楚，血壓100/40 mmHg，脈搏95/min，血氧濃度為99%。胎兒脈搏經胎心音機器監測為170/min。關於孕婦創傷的處置，下列敘述何者較為適當？","options":{"A":"一般創傷治療的優先順序與未懷孕者是不同的，到達現場確認環境安全後，需要優先評估胎兒的狀況。","B":"此傷者尚未出現低血容休克狀況，研判出血量不多，應該盡速上車後送。","C":"血氧狀況良好，不需要規則性給氧氣，以免造成孕婦肺部容易纖維化。","D":"該名傷者懷疑有腹腔內出血，可以執行腹腔電腦斷層檢查(高放射線劑量)。"},"answer":"D","manualChapter":"CH49"},{"id":2528,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列有關脊椎外傷敘述，何者為是？","options":{"A":"目前的臨床實證都支持，只要有脊髓損傷疑慮時，就需要固定。","B":"針對穿刺傷傷者，頸圈固定可能會增加死亡率。","C":"一旦確認頸椎受傷，就需要使用長背板協助固定，直到外科手術矯正後。","D":"懷疑頸椎受傷傷者，若頸部X-光片顯示無明顯骨折就可以排除受傷。"},"answer":"B","manualChapter":"CH27"},{"id":2529,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"該車司機被脫困救出後，您發現他的外觀上半身發紺、眼睛結膜下出血、臉部很腫。外觀如下圖。請問最有可能的診斷是？","options":{"A":"顱內出血。","B":"張力性氣胸。","C":"外傷性窒息。","D":"心包膜填塞。"},"answer":"C","manualChapter":"CH28","matchedChapters":["NeedImage"],"image":"題庫圖片/2529.png"},{"id":2530,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"第十版ATLS所做的外傷急救方式更新，建議出血性休克時要有允許性低血壓(permissive hypotension)的概念。關於此概念的說明，何者正確？","options":{"A":"對於穿刺傷傷者若運送路程短(<30分鐘)且意識清楚橈動脈摸得到，不建議常規給予到院前輸液。","B":"對於評估後需要給予到院前輸液的傷者，則是以重複給予1公升輸液後再評估的方式，直到收縮壓90~100mmHg。","C":"出血性休克合併腦外傷的60歲傷者，目標血壓建議收縮壓維持≧ 110mmHg。","D":"出血性休克合併腦外傷的70歲傷者，目標血壓建議收縮壓維持≧ 100mmHg。"},"answer":"A","manualChapter":"CH26"},{"id":2531,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"年輕孕婦懷孕40週，突然感到嚴重呼吸困難而打119求救。你到現場，發現她有發紺、胸痛及休克現象，似乎快要窒息。此時急救處置的正確作法是？","options":{"A":"若量到她血壓偏低，建議以休克病患之頭低腳高方式運送。","B":"若有需要插管，應該選用口徑較大的氣管內管(例如7.5#或8#)。","C":"為增加母親心輸出量，應該要左側躺或進行子宮左推手勢。","D":"為了胎兒預後，若母親心跳停止，應該在心跳停止的二十分鐘內產出胎兒。"},"answer":"C","manualChapter":"CH49"},{"id":2532,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"一名3歲大的兒童有癲癇病史，這幾天感冒高燒不退。病童突然失去意識。你到現場發現他眼睛上吊，右臉與右手右腳不斷抽動，臉色有發紺現象。家屬說已經這樣抖動15分鐘了。此時下列急救處置何者最應優先執行？","options":{"A":"打上週邊靜脈並給予適當劑量的Midazolam。","B":"從病童肛門塞入退燒塞劑。","C":"插入適當大小的鼻咽呼吸道並給予正壓呼吸。","D":"請家屬從病童嘴巴灌入平常服用的抗癲癇藥物。"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":2533,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"有關小兒存活之鏈(Chain of Survival)的施救步驟，下列何者順序正確？(1)啟動緊急應變系統(EMS) (2)施行高級小兒救命術(3)心跳停止後的復甦照顧(4)盡快給予電擊(5)立即給予高品質CPR (6)預防","options":{"A":"1  2  4  3  6。","B":"1  5  4  2  3。","C":"6  1  5  2  3。","D":"6  5  1  2  3。"},"answer":"D","manualChapter":"CH48"},{"id":2534,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"面對到院前心跳停止的兒童，若需使用骨針建立給藥途徑，請問骨針施打部位，下圖何處最為正確？","options":{"A":"A。","B":"B。","C":"C。","D":"D。"},"answer":"B","manualChapter":"CH32","matchedChapters":["NeedImage"],"image":"題庫圖片/2534.png"},{"id":2535,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列狀況，何者最能解釋這張心電圖的變化？","options":{"A":"急性心肌梗塞。","B":"毛地黃中毒。","C":"腦出血(腦壓上升)。","D":"低體溫。"},"answer":"D","matchedChapters":["需要圖片"],"manualChapter":"CH33","image":"題庫圖片/2535.png"},{"id":2536,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"請問關於低體溫，以下何者為是？","options":{"A":"低體溫病患，呼吸與脈博不易評估，因此應評估脈搏30-45秒。","B":"凍瘡之合適處置，應該儘快乾熱回溫。","C":"竇性心博過緩之低體溫患者，應立即使用心臟節律器。","D":"一般中心體溫低於30度C以下，應該優先給與心血管藥物，緊急治療。"},"answer":"A","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":2537,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"請問關於影響溺斃病患預後之因素，以下何者為非？","options":{"A":"水溫。","B":"溺水時間長短。","C":"乾溺或溼溺。","D":"水的乾淨度。"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2538,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"高山症預防藥物，請問以下何者不適合？","options":{"A":"丹木斯(Diamox)。","B":"類固醇。","C":"乙型阻斷劑。","D":"威而剛。"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"explanation":"威而鋼（Sildenafil）與犀利士（Tadalafil）用於高海拔肺水腫（HAPE）的預防或輔助治療，對急性高山病（AMS）或高海拔腦水腫（HACE）完全沒有治療效果"},{"id":2539,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"關於溺水的治療，下列敘述何者為是？","options":{"A":"儘早使用類固醇可改善預後。","B":"使用哈姆立克法，有助於將水分自肺部排出。","C":"無論何種溺水機轉，都應例行性頸椎固定。","D":"神智清楚且血氧飽和度≧ 95%的溺水病人，仍應建議到醫院檢查。"},"answer":"D","manualChapter":"CH44"},{"id":2540,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列有關人體調節熱散失的敘述，下列何者為是？","options":{"A":"血管是調節熱散失最重要的器官。","B":"液體蒸發時，周圍的溫度以及相對濕度不會影響蒸發散熱的效率。","C":"散熱的主要機轉：輻射、傳導、對流以及蒸發。","D":"在外界溫度比人體溫度高的時候，人體主要的散熱機轉為輻射。"},"answer":"C","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":2541,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列有關潛水相關急症的敘述，何者為是？","options":{"A":"壓力創傷(Barotrauma)為水肺潛水員最常見的傷害，與之相對應的物理定律為亨利定律。","B":"減壓病是因為氧氣氣泡產生在組織之間所導致，與之相對應的物理定律為波以耳定律。","C":"造成潛水人員死亡的主要原因是空氣栓塞，與之相對應的物理定律為道耳頓定律。","D":"減壓病又叫潛水夫病，與之相對應的物理定律為亨利定律。"},"answer":"D","manualChapter":"CH44"},{"id":2542,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"中年男子在海邊釣魚時，遭到釣上來的魟魚尾巴毒刺刺傷右手掌。你到現場發現他臉色蒼白冒冷汗，有休克現象，右手掌以及右前臂疼痛難當，血壓為80/60 mmHg，其餘生命徵象正常。關於該病人處置，以下敘述何者為是？","options":{"A":"這個病人是過敏性休克，應該要線上醫療指導請求給予epinephrine 0.5 mg靜脈注射。","B":"病人應該給予靜脈注射，但輸液量不宜太多，以免對心臟造成負擔。","C":"右手掌以及右前臂的疼痛，可以將患肢浸泡在超過攝氏40度的溫水，以緩解疼痛。","D":"若可見毒刺，切勿將其移除，以免造成大出血。"},"answer":"C","manualChapter":"CH50","explanation":"魟魚毒刺毒素對熱不穩定，將患肢浸泡在超過40°C（最好45°C）的溫水中，可使毒素失去活性並緩解劇烈疼痛，選C正確。\n病患的休克更可能是因劇烈疼痛引起的迷走神經反應（神經性休克），而非過敏性休克，不應直接給epinephrine靜脈注射；應適當輸液治療休克，無需特別限制；若毒刺可見且不在血管附近，可嘗試小心移除以減少持續毒素釋放。\n技巧：魟魚毒＝熱水浸泡（>40°C）可緩解疼痛，是考試常出現的急救方法。"},{"id":2543,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"在大型活動，關於醫療站設站計畫的原則，下列何者正確？","options":{"A":"醫療站的地點選擇以遮蔽場所為佳，位置最好在短時間內可到達所有活動區域。","B":"緊急醫療救護的規劃，應從活動開始那一刻，直到活動結束那一刻。","C":"醫療站型式有固定式或移動式。通常有固定式的醫療站，就不需要移動式的醫療站。","D":"醫療站內停留時間很短，不需要醫療紀錄單。只要有病患姓名，登記人數報備即可。"},"answer":"A","manualChapter":"CH54"},{"id":2544,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"關於事故指揮系統(ICS)計劃部門的功能，下列何者為非？","options":{"A":"提供現況報告。","B":"徵詢專家意見。","C":"協助制定事故執行計劃。","D":"保存災害復原記錄與損害記錄。"},"answer":"D","manualChapter":"CH52"},{"id":2545,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"關於毒化災現場傷患緊急處理，下列何者為非？","options":{"A":"污染傷口應先清洗，再以防水敷料包紮。","B":"傷患除污，應在設置於暖區的除污走廊內進行。","C":"呼吸衰竭傷患，應於熱區插管後，再送至暖區除污。","D":"眼睛受污染傷患，可以大量生理食鹽水用沖眼器沖洗。"},"answer":"C","manualChapter":"CH53"},{"id":2546,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"關於生物恐怖事件發生的線索，下列敘述何者為非？","options":{"A":"同時出現大量死亡個案。","B":"出現非本土流行之感染症。","C":"常見感染症出現在不尋常季節。","D":"同時出現許多相同症候群病患，尤其是抵抗力較差的老人或小孩。"},"answer":"D","manualChapter":"CH53"},{"id":2547,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"地震所引起的傷亡是多方面的。下列有關地震所引起的創傷與非創傷病情之描述，何者為非？","options":{"A":"大部份的創傷病患都只是小挫傷或是撕裂傷。","B":"其次常見的創傷病患是骨折與關節扭傷，很多是不需要手術治療的。","C":"地震所引起大量死亡的屍體沒有清理，是地震後疫病的來源。","D":"有相當大量之非創傷病患也會發生，例如：急性心肌梗塞、高血壓或是糖尿病的惡化或併發症的發生。"},"answer":"C","manualChapter":"CH56","matchedChapters":["CH56"]},{"id":2548,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"88風災後，屏東縣萬丹鄉多處水患，爆發台灣有紀錄以來最大規模鉤端螺旋體病大流行。關於感染鉤端螺旋體症狀之描述，下列何者正確？","options":{"A":"屬於人畜共通感染病，主要宿主有鼠、犬、豬、牛、羊等動物，也常見人與人間直接傳染。","B":"無黃疸性鉤端螺旋病，會出現發燒、頭痛、肌肉痛、腹痛、腹瀉、結膜充血，死亡率相當高。","C":"黃疸性鉤端螺旋病，以高燒、黃疸、急性腎症衰竭、血液凝固異常、及多重器官衰竭表現。","D":"鉤端螺旋體可經由糞便排除達一個月或更長，因此病患的糞便須小心處理。"},"answer":"C","manualChapter":"CH43"},{"id":2549,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"下列有關START檢傷法的描述，何者為非？","options":{"A":"鈍傷的傷病患適用於START檢傷法。","B":"八仙樂園粉塵暴燃事件的傷病患，若使用START檢傷法，則不是那麼準確。","C":"郵輪觸礁的落海旅客，所受傷害除了創傷之外，也會受到低體溫和嗆入的傷害。這時候使用START檢傷法很可能不準確。","D":"爆炸造成穿刺傷為主的大量傷患，以及化災的大量傷病患，也都適用於START檢傷法。"},"answer":"D","manualChapter":"CH52"},{"id":2550,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"大型事故應變時，關於事故指揮系統的敘述，以下何者為是？","options":{"A":"後勤部門應設立待命區，現場剛報到而尚未指派任務的救護人員和器材，應該先在該區待命。","B":"後勤部門也該有服務功能，譬如工作人員受傷時，後勤醫療組應提供相關的醫療服務。","C":"執行部門通常是事故現場最後成立的部門，所謂謀定而後動，可避免後續事件擴大。","D":"執行部門在進行任務編組時，應確實掌握相同職類的人員才可以編成一組，以避免任務分派混淆。"},"answer":"B","manualChapter":"CH52"},{"id":2551,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"大量傷病患事件時，若依據START/JumpSTART檢傷法，對傷病患進行檢傷，下列何者為是？","options":{"A":"65歲男性，聽到你的呼喊，無法自行前往集合，但是可以望著你，揮揮手示意你過去攙扶他。你評估他呼吸每分鐘38次，給予判定為中傷。","B":"80歲女性，呼喊集合時，可以自行行走，但是眼神十分疲憊，你給予判定為中傷。","C":"7歲小男孩，爸爸抱著，無法自行行走，呼吸每分鐘32次，可以觸摸到脈搏，對你的叫喚有反應，判定為中傷。","D":"56歲男性，癱坐地上，呼吸每分鐘26次，微血管充填時間1秒，可以依指令舉起右手，判定為輕傷。"},"answer":"C","manualChapter":"CH52"},{"id":2552,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"處理輻射事故緊急災害時，下列何者為是？","options":{"A":"我國的輻射事故主管機關為行政院環境保護署。","B":"考量輻射劑量對人體的影響是持續累積的，除經驗豐富之救護人員外，其他人員應避免重複派往第一線執行救護。","C":"輻射傷害影響人體甚鉅，經常會發生立即性的傷害，症狀經常在輻射暴露後30分鐘內即可產生。","D":"災害現場，可以用輻射偵檢器檢測病患是否受到輻射物質汙染。如無輻射汙染，則以一般病患處理，無須除汙。"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2553,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"個人防護裝備的分級原則應用，以下敘述何者為是？","options":{"A":"A級防護具備氣密性，可提供最好的呼吸防護，火場也適用。","B":"A級防護若採供氣的呼吸設備(SABA)，則使用時間就可不受限制。","C":"消防隊員穿著工作服背負自給式的呼吸設備(SCBA)，可視為達成B級防護。","D":"醫院急診醫護人員通常只需達成C級防護。"},"answer":"D","matchedChapters":["CH53"],"manualChapter":"CH53"},{"id":2554,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"現場經過初步除污的毒化災傷患，在後送醫院時的注意事項，以下何者為是？","options":{"A":"情況緊急時，可以不通知後送醫院。","B":"運送人員需穿著C級或以上的防護設備。","C":"除頭髮外，病人應以被單包裹全身。","D":"運送後車輛若無明顯髒污，可直接進行其他救護任務。"},"answer":"B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2555,"source":"108年度EMTP筆試題目卷(100題)(含答案)(1090106修訂)","question":"某救護現場有輻射污染的疑慮。在除汙之後，輻射應變隊偵測傷患身上沒有輻射反應，以下敘述何者為是？","options":{"A":"該傷患應至少會出皮膚紅、噁心、嘔吐或發燒其中之一的症狀。","B":"上述症狀和現場輻射源強度沒有關係，症狀是否發作與機率有關。","C":"該傷患可確定不曾受到輻射影響。","D":"救護人員處理這樣的傷患，並不會因此受到輻射曝露。"},"answer":"D","manualChapter":"CH53"},{"id":2556,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於「到院前救護單位的派遣與反應模式」的敘述，下列何者正確？","options":{"A":"派遣員僅負責派車，不需提供到達前指導（pre-arrival instruction）。","B":"採用英美模式的國家，會由派遣中心進行檢傷並分流輕重症後再決定是否派車。","C":"現代化指揮中心應以「速度優先」為最高指導原則，盡快抵達現場。","D":"派遣員透過關鍵問題詢問與優先派遣系統，可分辨案件輕重緩急並提供適當協助。"},"answer":"D","manualChapter":"CH02"},{"id":2557,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"無人飛行載具（Unmanned Aerial Vehicles）運用於緊急醫療救護中的優勢，何者最不適當？","options":{"A":"快速部署。","B":"降低風險。","C":"成本效益。","D":"技術門檻低。"},"answer":"D","manualChapter":"CH10","matchedChapters":["CH10"]},{"id":2558,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"某地區近年推行「院前葉克膜（ECMO）啟動計畫」，主張對頑固性心室顫動（refractory VF）病人，在現場由救護技術員即時啟動葉克膜團隊，可顯著提升存活率。你查到《Lancet, 2020》ARREST Trial研究指出，該措施能提升存活率6倍，但《NEJM, 2023》INCEPTION Trial卻顯示無顯著差異。若你欲評估是否適用於你所在地區的EMS系統，應優先考量下列哪一項？","options":{"A":"該研究的P值是否小於0.05，代表具統計顯著性。","B":"研究採隨機控制試驗（Randomized Control Trial），因此結果可直接引用。","C":"研究族群與本地EMS病人特性及系統環境是否相似。","D":"研究使用的儀器品牌與本地不同，結果應不具參考性。"},"answer":"C","manualChapter":"CH11"},{"id":2559,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"下列何者不是台灣緊急醫療救護體系中醫療指導醫師的核心任務？","options":{"A":"主要負責消防局內部救護流程變更之核可與監督。","B":"透過對救護技術員的教育訓練與預立醫療流程訂定。","C":"針對救護技術員在現場的特殊狀況提供即時通訊支援與授權。","D":"透過救護紀錄表回顧與案例檢討，進行品質監測與改善。"},"answer":"A","manualChapter":"CH04"},{"id":2560,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"當病人意識不清、病況危急時，執行救護行為時，依照《里斯本宣言》：「除非病人曾有明確的表達，否則在危急的狀態，法定代理人不可得時，可將病人的同意視為當然。」，下列社會責任的歸屬何者最適當？","options":{"A":"尊重權益。","B":"自由選擇權。","C":"公衛責任。","D":"公平正義。"},"answer":"A","manualChapter":"CH03"},{"id":2561,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"在面對緊急救護過程中的倫理困境時，下列哪一項做法最符合「倫理議題的解決」原則？","options":{"A":"立即依個人判斷行動，事後再向同事或醫療指導人員報告。","B":"參考過去類似經驗、請教同事或醫療指導，並透過無私試驗、普及試驗與答辯試驗評估決策。","C":"儘量遵從病人家屬意見，不需考慮救護技術員的專業判斷。","D":"在救護過程中避免任何決策，以防承擔倫理責任。"},"answer":"B","manualChapter":"CH04"},{"id":2562,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"醫事警消等人員因執行業務意外暴露愛滋病毒之處理流程建議，下列敘述何者最不適當？","options":{"A":"針扎後應以肥皂及水清潔傷口，並於24小時內向工作單位通報。","B":"病人體液接觸到眼睛應沖水，並於24小時內向工作單位通報。","C":"於發生暴露後須於1週內將「醫事、警消等人員因執行業務意外暴露愛滋病毒通報單」送所在地衛生局備查。","D":"預防性投藥要愈早愈好，若已超過72小時，則無預防性投藥之必要。"},"answer":"D","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":2563,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"救護技術員在出勤時接獲報案，現場一名45歲男性在家中服用大量安眠藥，但仍有呼吸與意識反應。其妻表示，近來他常抱怨「工作壓力太大、活得沒意思」，並曾搜尋上吊與燒炭的資料。依據自殺相關名詞的區分，該病人目前的行為最接近下列何者？","options":{"A":"自殺意念。","B":"自我傷害。","C":"自殺企圖。","D":"自殺死亡。"},"answer":"C","manualChapter":"CH06"},{"id":2564,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"醫療優先派遣是目前有醫學實證的解決方案之一，它是一個提供派遣員使用的標準化流程，下列何者並非其流程的一部分？","options":{"A":"溝通（Communication）。","B":"派遣（Dispatch）。","C":"指導（Instruction）。","D":"詢問（Interrogation）。"},"answer":"A","manualChapter":"CH07"},{"id":2565,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"消防署在2015年辦理了派遣員協助指導心肺復甦術訓練課程，並於2018年建立品管評量指標如下，何者最不適當？","options":{"A":"所有報案電話的OHCA辨識比率：設定指標為50%。","B":"可接觸之報案電話的OHCA辨識比率：設定指標為80％。","C":"辨識出OHCA之報案者接受DA-CPR的壓胸比率：設定指標為60％。","D":"電話報案後至辨識出OHCA時間的中位數：＜120秒。"},"answer":"A","manualChapter":"CH07"},{"id":2566,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"品質管理分析中有常見的七種分析方式，以下何者最不適當？","options":{"A":"魚骨圖。","B":"柏拉圖。","C":"甘特圖。","D":"層別法。"},"answer":"C","manualChapter":"CH09","explanation":"品質管理常見七大工具（QC七大手法）包含：魚骨圖（特性要因圖）、柏拉圖（Pareto chart）、查檢表、散佈圖、直方圖、管制圖及層別法。「甘特圖（Gantt chart）」是專案管理進度工具，不屬於QC七大手法。\n記憶技巧：QC七工具記憶口訣——魚柏查散直管層，甘特圖是專案排程工具非品管工具。"},{"id":2567,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於心臟傳導系統的敘述，下列何者正確？","options":{"A":"正常情況下，心臟的電氣傳導始於房室結。","B":"正常情況下，心跳速率由普金吉氏纖維主導。","C":"心搏過速可能是因為心臟存在額外的傳導路徑。","D":"心電圖中的P波代表心室去極化。"},"answer":"C","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":2568,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於人體神經系統的解剖分類及其主要功能分區，下列敘述何者最適當？","options":{"A":"中樞神經系統由腦幹和12對腦神經組成，主要負責將感覺訊息傳入並處理。","B":"周邊神經系統包含31對脊神經，負責將運動指令傳達到肌肉或腺體產生動作。","C":"傳出分支包括體神經系統和自主神經系統，提供隨意與不隨意的控制。","D":"自主神經系統主要由乙醯膽鹼和腎上腺素組成，控制隨意肌的收縮。"},"answer":"C","manualChapter":"CH12"},{"id":2569,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"人生不同時期會面臨不同階段的心理變化，也會影響我們對於該傷病患應採取的照護模式；下列關於不同時期的傷病患照護的相關敘述，何者最為適當？","options":{"A":"在評估九個月大哭鬧不安的女嬰時，應暫時區隔父母與小孩讓幼童能平靜下來接受評估。","B":"當三歲大男童通報外傷時，適度觀察父母婚姻、經濟情況有助於評估兒虐風險之高低。","C":"十六歲少女主訴腹痛合併噁心，在病史詢問時建議邀請父母在側才能正確了解月經週期。","D":"七十歲女性院前心跳停止，現場建議與伴侶簡單解釋，安撫支持會導致伴侶更難走出傷痛。"},"answer":"B","manualChapter":"CH13","matchedChapters":["CH13"]},{"id":2570,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"對於一位蜂螫嚴重過敏反應的OHCA的患者上，在你準備插管時請以HEAVEN法則判斷哪一個較符合？","options":{"A":"出血。","B":"困難解剖構造。","C":"頸部活動受限。","D":"低血容。"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":2571,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"肺臟通氣（V:Ventilation）與灌流（Q:Perfusion）對於身體組織是否可得到足夠的氧氣有很大的關係，一個正常的人V除以Q值（V/Q）約略等於0.8，試問下列疾病如果發生在同一個人身上（非同時發生），其V/Q值由大到小為下列哪一個選項？甲：氣喘、乙：過度換氣、丙：肺栓塞、丁：氣管異物梗塞","options":{"A":"丁>甲>乙>丙。","B":"丙>甲>乙>丁。","C":"甲>丁>乙>丙。","D":"丙>乙>甲>丁。"},"answer":"D","manualChapter":"CH35"},{"id":2572,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於快速程序插管(RSI)的步驟6P，下列敘述何者錯誤？","options":{"A":"在「前置給藥」步驟，給予Lidocaine可防止顱內壓升高。","B":"在「給藥使病人麻痺」步驟，若血氧濃度分析儀低於90％，則必須停止輔助呼吸。","C":"在「給藥使病人麻痺」步驟，會先給鎮定劑再給肌肉麻痺劑。","D":"在「前置給氧」步驟，建議將血氧濃度拉升至盡可能接近100％。"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":2573,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"80歲男性，過去病史為咽喉癌患者經放射線治療術後、病態性肥胖，今天早上家屬發現病人口吐鮮血，意識變差，使用非再吸入型面罩可維持在血氧100%但病患呼吸極為緩慢，你評估此病患已進展至呼吸衰竭，經聯絡醫療指導醫師，同意於現場執行氣管內管插管。請問下列哪一項處置方式對此病患順利完成氣管內管置入的幫助最少？","options":{"A":"SALAD（Suction assisted laryngoscopy airway decontamination）技術。","B":"影像喉頭鏡。","C":"快速氧氣沖洗（Flush O 2）。","D":"斜坡擺位（ramp position）。"},"answer":"C","manualChapter":"CH35"},{"id":2574,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於管制藥品使用及管理的敘述，何者最不適當？","options":{"A":"管制藥品減損時，管理人應於一個月內報請當地衛生主管機關查核。","B":"管制藥品使用後，必須於救護紀錄表詳細記載，由醫療指導醫師簽核。","C":"常使用於鎮靜的Ketamine為第三級管制藥品。","D":"常使用於止痛的Tramadol為第四級管制藥品。"},"answer":"A","manualChapter":"CH16"},{"id":2575,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"病人因胸悶痛叫救護車，使用NTG舌下含片後出現劇烈頭痛與血壓下降，你應懷疑下列何者最適當？","options":{"A":"病人出現過敏反應。","B":"副交感神經被抑制。","C":"血管擴張過度造成顱內壓下降。","D":"硝酸鹽藥物導致顱內血管擴張。"},"answer":"D","manualChapter":"非創傷"},{"id":2576,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於藥物給予及給藥途徑，下列敘述何者錯誤？","options":{"A":"當理學檢查發現要施打IV部位有硬化、紅腫熱痛時，應考慮換部位施打。","B":"IV應避免施打在乳癌病患接受淋巴移除手術之患側肢體。","C":"糖尿病病人，IV應該避免打在下肢。","D":"當病人有休克徵象，應選用較大號數的IV針頭。"},"answer":"D","manualChapter":"CH16"},{"id":2577,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"根據Szasz與Hollender提出的三種醫病互動模式，下列何者最適合應用於慢性疾病（譬如：高血壓、糖尿病）的照護情境？","options":{"A":"主動—被動模式（Active–Passive Model）。","B":"指導—合作模式（Guidance–Cooperation Model）。","C":"共同參與模式（Mutual Participation Model）。","D":"父母—嬰兒模式（Parent–Infant Model）。"},"answer":"C","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":2578,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"OHCA急救現場家屬情緒激動，哭喊要求馬上送醫並大聲指責救護員動作太慢。若要應用HARD溝通策略，以穩定家屬情緒並爭取後續急救時間，以下哪一項回應最適當地體現HARD溝通策略中的「A：承認（Acknowledge）」步驟？","options":{"A":"「我們在幫他急救，請配合讓我們儘快送醫，現場不適合討論」。","B":"「我知道你現在非常難過，如果我是你，我也會覺得很焦急」。","C":"「我了解急救的重要性與急迫性，我們是依照標準作業程序處理，做好病人的評估和處置是我的專業」。","D":"「你這樣只會妨礙我們工作，請讓開讓我們好好做事」。"},"answer":"B","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":2579,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"下列哪個病人對於症狀加劇或緩解因素的描述，最符合心包膜炎（pericarditis）的臨床表現特徵？","options":{"A":"胸痛常在運動、飲食、或置身於寒冷環境中誘發。","B":"疼痛常會因為深吸氣而加劇。","C":"舌下含片治療後，胸痛會緩解。","D":"躺臥時會加劇胸痛的症狀，而身體前傾或坐姿時可緩解。"},"answer":"D","manualChapter":"CH19"},{"id":2580,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"一位病人以發燒合併右肩酸痛作為主訴，在身體診察中未發現肩部有明顯局部異常。依據體表轉移痛（referred pain）的概念，在鑑別診斷中，應優先考慮下列哪個內臟器官的病變可能性？","options":{"A":"心臟。","B":"胰臟。","C":"肝膽。","D":"腎臟。"},"answer":"C","manualChapter":"CH20"},{"id":2581,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"腹部視察與特殊觸診徵象（abdominal physical signs）可協助判斷病因部位與急重症類型，操作右上腹按壓時，患者因疼痛而無法深吸氣的特殊腹部徵象，何者最適當？","options":{"A":"洛辛氏徵象（Rovsing’s sign）。","B":"莫菲氏徵象（Murphy’s sign）。","C":"腰大肌徵象（Psoas sign）。","D":"麥氏點壓痛（McBurney’s point）。"},"answer":"B","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":2582,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於醫用超音波（Medical Ultrasound）的基礎原理，下列敘述何者最適當？","options":{"A":"聲波發射頻率越高，其波長越長，對於深部組織的穿透力較佳。","B":"聲波發射頻率越低，其波長越短，對於淺層組織的解析度越好。","C":"醫用超音波是一種會產生輻射線（Radiation）的侵入性檢查工具。","D":"到院前超音波檢查多使用低頻率的扇形探頭（Phased Array Probe）。"},"answer":"D","manualChapter":"CH21","matchedChapters":["CH21"]},{"id":2583,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"有關E - FAST檢查在創傷病人到院前評估的描述，何者最適當？","options":{"A":"腹腔內無明顯低回音成像則代表無腹內出血。","B":"膀胱為身體最低的區域，若膀胱區周圍未見積液，則Morrison’s pouch的低回音區可能是假影。","C":"E-FAST檢查劍突下區域及心包膜腔時，肝臟是
