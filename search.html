COVID-19)、流感併發重症"},"answer":"B","manualChapter":"CH42"},{"id":3850,"source":"AI出題","question":"肺結核的傳播途徑被稱為「飛沫核傳染 / 空氣傳染」。關於此傳播特性的描述，下列何者正確？","options":{"A":"飛沫核的直徑通常大於 5 微米，因此無法在空氣中長時間懸浮","B":"只要吸入含有結核菌的飛沫核，就一定會發病成為開放性結核病","C":"由於飛沫核極微小，即使救護員離開感染來源甚遠，只要呼吸同一空間的空氣即可能被感染","D":"給予疑似肺結核病人配戴 N95 口罩，是防止其將病菌散播至空氣中的最佳且唯一方法"},"answer":"C","manualChapter":"CH42"},{"id":3851,"source":"AI出題","question":"愛滋病毒 (HIV) 主要攻擊人體的免疫系統。當血液中某一種細胞的數量下降至何種程度時，病人會開始出現正常人不易得到的「伺機性感染」(如肺囊蟲肺炎、禽型分枝桿菌感染)？","options":{"A":"CD8 淋巴細胞下降至 500 顆/μL 以下","B":"CD4 淋巴細胞下降至 200~350 顆/μL 左右或更低","C":"巨噬細胞總數低於 1000 顆/μL","D":"B 型淋巴球數量急遽減少"},"answer":"B","manualChapter":"CH42"},{"id":3852,"source":"AI出題","question":"救護技術員在執行勤務時，若不慎被疑似含有愛滋病毒的針頭扎傷，下列處置流程何者「錯誤」？","options":{"A":"立即用力擠壓傷口，使血液盡量流出","B":"在流動的清水下清洗傷口至少 5 分鐘","C":"因為愛滋病毒有空窗期，抽血檢驗若呈陰性即可完全排除感染，不需服用預防性藥物","D":"應盡快尋求醫療協助，最好在 72 小時內接受預防性投藥以降低感染率"},"answer":"C","manualChapter":"CH42"},{"id":3853,"source":"AI出題","question":"關於「腦膜炎雙球菌」的敘述，下列何者最「不正確」？","options":{"A":"該病菌屬於革蘭氏陰性球菌，通常存在於部分正常人的鼻部和咽喉黏膜中","B":"病程通常進展緩慢，有足夠的黃金時間進行早期抗生素治療","C":"可能會迅速惡化造成休克、瀰漫性血管內凝血 (DIC) 及多重器官衰竭","D":"若救護員在無適當防護下對該病人進行氣管插管或抽痰，事後應接受預防性抗生素投藥"},"answer":"B","manualChapter":"CH42"},{"id":3854,"source":"AI出題","question":"關於「疥瘡 (Scabies)」的感染與處置，下列敘述何者正確？","options":{"A":"疥蟲離開人體後，在一般環境下可存活長達數週之久","B":"第一次感染疥瘡的病人，通常在接觸後 1~2 天內就會出現嚴重的搔癢症狀","C":"疥瘡不會引發體內有效的免疫保護，即使治癒後再次接觸仍會感染","D":"被疥蟲汙染的床單衣物，只要用冷水加入漂白水浸泡 5 分鐘即可徹底殺滅蟲卵"},"answer":"C","manualChapter":"CH42"},{"id":3855,"source":"AI出題","question":"關於「邦克列酸 (Bongkrekic acid)」所引起的食物中毒事件，下列敘述何者錯誤？","options":{"A":"主要是由唐菖蒲伯克氏菌 (Burkholderia gladioli) 分泌產生","B":"會導致嚴重的多重器官衰竭，病人病情快速惡化","C":"通常屬於群聚感染事件，短時間內會有多人出現類似症狀","D":"到院前即可透過施打專一性解毒劑血清來快速中和毒性"},"answer":"D","manualChapter":"CH42"},{"id":3856,"source":"AI出題","question":"關於 N95 口罩的規格與防護意義，下列敘述何者正確？","options":{"A":"\"N\" 代表該口罩具有極佳的抗油汙能力 (Oil-proof)","B":"\"95\" 代表可以過濾至少 95% 以上直徑大於 5 微米的飛沫","C":"依據美國 NIOSH 規範，N95 面罩屬於無抗油污性，且能過濾 95% 以上的微粒","D":"若遇到化學毒氣外洩事件，配戴 N95 口罩亦能提供完整的毒氣過濾防護"},"answer":"C","manualChapter":"CH42"},{"id":3857,"source":"AI出題","question":"在人體的免疫防禦系統中，哪一種細胞具有「記憶能力」，能在下次遇到相同病原體時快速製造專一性「抗體」進行中和作用？","options":{"A":"巨噬細胞","B":"B 型淋巴球 (B細胞)","C":"嗜中性白血球","D":"紅血球"},"answer":"B","manualChapter":"CH42"},{"id":3858,"source":"AI出題","question":"救護車在運送患有「開放性肺結核」的病人時，為降低傳染風險，下列措施何者最為適當？","options":{"A":"讓病人配戴 N95 口罩，救護員配戴一般外科口罩","B":"車廂內開啟「室內循環」空調，以免病菌飄散至車外","C":"救護員配戴 N95 口罩，並讓病人在不影響呼吸下配戴一般外科/拋棄式手術口罩","D":"運送途中應將車窗全部緊閉，以維持車內正壓狀態"},"answer":"C","manualChapter":"CH42"},{"id":3859,"source":"AI出題","question":"依據《傳染病防治法》及相關規定，針對疑似傳染病病人的處理，下列敘述何者最為正確？","options":{"A":"救護技術員有權力強制要求所有病人出示愛滋病檢驗報告","B":"病人或其家屬在就醫時，有據實陳述接觸史與旅遊史 (TOCC) 的義務","C":"愛滋病患者在任何緊急危及生命的狀況下，都必須先主動宣告感染身分，否則救護員可拒絕施救","D":"為了保護隱私，救護紀錄表上絕對不可紀錄任何傳染病相關資訊"},"answer":"B","manualChapter":"CH42"},{"id":3860,"source":"AI出題","question":"人類免疫缺乏病毒 (HIV) 感染人體後，有相當長的一段「無症狀潛伏期」。關於此潛伏期的描述，下列何者正確？","options":{"A":"在潛伏期內，病毒在體內處於完全休眠狀態，不會進行繁殖","B":"在此期間，病人的 CD4 淋巴球數量會維持在正常高水準","C":"雖然外觀無明顯症狀，但病毒仍在持續大量繁殖並逐漸破壞免疫系統","D":"處於潛伏期的病人，其血液或體液完全不具備傳染力"},"answer":"C","manualChapter":"CH42"},{"id":3861,"source":"AI出題","question":"關於免疫防禦系統中的「正常菌落 (Normal flora)」，下列敘述何者錯誤？","options":{"A":"大量分布在健康人體的皮膚、腸胃道及呼吸道黏膜上","B":"它們主要的功能是破壞人體的外部屏障，協助病原菌入侵","C":"正常菌落可以協助干擾致病菌的附著與侵入","D":"當腸胃道的正常菌落（如大腸桿菌）移位至泌尿道時，可能會引發泌尿道感染"},"answer":"B","manualChapter":"CH42"},{"id":3862,"source":"AI出題","question":"在評估疑似感染敗血症的病人時，下列哪一項生理指標的改變「不」屬於 qSOFA 的評估範圍？","options":{"A":"呼吸速率 ≥ 22 次/分","B":"收縮壓 ≤ 100 mmHg","C":"體溫 ≥ 38.5 °C 或 ≤ 36 °C","D":"發生新的意識狀態改變 (GCS < 15)"},"answer":"C","manualChapter":"CH42"},{"id":3863,"source":"AI出題","question":"在面對高危險傳染病（如 COVID-19 等空氣/飛沫傳播疾病）時，救護員在脫卸個人防護裝備 (PPE) 時，哪一項原則是最重要的？","options":{"A":"脫卸速度越快越好，以縮短暴露在汙染環境的時間","B":"為了省去麻煩，應戴著汙染的手套直接脫除口罩與護目鏡","C":"必須嚴格遵守脫卸順序，避免被防護裝備外層汙染自身黏膜，且脫卸後須徹底洗手","D":"N95 口罩可以直接用手抓取口罩外部正中心取下丟棄"},"answer":"C","manualChapter":"CH42"},{"id":3864,"source":"AI出題","question":"一名 30 歲男性病患，主訴連續多日高燒、肌肉痠痛、後眼窩痛，且身上出現紅疹。詢問病史發現其一週前曾前往東南亞旅遊。依據其症狀與旅遊史，他最可能感染下列何種「第二類」法定傳染病？","options":{"A":"肺結核","B":"登革熱","C":"狂犬病","D":"新型 A 型流感"},"answer":"B","manualChapter":"CH42"},{"source":"EMT-P 第 44 章 P.1149","question":"熱衰竭病患的中心體溫通常會升高到攝氏多少度左右？","options":{"A":"43°C","B":"39°C","C":"37°C","D":"41°C"},"answer":"B","manualChapter":"背誦題","matchedChapters":["CH44"],"id":3865},{"id":45450,"source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","question":"一名患者傷口如下圖，有多處動脈出血點及大面積的軟組織損傷，脛骨、腓骨開放性骨折，請問以下何者是最理想的止血法？(複選，選「戰術止血帶止血法」也給分)","options":{"A":"戰術止血帶止血法。","B":"直接加壓止血法。","C":"止血棉填塞止血法。","D":"合併多種止血法。"},"answer":"D","manualChapter":"CH30","image":"題庫圖片/45450.png"},{"source":"練習卷","question":"孕婦失去多少血容量才會出現低血容症狀?","options":{"A":"10-15%","B":"20-25%","C":"30-35%","D":"40-45%"},"answer":"C","id":45451,"manualChapter":"CH32"},{"source":"練習卷","question":"孕婦失去多少血容量才會出現低血容症狀?","options":{"A":"10-15%","B":"20-25%","C":"30-35%","D":"40-45%"},"answer":"C","id":45452,"manualChapter":"背誦題"},{"id":45453,"question":"當小強在學習語文時努力背誦，演算數學及對困難問題用心思考，這類高級心理活動，是由大腦皮質層中的哪一部分來管控？","options":{"A":"額葉","B":"頂葉","C":"顳葉","D":"枕葉"},"answer":"A","source":"阿摩－99年度高級中等以下學校及幼稚園教師資格檢定考試","manualChapter":"CH12"},{"id":45454,"question":"下列何者不是直接影響情緒的部位？","options":{"A":"大腦皮質","B":"中腦","C":"丘腦下部","D":"邊緣系統"},"answer":"B","source":"阿摩－基隆市97學年度市立高中國中部暨國民中學新聘教師聯合甄選","manualChapter":"CH12"},{"id":45455,"question":"腦性麻痺的「運動失調型」，主要是由於腦的哪一個部位受損所引起的？","options":{"A":"大腦皮質","B":"中腦","C":"小腦","D":"基層神經結"},"answer":"C","source":"阿摩－基隆市97學年度市立高中國中部暨國民中學新聘教師聯合甄選","manualChapter":"CH12"},{"id":45456,"question":"請填入空格：Hyperacute T wave通常在心肌梗塞後第____個小時內出現(相對標準：超過其前 QRS 幅度的50%，若超過75%則一定視為超急性 T 波)-臨床上看到超急性 T 波時，應警覺病人有極高機率發生____。","options":{"A":"1，stemi","B":"3，stemi","C":"1，VF","D":"3，VF"},"answer":"C","source":"自訂新增","manualChapter":"背誦題"},{"id":45457,"source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","question":"根據下列各種白血球分類計數，相對應對抗致病菌功能，下列何者為非？","options":{"A":"嗜中性白血球(neutrophil) 85%，臨床上偏向細菌感染。","B":"嗜酸性白血球(eosinophil) 15%，可能為寄生蟲感染。","C":"單核球(monocyte) 15%，可能為結核菌感染。","D":"淋巴球(lymphocyte) 60%，臨床上偏向過敏反應。"},"answer":"D","manualChapter":"CH39","explanation":"CH39 p1032 淋巴球正常值 20~40％，功能為對抗病毒"},{"question":"根據 2016 年第三次國際共識會議（Sepsis-3），敗血症（Sepsis）的臨床正式定義為何？","options":{"A":"感染源進入血液循環並大量繁殖的狀態","B":"發生嚴重低血壓且對輸液治療無反應的感染狀態","C":"宿主對感染的反應失調，導致器官功能失常","D":"由感染引起的全身性炎症反應綜合症（SIRS）"},"answer":"C","source":"AI出題","manualChapter":"CH42","id":45458},{"question":"關於傳染病傳播鏈（Chain of Infection）的敘述，下列何者正確？","options":{"A":"釋出門戶與進入門戶必須為相同的解剖部位","B":"只要切斷傳染途徑，即使宿主具備高易感性也不會發生感染","C":"正常菌落（Normal flora）在任何情況下都不會成為致病原","D":"病原體的毒力與數量直接影響傳染鏈是否能成功建立"},"answer":"D","source":"AI出題","manualChapter":"CH42","id":45459},{"question":"肺結核的「飛沫核（Droplet nuclei）」傳染特性，與一般飛沫傳染最大的不同點在於？","options":{"A":"僅能透過與病人近距離（1公尺內）接觸才會感染","B":"病原體在飛沫中含水量高，對環境抵抗力弱","C":"顆粒直徑大於 10μm，因此沉降速度快","D":"顆粒直徑小於 5μm，能長時間懸浮並隨氣流遠距離移動"},"answer":"D","source":"AI出題","manualChapter":"CH42","id":45460},{"question":"關於後天免疫缺乏症候群（AIDS）的「空窗期」，下列敘述何者正確？","options":{"A":"只要空窗期內檢測結果為陰性，即可完全排除感染可能","B":"傳統血清抗體檢驗的空窗期約為 6 至 12 週","C":"空窗期是指病毒在體內大量繁殖但尚無傳染力的時期","D":"目前最先進的 PCR 檢驗仍需 3 個月才能偵測出病毒"},"answer":"B","source":"AI出題","manualChapter":"CH42","id":45461},{"question":"對於「開放性肺結核」的定義，臨床上最常用的判斷標準為何？","options":{"A":"胸部 X 光檢查發現肺尖部有纖維化病灶","B":"病人與結核病案有過親密接觸史","C":"病人出現咳嗽、體重減輕及盜汗等典型症狀","D":"痰液檢體經抗酸性染色（Acid-fast stain）呈現陽性"},"answer":"D","source":"AI出題","manualChapter":"CH42","id":45462},{"question":"關於人體的「內部防禦系統」，下列哪一種細胞具備產生「一對一專一性抗體」的功能？","options":{"A":"白血球（中性球）","B":"巨噬細胞","C":"B 型淋巴球","D":"T 型淋巴球"},"answer":"C","source":"AI出題","manualChapter":"CH42","id":45463},{"id":45464,"question":"愛滋病患者在 CD4 淋巴球總數下降到約多少範圍時，會開始出現正常人少見的伺機性感染（如肺囊蟲肺炎）？","options":{"A":"800~1200 顆/μL","B":"10~50 顆/μL","C":">500 顆/μL","D":"200~350 顆/μL"},"answer":"D","source":"TP題庫","manualChapter":"背誦題","explanation":"p1103 CH42 一般而言，血液中CD4細胞數與病人得到的伺機性感染種類有關，通常CD4在血液中總數超過500顆/μL時病人不容易有伺機性感染，但CD4細胞數目在愛滋病毒長期破壞下會逐漸減少，當其總數下降到200~350顆/μL左右或更低時，便開始出現正常人不會得到的伺機性感染，包括肺囊蟲引發呼吸急促甚至呼吸衰竭、肺結核(10.6％愛滋病毒感染者)、巨細胞病毒/黴菌感染，死亡率很高的禽型分枝桿菌(MAC)感染，甚至一些罕見癌症，腦部病變及寄生蟲感染等。"},{"id":45465,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列台灣常見的毒蛇咬傷後，哪一種可能會引起呼吸衰竭？","options":{"A":"赤尾青竹絲","B":"龜殼花","C":"百步蛇","D":"眼鏡蛇"},"answer":"D","manualChapter":"背誦題"},{"id":45466,"question":"根據我國疾病管制署的建議，救護技術員因工作發生疑似愛滋病毒暴露時，下列緊急處置，何者正確？(選「必須於暴露後3個月、6個月、1年追蹤三次抗體檢驗。」也給分)","options":{"A":"若有扎傷處應立即以大量優碘消毒傷口。","B":"若暴露處為黏膜(如眼睛)則大量沖水即可。","C":"必須於72小時內向工作單位進行事件通報。","D":"必須於暴露後3個月、6個月、1年追蹤三次抗體檢驗。"},"answer":"B","source":"110年度EMTP筆試-題目卷(100題)(含答案)1110317(公告)","manualChapter":"CH42"},{"question":"填入空格：固定式抽吸裝置應可提供超過_____mmHg的吸力，以及_____L/min 的流量。移動式抽吸裝置雖然吸力較小，流量仍應不可小於20L/min。","options":{"A":"300，50","B":"300，40","C":"100，50","D":"100，50"},"answer":"B","source":"大白","id":45467,"manualChapter":"CH15"},{"question":"填入空格：固定式抽吸裝置應可提供超過_____mmHg的吸力，以及_____L/min 的流量。移動式抽吸裝置雖然吸力較小，流量仍應不可小於20L/min。","options":{"A":"300，50","B":"300，40","C":"100，50","D":"100，50"},"answer":"B","source":"大白","id":45468,"manualChapter":"背誦題"},{"question":"請問下列各種臨床情況中，哪種最不可能導致潮氣末二氧化碳分壓值( EtCO 2 )下降？","options":{"A":"插管到食道內","B":"張力性氣胸","C":"麻醉鎮靜","D":"心包膜填塞"},"answer":"C","source":"大白","manualChapter":"CH14","id":45469},{"question":"請問下列各種臨床情況中，哪種最不可能導致潮氣末二氧化碳分壓值( EtCO 2 )下降？","options":{"A":"頭部外傷","B":"低體溫","C":"肺動脈栓塞(PE)","D":"呼吸道阻塞"},"answer":"A","source":"大白","manualChapter":"CH14","id":45470},{"question":"請問下列各種臨床情況中，哪種最不可能導致潮氣末二氧化碳分壓值( EtCO 2 ) 升高？","options":{"A":"發燒","B":"發抖","C":"張力性氣胸","D":"藥物過量"},"answer":"C","source":"大白","manualChapter":"CH14","id":45471},{"id":45472,"question":"醫學教育學者 Dr. David Kern 提出了「醫學教育課程發展六大步驟」。在規劃高級救護技術員的繼續教育訓練時，若課程設計者正在分析「現行標準作業流程與當前最理想處置方法之間的落差」，此分析動作屬於六大步驟中的哪一個階段？","options":{"A":"第一階段：問題之確認與一般需求評估 (Problem Identification and general needs assessment)","B":"第二階段：指定學習者之需求評估 (Needs assessment of targeted learners)","C":"第三階段：目標與目的 (Goals and objectives)","D":"第六階段：評估與回饋 (Evaluation and feedback)"},"answer":"A","explanation":"Dr. David Kern 的六大步驟中，「第一階段：問題之確認與一般需求評估」旨在釐清現行的處置方法（current approach）與理想處置方法（ideal approach）之間的落差與差異，以此作為教育訓練的出發點。","source":"AI出題","manualChapter":"CH60"},{"id":45473,"question":"在各類課程設計模式中，哪一種模式強調「教育方式與教學過程的最佳化」，將課程比喻為孕育植被的土壤，主張不預設具體的教學目標，而是重視師生互動與創新探索，但其缺點為評量常仰賴教師主觀判斷，容易引起價值體系的對立與論戰？","options":{"A":"目標模式 (Objective model)","B":"歷程模式 (Process model)","C":"情境模式 (Situation model)","D":"經驗模式 (Experiential model)"},"answer":"B","explanation":"「歷程模式 (Process model)」不預設具體的教學結果，而是強調過程中的探索與啟發，把課程比喻為孕育植被的土壤，讓教育環境最佳化。但其缺點為缺乏具體目標，學員的評量仰賴教師主觀判斷，容易產生爭議。","source":"AI出題","manualChapter":"CH60"},{"id":45474,"question":"在高擬真情境模擬演練結束後，指導教官利用對話模式引導學員進行檢討。若教官提問：「我剛才觀察到在病人血壓下降時，團隊決定優先給予輸液而非建立進階呼吸道，可以告訴我你們當時做這個決定的思路與考量是什麼嗎？」，此提問最主要符合 GAS 反饋模式中的哪一個步驟？","options":{"A":"G (Gather / 獲取資訊)","B":"A (Analyze / 分析原因)","C":"S (Summary / 結論重點)","D":"E (Experience / 經驗)"},"answer":"B","explanation":"在 GAS（Gather, Analyze, Summary）模式中，「Analyze (分析原因)」的重點是探討學員決策的脈絡與思路歷程，了解他們「為什麼做這個決定」，從而引導更深層的反思。","source":"AI出題","manualChapter":"CH60"},{"id":45475,"question":"關於體驗式學習 (Experiential learning) 中「反饋 (Debriefing)」的時機與引導方式，下列敘述何者錯誤？","options":{"A":"演練後的反思與檢討才是體驗式學習真正發生學習成效的關鍵時間點","B":"為了達到最佳的學習效果，情境演練結束後的反饋過程，必須且只能由具有絕對權威與專家身分的指導員來主導","C":"「同步反饋 (Concurrent debriefing)」是指在情境進行中，指導員於適當時機暫停情境並帶領學員反饋，有助於精熟特定技術","D":"團隊間反饋 (Within-team debriefing) 是由學員自己引導的反饋，研究指出若搭配查核表等客觀工具，其成效與老師引導的成效差不多"},"answer":"B","explanation":"在情境結束後由老師引導的反饋中，老師的角色「並非專家或權威」，而是應扮演「共同學習者」來引導對話。此外，由學員自己引導的反饋（團隊間反饋）若搭配查核表，同樣是非常有效的學習方式。","source":"AI出題","manualChapter":"CH60"},{"id":45476,"question":"台灣近年在急救教育中開創了 ERCP 反饋模式。此模式是基於 Kolb 的經驗學習理論架構所延伸，其中字母 \"C\" 代表的概念 (Conceptualization) 在教學上具有極重要的意義。下列何者最符合 \"C\" 階段的教學目標？","options":{"A":"鼓勵學員回想他們剛才在情境中的具體作為與情緒感受","B":"引導學員反思為何在情境中會做出導致病人病情惡化的錯誤決策","C":"教師協助學員將反思的結果，歸納或連結成結構化的教學重點（如：鑑別診斷 5H5T）以利廣泛應用","D":"讓學員擬定未來若再次遇到類似情境時的具體行動改善計畫"},"answer":"C","explanation":"ERCP 模式分為 Experience (經驗)、Reflection (反思)、Conceptualization (概念化) 與 Planning (計畫)。其中 \"C\" (概念化) 階段是老師角色的珍貴之處，協助學員將剛剛雜亂的體驗與反思，歸納成結構化的理論與口訣（如 5H5T），以便學員未來在其他情境中廣泛應用。","source":"AI出題","manualChapter":"CH59"},{"id":45477,"question":"在評量一門救護課程的成效時，指導員可以採取不同的評估策略。若指導員在學員進行靜脈注射的技術練習「過程中」，給予建設性的修正意見，以幫助學員即時改善手勢與流程。這種評估方式稱之為？","options":{"A":"總結性評估 (Summative evaluation)","B":"形成性評估 (Formative evaluation)","C":"診斷性評估 (Diagnostic evaluation)","D":"需求性評估 (Needs assessment)"},"answer":"B","explanation":"「形成性評估 (Formative evaluation)」著重在教學「過程中」提供建設性的回饋，幫助學員發現錯誤並即時修正。而「總結性評估 (Summative)」則是指課程結束後的最終測驗與打分數。","source":"AI出題","manualChapter":"CH60"},{"id":45478,"question":"學者泰勒 (Tyler) 在1942年提出的「泰勒模式」是臨床醫學教育中最常採用的藍圖。關於此課程模式的敘述，下列何者正確？","options":{"A":"它屬於「情境模式」的一種，強調課程必須反映社會文化的需求","B":"它的核心精神在於將課程視為加工生產線，最關鍵的步驟是制定明確且可測量的「學習目標」","C":"它的最大優點是高度的彈性，能隨時根據學員的主觀需求更改上課內容與評量標準","D":"它主張不應該對學員進行標準化的評鑑，以免扼殺學員的批判性思維"},"answer":"B","explanation":"泰勒 (Tyler) 提出的「目標模式 (Objective model)」是臨床醫學教育的基礎，它將課程視為加工生產線，最核心的概念就是必須制定出「明確、一致且可測量的教育目標」，並透過評鑑來確認是否達標。","source":"AI出題","manualChapter":"CH60"},{"id":45479,"question":"關於「以學習者為中心 (Learner-centered)」的教學策略，與傳統「以老師為中心」的教學相比，下列哪一項特徵屬於「以學習者為中心」的表現？","options":{"A":"以學員能在單一課堂上記憶最多資訊為課程的最終目標","B":"指導員主要扮演「資訊提供者」的角色，大量採用講授法 (Lecture)","C":"教學不再受限於課堂上的時間，且強調查找資源、批判思維、團隊合作及問題解決的能力","D":"學生處於被動吸收的狀態，由老師單向決定所有的教學內容與方向"},"answer":"C","explanation":"「以學習者為中心」的教學法強調主動學習，降低講授式 (Lecture) 的比例，鼓勵學員發展批判性思維與團隊解決問題的能力，且學習過程的深度與廣度不再僅限於課堂內。選項 A、B、D 均屬於傳統「以老師為中心」的特徵。","source":"AI出題","manualChapter":"CH60"},{"id":45480,"question":"指導員在帶領急救情境演練的反饋 (Debriefing) 時，為了促進學員的自省與深層思考，下列哪一種引導技巧或心態最為適當？","options":{"A":"當學員出現錯誤處置時，應立即以封閉式問句（如：你難道不知道這裡應該打腎上腺素嗎？）來糾正","B":"提出關鍵的開放式問題後，若學員陷入短暫的沉默，指導員應保持耐心等待，允許學員在心中組織想法","C":"為節省時間，指導員應在學員討論不出結果時，直接給予標準答案並結束反饋","D":"反饋的焦點應集中在揪出犯錯的個人並給予譴責，以警惕其他團隊成員"},"answer":"B","explanation":"有效的反饋應建立在「安全、對事不對人」的環境中。使用開放式問句能刺激學員思考，而當學員陷入「沉默」時，通常代表他們正在腦海中波濤洶湧地組織想法與自省，此時指導員最需要的就是「耐心等待」，不應急著打破沉默或直接給答案。","source":"AI出題","manualChapter":"CH60"},{"id":45481,"question":"在推動體驗式學習時，指導員可以運用各種「促發學習 (Facilitation) 的技巧」來引導課堂。其中所謂的「引子 (Hook)」技巧，其主要目的為何？","options":{"A":"在課程結束前進行總結與課後測驗，確認學員的吸收程度","B":"在分組討論時，指派特定學員擔任小組長以凝聚團隊共識","C":"確保在演練過程中，所有學員都有被分配到實作的任務（即「全動」）","D":"在課程開始時進行破冰，透過與學員經驗產生共鳴的問題或情境，引發其好奇心與學習動機"},"answer":"D","explanation":"「引子 (Hook)」是課程教學策略中的開場技巧，主要用來「破冰」，透過提出一個引人入勝的問題或與學員過往經驗有共鳴的情境，來激發學員的好奇心與專注力。選項 A 屬於「畫圓收尾」；選項 C 屬於「全動」。","source":"AI出題","manualChapter":"CH60"},{"question":"研究顯示，將重大外傷送到外傷中心治療可以減少_____％的死亡率","options":{"A":"10%","B":"25%","C":"40%","D":"50%"},"answer":"B","source":"大白","manualChapter":"CH25","id":45482},{"question":"研究顯示，將重大外傷送到外傷中心治療可以減少_____％的死亡率","options":{"A":"10%","B":"25%","C":"40%","D":"50%"},"answer":"B","source":"大白","manualChapter":"背誦題","id":45483},{"question":"衛生福利部依據醫院對重大外傷、急性冠心症、急性腦中風、高危險妊娠及新生兒之照護品質，將急救責任醫院分成三個等級","options":{"A":"極嚴重級、重度級、中度級","B":"重度級、中度級、一般級","C":"重度級、中度級、輕度級","D":"極嚴重級、中度級、輕度級"},"answer":"B","source":"大白","manualChapter":"CH25","id":45484},{"question":"衛生福利部依據醫院對重大外傷、急性冠心症、急性腦中風、高危險妊娠及新生兒之照護品質，將急救責任醫院分成三個等級","options":{"A":"極嚴重級、重度級、中度級","B":"重度級、中度級、一般級","C":"重度級、中度級、輕度級","D":"極嚴重級、中度級、輕度級"},"answer":"B","source":"大白","manualChapter":"背誦題","id":45485},{"id":45486,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"35歲女性，體重約50公斤火場救出後經初步評估為整隻右手臂及整隻右腿的深度灼傷（皆為二度或三度灼傷），根據修正後布魯克公式(modified Brooke formula)前八小時應給予多少輸液量？","options":{"A":"1,350ml。","B":"1,800ml。","C":"2,700ml。","D":"3,600ml。"},"answer":"A","manualChapter":"CH31","matchedChapters":["背誦題"]},{"id":45487,"question":"下列哪項非新生兒發生癲癇重積的代謝疾患原因？","options":{"A":"低血糖","B":"低血鈣","C":"低血鉀","D":"低血鈉"},"answer":"C","source":"大白","manualChapter":"CH48"},{"id":45488,"question":"下列哪項非新生兒發生癲癇重積的代謝疾患原因？","options":{"A":"低血糖","B":"低血鈣","C":"低血鉀","D":"低血鈉"},"answer":"C","source":"大白","manualChapter":"背誦題"},{"id":45489,"question":"乙二醇的毒性作用可以影響中樞神經、心肺系統以及腎臟系統，並且會造成哪種電解質異常?","options":{"A":"高血鉀","B":"低血鈣","C":"高血鈣","D":"低血鎂"},"answer":"B","source":"大白","manualChapter":"CH50","explanation":"p1373 CH50 乙二醇的毒性來自於有毒代謝物的累積，特別是代謝以後產生的乙醇酸及草酸。這些主要發生在肝臟及腎臟。這個毒性作用可以影響中樞神經、心肺系統以及腎臟系統，並且會造成低血鈣。"},{"id":45490,"question":"乙二醇的毒性作用可以影響中樞神經、心肺系統以及腎臟系統，並且會造成哪種電解質異常?","options":{"A":"高血鉀","B":"低血鈣","C":"高血鈣","D":"低血鎂"},"answer":"B","source":"大白","manualChapter":"背誦題","explanation":"p1373 CH50 乙二醇的毒性來自於有毒代謝物的累積，特別是代謝以後產生的乙醇酸及草酸。這些主要發生在肝臟及腎臟。這個毒性作用可以影響中樞神經、心肺系統以及腎臟系統，並且會造成低血鈣。"},{"id":45491,"question":"目標體溫管理可能會影響免疫系統與何種電解質異常?","options":{"A":"高血鉀","B":"低血鈉","C":"低血鈣","D":"高血鎂"},"answer":"C","source":"大白","manualChapter":"CH24","explanation":"目標體溫管理（Targeted Temperature Management, TTM，特別是低體溫期 32–34°C）常會對電解質造成偏低的情形，針對免疫系統，低體溫會抑制發炎反應與細胞激素釋放，同時也會抑制白血球趨化、吞噬能力與免疫功能，進而增加感染（尤其是肺炎與敗血症）的風險。"},{"id":45492,"question":"目標體溫管理除了會影響免疫系統，同時與何種電解質異常有關?","options":{"A":"高血鉀","B":"低血鈉","C":"低血鈣","D":"高血鎂"},"answer":"C","source":"大白","manualChapter":"背誦題","explanation":"目標體溫管理（Targeted Temperature Management, TTM，特別是低體溫期 32–34°C）常會對電解質造成偏低的情形，針對免疫系統，低體溫會抑制發炎反應與細胞激素釋放，同時也會抑制白血球趨化、吞噬能力與免疫功能，進而增加感染（尤其是肺炎與敗血症）的風險。"},{"id":45493,"question":"依據世界衛生組織 (WHO) 與美國國家醫學研究院 (IOM) 對醫療照護品質的定義，確保緊急醫療救護服務「不會因病人的性別、種族、地理位置或社會經濟地位而有落差」。此敘述屬於品質目標六大面向中的哪一項？","options":{"A":"有效 (Effectiveness)","B":"及時 (Timeliness)","C":"公平 (Equity)","D":"病人為中心 (Patient-centeredness)"},"answer":"C","explanation":"品質目標的六大面向中，「公平 (Equity)」強調提供的照護品質不應因為個人的性別、種族、地理位置或社會經濟地位等特徵而有所差異。","source":"AI出題","manualChapter":"CH09"},{"id":45494,"question":"在緊急醫療救護品質的測量中，學者 Donabedian 提出了著名的三大構面 (結構面、過程面、結果面)。下列哪一項品質指標屬於「過程面 (Process)」的測量？","options":{"A":"到院前心肺停止病人恢復自發性循環 (ROSC) 的比例","B":"救護車上配置自動體外心臟電擊去顫器 (AED) 的比例","C":"疑似心肌梗塞病人在現場接受十二導程心電圖檢查的執行率","D":"救護人員通過高級救護技術員 (EMT-P) 證照考試的合格率"},"answer":"C","explanation":"「過程面 (Process)」是指照護提供者與病人之間實際發生的醫療處置行為（做了什麼）。給予心電圖檢查、給予阿斯匹靈等都屬於過程面。選項 A 屬於「結果面」；選項 B、D 屬於「結構面」。","source":"AI出題","manualChapter":"CH09"},{"id":45495,"question":"在急救實務中，為了盡早處理可能致命的大出血，許多地區將傳統的外傷評估流程由「ABCDE」改為「XABCDE」，以強調出血控制的優先性。在品質改善的 ECRS 原則中，這項改變最符合下列哪一項原則？","options":{"A":"排除 (Eliminate)","B":"組合 (Combine)","C":"交換 / 重排 (Rearrange)","D":"簡化 (Simplify)"},"answer":"C","explanation":"ECRS 原則中的「交換 (Rearrange)」是指重新審視並調整程序的先後順序。將傳統的 ABCDE 順序調整為 XABCDE（優先處理大出血），正是為了提升救命效能而進行的「步驟交換/重排」。","source":"AI出題","manualChapter":"CH09"},{"id":45496,"question":"緊急醫療救護系統常使用各種品管分析工具來找出問題的核心。若品管小組希望利用「80/20 法則」來找出導致氣管內管插管失敗的「關鍵少數」原因，以便優先將資源投入改善，應選擇下列哪一種分析工具最為合適？","options":{"A":"管制圖 (Control chart)","B":"散佈圖 (Scatter diagram)","C":"柏拉圖 (Pareto chart)","D":"直方圖 (Histogram)"},"answer":"C","explanation":"「柏拉圖 (Pareto chart)」又稱主次因素分析圖，它結合了直方圖與折線圖，利用「80/20 法則」將發生頻率最高的原因依序排列，幫助決策者一眼看出導致問題的「關鍵少數」原因，以利優先改善。","source":"AI出題","manualChapter":"CH09"},{"id":45497,"question":"關於國際心肺復甦科學界所推崇的「烏次坦格式 (Utstein Style)」，下列敘述何者錯誤？","options":{"A":"它最初是在 1990 年由多個國際醫學會於挪威烏次坦修道院開會所制定的共識","B":"它的主要目的是為了統一全球心肺功能停止 (OHCA) 病人的資料登錄格式，以便進行跨系統的存活率比較與科學研究","C":"依據最新的 Utstein 模式，其應紀錄的核心項目僅侷限於「病人特徵」與「結果面」，並不包含「系統資源」與「派遣過程」","D":"推動 Utstein 格式登錄是各國急救系統進行「標竿學習 (Benchmarking)」的重要資料基礎"},"answer":"C","explanation":"Utstein 格式是一個完整的心肺停止資料登錄系統。依據 2014 及 2024 年版的更新，其登錄領域涵蓋了五大面向：系統 (System)、派遣 (Dispatch)、病人資料 (Patient)、過程與步驟 (Process)、預後結果 (Outcome)。因此選項 C 說不包含系統與派遣是錯誤的。","source":"AI出題","manualChapter":"CH09"},{"id":45498,"question":"美國緊急醫療救護醫師協會 (NAEMSP) 在近年發表的聯合聲明中指出，對於「非 OHCA」或「非時間急症」的病人，若一味地仰賴某單一指標作為救護績效的衡量標準，不僅會增加車禍風險，還會掩蓋真正影響病人預後的品質問題。請問此項受質疑的傳統指標為何？","options":{"A":"救護車到達現場的反應時間 (Response time)","B":"現場給藥的成功率","C":"病人滿意度調查分數","D":"救護車耗材的使用成本"},"answer":"A","explanation":"NAEMSP 在 2024 年的聲明指出，傳統 EMS 極度看重「反應時間 (Response time)」，但對於非心跳停止 (非 OHCA) 或非時間急症的病人來說，盲目追求縮短反應時間只會徒增救護車發生車禍的風險，而無助於實質的醫療品質與預後。","source":"AI出題","manualChapter":"CH09"},{"id":45499,"question":"若某一縣市的消防局為了監控救護員在現場執行 CPR 的按壓深度，每個月將收集到的數據計算出平均值，並設定上下各 3 個標準差為界線。若品管專員發現「連續 7 個月的數據都落在平均值下方」，便將其視為可歸屬的異常原因並立刻介入檢討。此種品質管理做法是應用了七大品管工具中的哪一項？","options":{"A":"魚骨圖 (Fishbone diagram)","B":"管制圖 (Control chart)","C":"層別法 (Stratification)","D":"查檢表 (Check sheet)"},"answer":"B","explanation":"「管制圖 (Control chart)」是利用樣本平均值作為中心線，上下各 3 個標準差作為管制上下限。當出現異常趨勢（例如連續 7 個點落在平均值同一側，或超出管制界線）時，就代表製程出現異常，必須介入檢討。","source":"AI出題","manualChapter":"CH09"},{"id":45500,"question":"針對全球復甦聯盟 (Global Resuscitation Alliance, GRA) 所提出提升社區 OHCA 存活率的 10 個步驟，下列何者「未」包含在其中？","options":{"A":"實施派遣員協助心肺復甦 (DA-CPR)","B":"強制要求所有急救責任醫院設立體外循環 (ECMO) 中心","C":"建立 OHCA 登錄系統以利監控急救品質","D":"針對第一反應員的 AED 部署計畫"},"answer":"B","explanation":"全球復甦聯盟 (GRA) 提出的 10 個步驟包含：建立登錄系統、實施 DA-CPR、推廣高品質 CPR、快速派遣、數位化紀錄、AED 部署、行動科技召喚志工、校園/社區教育、建立當責制、建立卓越文化。其中「未」包含強制要求所有醫院設立 ECMO 中心。","source":"AI出題","manualChapter":"CH09"},{"id":45501,"question":"台東縣消防局因應縣境狹長、醫療資源不均的特殊地理環境，發展出獨特的「雙線救護，中途接駁」高救隊執勤模式。關於此模式的敘述與其背後的品管意義，下列何者最為正確？","options":{"A":"該模式規定無論病情輕重，一律由高級救護技術員 (EMT-P) 優先單獨出勤，以減少派遣時間","B":"該模式成功降低了輕傷患者佔用醫學中心資源的比例，屬於「結果面」的品管指標","C":"這是透過檢視「結構面」的資源限制，進而改變「過程面」的派遣與處置策略，最終成功提升了 OHCA 病人的存活率","D":"該模式的成功證明了在偏鄉地區，大量增加基本救護車的數量比提升救護人員的技術等級更為重要"},"answer":"C","explanation":"台東縣因「結構面」的資源限制（幅員廣大且高級救護技術員不足），改變了「過程面」的作為（利用分級派遣，讓 ALS 高救隊與 BLS 救護車中途會合接駁），這種品質管理的策略最終成功在「結果面」大幅提升了 OHCA 病人的 ROSC 與存活出院率。","source":"AI出題","manualChapter":"CH09"},{"id":45502,"question":"高雄市政府消防局推動的「十二導程心電圖」品管專案，成功縮短了急性心肌梗塞 (AMI) 病人的 D2B (Door to Balloon) 時間。在此專案的發展過程中，消防局引進了「定心布」這項快速定位裝置，讓救護員只需 30 秒便可精確完成心電圖導極的貼片作業。依據 ECRS 品管原則，引進「定心布」最符合哪一項原則的精神？","options":{"A":"排除 (Eliminate)","B":"組合 (Combine)","C":"交換 (Rearrange)","D":"簡化 (Simplify)"},"answer":"D","explanation":"ECRS 原則中的「簡化 (Simplify)」是指針對必要的工作，以更簡單的設備或作法來提升效率。「定心布」的發明正是簡化了原本繁瑣的尋找肋間隙與貼片步驟，讓基層人員能快速、精準地完成 12 導程心電圖的操作。","source":"AI出題","manualChapter":"CH09"},{"id":45503,"question":"在品質管理的 PDCA 循環中，某救護隊針對「插管成功率低」的問題，開始收集現場插管失敗的案例數據，並將實際的成功率數據與預定目標進行比較，以研判兩者之間的差距與異常原因。這個動作屬於 PDCA 循環中的哪一個步驟？","options":{"A":"P (Plan / 計畫)","B":"D (Do / 執行)","C":"C (Check / 查核)","D":"A (Act / 行動)"},"answer":"C","explanation":"在 PDCA 循環中，「Check (查核)」的定義是：研究執行過程所收集到的資訊，並與目標相比較，研判目標值與實施結果之差距。選項 B 是實際執行與收集數據；選項 A 是擬定後續的修正計畫。","source":"AI出題","manualChapter":"CH09"},{"id":45504,"question":"根據 2024 年版 Utstein 模式，在 OHCA 資料登錄的「病人 (Patient)」領域中，下列哪一個項目屬於「核心項目 (Core)」而非「補充項目 (Supplemental)」？","options":{"A":"病人是否有共病 (Comorbidities)","B":"病人的先前神經功能 (Prior function)","C":"旁觀者是否目擊 (Bystander witnessed)","D":"是否有心室輔助裝置 (VAD)"},"answer":"C","explanation":"依據 2024 年版 Utstein 模式，「旁觀者目擊 (Bystander witnessed)」是判斷後續急救指標極重要的「核心項目 (Core)」。而共病、先前神經功能、心室輔助裝置 (VAD) 等則被歸類為「補充項目 (Supplemental)」。","source":"AI出題","manualChapter":"CH09"},{"id":45505,"question":"台北市政府消防局在提升腦中風病人照護品質的專案中，發現到院前施打血栓溶解劑 (rt-PA) 的比例偏低。品管團隊透過數據追蹤，發現只要救護員及早辨識出疑似中風並通報醫院，就能大幅增加醫院施打 rt-PA 的機會。在此專案中，「救護員執行中風評估並預先通報醫院的執行率」屬於 Donabedian 品質測量模式的哪一個構面？","options":{"A":"結構面 (Structure)","B":"過程面 (Process)","C":"結果面 (Outcome)","D":"效能面 (Efficacy)"},"answer":"B","explanation":"救護員「執行中風評估」並「預先通報醫院」，這是救護人員對病人所執行的「醫療處置行為與流程」，因此屬於 Donabedian 模式中的「過程面 (Process)」。","source":"AI出題","manualChapter":"CH09"},{"id":45506,"question":"將繁雜的品質異常事件數據（例如：救護員發生插管失敗的次數），依據人員的年資、發生月份或操作項目等不同特徵進行「分組」，以便進一步轉換為圖形來尋找隱藏的趨勢或數據間的差異。這種品管資料處理手法稱為：","options":{"A":"魚骨圖分析","B":"層別法 (Stratification)","C":"散佈圖分析","D":"標竿學習 (Benchmarking)"},"answer":"B","explanation":"「層別法 (Stratification)」是指將收集到的資料依據特定屬性（如年齡、年資、月份、單位等）進行分類與分組，目的是為了找出隱藏在龐大數據背後的特徵或趨勢差異。","source":"AI出題","manualChapter":"CH09"},{"id":45507,"question":"在探討緊急醫療服務 (EMS) 的績效時，常提到「標竿學習 (Benchmarking)」。關於 EMS 執行標竿學習的前提條件與作法，下列敘述何者錯誤？","options":{"A":"標竿學習的核心是尋找業界中表現卓越的組織作為模範，並學習其作業流程以強化自身品質","B":"在進行標竿學習的數據比較前，各組織之間必須對該項目的「定義與標準」（例如：何謂「插管成功」）達成統一與共識","C":"標竿學習所選定的指標項目，必須與「有效的照護 (effective care)」息息相關，否則比較該數據就沒有品管的實質意義","D":"為了達到最佳的標竿學習效果，EMS 組織應將主要預算與品管重心全數投入於競爭「反應時間 (Response time)」的全國排名，因其為決定各類急症存活率的唯一關鍵"},"answer":"D","explanation":"進行標竿學習時，指標必須與「有效的照護 (effective care)」相關（選項 C 正確），且各單位的定義必須統一（選項 B 正確）。選項 D 錯誤的原因為：反應時間並非衡量所有急症品質的唯一關鍵，過度盲目追求反而有害。","source":"AI出題","manualChapter":"CH09"},{"id":45508,"question":"戶外活動現場氣溫為30°C，相對濕度65%，多名觀眾出現中暑前兆。此時主辦單位詢問你是否應該暫停活動，請問下列選擇何者最適當？","options":{"A":"係數為 30 + 65×0.1 = 36.5，危險係數已達標準，應建議停止活動。","B":"係數為 30 + 65×0.1 = 36.5，僅需增加醫護人員與救護車數量即可。","C":"係數為 30 + 65×0.1 = 36.5，應設置冷水槽、防水帆布或其他降溫設備。","D":"係數低於40，屬可接受範圍，不用新增處置，可照常進行原本活動。"},"answer":"C","explanation":"P1485\n熱中暑危險係數＝室外溫度(℃)＋室外相對濕度(%)×0.1，係數大於35者，主辦單位應於各服務區、醫療站及救護站內，設置冷水槽、防水帆布、碎冰或其他降溫設備，協助參與者降溫及緊急救護處置；熱中暑危險係數大於40者，主辦單位宜停止活動。","source":"同學出題","manualChapter":"CH54"},{"id":45509,"question":"關於休克下列敘述何者最適當？","options":{"A":"阻塞性休克因為進入心臟的血流受阻，所以一定會看見頸靜脈怒張。","B":"代償性休克因為周邊血管收縮，皮膚變得濕冷蒼白。","C":"神經性休克雖然也會微血管充填時間延長，卻無反射性心跳增快，皮膚也非冰冷。","D":"當傷患休克時，生命徵象最先反應的是脈搏上升，這時出血程度為第一級休克。"},"answer":"B","explanation":"1.阻塞性休克確實可能會有頸靜脈怒張情況，但病人有大量失血時，頸靜脈怒張的情形也許不會出現。\n2.代償性休克因為周邊血管收縮，皮膚變得濕冷蒼白，使得微血管充填時間延長。\n3.神經性休克雖然血壓降低，卻無反射性心跳增快，皮膚呈現溫暖紅潤，所以CRT並不會延長。\n4.休克分為四期，第一期通常沒有症狀，第二期可能表現心跳加快及脈搏壓減少。","source":"同學出題","manualChapter":"CH26"},{"id":45510,"question":"下列何種疾病主要採接觸傳播防護？","options":{"A":"腸道病原體引起之急性腹瀉","B":"肺結核","C":"水痘","D":"麻疹"},"answer":"A","explanation":"P106 腸道病原體：接觸傳播防護 P105空氣傳播疾病，如開放性肺結核、麻疹及水痘，救護人員需配戴N95口罩。","source":"同學出題","manualChapter":"CH05"},{"id":45511,"question":"一名 56 歲男性，體型肥胖，主訴冒冷汗、呼吸喘，有高血壓、高血脂、糖尿病史。現場血壓 168/96 mmHg，血糖 286 mg/dL，皮膚濕冷。下列敘述何者正確？","options":{"A":"病人目前血壓仍維持正常灌流，尚無休克徵象，因此急性冠心症可能性相對較低。","B":"病人血壓偏高且血糖升高，應先以控制生命徵象為主，可待送醫後再評估是否為急性冠心症。","C":"病人具有代謝症候群特徵，需提高急性冠心症與腦中風風險警覺。","D":"病人雖具有多項心血管危險因子，但若無典型胸痛，急性冠心症機率仍不高。"},"answer":"C","explanation":"ACS可以表現為胸悶、冒冷汗、呼吸喘，尤其糖尿病患者更容易出現非典型症狀。ACS初期血壓可以正常甚至偏高，不能據此降低警覺。","source":"同學出題","manualChapter":"綜合題"},{"id":45512,"question":"關於懷孕分期及症狀，下列敘述何者正確?","options":{"A":"懷孕第一期指第一到三月，此時陰道出血有可能是急迫性流產或子宮外孕","B":"懷孕第二期指第三到五月，有可能發生子癇前症和子癇症","C":"懷孕第三期指第六到九月，陰道出血合併腹痛有可能是因為胎盤早期剝離","D":"懷孕第一期指第一到二月，此時血壓將會下降10~15mmHg"},"answer":"A","explanation":"P1297\n懷孕一般可以三個月為一期，第一期指第一到三月、第二期指第四到六月、第三期指第七到九月。\n如果懷孕第一期的病人，陰道出血有可能是因急迫性流產、完全性流產或子宮外孕。在懷孕第三期的病人，陰道出血合併腹痛有可能是因為胎盤早期剝離。\n血壓在懷孕第二期將會下降10~15mmHg。\n自發性流產和子宮外孕一般發生在懷孕第一期，子癇前症和子癇症一般發生在懷孕第二期，而胎盤早期剝離、前置胎盤則發生於懷孕第三期。","source":"同學出題","manualChapter":"CH49"},{"id":45513,"question":"關於懷孕分期及症狀，下列敘述何者正確?","options":{"A":"懷孕第一期指第一到三月，此時陰道出血有可能是急迫性流產或子宮外孕","B":"懷孕第二期指第三到五月，有可能發生子癇前症和子癇症","C":"懷孕第三期指第六到九月，陰道出血合併腹痛有可能是因為胎盤早期剝離","D":"懷孕第一期指第一到二月，此時血壓將會下降10~15mmHg"},"answer":"A","explanation":"P1297\n懷孕一般可以三個月為一期，第一期指第一到三月、第二期指第四到六月、第三期指第七到九月。\n如果懷孕第一期的病人，陰道出血有可能是因急迫性流產、完全性流產或子宮外孕。在懷孕第三期的病人，陰道出血合併腹痛有可能是因為胎盤早期剝離。\n血壓在懷孕第二期將會下降10~15mmHg。\n自發性流產和子宮外孕一般發生在懷孕第一期，子癇前症和子癇症一般發生在懷孕第二期，而胎盤早期剝離、前置胎盤則發生於懷孕第三期。","source":"同學出題","manualChapter":"背誦題"},{"id":45514,"question":"有關輻射災害與毒化災的比較，何者敘述正確？","options":{"A":"輻射污染相較於化學物品，很難在第一時間以簡單儀器測出患者是否有污染，更難以明確定出污染範圍","B":"輻災除污方式，應將患者視為全身污染，以大量水清洗全身","C":"因毒化物半衰期短且容易被清水稀釋毒性，所以毒化災除污區地板不一定需要覆蓋塑膠布","D":"受污染的患者若考慮脫除受污染衣物，在脫除衣物時注意以從腳到頭、從下而上的方式，剪下衣物，並由內向外捲減少污染擴散"},"answer":"C","explanation":"P1469-1471\n輻射污染可以用輻射偵檢器檢測出，並且可以精確的訂出污染範圍(如病人只有某部分肢體受污)；而毒化物種類多樣，無法使用單一儀器來辨識所有的毒化物\n大量水清洗「全面除污」適用於毒化災，以稀釋毒物濃度；輻射污染講求「精準除污」，適量水清洗以減少輻射污物擴散及污水量(輻射污水較難處理)\n脫除衣服應由上而下，避免重要部位眼口鼻的二次污染\n毒化災污水考量到半衰期短、用水可稀釋毒性以及環境可自然分解，故相較於輻射污水可考慮不使用塑膠布(污水排到環境中相對沒那麼嚴重)","source":"同學出題","manualChapter":"CH53"},{"id":45515,"question":"血友病（Hemophilia）患者因凝血因子缺乏而容易反覆出血。在各類出血併發症中，下列何者為導致血友病患者死亡的最主要出血部位？","options":{"A":"關節腔出血（Hemarthrosis）","B":"腸胃道出血（Gastrointestinal bleeding）","C":"中樞神經系統／顱內出血（Intracranial hemorrhage）","D":"腹膜後腔出血（Retroperitoneal bleeding）"},"answer":"C","source":"大白","manualChapter":"背誦題"},{"id":45516,"question":"颱風造成傷害送醫的病人，最多受傷的機轉前兩名為何?","options":{"A":"骨折脫臼、頭部外傷","B":"軟組織傷害、胸腹部鈍挫","C":"軟組織傷害、頭部外傷","D":"頭部外傷、骨折脫臼"},"answer":"C","source":"大白 p1547","manualChapter":"CH57"},{"id":45517,"question":"填入空格：______將口腔及鼻腔分開；______連接鼻腔與鼻咽。","options":{"A":"硬顎、外鼻孔","B":"硬顎、內鼻孔","C":"軟顎、外鼻孔","D":"軟顎、內鼻孔"},"answer":"B","source":"大白 p266","manualChapter":"CH12"},{"id":45518,"question":"填入空格：______將口腔及鼻腔分開；______連接鼻腔與鼻咽。","options":{"A":"硬顎、外鼻孔","B":"硬顎、內鼻孔","C":"軟顎、外鼻孔","D":"軟顎、內鼻孔"},"answer":"B","source":"大白 p266","manualChapter":"背誦題"},{"id":45519,"question":"細胞外液沒有以下哪些電解質?","options":{"A":"鉀離子","B":"鈉離子","C":"氯離子","D":"重碳酸根離子"},"answer":"A","source":"大白 p255","manualChapter":"CH12"},{"id":45520,"question":"細胞外液沒有以下哪些電解質?","options":{"A":"鉀離子","B":"鈉離子","C":"氯離子","D":"重碳酸根離子"},"answer":"A","source":"大白 p255","manualChapter":"背誦題"},{"id":45521,"question":"臨床解剖與超音波檢查常將腹部及骨盆內部空間劃分，下列何者為構成腹部內部空間的三個主要腔室？","options":{"A":"胸膜腔、縱隔腔、腹膜腔","B":"腹膜腔、後腹腔、骨盆腔","C":"腹膜腔、心包膜腔、胸膜腔","D":"後腹腔、胸膜腔、骨盆腔"},"answer":"B","source":"大白","manualChapter":"CH29"},{"id":45522,"question":"臨床解剖與超音波檢查常將腹部及骨盆內部空間劃分，下列何者為構成腹部內部空間的三個主要腔室？","options":{"A":"胸膜腔、縱隔腔、腹膜腔","B":"腹膜腔、後腹腔、骨盆腔","C":"腹膜腔、心包膜腔、胸膜腔","D":"後腹腔、胸膜腔、骨盆腔"},"answer":"B","source":"大白","manualChapter":"背誦題"},{"id":45523,"question":"有關細胞膜與細胞的「靜止膜電位」及「動作電位」敘述，下列何者正確？","options":{"A":"細胞膜主要結構為雙層磷脂層，外層帶親水性","B":"細胞膜內外間具有電位差，在靜止狀態下細胞膜通常維持「內正外負」的狀態","C":"動作電位的形成首先是由鉀離子通道開啟使細胞膜去極化","D":"一般來說氯離子的濃度是細胞內比細胞外高"},"answer":"A","source":"大白","manualChapter":"CH12"},{"id":45524,"question":"有關細胞膜與細胞的「靜止膜電位」及「動作電位」敘述，下列何者正確？","options":{"A":"細胞膜主要結構為雙層磷脂層，外層帶親水性","B":"細胞膜內外間具有電位差，在靜止狀態下細胞膜通常維持「內正外負」的狀態","C":"動作電位的形成首先是由鉀離子通道開啟使細胞膜去極化","D":"一般來說氯離子的濃度是細胞內比細胞外高"},"answer":"A","source":"大白","manualChapter":"背誦題"},{"id":45525,"question":"填入空格：從病人心跳停止導致腦部失去血液供應的那一刻算起，____分鐘後腦細胞就會因為缺氧而損傷，____ 分鐘後將產生不可逆的大範圍壞死","options":{"A":"10、20","B":"8、 16","C":"1、10","D":"4、10"},"answer":"D","source":"大白","manualChapter":"CH23"},{"id":45526,"question":"填入空格：猝死病人若能在____分鐘內接受心肺復甦術，並且在____分鐘內接受必要的電擊去顫術，甚至恢復自發性心肺循環，將可使存活率提高至____％之多","options":{"A":"4, 8,35~50％","B":"10 ,15,35~50％","C":"4,8,49~75％","D":"10,15,49~75％"},"answer":"C","source":"大白","manualChapter":"CH23"},{"id":45527,"question":"CPR是維持心臟和腦部灌流最重要的急救措施，因此施救者須盡量減少中斷壓胸的時間。CCF即「持續壓胸時間加總」占「整體搶救過程的總時程」的比例。關於CCF的目標敘述何者錯誤?","options":{"A":"CCF至少達到60％以上","B":"CCF最好能達到80％以上","C":"電擊前停止壓胸到電擊後恢復壓胸其間隔(peri-shock pause)盡量小於20 秒","D":"施救者之間換手的間隔要小於5秒"},"answer":"D","source":"大白","manualChapter":"CH23"},{"id":45528,"question":"填入空格：心肺復甦術可以有效減緩轉____為____的速度、並增加電擊去顫的成功率，其原因為：高品質的心肺復甦術仍然能產生一定程度的血液輸出量，並維持心臟冠狀動脈和腦組織的灌流","options":{"A":"VF、Asystole","B":"VT、Asystole","C":"VF、PEA","D":"VT、PEA"},"answer":"A","source":"大白","manualChapter":"CH23"},{"id":45529,"question":"填入空格：從病人心跳停止導致腦部失去血液供應的那一刻算起，____分鐘後腦細胞就會因為缺氧而損傷，____ 分鐘後將產生不可逆的大範圍壞死","options":{"A":"10、20","B":"8、 16","C":"1、10","D":"4、10"},"answer":"D","source":"大白","manualChapter":"背誦題"},{"id":45530,"question":"填入空格：猝死病人若能在____分鐘內接受心肺復甦術，並且在____分鐘內接受必要的電擊去顫術，甚至恢復自發性心肺循環，將可使存活率提高至____％之多","options":{"A":"10、15、 49~75％","B":"4、  8、 35~50％","C":"4、 8、 49~75％","D":"10 、 15、 35~50％"},"answer":"C","source":"大白","manualChapter":"背誦題","explanation":"CH23 p627"},{"id":45531,"question":"CPR是維持心臟和腦部灌流最重要的急救措施，因此施救者須盡量減少中斷壓胸的時間。CCF即「持續壓胸時間加總」占「整體搶救過程的總時程」的比例。關於CCF的目標敘述何者錯誤?","options":{"A":"CCF最好能達到80％以上","B":"施救者之間換手的間隔要小於10秒","C":"電擊前停止壓胸到電擊後恢復壓胸其間隔(peri-shock pause)盡量小於20 秒","D":"CCF至少達到60％以上"},"answer":"B","source":"大白","manualChapter":"背誦題","explanation":"CH23 p634\n施救者之間換手的間隔要小於5秒"},{"id":45532,"question":"填入空格：從40~80歲時，腎臟的重量約減少____ ％，腎功能的持續下降容易使高齡病人因為外傷、泌尿道阻塞、感染或血管阻塞而造成腎衰竭。","options":{"A":"10%","B":"20%","C":"40%","D":"50%"},"answer":"B","source":"大白","manualChapter":"CH47"},{"id":45533,"question":"填入空格：從40~80歲時，腎臟的重量約減少____ ％，腎功能的持續下降容易使高齡病人因為外傷、泌尿道阻塞、感染或血管阻塞而造成腎衰竭。","options":{"A":"10%","B":"20%","C":"40%","D":"50%"},"answer":"B","source":"大白","manualChapter":"背誦題"},{"id":45534,"question":"填入空格：從30歲到80歲時，腎血流量平均降低____ ％，腎血流量的降低會造成腎小球過濾速度等比例的減少，約每10年下降8mL/min。","options":{"A":"10%","B":"20%","C":"40%","D":"50%"},"answer":"D","source":"大白","manualChapter":"CH47"},{"id":45535,"question":"填入空格：從30歲到80歲時，腎血流量平均降低____ ％，腎血流量的降低會造成腎小球過濾速度等比例的減少，約每10年下降8mL/min。","options":{"A":"10%","B":"20%","C":"40%","D":"50%"},"answer":"D","source":"大白","manualChapter":"背誦題"},{"id":45536,"question":"填入空格：當一個人65 歲以後，淨體重會減少____ ％和脂肪組織會增加____ ％，這些身體組成的改變會影響到給藥的劑量及頻率","options":{"A":"10、30","B":"25、35","C":"25、50","D":"10、35"},"answer":"B","source":"大白","manualChapter":"CH47"},{"id":45537,"question":"填入空格：當一個人65 歲以後，淨體重會減少____ ％和脂肪組織會增加____ ％，這些身體組成的改變會影響到給藥的劑量及頻率","options":{"A":"10、30","B":"25、35","C":"25、50","D":"10、35"},"answer":"B","source":"大白","manualChapter":"背誦題"},{"id":45538,"question":"填入空格：根據統計高處墜落跟骨骨折傷患中，____％會合併脊椎骨折；____％為雙側跟骨骨折。","options":{"A":"40、20","B":"5、10","C":"20、10","D":"10、5"},"answer":"D","source":"大白p801","manualChapter":"CH30"},{"id":45539,"question":"填入空格：根據統計高處墜落跟骨骨折傷患中，____％會合併脊椎骨折；____％為雙側跟骨骨折。","options":{"A":"40、20","B":"5、10","C":"20、10","D":"10、5"},"answer":"D","source":"大白p801","manualChapter":"背誦題"},{"id":45540,"question":"下列何者不是老年人心臟衰竭常見的症狀和徵候？","options":{"A":"乾咳進展到咳泡沫痰","B":"食慾不振","C":"喘","D":"體重增輕"},"answer":"D","source":"大白 p1249","manualChapter":"CH47"},{"id":45541,"question":"老年人慢性高血壓常和很多疾病有關，下列何者為非?","options":{"A":"動脈瘤形成","B":"失明","C":"骨質疏鬆症","D":"中風"},"answer":"C","source":"大白 p1250","manualChapter":"CH47"},{"id":45542,"question":"填入空格：高血糖高滲透壓昏迷是糖尿病高齡病人一個嚴重的併發症，死亡率約有____％。","options":{"A":"10~30％","B":"30~60％","C":"60~80％","D":"20~50％"},"answer":"D","source":"大白 p1251","manualChapter":"CH47"},{"id":45543,"question":"填入空格：高血糖高滲透壓(HHS)昏迷是糖尿病高齡病人一個嚴重的併發症，死亡率約有____％。","options":{"A":"10~30％","B":"30~60％","C":"60~80％","D":"20~50％"},"answer":"D","source":"大白 p1251","manualChapter":"背誦題"},{"id":45544,"question":"填入空格：大約____％的高齡病人有糖尿病，第二型糖尿病(非胰島素依賴性)在高齡病人中最常見","options":{"A":"5％","B":"20％","C":"40％","D":"60％"},"answer":"B","source":"大白 p1251","manualChapter":"CH47"},{"id":45545,"question":"填入空格：大約____％的高齡病人有糖尿病，第二型糖尿病(非胰島素依賴性)在高齡病人中最常見","options":{"A":"5％","B":"20％","C":"40％","D":"60％"},"answer":"B","source":"大白 p1251","manualChapter":"背誦題"},{"id":45546,"question":"填入空格：腸胃道出血最常發生在____歲的病人中，死亡率大約____％","options":{"A":"30-40、10%","B":"30-40、30%","C":"60-90、10%","D":"60-90、30%"},"answer":"C","source":"大白 p1252","manualChapter":"CH47"},{"id":45547,"question":"填入空格：腸胃道出血最常發生在____歲的病人中，死亡率大約____％","options":{"A":"30-40、10%","B":"30-40、30%","C":"60-90、10%","D":"60-90、30%"},"answer":"C","source":"大白 p1252","manualChapter":"背誦題"},{"id":45548,"question":"填入空格：肝動脈來自腹腔幹，成人每分鐘的肝臟血流量有____毫升","options":{"A":"500~1,000","B":"1,000~1,500","C":"1,500 ~2,000","D":"2,000~2,500"},"answer":"C","source":"","manualChapter":"CH12"},{"id":45549,"question":"填入空格：肝動脈來自腹腔幹，成人每分鐘的肝臟血流量有____毫升","options":{"A":"500~1,000","B":"1,000~1,500","C":"1,500 ~2,000","D":"2,000~2,500"},"answer":"C","source":"","manualChapter":"背誦題"},{"id":45550,"question":"填入空格：寶寶腦部與神經系統為了要給予腦部成長的空間，後囟門，即頭顱骨間未癒合之關節，直到____個月大前都會保持開啟，前囟門於出生後____個月都不會閉合","options":{"A":"3、9~18","B":"9~18、3","C":"6、9~18","D":"9~18、6"},"answer":"A","source":"","manualChapter":"CH13"},{"id":45551,"question":"填入空格：寶寶腦部與神經系統為了要給予腦部成長的空間，後囟門，即頭顱骨間未癒合之關節，直到____個月大前都會保持開啟，前囟門於出生後____個月都不會閉合","options":{"A":"3、9~18","B":"9~18、3","C":"6、9~18","D":"9~18、6"},"answer":"A","source":"","manualChapter":"背誦題"},{"id":45552,"question":"學齡前兒童的何種組織在比例上會比成人偏大，且免疫系統正經歷許多變化?","options":{"A":"淋巴組織","B":"腦組織","C":"肺泡組織","D":"肌肉組織"},"answer":"A","source":"大白p314","manualChapter":"CH13"},{"id":45553,"question":"學齡前兒童的何種組織在比例上會比成人偏大，且免疫系統正經歷許多變化?","options":{"A":"淋巴組織","B":"腦組織","C":"肺泡組織","D":"肌肉組織"},"answer":"A","source":"大白p314","manualChapter":"背誦題"},{"id":45554,"question":"心臟位於胸腔之中，受到胸廓骨骼的嚴密保護，位置大約位在胸骨及第___肋骨後之縱隔腔","options":{"A":"1-3","B":"3-6","C":"4-8","D":"9-12"},"answer":"B","source":"大白p539","manualChapter":"CH20"},{"id":45555,"question":"心臟位於胸腔之中，受到胸廓骨骼的嚴密保護，位置大約位在胸骨及第___肋骨後之縱隔腔","options":{"A":"1-3","B":"3-6","C":"4-8","D":"9-12"},"answer":"B","source":"大白p539","manualChapter":"背誦題"},{"id":45556,"question":"橫膈肌向上進入胸部，最高位可達第幾肋?","options":{"A":"2","B":"4","C":"6","D":"8"},"answer":"B","source":"大白p749","manualChapter":"CH28"},{"id":45557,"question":"橫膈肌向上進入胸部，最高位可達第幾肋?","options":{"A":"2","B":"4","C":"6","D":"8"},"answer":"B","source":"大白p749","manualChapter":"背誦題"},{"id":45558,"question":"幾歲進入成人晚期?","options":{"A":"51","B":"61","C":"71","D":"81"},"answer":"B","source":"大白p319","manualChapter":"CH13"},{"id":45559,"question":"幾歲進入成人晚期?","options":{"A":"51","B":"61","C":"71","D":"81"},"answer":"B","source":"大白p319","manualChapter":"背誦題"},{"id":45560,"question":"肺部可容納平常所需氣體幾倍的容量?","options":{"A":"3","B":"5","C":"8","D":"10"},"answer":"C","source":"大白p333","manualChapter":"CH14"},{"id":45561,"question":"肺部可容納平常所需氣體幾倍的容量?","options":{"A":"3","B":"5","C":"8","D":"10"},"answer":"C","source":"大白p333","manualChapter":"背誦題"},{"id":45562,"question":"人體內腦脊髓液的總體積約為幾毫升?","options":{"A":"10-30","B":"50-80","C":"125-150","D":"200-300"},"answer":"C","source":"大白p962","manualChapter":"CH36"},{"id":45563,"question":"人體內腦脊髓液的總體積約為幾毫升?","options":{"A":"10-30","B":"50-80","C":"125-150","D":"200-300"},"answer":"C","source":"大白p962","manualChapter":"背誦題"},{"id":45564,"question":"身體的那個部位是以感覺的訊息為基礎，調節隨意和不隨意的大動作？","options":{"A":"中腦","B":"小腦","C":"腦幹","D":"脊髓"},"answer":"B","source":"大白p262","manualChapter":"CH12"},{"id":45565,"question":"STEMI 發生多久後的 T 波倒立，在臨床上被視為重灌流現象?","options":{"A":"1小時內","B":"24-48小時","C":"5-7天","D":"1-3週"},"answer":"D","source":"大白p903","manualChapter":"CH34"},{"id":45566,"question":"STEMI 發生多久後的 T 波倒立，在臨床上被視為重灌流現象?","options":{"A":"1小時內","B":"24-48小時","C":"5-7天","D":"1-3週"},"answer":"D","source":"大白p903","manualChapter":"背誦題"},{"id":45567,"question":"規則陣痛之定義為兩次陣痛之間隔⼩於幾分鐘?","options":{"A":"1","B":"5","C":"10","D":"30"},"answer":"B","source":"大白p1297","manualChapter":"CH49"},{"id":45568,"question":"規則陣痛之定義為兩次陣痛之間隔⼩於幾分鐘?","options":{"A":"1","B":"5","C":"10","D":"30"},"answer":"B","source":"大白p1297","manualChapter":"背誦題"},{"id":45569,"question":"填入空格：子宮頸的擴張速度在初產婦可達每小時____公分，而經產婦(生第二胎以上)每小時可達____公分?","options":{"A":"2、10","B":"1、2","C":"3、5","D":"5、10"},"answer":"D","source":"大白p1297","manualChapter":"CH49"},{"id":45570,"question":"填入空格：子宮頸的擴張速度在初產婦可達每小時____公分，而經產婦(生第二胎以上)每小時可達____公分?","options":{"A":"2、10","B":"1、2","C":"3、5","D":"5、10"},"answer":"D","source":"大白p1297","manualChapter":"背誦題"},{"id":45571,"question":"何種病患常見的中心體溫範圍最高通常不超過攝氏39度？","options":{"A":"熱中暑","B":"熱衰竭","C":"熱痙攣","D":"以上皆是"},"answer":"B","source":"大白p1149","manualChapter":"CH44"},{"id":45572,"question":"何種病患常見的中心體溫範圍最高通常不超過攝氏39度？","options":{"A":"熱中暑","B":"熱衰竭","C":"熱痙攣","D":"以上皆是"},"answer":"B","source":"大白p1149","manualChapter":"背誦題"},{"id":45573,"question":"何種白血球會釋放組織胺產生局部的發炎或引發過敏反應？","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"D","source":"大白p291","manualChapter":"CH12"},{"id":45574,"question":"何種白血球會釋放組織胺產生局部的發炎或引發過敏反應？","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"D","source":"大白p291","manualChapter":"背誦題"},{"id":45575,"question":"何種白血球會分化成T細胞、B細胞及NK細胞(Natural Killer)，T細胞可以直接攻擊抗原及召喚其它淋巴球、B細胞可分泌抗體、NK細胞負責監察及破壞體內不正常的細胞?","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"C","source":"大白p291","manualChapter":"CH12"},{"id":45576,"question":"何種白血球會分化成T細胞、B細胞及NK細胞(Natural Killer)，T細胞可以直接攻擊抗原及召喚其它淋巴球、B細胞可分泌抗體、NK細胞負責監察及破壞體內不正常的細胞?","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"C","source":"大白p291","manualChapter":"背誦題"},{"id":45577,"question":"何種白血球只占白血球的3％，但在特殊狀況如過敏反應或寄生蟲感染時數量大增，可吞噬抗原抗體複合物","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"B","source":"大白p291","manualChapter":"CH12"},{"id":45578,"question":"何種白血球只占白血球的3％，但在特殊狀況如過敏反應或寄生蟲感染時數量大增，可吞噬抗原抗體複合物","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"B","source":"大白p291","manualChapter":"背誦題"},{"id":45579,"question":"何種白血球數目最多(約50 ~70％），具有吞噬細菌的作用","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"A","source":"大白p291","manualChapter":"CH12"},{"id":45580,"question":"何種白血球數目最多(約50 ~70％），具有吞噬細菌的作用","options":{"A":"嗜中性白血球","B":"嗜酸性白血球","C":"淋巴球","D":"嗜鹼性白血球"},"answer":"A","source":"大白p291","manualChapter":"背誦題"},{"id":45581,"question":"何種腺體的功能是增加鈣離子濃度？","options":{"A":"腎上腺素","B":"副甲狀腺素","C":"甲狀腺","D":"性腺"},"answer":"B","source":"大白","manualChapter":"背誦題"},{"id":45582,"question":"麻痺性腸阻塞定義上為超過幾分鐘以上沒有聽到腸蠕動音?","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"B","source":"大白p550","manualChapter":"CH20"},{"id":45583,"question":"麻痺性腸阻塞定義上為超過幾分鐘以上沒有聽到腸蠕動音?","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"B","source":"大白p550","manualChapter":"背誦題"},{"id":45584,"question":"食道/胃靜脈曲張的病人死亡率極高，約占幾%?","options":{"A":"10%","B":"25%","C":"40%","D":"50%"},"answer":"B","source":"大白p1015","manualChapter":"CH38"},{"id":45585,"question":"食道/胃靜脈曲張的病人死亡率極高，約占幾%?","options":{"A":"10%","B":"25%","C":"40%","D":"50%"},"answer":"B","source":"大白p1015","manualChapter":"背誦題"},{"id":45586,"question":"下列何者非Charcot's triad (夏柯氏三徵象)的症狀?","options":{"A":"下肢水腫","B":"右下腹疼痛","C":"黃疸","D":"發燒"},"answer":"A","source":"大白p1023","manualChapter":"CH38"},{"id":45587,"question":"懷孕期間母體的生理會產生巨大變化。關於懷孕後期的生理改變，下列敘述何者錯誤？","options":{"A":"母體總血量與心輸出量約增加 30%","B":"潮氣容積與每分鐘換氣量增加，以因應胎兒的氧氣需求","C":"因為子宮增大壓迫下腔靜脈，懷孕後期產婦的血壓通常會比未懷孕時顯著降低 10~15 mmHg","D":"橫膈膜被增大的子宮往上推擠，可能導致產婦出現輕微的呼吸窘迫"},"answer":"C","explanation":"懷孕期間血壓的變化為：在「第二孕期 (4~6個月)」會下降約 10~15 mmHg，但在「懷孕末期」會回升至正常的產前血壓，而非顯著降低。","source":"AI出題","manualChapter":"CH49"},{"id":45588,"question":"到院前救護人員在搬運懷孕 30 週的孕婦時，若產婦採平躺姿勢，突然出現血壓下降、頭暈、冒冷汗的症狀。此現象最可能的原因與最佳處置為何？","options":{"A":"胎盤早期剝離導致內出血；應立即給予大量靜脈輸液","B":"仰臥性低血壓症候群；應將產婦改為左側躺，或徒手將子宮向左推","C":"子癇前症發作；應準備抽吸工具並給予高濃度氧氣","D":"羊水栓塞；應立即進行正壓通氣並準備 CPR"},"answer":"B","explanation":"仰臥性低血壓症候群 (Supine hypotensive syndrome) 常見於懷孕 20 週以上的孕婦，因為平躺時沉重的子宮會壓迫下腔靜脈，阻礙靜脈血液回流心臟，導致血壓下降。最佳處置為將產婦改為左側躺，或用手將子宮往左側推移。","source":"AI出題","manualChapter":"CH49"},{"id":45589,"question":"一名 32 歲懷孕 36 週的孕婦，突發劇烈下腹部持續性疼痛，腹部觸診時子宮僵硬如木板且有壓痛，無明顯陰道出血。產婦心跳 125 次/分，血壓 90/60 mmHg。依據臨床表徵，最可能的診斷為何？","options":{"A":"前置胎盤 (Placenta previa)","B":"胎盤早期剝離 (Abruptio placenta)","C":"子宮外孕 (Ectopic pregnancy)破裂","D":"骨盆腔發炎 (PID)"},"answer":"B","explanation":"「胎盤早期剝離」的典型特徵為劇烈腹痛、子宮收縮僵硬如木板，且出血可能隱藏在胎盤與子宮壁之間，導致外觀無明顯陰道出血，但病人已呈現休克。「前置胎盤」則是無痛性的鮮血流出。","source":"AI出題","manualChapter":"CH49"},{"id":45590,"question":"關於「前置胎盤」與「胎盤早期剝離」的臨床鑑別，下列敘述何者正確？","options":{"A":"前置胎盤通常伴隨劇烈腹痛；胎盤早期剝離則是無痛性出血","B":"胎盤早期剝離的陰道出血量一定比前置胎盤大，因此休克風險較高","C":"前置胎盤通常表現為無痛性、鮮紅色的陰道大出血；胎盤早期剝離則常伴隨子宮痙攣僵硬與強烈腹痛","D":"兩者皆主要發生在懷孕第一孕期 (前三個月)"},"answer":"C","explanation":"前置胎盤 (Placenta previa) 的特徵是無痛、鮮紅色的陰道大出血；胎盤早期剝離 (Abruptio placenta) 則是劇烈腹痛、子宮僵硬，出血可能隱藏。兩者皆主要發生於懷孕第三孕期 (後期)。","source":"AI出題","manualChapter":"CH49"},{"id":45591,"question":"救護人員抵達民宅，發現一名懷孕 38 週的產婦剛破水，且陰道口可見一條搏動的條索狀物體掉出（臍帶脫垂）。此時救護人員的優先處置為何？","options":{"A":"鼓勵產婦用力閉氣向下推擠，盡速讓胎兒娩出以解除臍帶壓迫","B":"用無菌紗布將脫出的臍帶輕輕塞回子宮頸內","C":"將產婦擺成膝胸臥式 (Knee-chest position)，戴無菌手套將手指伸入陰道把胎頭往上頂，減輕對臍帶的壓迫","D":"立即在現場用無菌剪刀夾斷臍帶，防止胎兒血液逆流"},"answer":"C","explanation":"臍帶脫垂時，胎頭會壓迫臍帶切斷胎兒的血流與氧氣。絕對不可將臍帶塞回（易造成血管痙攣），也不可讓產婦用力推擠。應讓產婦採取膝胸臥式 (Knee-chest position) 或墊高臀部，救護員需戴無菌手套將手指伸入陰道把胎頭往上托高，直到抵達醫院交接。","source":"AI出題","manualChapter":"CH49"},{"id":45592,"question":"一名曾有剖腹產病史的懷孕 39 週產婦，在家中待產陣痛時，突然發出慘叫，隨後表示陣痛停止了，但下腹部出現撕裂般的劇痛。救護員觸診腹部發現原本隨陣痛變硬的子宮變得異常柔軟，且產婦開始出現休克徵象。此為下列何種急症的典型表現？","options":{"A":"羊水栓塞 (Amniotic fluid embolism)","B":"子宮破裂 (Uterine rupture)","C":"前置胎盤 (Placenta previa)","D":"子癇症 (Eclampsia)"},"answer":"B","explanation":"子宮破裂常發生在有剖腹產疤痕的產婦。典型表現為待產時突然發生撕裂般劇痛，隨後陣痛停止，原本僵硬的子宮因破裂出血而變軟，產婦會迅速進入低血容性休克。","source":"AI出題","manualChapter":"CH49"},{"id":45593,"question":"在急產接生的流程中，當胎頭完全娩出後，救護技術員的第一個動作應該是？","options":{"A":"立刻用吸球抽吸新生兒的口部與鼻部","B":"檢查胎兒頸部是否有臍帶繞頸","C":"將胎頭向下牽引，協助上側肩膀娩出","D":"給予新生兒腳底刺激，促使其哭泣"},"answer":"B","explanation":"胎頭產出後，救護員的第一個動作必須是「滑動手指檢查頸部是否有臍帶繞頸」。若有，應嘗試將其輕輕滑過胎頭解開。","source":"AI出題","manualChapter":"CH49"},{"id":45594,"question":"關於新生兒娩出後的「斷臍」時機，依據目前美國婦產醫學會與世界衛生組織的建議，下列敘述何者正確？","options":{"A":"胎兒產出後應立刻 (10秒內) 夾斷臍帶，以防母體血液帶有感染源進入胎兒","B":"若無特殊情況，建議延遲斷臍至胎兒產出後 30~60 秒，讓胎盤血液回流至新生兒","C":"必須等到胎盤完全娩出後，才可以進行夾臍與斷臍","D":"救護員在到院前絕對不可剪斷臍帶，僅能使用臍帶夾夾住"},"answer":"B","explanation":"最新的醫學共識建議「延遲斷臍」。若新生兒狀況允許，應在胎兒產出後等待 30~60 秒再進行臍帶夾取，這有助於胎盤內的血液回流至新生兒，增加其血紅素儲備並減少貧血。","source":"AI出題","manualChapter":"CH49"},{"id":45595,"question":"關於新生兒急救的指標與處置，下列敘述何者正確？","options":{"A":"若新生兒軀幹粉紅但四肢發紺，代表嚴重缺氧，需立即實施 CPR","B":"若新生兒心跳為 80 次/分，應立即開始胸外按壓","C":"若新生兒心跳為 90 次/分，應立即給予正壓通氣 (PPV)","D":"若新生兒羊水有胎便染色，無論新生兒活力如何，產出後第一步必須立即進行氣管插管抽吸"},"answer":"C","explanation":"新生兒急救指標：心跳若 < 100 次/分，第一步是立即給予正壓通氣 (PPV)。若心跳 < 60 次/分，才開始胸外按壓。新生兒四肢發紺 (Acrocyanosis) 是初期正常現象，只要軀幹粉紅即不需過度緊張。最新版準則已不再建議常規對胎便染色新生兒進行插管抽吸。","source":"AI出題","manualChapter":"CH49"},{"id":45596,"question":"關於產後大出血 (Post-partum bleeding) 的定義與處置，下列何者正確？","options":{"A":"定義為自然產後 24 小時內出血量大於 1,000 cc","B":"最常見的原因是子宮頸撕裂傷","C":"若發生產後大出血，救護員應將手伸入產道內探查是否有殘留胎盤","D":"處置上應給予產婦子宮底環形按摩，以促進子宮收縮並控制出血"},"answer":"D","explanation":"產後大出血定義為自然產後 24 小時內出血大於 500 cc (剖腹產 >1000 cc)。最常見原因為子宮收縮不良。到院前處置應給予「子宮底環形按摩」促進收縮，嚴禁將手伸入產道探查。","source":"AI出題","manualChapter":"CH49"},{"id":45597,"question":"評估新生兒狀況的「阿普加評分 (Apgar Score)」包含五個項目。若一名剛出生一分鐘的新生兒表現如下：身體粉紅但四肢發紺、心跳 110 次/分、給予刺激時會皺眉但無明顯哭聲、四肢有輕微彎曲活動力、呼吸微弱不規則。請問其 Apgar Score 為幾分？","options":{"A":"4 分","B":"5 分","C":"6 分","D":"7 分"},"answer":"C","explanation":"Apgar Score 評分如下：\n* 外觀 (膚色)：軀幹粉紅、四肢發紺 -> 1 分。\n* 脈搏 (心跳)：110 次/分 (≥ 100) -> 2 分。\n* 反射 (Grimace)：皺眉但無大哭 -> 1 分。\n* 活動力 (肌肉張力)：輕微彎曲 -> 1 分。\n* 呼吸：微弱不規則 -> 1 分。\n總分 = 1+2+1+1+1 = 6 分 (輕度窘迫)。","source":"AI出題","manualChapter":"CH49"},{"id":45598,"question":"妊娠毒血症 (子癇前症) 若未妥善控制，進展為「子癇症 (Eclampsia)」時，產婦會出現下列哪一種最具威脅性的症狀？","options":{"A":"突發性肺栓塞","B":"瀰漫性血管內凝血 (DIC)","C":"癲癇大發作 (Tonic-clonic seizure)","D":"嚴重產後大出血"},"answer":"C","explanation":"子癇前症 (Pre-eclampsia) 的三大症狀為高血壓、水腫、蛋白尿。當病況惡化並引發「癲癇大發作 (全身性強直陣攣性發作)」時，即稱為子癇症 (Eclampsia)。","source":"AI出題","manualChapter":"CH49"},{"id":45599,"question":"救護人員抵達現場，發現一名產婦已將嬰兒產出，但嬰兒全身仍被一層完整的透明薄膜包覆著，囊內充滿液體。此現象稱為「人魚寶寶 (En-caul birth)」。救護員的下一步處置為何？","options":{"A":"連同羊膜囊一起將嬰兒保暖包覆，火速送醫，不可將其刺破以免感染","B":"迅速且輕柔地使用尖銳工具或手指將羊膜囊弄破，將嬰兒取出以進行評估與呼吸道處置","C":"立即在羊膜囊外進行 CPR 壓胸","D":"等待胎盤自行娩出後，羊膜囊會自動破裂，在此之前不需介入"},"answer":"B","explanation":"「人魚寶寶」出生時仍包覆在羊膜囊中，此時胎兒無法接觸空氣自主呼吸。救護員必須迅速且輕柔地（用尖銳工具或手指）將羊膜刺破並移除，以免新生兒窒息，並立即接續新生兒急救與保暖流程。","source":"AI出題","manualChapter":"CH49"},{"id":45600,"question":"關於性侵害案件的到院前救護處置原則，下列敘述何者「錯誤」？","options":{"A":"為了保全證據，絕對不可讓被害人在送醫前洗澡、刷牙或更換衣物","B":"應盡量由同性別的救護人員進行病史詢問與理學檢查","C":"為釐清案情，救護員應詳細詢問施暴者「是否有真正進入」等案發細節，並詳細記錄於救護紀錄表","D":"除非會陰部有危及生命的大出血需要加壓止血，否則不應對會陰部進行檢查與清理"},"answer":"C","explanation":"處理性侵案件時，救護員**絕對不可**過度詢問案發細節（如是否有真正進入），這會對受害者造成嚴重的「二次傷害」。病史詢問應僅限於醫療處置必要的範圍。","source":"AI出題","manualChapter":"CH49"},{"id":45601,"question":"肩難產 (Shoulder dystocia) 是一種嚴重的生產急症，通常發生在胎兒頭部娩出後，肩膀卡在產婦的恥骨聯合處無法產出。在到院前環境遇到此情況，救護員的處置何者最為適當？","options":{"A":"用力牽引胎兒頭部，將其硬拉出來","B":"使用器械將胎兒鎖骨折斷以縮小體積","C":"鼓勵產婦憋氣持續用力推擠","D":"立即請求醫療指導，準備緊急送醫，並避免牽引胎頭以免造成胎兒臂神經叢損傷"},"answer":"D","explanation":"肩難產發生時，胎兒的肩膀卡在母體恥骨後方。救護員**絕對不可用力牽引胎兒頭部**，否則會扯斷胎兒的臂神經叢造成永久殘廢。應避免產婦推擠，立即請求線上醫療指導並火速送醫。","source":"AI出題","manualChapter":"CH49"},{"id":45602,"question":"關於婦科急症「卵巢囊腫破裂」，下列敘述何者正確？","options":{"A":"最常發生在停經後的老年婦女","B":"破裂後會導致大量陰道出血，但腹部通常不會有疼痛感","C":"可能在劇烈性行為後發生，導致急性腹痛與內出血，嚴重者會引發低血容性休克","D":"處置上應讓病患採頭低腳高姿勢，並鼓勵其多喝水補充體液"},"answer":"C","explanation":"卵巢囊腫破裂常發生於年輕女性經期來潮前一週，或在激烈性行為後因外力破裂。囊腫破裂會將液體與血液釋放至腹腔，引發急性腹痛與內出血，嚴重時會導致休克。","source":"AI出題","manualChapter":"CH49"},{"id":45603,"question":"一名 28 歲女性，主訴突發性下腹劇痛，伴隨頭暈、冒冷汗。病史詢問發現其最後一次月經是 7 週前。理學檢查：血壓 80/50 mmHg，心跳 130 次/分，腹部有明顯壓痛與反彈痛。此時最需高度懷疑的急症為何？","options":{"A":"骨盆腔發炎 (PID)","B":"子宮內膜異位症急性發作","C":"子宮外孕破裂 (Ruptured ectopic pregnancy)","D":"卵巢過度刺激症候群 (OHSS)"},"answer":"C","explanation":"育齡期女性出現突發下腹痛、停經史 (最後一次月經 7 週前)，且伴隨低血容性休克徵象 (低血壓、心跳快)，在到院前必須高度懷疑並當作「子宮外孕破裂」處理，此為分秒必爭的致命急症。","source":"AI出題","manualChapter":"CH49"},{"id":45604,"question":"一名孕婦在分娩即將結束時，突然出現呼吸窘迫、發紺、血壓驟降並陷入休克，隨後發生心跳停止。由於該急症致死率極高（可達 80%），救護員應高度懷疑是下列何種併發症？","options":{"A":"羊水栓塞 (Amniotic fluid embolism)","B":"仰臥性低血壓症候群","C":"子癇前症","D":"前置胎盤大出血"},"answer":"A","explanation":"羊水栓塞是生產前後極其凶險的併發症。羊水進入母體血液循環後，會引發嚴重的過敏性休克、肺栓塞與瀰漫性血管內凝血 (DIC)，產婦會突發缺氧、休克並迅速失去生命徵象。","source":"AI出題","manualChapter":"CH49"},{"id":45605,"question":"在急產接生的流程中，當發現新生兒有「臍帶繞頸」的情況時，救護技術員的優先處置步驟為何？","options":{"A":"立即使用無菌剪刀將臍帶剪斷","B":"嘗試用手指將臍帶從胎兒頸部上方滑脫解開","C":"將產婦推上救護車，停止接生並立刻飆車送醫","D":"將胎兒倒提拉出以加速脫離產道"},"answer":"B","explanation":"發現臍帶繞頸時，首要動作是用手指嘗試將臍帶撐開，並從胎兒頭部上方滑脫解開。若纏繞過緊無法解開，才考慮在現場用兩把臍帶夾夾住後剪斷。","source":"AI出題","manualChapter":"CH49"},{"id":45606,"question":"人工生殖技術中常見的「卵巢過度刺激症候群 (OHSS)」，是由於大量賀爾蒙刺激卵巢所引起。下列何者「不是」OHSS 發展到重度時常見的致命併發症？","options":{"A":"大量腹水積聚","B":"呼吸困難","C":"骨盆腔神經壞死","D":"血液濃縮導致血栓形成"},"answer":"C","explanation":"人工生殖接受賀爾蒙治療引發的卵巢過度刺激症候群 (OHSS)，是因為微血管通透性增加，導致血液中水分大量漏出至腹腔或胸腔。常見併發症為大量腹水、呼吸困難，以及因血液濃縮而引發的血栓形成或腎衰竭。不包含神經壞死。","source":"AI出題","manualChapter":"CH49"},{"id":45607,"question":"填入空格：產後大出血定義為自然產後____內出血量大於____、剖腹生產超過____的出血","options":{"A":"1小時、 1,000 cc、2,000 cc","B":"1小時、500cc、1,000 cc","C":"24小時、1,000 cc、2,000 cc","D":"24小時、500cc、1,000 cc"},"answer":"D","source":"大白p1302","manualChapter":"CH49"},{"id":45608,"question":"填入空格：產後大出血定義為自然產後____內出血量大於____、剖腹生產超過____的出血","options":{"A":"1小時、 1,000 cc、2,000 cc","B":"1小時、500cc、1,000 cc","C":"24小時、1,000 cc、2,000 cc","D":"24小時、500cc、1,000 cc"},"answer":"D","source":"大白p1302","manualChapter":"背誦題"},{"id":45609,"question":"根據統計，約有多少的外傷死亡導因於胸部外傷?","options":{"A":"10%","B":"25%","C":"40%","D":"50%"},"answer":"B","source":"大白p754","manualChapter":"CH28"},{"id":45610,"question":"根據統計，約有多少的外傷死亡導因於胸部外傷?","options":{"A":"10%","B":"25%","C":"40%","D":"50%"},"answer":"B","source":"大白p754","manualChapter":"背誦題"},{"id":4011,"question":"下列四張心電圖分別代表心肌梗塞不同時期變化，請依時序排出正確順序。","options":{"A":"圖4→圖3→圖2→圖1。","B":"圖2→圖1→圖3→圖4。","C":"圖4→圖2→圖1→圖3。","D":"圖2→圖3→圖1→圖4。"},"answer":"D","source":"112年度EMTP筆試-題目卷(100題)(含答案)-1121221公告版","manualChapter":"CH33","image":"題庫圖片/4011.png"},{"id":45611,"question":"某些疾病可能因姿勢不同或遇到一些特殊的行動時，會導致不舒服的症狀加劇或緩解，以下配對何者錯誤?","options":{"A":"週期性低血鉀麻痺：高熱量大餐後肢體無力","B":"肋膜炎：深吸氣時胸痛加劇","C":"心包膜炎：坐姿時胸痛加劇","D":"低腦壓性頭痛：平躺時緩解"},"answer":"C","source":"同學出題","manualChapter":"CH19"},{"id":45612,"question":"關於胸部創傷敘述，下列何者為是？","options":{"A":"執行超音波e-FAST，在劍突處進行掃描，主要是確認橫膈膜是否破裂。","B":"執行胸部超音波時看到條碼徵候（barcode sign）表示傷患可能有氣胸的情形。","C":"發現開放性氣胸時，應進行針刺減壓，減低胸內壓力。","D":"針刺減壓時應選擇第五肋間腋中線前側肋骨下緣下針。"},"answer":"B","source":"同學出題","manualChapter":"CH28"},{"id":45613,"question":"關於醫者在告知病患或家屬壞消息時，所使用的SPIKES原則，下列敘述何者錯誤？","options":{"A":"S:Setting up（營造），營造一個適當的環境有助於壞消息的告知。","B":"P: Precise（精確），如實告知患者或家屬精確的診斷，增加對於病情的了解與接受度。","C":"E:Emotions（情感），同理病患或家屬的心情，其中包括觀察、嘗試訴說情緒、確定情緒原因以及給予對方時間並作出適當回應。","D":"S: Strategy and Summary（策略與總結），病人或家屬認知到壞消息之後，接下來應該嘗試給予一個可以執行的計畫，把病人或家屬拉回現實上應該要面對的問題，讓病人或家屬聚焦到現況。"},"answer":"B","source":"同學出題","manualChapter":"CH18"},{"id":45614,"question":"團隊資源管理(TRM)是一種系統化的方法，旨在優化團隊表現，最大化可用資源的利用，並提高工作效率和安全性。其中TRM有四大模組，不包含下列何者？","options":{"A":"領導能力(Leadership)","B":"有效溝通(Communication)","C":"狀況監控(Situation Monitoring)","D":"風險管理 (Risk Management)"},"answer":"D","source":"同學出題","manualChapter":"CH59"},{"id":45615,"question":"關於可能形成靜脈血栓的危險因子，下列敘述何者錯誤?","options":{"A":"靜脈損傷，如骨盆骨折或下肢手術後","B":"血液凝集能力增加，如懷孕或惡性腫瘤","C":"疾病，如心房顫動、糖尿病或大球性貧血","D":"靜脈滯留(Venostasis)如經濟艙症候群、肥胖或靜脈曲張"},"answer":"C","source":"同學出題","manualChapter":"CH35"},{"id":45616,"question":"有關心臟急症「心包膜填塞」，下列敘述何者正確?","options":{"A":"臨床處置適合使用胸痛流程中的MONA治療","B":"即使患者產生低血壓或休克等情形，到院前仍不考慮建立靜脈管路並予生理食鹽水","C":"臨床表現包含奇脈(pulsus paradoxus)現象，在吸氣時SBP出現了異常的下降","D":"所謂貝克氏三症狀(Beck's triad)指的是「呼吸不規則」、「頸靜脈怒張」，及「心音遙遠模糊」三典型症狀"},"answer":"C","source":"同學出題","manualChapter":"CH34"},{"id":45617,"question":"根據外傷與休克的相關生理與臨床表現，下列敘述何者錯誤？","options":{"A":"成人外傷出血性休克時，初期建議以溫晶質溶液進行急救，首次輸液量為 1 公升","B":"當病人符合 ABC score 中 2 項或以上時，可預測需要大量輸血","C":"敗血性休克極少在外傷後短時間發生，其初期的表現為高心輸出量及低血壓","D":"神經性休克是由於交感神經受損，臨床表現上病人的皮膚會呈現濕冷且蒼白"},"answer":"D","source":"同學出題","manualChapter":"CH26"},{"id":45618,"question":"有關皮膚系統基底層之敘述何者錯誤？","options":{"A":"含有黑色素細胞","B":"接受的紫外線產生維生素D3","C":"可以阻隔紫外線","D":"能持續分裂出新的細胞並向上推擠以取代上層細胞"},"answer":"C","source":"同學出題","manualChapter":"CH12"},{"id":45619,"question":"有關醫病溝通四步驟中，確認病人認知之技巧，不包含下列何者?","options":{"A":"確認病人之觀點與背景","B":"確認病人之需求與目標","C":"探求病情對生活之衝擊","D":"確認病人的動機與訴求"},"answer":"D","source":"同學出題","manualChapter":"CH18"},{"id":45620,"question":"當救護技術員與病人溝通時，適當使用一些技巧可協助病史詢問，下列關於這些技巧的敘述何者最不適當?","options":{"A":"促進：促進是指順勢引導，如「你是否胸痛」來確認患者是否該做EKG。","B":"反射：重複病人最後一句話的末尾幾個字，讓其知道你有專心聽他說話。","C":"澄清：患者頭暈，詢問是「天旋地轉」還是「頭重腳輕」請其詳細描述。","D":"同理心：如「感覺這件事讓你很困擾」適當表達同理心以建立醫病關係。"},"answer":"A","source":"同學出題","manualChapter":"CH19"},{"id":45621,"question":"關於細胞當中各胞器的主要功用，下列敘述何者錯誤?","options":{"A":"溶小體（lysosome）：細胞內的清道夫，可清除胞內的細菌及各種細胞碎屑","B":"核糖體（ribosome）：細胞內製造蛋白質的工廠","C":"粒線體（mitochondria）：細胞的發電機，可進行有氧代謝產生 ADP（二磷酸腺苷）","D":"內質網 （endoplasmic reticulum）：膜性網狀結構，提供合成蛋白質、脂質和碳水化合物的場所"},"answer":"C","source":"同學出題","manualChapter":"CH12"},{"id":45622,"question":"某一EMT-P學員完成模擬急救後，教官帶領學員回顧處置過程，並將學員的經驗與反思歸納為「5H5T」架構，協助學員建立可應用於不同急救情境的鑑別診斷觀念。上述教學活動最符合ERCP模式中的哪一階段？","options":{"A":"經驗（Experience）","B":"反思（Reflection）","C":"概念（Conceptualization）","D":"計畫（Planning）"},"answer":"C","source":"同學出題","manualChapter":"CH59"},{"id":45623,"question":"「醫學教育課程發展六大步驟」中「教學對象為儲備救護義消需求評估」，何者較不適當？","options":{"A":"教學對象可能平日較有空，課程可採長時間教學。","B":"補足先備知識之不足、拿捏課程或教案之難度。","C":"考量其身體狀況(例如：是否視力聽力不佳)。","D":"語言習慣(例如：習慣台語溝通)。"},"answer":"A","source":"同學出題","manualChapter":"CH60"},{"id":45624,"question":"呼吸系統疾病可歸因為通氣、擴散、灌流三大致病機轉，下列有關於三大致病機轉與所出現的呼吸系統疾病配對，何者正確？","options":{"A":"肌肉萎縮導致的呼吸衰竭為擴散所造成的問題。","B":"火災現場，一氧化碳中毒為擴散所造成的問題。","C":"急性肺水腫導致的低血氧為通氣所造成的問題。","D":"急性肺栓塞導致的低血氧為通氣所造成的問題。"},"answer":"B","source":"同學出題","manualChapter":"CH14"},{"id":45625,"question":"關於腹部創傷之描述下列何者為是？","options":{"A":"小腸損傷初期症狀為腹部疼痛，但沒有腹膜炎徵候無法排除小腸損傷。","B":"胰臟損傷在電腦斷層上仍不易評估，藉由澱粉酶的指數評估較準確。","C":"脾臟為腹部鈍挫傷最常見的臟器損傷，小部分傷患會有Kehr’s徵候。","D":"前胸傷害若非第9~12肋間，不需考慮腹部臟器損傷。"},"answer":"A","source":"同學出題","manualChapter":"CH29"},{"id":45626,"question":"對於學齡兒童(6至12歲)的生、心理發展的里程碑，下列敘述何者錯誤？","options":{"A":"由於兩側大腦功能提升，其專注力與學習能力快速發展","B":"身體的比例變得接近成人，但淋巴組織比例會較成人大","C":"其行為的控制會因發展，逐漸由內轉為外在來源的約束","D":"會跟別人比較，建立自我觀念，並逐漸理解死亡的概念"},"answer":"C","source":"同學出題","manualChapter":"CH13"},{"id":45627,"question":"派遣時告知為一名8個月大的嬰兒(7公斤)，失去呼吸心跳。此時急救的處置下列何者正確？","options":{"A":"單人急救時，壓胸及正壓給樣比例為15:2。","B":"插管Endo尺寸選擇為3.0有氣囊，深度為11cm。","C":"靜脈給藥Epinephrine(1:10000) 為0.7mL。","D":"氣管內管給藥Epinephrine(1:10000) 為7mL。"},"answer":"C","source":"同學出題","manualChapter":"CH48"},{"id":45628,"question":"戶外活動現場氣溫為30°C，相對濕度65%，多名觀眾出現中暑前兆。此時主辦單位詢問你是否應該暫停活動，請問下列選擇何者最適當？","options":{"A":"係數為 30 + 65×0.1 = 36.5，危險係數已達標準，應建議停止活動。","B":"係數為 30 + 65×0.1 = 36.5，僅需增加醫護人員與救護車數量即可。","C":"係數為 30 + 65×0.1 = 36.5，應設置冷水槽、防水帆布或其他降溫設備。","D":"係數低於40，屬可接受範圍，不用新增處置，可照常進行原本活動。"},"answer":"C","source":"同學出題","manualChapter":"CH54"},{"id":45629,"question":"當任務越複雜，認知負荷就會增加。在認知負荷理論中，使用口訣、手寫板或任務卡等輔助工具，將可以影響哪一種認知負荷？","options":{"A":"增生認知負荷","B":"外在認知負荷","C":"內在認知負荷","D":"總量認知負荷"},"answer":"A","source":"同學出題","manualChapter":"CH59"},{"id":45630,"question":"反應複雜的凝血機制可以精要地分為三大基本步驟，下列何者為非？","options":{"A":"由受傷處釋放出組織因子(tissue factor)。","B":"凝血酶原反應形成凝血酶(thrombin)。","C":"凝血酶結合纖維蛋白原(fibrinogen)形成纖維蛋白，進而網住紅血球形成血塊。","D":"血塊因血小板因子作用黏附後成形，大過傷口並將其完整封閉。"},"answer":"D","source":"同學出題","manualChapter":"CH39"},{"id":45631,"question":"醫病互動有許多模式，應該根據病人的病情選擇最適當的互動模式，下列關於互動模式的敘述何者為非?","options":{"A":"主動—被動模式：適用於病人嚴重受傷、昏迷、失血或精神錯亂的緊急狀況，此時以醫師為中心，病人無力參與互動","B":"指導—合作模式：適用於麻疹、急性傳染病等急性病症，此時病患提供必要資訊，醫師主導治療計畫而病患遵守","C":"提供—選擇模式：適用於手術、特殊藥物治療之情況，由醫師提供不同治療計畫及優缺點，病人可依需求選擇適當處置","D":"共同參與模式：適用於高血壓、糖尿病等慢性疾病，醫病具有平等的地位，病人主動參與並監控自己的治療"},"answer":"C","source":"同學出題","manualChapter":"CH18"},{"id":45632,"question":"關於腸病毒感染，下列描述何者錯誤？","options":{"A":"腸病毒71型被歸類於人類腸病毒A型","B":"人類腸病毒僅限人與人之間傳播","C":"腸病毒臨床上可以引起多種疾病，但其中很多是無症狀(約50 ~ 80％)","D":"特殊的臨床表現如嬰兒急性心肌炎(acute myocarditis)主要由腸病毒71型引起"},"answer":"D","source":"同學出題","manualChapter":"CH43"},{"id":45633,"question":"在神經學檢查中，若病人對疼痛刺激呈現「去大腦僵直」（decerebrate rigidity），通常暗示損傷部位在何處？","options":{"A":"脊髓腰椎段","B":"大腦半球皮質","C":"中腦、腦幹","D":"小腦"},"answer":"C","source":"同學出題","manualChapter":"CH36"},{"id":45634,"question":"以下對於「酸鹼不平衡」中，對應的檢驗、症狀、原因與處置，何者為非？","options":{"A":"呼吸性酸中毒：pH<7.35，常見於換氣不足，可利用機器輔助呼吸改善。","B":"代謝性酸中毒：深且快的庫式呼吸，應根據病因給予治療。","C":"呼吸性鹼中毒：感覺麻木、通常因為過度換氣使得血中氧氣減少造成。","D":"代謝性鹼中毒：pH>7.45，可因為大量嘔吐，胃酸流失造成。"},"answer":"C","source":"同學出題","manualChapter":"CH12"},{"id":45635,"question":"關於大量輸血的描述何者錯誤?","options":{"A":"大量輸血定義為 24 小時內輸血量足以置換超過半身的血液","B":"院前可用 ABC score 辨認需要大量輸血的病人","C":"ABC score 內容包含HR＞120、SBP＜90、穿刺傷、FAST陽性，符合 2 項以上需要大量輸血","D":"在大量輸血的情況下，早期以 1 : 1 : 1 的比例給予濃縮紅血球、血漿與血小板"},"answer":"A","source":"同學出題","manualChapter":"CH26"},{"id":45636,"question":"一名 32 歲男性騎機車與汽車發生碰撞，造成右大腿明顯變形及大量出血。到院前救護人員已使用止血帶止血，患者目前 GCS 13 分、血壓 88/54 mmHg、脈搏 124 次/分、SpO2 92%。救護人員準備以 IMIST 模式向急診醫療團隊交班，下列何者最符合 IMIST 的內容分類？","options":{"A":"I（Identification）：32 歲男性，車禍後右大腿大量出血，GCS 13 分。","B":"M（Mechanism of injury）：騎機車與汽車碰撞，患者右大腿明顯變形並疑似股骨骨折。","C":"I（Type of Injury）：右大腿明顯變形並大量出血，疑似股骨骨折，從最嚴重傷勢開始描述。","D":"T（Treatment Given）：血壓 88/54 mmHg、脈搏 124 次/分、SpO2 92%，已使用止血帶。"},"answer":"C","source":"同學出題","manualChapter":"CH18"},{"id":45637,"question":"不同疾病的症狀性質也不同，下列關於疾病的典型症狀的描述，何者錯誤?","options":{"A":"胸骨後灼熱感：心包膜炎","B":"頭部突發性爆炸性劇痛：蜘蛛網膜下出血","C":"胸部突發性撕裂般疼痛感：主動脈剝離","D":"腹部突發性撕裂般疼痛感：腹部主動脈剝離"},"answer":"A","source":"同學出題","manualChapter":"CH20"},{"id":45638,"question":"關於不同特殊族群與休克的臨床特徵，下列敘述何者錯誤?","options":{"A":"老年對交感神經刺激反應較差，因此失血造成的心跳加速或心收縮力增加不如年輕人顯著","B":"運動員即使面臨大量失血，仍可能不會表現出明顯的休克徵兆","C":"懷孕婦女對失血極為敏感，通常只需少量失血就會迅速出現休克徵兆","D":"長期服用βblocker之患者因藥物減慢心跳，失血時可能心跳代償反應不明顯"},"answer":"C","source":"同學出題","manualChapter":"CH13"},{"id":45639,"question":"有關新生兒急救術的敘述，下列何者最適當？","options":{"A":"若要給予腎上腺素(Epinephrine)，稀釋的方式單純是為了方便給正確的濃度，若能確保給予正確的濃度，不一定要稀釋。","B":"阿普加量表(Apgar score)為評估外觀、心跳、血液氧氣濃度、活動力、呼吸。","C":"若要插管，可依週數或體重選擇適當號數。","D":"量測心跳的方式有很多，手摸脈搏比EKG監測器準確。"},"answer":"C","source":"同學出題","manualChapter":"CH48"},{"id":45640,"question":"關於哈頓矩陣（Haddon Matrix）的敘述，下列何者錯誤？","options":{"A":"哈頓矩陣可將事件分為事件前、事件中及事件後三個階段進行分析。","B":"哈頓矩陣除了可分析交通事故，也可應用於溺水、火災及跌倒等傷害事件。","C":"哈頓矩陣主要從人、媒介／載具及環境等因素分析事件，環境因素還可進一步區分為物理與社會環境。","D":"哈頓矩陣主要用於事件發生後的醫療處置檢討，以此策略可較快分析原因。"},"answer":"D","source":"同學出題","manualChapter":"CH25"},{"id":45641,"question":"下列何者「不是」職場安全文化包含的六個面向？","options":{"A":"工作環境","B":"工作條件","C":"壓力辨識","D":"工作滿意度"},"answer":"A","source":"同學出題","manualChapter":"CH5"},{"id":45642,"question":"44歲男性農夫，自述開始工作20分鐘後呼吸困難。你到達現場後發現病人意識清楚，生命徵象如下：體溫36.8℃，心跳110/分鐘，呼吸24次/分鐘，血壓80/50 mmHg。關於接下來的處置與評估，下列何者為非？","options":{"A":"需詢問病人是否有氣喘、心臟疾病等慢性病史以列入鑑別診斷。","B":"若發現患者皮膚紅疹，可以考慮給予腎上腺素肌肉注射治療。","C":"病人可能合併有嚴重的腹絞痛、噁心或嘔吐等腸胃道症狀。","D":"若病人有明顯黏膜與眼皮水腫，則不適合給予靜脈輸液注射。"},"answer":"D","source":"同學出題","manualChapter":"綜合題"},{"id":45643,"question":"毒化物災害發生時正確的防護裝備等級的敘述，下列何者最適當？","options":{"A":"電動車火勢撲滅後，消防人員穿著特搜工作服加上SCBA，具有B級防護裝備之等級，即可前往現場處理。","B":"C級防護裝備能阻止液體性毒物潑濺及滲入，所以可做為暖區除汙的工作人員的防護裝備等級。","C":"冷凍工廠氨氣外洩時，需要著A級防護裝備，提供最高等級的皮膚黏膜及呼吸保護。","D":"石英工廠的氫氟酸發生洩漏，負責後送已經除汙之病人的工作人員需穿著B級防護裝備。"},"answer":"C","source":"同學出題","manualChapter":"CH53"},{"id":45644,"question":"一名車禍患者疑似頸椎損傷，意識清楚，關於救護人員進行神經學評估的徵象對應的神經節段，何者錯誤?","options":{"A":"無法伸直手肘時，可懷疑C7受傷","B":"出現矛盾式呼吸時，很可能C1~4受傷","C":"無法握拳時，很可能C8受傷","D":"觸診唯一可以清楚定位的是C6"},"answer":"D","source":"同學出題","manualChapter":"CH12"},{"id":45645,"question":"關於新型流感，下列描述何者正確？","options":{"A":"流感病毒可藉由突變及基因重組二種方式來產生新型病毒，所造成的抗原的小改變稱作病原轉變(antigenic shift)","B":"流感病毒分為A、B、C三型，其中C型最會造成大流行","C":"流感病毒的傳染方式主要在密閉空間中經由空氣傳染","D":"A 型流感病毒的RNA由8個節段組成，而主要的變異大都發生在第4、第6節段"},"answer":"D","source":"同學出題","manualChapter":"CH43"},{"id":45646,"question":"依據 INSARAG Guideline，「由63 名以上搜救隊員組成，具備於2 個災害現場連續10 天每日24 小時，執行災點倒塌或失效的重型木造和鋼混結構搜索和救援的能力」為下列何者的標準？","options":{"A":"特殊照護小組(Specialized care teams)","B":"輕型救援隊伍(Light USAR teams)","C":"中型救援隊伍(Medium USAR teams)","D":"重型救援隊伍(Heavy USAR teams)"},"answer":"D","source":"同學出題","manualChapter":"CH56"},{"id":45647,"question":"在執行空中救護時，若此時病人已插管，為避免飛行中氣囊內的空氣因為波以爾定律而發生膨脹，進而產生二次傷害，我們可以怎麼做來避免?","options":{"A":"將氣管內管的空氣置換成等量的生理食鹽水","B":"將氣管內管的空氣置換成等量的清水","C":"攜帶氣囊壓力監測計，監測並調整氣囊內的壓力","D":"氣囊雖會膨脹但不至於造成二次傷害，故不用特別處理"},"answer":"C","source":"同學出題","manualChapter":"CH58"},{"id":45648,"question":"依照國際INSARAGE 2020指引表示，城市搜救隊醫療組應能在「侷限空間」內對受困者施行醫療救護，下列何者符合其能力之要求？","options":{"A":"處理燒傷、壓砸傷","B":"給予抗生素","C":"截肢","D":"以上皆是"},"answer":"D","source":"同學出題","manualChapter":"CH56"},{"id":45649,"question":"關於空中救護的敘述，下列何者為非?","options":{"A":"根據美軍的研究，執行空中緊急醫療運送，可大幅減少傷兵的死亡率。","B":"空中救護不止能縮短運送時間，降低死亡率，還能避免永久性的殘廢。","C":"直昇機對比固定翼航空器，可以適應的起降場地及天候條件都更多。","D":"空中勤務總隊主要使用 UH-60M 黑鷹直升機及AS-365 海豚直升機。"},"answer":"C","source":"同學出題","manualChapter":"CH58"},{"id":45650,"question":"請問下列血液細胞中，何種不具細胞核？","options":{"A":"成熟前的紅血球","B":"白血球","C":"血小板","D":"以上皆非，都有細胞核"},"answer":"C","source":"同學出題","manualChapter":"CH39"},{"id":45651,"question":"肝臟是人體最大的消化器官，也是人類身體器官中唯一有再生功能的器官。下列關於肝臟生理之敘述何者錯誤?","options":{"A":"功能有消化、代謝、製造身體所需的蛋白質與凝血因子","B":"在肝臟中合成的白蛋白非常多，占血液中總蛋白質含量約九成","C":"血流豐沛，成人每分鐘的血流量有1500~2000ml","D":"門脈系統收集由消化器官來的血液進入肝臟進行代謝"},"answer":"B","source":"同學出題","manualChapter":"CH12"},{"id":45652,"question":"關於流感病毒的變異，下列敘述何者錯誤？","options":{"A":"新型流感可被預測並施打疫苗，所以整體死亡率較低","B":"不同來源的病毒株同時感染同一宿主時，基因重新排列組合造成的大改變稱作病原轉變","C":"流感病毒可藉由突變及基因重組兩種方式來產生新型病毒","D":"病毒基因每年累積的點突變，所造成的抗原的小改變稱作抗原漂變"},"answer":"A","source":"同學出題","manualChapter":"CH43"},{"id":45653,"question":"Leader在到達現場前，若能先分工說明，將有助於現場任務進行，關於具體說明的SPASE模組敘述，下列何者最適當?","options":{"A":"S告知情境Situation of scene：將內容及可能情形告知成員，並確保成員了解步驟和標準流程。","B":"P盤點人員People：盤點出勤人員的數量及能力，同時適時關心同仁狀況。","C":"A裝備Armature：確認應攜帶的裝備器材並指派人員負責攜帶。","D":"S任務aSsignment：依據案件內容和團隊成員分配任務，需依團隊人數調整。"},"answer":"B","source":"同學出題","manualChapter":"CH59"},{"id":45654,"question":"關於辛辛那提到院前腦中風評量表(CPSS)的敘述何者錯誤?","options":{"A":"要求病人雙手平舉10秒鐘，評估是否有單側無力或手臂下垂的情形","B":"請患者微笑或露齒，以觀察兩側臉部是否對稱。","C":"請病人重複你說的話，評估是否錯漏字的情形","D":"若其中一個異常，72％的可能性為腦中風。若3個皆為異常則有85％的可能性為腦中風。"},"answer":"C","source":"同學出題","manualChapter":"CH36"},{"id":45655,"question":"關於困難插管評估(HEAVEN)之患者可嘗試處置應變的方式，下列配對何者為非?","options":{"A":"低血氧：插管過程持續自鼻管給氧，流量開到15L/min。","B":"極端體重：兒童可考慮墊高肩膀、肥胖患者斜坡擺位。","C":"病人大量出血：使用SALAD技術協助移除下咽部液體。","D":"頸部活動度受限：可考慮優先選擇影像式喉頭鏡。"},"answer":"C","source":"同學出題","manualChapter":"CH15"},{"id":45656,"question":"下列關於腸胃急症的敘述何者錯誤?","options":{"A":"肝臟、膽囊與胰臟屬於實體器官，可稱為「消化腺」，主要負責分泌或儲存消化液","B":"急性闌尾炎初期為上腹或肚臍周圍的內臟痛，隨發炎加劇轉變為右下腹的體覺痛","C":"胃潰瘍疼痛通常在進食後出現；十二指腸潰瘍好發於空腹或凌晨","D":"食道靜脈曲張由於肝硬化或肝腫瘤導致肝靜脈回流受阻，進而引發門脈高壓"},"answer":"D","source":"同學出題","manualChapter":"CH38"},{"id":45657,"question":"以下有關骨折及脫臼部位合併之常見周邊神經損傷，何者為非？","options":{"A":"肘關節脫臼→尺神經。","B":"遠端肱骨骨折→腋神經。","C":"膝關節脫臼→腓神經。","D":"髖關節脫臼(後位)→坐骨神經。"},"answer":"B","source":"同學出題","manualChapter":"CH30"},{"id":45658,"question":"關於氣體交換的薄膜（呼吸膜），下列哪一項病變會使其增厚，進而阻礙氧氣與二氧化碳的擴散？","options":{"A":"氣胸","B":"支氣管哮喘","C":"肺水腫","D":"肺氣腫"},"answer":"C","source":"同學出題","manualChapter":"CH14"},{"id":45659,"question":"關於成人骨內注射(intraosseous injection)的注意事項，最不正確的描述是？","options":{"A":"脛骨近端、遠端、肱骨近端及股骨遠端均是可以選擇的注射點。","B":"腎上腺素、阿托品及碳酸氫鈉均可以從骨內注射途徑給藥。","C":"選擇骨折的部位作為注射點是絕對禁忌症，穿刺部位紅腫也應避免。","D":"給藥前，先適量的生理食鹽水確定骨內留置針是通暢的或沖洗留置針。"},"answer":"A","source":"同學出題","manualChapter":"CH16"},{"id":45660,"question":"在SALT檢傷法中，救命介入措施(LSI)包含下列何者？","options":{"A":"對疑似張力性氣胸患者執行針刺減壓","B":"明顯休克徵象的患者給予建立IV/IO靜脈輸液","C":"呼吸衰竭的患者預防性置入聲門上呼吸道","D":"給予保暖物品以預防低體溫"},"answer":"A","source":"同學出題","manualChapter":"CH52"},{"id":45661,"question":"下列危害物質GHS標示說明，何者為是？","options":{"A":"氧化性物質。","B":"環境危害物質。","C":"急毒性物質。","D":"爆炸性物質。"},"answer":"C","source":"同學出題","manualChapter":"CH53"},{"id":45662,"question":"一名 68 歲男性突然出現右側肢體無力約 2 小時，救護人員到場評估：患者過去無癲癇病史，平時可自行行走，血糖 126 mg/dL。請患者微笑時發現右側嘴角下垂，雙手平舉時右手明顯下垂。依據洛杉磯到院前腦中風評量表（LAPSS），下列何者最適當？","options":{"A":"因患者有臉部不對稱及手臂無力，故 LAPSS 為陽性","B":"因患者年齡超過 45 歲且血糖正常，故 LAPSS 為陽性","C":"患者符合 LAPSS 的年齡、癲癇病史、發作時間、活動能力及血糖條件，且有單側神經學異常，因此 LAPSS 為陽性","D":"LAPSS 必須同時出現臉部不對稱、握力下降及手臂無力三項，才能判定為陽性"},"answer":"C","source":"同學出題","manualChapter":"CH36"},{"id":45663,"question":"哮吼(Croup)的常見症狀，何者為非？","options":{"A":"Barking cough(犬吠咳嗽聲)。","B":"Stridor(喘鳴音)。","C":"Hoarseness(說話聲音沙啞)。","D":"Wheezing(哮鳴音)。"},"answer":"D","source":"同學出題","manualChapter":"CH40"},{"id":45664,"question":"搜救人員將傷患從火場中抬出，患者表示胸口很痛，呼吸不順，右手前臂灼傷，下列處置何者最為適當？","options":{"A":"血氧量測96%，應先觀察患者狀況，再決定是否給予氧氣治療。","B":"傷患左手無名指有一個戒指，表示很有紀念價值，拒絕將其拿下來，給予其手部冰水降溫。","C":"除了詢問基本病史外，應詢問搜救人員傷患所在位置，燃燒物質等。","D":"傷患從火場抬出，意識清楚可以講話，並持續表示胸口很痛，呼吸道正常，吸入性灼傷機會小。"},"answer":"C","source":"同學出題","manualChapter":"CH31"},{"id":45665,"question":"若一位病人體重60kg，潮氣量約為7mL/kg、解剖性無效腔約為2mL/kg，以及約11mL的死腔，呼吸速率為24次/分。則該病患每分鐘肺泡通氣量為多少？","options":{"A":"6.6L","B":"6.9L","C":"7.2L","D":"7.5L"},"answer":"C","source":"同學出題","manualChapter":"CH14"},{"id":45666,"question":"下列敘述空中救護所具備的優點，何者為非？","options":{"A":"縮短運送及治療時間","B":"降低病人死亡機率","C":"可從醫院直接派遣出發","D":"有效的節省醫療成本"},"answer":"C","source":"同學出題","manualChapter":"CH58"},{"id":45667,"question":"在跆拳道比賽項目中，一名選手遭對手跳後踢擊中胸部後，當場倒地不起。現場醫護人員立即上前評估，發現選手已呈現 OHCA狀態，隨即實施 CPR，並使用 AED 電擊兩次後成功ROSC，請問最有可能的病因為何？","options":{"A":"開放性氣胸(open pneumothorax)","B":"心臟震盪(commotio cordis)","C":"心包膜填塞(cardiac tamponade)","D":"外傷性窒息(traumatic asphyxia)"},"answer":"B","source":"同學出題","manualChapter":"CH55"},{"id":45668,"question":"在台灣，哪種毒蛇咬傷的發生率最高，且傷口常表現為一路往軀幹延伸的腫脹？","options":{"A":"雨傘節","B":"眼鏡蛇","C":"鎖鏈蛇","D":"赤尾青竹絲"},"answer":"D","source":"同學出題","manualChapter":"CH50"},{"id":45669,"question":"下列哪一個疾病最不可能因分流(Shunt)而導致低血氧？","options":{"A":"吸入性肺炎","B":"肺水腫","C":"肺栓塞","D":"肺塌陷"},"answer":"C","source":"同學出題","manualChapter":"CH14"},{"id":45670,"question":"某一EMT-P訓練課程進行模擬救護演練後，教官觀察到某學員在評估時未依序完成相關評估項目。演練結束後，教官請學員回顧當時的處置過程，並詢問：「我觀察到你在評估病人時跳過了某個步驟，請問當時發生了什麼事情？」透過學員的描述，了解事件的經過與當下感受。上述教學活動最符合GAS中哪一個步驟？","options":{"A":"分析原因(Analyze)","B":"結論重點(Summary)","C":"提問技巧(Ask skills)","D":"獲取資訊(Gather)"},"answer":"D","source":"同學出題","manualChapter":"CH60"},{"id":45671,"question":"高齡病人發生呼吸系統疾病的機會較高，如細菌性肺炎，在院前最可靠用來判斷細菌性肺炎的徵象為何?(1)發燒(2)咳嗽(3)心跳加快(4)呼吸加快","options":{"A":"(1)(2)","B":"(2)(4)","C":"(3)(4)","D":"(1)(2)(3)(4)"},"answer":"C","source":"同學出題","manualChapter":"CH47"},{"id":45672,"question":"一名9個月大的患童外傷時，若觀察到其「囟門突出」，下列敘述何者錯誤?","options":{"A":"雖沒有昏迷，仍有可能顯示其顱內壓增高或潛在的腦出血","B":"可能會噁心嘔吐，年紀較大的孩童可能會視力異常、步態不穩","C":"因年紀小，不可能會有庫欣氏三徵象（Cushing's triad）","D":"治療上應將床頭略微抬高，保持呼吸道通暢，可考慮過度換氣"},"answer":"C","source":"同學出題","manualChapter":"CH48"},{"id":45673,"question":"吾人欲使用心臟超音波檢查進行鑑別診斷，有關疑似「心包膜填塞」的診斷敘述，下列何者錯誤?","options":{"A":"藉由都卜勒超音波可觀察到二尖瓣膜血流E波大於A波的現象","B":"右心室於舒張期被壓扁","C":"收縮期時吸氣心室中隔由右心室偏移向左心室","D":"超音波螢幕上能直接看到心臟周圍包圍著一圈黑色疑似液體"},"answer":"A","source":"同學出題","manualChapter":"CH23"},{"id":45674,"question":"派遣時告知一孕婦急產，到場為一名32週的新生兒( 2 kg )無呼吸心跳。此時急救的處置下列何者錯誤？","options":{"A":"壓胸及正壓給氧比例為3:1，每循環約時2秒鐘。","B":"插管Endo尺寸選擇為3.0有氣囊，深度為11cm。","C":"靜脈給藥Epinephrine(1:10000) 為0.2mL。","D":"氣管內管給藥Epinephrine(1:10000) 為2mL。"},"answer":"B","source":"同學出題","manualChapter":"CH48"},{"id":45675,"question":"你參與旅行團前往玉山攻頂，在排雲山莊睡到凌晨時，發現室友嚴重失眠並且抱怨自己頭痛難耐，吃了止痛藥也沒有效果，你懷疑他高山症(Acute Mountain Sickness)發作；連忙跟導遊反應，決定透過無線電與山下支援醫院求助。下列的描述，何者最不適當？","options":{"A":"回報時，為利後援判斷高山症的嚴重程度，可依評分系統一併報告症狀，如有無呼吸道症狀、頭痛、虛弱、頭暈。","B":"病人表示登山前有吃丹木斯(Acetazolamide)，也有攜帶上山，這個藥也可用來當作治療建議病人服用。","C":"病人出現呼吸困難、咳嗽帶粉紅色泡泡，此時應儘速下降高度、給氧、使用藥物。","D":"在下山途中病人開始步態不穩、意識不清，此時應給予氧氣治療，可考慮至鄰近山屋拿取加壓艙來為病人進行治療，等待救援。"},"answer":"A","source":"同學出題","manualChapter":"CH44"},{"id":45676,"question":"下列何者最不可能是高齡病人患有甲狀腺亢進的症狀？","options":{"A":"體重減輕","B":"心律不整","C":"精神亢奮","D":"心臟衰竭"},"answer":"C","source":"同學出題","manualChapter":"CH47"},{"id":45677,"question":"台灣位處地震帶上，地震災害頻傳，造成人員的傷亡及財產的損失。下列有關地震災害的敘述，何者為非？","options":{"A":"地震的規模，在九二一地震後，重新修訂為七級。","B":"根據世界各國的地震報告顯示，重大地震所造成的傷患，百分之六十以上都是在平常以外的醫療機構尋求治療。","C":"地震災害造成的大量死亡，屍體沒有清理，雖然造成環境上的臭味，但卻不是疫病的來源。","D":"台灣的地震，死亡人數最多的是西元1999年的集集地震。"},"answer":"D","source":"同學出題","manualChapter":"CH57"},{"id":45678,"question":"關於懷孕分期及症狀，下列敘述何者正確?","options":{"A":"懷孕第一期指第一到三月，此時陰道出血有可能是急迫性流產或子宮外孕","B":"懷孕第二期指第三到五月，有可能發生子癇前症和子癇症","C":"懷孕第三期指第六到九月，陰道出血合併腹痛有可能是因為胎盤早期剝離","D":"懷孕第一期指第一到二月，此時血壓將會下降10~15mmHg"},"answer":"A","source":"同學出題","manualChapter":"CH49"},{"id":45679,"question":"關於世界衛生組織緊急救護系統架構內的人力資源，以下何者為是?A.救護人員B.派遣員C.醫療人員D.行政人員E.駕駛F.旁觀者","options":{"A":"ACEF","B":"ABCE","C":"ABCEF","D":"ABCDEF"},"answer":"D","source":"同學出題","manualChapter":"CH2"},{"id":45680,"question":"以下哪項給藥的途徑是錯誤的?","options":{"A":"骨內注射，注射於骨髓腔內之動脈","B":"皮下注射，注射於皮下組織層","C":"靜脈注射，注射於血管內","D":"塞劑，塞肛門或陰道的藥物"},"answer":"A","source":"同學出題","manualChapter":"CH16"},{"id":45681,"question":"派遣員協助心肺復甦術（DA-CPR）的流程主要是由哪三個階段依序完成的？","options":{"A":"辨識、指導、監控","B":"詢問、派遣、到達前指導","C":"評估、給藥、電擊","D":"檢傷、通報、後送"},"answer":"A","source":"同學出題","manualChapter":"CH9"},{"id":45682,"question":"深夜發生規模7.3地震，多棟建物倒塌，地區停電且道路受阻。部分傷患受困於瓦礫中，另有居民集中於臨時安全區。災難醫療救護隊到達後，關於初期緊急醫療運作，下列何者較適當？","options":{"A":"立即投入倒塌現場搜救，爭取受困傷患的黃金救援時間。","B":"優先架設臨時醫療區域，進行檢傷分類與公共衛生監測。","C":"分析現場環境不安全，於現場等待專責搜救隊接手進駐。","D":"儘速協調收容所安置，防止疫情與群聚感染進一步擴散。"},"answer":"B","source":"同學出題","manualChapter":"CH57"},{"id":45683,"question":"關於氣切管的敘述，下列何者正確?","options":{"A":"氣切管如果因固定帶鬆脫而部分脫落時，可嘗試將氣切管復位並給予適當固定。","B":"氣切管全脫落時，應先將氣切管嘗試放回造口中，若難以固定再置入氣管內管。","C":"若發生氣管造口處流血，可先嘗試填塞止血，如氣切管有氣囊，則將氣囊打飽。","D":"氣囊破裂或漏氣因救護技術員無法處理，只能記錄該款氣切管種類並後送醫院。"},"answer":"A","source":"同學出題","manualChapter":"CH51"},{"id":45684,"question":"緊急醫療系統研究可以有許多應用，其中依照時間軸的不同，可以分成三種：前瞻性(prospective)方法、回溯性(retrospective)方法及橫斷面(cross-sectional)方法，下列敘述何者屬於回溯性方法?","options":{"A":"找 100 位高血壓患者，從現在開始追蹤 5 年，觀察哪些人後來發生中風","B":"找出過去 5 年曾發生中風的患者，回頭查病歷，分析他們過去是否有高血壓、糖尿病等危險因子","C":"在 2026 年調查 1000 名民眾，同時測量血壓與是否有中風病史，了解高血壓與中風的相關性","D":"調查 100 名曾發生中風的患者，觀察哪些人後來再次發生中風"},"answer":"B","source":"同學出題","manualChapter":"CH11"},{"id":45685,"question":"有關輻射災害與毒化災的比較，何者敘述正確？","options":{"A":"輻射污染相較於化學物品，很難在第一時間以簡單儀器測出患者是否有污染，更難以明確定出污染範圍","B":"輻災除污方式，應將患者視為全身污染，以大量水清洗全身","C":"因毒化物半衰期短且容易被清水稀釋毒性，所以毒化災除污區地板不一定需要覆蓋塑膠布","D":"受污染的患者若考慮脫除受污染衣物，在脫除衣物時注意以從腳到頭、從下而上的方式，剪下衣物，並由內向外捲減少污染擴散"},"answer":"C","source":"同學出題","manualChapter":"CH53"},{"id":45686,"question":"車禍外傷救護過程中與醫院醫療人員交班時，向院端表示患者頭部有血腫、右肩撕裂傷、大腿變形疑似骨折及多處擦傷，請問該資訊最符合IMIST交班模式之何項?","options":{"A":"M 傷害機轉(Mechanism of injury)","B":"I 受傷型態 (Type of Injury)","C":"S 顯著症狀(Signs)","D":"T 進行的治療(Treatment Given)"},"answer":"B","source":"同學出題","manualChapter":"CH18"},{"id":45687,"question":"根據葉克膜復甦(ECPR)應用於到院前心跳停止患者(OHCA)之分析，較常使用葉克膜復甦(ECPR)的傷患特質，下列何者最不適當？","options":{"A":"傷患目擊倒下。","B":"呈現可電擊心律(shockable rhythms)。","C":"有旁觀者進行CPR (Bystander CPR)。","D":"預計心跳停止到葉克膜裝置運作在70分鐘以上"},"answer":"D","source":"同學出題","manualChapter":"CH24"},{"id":45688,"question":"IMIST 是來源於軍方對外傷病人交接的一種方式，關於此交班模組包含的資訊，下列敘述何者錯誤?","options":{"A":"M 傷害機轉(Mechanism of injury)：傷害機制及簡要病人醫療主訴。","B":"S 生命徵像或顯著症狀(Signs)：生命徵象回報或明顯的生理症狀。","C":"T 進行的治療(Treatment Given)：已進行的治療處置，如：使用止血帶。","D":"I重要事項(Importance)：關於此病人需要交接補充的重要事項。"},"answer":"D","source":"同學出題","manualChapter":"CH18"},{"id":45689,"question":"一名70歲男性駕駛轎車撞電線桿，車頭全毀、安全氣囊作動、除胸口到腹部有安全帶勒痕外，無其他明顯外傷，目前被救出表示呼吸困難，你評估沒有發紺，較有可能是以下哪種傷害？","options":{"A":"壓迫性窒息(traumatic asphyxia)。","B":"心肌挫傷(myocardial contusion)。","C":"心臟震盪(commotio cordis)。","D":"連枷胸(flail chest)。"},"answer":"B","source":"同學出題","manualChapter":"CH28"},{"id":45690,"question":"病原體進入體內後，帶有記憶能力並放出抗體來進行中和作用以避免進一步傷害的是？","options":{"A":"NK細胞(Natural Killer)。","B":"巨嗜細胞。","C":"T細胞。","D":"B細胞。"},"answer":"D","source":"同學出題","manualChapter":"CH42"},{"id":45691,"question":"在執行團隊工作前，適時觀察並給予團隊成員幫助，可使其維持較好的出勤狀態，IMSAFE模組提供一個全面的方法。以下關於IMSAFE的敘述何者錯誤?","options":{"A":"疾病(Illness)：鼓勵同仁身體不適時主動休息，落實健康檢查制度，避免影響工作表現","B":"藥物(Medication)：藥物的副作用可能造成同仁精神不濟，特別是抗過敏藥物或感冒藥","C":"疲勞(Fatigue)：避免過度加班、合理安排輪班制度，確保同仁有足夠的休息時間","D":"壓力(Stress)：壓力可能造成同仁負擔，請同仁前往身心科看診，並請幹部追蹤其用藥"},"answer":"D","source":"同學出題","manualChapter":"CH59"},{"id":45692,"question":"關於急性高山病的敘述何者較不適當?","options":{"A":"上升高度時需注意，在快速上升的狀況下，急性高山病的發生率超過六成","B":"症狀可能有嘔吐、腹瀉、頭暈、激動、記憶力失常及活動時呼吸困難","C":"可使用丹木斯(Acetazolamide)作為於第一線預防藥物","D":"可以使用路易斯湖急性高山病評分系統來評估急性高山病的嚴重程度"},"answer":"B","source":"同學出題","manualChapter":"CH44"},{"id":45693,"question":"下列有關外傷造成出血性休克傷患到院前的評估與處置的描述，何者為是？","options":{"A":"到院前使用靜脈輸液，是否會提高休克傷患存活機率，目前尚無定論，故晶質或膠質輸液通常保留至到院後再給予，不建議使用於到院前。","B":"若有需要使用晶質溶液，應以溫暖的的晶質溶液進行急救，林格氏乳酸溶液為輸液首選，其次為生理食鹽水溶液。","C":"靜脈輸液的流速與留置導管的內徑呈現4次方正比(即導管內徑增為2倍，最大流速可提高為16倍)、與導管的長度成正比。","D":"老年傷患對副交感神經刺激反應較差，因此失血造成的心跳加速或心收縮力增加不如年輕人顯著，因此老人傷患需早期進行積極復甦及監測。"},"answer":"B","source":"同學出題","manualChapter":"CH26"},{"id":1212,"question":"請問關於下圖敘述何者有誤?","options":{"A":"此心率的V5的R波＋V1的S波＞35mm，加上V6的R波＞18mm，可以懷疑其左心室肥厚。","B":"此張心電圖之心率可見窄Q、速率快的、RR interval不規則、沒有p，可能為A-fib with RVR。","C":"若需要藥物治療，可使用β-blockers 或是CCB，但其QTc較長，可能不適合使用Amiodarone控制速率。","D":"此病患的心軸因左測電氣活動牽引的影響，心軸偏左(＜-30 度)。"},"answer":"D","source":"同學出題","manualChapter":"CH33","image":"題庫圖片/1212.png"},{"id":45694,"question":"關於外傷的敘述，下列何者為非?","options":{"A":"外傷是台灣十大死因之一(2022年排第8)，大多數與交通事故有關。","B":"重度級急救責任醫院應全年無休，從急診到門診全程照護外傷病人。","C":"刀傷、槍傷患者需靜脈輸液等處置，由私家車逕行運送對病患無益。","D":"立即死亡仍然佔外傷死亡數最多，可透過損傷預防來減少事故發生。"},"answer":"C","source":"同學出題","manualChapter":"CH25"},{"id":45695,"question":"50歲男性， 6公尺高處墜落，有頭部外傷，身上無明顯外出血，意識不清，現場對痛刺激僅能發出呻吟聲，血壓190/60mmHg，心跳50次/min，血氧88%，呼吸8次/min關於此病人的敘述下列何者最適當？","options":{"A":"低血氧是創傷性腦傷的危險因子，根據EPIC-TBI，建議血氧應維持在98%以上","B":"因患者尚能自行呼吸，不用考慮鼻咽或插管","C":"若要置入氣管內管，可以考慮施打lidocaine，以避免顱內壓的上升","D":"因病患符合頸圈適應症，故不能解開頸圈"},"answer":"C","source":"同學出題","manualChapter":"綜合題"},{"id":45696,"question":"無人機因其靈活性和快速部署能力，已逐漸成為緊急醫療救護中的重要工具。下列關於無人機應用的敘述何者為非?","options":{"A":"提供高解析度影像，協助評估災情並定位受困者。","B":"可運送醫療物資，如急救藥品、血液樣本等。","C":"即時傳送多角度高清互動影像，讓醫師與救護員即時互動。","D":"在通訊中斷的災區，無人機可作為臨時通訊的中繼站。"},"answer":"C","source":"同學出題","manualChapter":"CH10"},{"id":45697,"question":"研究顯示對於重大外傷病人，越早施以適切治療預後越好，外傷照護體系的建立還可以減少15~20％的死亡率，關於外傷照護體系建立的目的何者為非?","options":{"A":"減少因外傷而產生的相關醫療費用","B":"避免對外傷病人之不適當照護","C":"增加可處置的外傷病人數及降低外傷嚴重度","D":"降低外傷可預防之死亡率"},"answer":"C","source":"同學出題","manualChapter":"CH25"},{"id":45698,"question":"關於腸阻塞與急性闌尾炎的病因、臨床表現之描述，下列何者最適當？","options":{"A":"機械性腸阻塞多見於大腸，以粘黏為主要原因，麻痺性腸阻塞則通常由腸道受到外力擠壓所致，兩者均易導致糞便嵌塞。","B":"急性闌尾炎的臨床表徵為噁心、食慾變差與左下腹痛，典型疼痛位置為McBurney point(指肚臍與右側前上腸骨脊連線外三分之一的點)。","C":"急性闌尾炎的轉移痛常由肚臍周圍轉至右下腹，而機械性腸阻塞的原因多為粘黏或疝氣，嚴重者可能發生腸壞死或穿孔。","D":"麻痺性腸阻塞多由腫瘤或異物嵌塞所致，而急性闌尾炎的疼痛發展較緩慢，初期僅表現為輕微的肚臍周圍不適，易被誤認為一般腸胃不適。"},"answer":"C","source":"同學出題","manualChapter":"CH38"},{"id":45699,"question":"有關TECC的架構與核心，下列敘述何者錯誤？","options":{"A":"MARCH口訣中的R包含了胸部外傷急症處置","B":"熱區的救護人員與傷者處於直接威脅下，故照護重點應依循MARCH口訣，逐項處置後盡速離開","C":"TECC不僅運用在戰時，如2024台中捷運持刀隨機攻擊事件，TECC亦能作為系統性應變的醫療行動指引","D":"MARCH口訣中的H包含了Hypothermia，旨在預防低體溫"},"answer":"B","source":"同學出題","manualChapter":"CH56"},{"id":45700,"question":"在評估敗血症風險時，關於 qSOFA(quickSOFA) 評分系統的項目，下列何者不包含在內？","options":{"A":"血壓100mmHg以下","B":"呼吸22次/分以上","C":"體溫超過38.5°C","D":"GCS分數不足15分或新發生的意識變化"},"answer":"C","source":"同學出題","manualChapter":"CH42"},{"id":45701,"question":"下列何種疾病主要採接觸傳播防護？","options":{"A":"腸道病原體引起之急性腹瀉","B":"肺結核","C":"水痘","D":"麻疹"},"answer":"A","source":"同學出題","manualChapter":"CH05"},{"id":45702,"question":"以下呼吸模式與對應的可能的臨床疾病組合，何者正確？","options":{"A":"庫斯毛耳氏呼吸 (Kussmaul respiration) – COPD。","B":"陳施氏呼吸 (Cheyne-Stokes respiration) – 大腦損傷。","C":"逆理式呼吸 (paradoxical respiration) – 延腦損傷。","D":"畢歐氏呼吸 (Biot’s respiration) – 橋腦損傷。"},"answer":"B","source":"同學出題","manualChapter":"CH20"},{"id":45703,"question":"有關環境急症中的熱病，下列敘述何者正確？","options":{"A":"熱痙攣患者應優先予以口服鹽類添加物（鹽片）","B":"熱痙攣患者通常神智清醒且中心體溫正常","C":"中暑的患者如果沒有及早積極治療，有可能繼續進展到熱衰竭","D":"降溫治療的目標，一般建議當中心體溫降溫至37度時，就要停止降溫"},"answer":"B","source":"同學出題","manualChapter":"CH44"},{"id":45704,"question":"由美國緊急醫療救護系統績效評估指導委員會所提出的品質指標中，下列評估指標內容對應的品質測量類型「結構面」(structure)、「過程面」(process)及「結果面」(outcome)，何者錯誤？","options":{"A":"救護人員離職率如何？-結構面","B":"比較13歲以上病人第一次及最後一次的疼痛量尺變化-結果面","C":"派遣中心所接獲的電話中，患者主訴的分佈及數量為何？-結果面","D":"每1000次出勤之交通事故(EMS crashes)比例為何？-過程面"},"answer":"C","source":"同學出題","manualChapter":"CH9"},{"id":45705,"question":"關於休克下列敘述何者最適當？","options":{"A":"阻塞性休克因為進入心臟的血流受阻，所以一定會看見頸靜脈怒張。","B":"代償性休克因為周邊血管收縮，皮膚變得濕冷蒼白。","C":"神經性休克雖然也會微血管充填時間延長，卻無反射性心跳增快，皮膚也非冰冷。","D":"當傷患休克時，生命徵象最先反應的是脈搏上升，這時出血程度為第一級休克。"},"answer":"B","source":"同學出題","manualChapter":"CH26"},{"id":45706,"question":"嚴重過敏反應時會產生許多的症狀，但有些疾病可能產生類似的症狀導致誤判，關於容易產生誤判的症狀與疾病下列何者最不適當?","options":{"A":"喘鳴音(stridor)：哮吼、上呼吸道阻塞、異物吸入","B":"意識喪失或暈厥：迷走性暈厥、抽搐、低血糖、心律不整","C":"哮喘音(wheezing)：氣喘、慢性阻塞性肺病、支氣管炎","D":"蕁麻疹或搔癢：血管性水腫、病毒性敗血性休克、紅斑性狼瘡"},"answer":"D","source":"同學出題","manualChapter":"CH40"},{"id":45707,"question":"大腦是精神功能的器官，下列關於大腦的敘述何者錯誤?","options":{"A":"大腦的認知功能主要源自於額葉與顳葉","B":"下視丘與恐懼和負面情緒有關聯","C":"大腦的枕葉負責視覺空間處理","D":"頂葉負責感覺與運動行為、訊息整合、 空間知覺"},"answer":"B","source":"同學出題","manualChapter":"CH12"},{"id":45708,"question":"下列關於腸胃急症的敘述何者最不適當?","options":{"A":"疼痛型態可分為內臟痛(Visceral pain)、體覺痛(Somatic pain)以及轉移痛(Referred pain)","B":"腸胃道出血可能需要手術處理，院前著重維持生命徵象的穩定及送往合適醫院","C":"急性腸胃炎大部分是由病毒所引起的，傳染途徑為飛沫傳染，需注意群聚感染","D":"急性闌尾炎可能導致食慾下降、噁心、腹痛，必要時需手術切除闌尾"},"answer":"C","source":"同學出題","manualChapter":"CH38"},{"id":45709,"question":"填入空格：動作電位的形成首先是由_____離子通道開啟使細胞膜去極化","options":{"A":"鈉","B":"鉀","C":"鈣","D":"鎂"},"answer":"A","source":"大白p258","manualChapter":["CH12","背誦題"]},{"id":45710,"source":"第五章 創傷急症(2012-2014).doc","question":"以過度換氣（hyperventilation）來降低顱內壓時，應將動脈血液血的PaCO2控制在約：","options":{"A":"40～45 mmHg","B":"30～40 mmHg","C":"20～25 mmHg","D":"15～20 mmHg"},"answer":"B","manualChapter":"背誦題"},{"id":45711,"question":"當血中二氧化碳分壓(PCO2)控制在多少mmHg左右時，可以減少腦部血流量，但並不一定會持續降低顱內壓","options":{"A":"10","B":"30","C":"50","D":"80"},"answer":"B","source":"大白p964","manualChapter":"背誦題"},{"id":45712,"question":"當血中二氧化碳分壓(PCO2)控制在多少mmHg左右時，可以減少腦部血流量，但並不一定會持續降低顱內壓","options":{"A":"10","B":"30","C":"50","D":"80"},"answer":"B","source":"大白p964","manualChapter":"CH36"},{"id":45713,"question":"胎盤早期剝離通常發生在懷孕第幾期?","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","source":"大白","manualChapter":"CH49"},{"id":45714,"question":"胎盤早期剝離通常發生在懷孕第幾期?","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","source":"大白","manualChapter":"背誦題"},{"id":45715,"question":"羊水栓塞(amniotic fluid embolism)佔產婦死亡率約多少?","options":{"A":"5-10%","B":"10-20 %","C":"30-40%","D":"70-80%"},"answer":"D","source":"大白p1295","manualChapter":"CH49"},{"id":45716,"question":"羊水栓塞(amniotic fluid embolism)佔產婦死亡率約多少?","options":{"A":"5-10%","B":"10-20 %","C":"30-40%","D":"70-80%"},"answer":"D","source":"大白p1295","manualChapter":"背誦題"},{"id":45717,"question":"下列何者非女性生殖系統之構造?","options":{"A":"陰道","B":"胎盤","C":"子宮","D":"輸卵管"},"answer":"B","source":"大白p1297","manualChapter":"CH49"},{"id":45718,"question":"臍帶連接胎兒和胎盤，長約45公分，直徑約1.5公分，並包含?","options":{"A":"2條運送充氧血的動脈與1條運送缺氧血的靜脈","B":"1條運送充氧血的動脈與2條運送缺氧血的靜脈","C":"2條運送缺氧血的動脈與1條運送充氧血的靜脈","D":"1條運送缺氧血的動脈與2條運送充氧血的靜脈"},"answer":"C","source":"大白p1297","manualChapter":"CH49"},{"id":45719,"question":"臍帶連接胎兒和胎盤，長約45公分，直徑約1.5公分，並包含?","options":{"A":"2條運送充氧血的動脈與1條運送缺氧血的靜脈","B":"1條運送充氧血的動脈與2條運送缺氧血的靜脈","C":"2條運送缺氧血的動脈與1條運送充氧血的靜脈","D":"1條運送缺氧血的動脈與2條運送充氧血的靜脈"},"answer":"C","source":"大白p1297","manualChapter":"背誦題"},{"id":45720,"question":"懷孕初期會有噁心的症狀，通常開始與結束於懷孕第幾周之間?","options":{"A":"1-3周","B":"5-10周","C":"6-14周","D":"17-21周"},"answer":"C","source":"大白p1297","manualChapter":"CH49"},{"id":45721,"question":"懷孕初期會有噁心的症狀，通常開始與結束於懷孕第幾周之間?","options":{"A":"1-3周","B":"5-10周","C":"6-14周","D":"17-21周"},"answer":"C","source":"大白p1297","manualChapter":"背誦題"},{"id":45722,"question":"下列何者非陰道出血的原因?","options":{"A":"胎盤早期剝離(abruptio placenta)","B":"妊娠劇吐(hyperemesis gravidarum)","C":"子宮外孕(ectopic pregnancy)","D":"急迫性流產(Threatened abortion)"},"answer":"B","source":"大白p1297","manualChapter":"CH49"},{"id":45723,"question":"下列何者非羊水及羊膜腔的功能或敘述?","options":{"A":"羊水可維持胎兒溫度之恆定，提供胎兒一個可活動之空間","B":"羊膜腔外充滿由胎兒尿液及其他分泌物組成之液體","C":"可緩衝外力對胎兒造成之傷害","D":"羊膜腔於胚胎周圍發育"},"answer":"B","source":"大白p1297","manualChapter":"CH49"},{"id":45724,"question":"下列哪一個選項不會造成低血壓？","options":{"A":"安非他命中毒","B":"腎上腺危象","C":"懷孕晚期孕婦平躺","D":"曝露於30戈雷以上的病人"},"answer":"A","source":"大白","manualChapter":"非創傷"},{"id":45725,"question":"急產發生率約為多少?","options":{"A":"2%","B":"10%","C":"20%","D":"35%"},"answer":"A","source":"大白p1297","manualChapter":"CH49"},{"id":45726,"question":"急產發生率約為多少?","options":{"A":"2%","B":"10%","C":"20%","D":"35%"},"answer":"A","source":"大白p1297","manualChapter":"背誦題"},{"id":45727,"question":"指揮中心通報一名急產案件，到達現場寶寶胎頭尚未娩出且媽媽沒有規則陣痛，請問下一步如何處置為非?","options":{"A":"立即準備生產包進行現場接生","B":"指導產婦「深呼吸不要憋氣，去醫院生比較安全」","C":"盡速上擔架床以約束帶固定雙腳，抬高床頭並給予氧氣","D":"詢問相關病史、懷孕幾月、懷孕幾胎、生產幾次"},"answer":"A","source":"大白p1298","manualChapter":"CH49"},{"id":45728,"question":"羊水栓塞為羊水雜質經何種管道進入母體肺部血管造成?","options":{"A":"臍帶","B":"子宮動脈","C":"子宮頸靜脈","D":"胎兒下腔靜脈"},"answer":"C","source":"大白p1303","manualChapter":"CH49"},{"id":45729,"question":"羊水栓塞為羊水雜質經何種管道進入母體肺部血管造成?","options":{"A":"臍帶","B":"子宮動脈","C":"子宮頸靜脈","D":"胎兒下腔靜脈"},"answer":"C","source":"大白p1303","manualChapter":"背誦題"},{"id":45730,"question":"處理無法壓迫止血的軀幹出血或內出血時，可使用急救性血管內氣球阻斷術(REBOA)，關於REBOA的敘述，下列何者錯誤？","options":{"A":"該技術是將導管從總股動脈置入到主動脈，導管中的氣球擴張來阻斷血流","B":"REBOA目前廣泛用於在心臟血管外科領域，尤其在腹主動脈瘤破裂出血時","C":"此技術在使用於阻斷部分腹部器官及下肢血流有效，但骨盆骨折無法使用","D":"目前針對REBOA的不同研究仍存在差異和限制，需要更多研究來證實效益"},"answer":"C","source":"大白p784","manualChapter":"CH29","explanation":"無法壓迫止血的軀幹出血(NCTH)或內出血造成的低血容性休克，如腹部實質器官/ 大血管/ 骨盆骨折，是必須立即採取行動控制出血的急症。REBOA是當今用來控制NCTH的最新技術"},{"id":45731,"question":"某救護單位統計去年插管失敗的原因，共發生10次，統計結果顯示，操作技術不熟：4次、病人躁動：2次、器材操作問題：2次、視野不佳：1次、其他原因：1次。品管人員希望依據統計結果，找出應優先改善問題，以有限資源降低插管失敗率。此時最適合使用下列何種品管工具進行分析？","options":{"A":"魚骨圖","B":"直方圖","C":"柏拉圖","D":"散佈圖"},"answer":"C","source":"大白","manualChapter":"CH09","explanation":"柏拉圖(Pareto Chart)：\n又稱重點分析圖、主次因素分析法，屬於排序的直方圖與折線圖的組合，以發生的頻率累計排序的呈現，大多應用於帕雷托法則(80/20)，即關鍵的少數(20％)的影響力占比(80％)反而較高。用於職業安全上，可作為優先評定的方式，例如20％的危害事件將占80％的嚴重度(傷害)，則這些事件優先進行改善，這樣的方式也可以確保以較為經濟有效的手段解決問題"},{"id":45732,"question":"軟組織及肌肉骨骼外傷非常常見，約有多少鈍挫傷病人合併肌肉骨骼方面的損傷，其中多數為單純骨骼或肌肉方面的外傷?","options":{"A":"10%","B":"30%","C":"60%","D":"85%"},"answer":"D","source":"大白","manualChapter":"CH30"},{"id":45733,"question":"軟組織及肌肉骨骼外傷非常常見，約有多少鈍挫傷病人合併肌肉骨骼方面的損傷，其中多數為單純骨骼或肌肉方面的外傷?","options":{"A":"10%","B":"30%","C":"60%","D":"85%"},"answer":"D","source":"大白","manualChapter":"背誦題"},{"id":45734,"question":"填入空格：膠原蛋白是身體大多數組織的結構蛋白，所以膠原母細胞會在受傷的____
