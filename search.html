<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>題庫搜尋 - 所有題庫</title>
  <style>
        :root {
      --bg-color: #e9ecef;
      --primary-color: #2c3e50;
      --accent-color: #4a5568;
      --secondary-color: #718096;
      --text-muted: #6c757d;
    }
    [data-theme="theme1"] {
      --bg-color: #f1f5f9;
      --primary-color: #334155;
      --secondary-color: #64748b;
      --accent-color: #475569;
      --text-muted: #94a3b8;
    }
    [data-theme="theme2"] {
      --bg-color: #f8f9fa;
      --primary-color: #212529;
      --secondary-color: #495057;
      --accent-color: #343a40;
      --text-muted: #adb5bd;
    }
    [data-theme="theme3"] {
      --bg-color: #fdfdfd;
      --primary-color: #2f3542;
      --secondary-color: #57606f;
      --accent-color: #747d8c;
      --text-muted: #a4b0be;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, Avenir, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: #334155;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 3rem 1rem;
      transition: background-color 0.3s;
    }

    #app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      position: relative;
    }

    h1 {
      font-size: 2.2rem;
      color: var(--primary-color);
      margin-bottom: 2rem;
      text-align: center;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .search-box input {
      flex: 1;
      padding: 1rem;
      font-size: 1.1rem;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary-color);
    }

    .search-box button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 0 2rem;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .search-box button:hover {
      background-color: var(--secondary-color);
    }

    .theme-switcher {
      position: absolute;
      top: 2.5rem;
      right: 2.5rem;
    }
    
    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid transparent;
      display: inline-block;
      margin: 0 5px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .theme-btn:hover {
      transform: scale(1.2);
    }
    
    .theme-btn.active {
      border-color: #333;
    }

    .q-item {
      background: #f8fafc;
      border-left: 6px solid var(--primary-color);
      padding: 1.5rem;
      border-radius: 8px;
      margin-bottom: 1.5rem;
    }

    .q-chapter {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .q-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #1e3a8a;
    }

    .q-options {
      list-style: none;
      margin-bottom: 1rem;
    }

    .q-options li {
      padding: 0.5rem;
      margin-bottom: 0.3rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }
    
    .q-options li.is-answer {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #065f46;
      font-weight: bold;
    }

    .no-results {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.2rem;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <a href="Dashboard_Quiz.html" style="display:inline-block; margin-bottom:1rem; text-decoration:none; color:var(--primary-color); font-weight:bold;">🏠 返回儀表板</a>
    <div class="card">
      <h1>題庫搜尋系統</h1>
      
      <div class="theme-switcher">
        <span class="theme-btn active" style="background:#51794E;" onclick="setTheme('default', this)"></span>
        <span class="theme-btn" style="background:#cdaca0;" onclick="setTheme('theme1', this)"></span>
        <span class="theme-btn" style="background:#8c1e1d;" onclick="setTheme('theme2', this)"></span>
        <span class="theme-btn" style="background:#7d4b68;" onclick="setTheme('theme3', this)"></span>
      </div>

      <div class="search-box">
        <input type="text" id="search-input" placeholder="請輸入關鍵字... (例如: 骨折)">
        <button id="search-btn">搜尋</button>
      </div>

      <div id="results-container">
        <!-- Results will be injected here -->
      </div>
    </div>
  </div>

  <script>
    const questions = [{"id":1,"source":"105 高級救護技術員甄試筆試題目.doc","question":"以下皆是前瞻性的醫療指導模式，但何者為非?","options":{"A":"EMTP養成教育訓練","B":"醫療指導提出年度救護器材採購建議","C":"教護手機無線電通訊監控","D":"訂立線上醫療指導流程"},"answer":"C","manualChapter":"CH02"},{"id":2,"source":"105 高級救護技術員甄試筆試題目.doc","question":"所謂優先派遣的定義，最主要的根據是？","options":{"A":"傷病患主訴的關鍵問題","B":"傷病患所在位置","C":"最近有空救護車之救護分隊位置","D":"報案者描述緊急事件之性質"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":4,"source":"105 高級救護技術員甄試筆試題目.doc","question":"火場救災中有同袍受了重傷，身為EMTP，你可以察覺其它隊友如果出現下列症狀，很可能是創傷後症候群（PTSD），但何者為非？","options":{"A":"不斷地對他人談起火場裏的事","B":"變得過度緊張","C":"失眠","D":"注意力無法集中"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":5,"source":"105 高級救護技術員甄試筆試題目.doc","question":"車禍傷患在現場清醒表示不要戴頸圈。此時EMT將不戴頸圈的風險告知他，並且在救護紀錄表的補述欄記載清楚，這是哪一種減少過失傷害告訴的方法？","options":{"A":"時效抗辩","B":"正當防衛","C":"與有過失","D":"依法行政"},"answer":"C","manualChapter":"CH04"},{"id":6,"source":"105 高級救護技術員甄試筆試題目.doc","question":"面對倫理困境時，可以快速問自己三個問題來決定下一步的作法，但何者為非？","options":{"A":"折衷試驗","B":"無私試驗","C":"普及試驗","D":"答辨試驗"},"answer":"A","manualChapter":"CH04"},{"id":7,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列作用皆表示病患的交感神經旺盛，但何者為非？","options":{"A":"冒冷汗","B":"腸胃蠕動減少","C":"氣管收縮","D":"延遲排尿"},"answer":"C","manualChapter":"CH12"},{"id":9,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMTP給病患舌下含NTG片時，應在救護紀錄表上紀載的給藥途徑縮寫是？","options":{"A":"P.O.","B":"S.L.","C":"PR","D":"S.C."},"answer":"B","manualChapter":"背誦題","matchedChapters":["背誦題"]},{"id":11,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於藥物Atropine治療緩脈的敘述，何者為非?","options":{"A":"並非所有縣市的EMTP都可以使用Atropine","B":"治療成人有症狀的緩脈起始劑量是0.5mg","C":"使用於低體溫所造成的緩脈其劑量需比建議還高的劑量","D":"治療心臟移植病患發生的緩脈通常沒有效果"},"answer":"C","manualChapter":"CH16"},{"id":12,"source":"105 高級救護技術員甄試筆試題目.doc","question":"想要使用標準輸液套管在2小時內給病患500CC生理食鹽水，每分鐘滴數大約？","options":{"A":"60滴/分鐘","B":"80滴/分鐘","C":"100滴/分鐘","D":"120滴/分鐘"},"answer":"B","manualChapter":"CH17","matchedChapters":["CH17"]},{"id":13,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於呼吸生理機轉的敘述，何者為非?","options":{"A":"吸氣是肌肉主動收縮消耗能量的動作，吐氣則是胸部肌肉被動的回彈","B":"平靜休息呼吸時，換氣耗能約佔達全身耗能量的一成","C":"當呼吸窘迫發生例如使用輔助肌時，換氣耗能可達全身耗能量的三成","D":"一般正常成年人即使用力吐盡氣，肺內餘氣容積仍然可達一公升"},"answer":"B","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":15,"source":"105 高級救護技術員甄試筆試題目.doc","question":"血液中二氧化碳運輸的方式，不包括？","options":{"A":"與白蛋白結合","B":"與血紅素結合","C":"直接溶於血漿","D":"轉化成碳酸氫根溶於血漿"},"answer":"A","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":16,"source":"105 高級救護技術員甄試筆試題目.doc","question":"結構式溝通的SOAP模式，不包括？","options":{"A":"Subjective data主訴資訊","B":"Objective data客觀評估","C":"Assessment data綜合判断","D":"Protection data隱私保護"},"answer":"D","manualChapter":"CH18"},{"id":18,"source":"105 高級救護技術員甄試筆試題目.doc","question":"一名76歲臥床多年的男性，您觀察到他的呼吸型態如下圖。請問此種呼吸型式，最不可能是下列哪一種疾病所引起？","options":{"A":"慢性阻塞性肺病","B":"心臟衰竭","C":"尿毒症","D":"陳舊性腦中風造成的間腦損傷"},"answer":"A","manualChapter":"呼吸型態(含肺音)","image":"題庫圖片/18.png"},{"id":19,"source":"105 高級救護技術員甄試筆試題目.doc","question":"有關心臟聽診與辦膜音位置的配對，正確的是？","options":{"A":"A：肺動脈區，B：主動脈區","B":"C：三尖辦區，D：肺動脈區","C":"B：三尖辦區，C：二尖辦區","D":"A：主動脈區，D：二尖辦區"},"answer":"D","manualChapter":"CH20"},{"id":20,"source":"105 高級救護技術員甄試筆試題目.doc","question":"各縣市之消防主管機關應設立醫療指導制度，是規定在哪個法條？","options":{"A":"消防法","B":"救護技術員管理辦法","C":"醫療指導醫師辦法實行細則","D":"緊急醫療救護法"},"answer":"D","manualChapter":"CH04"},{"id":21,"source":"105 高級救護技術員甄試筆試題目.doc","question":"與盲腸炎有關的理學檢查，不包括下列哪一項？","options":{"A":"肛門直腸指診（Digital rectal examination）","B":"洛夫辛徵象（Rovsing：ssign）","C":"腰大肌徵象（Psoas sign）","D":"透納氏徵象（Turner's sign）"},"answer":"D","manualChapter":"CH20"},{"id":22,"source":"105 高級救護技術員甄試筆試題目.doc","question":"在到院前進行下列處置時皆需要穿隔離衣，但不包括下列哪一項？","options":{"A":"急產接生","B":"氣管內插管","C":"大出血止血","D":"清除呼吸道中分泌物或異物"},"answer":"B","manualChapter":"CH51"},{"id":24,"source":"105 高級救護技術員甄試筆試題目.doc","question":"醫學上對於到院前死亡（OHCA）的現場終止急救條件，不包括？","options":{"A":"沒有目擊者","B":"沒有旁觀者心肺復甦術（CPR）","C":"現場急救過程中沒有出現可電擊心律","D":"EMS反應時間超過十五分鐘"},"answer":"D","manualChapter":"CH07","matchedChapters":["CH07"]},{"id":25,"source":"105 高級救護技術員甄試筆試題目.doc","question":"急救下列病患OHCA時，可以考慮使用E-CPR（葉克膜），不包括？","options":{"A":"嚴重心衰竭致死","B":"過敏性休克致死","C":"慢性阻塞性肺病呼吸衰竭致死","D":"大片肺栓塞致死"},"answer":"C","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":26,"source":"105 高級救護技術員甄試筆試題目.doc","question":"一名中年男子血壓70 / 40mmHg，全身冒冷汗，一直喊胸口悶痛，監視器呈現心電圖如下。此時應請求線上醫療指導予以電氣治療是：","options":{"A":"雙向波同步電擊100焦耳","B":"雙向波非同步電擊100焦耳","C":"單向波同步電擊200焦耳","D":"單向波非同步電擊200焦耳"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/26.png"},{"id":27,"source":"105 高級救護技術員甄試筆試題目.doc","question":"有關重大創傷三階段死亡率（tri-modal distribution）的敘述，何者正確？","options":{"A":"第一階段的死亡主因為嚴重出血與中樞神經系統重創","B":"第二階段的死亡主因為心因性休克與神經性休克","C":"有50％的死亡發生在創傷加護病房內","D":"良好的緊急醫療救護（EMS）可以降低第三階段的死亡率"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":30,"source":"105 高級救護技術員甄試筆試題目.doc","question":"火場搶救出中年男性約50公斤，傷勢：「前胸及腹部為二度及三度燒傷，雙腿全部為三度燒傷，雙手臂為一度燙傷」。依巴克蘭公式（Parkland formula），在燒傷後的第一個8小時中應給林格氏液的量大約為？","options":{"A":"4000 cc","B":"5500 cc","C":"8500 cc","D":"15000 cc"},"answer":"B","manualChapter":"CH31"},{"id":31,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列有關成人與小孩呼吸道解剖構造不同的地方，何者正確？","options":{"A":"小孩喉部軟骨較成人硬","B":"小孩最狹窄處為聲帶，而成人則在聲帶之下環形骨環","C":"小孩舌部相對較大","D":"小孩的會厭較成人平而有彈性"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":32,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列有關辛辛那提到院前腦中風評量表（CPSS）的描述，何者為非？","options":{"A":"要求病患雙手平舉10秒鐘，評估是否有單側無力或手臂下垂的情形","B":"請病患露齒微笑，評估臉部嘴唇是否對稱","C":"請病患重複你說的話，評估是否有口齒不清，答非所問或無法表達的情形","D":"評估症狀發生在24小時內"},"answer":"D","manualChapter":"CH36"},{"id":34,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列有關房室結傳導阻斷（atrio-ventricular block）的描述，何者為非?","options":{"A":"三級房室結傳導阻斷（third degree AV block）等於完全房室結傳導阻斷（complete AV | block），其P波之後完全無跟隨的QR S複合波，造成心房（P波）跳心房的、心室（QRS複合波）跳心室的，此即所謂的房室解離（AV dissociation）的情況","B":"Mobitz第一型二級房室結傳導阻斷：其阻斷位置通常在房室結或附近，心電圖的特點為P-R區間逐漸地拉長，終至傳導不下去而出現僅有P波而無跟隨的QRS複合波的情形。此型預後較差，隨時有惡化為完全房室結傳導阻斷（complete AV block）的可能","C":"Mobitz第二型二級房室結傳導阻斷：其阻斷位置較低，可能在His bundle或以下，其心電圖的特點為P-R區間在傳導中斷前一直保持不變，然而卻突發性的出現只有P波出現而無QRS複合波跟隨的情形","D":"一級房室結傳導阻斷（first degree AV block）：心電圖上的特點為P-R區間的拉長（＞200 ms），P波、QRS複合波及T波的型態均正常。一級房室結傳導阻斷的原因可能為退化或藥物因子，導致房室結傳導變慢所造成。"},"answer":"B","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":35,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列有關高滲透壓高血糖非酮酸性昏迷（HHNK coma）的描述，何者為非?","options":{"A":"HHNK的原因是病患的胰島素不能夠讓身體组織去運用葡萄糖作為能量的來源","B":"會誘發因子可能為感染，壓力，外傷，燒燙傷或心肌梗塞等","C":"常會出現快而深的呼吸代償：庫斯毛爾氏呼吸（Kussmaul's respiration）","D":"治療的方式是補充胰島素和充足的水分與監控及治療電解質不平衡的狀態"},"answer":"C","manualChapter":"CH37"},{"id":36,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列有關致命性過敏的描述，何者為非？","options":{"A":"致命性過敏最常引起死亡的原因是上呼吸道阻塞","B":"對於清醒的病患，如果有聲音沙啞，舌頭水腫和後口咽腫大則可以選擇性的早期插管（須依循當地的預立醫囑施行，並尋求線上醫療指導","C":"如果臨床上有休克、呼吸道腫脹或呼吸困難的微候，則給予腎上腺素。腎上腺素可以經由肌肉注射給予。","D":"區分致命性過敏與其他內科急症的關鍵為得到正確的病史，因為致命性過敏通常在抗原進入體內的數小時至數天後發生，所以有足夠的時間作鑑別診斷"},"answer":"D","manualChapter":"CH40"},{"id":37,"source":"105 高級救護技術員甄試筆試題目.doc","question":"有關急性下壁心肌梗塞合併右心室心肌梗塞之敘述，何者為非？","options":{"A":"常會出現血壓降低情形","B":"右側心電圖的胸前導程V4呈現ST節段上升Imm即可診斷","C":"病患血壓降低合併雙側肺部濕囉音，應給予大量生理食鹽水","D":"應避免使用會降低前負荷（Preload）的藥物如Morphine以及NTG"},"answer":"C","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":38,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於心包填塞（Cardiac Tamponade）的敘述，何者為是？","options":{"A":"會造成胸痛，可以比照缺血性胸痛給予MONA","B":"心包膜腔液體過多的話，會先壓迫左心房以及左心室，造成無脈性的電氣活動（PEA）","C":"會影響到回心血流是在心臟收縮期時","D":"高度懷疑心包膜填塞之病患，可以考慮到院前建立靜脈管路，給予生理食鹽水"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":39,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列何者不屬於因血管性張力調節失常（體液重新分佈）所造成的休克？","options":{"A":"神經性休克","B":"敗血症休克","C":"過敏性休克","D":"心因性休克"},"answer":"D","manualChapter":"CH26"},{"id":40,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於腦中風病患急性期的血壓控制，何者為非？","options":{"A":"對缺血性中風病患，血壓應控制在正常或患病前的範圍內以免讓症狀加重","B":"除非有合併主動脈剝離，心衰竭等，否則缺血性中風病患，在收縮壓超過220mmHg或舒張壓超過120mmHg時方需要處理","C":"出血性中風病患，因考慮到其出血範圍會增加及再出血的可能性，血壓控制應較缺血性中風積極","D":"考慮要接受血栓溶解劑的病患其血壓應控制在收縮壓185mmHg，舒張壓110mmHg以下"},"answer":"A","manualChapter":"CH36"},{"id":41,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列呼吸道急症與其主要造成原因的配對，何者為非？","options":{"A":"嚴重氣喘：通氣","B":"會厭炎：通氣","C":"一氧化碳中毒：擴散","D":"肺栓塞：擴散"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":42,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於貝爾氏麻痺（Bell's palsy）之敘述，下列何者為非?","options":{"A":"主要造成原因不明或者是病毒感染","B":"貝爾氏麻痺的預後良好，大部分會自行恢復","C":"其神經學表徵為可以皺前額及眉頭","D":"在急性期不可使用含類固醇的藥物治療"},"answer":"C","matchedChapters":["CH36"],"manualChapter":"CH36"},{"id":43,"source":"105 高級救護技術員甄試筆試題目.doc","question":"肺栓塞最容易引起的心電圖發現，下列何者為是？","options":{"A":"S1Q3T3","B":"Atrial flutter","C":"Sinus tachycardia","D":"Right bundle branch block"},"answer":"C","manualChapter":"CH16"},{"id":45,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於白血球分類之功能敘述，下列何者正確？","options":{"A":"嗜酸性白血球（Eosinophils）-對抗細菌感染","B":"嗜中性白血球（Neutrophil）-對抗寄生蟲感染，過敏反應","C":"嗜鹼性白血球（Basophils）-對抗病毒","D":"單核球（Monocytes）-對抗結核菌"},"answer":"D","manualChapter":"CH12"},{"id":46,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於引發急性腎衰竭的因子，下列何者為非？","options":{"A":"消化道出血-腎前性因子","B":"攝護腺肥大-腎後性因子","C":"心臟衰竭-腎前性因子","D":"腎絲球腎炎-腎後性因子"},"answer":"D","manualChapter":"CH41"},{"id":47,"source":"105 高級救護技術員甄試筆試題目.doc","question":"發生外傷性橫紋肌溶解症時，下列何者為非？","options":{"A":"大量輸液","B":"口服補充KCL","C":"輸液補充Sodium Bicarbonate鹼化尿液","D":"可能造成急性腎衰竭"},"answer":"B","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":48,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於骨骼肌肉系統外傷之處理，下列何者為非？","options":{"A":"應注意受傷機轉","B":"理學檢查的重點包括遠端脈搏","C":"最常見的危急生命的電解質不平衡是高血鈣","D":"肢體大出血無法加壓止血時使用止血帶有幫助"},"answer":"C","manualChapter":"CH30"},{"id":49,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMTP檢查頭部外傷病患發現病患可能因顱內出血導致左側瞳孔放大5mm，其病理？","options":{"A":"左側腦出血壓迫第二對腦神經","B":"右側腦出血壓迫第二對腦神經","C":"左側腦出血壓迫第三對腦神經","D":"右側腦出血壓迫第三對腦神經"},"answer":"C","manualChapter":"CH12"},{"id":50,"source":"105 高級救護技術員甄試筆試題目.doc","question":"小兒腹部鈍傷中，最容易受傷的器官為何？","options":{"A":"十二指腸","B":"肝臟與脾臟","C":"小腸","D":"腎臟"},"answer":"B","manualChapter":"CH48"},{"id":51,"source":"105 高級救護技術員甄試筆試題目.doc","question":"有關連枷胸（flail chest）的說明，下列何者為非?","options":{"A":"理學檢查常有皮下捻髮音crepitus","B":"傷患往往呈現缺氧","C":"不要使用止痛藥以免抑制傷患呼吸","D":"病患常常會惡化到需要插管"},"answer":"C","manualChapter":"CH28"},{"id":52,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMT救護外傷病患，檢查到下列何者生命徵象，最不像是低血容性休克？","options":{"A":"血壓下降，心跳變快，尿量減少","B":"血壓下降，心跳變快，膚色蒼白濕冷","C":"血壓下降，心跳不快，膚色溫暖","D":"血壓下降，心跳變快，意識躁亂"},"answer":"C","manualChapter":"CH26"},{"id":53,"source":"105 高級救護技術員甄試筆試題目.doc","question":"嬰幼兒休克時給予輸液急救，建議每次的輸液量為？","options":{"A":"10 cc / kg Normal Saline","B":"15 cc / kg Normal Saline","C":"20 cc / kg Normal Saline","D":"30 cc / kg Normal Saline"},"answer":"C","manualChapter":"CH48"},{"id":54,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列何者外傷病患最不像是有尿道損傷？","options":{"A":"受傷機轉為騎馬鞍式撞擊骨盆","B":"尿道口有血跡","C":"雙大腿腫脹","D":"攝護腺於指診時高位或換八"},"answer":"C","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":55,"source":"105 高級救護技術員甄試筆試題目.doc","question":"OHCA現場急救，你在插管時發現看不見氣管入口。下列作法可幫助聲帶三角容易呈現，但何者除外？","options":{"A":"選擇適當大小的喉鏡葉片","B":"請人施行甲狀軟骨按壓術","C":"插管者姿勢蹲低或趴在地上","D":"將病患枕部下墊高約10公分。"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":56,"source":"105 高級救護技術員甄試筆試題目.doc","question":"急救常用的Epinephrine在下列成人重症與給藥的組合，下列何者為非？","options":{"A":"無脈搏急救：Img靜脈推注，每3〜5分鐘一次","B":"氣喘重積症發作：0.3mg皮下注射，每20分鐘一次","C":"過敏性休克：0.3〜0.5mg皮下注射，每5〜15分鐘一次","D":"不稳定的緩脈併休克徵象：2〜10 meg / min連續滴注"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":57,"source":"105 高級救護技術員甄試筆試題目.doc","question":"你出勤救護一位燒炭自殺的中年男性，到達現場時，發現他已呈現深度昏迷的狀態。請問下列敘述何者為非？","options":{"A":"到達現場必須注意通風，注意施救者的安全","B":"病患血中一氧化碳血紅素應該超過50％","C":"若測量血氧濃度（SPO2）＞94％，不必一定要給氧","D":"若測量血氧濃度（SPO2）過低，問題可能出在呼吸道未暢通"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":58,"source":"105 高級救護技術員甄試筆試題目.doc","question":"當救護處置內容涉及法律爭議時，是否存在救護過失往往是爭執的焦點。所謂「過失」指的通常要符合四個要件，以下何者錯誤？","options":{"A":"有進行救護處置的義務","B":"救護處置未達標準（即違反了提供適當救護的義務）","C":"對病患或他人造成傷害","D":"造成的傷害與所採取的救護處置有時間上的前後關係"},"answer":"D","manualChapter":"CH04","matchedChapters":["CH04"]},{"id":59,"source":"105 高級救護技術員甄試筆試題目.doc","question":"保密的義務在為了某些更重要的社會利益是可以打破的，何者為非?","options":{"A":"法律上規範有通報義務的情形","B":"為了內部或是醫療品質改善需要","C":"為了社會大眾知的權利","D":"當檢察官持有搜索令狀，進行司法調查；或是為了阻止犯罪行為的發生"},"answer":"C","manualChapter":"CH04","matchedChapters":["CH04"]},{"id":60,"source":"105 高級救護技術員甄試筆試題目.doc","question":"一輛汽車因故撞上電線桿，下列狀況下，車上有三位需立刻送往創傷中心，何者為非？","options":{"A":"脫困時間10分鐘的後座乘客","B":"被從車內拋出的前座乘客","C":"評估後確認有骨盆骨折的駕駛","D":"GCS昏迷指數12的後座乘客"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":64,"source":"105 高級救護技術員甄試筆試題目.doc","question":"工地工人被倒塌之土牆壓到前胸，因胸部劇痛及呼吸困難而被送到急診室。病患到院時之血壓80 / 60mmHg，心跳110 / min，呼吸35 / min。理學檢查發現右胸無明顯肺部呼吸音，頸靜脈鼓脹。此時醫學上最應給予的優先處置為：","options":{"A":"快速麻醉並執行氣管內管插管","B":"建立兩條大管徑輸液管，先輸39“℃的生理食鹽水2000cc","C":"給予適當氧氣流速以維持血氧（oximeter）在94％以上後，立即照胸部X光床邊攝影","D":"以大管徑的空針扎向右側肋膜腔以減壓"},"answer":"D","manualChapter":"創傷"},{"id":65,"source":"105 高級救護技術員甄試筆試題目.doc","question":"依北美NEXUS原則，下列病患皆屬於頭椎受傷的低危險群，但何者為非？","options":{"A":"無頸部後中線的壓痛點的病患","B":"無肢體無力或發麻的病患","C":"疑似有喝酒的病患時而清醒時而亂言亂語的病患","D":"沒有明顯骨折或大片外傷疼痛的病患"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":66,"source":"105 高級救護技術員甄試筆試題目.doc","question":"一名35歲男性自約6米高處墜樓後送醫，到院時意識清楚，但血壓低合併休克症狀，同時患者失去對大腸及膀胱的感覺，且合併陰莖持續勃起，此時其休克的原因最可能？","options":{"A":"心因性休克Cardiogenic shock","B":"神經性休克Neurogenic shock","C":"脊髓性休克Spinal shock","D":"低血容性休克Hypovolemic shock"},"answer":"C","manualChapter":"CH26"},{"id":67,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於低體溫病患之到院前治療，何者為非？","options":{"A":"在低溫環境下疑似心跳停止的病患，檢查脈搏時間應達30-45秒","B":"劇烈地晃動病患可能誘發病患的心律不整，例如心室顫動（Vf）","C":"對於沒有反應且檢查不到脈搏的病患，為避免過度晃動病患，不建議插管","D":"瞳孔放大固定是重度低體溫常見的症候，故無法以此判斷病患是否已死亡很久"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":68,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於疑似發生高山症之隊友，其預防惡化的策略，何者為非？","options":{"A":"輕微增加其活動強度以強化其耐受性","B":"減緩上升速度或開始下降登山高度","C":"吃高碳水化合物的食物較好","D":"使用預防性的藥物例如丹木斯（Diamox）或威而剛（Viagra）"},"answer":"A","manualChapter":"CH44"},{"id":69,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMT可以用CAGE方法來評估病患是否有酒精成瘾問題。CAGE說明何者為非？","options":{"A":"Careless病患是否長期沒有人關心","B":"Annoyance病患是否因喝酒而遭親友嫌棄","C":"Guilty病患是否因喝酒而有罪惡感","D":"Eye opener病患是否一早起床張開眼就想找酒喝"},"answer":"A","manualChapter":"CH46"},{"id":70,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於老年人生理變化的說明，何者正確？","options":{"A":"呼吸方面，肺部的餘氣量與肺活量都會明顯下降","B":"心血管方面，血壓和心輸出量都會明顯增高","C":"體重方面，肌肉組織和脂肪組織成份都會明顯減少","D":"腎臟方面，腎臟重量和腎絲球過濾率都會明顯減少"},"answer":"D","manualChapter":"CH47"},{"id":71,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMT在接觸老年病患時，下列方法都有助於病史詢問，但何者為非？","options":{"A":"仔細聽，有耐心","B":"請病患裝上假牙或戴上老花眼鏡口","C":"先告訴對方自己是救護技術員","D":"以「阿伯你好」「阿媽你好」取代直呼其姓名"},"answer":"D","manualChapter":"CH19"},{"id":72,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMT在野外醫學領域進行救護時，可能遭受的危險，何者為非？","options":{"A":"情緒危險","B":"人為危險","C":"地域危險","D":"個人危險"},"answer":"A","manualChapter":"CH45"},{"id":73,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMT處置被右圖蛇類咬傷腳趾的傷患，何者為非?","options":{"A":"可以彈繃包紮壓迫腳踝，緊度為一指可插入","B":"傷肢可能在短期內出現快速腫脹及血泡","C":"傷口切開或吸吮器並無實效，甚至可能有害","D":"治療之蛇毒血清為出血性蛇毒血清"},"answer":"D","manualChapter":"CH50"},{"id":74,"source":"105 高級救護技術員甄試筆試題目.doc","question":"陽明山求救案件，你到現場發現有一名登山客吃了山產後發生意識胡言亂語、皮膚乾熱潮紅、瞳孔放大、脈搏不規則。請問他呈現了哪一種中毒症象？","options":{"A":"膽鹼性中毒","B":"致幻覺性中毒","C":"抗膽鹼性中毒","D":"仿交感神經性中毒"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":76,"source":"105 高級救護技術員甄試筆試題目.doc","question":"年輕孕婦懷孕急產產出一足月胎兒。剛出生時新生兒抽吸口鼻不會哭泣臉部也無表情，呼吸微弱不規則，脈搏微弱且約每分鐘120下，刺激時手腳僅有一些無力的收縮。外觀發現四肢發鉗，身體比較紅潤。請問其APGAR分數是？","options":{"A":"3分","B":"4分","C":"5分","D":"6分"},"answer":"C","manualChapter":"CH49"},{"id":77,"source":"105 高級救護技術員甄試筆試題目.doc","question":"一位兩歲的幼童，咳嗽流鼻水已經一週，目前僅對痛覺刺激有反應並有發紺現象，心跳速率為188次/每分鐘，呼吸速率為65次/每分鐘，肋間肌嚴重凹陷，微血管回填充時間小於兩秒鐘，到院前下列何項立即性的處理最為優先：","options":{"A":"建立靜脈管路並給予液體輸注","B":"打開呼吸道，使用甦醒球連接100％氧氣以提供輔助性正壓通氣","C":"提供100％氧氣面罩，並立即測血氧濃度分析","D":"提供100％氧氣面罩，並立即進行神經學檢查"},"answer":"B","manualChapter":"CH48"},{"id":78,"source":"105 高級救護技術員甄試筆試題目.doc","question":"在EMS品質的六大面向中，「所有的傷病患都應該接受相同而完整的EMS服務」，是符合哪一個面向的品質要求？","options":{"A":"公平","B":"有效","C":"安全","D":"傷病患為中心"},"answer":"A","manualChapter":"CH09","matchedChapters":["CH09"]},{"id":79,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於EMS品質指標的分類，下列皆是結構面指標，但何者為非？","options":{"A":"EMT的離職率","B":"EMT1，EMT2，EMTP的比率","C":"統一的標準作業流程與定期修改的記錄","D":"將重傷病患送到創傷中心的比率"},"answer":"D","manualChapter":"CH09"},{"id":80,"source":"105 高級救護技術員甄試筆試題目.doc","question":"憂鬱病史中年男性病患口服50顆10 mg的propanolol。EMTP到達時病患意識尚清醒。建立IV line並接上監視器後，心電圖如下所示。病人血壓70 / 40mmHg，體溫36⁰，呼吸22 / min，下列敘述何者正確？","options":{"A":"為Morbtiz type I 2⁰房室阻斷","B":"為Morbtiz type II 2⁰房室阻斷","C":"病患目前為穩定之緩脈，密切觀察即可","D":"應考慮給予atropine 0.5mg IV治療"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/80.png"},{"id":81,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於生產之產程，以下何者為非？","options":{"A":"急產的定義為陣痛開始至胎兒產生小於三小時","B":"生產之第一個產程為規則陣痛開始至子宮頸全開","C":"生產之第二個產程（胎兒產出期）為子宮頭全開至胎兒生出完畢","D":"生產之第三個產程（胎盤產出期）為胎盤生出之過程"},"answer":"B","manualChapter":"CH49"},{"id":82,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於輻射事故緊急應變的處置，以下敘述何者為是？","options":{"A":"出現輻射傷害症狀的病患，身上必定有殘餘輻射，必須先進行除污之後才能進行醫療照護","B":"若發現病患衣物上有粉狀或固體之疑似輻射污染物質，切勿以水除污，以免產生化學反應。","C":"為了避免帶有輻射之砂石顆粒殘留傷口內，務必以纱布來回擦拭除污","D":"病患除污標準是手持式輻射偵測器檢測劑量在背景值的2-3倍以下即可"},"answer":"D","manualChapter":"CH53"},{"id":83,"source":"105 高級救護技術員甄試筆試題目.doc","question":"在毒化災事故中，對於有傷口水泡的傷病患而言，以下哪種除汙方式是比較合適的？","options":{"A":"以「低水壓，高流量」的清水來沖洗","B":"以「低水壓，低流量」的清水來沖洗","C":"以「高水壓，高流量」的清水來沖洗","D":"以「高水壓，低流量」的清水來沖洗"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":84,"source":"105 高級救護技術員甄試筆試題目.doc","question":"目前有許多醫學文獻顯示EMTP在到院前救護車上使用「呼吸道正壓呼吸器（Positive Airway Pressure）」對下列病患有幫助，但以下何者為非？","options":{"A":"心衰竭導致肺水腫病之患","B":"嚴重過敏導致呼吸窘迫病患","C":"急性胸部鈍挫傷之病患","D":"慢性阻塞性肺病急性發作之病患"},"answer":"B","manualChapter":"CH51","matchedChapters":["CH51"]},{"id":85,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於危害物質災難事件層區管制的觀念，以下何者錯誤？","options":{"A":"安全區在事件開始時即需建立，將支援人員器材集結於此，並設定由下風高處做為暖區及熱區的出入位置","B":"事故周邊直接或間接（如受污染之傷惠及器材）受到危害物質影響之處，也應劃定為熱區","C":"黃區為介於污染區及安全區之之間的緩衝區域，作為除污及病人緊急醫療處理之處","D":"除污走廊應該位於暖區。"},"answer":"A","matchedChapters":["CH53"],"manualChapter":"CH53"},{"id":86,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於大型活動（Mass Gathering）的觀念，以下何者錯誤??","options":{"A":"一般而言，大型活動是指群眾聚集人數超過1000人的活動","B":"在1999年的英倫醫學雜誌建議，每千人需有一位急救人員，每三千人需有一輛有高級救護技術員的救護車，每五千人則需一位急診醫師","C":"每次醫療照護無論是輕是重，應該都要確實填寫一份醫療救護紀錄單","D":"如現場無法在五分鐘內提供高級心臟救命術的醫療照顧，現場就必須準備AED"},"answer":"B","manualChapter":"CH54"},{"id":87,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於生物戰劑的觀念，以下何者錯誤？","options":{"A":"相對於傳統武器與其他大規模殺傷性武器，生物戰劑容易大量製造，也容易施放","B":"生物恐怖事故不易偵測，可能造成嚴重的心理街擊","C":"忽然爆發的大量病患，其潛伏期均非常相近且密集，應該懷疑生物恐怖事故","D":"結核桿菌，天花病毒，水痘病毒，麻疹病毒，都是飛沫傳染"},"answer":"D","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":88,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於空中救護的觀念，以下何者錯誤?","options":{"A":"符合空中救護適應症的傷病患，都應該啟動空中救護","B":"行政院已將空中消防隊、空中警察隊、民用航空局航空隊整合，成立「國家航空勤務總隊」","C":"依照政府公告的「空中救護適應症」，昏迷指數小於十的傷病患得以申請空中救護","D":"依照政府公告的「空中救護適應症」」二度，三度燒傷面積達百分之十或特殊部位（如顏面、會陰）燒傷的傷病患得以申請空中救"},"answer":"A","manualChapter":"CH58"},{"id":89,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於事故指揮系統（ICS）的描述，以下何者錯誤？","options":{"A":"事故指揮官負責整個事故的應變和管理。最早抵達現場的工作人員當中，應以位階最高者擔任事故指揮官","B":"聯絡官在事故指揮系統中扮演的是個接合的點，聯繫相關的政府部門、非政府組織、和民間機構","C":"執行部門負責主要的應變工作，例如「警戒管制」，應該由執行部門負責","D":"後勤部門負責提供工作人員醫療照護、餐飲，處理設備和補給品；這個部門所提供服務的直接對象是工作人員，而不是災民"},"answer":"A","manualChapter":"CH52"},{"id":90,"source":"105 高級救護技術員甄試筆試題目.doc","question":"EMTP到達一個自殺的現場有濃重的惡臭，牆角有一個被撕掉標籤的空瓶。經初評發現病人完全昏迷（對痛沒有反應）、口鼻分泌物大量增加、口吐白沫、呼吸每分鐘12下，頸動脈摸的到（每分鐘50下）、四肢癱瘓、全身皮膚蒼白濕冷、血糖值為180 mg / dL，距離急救責任醫院約20分鐘車程；下列敘述何者為非？","options":{"A":"高級救護技術員在這種情況下須特別注意自我防護以免吸入而造成中毒","B":"病人的瞳孔應該會呈現是擴瞳現象","C":"可請求線上醫療指導同意注射atropine","D":"此種中毒到院後有專屬的解毒劑"},"answer":"B","manualChapter":"非創傷"},{"id":91,"source":"105 高級救護技術員甄試筆試題目.doc","question":"在大量傷病患事故的檢傷分類，以下觀念何者最不適當？","options":{"A":"如果事故的傷病患人數極多，事故應變的時間較長，那麼，應該考慮讓救護技術員輪流擔任檢傷員，避免同一個人長時間承受檢傷的心理壓力","B":"大量傷病患檢傷分類是非常表淺的診治方式，所著重的是在短時間內區別出病患的嚴重度，不能夠取代實際的診治病患","C":"檢傷員應該盡可能在第一時間就完整處理傷病患的傷勢，嚴重傷病患應該立即實施氣管內管插管等等急救步驟，以免延誤病情。完成後，再繼續評估下一名病患","D":"檢傷之後，不同嚴重度的傷病患所得到的現場處置應該有所區別，檢傷這個步驟才會有所意義"},"answer":"C","manualChapter":"CH52"},{"id":92,"source":"105 高級救護技術員甄試筆試題目.doc","question":"在大量傷病患事故的屍體處理，以下觀念何者最不適當？","options":{"A":"為了表示對死者的尊重，應該儘可能使用救護車把屍體載送到殯儀館或其他暫時安厝的場所","B":"明顯死亡的屍體，只有在獲得許可之後，才能夠移動位置，因為這牽涉到死因鑑識和其它的法律問題","C":"如果橫陳的屍體阻礙了逃生或援救的通道，這種緊急狀況下可以搬動屍體來開通通道","D":"在危害物質事故中，考量除污的問題，遺體通常先留置在原先地點，等到事故控制至一定階段後再移動"},"answer":"A","manualChapter":"CH52"},{"id":93,"source":"105 高級救護技術員甄試筆試題目.doc","question":"對於災難的描述，以下觀念何者最不適當？","options":{"A":"災難後的大量屍體會造成瘟疫，處理大量屍體最有效的方法就是集體埋入土坑","B":"自然災難時，通常民眾善良的本性會激發出來，自助互助的狀況非常常見，很少會有治安的問題","C":"目前的科技有很多方法可以協助鑑識大量屍體，應該儘可能鑑識屍體身分","D":"在自然災難中，最貧窮的區域通常死傷最嚴重"},"answer":"A","manualChapter":"CH52"},{"id":94,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列關於防護衣的觀念何者正確？","options":{"A":"消防人員進入火場使用的的防護衣裝載有個人自給式呼吸系統，已經提供最高呼吸保護，遇到毒化災作業時可以直接當做B級防護衣使用","B":"C式防護衣可能是全身式或二截式，可以防液體潑濺，但無法阻止有毒液體滲入","C":"A級防護衣使用自給式呼吸設備，不會吸入空氣中的有毒物質，但無法阻播空氣中的有毒物質接觸皮膚造成傷害","D":"輻射事故緊急應變跟一般毒化災應變不同，無論是熱區，暖區或安全區人員，依照規定均需使用A級防護衣"},"answer":"B","manualChapter":"CH53"},{"id":95,"source":"105 高級救護技術員甄試筆試題目.doc","question":"根據『事故指揮系統』（ICS），以下哪位主管的管理範疇超過了合理範圍？","options":{"A":"『事故指揮官』管理：安全官發言官聯絡官各一名，執行部門80人，計畫部門5人與後勤部門4人","B":"『執行部門部長』管理：一個待命區群組（包括五台救護車，共15個人），一台後送救護直升機（3人），一個現場封鎖小隊（7人），一個搜索搶救群組（內含三個特勤小隊，共12人），一個警方霹靂小組（6人）","C":"『基隆河左岸區域主管』管理：一個河岸搜索小隊（6人），一個河面搜索小隊（6人），一個緊急救護小隊（2人），一台救護車（2人），一台加護型救護車（3人），一台後送救護直升機（3人），自願加入之義消一組（3人），急診醫護團隊（4人）","D":"『後勤部門部長』管理：通訊組（10人，包括一個電話中心），後勤醫療組（6人），飲食組（20人，包括兩單位的野戰廚房），物資供應組（6人），設備管理組（6人），運輸組（12人，包括2台教護車，一台卡車）"},"answer":"C","manualChapter":"CH52"},{"id":96,"source":"105 高級救護技術員甄試筆試題目.doc","question":"以下災難應變的概念，何者正確？","options":{"A":"多重傷病患檢傷的概念是在資源嚴重不足下，盡可能使大多數的傷病患可以得到必要治療，START檢傷法是其中的代表","B":"根據ICS，第一台抵達的應變車輛應該查看現場安全，並等待事故指揮官抵達","C":"應用START檢傷法時，如果你遇到有一個病患無法自行行走且明顯有換氣過度症候群，呼吸速率高達40次/分鐘，應檢為紅色重傷","D":"當後送單位將病患送達醫院後，在醫院內應該進行次級檢傷以決定看診先後次序"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":97,"source":"105 高級救護技術員甄試筆試題目.doc","question":"關於大型活動之緊急醫療救護，以下何者正確？","options":{"A":"現場醫療站的救護動線選擇，需同時考慮擔架與輪椅的寬度","B":"大型活動急症多屬於意外，依照目前的醫療科技無法預防","C":"若單一救護站遇到四名重傷患者但總數未達十五人，應不用啟動大量傷患計畫","D":"規劃醫療作業時，救護站作業應與活動同步，同時開站，同時結束"},"answer":"A","matchedChapters":["CH10"],"manualChapter":"CH10"},{"id":98,"source":"105 高級救護技術員甄試筆試題目.doc","question":"根據ICS，事故指揮官的管理幕僚包括發言官、安全官與聯絡官，以下何者正確？","options":{"A":"安全官審核應變工作人員的醫療照護計畫","B":"發言官必須批准新聞的發佈","C":"聯絡官必須定期舉行記者會","D":"發言官必須掌握相關機構名單與聯絡方式，並與這些機構交流資訊"},"answer":"A","manualChapter":"CH52"},{"id":99,"source":"105 高級救護技術員甄試筆試題目.doc","question":"於2016年2月的台南大地震，其EMS與醫療指導介入的過程，以下何者為非？","options":{"A":"地震造成513人傷亡，是我國自921大震後死傷最多的地震","B":"地震初期仍是由消防EMTP作為現場救護總指揮，24小時後方有醫療指導介入接手","C":"救護過程中醫療指導特別關注救護救災人員的職業傷害，例如徹底執行現場工作人員一律配戴N95以減少粉塵吸入","D":"本案有進行救護救災人員的現場與事後心理評估，以預防創傷後壓力症後群"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":100,"source":"105 高級救護技術員甄試筆試題目.doc","question":"下列何者不是醫學倫理的四原則之一？","options":{"A":"自主原則","B":"行善原則","C":"道德原則","D":"不傷害原則"},"answer":"C","manualChapter":"CH03"},{"id":101,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"追求醫療救護品質，首要之務為","options":{"A":"有效","B":"及時","C":"公平","D":"安全"},"answer":"D","manualChapter":"CH09","matchedChapters":["CH09"]},{"id":102,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"新生兒急救時，所需的急救措施，最少用到的是？","options":{"A":"擦乾和保暖","B":"给氧","C":"胸外按壓","D":"藥物"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":103,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"高級救護技術員的關鍵思考步驟順序為何？a、應用原則b、資料判讀c、反應評估d、概念今形成e、事後回顧","options":{"A":"a，b，c，d，e","B":"b，d，c，a，e","C":"d，a，b，c，e","D":"d，b，a，c，e"},"answer":"D","manualChapter":"CH22"},{"id":105,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"所謂「優先派遣」是依據什麼，在短時間內分辨報案電話之輕重緩急？","options":{"A":"報案者口氣緊急與否","B":"主訴的嚴重性","C":"關鍵問題的詢問","D":"病患的主訴與生命徵象"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":106,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列何者不是醫學倫理的四原則之一？","options":{"A":"行善原則","B":"道德原則","C":"自主原則","D":"不傷害原則"},"answer":"B","manualChapter":"CH03"},{"id":107,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有關「回溯性醫療指導」的敘述，何者為非？","options":{"A":"比較容易進行","B":"與救護過程不直接相關","C":"救護錯誤可能已經發生","D":"檢查救護紀錄表即為一種回溯性醫療指導"},"answer":"B","manualChapter":"CH02"},{"id":108,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"緊急醫療救護系統「時效性指標」中，所謂「反應時間」（response time）是指","options":{"A":"到達現場時間減去通知出勤時間","B":"到達現場時間減去接獲求救電話時間","C":"接觸病患時間減去通知出勤時間","D":"接觸病患時間減去接獲求救電話時間"},"answer":"D","manualChapter":"CH09","matchedChapters":["CH09"]},{"id":110,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"心臟的傳導系統如圖示。請問常用藥物「腺甘酸」（Adenosine）作用位置，何者為是？","options":{"A":"甲，乙","B":"乙，丙","C":"丙，丁","D":"乙，丁"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/110.png"},{"id":112,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"當某樣自主神經系統的藥物作用點是β1 = β2＞α時，它對人會造成的影響，何者為是？","options":{"A":"血管舒張","B":"心跳減緩","C":"氣管收縮","D":"血糖上昇"},"answer":"D","manualChapter":"CH16"},{"id":113,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"以下有關於人類細胞的敍述，何者為是？","options":{"A":"高基氏體可產生許多ATP，提供能量","B":"細胞核是細胞中唯一有具有DNA的部位","C":"溶小體可以提供細胞做為合成碳水化合物的場所","D":"核醣體負責合成蛋白質"},"answer":"D","manualChapter":"CH12"},{"id":114,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"腹部臟器疾病常有體表的轉移痛（referred pain），如下圖所示常見的轉移痛配對，何者為非？","options":{"A":"十二指腸潰瘍穿孔","B":"膽結石絞痛","C":"外傷性脾臟破裂","D":"子宮及骨盆腔發炎"},"answer":"C","manualChapter":"CH19","image":"題庫圖片/114.png"},{"id":115,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於EMTP使用醫學上常用的結结構式溝通S-O-A-P模式，不包括下列哪一項？","options":{"A":"S：surrounding data環境安全與對病患及施救者之影響","B":"0：objective data病患身體評估的結果","C":"A：assessment data綜合上述結果形成的臨床判斷","D":"P：plan of management根據臨床判斷所形成的治療計畫"},"answer":"A","manualChapter":"CH18","matchedChapters":["CH18"]},{"id":116,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"中年男性老煙槍有高血壓，慢性肺氣腫（COPD）及心衰竭（CHF）病史。病患求救主訴呼吸喘，請問你在理學檢查時如果有下列哪樣發現時，不建議給予病人霧化型氣管張劑（貝它促進劑）的治療？","options":{"A":"頭靜脈鼓張（JVE）","B":"呼吸音有哮喘音（wheezing）","C":"呼吸音有細囉音（rales）","D":"雙測下肢輕微水腫"},"answer":"C","manualChapter":"呼吸急症","explanation":"本題患者同時具有 COPD 與 心衰竭（CHF） 的雙重病史，這在到院前呼吸困難的鑑別上是最常見也最棘手的兩難：究竟是 COPD 急性發作，還是心因性肺水腫（Acute Pulmonary Edema），細囉音（特別是雙側肺底或瀰漫性濕囉音）是肺泡與小支氣管內積液的典型表現，強烈指向左心衰竭引發的急性心因性肺水腫，而心因性肺水腫的主要治療為氧氣治療、正壓通氣（CPAP/BiPAP）及血管擴張劑（如 NTG）以降低前後負荷，給予 beta2促進劑（如 Albuterol / Salbutamol）雖然主要作用於支氣管，但仍有部分beta1交叉刺激效應，或因血管擴張引發反射性交感興奮，造成心跳過速、心肌耗氧量大幅增加，進一步惡化已衰竭的心臟功能，甚至誘發嚴重致命性心律不整或急性心肌缺血。因此，當理學檢查主要呈現細囉音（肺水腫）時，不應優先或隨意給予 beta2 促進劑。"},{"id":117,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列何者並非創傷病患初級評估之項目？","options":{"A":"頸椎固定及維持呼吸道通暢","B":"呼吸及換氣功能","C":"循環及控制出血","D":"病史詢問"},"answer":"D","manualChapter":"CH25"},{"id":118,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"EMTP評估病患時，發現病患呼吸型態忽深忽淺，還會暫停幾秒（如示意簡圖）。請問該病患可能的疾患，何者為非？","options":{"A":"心臟衰竭","B":"藥物中毒","C":"急性腎衰場併酸血症","D":"陳舊性腦中風後遺症"},"answer":"C","manualChapter":"呼吸型態(含肺音)","matchedChapters":["NeedImage"],"image":"題庫圖片/118.png"},{"id":119,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"一位中年男性主要臨床表現是壓迫性胸痛，上腹部不適，合併噁心，冒冷汗，呼吸困難，理學檢查發現低血壓，心搏過速，頸靜脈怒張，雙側肺音對稱清楚，請問他最可能是以下何種疾病？","options":{"A":"右心心肌梗塞合併急性右心衰竭","B":"左心心肌梗塞合併急性左心衰竭","C":"主動脈剝離維合併急性心包膜填塞","D":"心包膜炎合併心包膜填塞"},"answer":"A","manualChapter":"CH34","explanation":"本題呈現的是非常經典的右心室心肌梗塞（RV Infarction）三聯徵：低血壓、頸靜脈怒張（JVD）(右心室收縮衰竭，血液無法順利打入肺循環，導致體循環靜脈回流受阻)、中心靜脈壓（CVP）顯著飆升)、雙側肺音對稱乾淨（Clear Lung Fields）：因為血液積在右心與體靜脈，沒有鬱積在左心與肺微血管，因此聽診不會出現肺水腫的細囉音（Crackles/Rales）。\n\n配合臨床表現壓迫性胸痛、上腹不適、噁心、冒冷汗（常為下壁/右室心肌梗塞刺激迷走神經的典型表現），診斷首選右心室梗塞。"},{"id":120,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"各種到院前情境處理時所需要的個人防護裝備說明，下列何者為非？","options":{"A":"小出血止血不用穿隔離衣","B":"急產接生不用戴護目鏡","C":"氣管插管不用穿隔離衣","D":"建立靜脈注射管路不用戴護目鏡"},"answer":"B","matchedChapters":["CH22"],"manualChapter":"CH22"},{"id":121,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"請問2015年最新發佈的ACLS中有關CPR準則之敘述，何者為非？","options":{"A":"小兒胸部按壓深度建議為5公分","B":"成人胸部按壓深度建議為5至6公分","C":"成人胸部按壓速率建議為每分鐘100至120下","D":"成人CPR中進階呼吸道給氣速率為每5秒一次"},"answer":"D","manualChapter":"CH23"},{"id":123,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列病患何者並非醫學上建議使用葉克膜（ECMO）進行急救之對象？","options":{"A":"剛發生車禍，頭部外傷併嚴重顱內出血的心跳停止病患","B":"心職衰竭末期，經醫師評估有換心手術適應症的心跳停止病患","C":"火場剛剛教出，嚴重吸道灼傷導致室息的心跳停止病患","D":"近一週內出現心肌炎導致心衰竭及心律不整的心跳停止病患"},"answer":"A","matchedChapters":["CH24"],"manualChapter":"CH24"},{"id":124,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列以心電圖來定位「ST節段上升心肌梗塞」心肌梗塞的位置，何者為非？","options":{"A":"導程II、III、aVF的ST節段上升：下壁心肌梗塞，通常因右冠狀動脈阻塞所致","B":"導程V1、V2的ST節段上升：心室中隔心肌梗塞；通常因左前降枝冠狀動脈阻塞所致","C":"導程I、aVL的ST節段上升：高位側壁心肌梗塞；通常因右冠狀動脈阻塞所致","D":"導程V3、V4的ST節段上升：右心室心肌梗塞；通常因右冠狀動脈阻塞所致"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":125,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列有關高滲透壓高血糖非酮酸性昏迷（HHNK coma）的描述，何者為非？","options":{"A":"高滲透壓高血糖非酮酸性昏迷的病患擁有足夠量的胰島素可避免身體進行酮酸代謝，可是這樣的胰島素的量又不足以能夠讓身體周邊組織運用葡萄糖作為能量的來源","B":"會出現快而深的呼吸代償：庫斯毛爾氏呼吸（Kussmaul's respiration）","C":"誘發因子可能為感染、壓力、外傷、燒燙傷或心肌梗塞等","D":"治療的方式是補充胰島素和充足的水分，監控及治療電解質不平衡的狀態，最重要的是要治療可能的誘發因素"},"answer":"C","manualChapter":"CH37"},{"id":126,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列有關睪丸扭轉（testicular torsion）的描述，何者為非？","options":{"A":"睪丸扭轉是因為自發性精索扭轉，阻礙了供應畢丸的血流，造成睪丸的缺血性疼痛","B":"通常發生於年輕男性，尤其以青春期男孩最多。睪丸扭轉的病患主訴為單側睪丸陰囊會痛","C":"與急性副睪炎相同，畢丸扭轉的疼痛通常是突發性的劇痛，外觀也會有明顯的紅腫現象","D":"送醫途中可以使用冰塊冰敷患側以減輕疼痛"},"answer":"C","manualChapter":"CH41"},{"id":127,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列呼吸型態的描述，何者代表呼吸衰竭的徵候？","options":{"A":"逆理性呼吸（paradoxical respiration）","B":"噘嘴氣式呼吸（obstructive breathing）","C":"庫斯毛耳氏呼吸（Kussmaul respiration）","D":"陳施氏呼吸（Cheyne-Stokes respiration）"},"answer":"A","manualChapter":"呼吸型態(含肺音)"},{"id":128,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有關急性下壁心肌梗塞合併右心室心肌梗塞之敘述，何者為非?","options":{"A":"常會出現血壓降低情形","B":"病患血壓降低（70/40 mmHg）合併雙側肺部濕囉音（moist rales），給予生理食鹽水可改善病情","C":"右側心電圖的胸前導程V4呈現ST節段上升Imm即可診斷","D":"避免使用會降低前負荷（Preload）的藥物如Morphine以及NTG"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":129,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於病史詢問的技巧，下列敘述何者為非？","options":{"A":"引導性問句有助於快速釐清病患症狀，是高級救護技術員常用的詢問技巧","B":"適時的點頭或出聲如「嗯」，是屬於病史詢問中「促進（facilitation）」的技巧","C":"重覆病患的最後一句話，可以鼓勵病患繼續陳述自己的症狀，是屬於病史詢問中「反射（reflection）」的技巧","D":"在澄清病患症狀時，應該使用病患可以理解的語言，並且儘量問可以依程度量化的問題"},"answer":"A","manualChapter":"CH19"},{"id":130,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有關典型心電圖之描述：下列何者為是？","options":{"A":"QRS複合波代表心房去極化","B":"PR間距代表動作電位由竇房結傳到房室結的時間","C":"ST間段代表心房去極化完成，再極化即將開始","D":"T波代表心室去極化完成"},"answer":"B","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":131,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"65歲男性，因胸痛而被診斷有急性心肌梗塞，準備要給予纖維蛋白溶解治療時，心電圖監視器呈現寬而規則QRS，心跳每分鐘180下，病患抱怨心悸及胸痛加劇，下列處置何者為是？","options":{"A":"立刻開始執行心肺復甦術，等電擊器到達後再給予去顫（defibrillation）","B":"手握拳，實施胸前重擊","C":"靜脈注射Amiodarone 150 mg後，再開始同步電擊100焦耳","D":"给病人鎮靜止痛後，馬上同步電擊100焦耳"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":133,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列呼吸道急症與其主要造成原因的配對，何者為非？","options":{"A":"會厭炎-通氣","B":"肌肉萎縮-通氣","C":"一氧化碳中毒-灌流","D":"肺栓塞-灌流"},"answer":"C","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":134,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"一名30歲男性病患被路人發現倒臥橋邊，經高級教護技術員到達現場評估後發現摸得到微弱的頸動脈，心臟監視器呈現下列心律，何者為是？","options":{"A":"Torsades de pointes","B":"Ventricular fibrillation","C":"Ventricular tachycardia","D":"Atrial fibrillation"},"answer":"A","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/134.png"},{"id":137,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"對於白血球分類之功能敘述，下列何者為非？","options":{"A":"嗜中性白血球（Neutrophil）-對抗細菌感染","B":"嗜酸性白血球（Eosinophils）-對抗寄生蟲感染，過敏反應","C":"嗜鹼性白血球（Basophils）-對抗病毒","D":"單核球（Monocytes）-對抗無核菌"},"answer":"C","manualChapter":"CH12"},{"id":139,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"一位25歲約60公斤的男性自火災現場被救出，意識模糊，聲音沙啞，全身多處灼傷，前額頭髮，眉毛及鼻毛均已燒焦，血壓100/65 mmHg，心跳120 / min，血氧濃度85％，身體燒燙傷面積為1度10％，2度30％，3度20％，請問下列處置何者為非？","options":{"A":"给予一般型氧氣面單，維持血氧濃度在94％以上即可","B":"問清楚火災現場環境，因為燒傷除了吸入性傷害及一氧化碳中毒外，仍要小心其他化學物質的傷害","C":"檢查身體是否有合併其他傷害","D":"按照Parkland formula，前8小時的輸液量要給予6000ml的乳酸林格氏液Lactated Ringer"},"answer":"A","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":140,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"二十歲男性騎摩托車發生車禍，沒有戴安全帽，送到急診室。經理學檢查懷疑有顱底骨折。請問下列何者的理學檢查發現與可能骨折的部位不相符？","options":{"A":"熊貓眼（Raccoon eye）懷疑有前顱窩之骨折）","B":"耳漏（otorrhea）懷疑有中顱窩之骨折","C":"鼻漏（thinorrhea）懷疑有前顱窩之骨折","D":"巴氏微候（Battle's sign）懷疑有岩樣骨骨折，中顱窩骨折"},"answer":"D","manualChapter":"創傷"},{"id":141,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有關失血量與生理變化的評估，下列何者為非？","options":{"A":"失血量超過50％者，將失去脈搏","B":"失血量30-40％者，意識混亂","C":"失血量高達30％者，血壓可能仍為正常","D":"失血量15-30％者，心率不變"},"answer":"D","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":143,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列四位50歲男性傷病患皆為血壓80 / 40mmHg，心跳120下/分鐘。但你不應該給予哪一位傷病患快速大量輸液？","options":{"A":"汽車駕駛車禍撞在方向盤上，右側呼吸音滅弱，頸靜脈怒張","B":"意識不清血糖機檢測呈現[High]（過高），呼吸音有鼾音（thonchi）","C":"捷運站手扶梯跌倒，右手腕腫脹變形，端坐呼吸冒冷汗，頸靜脈怒張","D":"蜂螫十分鐘後突然變得躁動不安，呼吸音有喘鳴音（stridor）"},"answer":"C","manualChapter":"combine"},{"id":145,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"張力性氣胸傷惠到院前進行針刺減壓的條件，不包括下列哪一項？","options":{"A":"傷患深度昏迷GCS 3分","B":"嚴重的呼吸窘迫徵象","C":"惠側呼吸音聽不到","D":"傷患收縮壓＜90 mmHg"},"answer":"A","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":146,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"當你到達汽車車禍現場進行救護，發現駕駛已經於現場死亡，此刻你需要處理另一位坐於右前座年紀約三十歲的男性病患，病患當時仍有生命跡象但意識模糊，此時病患生命徵象為：血壓68/42毫米汞柱，呼吸每分鐘38下，脈搏每分鐘132下，指端血氧濃度無法測量到。理學檢查發現病患結膜蒼白，頸靜脈塌陷且氣管沒有明顯偏移，胸部外觀於左下胸壁有明顯撞擊瘀青凹陷，肺部聽診發現左肺部呼吸音比較小聲，兩側叩診發現左側呈現實音，心臟聽診顯示心搏過速但心音清楚，左上腹部有輕微壓痛，下肢左大腿腫脹變形。此時這位病患最不可能發生下列何種情況？","options":{"A":"左胸張力性氣胸","B":"主動脈撕裂出血","C":"左胸肋骨骨折合併血胸","D":"脾臟撕裂合併左側橫隔膜破裂"},"answer":"B","manualChapter":"創傷"},{"id":148,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"你接獲中心通報於火車站處有一孕婦於候車時突然下腹痛，你到達現場後初步外觀評估，此孕婦隆起腹部上緣約在肚臍附近，請問下列何者為非？","options":{"A":"懷孕約十二周","B":"無法聽到胎兒心跳","C":"須左側躺送醫","D":"若陰道有大量滲液，且PH = 7.5應懷疑羊水破裂"},"answer":"A","manualChapter":"CH49"},{"id":150,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列有關成人與小孩呼吸道解剖構造不同的地方，何者為非？","options":{"A":"小孩喉部軟骨較成人軟","B":"小孩最狹窄處為聲帶，而成人則在聲帶之下環形軟骨環","C":"小孩舌部相對較大","D":"成人的會厭較小孩平而有彈性"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":151,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"根據NEXUS原則，下列何者不是屬於低度可能的頸椎受傷傷患","options":{"A":"頸部後中線沒有明顯的壓痛的傷患","B":"遭機車撞擊致右小腿開放性骨折的行人","C":"走路跌倒後四肢沒有發麻或乏力的病患","D":"意識完全清楚的傷患"},"answer":"B","manualChapter":"CH25"},{"id":152,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"30歲的男性被發現在浴室中陷入昏述，你和伙伴（都是合格的高級救護技術員）到達現場後發現士官長倒臥在寢室中的浴室，現場有濃重的農藥惡臭，牆角有兩個被撕掉標籤的空瓶，經初評發現病人完全昏迷（對痛沒有反應），口鼻分泌物大量增加，口吐白沫，呼吸每分鐘6下，頸動脈摸的到（每分鐘68下），四肢癱瘓，全身皮膚蒼白濕冷，血糖值為218mg / dL，距離急救責任醫院約45分鐘車程；下列敘述何者為非？","options":{"A":"高級救護技術員在這種情況下須特別注意自我防護，以免吸入過量農藥而造成中毒","B":"需要立即建立進階呼吸道以確保呼吸道暢通，並在病人呼吸停止時給予強迫給氧","C":"病人的瞳孔是針狀瞳，可以線上醫療指導注射atropine解毒","D":"此種農藥中毒並無特別的解毒劑"},"answer":"D","manualChapter":"非創傷"},{"id":153,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於EMTP使用聽診器進行聽診的說明，正確的是？","options":{"A":"聽診的原理，是利用空氣或液體的流動所發出的聲響判斷身體部位哪裏有異常","B":"雙面聽診器的膜面，是為了收集較低頻率的聲音，所以使用膜面聽診時應輕放在皮膚表面即可","C":"若是EMTP聽診時發現病患有哮喘音（wheezes），就代表病患的呼吸窘迫一定是氣喘或肺氣腫所引起","D":"聽診在到院前環境中很難執行，故聽診檢查並非EMTP訓練及理學檢查的重點"},"answer":"A","manualChapter":"CH20"},{"id":156,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"年輕孕婦懷孕40週突然感意識不清，119到現場發現她沒有脈搏，AED顯示為心室纖維震顫。此時急救的處置與一般ACLS略有不同，下列作法何者為是？","options":{"A":"Amiodarone在孕婦屬於C級用藥會導致時胎，禁止使用於孕婦","B":"若有需要插管，應該選用口徑較大的氣管內管（例如7.5＃或8＃）","C":"依照AHA最新指導原則，應該要左側躺比子宮左推手勢適合孕婦","D":"為了胎兒預後，若母親心跳停止，應該在心跳停止五分鐘內產出胎兒"},"answer":"D","manualChapter":"CH49"},{"id":157,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於急產後新生兒之處置，下列何者為非？","options":{"A":"新生兒出生後必須執行擦乾-擺位-抽吸-刺激四項處置","B":"新生兒呼吸約每分鐘40-60下，若有呼吸衰竭，應盡早給予正壓給氧","C":"檢查臍動脈脈搏，若是小於每分鐘100下即需正壓給氧，小於每分鐘60下即需CPR","D":"可以搓揉新生兒背部來刺激呼吸，危急時可以倒吊新生兒並擊打臀部的方式來刺激呼吸"},"answer":"D","matchedChapters":["CH48"],"manualChapter":"CH48"},{"id":158,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"小兒呼吸衰竭，插呼吸管時，其氣管內管的大小號碼選擇為多少？","options":{"A":"Age（Y）/ 4 +4","B":"[Age（Y）+4] / 4","C":"Age（Y）/ 2 +4","D":"[Age（Y）+ 4] / 2"},"answer":"A","manualChapter":"CH48"},{"id":159,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"你在EMTP醫院實習時，看見醫師幫某位腹痛的年輕人，進行如右圖的理學檢查。請問關於該檢查之敘述，何者正確？","options":{"A":"該檢查名為「閉孔肌徵候」","B":"陽性反應為引起同側劇烈腰痛","C":"陽性反應代表可能有後腹腔發炎或後腹腔膿瘍","D":"陰性反應即可排除盲腸炎之可能性"},"answer":"C","manualChapter":"CH20","matchedChapters":["NeedImage"],"image":"題庫圖片/159.png","explanation":"此為腰大肌徵候(psoas Sign)測試方式，其臨床意義為腰大肌本身病變，或其附近之後腹腔器官發炎產生次發性刺激；代表性疾病包含闌尾炎、腰大肌膿瘍、後腹腔膿瘍"},{"id":160,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"一位六歲的孩童被一輛汽車撞傷之後，意識警醒，組織灌流正常，但是有呼吸窘迫的現象，他的頸椎已經被固定並已經使用100％的氧氣面罩，呼吸速率為60次/每分鐘，血壓為60mmHg，右側胸部呼吸音減弱，氣管向左偏移，此時最合適的處置是：","options":{"A":"立即給予氣管內插管","B":"等待胸部X光的檢查報告","C":"立即給予氣管內插管並於右側胸部放置胸管","D":"先於右側胸部施行針頭減壓，再於右側胸部放置胸管"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":161,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有位兩歲半大，意識清醒女童，發燒39℃，燥動不安，皮膚有出血性紫斑，四肢冰冷並有酸血症的現象，心跳速率為148下/分，呼吸速率為38下/分，血壓為80 / 56mmHg，酸鹼度為7.25，這位女童最有可能之診斷為：","options":{"A":"紅班性狼瘡","B":"腦膜炎雙球菌敗血症","C":"過敏性紫斑症","D":"藥物中毒"},"answer":"B","manualChapter":"CH42"},{"id":162,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"成人骨折部位和可能有的出血量之關係，下列何者為非？","options":{"A":"脛，腓骨：500 mL","B":"肱骨：750 mL","C":"股骨：1000 mL","D":"骨盆：1500-3000 mL"},"answer":"B","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":163,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於事故指揮系統中的發言官（Public Information Offcer）職掌，下列何者為是？","options":{"A":"批准新聞發佈","B":"作為事故應變的對口聯絡人，和相關機構交流資訊","C":"定時舉行記者會","D":"評估事故的安全環境與危害物質的狀況，依狀況擬定防護措施"},"answer":"C","manualChapter":"CH52"},{"id":164,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"某炸彈爆炸案現場發現疑似未爆彈，現場教護指揮官決定跟國軍請求炸彈拆除小組前往處理，該小組成員均有炸彈拆除之處理能力，請問此小組編入現場事故指揮系統（Incident Command System）ICS後可歸類於執行部門的何種單位？","options":{"A":"此小組屬於任務編組（Task Force）","B":"此小組屬於特勤小組（Strike Team）","C":"此小組屬於單一資源（Single Resource）","D":"此小組屬於臨時編組（Temporary Unit）"},"answer":"B","manualChapter":"CH52"},{"id":165,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"傷口的凝血機轉包含三大步驟：甲，纖維蛋白形成；乙，凝血因子串聯反應；丙：血小板凝集活化。請問發生時序依序是：","options":{"A":"乙→丙→甲","B":"丙→乙→甲","C":"甲→乙→丙","D":"乙→甲→丙"},"answer":"B","manualChapter":"CH39"},{"id":166,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於事故指揮系統的核心價值，下列敘述何者為是？","options":{"A":"共通詞彙（Common Terminology）：盡量使用當地方言溝通以避免誤解","B":"統一指揮（Unity of Command）：不同性質的機構進行合作，命令由統一的指揮中心發出","C":"管理範疇（Span of Command）：意思是指同一時間同時進行的任務，最好不要超過5個","D":"指揮（Command）：事故一開始就必須建立明確的指揮功能，指揮權可以經由書面或口頭轉移給更適任者"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":168,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於危險物質洩漏現場之救護，下列敘述何者為是？","options":{"A":"傷患於現場除污後，上救護車應以被單包裹全身，頭髮也必須包覆，擔架推床也須以塑膠袋包裹，盡量避免污染車廂","B":"若現場任何一位工作人員感到不適，應立刻休息並補上另一人員，以免教護工作被延遲","C":"在除污走廊進行除污之工作人員，至少需穿戴D級（級工作服）或以上之防護衣，抗化膠鞋與防毒面罩","D":"可能遭受輻射物質污染之傷口，需以生理食鹽水纱布反覆擦拭以確實除污"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":169,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"危害物質災難事件如果已經被限制在一定範圍內，事故現場可以劃分出污染區（或稱為熱區、紅區），控制區（或稱為暖區、黃區）及安全區（或稱為冷區，綠區）三個區域，稱為層區管制。關於層區管制的觀念，下列敘述何者為非？","options":{"A":"事故周邊直接或間接（如受污染之傷患及器材）受到危害物質影響之處，應劃定為熱區","B":"安全區在事件開始時即需建立，將支援人員器材集結於此，並設定由下風高處做為暖區及熱區的出入位置","C":"黃區為介於污染區及安全區之間的緩衝區域，作為除污及病人緊急醫療處理之處","D":"除污走廊應該位於暖區"},"answer":"B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":170,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於輻災事故的應變觀念，下列敘述何者為非？","options":{"A":"輻射會影響傷口癒合，所以輻射汙染病患的傷口應該儘可能延遲二十四小時後再進行縫合","B":"相較於化學物質事故，輻射事故通常不會造成受污染傷者立即性的危害，因此病患除污的急迫性較低","C":"在輻災事故，如果病患的衣物可能沾有輻射物質粉末，應該在移除病患衣物時，先將衣物潤濕，以防止輻射物質擴散至空氣中","D":"輻射污染可以用輻射偵檢器檢測出，通常可以精確地定出污染範圍"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":171,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於大型活動（Mass Gathering）的觀念，下列敘述何者為非？","options":{"A":"一般而言，大型活動是指群眾聚集人數超過1000人的活動","B":"在1999年的英倫醫學雜誌建議，大型活動每五百人人需有一位急救人員，每一千人需有一輛有高級救護技術員的救護車，每一萬人則需一位急診醫師","C":"無論輕症或重症，每次醫療照護需確實填寫一份醫療教護紀錄單，醫療人員也需要簽名","D":"現場應盡可能維持有教護車待命，若非病患的生命或肢體受威脅，儘量不要派用最後一輛救護車作轉送病患之用"},"answer":"B","manualChapter":"CH54"},{"id":173,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"頭部外傷導致意識模糊之病患，下列檢查發現中，何者與顱底骨折最沒有相關？","options":{"A":"眼眶周圍瘀青","B":"外耳撕裂傷","C":"耳後瘀青","D":"腦脊髓液由耳道或鼻孔留出"},"answer":"B","manualChapter":"CH27"},{"id":175,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下藥物中毒皆會引起瞳孔縮小，何者為非?","options":{"A":"鴉片類","B":"有機磷","C":"安非他命","D":"乙醯膽鹼"},"answer":"C","manualChapter":"CH50"},{"id":176,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"在大量傷病患事故，依據START（Simple Triage And Rapid Treatment，簡易分類並迅速治療）檢傷法，下列判定何者為是？","options":{"A":"二十歲男性，癱軟坐在地上，爬不起來，呼吸每分鐘20次，橈動脈脈搏很強，可以和工作人員清楚對談，應該判定為報傷","B":"十歲孩童，呼吸每分鐘42次，微血管充填時間3秒，對工作人員的問話毫不理會，跑來跑去哭喊著找媽媽，應該判定為紅色","C":"五十歲女性，左右小腿均骨折，呼吸每分鐘20次，微血管充填時間1秒，可以和工作人員清楚對談，應該判定為中傷","D":"一百歲老公公，左大腿骨折變形，呼吸每分鐘8次，微血管充填時間5秒，意識不清，應該判定為黑色"},"answer":"C","manualChapter":"CH52"},{"id":177,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"車禍現場一位背部受到撞擊的傷患表示「肚臍以下都麻痺了！」請問可能受傷的脊神經高度是？","options":{"A":"頸神經第6節","B":"胸神經第4節","C":"胸神經第10節","D":"腰神經第3節"},"answer":"C","manualChapter":"CH12"},{"id":178,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"藥物動力學中，「藥物與血液中蛋白質結合並進出微血管至各個器官」的過程叫作？","options":{"A":"吸收","B":"分佈","C":"代謝","D":"排泄"},"answer":"B","manualChapter":"CH16"},{"id":179,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"以下關於中暑（heatstroke）敘述，何者正確？","options":{"A":"中暑的定義是中心體溫高於40.5℃，此時體表必然無汗","B":"只要待在室內，不在太陽下作劇烈運動，就可以避免中署","C":"大量輸液（點滴）可以有效地降低中暑病患的體溫，改善存活率","D":"利用濕毛巾覆蓋在病患身上，以風扇吹拂散熱，可以有效降低中心體溫"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":180,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"胎兒出生後1分鐘會哭，呼吸慢而不規則，心率每分鐘80下，肌肉張力有一些曲屈，軀幹粉紅色，四肢藍色，其Apgar Score為幾分？","options":{"A":"4","B":"5","C":"6","D":"7"},"answer":"C","manualChapter":"CH49"},{"id":181,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列有關膽結石，膽囊炎與膽管炎的描述，何者為非？","options":{"A":"急性膽囊炎是指膽囊發炎，好發於30〜50歲的肥胖女性，然而年紀越大，男女間的比例就相差不多","B":"膽結石的症狀常見為飯後一到兩個小時後（尤其是晚上），突發性的噁心，嘔吐，右上腹痛，同時可能會伴隨著右邊肩胛骨的轉移痛","C":"膽管炎典型臨床症狀稱為夏柯式三合症（Charcot's triad）：發燒，黃疸與右上腹痛。","D":"因為膽結石的症狀常為飯後所引起，所以到院前的處置可以放置鼻胃管以減輕胃內壓カ（由當地醫療指導授權）"},"answer":"D","manualChapter":"CH38"},{"id":182,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列有關血友病（hemophilia）的描述，何者為非？","options":{"A":"缺乏第八因子的稱為A型血友病","B":"缺乏第九因子的則稱為B型血友病","C":"血友病是建立靜脈路徑的禁忌症，即使病患的狀況符合需建立靜脈路徑的條件，也不應該在到院前建立靜脈路徑","D":"血友病患受傷時，中樞神經出血是造成這類病患死亡的最主要原因"},"answer":"C","manualChapter":"CH39"},{"id":184,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於急性肺栓塞的敘述，何者為非？","options":{"A":"肺栓塞的血栓可能來自深部靜脈栓塞","B":"肺栓塞的血栓可能造成急性腦中風","C":"病患常見的臨床症狀是呼吸窘迫與休克","D":"心電圖可能出現竇性心搏過速，right bundle branch block或SIQ3T3，型態"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":185,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"關於腦中風病患急性期的血壓控制，何者為非？","options":{"A":"對缺血性中風病患，血壓應控制在正常或患病前的範圍內以免讓症狀加重","B":"除非有合併主動脈剝離，心衰竭等，否則缺血性中風病患，在收縮壓超過220mmHg，或舒張壓超過120mmHg時方需要處理","C":"出血性中風病患，因考慮到其出血範圍會增加及再出血的可能性，血壓控制應較缺血性中風積極","D":"考慮要接受血栓溶解劑的病患其血壓應控制在收縮壓185mmHg，舒張壓11OmmHg以下"},"answer":"A","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":186,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有關於胸部鈍傷方面，下列敘述何者為非？","options":{"A":"合併第一，二肋骨骨折時須高度懷疑主動脈的損傷","B":"張力性氣胸的病患不一定出現頸靜脈怒張","C":"合併第十到十二肋骨骨折須懷疑肝臟或脾臟的損傷","D":"目前在台灣，若EMTP在院外發現懷疑張力性氣胸的傷患，可直接進行針刺減壓"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":187,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"一名八歲男童，從樹上約一公尺摔下，意識清楚，左手肘變形，下列敘述何者為非？","options":{"A":"在固定患肢前，必須要評估遠端的感覺運動功能及脈博","B":"若是患者大拇指和食指在掌指關節處（metacarpophalangeal joint）無法屈曲（flexion），代表尺神經（ulnar nerve）受傷","C":"若是患者手腕無法過度伸展（hyperextension），代表橈神經（radial nerve）受傷","D":"注意傷患可能合併胸腹部鈍傷，可能胸部X光正常，但仍有肺部挫傷"},"answer":"B","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":188,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"50歲男性小客車駕駛，因酒醉駕車高速撞上前方停紅燈車輛，EMT表示該駕駛身上繁有安全帶，且安全氣囊己爆開；到院時身上無明顯外傷，全身酒味，意識混亂，呼吸正常，血壓110 / 80mmHg，心跳120 / min，血氧濃度98％，請問下列敘述何者為是？","options":{"A":"因繫有安全帶，且無頭部外傷，故可排除頸椎傷害","B":"超音波未見腹腔內出血，即可排除小腸出血的可能","C":"為了排除胰臟受傷，可以利用超音波有效判斷","D":"因受酒精影響，傷者腹部觸診無壓痛時，仍不能排除腹腔臟器受傷的可能"},"answer":"D","manualChapter":"創傷"},{"id":189,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"20歲女性，燒炭自殺不慎引起火警。EMT從火場移出後傷患意識不清，對聲音有反應，無鼻毛燒焦，全身無燒燙傷痕跡，無明顯外傷。血壓120/70，脈搏100，呼吸20，呼吸平順無雜音。下列處置何者為是？","options":{"A":"立即建立呼吸道，包括ロ咽，鼻咽甚至於LMA","B":"可給予非再吸入型氧氣面罩並調整流速至15公升/分，以提供高濃度氧氣","C":"立即以鼻翼管給予氧氣治療以提高血氧濃度","D":"應以血氧監視器評估。若無缺氧現象，可以不用氧氣治療"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":190,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"輻射災害時的檢傷一般分五級，其第四級臨床上以哪一種症狀為主？","options":{"A":"胃腸","B":"神經","C":"呼吸","D":"皮膚"},"answer":"A","manualChapter":"CH53"},{"id":191,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列哪項骨骼肌肉外傷會有潛在危及生命的可能？","options":{"A":"髖關節脫白","B":"脛骨與腓骨非開放性骨折","C":"不穩定型骨盆骨折","D":"膝關節脫白合併末稍肢體麻木"},"answer":"C","manualChapter":"CH30"},{"id":192,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"有關危害物質的防護衣，何者正確？","options":{"A":"沒有防護衣可以防護迦瑪射線的穿透，輻傷的濾毒罐是以過濾輻射塵為主","B":"有電池動力的活性炭濾毒罐是屬於A級或是B級的防護，而沒有動力的是C級","C":"防疫所穿用的俗稱白兔裝的防護衣，配合N95口罩，在化災時可以達到C級的防護","D":"有攜帶空氣瓶的是A級防護衣，其他各級都是使用濾毒罐"},"answer":"A","manualChapter":"CH53"},{"id":194,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下列有關海洋生物螫刺傷的敘述，下列何者為非？","options":{"A":"被水母螫傷時可以用海水沖洗以降低刺痛感","B":"被石頭魚（石狗公）的鰭刺傷可以浸泡熱水來減輕疼痛感","C":"海膽的刺裡有刺囊細胞可以分泌毒液造成中毒","D":"水母的觸手離開水母的身體可以保持活性達數月之久，仍會造成中毒"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":197,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"在事故應變中，有幾個應變地點相當重要，必須及早建立。以下關於事故指揮所（Incident Command Post，ICP）的觀念，何者為非？","options":{"A":"事故指揮所最好可以位於事故現場附近，但又必須確保在危險區域之外","B":"隨著事故進展，事故指揮所可能必須變動位置","C":"尚未指派任務的工作人員或物資，必須先在事故指揮所裡集結，等後派遣","D":"無論事故的型態或規模，每個事故都必須建立某種形式的事故指揮所"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":198,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"在事故應變時，「危機溝通」相當重要。與民眾或是新聞媒體溝通時，下列作法何者為非？","options":{"A":"發言時不應該偏袒特定的媒體，但如果有媒體特別想要了解某些專業的問題，可以轉介给適合的專家","B":"對大眾發言時應儘量使用專業術語，以提升應變工作人員的專業形象","C":"發言時，盡可能不要接受或引用未經證實的消息","D":"發言官必須監控新聞媒體或群眾之間是否出現謠言，如果謠言可能造成群眾嚴重的負面效應，甚至影響到事故應變進行，發言官應及時向事故指揮官報告，並在授權之下儘速澄清"},"answer":"B","manualChapter":"CH52"},{"id":199,"source":"108 EMT-P 高級救護技術員教育訓練.doc","question":"下圖危害物質標示，為何種物質？","options":{"A":"易燃液體","B":"氧化性物質","C":"腐蝕性物質","D":"禁水性物質"},"answer":"C","manualChapter":"CH53","matchedChapters":["NeedImage"],"image":"題庫圖片/199.png"},{"id":201,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"關於高級救護技術員的敘述，以下何者為是？","options":{"A":"高級救護技術員就是高級的中級救護技術員","B":"高級救護技術員要能夠獨立完成高級救命術（Advanced Life Support）","C":"高級救護技術員執行高級救命術無法改善呼吸窘迫病患的出院存活率","D":"高級救護技術員沒有接受繼續教育的需要"},"answer":"B","manualChapter":"CH03"},{"id":202,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關2001年，美國國家醫學研究院（IOM）訂出醫療照護品質的六大面向和目標，何者為非","options":{"A":"病患為中心（Patient-centeredness）","B":"有效（Effective ness）","C":"效率（Efficiency）","D":"預後（Prognosis）"},"answer":"D","manualChapter":"CH09"},{"id":203,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"關於小兒氣管內插管與氣管內管選擇，下列何者為是？","options":{"A":"因為嬰兒骨頭脆弱，所以插管時挑起來不可將葉片前端直接壓在會厭軟骨上","B":"可能為嬰兒痺死症的初生嬰兒應選擇3.5＃（mm）無氣囊","C":"太小的嬰兒插管喉頭鏡不宜使用直式葉片","D":"4歲女童疑似家暴，無呼吸心跳，選擇5.0＃（mm）有氣囊"},"answer":"B","manualChapter":"CH48"},{"id":204,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"血紅素（紅血球）將氧氣運送至週邊組織後，會將它釋放至組織，而釋放過程是依「血紅素與氧氣」的親和力決定。以下何種情況，氧合血紅素飽合度曲線往左移？","options":{"A":"溫度下降","B":"PC02上升","C":"pH下降","D":"[H +]上升"},"answer":"A","manualChapter":"CH12"},{"id":205,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關呼氣的機轉，下列何者為是？","options":{"A":"由呼吸肌收縮用力造成","B":"因胸內壓下降，肺臟被拉大，肺泡內壓低於大氣壓而產生呼氣","C":"胸部及肺部擴張及縮小的容易程度稱之為順應性或柔軟度","D":"若因疾病造成順應性增加，呼氣時就會變得吃力，如氣喘及肺氣腫"},"answer":"C","manualChapter":"CH14"},{"id":206,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關呼吸病理生理學，下列敘述何者為是？","options":{"A":"肺氣腫的患者因其其缺氧，應給予高濃度氧氣治療為佳","B":"急救項目中首要目標就是暢通呼吸道","C":"意識清醒者呼吸道阻塞的原因多是由於自身舌頭失去張力所致","D":"意識不清患者呼吸道阻塞的原因大多是因分泌物過多造成阻塞"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":207,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關抽吸的敘述，下列敘述何者為非？","options":{"A":"抽吸管依型式可分為軟式管及硬式管","B":"固定式抽吸裝置應可提供超過300 mmHg的吸力，以及40 L / min的流量","C":"抽吸時盡量以無菌方式操作，先將管子放到入口，再邊旋轉邊向內插入抽吸管","D":"抽吸時同時做一壓一放的動作，避免做連續性的抽吸動作，以免吸住呼吸道管壁造成傷害"},"answer":"C","matchedChapters":["CH15"],"manualChapter":"CH15"},{"id":208,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"成年的腦可分為六個區域，分別為大腦（cerebrum），小腦（cerebellum），問腦（diencephalon），中腦（midbrain），橋腦（pons），和延髓（medulla oblongata）。請問下列敘述，何者為非？","options":{"A":"中腦：負責處理視覺和聽覺訊息並產生隨意的運動反應，例如瞳孔的光反射","B":"橋腦：連結小腦於腦幹上，含有涉及身體運動和內臟運動控制的神經核，例如顏面神經","C":"延髓：將腦連結到脊髓，它是人體的生命中樞，包括控制心搏速率，心收縮力及循環血流量的心臟血管中樞，呼吸節律中樞，吞嚥中樞，嘔吐中樞等","D":"中腦、橋腦和延髓，此三區可合稱為腦幹"},"answer":"A","manualChapter":"CH12"},{"id":209,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關緊急救護藥理學下列的名詞解釋，何者為非？","options":{"A":"首渡效應：在藥物到達一般循環之前，先由肝門靜脈經過肝臟而發生的最初生物轉化作用","B":"增強：因為同時給予兩種藥物，而使其中一種藥物增加了另一種藥物效果的增強反應","C":"治療作用（therapeutic action）：藥物無法預期的效果","D":"治療指數（therapeutic index）：某個藥物的安全性指標"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":210,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"在照護意識不清之外傷出血性休克傷患的時候，以下描述，何者為非？","options":{"A":"嚴重意識不清可能會因為舌頭後倒產生呼吸道阻塞，所以應該評估是否給予輔助呼吸道","B":"靜脈導管建立之後，應盡快給予腎上腺素推注，以提升病人血壓","C":"留置導管部位應視為傷口，宜避免暴露在髒污或灰塵處","D":"靜脈輸液應選用生理食鹽水或林格氏液"},"answer":"B","manualChapter":"創傷"},{"id":212,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"對於甦醒球的使用（亦稱「袋-辦-面罩」BVM；bag-valve-mask）下列敘述何者為非？","options":{"A":"以單人操作甦醒球可達到的通氣（ventilation）效果，比口對口人工呼吸的效果來得好","B":"每次擠壓大約1秒鐘即可","C":"急救時成年人適當的潮氣容積大約為每公斤6〜7毫升","D":"甦醒球的容量大約1600ml，因此單手擠壓即可"},"answer":"A","matchedChapters":["CH15"],"manualChapter":"CH15"},{"id":213,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"為了讓胸腔內產生負壓，使空氣吸入肺部，橫隔膜會收縮向解剖學位置的哪一個方向移動，來擴大胸腔的體積？","options":{"A":"向上移動","B":"向下移動","C":"向外移動","D":"向內移動"},"answer":"B","manualChapter":"CH12"},{"id":215,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"關於病史詢問的技巧，下列敘述何者偽非？","options":{"A":"引導性問句有助於快速釐清病患症狀。這是高級救護技術員常用的詢問技巧","B":"適時的點頭或出聲如「嗯」。這是屬於病史詢問中「促進（facilitation）」的技巧","C":"重覆病患的最後一句話，可以鼓勵病患繼續陳述自己的症狀。這是屬於病史詢問中「反射（reflection）」的技巧","D":"在澄清病患症狀時，應該使用病患可以理解的語言，並且儘量問可以依程度量化的問題"},"answer":"A","manualChapter":"CH19"},{"id":218,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關昏迷指數（Glasgow Coma Scale，GCS），下列何者為非？","options":{"A":"昏迷指數針對病患的睜眼，運動以及說話三個方面來評估計分，加總後病患意識介於3分到15分，最低為3分，代表病患完全喪失意識，而最好的意識狀態為15分","B":"運動反應，對疼痛刺激肢體會回缩躲避為5分","C":"運動反應，對疼痛刺激產生肢體伸直反應為2分","D":"說話反應，發出不連貫而無意義的字句為3分"},"answer":"B","manualChapter":"CH20"},{"id":219,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"高中生無照駕車，沒有帶安全帽騎機車發生車禍，現在感到呼吸困雞胸部疼痛，視診明顯頸靜脈怒張，但氣管無偏移，胸部起伏，無明顯傷口但是有右側有瘀青，聽診發現右側呼吸音減弱，扣診為實音，觸診疑似有肋骨骨折，下列何者為最可能的疾病？","options":{"A":"大量血胸","B":"張力性氣胸","C":"連枷胸","D":"主動脈剝離"},"answer":"A","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":220,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"以下配對，何皆為非？","options":{"A":"主動脈剝離一突發性撕裂或刀割般的尖銳疼痛，偶爾合併前胸到後背的轉移痛","B":"急性心肌梗塞一急性左前胸壓迫或悶痛感，常合併下巴或左上肢的轉移痛","C":"自發性氣胸一急性單側胸痛，深呼吸時可減緩疼痛感","D":"輸尿管結石一急性單側腰痛，常合併後腰到鼠蹊部的轉移痛"},"answer":"C","manualChapter":"非創傷"},{"id":224,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列關於病史詢問的技巧，何者為是？","options":{"A":"因救護現場環境因素及時間有限，一般會用專一性的問句來迅速獲得臨床上最重要的病史訊息","B":"重複病惠的句尾幾個字會打斷病患的思路，而且會讓病患有不被尊重的感受，應盡可能避","C":"澄清（clarification）的目的在於對病患含糊的描述加以釐清。可依程度量化的問句當會誤導病患對於症狀的描述","D":"鼓勵病患描述病情的方式並不限於言語；適時的點頭，或是眼神接觸都可以達到順勢引導的效果"},"answer":"D","manualChapter":"CH19"},{"id":225,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列症狀何者是典型的蜘蛛網膜下腔出血？","options":{"A":"昨天咳嗽，流鼻水，喉嚨痛，今天整個頭劇痛，還高燒到39度","B":"一小時前頭劇痛，三個月前騎機車出車禍有撞到頭，期間一直沒不舒服","C":"一小時前忽然左側顯葉處搏動性劇痛，痛到噁心但沒吐，而且會怕光","D":"一小時前忽然整個頭痛欲裂，這輩子沒這麼痛過，痛到吐了兩次，頸部覺得僵硬怪的"},"answer":"D","manualChapter":"CH27"},{"id":227,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列有關高品質成人基本救命術的敘述，何者為是？","options":{"A":"在去顫電擊完成之後，要立即確認病患有無恢復脈搏","B":"持續壓胸，盡可能只在「檢查節律」及「去顫電擊」時中斷壓胸","C":"只要施救者不覺得累，胸部按壓可以不用換手避免中斷","D":"去顫電擊的目的是把電擊能量傳給心臟讓它重新跳動"},"answer":"B","manualChapter":"CH23","matchedChapters":["CH24"]},{"id":229,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"對於穩定規則窄QRS波頻脈，以下敘述何者為非？","options":{"A":"若發生於孕婦身上，因可能影響胎兒心律，因此不應使用Adenosine","B":"除了Adenosine之外，亦可選擇乙型腎上腺受體阻斷劑、毛地黃加以治療","C":"若使用鈣離子阻斷劑不必擔心引發有氣喘病史病患的氣喘，","D":"若藥物治療無效，可考慮電擊整流"},"answer":"A","manualChapter":"CH49"},{"id":230,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"對於有冠狀動脈性心臟病病史的急性胸痛病患，以下敘述何者為非？","options":{"A":"進行到院前12導程心電圖檢查有助於縮短ST波段上升型心肌梗塞進行心導管的時間","B":"對於典型胸痛且無相關禁忌症的病患，應給予Aspirin服用","C":"建議給予氧氣鼻管3L / min，以改善潛在的心臟缺氧狀況","D":"如果使用NTG，無論男女應先確認遍患有無服用Viagra這類磷酸二酯抑制劑藥物"},"answer":"C","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":231,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"關於過敏的描述，以下敘述何者為非？","options":{"A":"局部性的過敏反應並不會影響到全身，治療最有效的藥物是Diphenhydramine","B":"嚴重過敏病患休克的原因是因為呼吸道阻塞，水腫，最好的治療是給予氣管擴劑","C":"如果出現聲音沙啞舌頭水腫，喘鳴等，應評估是否要早期插管","D":"嚴重過敏最有效的治療藥物是腎上腺素"},"answer":"B","manualChapter":"CH16"},{"id":232,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列有關危及生命的成人呼吸急症的徵象，以下敘述何者為是？","options":{"A":"意識狀態改變以及嚴重發鉗","B":"胸骨上凹陷，肋間凹陷或使用呼吸輔助肌","C":"心跳過快，臉色蒼白，冒汗","D":"以上皆是"},"answer":"D","manualChapter":"CH35"},{"id":233,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列有關心電圖導程ST節段上升與冠狀動脈阻塞的配對，以下敘述何者為非？","options":{"A":"導程Ⅱ，Ⅲ，aVF代表下壁心肌梗塞：因右冠狀動脈阻塞所致","B":"導程V1，V2代表心室中隔心肌梗塞：因右前降支冠狀動脈阻塞所致","C":"導程V3，V4代表前壁心肌梗塞：因左前降支冠狀動脈阻塞所致","D":"導程V5，V6代表側壁心肌梗塞：因左迴旋枝冠狀動脈阻塞所致"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":235,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關糖尿病酮酸血症（Diabetic ketoacidosis，DKA）的敘述，下列何者為非？","options":{"A":"因為胰島素的缺乏，讓血液中的葡萄糖無法進入細胞中被利用","B":"所以細胞在尋找利用新能量的過程中產生酮酸進而造成身體酸中毒","C":"病患產生休克的原因和高血糖造成的利尿作用無關","D":"此類病患有時可以從病患的呼氣中聞到類似水果發酵的丙酮味"},"answer":"C","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":236,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"65歲男性病患因為意識昏迷，家屬發現後報案；指揮中心派遣高救隊到現場，現場患者意識昏迷對痛沒有反應，膚色蒼白濕冷，呼吸每分鐘6下，脈搏每分鐘24下，血壓50 /量不到mmHg，pulse oximeter：60％；病患過去病史為腎衰竭合併洗腎，但根據家屬表示，病患已經有半個月沒有接受血液透析治療，家屬也表示病患拒絕插管以及任何壓胸電擊等急教治療，只要給予藥物；下列敘述何者為是？（送醫時間30分鐘）","options":{"A":"病患不可能是高血鉀引起的腎衰竭病患的併發症","B":"可以線上醫療指導靜脈注射calcium及sodium bicarbonate來治療","C":"病患是腎衰竭患者，因此要絕對限水，不可以幫他打上點滴","D":"腎衰竭病患若是有接受血液透析治療，就絕對不可能有尿液的產生"},"answer":"B","manualChapter":"CH41"},{"id":238,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列關於腸胃道急症的敘述何者為是?","options":{"A":"食道或胃靜脈曲張是因為肝門靜脈高壓所引起的靜脈曲張，多導因於肝硬化或腫瘤，可引起厲害的出血","B":"急性憩室炎，俗稱急性盲腸炎，常因冀石塞住開口，或感染導致淋巴結腫大，引起發炎","C":"痔瘡是指肛門內外靜脈曲張不正常的膨大曲張，出血量都不多，不會造成貧血","D":"急性肝炎最常見的原因為細菌性的，其中又以B型肝炎在台灣最多"},"answer":"A","manualChapter":"CH38"},{"id":241,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"有關換氣過度症候群（Hyperventilation Syndrome），下列何者為非？","options":{"A":"異常深呼吸或急速呼吸","B":"導致二氧化碳過度流失","C":"造成呼吸性鹼中毒","D":"造成呼吸性酸中毒"},"answer":"D","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":242,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"此心律為何？","options":{"A":"Mobitz第一型二級房室結傳導阻斷","B":"Mobitz第二型二級房室結傳導阻斷","C":"三級房室結傳導阻斷","D":"一級房室結傳導阻斷"},"answer":"D","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/242.png"},{"id":244,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列關於呼吸道處置與給藥的敘述，何者正確？","options":{"A":"有顏面創傷，或疑顱底骨折的病患，最適合使用鼻咽呼吸道","B":"若患者頭或頸部受傷，應使用推顎法，避免移動頸部","C":"LMA（喉罩氣道）可以防止吸入性肺炎，是很好的氣管插管替代品","D":"當建立氣管內管後，非脂溶性的藥物皆可經由氣管內管給藥"},"answer":"B","manualChapter":"CH35"},{"id":246,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"關於懷孕婦女的急救，以下何者為非？","options":{"A":"應先急救母親，再考慮胎兒","B":"孕婦只要很小的失血量，就會出現血壓下降與週邊灌流不足（休克）的徵象","C":"若懷孕大於24週，孕婦儘可能保持左側躺的姿勢。右髖部墊高、長背板左傾15-30度，以減少子宮對主動脈，下腔靜脈的壓迫","D":"當母親心跳停止5分鐘內，剖腹產救出大於24-25週的胎兒，此時胎兒存活機率最高"},"answer":"B","manualChapter":"CH49"},{"id":247,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"對於休克描述，下列何者為非？","options":{"A":"只要收縮壓小於90 mmHg就是休克","B":"休克患者會有皮膚冰冷，心跳過速，冒冷汗，呼吸困難症狀","C":"休克主要是組織灌流不足，造成氧氣運送不能應付組織代謝所需","D":"可依rate，volume，pump（律水壓）的原則，對休克依序做初步處理"},"answer":"A","manualChapter":"CH26"},{"id":248,"source":"109年 - EMT-P 高級救護技術員教育訓練-1.doc","question":"下列有關血液的組成與功能，何者為非？","options":{"A":"成人的血液約佔體重的1/13","B":"血球組成中，最多的是血小板","C":"血漿中水約占了90％","D":"血漿中的白蛋白可維持血液與組織液間滲透壓的恆定性"},"answer":"B","manualChapter":"CH12"},{"id":251,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列哪個不是中心體溫？","options":{"A":"肛溫","B":"耳溫","C":"腋溫","D":"舌溫"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":252,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"黄色的鞏膜可見於哪種病人？","options":{"A":"腎衰竭","B":"脾腫大","C":"腦水腫","D":"膽道阻塞"},"answer":"D","manualChapter":"CH38","matchedChapters":["CH38"]},{"id":253,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列哪個是肺內連續異常肺音？","options":{"A":"Crackles","B":"Rhonchi","C":"Rales","D":"Stridor"},"answer":"B","manualChapter":"呼吸型態(含肺音)","matchedChapters":["CH20"]},{"id":254,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列敘述何者正確？","options":{"A":"毒蛇咬傷傷患，於送醫途中應每5分鐘進行一次繼續評估","B":"CRT是評估循環的重要指標之一且成人可信度較高","C":"關鍵思考步驟為：資料判斷一概念形成一應用原則一反應評估一事後回顧","D":"以上皆是"},"answer":"A","manualChapter":"CH50"},{"id":256,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"有關基本救命術，下列何者錯誤？","options":{"A":"當民眾發現有人突然倒地，沒有反應又沒有正常呼吸時就要開始急救","B":"施救者應避免幫病患過度換氣，如已放置進階呼吸道，則以每分鐘10〜12次進行通氣，此時通氣不需和胸部按壓同步，也不需為了通氣而停止按壓","C":"電擊貼片不可放在任何藥物貼片上","D":"以上皆正確"},"answer":"B","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":257,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"請問下列何者需送往創傷中心？","options":{"A":"車禍患者GCS14分","B":"車禍患者年紀45歲","C":"機車車禍，患者右手腕開放性骨折","D":"汽車車禍，患者於30分鐘後脫困"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":258,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"請問關於創傷嚴重度評估何者正確","options":{"A":"RTS指數是依據GCS，平均動脈壓及呼吸速率為變項","B":"RTS小於12分，即應視為嚴重創傷","C":"AIS將身體分為5個解剖區域，每個解剖區域由0-6分代表","D":"ISS分數越高，死亡率越高，凡ISS大於等於14分屬嚴重創傷"},"answer":"B","manualChapter":"CH25"},{"id":259,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"請問何者非為創傷致命三病徵？","options":{"A":"凝血病變","B":"低體溫","C":"低血容","D":"酸血症"},"answer":"C","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":260,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"有關一氧化碳血紅素半衰期，在一大氣氣壓100％氧氣約為多久？","options":{"A":"30分鐘","B":"60分鐘","C":"90分鐘","D":"120分鐘"},"answer":"C","manualChapter":"背誦題","matchedChapters":["背誦題"]},{"id":261,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"洛杉磯到院前腦中風評量表準確度可達？","options":{"A":"72％","B":"85％","C":"95％","D":"97％"},"answer":"D","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":262,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"有關中樞型暈眩會出現的症狀下列何者為錯誤？","options":{"A":"多方向眼震","B":"暈眩","C":"耳鳴","D":"語言不清"},"answer":"C","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":263,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列敘述何者正確？","options":{"A":"第一型糖尿病主要是因為胰島素分泌不足，通常好發於90歲以上及過胖的人","B":"第二型糖尿病通常是因為胰島素分泌不足或胰島素受體功能不佳，且大多和遭傳有關。","C":"糖尿病是一種慢性的系統性疾病，其併發症包括眼睛視力變差，甚至失明。","D":"DKA和HHNK / HHS皆會造成病人明顯脫水及電解質不平衡，且前者的血糖通常比後者高。"},"answer":"C","manualChapter":"CH37"},{"id":264,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列腹痛與相關位置對照，何者錯誤？","options":{"A":"膽囊炎常引起上腹或右上腹疼痛","B":"胰臟炎常引起左右上腹，或左下腹疼痛","C":"心肌缺氧或梗塞常引起上腹疼痛","D":"腹膜炎常引起全腹疼痛"},"answer":"B","manualChapter":"CH38"},{"id":265,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"依據白血球分類計數，下列白血球分類與功能配對，何者錯誤？","options":{"A":"嗜酸性白血球，對抗細菌","B":"嗜鹼性白血球，引發過敏反應","C":"單核球，對抗結核菌","D":"淋巴球，對抗病毒"},"answer":"A","manualChapter":"CH39"},{"id":266,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"天花的臨床表現，下列那項是錯誤?","options":{"A":"發燒","B":"頭痛","C":"臉上，粘膜長出同步發展的丘疹，水疱，膿皰性皮疹","D":"膿皰性皮疹部位軀幹多於四肢"},"answer":"D","explanation":"p1128 CH43 由於大量的病毒在口咽複製，出疹的第一個星期是最具傳染性的。潛伏期約7~17天(平均10~12天)，然後開始出現急性發燒、寒顫、頭痛和背痛等一些疲憊的前驅症狀，約持續2~3天。隨後爆發離心分佈的皮疹，在約8 天內以同步的方式，經過斑疹、丘疹、水皰和膿皰階段，後期階段出現臍狀凹陷。口腔的黏膜疹通常在皮疹前1或2天出現，皮疹通常在早期就會出現於手掌和腳底。","manualChapter":"CH43"},{"id":267,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列生物恐怖製劑之潛伏期，何者錯誤：","options":{"A":"吸入型炭疽病1-43（58）天","B":"天花7-17天","C":"肉毒桿菌中毒0.5-3天","D":"病毒性出血熱2-23天"},"answer":"D","manualChapter":"CH43"},{"id":268,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"大活動之緊急醫療救護之醫療需求方面，於1999年英倫醫學雜誌建議，下列何者錯誤?","options":{"A":"每千人需有1位急救人員","B":"每2千人需有1輛有高級救護技術員的救護車","C":"每3千人需有2輛有高級救護技術員的救護車","D":"每5千人需有1位急診醫師"},"answer":"C","manualChapter":"CH54"},{"id":269,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"對於腦部損傷何者錯誤？","options":{"A":"Cushing's triad 血壓高、脈壓寬、心跳慢、呼吸不規則，若要插管可選擇ketamine當鎮靜藥物","B":"腦內出血主要發生在額葉，顯葉","C":"CPP = MAP-ICP。正常CPP約70-80mmhg，ICP約10xmmhg","D":"若on endo PaCO2須維持在35〜40mmhg之間。"},"answer":"A","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":270,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"對於脊髓損傷何者正確？","options":{"A":"Central cord syndrome：四肢輕癱且上肢較下肢嚴重，屬完全脊髓損傷","B":"Anterior cord syndrome：侵及脊髓前側三分之二，本體覺喪失，痛溫覺保留","C":"Brown-Sequard syndrome：同側痛覺喪失，對側運動保留","D":"Autonomic hypereflexia syndrome：常見高位脊髓損傷，與交感興奮，腎上腺素大量釋放有關"},"answer":"D","manualChapter":"CH27"},{"id":272,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"甲男40歲與乙女至枕頭山郊遊，於登山途中遭遇蜂螫，EMT到達時乙女表示甲男過去病史有高血壓，心臟病，現場生命徵象如下1.E2V2M4、2.Strider、3血壓88/45、4.律不整、5.血糖59、6胸悶，請問上述生命徵象何者為致命性過敏的臨床表現？","options":{"A":"1、2、3、4、5、6","B":"2、3、4、5","C":"2、3、4、6","D":"1、2、3、4、6"},"answer":"D","manualChapter":"CH40","matchedChapters":["CH40"]},{"id":273,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"在皮膚系統中，何處的細胞能利用皮膚接受的紫外線產生維生素D3且含有黑色素細胞？","options":{"A":"表皮層","B":"真皮層","C":"基底層","D":"皮下組織"},"answer":"C","manualChapter":"CH12"},{"id":274,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"請問歐氏管（Eustachian tube）位於何處？","options":{"A":"外耳道","B":"外耳","C":"中耳","D":"内耳"},"answer":"C","manualChapter":"CH12"},{"id":275,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"請問加拿大頸椎原則中（Canadian C-spine Rule），下列何者為非？","options":{"A":"酒醉意識不清","B":"二層樓高墜落","C":"頸部側邊壓痛","D":"肢體麻木無力"},"answer":"C","manualChapter":"CH25"},{"id":276,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"理學檢查時所發現的徵象，何者為是？","options":{"A":"肚臍下方接近恥骨聯合處觸摸到的異物，可能為副主動脈瘤","B":"後腰部敲痛可能為腎結石","C":"罩丸劇痛，外觀無異常，可能為副睾","D":"女童有腹脹，腹痛及嘔吐等症狀，可能為嵌頓性疝氣"},"answer":"D","manualChapter":"CH20"},{"id":277,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列敘述之部位，何者非皮下注射之正確位置？","options":{"A":"下腹部","B":"大腿前側","C":"屁股","D":"大臂外側"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":278,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"關於栓塞法，下列敘述何者正确？","options":{"A":"因為直腸的位置，所以患者一律右側躺","B":"醫護人員一律使用右手執行","C":"排泄栓塞劑需再體內至少5分鐘，才可解便","D":"一般栓塞劑透過直腸吸收，鼓勵病患在15分鐘內不可解便"},"answer":"B","manualChapter":"CH17","matchedChapters":["CH17"]},{"id":279,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列何者非環甲切開術之時機？","options":{"A":"嚴重的顏面外傷","B":"嚴重的脊椎外傷","C":"異物梗塞無法排除","D":"頸部皮下氣腫"},"answer":"D","manualChapter":"CH15"},{"id":280,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"關於台灣毒蛇下列何者正確？","options":{"A":"毒蛇咬傷時要將止血帶綁於患部上方以避免毒液傷害。","B":"遭百步蛇咬傷時需使用抗出血性蛇毒血清治療","C":"被百步蛇咬傷時會導致局部組織極為疼痛，腫服，有時還會有水泡產生；也會造成凝血功能異常","D":"遭龜殼花咬傷後毒液會破壞組織導致局部有灼熱感、腫脹、出血及水泡"},"answer":"D","manualChapter":"CH50"},{"id":281,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"關於洗胃敘述何者正確？","options":{"A":"嘗試以中和劑中和強酸強鹼，如：果汁","B":"洗胃需使用大口徑鼻胃管來進行（成人36-40號；小兒24-28號）","C":"幼兒洗胃禁止用水，只能用蒸餾過的水，這樣才不會傷害幼兒","D":"活性碳在給予病人前會先製備為水狀溶液並且視情況加入瀉劑"},"answer":"D","manualChapter":"CH50"},{"id":282,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列敘述何者錯誤？","options":{"A":"Flumazenil對有癫癇傾向的人是有幫助的。","B":"ACT中毒其解毒劑為N-acetylcysteine。","C":"鴉片類中毒症狀有三個顯著症狀：針狀瞳孔，呼吸抑制，意識狀態低下。","D":"Digoxin直接及間接作用在SA node及AV node上。"},"answer":"A","manualChapter":"CH16"},{"id":283,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"請問有關孕婦下列敘述何者正確？","options":{"A":"生產三產程依序為：子宮收缩期，胎兒產出期，胎盤產出期","B":"新生兒檢查頸動脈為評估脈博最適合的方式","C":"孕婦發生羊水栓塞死亡率高達90％","D":"孕婦急救時，減少母親的缺氧容易造胎兒缺氣"},"answer":"A","manualChapter":"CH49"},{"id":284,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列關於孕婦急救重點，何者錯誤？","options":{"A":"靜脈點滴注射於橫膈以上","B":"評估血壓，收缩壓小於100或低於基本值70％以下，就應開始治療","C":"RSI藥物可選用一般較不會造成低血壓的麻醉藥","D":"孕婦心臟停止時，剖腹救出大於24週胎兒，胎兒存活率最高"},"answer":"B","manualChapter":"CH49"},{"id":285,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"以下對野外救護時所施行之處置何者錯誤？","options":{"A":"野外缺乏食物與飲水，擔心患者低血糖，所以不用考慮運送時間應立即給予D10W","B":"擔心患者需要動手術，可以在到院前幾個小時再開始禁食","C":"使用長背板運送患者時，45分鐘就會造成嚴重疼痛，90分鐘就會產生壓瘡","D":"在運送患者過程中，盡量患者能離開擔架，活動下肢"},"answer":"A","manualChapter":"CH45"},{"id":286,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"野外醫學傷口的治療分為四個階段，下列何者錯誤？","options":{"A":"止血","B":"盡快復位","C":"回復功能","D":"美觀"},"answer":"B","manualChapter":"CH45"},{"id":287,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"痛痛鴨有一天至玉山登山，在山里迷失三天後被身為EMTP的你找到，剛好你身上帶有所有經醫療醫師認可之藥物，請問下列處置何者正確？","options":{"A":"患者因三天沒吃東西，所以接觸第一時間先給予D10W以補充水分及糖分","B":"痛痛鴨内科OHCA，現場人員足夠，建議急救30-60後無法恢復心跳後應停止急救","C":"痛痛鴨表示右手被毒蛇咬傷，故應立即使用止血帶以避免中毒死亡","D":"毒蛇咬傷使用彈繃包紮，應在被咬位置至上下關節間都要包紮起來","E":"痛痛鴨表示被蜂螫傷，應立即給予Epinephrine 0.3mgIM"},"answer":"D","manualChapter":"CH50"},{"id":288,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"小明因為夏天將至，將院子的空花盆及有裝水的容器清理乾淨，請問為疾病三段五級預防哪一階段？","options":{"A":"健康促進","B":"特殊保護","C":"早期診斷，早期治療","D":"限制殘障"},"answer":"B","manualChapter":"CH03"},{"id":289,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"依據緊急醫療救護法，緊急醫療救護應包含下列事項，何者為非？","options":{"A":"緊急傷病、大量傷病患或野外地區傷病之現場緊急救護及醫療處理","B":"送醫途中之緊急救護","C":"重大傷病患或離島，偏遠地區難以診治之傷病患之轉診","D":"抵達送醫目的醫療機構而醫護人員尚未處置前"},"answer":"D","manualChapter":"CH02"},{"id":290,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"EMS醫療指導制度中，何者最費時費力？","options":{"A":"前瞻性的醫療指導","B":"即時性的醫療指導","C":"回朔性的醫療指導","D":"主動式的醫療指導"},"answer":"B","manualChapter":"CH02"},{"id":291,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"腎上腺素受體α，β之敘述，何者為非？","options":{"A":"α1受體：活化後產生瞳孔縮小，血壓下降，腸胃道蠕動加快等情形","B":"α2受體：活化後抑制胰島素分泌","C":"β1受體：活化後增加心跳速率及增加心臟收縮力","D":"β2受體：分布於支氣管，使平滑肌鬆弛"},"answer":"A","manualChapter":"CH16"},{"id":292,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"關於急救藥物Epinephrine敘述，何者為非？","options":{"A":"在小劑量時，會活化心臟的β受體增加心臟的收缩力及心搏速度","B":"活化β2受體，擴張骨骼肌上血管，造成舒張壓下降","C":"活化α1受體，放鬆小動脈，皮膚血管，讓收縮壓下降","D":"是強力的β2致效劑，讓支氣管平滑肌鬆弛，支氣管擴張"},"answer":"C","manualChapter":"CH16"},{"id":293,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"關於藥物給予途徑之英文縮寫，何者為非？","options":{"A":"皮下：S.C.","B":"舌下：S.L.","C":"霧氣吸入：I.H.","D":"口服：P.R."},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":294,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列敘述何者正確？","options":{"A":"熱痙攀是一種短暫、間歇的，且常常嚴重的肌肉反應，發生於肌肉因負荷重的工作或運動時產生肌肉疲憊，主因是鋰與水的流失","B":"熱昏厥通常是在熱環境中久站，原因是靜脈血液滯流於下肢及相對的體液不足產生姿勢性低血壓所致","C":"體溫是由延腦的體溫調節中樞控制，體溫升高或下降是由兩種方式調節：調節熱產生或熱散失","D":"中暑者體溫調節功能失常，體溫可達39度C以上，這樣的高溫會造成所有組織受到傷害並產生熱衰竭"},"answer":"B","manualChapter":"CH44"},{"id":295,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列敘述何者在確？","options":{"A":"低體溫可分為三類，其中中度中心體溫介於32～34之間","B":"急性高山病是一個常見的高山疾病，其症狀可在高地12-24小時內發生，最嚴重的症狀常在到達高地的24〜48小時內發生","C":"高山肺水腫至少部份的原因是缺氧所產生的肺靜脈高壓有關，肺靜脈壓升高會促進白三烯釋放。而造成肺小靜脈通透性增加","D":"高山疾病是因於暴露在低壓低氧的環境而產生，主要發生在2400公尺以上高度"},"answer":"D","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":296,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"下列有關身體體溫調節的敘述，何者為非？","options":{"A":"皮膚血管的擴張以及排汗可以增加體熱散失","B":"環境相對溼度越高，身體蒸發散熱的效果越差","C":"溺水病人容易產生失溫的現象和身體的輻射熱有關","D":"環境風速越快，身體對流散熱的效果越好"},"answer":"C","manualChapter":"CH44"},{"id":297,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"新生兒發生癲癇重積狀態，常見的原因不包刮?","options":{"A":"生產受傷","B":"先天性代謝異常","C":"腦部感染","D":"腦部腫瘤"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":298,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"有關於老人預防跌倒與降低跌倒有關的傷害措施，何者為非？","options":{"A":"使用輔助器","B":"使用柔軟的小地毯","C":"提供扶手","D":"保持適當的照明"},"answer":"B","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":299,"source":"109年 - EMT-P 高級救護技術員教育訓練-2.doc","question":"年輕孕婦懷孕約40周，急產產出一足月胎兒。剛出生時新生兒抽吸口鼻不會哭泣，臉部也無表情，呼吸不規則且每分鐘約20下。脈搏微弱每分鐘約80下，刺激時手腳僅有一些無力的收縮。外觀發現四肢發紺，身體比較紅潤。請問第一分鐘的APGAR分數是？","options":{"A":"3分","B":"4分","C":"5分","D":"6分"},"answer":"B","manualChapter":"CH49"},{"id":301,"source":"110年 - EMT-P 高級救護技術員教育訓練.doc","question":"關於心肌梗塞心電圖之變化，下列順序何者正確？","options":{"A":"甲，乙，丙，丁，戊","B":"甲，戊，丁，丙，乙","C":"甲，丁，戊，丙，乙","D":"甲，戊，丁，乙，丙"},"answer":"B","manualChapter":"CH33","image":"題庫圖片/301.png"},{"id":302,"source":"110年 - EMT-P 高級救護技術員教育訓練.doc","question":"男性患者於醫院實施睪丸手術後即反應傷口劇痛，發現陰囊有巨大血腫塊。病人血球計數正常，凝血酶原時間（PT）正常，部分促凝血酶原激酶時間（aPTT）延長，血纖維蛋白原（fibrinogen）正常。除了aPTT矯正測試和出血時間還必須加做下列那些測試才能獲得正確之診斷？","options":{"A":"第五凝血因子測試","B":"第十三凝血因子測試","C":"第八或第九凝血因子測試","D":"第七凝血因子測試"},"answer":"C","manualChapter":"CH39"},{"id":303,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"除了救護技術員目擊心肺功能停止病患，消防局能讓心肺功能停止病患4到6分鐘內接受心復甦術的有效措施為","options":{"A":"救護車閃光鳴笛前往救護地點","B":"廣設消防分隊據點","C":"實施派遣員電話指引心肺復甦術","D":"派遣責任醫院出勤，執行心肺復甦術"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":305,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"高級救護技術員接受定期健康檢查，是落實疾病三段五級預防之","options":{"A":"健康促進","B":"特殊保護","C":"早期診斷早期治療","D":"復健"},"answer":"A","manualChapter":"CH03"},{"id":306,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"以下處置，哪一項最不恰當？","options":{"A":"病患意識不清，現場又無法定代理人下，可將病患同意救護視為當然","B":"救護心肺功能停止病患，在場家屬對於急救意見不一時，應先進行急救","C":"具行為能力的成人呼吸困難，拒絕就醫，應尊重病患自由選擇權，向病患解釋與病患簽名後歸隊","D":"行為急症病患自我傷害，且拒絕就醫，應尊重病患自由選擇權，及不妨害病患自由前提下，向病患解釋與病患簽名後歸隊"},"answer":"D","manualChapter":"CH03","matchedChapters":["CH03"]},{"id":307,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"「疑似因心臟疾病引起之胸痛病患，有多少比例接受阿斯匹靈（aspirin）治療？」於品質評估架構三大構面中，屬於","options":{"A":"結構面","B":"過程面","C":"結果面","D":"有效面"},"answer":"B","manualChapter":"CH09"},{"id":308,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"將氣管內管插管的失敗原因分析後，收集資料，以各個原因所佔的比率高低，由高到低可繪成何種圖形易於分析？","options":{"A":"因果圖","B":"「柏拉圖分析圖」","C":"折線圖","D":"魚骨圖"},"answer":"B","manualChapter":"CH09"},{"id":309,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"派遣員經由下列何者，來區分病患疾病之輕重緩急？","options":{"A":"報案者的囗氣急迫性","B":"年齡性別","C":"關鍵問題","D":"主訴"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":310,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"目前我國急救責任醫院分級分成幾級？","options":{"A":"2級","B":"3級","C":"4級","D":"5級"},"answer":"B","manualChapter":"CH02"},{"id":311,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"緊急醫療救護體系的醫療指導制度（EMS Medical Direction）主要包括","options":{"A":"緊急醫療救護體系的整體規劃","B":"品質管理","C":"教育訓練、督導考核","D":"以上皆是"},"answer":"D","manualChapter":"CH02"},{"id":312,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"EMS醫療指導制度中，教育訓練依時序性是屬於何種模式","options":{"A":"前瞻性（prospective）的醫療指導","B":"即時性（concurent）的醫療指導","C":"回溯性（retrospective）的醫療指導","D":"被動式（passive）的醫療指導"},"answer":"A","manualChapter":"CH02"},{"id":313,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"EMS醫療指導制度中，救護記錄表審核回顧，依時序性是屬於何種模式","options":{"A":"前瞻性（prospective）的醫療指導","B":"即時性（concurrent）的醫療指導","C":"回溯性（retrospective）的醫療指導","D":"被動式（passive）的醫療指導"},"answer":"C","manualChapter":"CH02"},{"id":315,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"近年來，國人十大死亡原因第一名為","options":{"A":"癌症","B":"冠心症","C":"腦中風","D":"意外"},"answer":"A","manualChapter":"CH03","matchedChapters":["CH03"]},{"id":319,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"下列有關我國緊急醫療救護發展的里程碑，何者不正確？","options":{"A":"緊急醫療救護法與民國84年通過，明定緊急醫療救護為各地消防機關的權責","B":"以醫院為主的雙軌制高級救護（Hospital-basedTwo-Tiered BLS-ALS），於民國87年首次試","C":"國內首批高級救護技術員（EMT-P）於民國91年結業","D":"緊急醫療救護法於民國89年修訂，規範直轄市，縣（市）消防主管機關為辦理下列事項，應指定醫療指導醫師，建立醫療指導制度"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":320,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"下列有關救護車交通事故的敘述，何者為非？","options":{"A":"救護車的交通事故，是救護技術員職業相關嚴重傷害最重要的原因之一","B":"救護車的交通事故，多半發生在從救護現場，載送病患前往醫院的時候","C":"準確的救護派遣分級，減少不必要的闖紅燈行為，可以降低救護車交通事故的機會","D":"救護車的駕駛，與其他乘員，都應該正確繫上安全帶，以減少事故造成的傷害"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":321,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"下列有關社區提供消防為主的雙軌制高級救護服務（fire-based ALS service）的敘述，下列何者為非？","options":{"A":"以BLS-ALS的雙軌模式出勤，提供高級救護服務，可以節省高級救護服務的資源","B":"雙軌制高級救護服務的實施，有賴正確的派遣作業","C":"本地研究的資料顯示，相較於初級救護服務，高級救護服務（advanced life support）對於到院前心跳停止病患，可以提升病患循環恢復（return of spontaneous circulation，ROSC）的比例","D":"根據國內的調查顯示，緊急醫療救護的病患，需要高級救護服務的比例，約佔五成左右"},"answer":"D","manualChapter":"CH02"},{"id":323,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"下列有關醫療指導的敘述，何者有誤？","options":{"A":"教育訓練與標準作業流程制定，屬於回朔性的醫療指導","B":"醫療指導醫師需要協助各地緊急醫療系統，訂定各級救護技術員的品質指標，執行品質監測","C":"需要核簽高級救護技術員依據預立醫療流程施行緊急救護之救護紀錄表","D":"跟隨救護車出勤，觀察救護程序，也屬於即時性的醫療指導"},"answer":"A","manualChapter":"CH04"},{"id":324,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"下列有關我國高級救護技術員的敘述，下列何者不正確？","options":{"A":"依照縣市醫療指導醫師訂定預立醫囑的內容，執行高級救護服務（advance life support）","B":"取得證照後，需要接受每年24小時，三年共96小時之繼續教育，每次得延長其證書效期","C":"須接受衛生署許可的機關（構）團體，為期1280小時的訓練","D":"為了解決偏遠地方的緊急醫療需求，在沒有實施醫療指導制度的社區，可以獨立進行高級救護服務"},"answer":"D","manualChapter":"CH03"},{"id":326,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"當救護處置內容涉及法律爭議時，是否存在救護過失往往是爭執的焦點。所謂「過失」指的是「應注意、能注意，而未注意」，一般來說，通常要符合以下四個要件，以下何者錯誤？","options":{"A":"有進行救護處置的義務","B":"救護處置未達標準（即違反了提供適當救護的義務）","C":"對病患或他人造成傷害","D":"造成的傷害與所採取的救護處置有時間上的前後關係"},"answer":"D","manualChapter":"CH04"},{"id":327,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"保密的義務在為了某些更重要的社會利益是可以打破的，以下何者錯誤？","options":{"A":"法律上規範有通報義務的情形","B":"為了內部或是醫療品質改善需要","C":"為了社會大眾知的權利","D":"當檢察官持有搜索令狀，進行司法調查；或是為了阻止犯罪行為的發生"},"answer":"C","matchedChapters":["CH04"],"manualChapter":"CH04"},{"id":328,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"救護車被允許使用以下的特權，以下何者錯誤？","options":{"A":"稍微超速","B":"在安全的範圍內，可以行駛於逆向車道","C":"在安全的情況下，可以闖越十字路口的紅燈","D":"應該全程使用警鳴器及警示燈"},"answer":"D","manualChapter":"CH04","matchedChapters":["CH04"]},{"id":329,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"有關救護記錄表，以下何者錯誤？","options":{"A":"救護記錄表必須在救護的過程中完成，可以說是救護工作的一部份，而且必須留存於醫院病歷中，因此不應該也不能在事後修改或填寫記錄","B":"救護記錄表應同時由救護單位及醫療單位保存十年","C":"救護記錄表的內容應包括對病患的評估、治療以及其他重要的事件，以呈現整個救護的過程","D":"記錄內容不應有假設及過度的推論，並且避免情緒性的字眼"},"answer":"B","manualChapter":"CH03","matchedChapters":["CH03"]},{"id":330,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"下列何者不是醫學倫理的四原則之一","options":{"A":"自主原則","B":"不傷害原則","C":"行善原則","D":"道德原則"},"answer":"D","manualChapter":"CH03"},{"id":332,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"現行國內空中救護運輸，大都執行何種運送？","options":{"A":"初級運送","B":"二級運送","C":"三級運送","D":"四級運送"},"answer":"B","manualChapter":"CH58"},{"id":333,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"何種模式之醫療指導，最能直接反映緊急救護的品質？","options":{"A":"前瞻性醫療指導","B":"即時性醫療指導","C":"回溯性醫療指導","D":"救護紀錄表審查"},"answer":"B","manualChapter":"CH02"},{"id":334,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"「派遣中心所接獲電話中，傷病患主訴之分佈及數量」屬於哪一評估構面指標？","options":{"A":"結構面","B":"過程面","C":"結果面","D":"分佈面"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":335,"source":"第一章 系統運作與品質管理(2012-2014).doc","question":"有關品質指標管理，何者最不恰當？","options":{"A":"觀察一段時間內的指標數據的變化，走勢是逐步改善，還是正在變差","B":"使用合適的方式呈現數據的變化，可以是以圖片或表格呈現","C":"要求資料或數據的精確性","D":"根據需求，改變指標之定義"},"answer":"D","manualChapter":"CH09"},{"id":336,"source":"第一章 系統運作與品質管理(2012-2014).doc","ques
