anualChapter":"CH50"},{"id":941,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關肉毒桿菌素中毒的敘述，何者為是？","options":{"A":"肉毒桿菌素是一種很強的毒素，在醫學上沒有任何用途","B":"是因為被肉毒芽孢梭狀桿菌污染的泥土進人傷囗所導致的","C":"中毒病人的症狀是由末梢傳回中樞，先是四肢麻痺，再來才出現複視、眼瞼下垂以及吸衰竭等症狀","D":"中毒病人的死因是因為呼吸衰竭"},"answer":"D","manualChapter":"CH50"},{"id":942,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"30歲的男性士官長被發現在浴室中陷入昏迷，你和伙伴（都是合格的高級救護技術員）到達現場後發現士官長倒臥在寢室中的浴室，現場有濃重的農藥惡臭，牆角有兩個被撕掉標籤的空瓶，經初評發現病人完全昏迷（對痛沒有反應）、口鼻分泌物大量增加、口吐白沫、呼吸每分鐘6下、頸動脈摸的到（每分鐘68下）、四肢癱瘓、全身皮膚蒼白濕冷、血糖值為218 mg/dL、距離急救責任醫院約45分鐘車程；下列敘述何者為非？","options":{"A":"高級救護技術員在這種情況下須特別注意自我防護，以免吸入過量農藥而造成中毒","B":"需要立即建立進階呼吸道以確保呼吸道暢通，並在病人呼吸停止時給予強迫給氧","C":"病人的瞳孔是針狀瞳，可以線上醫療指導注射atropine解毒","D":"此種農藥中毒並無特別的解毒劑"},"answer":"D","manualChapter":"非創傷"},{"id":943,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關毒蛇咬傷的敘述，何者為是？","options":{"A":"毒蛇咬傷的傷口可以冰敷來消腫止痛","B":"百步蛇的毒液成分為很強的出血性毒，所以施打毒蛇血清時可以將青竹絲用的抗出血性毒蛇血清加倍來使用，效果相同","C":"切開毒蛇咬傷的傷囗進行抽吸並且在咬傷部位的近心端綁上止血帶對病人有絕對的好處，所以要在現場緊急處置","D":"百步蛇咬傷的病人，抽血可以發現血小板低下以及凝血時間延長"},"answer":"D","manualChapter":"CH50"},{"id":949,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"救護員運送這兩歲半清醒女童，發燒39℃、燥動不安、皮膚有出血性紫斑、四肢冰冷並有酸血症的現象，心跳速率為148下/分、呼吸速率為38下/分、血壓為80/56 mmHg，酸鹼度為7.25，運送後救護員除了標準車內清潔消毒外，應注意的事為：","options":{"A":"EMT應儘速返隊全車高規格消毒並靜置車輛6小時後才能再使用","B":"EMT應追蹤病患診斷並尋求醫師建議暴露後預防性投藥","C":"EMT應立即掛急診施打抗生素及免疫球蛋白","D":"EMT應掛門診追蹤胸部X光檢查"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":950,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關身體體溫調節的敘述，何者為是？1.皮膚血管的擴張以及出汗可以增加體熱的散失2.環境相對溼度越高、身體蒸發散熱的效果越不好3.溺水病人容易產生失溫的現象和身體的傳導散熱有關4.環境風速越快，身體對流散熱的效果越好","options":{"A":"1","C":"1、2、3","B":"1、2","D":"1、2、3、4"},"answer":"D","manualChapter":"CH44"},{"id":952,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關生物咬螫刺傷的敘述，下列何者為是？","options":{"A":"鎖鏈蛇的蛇毒為混合性毒，所以對於被鎖鏈蛇咬傷的傷患可以使用抗出血性蛇毒以及抗神經性蛇毒血清合併使用來治療","B":"被石頭魚（石狗公）的鰭刺傷的傷患會感到患部異常疼痛，所以可以冰敷來減輕疼痛感","C":"蜂類離體的毒刺毒囊不具活性，所以救護技術員到達現場發現傷患身上有離體的毒刺毒囊時不需要特別的處置","D":"水母的觸手離開水母的身體仍會保持活性一段時間"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":953,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關酒精對人體的危害，下列敘述何者為非？","options":{"A":"酒精會抑制維生素B1的在小腸的吸收而造成病患Wernicke-Korsakoff syndrome","B":"喝酒以後排尿量增加，是因為酒精抑制抗利尿激素的分泌，會造成脫水以及電解質不平衡","C":"長期酗酒可能和病患的腸胃道出血以及肝硬化沒有相關","D":"酒精會影響心臟的肌肉而使心臟收縮的力量降低"},"answer":"C","manualChapter":"CH46"},{"id":955,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關評估以及和行為急症的病患會談的技巧，下列敘述何者為非？","options":{"A":"許多病患有暴力傾向，救護技術員首先必須確認現場環境安全","B":"為了要和行為急症的病患建立好彼此的關係，適當的肢體接觸是必須的","C":"精神狀態檢查五步驟包括:觀察病患外觀、病患言語特徵、病患情緒特徵、評估病患思想以及決定病患定向感","D":"使用開放式的問題，讓病患描述自己的情況，誘導病患說話才較容易評估病患的病情"},"answer":"B","manualChapter":"CH46"},{"id":956,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關自殺以及準自殺行為的危險因素，下列敘述何者為非？","options":{"A":"執行一次或多次的準自殺行為","B":"單身，分居或離婚","C":"沒有職業或退休","D":"與家人或社會有良好的互動"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":957,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"下列有關老人預防跌倒與降低跌倒有關傷害的措施，何者敘述為非？","options":{"A":"使用輔助器","B":"保持適當的照明","C":"提供和使用扶手","D":"柔軟易移動的小地毯收納方便又可吸收老人跌倒時的衝擊力，建議使用"},"answer":"D","manualChapter":"CH47"},{"id":960,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"以下關於老年病患到院前照護的敘述，何者為是？","options":{"A":"老年病患跌倒送往醫院時，EMT應蒐集資訊判斷是否可能有內科急重症問題讓病患跌倒，並告知檢傷相關訊息","B":"老年病患因為代謝比較慢，所以比起一般成年人容易低體溫。也因為代謝慢，所以比較不會高體溫","C":"老年病患若有自殺的行為，通常成功的比例比其他年齡層低","D":"老年病患若遇到外傷所致之顱內出血，因為頭骨與腦部之間的空間增加，因此出血早期就會出現顱內壓升高之症狀"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":961,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"關於有機磷中毒患者的到院前辨認與處理，以下何者正確？","options":{"A":"Atropine的使用很重要，因為可以再活化乙醯膽鹼酶，讓無力的呼吸肌肉再度強化","B":"Atr。pine的使用劑量需要根據病患體重計算，不可超出上限","C":"由於有機磷會使得病患無力，因此一旦發生癲癇，不可以使用會讓病患更無力的diazepam或是lorazepam","D":"有機磷中毒的主要症狀是針狀瞳孔，流鼻水，呼吸道分泌物增多，流淚，流口水，全身出汗與腹瀉"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":962,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"新生兒（第一個月）發生癲癇重積狀態，常見的原因不包括？","options":{"A":"生產受傷","B":"先天性代謝異常","C":"腦部感染","D":"腦部腫瘤"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":963,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"新生兒急救時，所需的急救措施，依頻率而言，最常用到的措施是？","options":{"A":"擦乾、保暖、抽吸、剌激","B":"胸外按壓","C":"氣管插管","D":"強心劑藥物"},"answer":"A","matchedChapters":["CH48"],"manualChapter":"CH48"},{"id":966,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"有關毒藥物以及解毒藥劑的配對，下列何者為非？","options":{"A":"普拿疼中毒的解毒劑是N-acetylcysteine（Fluimucil）","B":"甲醇中毒的解毒劑是乙醇","C":"嗎啡類藥物中毒的解毒劑是naloxone","D":"氰化物中毒的解毒劑是flumazenil"},"answer":"D","manualChapter":"CH16"},{"id":967,"source":"第六章 特殊狀況與特定病患(2012-2014).doc","question":"根據北美應變指南，以下對於「初期隔離距離」和「防護行動區域」的敘述，何者為非？","options":{"A":"如果危害物質的蒸氣雲穿越數棟高層建築物或流經峽谷，因為蒸氣雲與大氣較不容易混合，所以防護距離可能比應變指南所表列的建議距離更長","B":"應該從上風處小心地接近事故現場；如果方向許可，應該從地勢高處接近事故現場","C":"防護行動距離有可能因為天候、事故嚴重度、地形等等因素而必須調整","D":"一般而言，在夜晚時空氣比較平穩，使得危害物質擴散較慢，因此毒性影響區域範圍會小於發生在白天的狀況"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":968,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"以下關於熱疾病的敘述，何者為是？","options":{"A":"熱痙攣（heat cramp）主要是因為鈉與水的流失，導致全身肌肉一起痙攣","B":"熱衰竭（heate exhaustion）會有頭暈.噁心.頭痛.及輕到中度體溫上升，但不會意識改變","C":"傳統型中暑（Classic heat stroke）常發生於持續性高溫度及高濕度的環境，而且好發在健康的運動員","D":"中暑如果不治療將導致死亡。治療成功的要素包括啟動基本救命術（BLS）及高級救命術（ALS）.快速認出熱急症.及快速幫病患降溫等"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":969,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於低體溫病患照顧的特殊考慮，何者為非？","options":{"A":"低體溫病患呼吸及脈搏不易偵測，因此應評估脈搏30～45秒，以決定是否要做心肺復甦術，如有懷疑則仍先做心肺復甦術","B":"對於心臟停止及沒有反應的病患，仍建議插管。其目的有二：（1）停供有效換氣並給予溫暖潮濕的氧氣；（2）隔離呼吸道避免吸入","C":"低體溫的心臟對心血管藥物反應很強，且藥物代謝較迅速容易累積在周邊組織產生毒性，因此一般中心體溫在30℃以下要減半給藥劑量","D":"竇性心搏過慢對嚴重低體溫病患有保護作用，可維持低體溫病患足夠的氧氣供應，一不建議使用心臟節律器"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":970,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"輕孕婦懷孕40週，急產產出一足月胎兒。剛出生時新生兒抽吸口鼻會哭泣臉部也無表情.呼吸規則，且每分鐘約20下。脈搏微弱且約每分鐘80下，激時手腳僅有一些無的收縮，外觀發現四肢發紺，身體比較紅潤。請問其第一分鐘的APGAR分數是？","options":{"A":"3分","B":"4分","C":"5分","D":"6分"},"answer":"B","manualChapter":"CH49"},{"id":971,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"以下關於小兒急救的敘述，何者為非？","options":{"A":"小兒若感冒發燒期間發生竇性頻脈（sinustachy cardia），應儘速用藥物控制心搏過速","B":"Atropine建議劑量為0.02 mg/kg，最小劑量為0.1 mg，因為太小劑量反而會造成心搏過緩","C":"出現上心室頻脈（SVT），在迷走神經刺激失敗後，可以考慮靜脈快速注射腺酸（adenosine 0.1 mg/kg）","D":"有脈搏的心室頻脈（VT）時，立即施予心臟電器整流術0.5～1焦耳/公斤"},"answer":"A","manualChapter":"CH48"},{"id":972,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"以下關於兒童生理學和解剖學臨床應用之重點，何者為非？","options":{"A":"兒童頭部佔全身面積之比率較大，兒童事故傷害常造成頭部損傷","B":"將摺疊之毛巾置於大於3歲之兒童的枕部有助於建立嗅鼻吸姿勢以維持呼吸道通暢","C":"而兒童呼吸道最狹窄的位置是在聲帶下方的環狀軟骨","D":"小於6個月的嬰兒主要是依賴嘴巴呼吸，即使鼻孔被分泌物阻塞也不會造成呼吸窘迫"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":973,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於下列兒童的血壓數值描述，何者為是？","options":{"A":"一名5歲男童發燒畏寒，手腳冰冷，收縮壓86 mmHg，應為敗血性休克","B":"一名8歲女童騎腳踏車摔倒撞到腹部，臉色蒼白，收縮壓76 mmHg，應為出血性休克","C":"一名4歲男童拉肚子一天，活動力降低，收縮壓82 mmHg，應為低血容性休克","D":"一名6歲女童頭部外傷合併頭皮血腫，大聲哭鬧，收縮壓84 mmHg，應為神經性休克"},"answer":"B","manualChapter":"CH48"},{"id":974,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"5歲男童25kg在急診室目擊突然失去意識，沒有反應，無呼吸無脈搏，現場醫護人員立即給予胸部按壓以及甦醒球通氣，心電圖監視器呈現心律如下；關於下一步的急救處置，何者為是？","options":{"A":"確定無人碰觸男童後立即去顫電擊50焦耳","B":"先胸部按壓滿兩分鐘後，再進行去顫電擊50焦耳","C":"儘速選擇適當的氣管內管進行插管治療","D":"持續以胸部按壓和吹氣15：2的方式滿十個循環後，再次檢查脈搏，不需電擊"},"answer":"A","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/974.png"},{"id":975,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"有關兒童外傷，下敘述何者為是？","options":{"A":"常常是單一器官受傷","B":"小兒肋骨沒斷，但肺部常常已經受到嚴重的挫傷","C":"處理原則與大人差異很大","D":"骨折時，常常完全折斷"},"answer":"B","manualChapter":"CH48"},{"id":976,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"年輕孕婦懷孕40週突然感到嚴重呼吸困難而打119求救，你到現場發現她有有發紺.胸痛及休克現象，似乎快要窒息。此時急救的處置與一般ACLS略有不同，何者為是？","options":{"A":"若量到她血壓偏低，建議以休克病患之頭低腳高方式運送","B":"若有需要插管，應該選用口徑較大的氣管內管（例如7.5#或8#）","C":"為增加母親心輸出量，應該要右側躺或進行子宮右推手勢（LUD）","D":"為了胎兒預後，若母親心跳停止，應該在心跳停止的四到五分鐘內產出胎兒"},"answer":"D","manualChapter":"CH49"},{"id":977,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"年約40歲的病患，被民眾發現倒臥在三溫暖的蒸氣室內而打電話求助119，身為高級救護技術員的你抵達現場後，發現病患意識不清且身體乾熱，請問下列有關熱急症的敘述何者為非？","options":{"A":"體溫過高或熱病主要是導因於病患超出體溫調節機轉所能調節的範圍或是體溫調節中樞失效","B":"熱病可依程度分為熱痙擊.熱昏厥.熱衰竭及熱中暑","C":"若此位40歲的病患全身濕熱.不停出汗，即可排除熱中暑之診斷","D":"治療熱中暑的病患度時，一般建議當中心體溫低於39度時，降溫就要停止，以避免發生反彈性低體溫"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":978,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"在一個寒冷的冬天，民眾報案表示，有一狀似喝醉路倒的病患倒在馬路旁待援，病患經你轉送到醫院後做了一張心電圖如下圖，請問下列敘述何者為非？","options":{"A":"心電圖看到的異狀，是如駱駝峰般突起的Osborn wave","B":"此類病患在搬運移動時須特別小心，即使輕微的動作都有可能產生致命性的心律不整","C":"會產生此種現象的高風險者包括熱衷戶外運動者.老年人.非常小的小孩.及一些有精神或其他內科疾病者","D":"若病患突發心室纖維顫動，在電擊去顫治療上，選擇電擊與否及能量均與一般的病患不同"},"answer":"D","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/978.png"},{"id":979,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關潛水急症的敘述，何者為非？","options":{"A":"因潛水下降時的壓力創傷又叫擠壓性（squeeze）創傷","B":"縱膈腔氣腫.皮下氣腫及氣胸都常見於下降時所產生的擠壓性創傷","C":"任何病患在潛水後12至36小時內出現症狀，都應懷疑減壓病（decompression sickness）的可能","D":"氮醉（Nitrogen narcosis）是因為在較深的水下，血中的氮分壓較正常高，產生類似酒精的鎮靜作用"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":980,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"50歲男性於台北市登象山（海拔約183公尺）返家後，於家中產生頭暈及步態不穩之現象，家人發現後打119求助。經到場初步評估後，病患生命徵象穩定但有步態不穩及口齒不清之狀況，現場處置後轉送醫院。請問下列有關此病患的敘述何者為非？","options":{"A":"此病患疑似急性腦中風，應送往有能力處置急性腦中風之急救責任醫院","B":"此病患因為登象山後產生神經學異常，應該將急性高山病列入鑑別診斷，情況惡化有可能產生腦水腫","C":"急性高山病是常見的高山疾病，症狀可在到高地4～6小時內產生，最嚴重的症狀常在到達高地的24～48小時內發生","D":"急性高山病可用藥物預防，如丹木斯（Diamox）.類固醇（Steroid）等等，但發生急性高山病症狀後，最重要的是趕緊下降高度"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":981,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"在面對兒童急症時，我們常常會使用到兒童評估評估三角來初步評估兒童的病情，有關兒童評估三角，何者為非？","options":{"A":"兒童外觀，視其意識狀態及肌肉張力","B":"兒童呼吸，視其呼吸速率及其呼吸費力程度","C":"兒童瞳孔，視其有無放大或縮小","D":"兒童循環，視其膚色及皮膚狀況"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":982,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"年輕媽媽神情緊張的抱著出生不久的小孩衝進分隊，表示小朋友剛在家餵完奶後，呼吸淺慢且呼吸音嘈雜。你診視後發現此名嬰兒膚色發紺，意識不清，於是在請求支援後馬上進行復甦。請問下列有關小兒呼吸道及胸腔的敘述，何者為非？","options":{"A":"小於6個月的嬰兒主要是依賴鼻部呼吸，鼻孔被分泌物阻塞即會造成嬰兒呼吸窘迫，適時的抽吸鼻部分泌物是很重要的","B":"將折疊之毛巾置於大於3歲的兒童枕部，有助於建立嗅吸姿勢以維持呼吸道暢通","C":"兒童呼吸道最窄的位置在聲帶下方的環狀軟骨，這點與大人不同","D":"兒童胸腔肋骨因含有較多軟骨而有彈性，故發生胸腔創傷時較能吸收外來的能量，不易產生肺挫傷和壓力損傷"},"answer":"D","manualChapter":"CH48"},{"id":983,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"80歲的老先生在家中大吼大叫亂摔東西，被家人發現打119求助。你到了現場初步評估，發現老先生雖然胡言亂語但生命徵象均正常，聞起來酒氣很重，進一步詢問下其家人提及老先生還有失智的病史，請問下列有關行為急症及老人神經症狀的表現，何者為非？","options":{"A":"失智症是對時間和地點慢慢進展的記憶喪失，但即使病患有失智症的病史，也應該把病患當作譫妄來處理，因為有可能是危及生命的急症","B":"酒癮判定可以用CAGE（Cut down.Annoyance.Guilty.Eye opener）來輔助篩檢","C":"精神狀態檢查五步驟包括觀察病患外觀.病患言語特徵.病患情緒特徵.評估病患思想以及決定病患定向感","D":"這位80歲的老先生酒氣很重，而且沒有局部神經學症狀，不會是腦血管疾病所引起之意識障礙"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":984,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關婦產科急症的相關敘述，何者為非？","options":{"A":"前置胎盤可能跟前胎剖腹產.胎盤較大及子宮血管循環不良有關。通常會引起下腹劇烈疼痛，出血量可能會危及生命","B":"早產的危險因子包括外傷.前胎早產.泌尿道感染.多胎妊娠及子宮構造異常","C":"產後出血為產後期常見的併發症，其定義為產後大於500cc的出血。變大的子宮排空後必須收縮以控制出血，產後子宮無法適當收縮是出血最常見的原因","D":"子癇前症亦稱妊娠毒血症，通常發生於第一胎。病患在懷孕時會出現高血壓.水腫及尿蛋白，通常發生於懷孕第三期。若同時發生癲癇情況則稱為子癇症"},"answer":"A","manualChapter":"CH49","matchedChapters":["CH49"]},{"id":985,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"18歲女性病患，去KTV唱歌因喝下他人請的飲料後自覺有異，於是起身離開並由室友打119求助。你抵達時發現此名病患情緒高亢且焦躁不安，生命徵象如下：呼吸每分鐘28下、脈搏每分鐘136下、血壓為190/100 mmHg、體溫為37.8℃。理學檢查可見瞳孔略放大、光反射不明顯，另有全身發汗的現象，其他部分則未見明顯異常。請問下列敘述及處置何者為非？","options":{"A":"這名女性病患很有可能是攝入了中樞神經刺激劑的物質","B":"古柯鹼在美國是最受歡迎的非法藥物之一，藥物治療一開始的首選為鎮靜安眠藥（ben-zodiazepines）","C":"安非他命成癮的病患，突然停用會產生所謂的“當機crash”階段，會變的憂鬱.想自殺，沒有條理的思考.行為或接近昏迷","D":"搖頭丸（MDMA）當初在醫療上的用途是用來治療注意力障礙或活動過渡症（ADHD），後來才衍生出濫用問題"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":986,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"72歲男性病，在家中因不明原因將漂白水及無煙鹽酸於密閉的浴室中混合，病患因吸入產生的氣體，約30分鐘開始感覺頭暈，並於5小時後愈來愈喘，其他臨床症狀包括頭暈、盜汗、眼睛疼痛流淚、鼻腔疼痛、流鼻水還有咳嗽。經家人撥打119後送醫，到院後的胸部X光顯示病患有急性肺水腫。請問下列有關此病患及有毒氣體的敘述，何者為非？","options":{"A":"以此病患的症狀及臨床表現加理學檢查，病患很可能是吸入了混合後產生的氯氣","B":"常見的家用瓦斯若吸入過量，同樣也會產生呼吸道刺激的問題而進一步產生肺水腫","C":"工廠及燃燒的塑膠.家具還有建築物會產生氰酸，此為高度毒性的細胞窒息劑，需趕決就醫使用氰酸的解毒劑","D":"硫化氫為類似氰酸的高毒性細胞窒息劑，具有易於辨認的特殊臭蛋味"},"answer":"B","manualChapter":"CH50"},{"id":987,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於冷熱急症的特色，何者為是？","options":{"A":"熱痙攣多因劇烈運動或做吃重的工作，產生肌肉疲憊所致，通常為短暫的.間歇性的，但也可以很嚴重","B":"熱衰竭的特質是有輕度的神智失常.頭暈.噁心.頭痛等症狀，及輕度至中度的中心體溫升高，可高至39℃","C":"重度低體溫病人可能沒有生命徵象，包括測不到呼吸.脈搏及血壓","D":"以上皆是"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":988,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於老人急症的說明，何者為是？","options":{"A":"腎血流量從30歲到80歲時平均會降低50%","B":"瞻妄是突然對時間和地點產生混亂，通常是身體疾病造成的。失智症是對時間和地點慢慢進展的記憶喪失，通常是腦部疾病的結果","C":"腸胃道出血最常發生在60歲到90歲的病人中，死亡率大約10%","D":"以上皆是"},"answer":"D","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":989,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關新生兒急救流程，何者為是？","options":{"A":"只要心跳有大於每分鐘100下，都不需要正壓給氧","B":"給予正壓呼吸後，心跳仍小於每分鐘60次，則開始胸部按壓","C":"新生兒在還有心跳時都不需給予腎上腺素","D":"保暖並非初步穩定措施的選項"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":990,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列何者為兒童評估三角的要素？","options":{"A":"意識狀態","B":"肌肉張力","C":"呼吸速率","D":"以上皆是"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":991,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於小兒無脈搏心跳停止的評估處置，下列何者為是？","options":{"A":"分為可電擊（心室頻脈/心室顫動）以及不可電擊（無脈搏電氣活動/心搏停止）","B":"可電擊的情況下，第一次電擊電量為4焦耳/公斤","C":"腎上腺素只能靜脈給予，不可骨內注射或經氣管內管給予","D":"低血容，鹼中毒，高低血鉀，高體溫均為可能之原因"},"answer":"A","manualChapter":"CH48"},{"id":993,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關毒蛇咬傷處置，何者為是？","options":{"A":"避開毒蛇的攻擊範圍（大約是毒蛇的一半長度），將病人移至安全的區域","B":"提供病人暢通的呼吸道.維持足夠的通氣狀況以及循環的支持，持續監視病人的生命徵象以及使用心律監視器","C":"在受咬傷的患肢上建立靜脈輸液並且使用容積擴張溶液","D":"傷囗局部的冰敷應該要持續，因為如此可延遲毒液擴散"},"answer":"B","manualChapter":"CH50"},{"id":994,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關中毒症候群的區分，何者為是？","options":{"A":"抗膽鹼性症候群徵候包括心搏過速.皮膚潮紅乾熱.瞳孔擴大.及顏面潮紅","B":"膽鹼性症候群包括頭痛.頭暈.虛弱.心搏過緩.噁心以及“濕的”表現，特點是嚴重的唾液分泌（salivation）.流淚（lacrimation）.排尿（urination）.排便（defecation）.腸胃道不適（gastrointestinal upset）以及嘔吐（emesis）","C":"仿交感神經作用徵候包括血壓升高.心搏過速.瞳孔放大以及意識改變（包括偏執性妄想症）。嚴重的病人會產生心血管衰竭。到院前的緊急處置包括：確保人身安全以及提供呼吸道.通氣以及循環的支持性治療","D":"以上皆是"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":995,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"外傷救護勤務，病患為懷孕36周孕婦，車禍無明顯外傷，血壓80/60 mmHg，您在運送時想採取左側躺是為了？","options":{"A":"避免脹大子宮壓迫腹主動脈","B":"避免脹大子宮壓迫下腔靜脈而影響血液回流","C":"較易運送","D":"避免脹大子宮壓迫骨盆神經叢"},"answer":"B","manualChapter":"CH49"},{"id":996,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"妊娠20週時，子宮底高度大約在何處？","options":{"A":"骨盆腔邊緣處","B":"肚臍附近","C":"肚臍下二指寬處","D":"肚臍與劍突中間"},"answer":"B","manualChapter":"CH49"},{"id":997,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"某女士因為情場不如意又失業，在家裡燒木炭自殺，您到達現場，發現某女士已呈現昏迷的狀態，下列何者為非？","options":{"A":"到達現場必須注意通風，注意施救者的安全","B":"可以使用血氧偵測器（Pulse oximeter）測量其血一氧化碳濃度","C":"一氧化碳中毒的解毒劑是氧氣","D":"必須注意病人呼吸道"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":998,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於低體溫病人之處理，何者為非？","options":{"A":"體溫若攝氏三十二度以上，身體會顫抖來產熱","B":"若是重度低體溫，應該以主動體內回溫處理","C":"體溫低於攝氏三十度，存活機會不大，可直接宣布死亡","D":"台灣低體溫患者以低血糖和敗血症為多"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":999,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"小兒急救最重要的是？","options":{"A":"呼吸道暢通。","B":"建立輸液途徑（IV lines）","C":"拿電擊器Quick look paddle看是否心律不整","D":"給予毛毯，以免失溫"},"answer":"A","manualChapter":"CH48"},{"id":1000,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"人體被咬螫後常於皮膚上呈現特殊性淋巴分佈紅線的有毒海洋生物為？","options":{"A":"水母","B":"河豚","C":"海膽","D":"海葵"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1001,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於野外醫學，以下敘述何者為是？","options":{"A":"高山症的初期症狀和感冒或是宿醉很類似，所以常常被忽略。如果懷疑是高山症，應該避免繼續登高，考慮下山，並且考慮給予Acetazolamide和Dexamethasone","B":"潛水者所併發的氣泡栓塞症，通常在浮到水面的幾分鐘內就會出現。如果沒有嚴重症狀，表示沒有產生潛水伕症，當天便可以搭民航機長途旅行","C":"低伏特數的交流電所造成的致命心律不整常常是無心律（Asystole），而高伏特數的交流電或是直流電所造成的致命心律不整常常是心室顫動（Ventricular fibrillation）","D":"Lichtenberg figure是雷擊病患特有的皮膚表徵，會留下永久的疤痕"},"answer":"A","manualChapter":"CH45"},{"id":1002,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關人體體溫調節的敘述，何者為非？","options":{"A":"皮膚是調節熱散失最重要的組織","B":"人體熱散失主要的機轉為輻射.傳導.對流與蒸發","C":"增加食慾可以增加熱產生","D":"環境溼度越高，蒸發散熱的效果越好"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":1003,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"你到鐵人三項比賽執行醫療組的駐點醫療，目擊一位35歲男性參賽者在你面前抽搐後倒下，你跑到參賽者所在的位置，抽搐已停止（抽搐時間不超過1分鐘），但病人仍躁動不安，皮膚摸起來乾熱發燙，耳溫槍顯示體溫為42.5℃，當時的氣溫為32.0℃，相對濕度為80%，以下敘述何者為是？","options":{"A":"此參賽者為抽搐所造成的惡性高體溫","B":"此參賽者為傳統型中暑","C":"此參賽者為典型的熱衰竭","D":"病患應立即脫除所有衣物並開始降溫"},"answer":"D","manualChapter":"CH55"},{"id":1006,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關於老年病患的譫妄以及失智症的比較，下列敘述何者為非?","options":{"A":"譫妄是突然對時間和地點的認知產生混亂，失智症則是對時間和地點慢慢進展的記憶喪失","B":"譫妄的原因通常和器質性腦病變有關，也和酒精或藥物作用有關","C":"失智症的病患可能會嘗試虛構故事來取代記憶的缺陷","D":"譫妄和失智症一樣，並不會產生危及生命急症的狀況"},"answer":"D","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":1007,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"一位55歲的男性帶著一只布袋到消防分隊，自訴遭到布袋內的毒蛇（如圖）咬傷右手掌，現在右手掌異常疼痛並腫脹，咬傷處並發現清晰的毒牙咬痕與血泡，以下敘述何者為是？","options":{"A":"應該盡速在右手腕處綁上止血帶，以避免毒液擴散","B":"腫脹疼痛的右手掌應立刻給予冰敷以消腫止痛","C":"這是出血性毒蛇咬傷，根據一般原則，龜殼花咬傷以及百步蛇咬傷可以使用同一種血清治療","D":"依據外型判斷，布袋內的毒蛇是百步蛇"},"answer":"D","manualChapter":"CH50"},{"id":1008,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"救護出勤，現場為一名75歲男性老農夫，倒臥半封閉的浴室內，現場充滿農藥味。初評發現病患意識昏迷、全身出汗、口鼻充滿分泌物、瞳孔雙側皆為針狀瞳孔。關於此病患的狀況，以下敘述何者為非？","options":{"A":"這是有機磷農藥中毒，會經由呼吸以及皮膚接觸造成中毒，所以現場為不安全的環境，須盡速將病患移至通風處評估處置。","B":"病患可能會無預警的產生呼吸癱瘓或停止呼吸的現象，須考慮進階呼吸道處置。","C":"病患在送醫途中可能會產生癲癇發作的情況，可用Diazepam治療。","D":"此種農藥中毒的解毒劑是Diazepam"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1009,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"有關酒精對人體的影響，下列敘述何者為非？","options":{"A":"酒精的利尿效果會造成電解質不平衡","B":"長期酗酒可能造成嚴重的消化系統疾病，如：肝硬化.腸胃道出血或胰臟炎","C":"酒精可以擴張血管，所以對心血管系統不會造成任何影響","D":"長期濫用酒精會造成免疫系統的抑制"},"answer":"C","manualChapter":"CH46"},{"id":1010,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於新生兒須接受正壓呼吸的適應症，下列何者為非？","options":{"A":"呼吸暫停","B":"呼吸窘迫","C":"心跳小於每分鐘120下","D":"雖然給予100%氧氣仍有持續發紺的情況"},"answer":"C","manualChapter":"CH48"},{"id":1011,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於嬰幼兒發生陣發性心室上頻脈（PSVT），下列何者為非？","options":{"A":"在嬰兒陣發性心室上頻脈速率多大於每分鐘220下，小孩心跳速率多大於每分鐘180下","B":"可藉由刺激迷走神經而延緩房室結傳導來終結陣發性心室上頻脈，所以應該優先使用頸動脈竇按摩","C":"Adenosine是治療陣發性心室上頻脈首選藥物，快速靜脈注射0.1 mg/kg，也可經由骨針給予","D":"在嬰幼兒，最有效的迷走刺激為冰敷臉10至15秒"},"answer":"B","manualChapter":"CH48"},{"id":1012,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於重度低體溫中心體溫＜攝氏30度病人的照顧，下列何者為是？","options":{"A":"評估呼吸及脈搏10秒，再決定是否開始心肺復甦術","B":"如脈搏摸不到，立即每5分鐘靜脈給予急救藥腎上腺（Epinephrine）1 mg","C":"竇性心搏過慢，須使用心臟節律器","D":"根據2015新版美國心臟學會（AHA）建議，對心跳停止後恢復自發性循環（ROSC）維持32～36℃至少24小時"},"answer":"D","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":1013,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於精神狀態檢查五步驟，下列何者為非？","options":{"A":"觀察病患外觀，例如亢奮／冷漠／混亂／理性","B":"病患言語與情緒特徵","C":"評估病患生命徵象","D":"決定病患定向感（人.事.時.地.物）"},"answer":"C","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":1014,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"老人急症中，關於瞻妄與失智的敘述，下列何者為是？","options":{"A":"瞻妄為對時間和地點慢慢進展的記憶喪失","B":"失智症為突然對時間和地點產生混亂","C":"瞻妄跟器質性腦病變有關，也跟酒精中毒和戒斷、藥物作用、發燒、代謝性疾病、腫瘤有關，多為不可逆","D":"失智症通常和中風、基因、病毒、阿茲海默症有關，多為不可回復"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1015,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"對於常見毒素或毒藥物相對應的解毒劑，下列何者為非？","options":{"A":"有機磷（Organophosphates）：Atropine.PAM（Pralidoxime）","B":"三環抗憂鬱劑（Cyclic antidepressants）：N-acetylcysteine（Fluimucil）","C":"鴉片類麻醉劑（Opiates）：Naloxone","D":"甲醇（Methanol）：Ethanol（乙醇）"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1016,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"關於疑似性侵案件的處理，下列何者為是？","options":{"A":"盡可能問到病患被性侵之詳細過程","B":"應該於現場進行會陰部的檢查，檢視有無傷口","C":"需儘快以生理食鹽水清洗傷口及會陰部","D":"將病患移至救護車以提供病患之隱私"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"]},{"id":1018,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下面這張12導程心電圖，最可能發生在下列何種狀況的病患身上？","options":{"A":"低體溫","B":"急性心肌梗塞","C":"低血鉀","D":"毛地黃中毒"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/1018.png"},{"id":1019,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列於憂鬱症的描述，何者為非？","options":{"A":"可能與腦內生物傳導.內分泌.大腦構造等有關","B":"與基因遺傳無關","C":"與生活壓力.重大創傷.和嚴重失落打擊有關","D":"有些婦女在產後會有憂鬱症的狀況產生"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1020,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列病史或症狀最不可能是肺栓塞的危險因子？","options":{"A":"單侧下肢腫脹水腫","B":"惡性腫病史","C":"長期臥床","D":"糖尿病"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1021,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"根據2015年美國心臟學會與美國兒科醫學會所共同制定的最新版新生兒急救術（Neonatal Resuscitation Program），下列敘述何者為是？","options":{"A":"黃金一分鐘是指情況緊急的新生兒，自開始接觸評估後一分鐘內要開始給予壓胸急救","B":"新生兒是否需要開始急救要先評估是否足月.膚色是否紅潤.有無呼吸與哭泣.與肌張力，上述任一項不正常則要開始進行新生兒急救術的系列評估與處置","C":"足月兒若只需要正壓呼吸，剛開始的時候給予室內空氣（Room air）即可","D":"正壓呼吸的速度為每3～5秒給一口氣"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1022,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"氣喘與急性細支氣管炎都是造成小兒哮鳴（wheezing）的常見呼吸道急症，下列關於兩者的比較敘述何者為是？","options":{"A":"細支氣管炎好發在3歲以上的幼兒，而氣喘兒大多從嬰兒時期就被診斷出來","B":"兩者的X光表現都為單側肺部過度換氣","C":"類固醇為氣喘的建議用藥，但卻不是細支氣管炎病童的標準治療","D":"吸入性氣管擴張劑可減緩兩者的症狀，且縮短兩者的住院天數"},"answer":"C","manualChapter":"CH48"},{"id":1023,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"詢問產婦過去生產史時，常以G與P來記錄。請已經問一位G4P2的孕婦，過去總共流產或墮胎幾次？","options":{"A":"一次","B":"二次","C":"四次","D":"六次"},"answer":"A","manualChapter":"CH49"},{"id":1024,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"救護技術員在野外常需照護傷口，有時甚至可能長達數天。在野外環境，對傷囗照護的描述何者為非？","options":{"A":"靜眽出血也可能會致死","B":"對於有被泥土或其他髒東西污染的傷囗，可以使用針筒配上針頭給予高壓沖洗","C":"在野外可以拿來喝的水就可以用來沖洗傷囗","D":"野外環境下，建議為傷囗暴露24小時之後，再進行初步縫合以避免後續感染發生"},"answer":"D","manualChapter":"CH45"},{"id":1025,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"某青年因感情因素服用大量不明物質。你到達現場時發現病患大吼大叫，神智不清，瞳孔放大，心跳加速，臉色脹紅但皮膚與嘴唇囗腔乾燥。下列何者最可能是此病患服用的物質？","options":{"A":"抗組織胺","B":"安非他命","C":"有機磷","D":"海洛因"},"answer":"A","manualChapter":"CH16"},{"id":1026,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關台灣常見六大毒蛇及其血清的敘述，何者為是？","options":{"A":"青竹絲和無毒的青蛇在外觀上無法區分","B":"龜殼花和百步蛇同屬出血性毒液毒蛇，所以血清可共用","C":"飯匙倩以及雨傘節同屬神經性毒液毒蛇","D":"毒蛇咬傷後，須立即以止血帶綁住近心端，並在局部冰敷，以防止毒液擴散全身"},"answer":"C","manualChapter":"CH50"},{"id":1027,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"急性高山症的敘述，下列何者為非？","options":{"A":"症狀可能在到達高地後數個小時內發生","B":"緊急處置包括給氧及盡快降低高度","C":"吃低碳水化合物食物可預防高山症","D":"位於梨山賓館還不至於會引發高山症"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":1028,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"出勤馬拉松賽事救護，到達現場發現30歲男性，身上別有馬拉松比賽選手的號碼布，意識昏迷對痛無反應，皮膚乾燥，呼吸10秒鐘5下，橈動脈摸得到，耳溫槍顯示41℃。下列敘述何者最正確？","options":{"A":"病人是心肌梗塞，須立即後送至可做心導管的醫院","B":"病人是急性熱衰竭，須立即降溫以保全生命","C":"病人是急性熱中暑，須立即降溫以保全生命","D":"病人是腦中風，需送至二十四小時有神經內外科醫師待命的院"},"answer":"C","manualChapter":"CH55"},{"id":1029,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"長期酗酒對人體消化系統的影響，下列敘述何者最正確？","options":{"A":"長期酗酒病人腸胃道出血的原因只和食道靜脈曲張有關，和胃潰瘍無關","B":"長期酗酒病人會產生肝硬化以及腹水，但是不會影響凝血因子的生成","C":"長期酗酒病人會有急慢性胰臟炎生成的可能性，並誘發糖尿病的產生","D":"長期酗酒病人生成肝硬化的機轉未知，急性胰臟炎則是酒精的毒性引起"},"answer":"C","manualChapter":"CH46"},{"id":1030,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"觀光客誤闖果園，吃了堆放路邊的橘子後昏倒。你出勤到達現場，發現約50歲男性，滿臉汗水眼淚口吐白沫，意識昏迷對痛無反應，皮膚溼冷發紺，呼吸呈現瀕死式呼吸但頸動脈得到，兩側瞳孔呈現針孔。當地果農說，病人吃的橘子是用來毒殺猴子的。下列敘述何者最正確？","options":{"A":"病人是巴拉刈中毒，預後不佳","B":"病人是除蟲菊精中毒，須施打解毒劑並需要呼吸支持","C":"病人是有機磷農藥中毒，解毒劑包括Atropine以及Pralidoxime","D":"病人是年年春中毒，需插管維持呼吸道以避免吸入性肺炎"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH40"]},{"id":1031,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"有關海洋生物產生的毒素，下列敘述何者最正確？","options":{"A":"海洋生物特化的毒液裝置皆是用來防衛的，很少用來捕捉獵物","B":"水母的毒液中毒程度和刺囊細胞刺人的數目有關，和受害者身體狀況無關","C":"海洋生物產生的毒素對熱敏感，將受傷部位浸泡溫水可以破壞毒素","D":"被水母螫傷後須立即以大量清水清洗，如此可以破壞刺囊細胞"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":1032,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"你和山域搜救隊搭乘直升機直達海拔3,311公尺的嘉明湖畔紮營。一夜失眠後，你在隔天清晨發現自己劇烈頭痛，頭重腳輕，食不下嚥。下列敘述何者為是？","options":{"A":"這是感冒症狀，為了完成任務，可往更高海拔的地方前進","B":"這急性高山病，除了降低高度和給氧，沒有任何藥物和其他方式可以治療","C":"如果開始出現步態不穩，可能會在24小時內昏迷","D":"如果會對丹木斯（Diamox）過敏，則沒有其他可替代的治療藥物"},"answer":"C","matchedChapters":["CH44"],"manualChapter":"CH44"},{"id":1033,"source":"第六章 特殊狀況與特定病患(2015-2018).doc","question":"下列有關準自殺行為與自殺病患的描述，何者為是？","options":{"A":"女性的準自殺行為較多，而且女性的自殺成功率也比男性高","B":"酒精成癮病患因為有酒精的鎮靜效果，所以自殺危險性較低","C":"自殺的危險因素包括單身或離婚或分居，退休或沒有職業","D":"自殺及準自殺病患大多是臨時起意，和精神疾病沒有相關"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1034,"source":"第四章 非創傷急症(2012-2014).doc","question":"OHCA現場急救，你在插管時發現看不見氣管入口。下列作法可幫助聲帶三角容易呈現，但何者除外？","options":{"A":"選擇適當大小的喉鏡葉片","B":"將病患雙肩下墊高","C":"插管者姿勢蹲低或趴在地上","D":"請人施行環狀軟骨按壓術"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1035,"source":"第四章 非創傷急症(2012-2014).doc","question":"根據復甦醫學界著名的心臟停止後三階段急救模式（3-Phase Time-Sensitive Resuscitative Model），下列敘述正確的是？","options":{"A":"心跳剛停止後的4分鐘內是circulatory phase，此時徒手的CPR將是最有效的治療","B":"心跳停止後的4～10分鐘是metabolic phase，此時最有效的治療是以各種急救藥物進行處理","C":"心跳停止後的10分鐘以上是electrical phase，此時往往必須靠多次的電擊去顫術才能恢復心跳","D":"以上皆非"},"answer":"D","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1036,"source":"第四章 非創傷急症(2012-2014).doc","question":"ACLS建議在CPR的過程中，應儘量全程使用ETCO2。連續監測，乃是基於三個重要原因，何者除外？","options":{"A":"它是CPR品質的生理性指標之一","B":"它是過度換氣的生理性指標之一","C":"它是確認插管位置是否正確最客觀的工具","D":"它能在不中斷壓胸的情形下顯示病人是否回復心跳"},"answer":"B","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":1037,"source":"第四章 非創傷急症(2012-2014).doc","question":"急救常用的epinephrine。在下列成人重症與給藥的組合，何者錯誤？","options":{"A":"無脈搏急救：1 mg I.V.，每3～5分鐘一次","B":"氣喘重積症發作：0.3 mg S.C.，每20分鐘一次","C":"過敏性休克：0.5 mg S.C.，每5～15分鐘一次","D":"不穩定的緩脈：2～10 mcg／min連續滴注"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":1039,"source":"第四章 非創傷急症(2012-2014).doc","question":"你接獲指揮中心通報，到某安養中心救護病人，求救原因為意識不清，到現場後發現病人平躺床上，且護理人員已將心電圖監測器接上，如下圖：請問下列敘述何者最正確？","options":{"A":"此心電圖一定是PSVT","B":"此病人需立刻同步整流電擊","C":"此病人需立刻非同步去顫電擊","D":"此病人需先確認頸動脈再決定下一步行動"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":1040,"source":"第四章 非創傷急症(2012-2014).doc","question":"關於心包膜填塞，有所謂的貝克式三症狀（Beck's triad），下列何者不包含在內？","options":{"A":"低血壓","B":"頸靜脈怒張","C":"意識不清","D":"心音變弱且模糊"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":1041,"source":"第四章 非創傷急症(2012-2014).doc","question":"某天，你正在分隊作教育訓練時，有來訪民眾突然倒下，與以「快看電擊板」後發現病人心律為VF，你身為訓練有素的EMT-P，馬上給與去顫電擊，請問電擊完後，接下來的最適當處置為？","options":{"A":"予以再次去顫電擊","B":"予以確認病人脈搏","C":"予以繼續高品質CPR","D":"予以插置氣管內管"},"answer":"C","manualChapter":"非創傷"},{"id":1042,"source":"第四章 非創傷急症(2012-2014).doc","question":"心律不整的處理以下何者為非：","options":{"A":"不論快的（tachycardia）與慢的（bradycardia）心律不整都有危及生命的可能性。十二導程心電圖可供判定心律","B":"心房撲動（atrial flutter），心房顫動（atrial fibrillation）屬於快的心律不整，若是因此產生休克，同步整流電擊是可用的治療的方式","C":"Atropine是可以逆轉副交感神經所造成的症狀，可用在有症狀的心搏過緩","D":"針對心律不整且意識狀態改變的病人，儘速取得電擊器，施於至少一次的去顫電擊"},"answer":"D","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1043,"source":"第四章 非創傷急症(2012-2014).doc","question":"以下何者心律可以出現窄的QRS波：","options":{"A":"VF","B":"VT","C":"Torsades de pointes","D":"2度Ⅱ型AV block"},"answer":"D","manualChapter":"CH33"},{"id":1044,"source":"第四章 非創傷急症(2012-2014).doc","question":"70歲男性因呼吸困難來到急診，脈搏40次／min，血壓70／40mmHg，以下處置何者為是：","options":{"A":"儘快做完12 lead的EKG，若為3度AV block，給予同步電擊150 J","B":"O2 I.V. monitor，準備做心導管，因為心肌梗塞可能以bradycardia來表現","C":"病人呈現心因性休克合併肺水腫應優先快速大量體液補充，並密切觀察心律變化","D":"可重複給atropine 0.5 mg I.V. push 5到6次，並觀察病人反應，若反應不佳，節律器使用"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1045,"source":"第四章 非創傷急症(2012-2014).doc","question":"有關心電圖的敘述，下列何為為韭？","options":{"A":"右心房擴大在心電圖上的變化主要為P波變高（＞25 mm）而寬度不變，形成所謂的P pulmonale","B":"左心房擴大的變化主要為P波變寬（＞02秒），形成所謂的P mitrale","C":"右心室肥厚時，QRS的變化主要為胸前導程V5的R波變高、V1的S波變深","D":"三個以上連續出現的心室性期外收縮則稱為short-run ventricular tachycardia"},"answer":"C","manualChapter":"CH16"},{"id":1046,"source":"第四章 非創傷急症(2012-2014).doc","question":"心電圖出現p-R區間逐漸地拉長，終至傳導不下去而出現僅有p波而無跟隨的QRS複合波的情形，這心電圖的判讀是：","options":{"A":"一級房室結傳導阻斷","B":"Mobitz第二型二級房室結傳導阻斷","C":"Mobitz第一型二級房室結傳導阻斷","D":"三級房室結傳導阻斷"},"answer":"C","manualChapter":"CH33"},{"id":1047,"source":"第四章 非創傷急症(2012-2014).doc","question":"下列敘述何者有誤？","options":{"A":"於無意識的病人，最常見的呼吸道阻塞原因為會厭倒下造成","B":"CPR時由施救者囗中吹出的氧氣濃度約17%","C":"CPR經評估脈搏恢復後應維持吹氣每分鐘10～12次","D":"LMA可以在到院前使用以暫時取代氣管內管"},"answer":"A","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":1048,"source":"第四章 非創傷急症(2012-2014).doc","question":"下列打開呼吸道的方式及輔助呼吸道的使用何者較適當？","options":{"A":"非外傷昏迷病人一律以下巴推擠法打開呼吸道","B":"意識昏迷併有鎖骨以上創傷病人一律以壓額抬下巴法來打開呼吸道","C":"教導一般民眾不論創傷或非創傷病患一律使用壓額抬下巴法（頭後斜／下顎上提法）來打開呼吸道","D":"意識不清，顏面部創傷病人使用鼻咽呼吸道較適合"},"answer":"C","manualChapter":"CH15","matchedChapters":["CH15"]},{"id":1049,"source":"第四章 非創傷急症(2012-2014).doc","question":"30歲男性病患在公車站突然發生抽搐的現象。根據他的朋友描述，病患突然倒地，先是全身僵硬，牙關緊閉；接著有適當呼吸，但四肢開始抽動，口吐白沫。病患之前並沒有發生過類似的情形。你發現病患意識不清仰躺於地，已經沒有抽搐的情形。下列何項評估或處置為佳？","options":{"A":"應將病患擺成復甦姿勢，以利囗水等分泌物的引流，同時給予病患高流量的氧氣","B":"病患的意識不清有可能是因為他現正處於抽搐後的混淆期，會慢慢恢復清醒","C":"病患的抽搐屬於所謂的「大發作」，一般包含三個階段，其中以陣攣（clonic）期時問最短","D":"在到院前應測量病患的指尖血糖值，因為低血糖可能是造成病患抽搐的原因"},"answer":"C","manualChapter":"非創傷"},{"id":1050,"source":"第四章 非創傷急症(2012-2014).doc","question":"對於張力性氣胸進行針刺減壓的正確位置是？","options":{"A":"鎖骨中線第二肋間","B":"腋中線第二肋間","C":"腋中線第三肋間","D":"鎖骨中線第三肋間"},"answer":"A","matchedChapters":["背誦題"],"manualChapter":"背誦題"},{"id":1051,"source":"第四章 非創傷急症(2012-2014).doc","question":"對於休克描述，下列何者為韭？","options":{"A":"收縮壓小於90 mmHg就是休克","B":"休克患者會有皮膚冰冷，心跳過速，冒冷汗，呼吸困難症狀","C":"休克主要是組織灌流不足，造成氧氣運送不能應付組織代謝所需","D":"依rate→volume→pump，對休克做初步處理"},"answer":"A","manualChapter":"CH26"},{"id":1052,"source":"第四章 非創傷急症(2012-2014).doc","question":"一個年約60歲男性，路倒、意識昏迷、沒有正常呼吸、頸動脈摸不到脈搏，需要CPR且心電圖監視器如下：請問下列何者正確？","options":{"A":"這種一定有脈搏，不需要CPR","B":"應使用電擊器去顫","C":"應立即CPR","D":"應先打上點滴給予大量的輸液，若未改善就需CPR"},"answer":"C","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/1052.png"},{"id":1054,"source":"第四章 非創傷急症(2012-2014).doc","question":"想要在短時間內找出PEA／Asystole病人可能原因，快速的理學檢查是不可缺的一環，下列何者不包含在內？","options":{"A":"查看病人頸靜脈是否怒張","B":"測量病人的深肌腱反射","C":"聽診病人兩側呼吸音","D":"以超音波檢視病患的心臟、肺部及腹部"},"answer":"B","manualChapter":"CH20"},{"id":1055,"source":"第四章 非創傷急症(2012-2014).doc","question":"您（EMT-P）在擁擠車站的候車室目睹站在前方的男性突然倒地，心臟停止，下列處置何者最正確：","options":{"A":"立即做5個循環的CPR→請他人求救並取得AED→CPR至AED到時，立即以AED分析是否建議去顫（defibrillation）","B":"請他人求救並取得AED→立即做5個循環的CPR後，再以AED分析是否建議去顫","C":"請他人求救並取得AED→CPR至AED到時，立即以AED分析是否建議去顫（defibrillation）→若去顫，立即做5個循環的CPR","D":"立即做5個循環的CPR→請他人求救並取得AED→CPR至AED到時，先檢查是否有脈搏，若無脈搏再以AED分析是否建議去顫（defibrillation）"},"answer":"C","manualChapter":"CH23"},{"id":1056,"source":"第四章 非創傷急症(2012-2014).doc","question":"一位81歲尿毒症患者，每週一、五上午洗腎治療。星期日晚上，忽然呼吸困難、意識昏迷，EMT到達現場時已無脈搏，EKG如下圖：請問以下何者最有可能是造成此病人PEA的原因？","options":{"A":"氣喘發作","B":"高血鉀症","C":"高血糖","D":"低體溫"},"answer":"B","matchedChapters":["需要圖片"],"manualChapter":"CH33","image":"題庫圖片/1056.png"},{"id":1058,"source":"第四章 非創傷急症(2012-2014).doc","question":"有關成人「生存之鏈（chainofsurvival）」排列順序，何者正確？（1）早期心肺甦醒術（early CPR）；（2）早期高級心臟救命術（early ACLS）；（3）早期求救（early access）；（4）早期電擊治療（early defibrillation）；（5）整合之心臟停止後照護","options":{"A":"1，2，3，4，5","B":"2，3，1，4，5","C":"3，1，4，2，5","D":"4，2，1，3，5"},"answer":"C","manualChapter":"CH01","matchedChapters":["CH01"]},{"id":1061,"source":"第四章 非創傷急症(2012-2014).doc","question":"病患的EKG出現asystole時，最早給予最適當的處置為何？","options":{"A":"給BVM O2","B":"給予電擊200～300焦耳","C":"開始CPR","D":"給予epinephrine"},"answer":"C","manualChapter":"CH23"},{"id":1062,"source":"第四章 非創傷急症(2012-2014).doc","question":"一名50歲男性病患，主訴有呼吸困難，血壓低89／30 mmHg，橈動脈弱，心音聽起來非常小聲，頸靜脈怒張。請問病患最有可能的診斷為何？","options":{"A":"Pericardial tamponade心包填塞","B":"Pulmonary contusion肺挫傷","C":"Paradoxical hypotension低血壓","D":"Flail chest連枷胸"},"answer":"A","manualChapter":"呼吸急症","matchedChapters":["CH20"]},{"id":1064,"source":"第四章 非創傷急症(2012-2014).doc","question":"根據2010年美國心臟醫學會的建議，自動體外電擊器在胸部的貼片位置，以下何者是可以接受的？甲：胸壁前方一側壁乙：胸壁前方一後方丙：胸壁前方一左肩胛下方丁：胸壁前方一右肩胛下方","options":{"A":"只有甲可以接受","B":"只有甲、乙可以接受","C":"只有甲、乙、丙可以接受","D":"甲、乙、丙、丁都可以接受"},"answer":"D","manualChapter":"CH23"},{"id":1068,"source":"第四章 非創傷急症(2012-2014).doc","question":"高品質的成人心肺復甦術應該包含以下何者？甲：胸部按壓速率每分鐘至少一百下乙：胸部按壓深度至少五公分丙：每次壓胸應讓胸部盡可能完整回彈丁：胸部按壓時盡可能避免中斷戊：避免過度換氣","options":{"A":"甲、乙、丙、丁、戊","B":"只有甲、乙、丙、丁","C":"只有乙、丙、丁、戊","D":"只有甲、丙、丁、戊"},"answer":"A","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":1069,"source":"第四章 非創傷急症(2012-2014).doc","question":"下列有關心包膜填塞的描述，何者為非？","options":{"A":"臨床表現包括：低血壓、呼吸急促、倦怠無力，甚而發紺","B":"理學檢查方面：頸靜脈怒張，心音變弱且模糊，心包膜摩擦音，有時會有奇脈（pulsus paradoxus）發生","C":"心電圖有時會有電氣交替（electrical alternans）現象","D":"貝克氏三症狀（Beck's triad）即指常見於急性心包膜填塞的「低血壓」「頸靜脈怒張」、以及「心電圖的電氣交替」"},"answer":"D","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":1070,"source":"第四章 非創傷急症(2012-2014).doc","question":"關於心包膜填塞（cardiac tamponade）的敘述，何者為是？","options":{"A":"會造成胸痛，可以比照缺血性胸痛給予MONA","B":"心包膜腔液體過多的話，會先壓迫左心房以及左心室，造成無脈性的電氣活動（PEA）","C":"會影響到回心血流是在心臟收縮期時","D":"高度懷疑心包膜填塞之病患，可以考慮到院前建立靜脈管路，給予生理食鹽水等靜脈注射"},"answer":"D","manualChapter":"CH34"},{"id":1071,"source":"第四章 非創傷急症(2012-2014).doc","question":"病患有陣發性心房纖維顫動（paroxysmal atrial fibrillation）以及WPW的病史，此時發生陣發性上心室心搏過速（PSVT），病患臨床症狀穩定，使用非藥物的方式均無法改善，如要使用藥物應選擇何種藥物較為安全？","options":{"A":"Amiodarone","B":"Adenosine","C":"Digoxin（毛地黃）","D":"Beta blockers（乙型阻斷劑）"},"answer":"A","manualChapter":"CH16"},{"id":1072,"source":"第四章 非創傷急症(2012-2014).doc","question":"一名30歲男性病患被路人發現倒臥橋邊，經高級救護技術員到達現場評估後發現摸得到微弱的頸動脈，心臟監視器呈現下列心律，何者為是？","options":{"A":"Torsades de pointes","B":"Ventricular fibrillation","C":"Ventricular tachycardia","D":"Atrial fibrillation"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/1072.png"},{"id":1073,"source":"第四章 非創傷急症(2012-2014).doc","question":"[承接題：一名30歲男性病患被路人發現倒臥橋邊，經高級救護技術員到達現場評估後發現摸得到微弱的頸動脈，心臟監視器呈現下列心律，何者為是？]對於此病患可能之病因，下列何者為是？（1）低血鉀（2）低血鎂（3）三環抗憂鬱劑中毒（4）低血鈣","options":{"A":"（1）（2）（3）","B":"（2）（3）（4）","C":"（1）（3）（4）","D":"（1）（2）（3）（4）"},"answer":"D","manualChapter":"CH33","image":"題庫圖片/1073.png"},{"id":1076,"source":"第四章 非創傷急症(2012-2014).doc","question":"在心臟整流（cardioversion）的過程中，病患突然變成VF，你應該馬上採取下列那一步驟？","options":{"A":"開始胸部按壓，建立氣管內管","B":"立即靜脈快速注射epinephrine 1 mg然後給予去顫電擊","C":"關掉同步開關，立即進行非同步的心臟電擊","D":"立即進行第二次同步的心臟整流"},"answer":"C","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":1077,"source":"第四章 非創傷急症(2012-2014).doc","question":"VF電擊完，CPR兩分鐘五個循環後，心電圖監視器的心律呈現二度二型房室傳導障礙（2度AV block typeⅡ）波形，你下一步該如何？","options":{"A":"檢查頸動脈是否有脈搏","B":"給予atropine 0.5 mg靜脈注射","C":"給予體外經皮式心律調節器（TCP）","D":"已急救成功，趕快將病患送醫"},"answer":"A","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1078,"source":"第四章 非創傷急症(2012-2014).doc","question":"一位年輕病患因心悸至急診，EKG顯示PSVT，心跳180／min，血壓120／80mmHg，呼吸尚平順，下列處置何者最優先？","options":{"A":"跟病患解釋後，予以鎮靜，給予同步電擊50焦耳","B":"給予adenosine 6 mg快速I.V.注射","C":"給予amiodarone 150 mg，I.V.滴注10分鐘","D":"確定無carotid bruits後，給予頸動脈竇按摩"},"answer":"D","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1079,"source":"第四章 非創傷急症(2012-2014).doc","question":"心跳停止的病患（OHCA）恢復自發性循環（ROSC）之後，依據ACLS 2010年的建議，哪種病患應該進行低體溫治療？","options":{"A":"所有ROSC病患皆應進行","B":"僅限於高度懷疑心肌梗塞病患","C":"僅限於意識不清無法聽從指令的病患","D":"僅限於成人非創傷病患"},"answer":"C","matchedChapters":["CH24"],"manualChapter":"CH24"},{"id":1080,"source":"第四章 非創傷急症(2012-2014).doc","question":"依ACLS 2010年建議，須作15：2按壓換氣比的情況是？","options":{"A":"成人急救，兩名一般施救者","B":"兒童急救，一名一般施救者","C":"兒童急救，兩名專業醫療人員","D":"新生兒急救，一名專業醫療人"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":1081,"source":"第四章 非創傷急症(2015-2018).doc","question":"年輕男性在吃了花生之後突然出現呼吸困難，以下作法何者為非？","options":{"A":"若頸部出現喘鳴聲，而周邊呼吸音降低，應考慮進行哈姆立克法","B":"若血中氧氣濃度下降可考慮先給正壓呼吸","C":"若有起紅疹、血壓降低，可考慮給予epinephrine0.3～0.5mg皮下或肌肉注射","D":"若正壓呼吸仍無法改善血氧濃度，可給予LMA或Combitube做為進階呼吸道"},"answer":"D","manualChapter":"CH40"},{"id":1082,"source":"第四章 非創傷急症(2015-2018).doc","question":"一位平時有酒癮的病患，突然發生抽搐，造成頭部外傷，且意識不清，以下作法何者為非？","options":{"A":"應測量血糖並給予維他命B1補充","B":"為了避免影響判斷是否為酒精戒斷所引起的抽搐，應避免給予Lorazepam此類鎮靜藥物","C":"此時不應給予Flumazenil此類鎮靜劑之拮抗藥物，因可能再引發抽搐","D":"有可能是酒精造成的意識不清，但仍需注意是否有腦出血的可能"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":1083,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於有冠狀動脈性心臟病病史的急性胸痛病患，以下敘述何者為非？","options":{"A":"進行到院前12導程心電圖檢查有助於縮短ST波段上升型心肌梗塞進行心導管的時問","B":"對於典型胸痛且無相關禁忌症的病患，應給予Aspirin服用","C":"建議給予氧氣鼻管3L/min，以改善潛在的心臟缺氧狀況","D":"如果使用NTG，無論男女應先確認病患有無服用Viagra這類磷酸二酯抑制劑藥物"},"answer":"C","manualChapter":"CH34"},{"id":1084,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於穩定規則窄QRS波頻脈，以下敘述何者為非？","options":{"A":"若發生於孕婦身上，因可能影響胎兒心律，因此不應使用Adenosine","B":"除了Adenosine之外，亦可選擇乙型腎上腺受體阻斷劑、毛地黃加以治療","C":"若使用鈣離子阻斷劑不必擔心引發有氣喘病史病患的氣喘","D":"若藥物治療無效，可考慮電擊整流"},"answer":"A","manualChapter":"CH49"},{"id":1085,"source":"第四章 非創傷急症(2015-2018).doc","question":"一位25歲年輕女性，出現眼睛凸出、脖子腫的情形，以下敘述何者為非？","options":{"A":"心電圖可能出現竇性心搏過速或心房纖維顫動","B":"病史上常可發現體重減輕、怕熱的情形","C":"此疾病俗稱「大脖子」，應補充碘鹽","D":"若出現發燒、意識不清、肚子痛的情形，是危及生命的緊急狀況，應立刻就醫"},"answer":"C","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":1086,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於身上突然出現多處瘀斑的病患，以下敘述何者為非？","options":{"A":"此為凝血功能障礙，應檢查血小板數量與功能以及肝臟製造凝血因子能力","B":"血友病病患雖無外傷，也可能有自發性出血，但多以深部組織出血為主","C":"對於自發性出血的病患，為避免造成傷口及出血不止，不應進行靜留置針注射","D":"即便血小板數量正常，仍有可能出現自發性的出血"},"answer":"C","manualChapter":"CH39"},{"id":1087,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於過敏的描述，以下敘述何者為非？","options":{"A":"局部性的過敏反應並不會影響到全身，治療最有效的藥物是Diphenhydramine","B":"嚴重過敏病患休克的原因是因為呼吸道阻塞、水腫，最好的治療是給予氣管擴張劑","C":"如果出現聲音沙啞舌頭水腫、喘鳴等，應評估是否要早期插管","D":"嚴重過敏最有效的治療藥物是腎上腺素"},"answer":"B","manualChapter":"CH16"},{"id":1089,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於疥瘡，以下敘述何者為非？","options":{"A":"若病患有在使用類固醇，病症會較不典型，不易診斷","B":"治療疥瘡常用的疥瘡乳劑不適用於孕婦","C":"疥瘡患者接觸過的床單、被褥、枕頭套應以塑膠袋密封兩週使成蟲及蟲卵死亡","D":"疥蟲孵化只需3天，因此若懷疑接觸疥瘡患者，一週以上沒有症狀，就不用擔心感染"},"answer":"D","manualChapter":"CH42"},{"id":1091,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關於成人呼吸窘迫症（adult respiratory distress syndrome,ARDS）的敘述，下列何者為非？","options":{"A":"是一種猛爆型的呼吸衰竭","B":"急性的肺發炎和廣泛性的肺泡及微血管傷害為特徵","C":"這症候群通常不會因為其他的傷害或疾病所引起","D":"這類病患的肺部會變得又濕又重，肺泡彈性變差使氣體擴散能力大幅下降"},"answer":"C","manualChapter":"CH35"},{"id":1092,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關洛杉磯到院前腦中風評量表的評量項目，以下敘述何者為非？","options":{"A":"症狀發生在24小時內。","B":"下列三項中任何之一有單側不對稱的情形：臉部表情、握力、手臂力量的強度","C":"年紀大於35歲","D":"病患平常不是坐輪椅或長期臥床"},"answer":"C","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":1094,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關於肺動脈栓塞的維爾氏評分系統（well's scoring system），下列敘述何者為是？","options":{"A":"臨床上懷疑深部靜脈血栓：3.0分","B":"其他替代診斷可能性低：3.0分","C":"在過去四周曾接受外科手術或臥床少動：1.5分","D":"以上敘述皆為正確"},"answer":"D","manualChapter":"CH34"},{"id":1095,"source":"第四章 非創傷急症(2015-2018).doc","question":"3有關於急性肺水腫無合併低血壓及休克第一線治療的敘述，下列何者為非？","options":{"A":"furosemide（lasix）靜脈注射是第一線治療","B":"morphine靜脈注射是第一線治療","C":"nitroglycerin舌下片是第一線治療，nitroglycerin靜脈滴注則是第二線治療","D":"此類病患心臟不佳，氣管插管的刺激太大會惡化病情，故絕不考慮使用"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":1097,"source":"第四章 非創傷急症(2015-2018).doc","question":"65歲男性病患因為意識昏迷，家屬發現後報案，指揮中心派遣高救隊到現場，現場患者意識昏迷對痛沒有反應，膚色蒼白濕冷，呼吸每分鐘6下，脈搏每分鐘24下，血壓50/量不到mmHg，pulse oximeter：60%；病患過去病史為腎衰竭合併洗腎，但根據家屬表示，病患已經有半個月沒有接受血液透析治療，家屬也表示病患拒絕插管以及任何壓胸電擊等急救治療，只要給予藥物；下列敘述何者為是？（送醫時間30分鐘）","options":{"A":"病患不可能是高血鉀引起的腎衰竭病患的併發症","B":"可以線上醫療指導靜脈注射calcium及sodium bicarbonate來治療","C":"病患是腎衰竭患者，因此要絕對限水，不可以幫他打上點滴","D":"腎衰竭病患若是有接受血液透析治療，就絕對不可能有尿液的產生"},"answer":"B","manualChapter":"CH41"},{"id":1098,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關致命性過敏反應，下列敘述何者為非？","options":{"A":"過敏性抗原進入人體後造成白血球釋放組織胺以及白三烯素等物質有關","B":"組織胺以及白三烯素會造成血管擴張以及氣管痙攣而引起循環崩潰和休克進而致命","C":"人體接受抗原的刺激次數越多，越容易產生免疫作用而使過敏反應越輕微","D":"治療的藥物包括腎上腺素、抗組織胺以及類固醇等"},"answer":"C","manualChapter":"CH40"},{"id":1099,"source":"第四章 非創傷急症(2015-2018).doc","question":"44歲男性病患在與朋友飲酒後吐大量鮮血，指揮中心派遣高救隊到現場，現場病患臉色蒼白冒冷汗，意識對痛有反應，脈搏每分鐘120下，血壓80/50mmHg，呼吸每分鐘30次，過去病史以及過敏史不詳，下列敘述何者為是？1.病患疑似為上消化道出血合併休克，Mallory-Weiss症候群不可能為病因2.病患一定有解黑便的症狀3.在時間以及裝備許可的情況下，病患應接受生理食鹽水的輸液治療4.長期酗酒的病患有可能是因為食道靜脈曲張出血造成大量吐血","options":{"A":"1，2，3，4","B":"2，3","C":"3，4","D":"1，4"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":1100,"source":"第四章 非創傷急症(2015-2018).doc","question":"90歲男性病患，否認特別過去病史，因全身虛弱而打119求救，到場後發現病患意識清楚、呼吸平順，生命徵象：血壓142/68mmHg、脈搏35/min、呼吸18/min、血氧濃度room air100%，無單側肢體無力等神經學症狀，僅主訴虛弱無力而無其他症狀。貼上心律監視器後，心電圖顯示如下：此病患的後續處置何者為是？","options":{"A":"優先給予Atropinemg靜脈注射，每3～5分鐘可重複，最大劑量3mg","B":"立即使用經皮心臟節律器","C":"靜脈滴注Amiodarone 150 mg 10分鐘，需要時可重複","D":"觀察症狀並持續監測心律"},"answer":"D","manualChapter":"CH33","matchedChapters":["未分類"],"image":"題庫圖片/1100.png"},{"id":1103,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於後天免疫缺乏症候群（愛滋病）病患的處置原則何者為非？","options":{"A":"愛滋病病患在無症狀潛伏期不易由外表觀察得知，而病患也往往不知道自己已經被感染","B":"對於已知有愛滋病之患者也不要輕忽同時有其他傳染性疾病，例如肺結核的可能","C":"要避免發生針扎事件，萬一不幸發生時，應該立刻擠壓傷口，使血液流出並在流動水下清洗傷口五分鐘","D":"感染愛滋病毒感的機率，遠比B型肝炎來得低，若針扎事件對象已確知有愛滋病之病患，可待檢驗確診後，再開始使用抗病毒藥物以降低感染率"},"answer":"D","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":1105,"source":"第四章 非創傷急症(2015-2018).doc","question":"一名65歲男性過去僅有高血壓病史，無抽搐或癲癇之病史，突然感到右側肢體無力無法行走而立即打119求救，你到現場發現嘴歪、口齒不清、右手無法平舉現象，他的血糖130mg/dL、血壓210/80mmHg，以下明何者為非？","options":{"A":"依據辛辛那提到院前腦中風評量表（CPSS），該病患有85%可能性為腦中風","B":"依據洛杉磯到院前腦中風評量表（LAPSS），其陽性預測值為97%","C":"為了改善血液灌流不足，可以給予含糖的輸液，以增加腦細胞之存活性","D":"血栓溶解劑（t-PA）被證實可以有效減輕缺血性腦中風的神經症"},"answer":"C","manualChapter":"CH36"},{"id":1107,"source":"第四章 非創傷急症(2015-2018).doc","question":"一位65歲高血壓、心臟病合併慢性腎病之病患，近日經常噁心、嘔吐及食慾不佳，因呼吸困難而打119求救，你到達現場發現雙側肺音囉音，監視器顯示如下圖，以下何者為非？","options":{"A":"此病患呼吸困難可能是因為發生肺水腫","B":"此病患有可能發生致命性心律不整而猝死，建議可以使用calciumchloride","C":"嚴重高血鉀（＞6.5mmol/L）因腎衰竭引起是罕見的","D":"此病患接受規則血液透析治療後不久，發生頭痛、嘔吐急抽搐現象，可能發生不平衡症候群"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/1107.png"},{"id":1110,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關全身立即致命過敏性休克，下列敘述何者為非？","options":{"A":"組織胺釋放","B":"發生血管舒張","C":"心輸出增加，循環崩潰與休克","D":"發生氣管痙攣"},"answer":"C","manualChapter":"CH40"},{"id":1111,"source":"第四章 非創傷急症(2015-2018).doc","question":"根據2010年美國心臟醫學會的建議，以下關於成人心肺復甦術的敘述，何者錯誤？","options":{"A":"腎衰竭病患如果突然發生心肺功能停止時，要把嚴重高血鉀列入鑑別診斷當中","B":"病史詢問時如發現心肺功能停止病患有腎衰竭病史，在醫療指導醫師指示下，可以考慮靜脈注射calcium及sodium bicarbonate","C":"部分不平衡症候群（disequilibrium syndrome）患者於透析的過程中或是結束後八小時內發生","D":"不平衡症候群（disequilibrium syndrome），是末期腎臟病患者因透析過度緩慢所產生的中樞性神經症狀群"},"answer":"D","manualChapter":"CH41"},{"id":1113,"source":"第四章 非創傷急症(2015-2018).doc","question":"以下何者心律是出現窄的QRS波？","options":{"A":"VF","B":"VT","C":"Torsadesdepoints","D":"2度II AV block"},"answer":"D","manualChapter":"CH16"},{"id":1114,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於小孩之CPR，最重要優先之處置是？","options":{"A":"快速建立IV","B":"儘快給予電擊","C":"維持呼吸道通暢與呼吸動力","D":"注射藥物Epinephrine"},"answer":"C","manualChapter":"CH13"},{"id":1115,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於呼吸道處置與給藥的叙述，何者正確？","options":{"A":"有顔面創傷，或疑顱底骨折的病患，最適合使用鼻咽呼吸道","B":"若患者頭或頸部受傷，應使用推顎法，避免移動頸部","C":"LMA（喉罩氣道）可以防止吸入性肺炎，是很好的氣管插管替代品","D":"當建立氣管内管後，非脂溶性的藥物皆可經由氣管内管給藥"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1116,"source":"第四章 非創傷急症(2015-2018).doc","question":"電擊與雷擊的急救處理原則，以下何者為非？","options":{"A":"閃電擊中，多人需急救時，應睬反向檢傷分類","B":"閃電擊中導致心臟停止比其他原因造成者，具有較高救活成功率，因些儘管在急救前心臟停止比較久，努力急救仍可能有效地救治","C":"閃電擊中常常造成VF，在急救過程需要多加注意是否需要去顫","D":"雖然大的電流比較會造成嚴重的傷害，家用電也有致死的可能"},"answer":"C","manualChapter":"CH30"},{"id":1117,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於懷孕婦女的急救，以下何者為非？","options":{"A":"應先急救母親，再考慮胎兒","B":"孕婦只要很小的失血量，就會出現壓下降與週邊灌流不足（休克）的徵象","C":"若懷孕大於24週，孕婦儘可能保持左側躺的姿勢。右髖部墊高、長背板左傾15～30度，以減少子宮對主動脈、下腔靜脈的壓迫","D":"當母親心跳停止5分鐘內，剖腹產救出大於24～25週的胎兒，此時胎兒存活機率最高"},"answer":"B","manualChapter":"CH49"},{"id":1118,"source":"第四章 非創傷急症(2015-2018).doc","question":"對於休克描述，下列何者為非？","options":{"A":"只要收縮壓小於90mmHg就是休克","B":"休克患者會有皮膚冰冷，心跳過速，冒冷汗，呼吸困難症狀","C":"休克主要是組織灌流不足，造成氧氣運送不能應付組織代謝所需","D":"可依rate、volume、pump（律水壓）的原則，對休克依序做初步處理"},"answer":"A","manualChapter":"CH26"},{"id":1119,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關量張十二導程心電圖的描述何者為非？","options":{"A":"此為Sinus Bradycardia","B":"心率約每分鐘30～36次","C":"心臟下壁的急性心肌梗塞","D":"V1～V4的ST段下降是對應變化（reciprocal changes）"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/1119.png"},{"id":1120,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關內分泌及代謝急症的配對，何者為非？","options":{"A":"愛迪生疾病（Addison disease）：腎上腺素不足","B":"黏液性水腫（Myxedema）：腎上腺素亢進","C":"酮酸血症：胰島素的缺乏","D":"葛瑞夫茲病：甲狀腺機能亢進"},"answer":"B","manualChapter":"CH37"},{"id":1121,"source":"第四章 非創傷急症(2015-2018).doc","question":"50歲男性，求救原因為意識改變，到達現場時，家人描述今天早上開始解數次大量的便剛突然大吐血了一次後就不省人事，過去病史有肝硬化與肝癌，現場初評發現，病患皮冷，呼吸淺快有雜音，血自口鼻持續冒出，頸動脈微弱且橈動脈摸不到，脈搏約135下/分，呼吸次數約25次/分，血氧濃度85%，意識對痛有些微反應，下列哪個步驟應最優先處置？","options":{"A":"給予高濃度氧氣面罩，提升血氧濃度","B":"接上三導程心律監測器，評估心律","C":"打上兩條大號靜脈管路，快速輸液","D":"清除口鼻血塊，維持呼吸道暢通"},"answer":"D","manualChapter":"非創傷","matchedChapters":["Combine"]},{"id":1122,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關血液的組成與功能，何者為非？","options":{"A":"成人的血液約佔體重的1/13。","B":"血球組成中，最多的是血小板。","C":"血漿中水約占了90%。","D":"血漿中的白蛋白可維持血液與組織液間滲透壓的恆定性"},"answer":"B","manualChapter":"CH12"},{"id":1123,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列有關嚴重高血鉀的處置與敘述，何者為非？","options":{"A":"靜脈注射Calcium可以最快減少高血鉀對心臟的影響","B":"靜脈注射Sodium bicarbonate可以將鉀離子移除到身體外面","C":"心電圖可以看到QRS變寬和高聳的T波","D":"容易發生在末期腎病變的病患身上"},"answer":"B","manualChapter":"CH16"},{"id":1126,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於藥物給予與路徑選擇，下列何者為非？","options":{"A":"幫孕婦建立IV路徑一般建議在下半身（橫膈以下）","B":"若緊急時無法建立IV路徑，除了IM肌肉注射，Naloxone也可以由氣管內管給藥","C":"大部份的急救藥物都可以由IO骨內注射給予，吸收速度相當於IV靜脈注射","D":"在心臟衰竭合併喘鳴、或洗腎合併血壓降低病患身上給予點滴靜脈輸注須特別小心謹慎，因流速太快可能引發肺水腫導致呼吸困難惡化"},"answer":"A","manualChapter":"CH49"},{"id":1127,"source":"第四章 非創傷急症(2015-2018).doc","question":"您幫一位OHCA病患緊急氣管內插管，插上後幫病患接上潮氣末二氧化碳監測器（end_tidal C02 monitor/Capnography），繼續進行CPR後，二氧化碳濃度（PETCO2）監測時二氧化碳分壓一直達不到10mmHg，可能原因有好幾個，但以下何者為非？","options":{"A":"心肺功能停止過久，肺部血流無循環","B":"氣管內管前端反折或被血塊等異物塞住","C":"插管位置過深","D":"壓胸下壓深度不足，CPR品質效率不好"},"answer":"C","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":1128,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關影響腦部灌流壓力高低，與下列何項因素無關？","options":{"A":"收縮壓","B":"舒張壓","C":"顱內壓","D":"頸動脈壓"},"answer":"D","manualChapter":"CH26"},{"id":1129,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關周邊型眩暈和中樞型眩暈的區分，下列敘述何者為非？","options":{"A":"周邊型眩暈多因內耳迷路問題造成","B":"周邊型眩暈經多次轉頭可減輕眩暈程度","C":"中樞型眩暈的眼震方向多為單向，且合併對側肢體無力","D":"中樞型眩暈常合併如手腳不協調等症狀"},"answer":"C","manualChapter":"CH36"},{"id":1130,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關腎上腺危象的常見臨床表現，下列敘述何者為非？","options":{"A":"常合併高滲透壓高血糖非酮酸性昏迷症狀表現。","B":"多合併鈉、鉀離子等電解質異常","C":"多合併低血壓","D":"需補充大量輸液"},"answer":"A","manualChapter":"CH37"},{"id":1131,"source":"第四章 非創傷急症(2015-2018).doc","question":"你執行創傷救護時，傷患告訴你他有人類免疫病毒（HIV）感染但有規則服藥、且上次回診時醫師說他的病毒量已測不到。請問下列敘述何者為非？","options":{"A":"若病毒量已經量測不到，即不具有傳染性","B":"不論是接觸懷疑感染或已確認感染的病人，都應須遵守標準防護措施","C":"若遇到此類患者，應戴兩層手套並穿B級以上防護衣才能避免感染","D":"落實個人防護觀念及步驟是最有效的保護方法"},"answer":"C","manualChapter":"CH05"},{"id":1132,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於中風的敘述，何者為非？","options":{"A":"單純從病人臨床上的症狀表現很難區分此病人發生出血性或缺血性腦中風","B":"一般急性腦中風除了大片腦梗塞、腦出血或腦幹中風外，鮮少會造成病患意識不清，所以如病患發生意識不清時，應先排除其他造成病患意識不清的情形，例如低血糖","C":"一般來說，缺血性腦中風特別容易發生在睡眠中或剛睡醒時","D":"如病患之辛辛那提到院前腦中風評量表為陽性時，由於其可能是腦中風的機會高達七成，而高血糖會造成腦中風病患腦部進一步的傷害，因此就算檢測發現病患發生低血糖的情形，也不應給予50%的葡萄糖水或含糖輸液"},"answer":"D","manualChapter":"CH36"},{"id":1133,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於心電圖操作與判定的敘述，下列何者為非？","options":{"A":"黏貼十二導程的胸前導程時，V3是貼在左胸第五肋間的鎖骨中線處","B":"一般正常的PR區間（PR interval）為0.12～0.20秒","C":"V1和V2導程主要是在觀察心室中膈的解剖位置","D":"右心室傳導束傳導阻斷（right bundle branch block，RBBB）在心電圖最大的特徵是在V1及V2導程出現RSR'型態（RSR' pattern）"},"answer":"A","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":1134,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於糖尿病酮酸血症（DKA）常見的臨床症狀與表徵，下列何者為非？","options":{"A":"心搏過速","B":"姿態性低血壓","C":"蒼白濕冷的皮膚","D":"腹痛"},"answer":"C","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":1135,"source":"第四章 非創傷急症(2015-2018).doc","question":"中年男性昏倒求救。你在救護車上幫他接上三導程心電圖如下。請問此心律為何？","options":{"A":"第二度第一型房室傳導阻滯","B":"第二度第二型房室傳導阻滯","C":"第三度房室傳導阻滯","D":"竇性心搏過緩併單型性早期心房收縮"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/1135.png"},{"id":1136,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於心包膜填塞的貝克式三症狀（Beck's triad），下列何者不包含？","options":{"A":"低血壓","B":"頸靜脈怒張","C":"意識不清","D":"心音變弱且模糊"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":1138,"source":"第四章 非創傷急症(2015-2018).doc","question":"有關院外「成人生存之鏈（Adult chain of survival）」之排列順序，何者正確？1.進行快速去顫（rapid defibrillation）2.儘早CPR，並強調先作胸部按壓（early CPR）3.立即確認心臟停止並啟動緊急應變系統（Immediate recognition and activation）4.整合的心臟停止後照護（integrated post-cardiac arrest care）5.有效高級救命術（effective advanced life support）","options":{"A":"1，2，3，4，5","B":"2，3，1，5，4","C":"3，2，1，5，4","D":"5，2，1，3，4"},"answer":"C","manualChapter":"CH24"},{"id":1139,"source":"第四章 非創傷急症(2015-2018).doc","question":"50歲男性，與友人聊天時，突然昏倒不醒人事，EMT到現場時發現病患對痛有反應，左側肢體無力。目前生命徵象為：血壓210/140mmHg，脈搏86次/分鐘，呼吸22次/分鐘，SPO2 90％。以下敘述何者為非？","options":{"A":"可給與氧氣","B":"可能為腦血管疾病","C":"為預防呼吸抑制的發生，應放置oral airway","D":"可檢測病人的血糖值（one touch）"},"answer":"C","manualChapter":"非創傷"},{"id":1140,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於「Nitroglycerin」下列敘述何者為非？","options":{"A":"可有效治療狹心病（angina pectoris）","B":"可降低鬱血性心衰竭（CHF）病人之前後負荷（preload）","C":"主要作用是增加心肌收縮，有效治療心臟衰竭","D":"可能會造成低血壓（hypotension）"},"answer":"C","manualChapter":"CH16"},{"id":1141,"source":"第四章 非創傷急症(2015-2018).doc","question":"請問此為何種心率？","options":{"A":"degree AV block","B":"Mobitz type I","C":"Mobitz type II","D":"degree AV block"},"answer":"C","manualChapter":"CH33","image":"題庫圖片/1141.png"},{"id":1143,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列何者不屬於體液分佈形休克（Distributive Shock）？","options":{"A":"敗血性休克","B":"神經性休克","C":"過敏性休克","D":"張力性氣胸導致休克"},"answer":"D","manualChapter":"CH26"},{"id":1145,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於會厭炎的敘述，何者為非？","options":{"A":"某些族群罹患會厭炎的盛行率比較高，包括免疫功能低下、脾臟切除的病患","B":"引起會厭炎的病原菌，以A型嗜血桿菌感染最常見","C":"會厭炎通常會使病患出現發燒和喉嚨痛","D":"到院前照護主要是給予病患支持性療法，但要特別注意病患是否出現呼吸窘迫的徵兆"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1146,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於周邊型眩暈和中樞型眩暈的敘述，何者為非？","options":{"A":"周邊型眩暈病患會出現聽力減弱、耳鳴、耳痛及腫脹","B":"周邊型眩暈病患發生眼震時，為多方向眼震","C":"多次轉頭不會減輕中樞型眩暈病患的眩暈程度","D":"中樞型眩暈病患可出現言語不清、站立不穩、手腳不協調等其他神經症狀"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":1147,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列何者為典型胸痛的表現？","options":{"A":"與呼吸相關的胸痛","B":"與姿勢相關的胸痛","C":"有壓痛點的胸痛","D":"與運動相關的胸痛"},"answer":"D","manualChapter":"CH34"},{"id":1148,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列關於內分泌及代謝急症的敘述，何者為非？","options":{"A":"糖尿病酮酸血症很少會導致病患出現嚴重的意識不清，因此對於出現意識不清的病患，必須要考慮同時合併其他的疾病，例如頭部外傷、中風等","B":"高滲透壓高血糖非酮酸性昏迷的早期症狀通常和水分的流失有關，包括心悸、疲累、意識混亂甚至昏迷","C":"甲狀腺風暴臨床的徵狀包括嚴重的心跳加速、心臟衰竭、心律不整、體溫升高、休克、意識混亂甚至昏迷等","D":"腎上腺危象的病患，容易有血糖濃度上升、鈉鉀離子不平衡、身體含水量流失及血壓下降，使得身體無法維持正常血液循環，而導致病患有生命危險情形"},"answer":"D","manualChapter":"CH37","matchedChapters":["CH37"]},{"id":1149,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列對於腸胃急症的敘述，何者為非？","options":{"A":"大部分的急性腸胃炎是由細菌所引起的，包括沙門氏桿菌、大腸桿菌、志賀氏桿菌等","B":"機械性腸阻塞最常見的原因為手術後的粘黏","C":"憩室炎的臨床症狀包括發燒與腹痛。而因為憩室通常在乙狀結腸較多，因此常常是以左下腹痛為表現","D":"痔瘡分為內痔與外痔，以肛門的梳狀線為分界"},"answer":"A","manualChapter":"CH38"},{"id":1150,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列對於血液疾病的敘述，何者為非？","options":{"A":"地中海型貧血屬於小球性貧血","B":"缺乏第八因子稱為B型血友病","C":"如果血小板小於20,000/uL，可能引起重要器官自發性出血，如腦出血、腸胃道或肺部出血","D":"非何杰金氏淋巴癌早期通常沒有明顯症狀，大多數人開始的症狀就是頸部、腋下或鼠蹊部出現腫大的淋巴結、發燒、夜間流汗或疲倦等"},"answer":"B","manualChapter":"CH39","matchedChapters":["CH39"]},{"id":1151,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列對於腎臟泌尿系統急症的敘述，何者為非？","options":{"A":"在台灣最常見的泌尿道結石成分為草酸鈣","B":"泌尿道感染大多是逆行性的感染，也就是細菌經由尿道逆行而上，造成尿道炎、膀胱炎或急性腎盂腎炎","C":"不平衡症候群的症狀表現可以從輕微的頭痛、頭暈，以至嚴重的意識不清及抽搐","D":"急性副睪炎的病患，讓其躺臥時，並用手輕輕地往上抬起疼痛側的睪丸，並不能緩解病患的疼痛感"},"answer":"D","manualChapter":"CH41"},{"id":1152,"source":"第四章 非創傷急症(2015-2018).doc","question":"下列傳染性疾病，何者非為蟲媒傳染病？","options":{"A":"流行性斑疹傷寒","B":"萊姆病","C":"Q熱","D":"黃熱病"},"answer":"C","manualChapter":"CH43"},{"id":1154,"source":"第四章 非創傷急症(2015-2018).doc","question":"許多藥物可能引發血壓偏低，但下列藥物何者為非？","options":{"A":"Amiodarone","B":"Naloxone","C":"Nitroglycerin","D":"Lasix（Furosemide）"},"answer":"B","manualChapter":"CH16"},{"id":1155,"source":"第四章 非創傷急症(2015-2018).doc","question":"請問下列何種診斷較不會出現喘鳴（stridor）？","options":{"A":"肺動脈栓塞","B":"火場救出傷患疑似吸入性灼傷","C":"過敏產生的上呼吸道血管性水腫","D":"急性會厭炎"},"answer":"A","matchedChapters":["Combine"],"manualChapter":"非創傷"},{"id":1156,"source":"第四章 非創傷急症(2015-2018).doc","question":"34歲女性，求救原因為心悸併呼吸困難與腹瀉。初評生命跡象為心跳204下/分，血壓126/74mmHg，呼吸30下/分，血氧99%（無用氧下），體溫38.1℃。上救護車後，發現病人身材消瘦，意識躁動不安。執行12導程心電圖如下：請問此病人最不可能是以下哪一種鑑別診斷？","options":{"A":"葛瑞夫茲病（Grave’s disease）合併甲狀腺風暴(thyroid storm)","B":"糖尿病酮酸血症（Diabetic ketoacidosis）","C":"庫欣氏症候群（Cushing syndrome）","D":"可能使用古柯鹼或安非他命等違禁藥物"},"answer":"C","manualChapter":"CH33","matchedChapters":["NeedImage"],"image":"題庫圖片/1156.png"},{"id":1157,"source":"第四章 非創傷急症(2015-2018).doc","question":"64歲女性，求救原因為剛剛看電視時突發右側肢體無力。初評生命跡象為血壓169/63mmHg，心跳54下/分，呼吸12下/分，給予鼻導管氧氣2L/分後血氧99％，體溫36.1℃。家人說她平時有吃高血壓跟糖尿病藥物，35分鐘之前突然走路往右偏倒，說話也咬字不清。依據中風流程AHA/ASA Guidelines，以下步驟何者必須先執行？","options":{"A":"12導程心電圖","B":"快速血糖檢測","C":"腦部電腦斷層掃描","D":"腦部核磁共振掃描"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":1158,"source":"第四章 非創傷急症(2015-2018).doc","question":"關於快速程序插管（Rapid Sequence Intubation，RSI），以下七個P的口訣步驟，正確順序為？","options":{"A":"Preparation準備→Pretreatment前置給藥→Positionin擺位→Preoxygenation前置給氧→Paralysis鎮靜肌肉麻痺Placement插管→Post-intubationmanagement插管後處置。","B":"Preparation準備→Pretreatment前置給藥→Positionin擺位→Paralysis鎮靜肌肉麻痺→Preoxygenation前置給氧→Positionin擺位→Placement插管→Post-intubation management插管後處置","C":"Preparation準備→Preoxygenation前置給氧→Pretreatment前置給藥→Positionin擺位→Paralysis鎮靜肌肉麻痺→Placement插管→Post-intubation management插管後處置。","D":"Preparation準備→Pretreatmentfifj前置給藥→Positionin擺位→Preoxygenation前置給氧→Placement插管→Paralysis鎮靜肌肉麻痺→Post-intubationmanagement插管後處置。"},"answer":"C","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":1159,"source":"第四章 非創傷急症(2015-2018).doc","question":"根據高級救護技術員教科書，以下何者不是讓插管病患肌肉鬆弛的神經肌肉阻斷劑？","options":{"A":"Succinylcholine","B":"Midazolam","C":"Vecuronium","D":"Pancuronium"},"answer":"B","manualChapter":"CH16"},{"id":2000,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"高級救護技術員必須具備獨立思考能力，熟悉「治療5W」。在給予阿斯匹靈（Aspirin）前詢問有無腸胃道活動性出血，就是考慮到Aspirin治療的？","options":{"A":"Why。","B":"When。","C":"How。","D":"Watch out。"},"answer":"D","manualChapter":"CH03","matchedChapters":["CH03"]},{"id":2001,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"對於「創傷後壓力症（PTSD）」的描述何者為非？","options":{"A":"常常與其他精神疾病並存。","B":"常常被誤診為詐病（malingering）或環境適應反應（adjustment reaction）...等等。","C":"只能靠藥物治療。","D":"適切治療後，仍然可以重返專業，繼續為民眾服務。"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2002,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關「保密義務」的敘述，何者有誤？","options":{"A":"除非病人明示或默示下，才可以告知病人配偶病人病情。","B":"為了使病人得到持續良好的照顧，病人的私人資訊可以與照顧病人的醫療人員分享。","C":"不當透露病人的隱私，在民法上有適用妨害秘密罪的疑慮。","D":"病人的病史、理學檢查發現，都是隱私權所保障的範圍。"},"answer":"C","manualChapter":"CH04"},{"id":2003,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"救護人員已經告知風險與必要性，但傷患仍拒絕使用頸圈。日後若發生頸神經受傷時，救護員得減少或免除其責任，這是何種法律概念?","options":{"A":"依法行政。","B":"與有過失。","C":"時效抗辯。","D":"緊急避難。"},"answer":"B","manualChapter":"CH04"},{"id":2004,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於救護車物品與環境的清潔消毒作為，下列何者正確？","options":{"A":"針具使用後應回套針蓋完整，才可丟入尖銳物品收集筒，以免噴出傷人。","B":"載運呼吸道傳染性疾病個案，勤務後應打開車窗使其通風至少1小時。","C":"勤務結束後須以100 ppm濃度之次氯酸鈉溶液(漂白水)擦拭車內物品環境。","D":"救護車內大面積清消時，應以噴灑方式使用漂白水以便能完整覆蓋清消處。"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":2005,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"美國心臟醫學會於2017年發表了派遣員協助心肺復甦術（Dispatcher - assisted CPR, DA - CPR）的措施建議，下列何者為非？","options":{"A":"落實卓越文化，應持續施行品質進步（Quality improvement, QI）計畫。","B":"落實不究責文化，品管項目不應登錄OHCA辨識失敗之原因。","C":"落實醫療指導制度，應指派一位醫療指導醫師負責DA-CPR相關業務。","D":"落實獎勵制度，應辨識表現優異之派遣員並表彰其DA-CPR成功案例。"},"answer":"B","manualChapter":"CH08"},{"id":2006,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"2013年全球復甦聯盟（Global Resuscitation Alliance）提出改善突發性心臟停止存活的十個步驟，以下何者為非？","options":{"A":"實施派遣員協助心肺復甦。","B":"建立醫療指導醫師制度。","C":"應用行動科技召喚志願者急救系統。","D":"針對第一反應員的AED部署計畫。"},"answer":"B","matchedChapters":["CH07","CH06"],"manualChapter":"CH07"},{"id":2007,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"細胞內的清道夫是指？","options":{"A":"核糖體（ribosome）。","B":"粒線體（mitochondria）。","C":"溶小體（lysosome）。","D":"高基氏體（Golgi apparatus）。"},"answer":"C","manualChapter":"CH12"},{"id":2008,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"在插管的情形下，有關於二氧化碳濃度圖儀之判斷，何者為非？","options":{"A":"A代表CPR中病人極有可能ROSC","B":"B代表氣管內管可能滑脫","C":"C代表氣管內管的氣囊可能有問題","D":"D代表過度換氣"},"answer":"D","manualChapter":"CH14","matchedChapters":["NeedImage"],"image":"題庫圖片/2008.png"},{"id":2009,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關生理變化與年齡相關性，以下敘述何者為非？","options":{"A":"為新生兒施作巴賓斯基反射（Babinski reflex），其腳趾會往上往外翻開。","B":"在青春期階段其臉與身體的比例會變得接近成人。","C":"在成人晚期時，白血球、紅血球與血小板皆會逐漸增加。","D":"終點遽降現象（terminal drop）是指在生命的最後幾年，認知能力下降的現象。"},"answer":"C","manualChapter":"CH13"},{"id":2010,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於兒童氣管插管的描述何者為非？","options":{"A":"小於8歲的兒童因為環狀軟骨段的氣管較寬大，一定要選擇有氣囊的氣管內管。","B":"兒童的會厭軟骨較為細長柔軟，不易控制，故插氣管內管常使用直式葉片。","C":"兒童喉部相對於舌根的位置較為往前往上，比成人更難直接目視。","D":"兒童的上呼吸道較狹窄，舌頭相對較大，容易阻塞，插管時較不容易進行。"},"answer":"A","manualChapter":"CH48"},{"id":2011,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於嬰兒的描述，何者為非？","options":{"A":"肌肉的控制發展是先從頭才到腳、且先從核心才到身體的週邊。","B":"嬰兒的「被動免疫」持續至出生後約六個月。","C":"出生一個月的嬰兒，視線會追隨物體移動。","D":"覓食反射( Rooting reflex)指的是輕柔的觸碰嬰兒的臉頰或嘴唇附近，嬰兒的頭會轉向刺激的方向、嘴巴噘起。"},"answer":"C","matchedChapters":["CH13"],"manualChapter":"CH13"},{"id":2012,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"一名50歲男性，山谷中溺水的OHCA病患，你在成功建立氣管內管並接上潮氣末二氧化碳偵測器(End-tidal CO2) 5分鐘後病患ROSC，生命徵象穩定；但在轉送途中你突然發現病患血氧濃度下降，EtCO2波形變化如下圖。此時你該先進行什麼處置最為適當？","options":{"A":"可能發生低體溫，馬上量測體溫。","B":"聽診胃部檢查氣管內管是否進入食道。","C":"呼吸道阻塞，馬上給予病人氣管擴張劑。","D":"可能是氣囊問題，考慮更換新的氣管內管。"},"answer":"D","manualChapter":"CH14","matchedChapters":["需要圖片"],"image":"題庫圖片/2012.png"},{"id":2013,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列關於各類藥物給予途徑之敘述何者正確？","options":{"A":"靜脈輸液的流速與留置導管的內徑呈平方正比，所以在休克病人身上應該要盡可能選擇大管徑的留置導管。","B":"不同藥物注射方式與皮膚呈現的角度皆不相同，例如肌肉注射應與皮膚呈90度、皮內注射為45度。","C":"骨內注射常選擇的位置為肱骨近端、脛骨近端、脛骨遠端；若為兒科病人，還可選擇肱骨遠端。","D":"即使吸入給藥使用方法正確，一口仍然只有10%能進入呼吸道，其餘的量會被吞下或被噴出來。"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":2014,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"公眾去顫系統（PAD）計畫要成功，除了經費充足與立法保護施救者外，還有四大要素，以下敘述何者為非？","options":{"A":"必須由醫療專業人員規畫與監督整個計畫的進行。","B":"加強訓練去顫器管理人員負責急救流程運作。","C":"與當地的緊急醫療救護系統緊密配合。","D":"定期的品管回顧檢討改進。"},"answer":"B","manualChapter":"CH03"},{"id":2015,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列患者均主訴呼吸困難，哪一位較不可能出現庫斯毛耳氏呼吸（Kussmaul respiration）？","options":{"A":"19歲女性，患有第一型糖尿病，因為失戀好幾天沒打胰島素。","B":"70歲女性，末期腎病患者，因為去澎湖旅遊兩次沒洗腎。","C":"65歲男性，抽菸45年每天兩包菸，近日感冒後咳嗽加劇。","D":"50歲男性，長期酗酒，今日喝到朋友給的酒後感到不適。"},"answer":"C","manualChapter":"呼吸急症"},{"id":2016,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"異常呼吸音所代表的疾病何者配對最正確？","options":{"A":"細囉音：肺水腫、肺纖維化病變。","B":"哮喘（Wheezes）：肋膜積水。","C":"喘鳴音（Stridor）：支氣管擴張症。","D":"粗囉音（Coarse crackles）：肋膜炎。"},"answer":"A","matchedChapters":["CH20"],"manualChapter":"呼吸型態(含肺音)"},{"id":2017,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"頭頸部的檢查主要依靠的是視診，以下評估訊息代表的意義何者不恰當？","options":{"A":"眼框周圍瘀青：顱底骨折。","B":"鞏膜黃疸：急性肝炎、肝硬化、肝衰竭、膽道阻塞、急性溶血。","C":"瞳孔固定縮小：抗乙烯膽鹼藥物中毒。","D":"頸靜脈怒張：右心房壓上升、胸內壓上昇、中膈腔偏移。"},"answer":"C","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2018,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"某些休克的時期會出現四肢變暖的狀況，下列何者為非？","options":{"A":"頸椎損傷造成的休克。","B":"食物過敏造成的休克。","C":"肺部感染引起的休克。","D":"肺部感染引起的休克。ABC"},"answer":"C","manualChapter":"CH26"},{"id":2020,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"脊椎保護是到院前救護非常重要的一項要求，關於脊椎檢查的敘述何者為非？","options":{"A":"對於意識不清的創傷患者，救護技術員應將其視為潛在性脊椎傷害患者而給予頸椎保護。","B":"讓患者自然站立，若發現兩側肩關節與髖關節高度不對稱，患者可能有脊椎側彎的問題。","C":"患者若不願意測試轉動頸椎、俯仰頭部等動作，救護技術員可協助用外力轉動患者頸椎。","D":"正常情況下，可以清楚定位的頸椎是第七節的脊突，且不該出現局部壓痛或腫痛。"},"answer":"C","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2021,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"針對成人創傷病人，下列狀況在初步評估時，何者是最需要被立即評估及處置？","options":{"A":"腹部腫脹且外觀有瘀傷。","B":"呼吸次數每分鐘38下。","C":"體溫35°C。","D":"昏迷指數（Glasgow Coma Scale score）為10分。"},"answer":"B","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2022,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"20歲男性遭人持刀剌傷右腹部。目前意識為對聲音有反應、呼吸淺快無雜音，呼吸次數28/min，血壓80/40 mmHg，脈搏130/min，血氧濃度為92%，膚色蒼白濕冷。下列敘述何者較為正確？","options":{"A":"依據「微血管組織細胞的微循環休克」分期，傷患已達第三期瀰漫性血管內凝血。","B":"依據「出血性休克」分級，可推測此傷患血液中的鹼基缺乏至少是- 6 meq/L。","C":"輸液選擇建議以溫暖的晶質液進行急救，首選是生理食鹽水、其次為林格氏液。","D":"此傷患尚不符合外傷ABC score,尚不需要大量輸血。"},"answer":"B","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":2023,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"60歲女性，騎機車與小客車擦撞，意識嗜睡，GCS: E2V3M5。左大腿明顯腫脹變形。血壓70/40 mmHg，脈搏125/min，血氧濃度為93%。有關到院前的初步評估及處置，下列何者較為正確？","options":{"A":"為了保持呼吸道通暢，須立即給予口咽呼吸道（Oral pharyngeal airway）。","B":"評估發現氣管偏移至左側，可能為左側張力性氣胸，需考慮給予左側胸部針刺減壓。","C":"初評顯示傷患有休克現象，應該優先考慮出血性休克，立即給予輸液。","D":"神經學評估傷患四肢運動功能正常，考慮不需要施行脊椎保護。"},"answer":"C","manualChapter":"創傷","matchedChapters":["Combine"]},{"id":2024,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"36歲男性左側大腿下端遭槍擊。病人意識清楚可對答，但傷口有持續性出血，經直接加壓止血仍無法止血。有關此位病人評估及處置，您應該優先執行以下哪一項？","options":{"A":"找出槍傷的入口及出口，釐清受傷機轉。","B":"打上點滴，快速給予晶質溶液的輸液。","C":"維持呼吸道暢通及評估有無鼾聲雜音。","D":"使用止血帶，到院前不需要再間歇性鬆開。"},"answer":"D","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":2025,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"20歲男性，摩托車與汽車對撞車禍，初步評估：意識狀況清楚，呼吸淺快無雜音，呼吸次數28/min，血壓70/40 mmHg，脈搏110/min，血氧濃度為96%；四肢及其他外觀無明顯大出血，喪失T10以下部位的痛覺、冷熱感覺及運動功能。有關到院前的初步評估及傷患處置，下列何者較為正確？","options":{"A":"休克原因應該為神經性休克，需盡快打上點滴給予大量輸液。","B":"此病人可能有脊髓損傷，依症狀診斷為中央脊髓症候群。","C":"休克原因應該為出血性休克，可考慮超音波檢查，找出出血原因。","D":"此病人符合脊髓休克的定義，使用大量類固醇可有效改善神經預後。"},"answer":"C","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":2026,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"55歲男性登山客，遭落石壓傷右下肢持續五小時無法脫困，關於相關評估及處置的描述，以下何者較為正確？","options":{"A":"此病人可能在重物被移除的數分鐘內死亡。","B":"應該在脫困後，迅速給予大量輸液。","C":"血液檢查，常可見代謝性酸中毒、低血鉀、高血鈣。","D":"可以使用碳酸氫鈉（Sodium bicarbonate）去酸化尿液，減少腎衰竭發生。"},"answer":"A","matchedChapters":["CH30"],"manualChapter":"CH30"},{"id":2027,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關止血帶的使用，以下描述何者為非？","options":{"A":"應盡早使用，為傷口止血的第一步。","B":"使用後，需要確認遠端摸不到脈搏。","C":"放在接近出血處的近心端，避開關節處。","D":"商品化的止血帶優於自製止血帶。"},"answer":"A","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":2028,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"50歲男性，騎摩托車與汽車相撞，心跳每分鐘120下，血壓80/50mmHg，呼吸速率每分鐘25次；血氧90%，意識E2M5V4。理學檢查發現頸靜脈怒張，氣管無偏移，呼吸音正常，腹部無明顯壓痛，傷患吸氣時，脈搏會明顯變微弱。以下敘述何者為非？","options":{"A":"可給予1000 c.c.生理食鹽水灌注。","B":"使用超音波有助於診斷。","C":"此病患需送到創傷中心。","D":"到院後應給予胸管治療。"},"answer":"D","manualChapter":"創傷"},{"id":2029,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"50歲男性，騎摩托車撞安全島。現場評估心跳110下/min、血壓110/95mmHg、呼吸速率18下/min，血氧98%，意識清醒。左膝及大腿明顯腫脹變形，左大腿上有開放性傷口一直在噴血。其它理學檢查正常。以下敘述何者為非？","options":{"A":"須注意遠端肢體肌肉的活動度。","B":"如有膝脫臼要注意脛神經受傷。","C":"病患為出血性休克分級Class III的病患。","D":"傷口優先給予直接加壓止血。"},"answer":"C","manualChapter":"創傷"},{"id":2030,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"60歲男性，騎摩托車與汽車相撞，現場GCS: E2V2M4，心跳每分鐘80下，血壓80/30mmHg，呼吸速率每分鐘10下；血氧89%、瞳孔不等大、其他理學檢查正常，以下敘述何者為非？","options":{"A":"到院前治療頭部外傷，著重於次發性傷害的預防。","B":"此病患需要給予氧氣提高血氧含量。","C":"病患低血壓通常不是因頭部外傷引起。","D":"病患符合「允許性低血壓」概念，血壓不需要處理。"},"answer":"D","manualChapter":"創傷"},{"id":2031,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"50歲女性，體重50公斤，從火場救出，病患右上臂、前臂及手部為環狀2度燒傷，其前胸及前腹部亦為2度燒傷。病患心跳每分為100次，血壓90/50mmHg，呼吸速率每分鐘22次；血氧98%，意識清醒。以下敘述何者為非？","options":{"A":"前8小時要給予1350 c.c.乳酸林格式溶液。","B":"病患意識清醒，不用考慮一氧化碳中毒。","C":"須注意右手的遠端脈搏，可能需要筋膜切開術。","D":"此病患應被送往燒燙傷中心。"},"answer":"B","manualChapter":"COMBINE"},{"id":2032,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"40歲男性，被發現倒臥在大樓中庭的花圃旁，意識不清、心跳每分鐘70下，血壓80/50mmHg、呼吸速率每分鐘22次、血氧98%、傷患兩側跟骨明顯腫脹變形。以下敘述何者為非？","options":{"A":"判斷受傷機轉有可能為墜樓。","B":"休克原因需考慮出血性休克。","C":"休克原因需考慮顱內出血所致。","D":"病患無法表示頸椎壓痛仍需進行頸椎保護。"},"answer":"C","manualChapter":"創傷"},{"id":2033,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"一位40歲男性，騎摩托車與汽車對撞，意識清楚、主訴腹痛；心跳每分鐘120下，血壓70/50 mmHg，呼吸速率每分鐘28次，血氧80%，腹部明顯壓痛，其他理學檢查正常。以下敘述何者為非？","options":{"A":"可考慮FAST超音波掃描肝腎交界、脾腎交界來判斷是否有腹內積血。","B":"依照ABC score預測，此病患可能需要大量輸血。","C":"立即給予溫暖的2公升生理食鹽水快速輸液。","D":"可考慮給予傳明酸（tranexamic acid）1公克。"},"answer":"C","manualChapter":"創傷"},{"id":2034,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於胸部創傷敘述，下列何者為是？","options":{"A":"根據統計，超過一半的創傷出血性休克死亡是因胸部創傷所致。","B":"肋骨骨折最常見的位置為中段第4至9根肋骨的側面。","C":"針刺減壓時，為避免傷害到神經，入針位置應在肋骨下沿。","D":"執行胸部超音波時看到條碼徵候（barcode sign）表示傷患沒有氣胸。"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2035,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於腹部創傷敘述，下列何者為是？","options":{"A":"肝臟損傷為腹部鈍挫傷中最常見的臟器損傷，約佔40~55%。","B":"胰臟損傷為腹部槍傷中最常見的臟器損傷，約佔40％。","C":"骨盆骨折約有20%為動脈出血，80％為靜脈或靜脈叢出血。","D":"骨盆骨折中，側面壓迫型傷害很容易造成危及生命的低血壓。"},"answer":"C","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":2036,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列關於骨骼肌肉創傷的敘述，何者為是？","options":{"A":"雙側股骨骨折應視為重大外傷，盡早送到創傷中心。","B":"脫臼傷患為避免神經血管傷害，應盡量在院前做適度的復位及牽引。","C":"截肢傷引起之外出血，如經止血帶成功止血，建議後送就近醫院爭取時效。","D":"骨骼創傷患者給予冰敷後疼痛緩解，可再根據預立醫囑給予止痛藥加強效果。"},"answer":"A","manualChapter":"CH30","matchedChapters":["CH30"]},{"id":2037,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"改良式創傷指數(RTS)評估三種到院前生命徵象以判斷創傷嚴重度的工具，不包括？","options":{"A":"血氧飽和度(SpO 2 )。","B":"昏迷指數(GCS)。","C":"呼吸速率(RR)。","D":"收縮壓(SBP)。"},"answer":"A","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2038,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"中年男性車禍被送到醫院時診斷為右側張力性氣胸，經細針減壓以及右側胸管置入後，血壓、血氧與呼吸狀況都獲得改善。五分鐘後，該患者突然又再度呼吸困難、血壓下降。下列敘述何者為是？","options":{"A":"因生命徵象不穩定，應重新進行初級評估。","B":"再次進行細針減壓最適當位置是右鎖骨中線第二肋間。","C":"先安排電腦斷層確定是否有其他內出血。","D":"可能胸管功能不佳，應再插上第二根胸管強化引流效果。"},"answer":"A","manualChapter":"CH28"},{"id":2039,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關小兒外傷之敘述，下列敘述何者為是？","options":{"A":"小兒發生出血性休克時應給予2次20 ml/kg快速推注的生理食鹽水，如無反應則需要立刻輸血。","B":"小兒因為身體循環血量較成人少，即使是10 %的出血量，也很容易造成血壓下降。","C":"2歲以上的小兒頭部外傷若出現頭痛和嘔吐，應和家屬討論是否要安排電腦斷層。","D":"小兒外傷傷患出現低血容休克時，應該直接考慮建立骨針輸液以爭取時效。"},"answer":"C","manualChapter":"CH48"},{"id":2040,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列關於頭頸部及顏面部創傷的敘述，何者為是？","options":{"A":"當傷患眼睛受傷時，如有戴隱形眼鏡，應在現場將隱形眼鏡拔除以進行評估。","B":"一般而言，有嚴重頭部外傷的傷患，應將血氧濃度維持在100%。","C":"頭部外傷傷患如同時出現低血壓與低血氧，EPIC-TBI研究顯示死亡率可增加14倍。","D":"到院前頭部外傷併顱內壓升高徵象的傷患，一律需以BVM行過度換氣以降低腦壓。"},"answer":"C","manualChapter":"CH27"},{"id":2041,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於藥物給予與路徑，下列何者為非？","options":{"A":"幫孕婦建立靜脈路徑（IV）一般建議在上半身（橫膈以上）。","B":"在過敏性休克的病患身上給予Epinephrine時首選路徑為皮下注射。","C":"Naloxone也可以由氣管內管給藥。","D":"大部份的急救藥物都可以由骨內注射（IO）給予，吸收速度相當於IV靜脈注射。"},"answer":"B","manualChapter":"CH16"},{"id":2042,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"您在救護車上監視一位病患，他的胸悶在使用舌下NTG含片後緩解，可是EKG監視器突然出現下圖、病患並主訴心悸，其它臨床症狀穩定（血壓正常），以下最佳處置為何？","options":{"A":"同步電擊100 J。","B":"立即給予非同步電擊。","C":"給予Atropine 1 mg IV。","D":"可以先完成十二導程心電圖後,注意病患情況或考慮注射Adenosine。"},"answer":"D","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/2042.png"},{"id":2043,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列何者心律會以「窄的QRS波型」為最常見？","options":{"A":"Ventricular tachycardia。","B":"PSVT with aberrant conduction。","C":"Multifocal atrial tachycardia。","D":"Torsade de pointes。"},"answer":"C","manualChapter":"CH16"},{"id":2044,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"80歲女性跌倒後右側股骨頸骨折，因為家屬不願開刀便回家臥床休養，三天後凌晨突發性胸痛與喘，血氧下降、但呼吸音正常。下列關於此情況，何者正確？","options":{"A":"根據病人因骨折臥床的病史，這次有很高機會是肺靜脈栓塞。","B":"心電圖檢查，最常見者是竇性頻脈，S1Q3T3出現機率小。","C":"標準診斷工具為心臟超音波，可見左心室膨大、左心室肥厚。","D":"臨床上診斷不易，會搭配Troponin來決定是否做影像檢查。"},"answer":"B","manualChapter":"CH34","matchedChapters":["Combine"]},{"id":2045,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"到院前腦中風病人的評估，下列何者正確？","options":{"A":"FAST的FAS部分為手部下垂，臉下垂及口齒不清，T是發作時間。","B":"G-FAST可協助及早辨識大血管阻塞腦中風，G是指gait步態。","C":"若無糖尿病病史，不需測量指尖血糖，直接給予含糖輸液即可。","D":"適合機械取栓者，需影像確認大血管阻塞，所以可延後tPA給藥。"},"answer":"A","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":2046,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"20歲女性吃完日本帶回來的頭痛藥，半小時之後開始全身癢，下列何者正確？","options":{"A":"若病人有腹痛，嘔吐，則多半是因為急性腸胃炎，而非因為過敏症狀。","B":"若病人有低血壓及全身紅疹，需優先考慮蜂窩性組織炎合併敗血性休克。","C":"呼吸受影響時，可能因為支氣管收縮，而產生喘鳴聲，甚至缺氧現象。","D":"合併休克時，epinephrine為最適合的治療，要透過靜脈給予才有效。"},"answer":"C","manualChapter":"非創傷"},{"id":2047,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"60歲男性，酒精性肝硬化及膽結石病史。主訴噁心嘔吐解黑便，下列何者正確？","options":{"A":"可能是食道或胃靜脈曲張引起，肇因於肝門靜脈壓力增加。","B":"食道或胃靜脈曲張破裂出血，大部分出血量少，造成休克的機率並不高。","C":"噁心嘔吐若有左上腹痛，也可能是因為原有的膽結石造成膽囊炎。","D":"膽結石卡在總膽管，也可能讓黃疸症狀加劇，並且有解黑便現象。"},"answer":"A","manualChapter":"CH41"},{"id":2048,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"依據台灣疾病管制署公告，因應嚴重特殊傳染性肺炎（新冠肺炎, COVID - 19）感染的緊急醫療照護人員防護措施，下列敘述何者正確？","options":{"A":"載送疑似個案時，救護人員建議使用非拋棄式防水隔離衣及N95。","B":"載送疑似個案時，若無負壓艙使用，則需緊閉車窗，避免飛沫外洩。","C":"救護車載送完建議以漂白水清消，執行消毒工作時，需戴外科口罩。","D":"車艙內消毒前，開窗讓空氣流通，艙內消完，艙外以一般程序清潔即可。"},"answer":"D","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":2049,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"現場有一位80歲病人嚴重呼吸困難，家屬說早先有聽到呼吸有咻咻聲，過去病史有氣喘、慢性阻塞性肺病（COPD）。下列處置何者為非？","options":{"A":"若聽診兩側肺音聽不到哮鳴聲（Wheezing），可排除氣喘發作可能。","B":"若病人備有支氣管擴張劑吸入器，可協助家屬幫助病人使用。","C":"若心率監測出現嚴重心搏過速，不宜貿然協助使用支氣管擴張劑。","D":"病人戴上非再吸入型給氧面罩後，意識混亂躁動拉扯面罩，可考慮正壓給氧。"},"answer":"A","manualChapter":"呼吸急症"},{"id":2050,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"病人身體檢查發現右上肢出現彎曲姿勢，雙下肢伸張僵直姿勢；對聲音刺激無睜眼反應，沒有發出任何聲音；給予疼痛刺激時，眼睛仍沒有睜開，僅發出模糊叫聲，四肢沒有特別反應動作。請問病人的GCS評分？","options":{"A":"E2V2M2。","B":"E2V1M2。","C":"E1V1M3。","D":"E1V2M3。"},"answer":"D","manualChapter":"CH22"},{"id":2051,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於急性腦中風病人的到院前評估與處置，下列何者為是？","options":{"A":"詢問病人相關症狀，沒有胸痛胸悶心悸等症狀，不裝設心律監視器。","B":"詢問病人過去病史沒有糖尿病無使用相關藥物，省略血糖測量，儘速送醫。","C":"測量病患血壓180/90 mmHg，為了增加腦部血液循環，給予等張輸液。","D":"測量病患血氧SpO2= 92％，呼吸平緩無費力，速率正常，給予氧氣。"},"answer":"D","manualChapter":"CH36"},{"id":2052,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"65歲獨居女性，被定期探視的兒子發現意識混亂打119求救。你到達現場時發現病人對聲音有反應，答非所問，四肢活動對稱。兒子表示病人有在洗腎，施打胰島素，並服用新陳代謝科相關藥物，但病人會自行調整洗腎時間及藥物使用劑量。身體理學檢查發現：皮膚溫暖乾燥，兩側肺底濕囉音，雙下肢水腫及右手有一廔管，其餘身體診察皆正常。呼吸24次/分鐘、脈搏80-130次/分鐘不規則跳動、血壓108/60mmHg、脈衝血氧濃度91%、體溫37.8度C。配合病史詢問與身體檢查，請問下列鑑別診斷何者較不可能？","options":{"A":"若病人有在服用甲狀腺藥物，合理懷疑為黏液性水腫昏迷。","B":"若病人已一星期沒有接受洗腎，可能是尿毒症引起意識混亂。","C":"若病人有長期酗酒習慣，但最近沒錢買酒，酒精戒斷須列入考慮。","D":"若血糖值顯示為400mg/dL，須考慮糖尿病酮酸血症。"},"answer":"A","manualChapter":"CH19"},{"id":2054,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於腹部急症的身體診察，下列徵候都表示病人可能有闌尾炎的跡象，除了何者之外？","options":{"A":"洛夫辛徵象（Rovsing’s sign）。","B":"腰大肌徵候（Psoas sign）。","C":"莫菲氏病徵（Murphy’s sign）。","D":"閉孔肌徵候（Obturator sign）。"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":2055,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"以下傳染病之傳播途徑配對，何者錯誤？","options":{"A":"疥瘡—接觸傳染。","B":"麻疹—飛沫傳染。","C":"肺結核—空氣傳染。","D":"後天免疫缺乏症候群—體液傳染。"},"answer":"B","manualChapter":"CH42"},{"id":2056,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關神經系統疾病的「時間」定義，下列敘述何者正確？","options":{"A":"短暫性腦缺血發作（TIA）是指症狀發生後一週內完全恢復。","B":"譫妄的發病症狀為漸進式且緩慢、而失智的發病症狀為快速且起伏不定。","C":"癲癇重積症（Status epilepticus）定義是指抽搐發生的時間超過1分鐘。","D":"若病人發生中風症狀的時間在6小時內，有機會做動脈內取栓（IA）治療。"},"answer":"D","manualChapter":"CH36"},{"id":2057,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關甲狀腺機能亢進症，下列敘述何者正確？","options":{"A":"已經甲狀腺切除術後的病人不會出現。","B":"會有全身水腫、肌腱反射降低等表現。","C":"可合併發燒、心搏過速及意識混亂。","D":"常合併低血糖、低血壓等徵狀。"},"answer":"C","manualChapter":"CH37"},{"id":2058,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"火災現場救出一名身上無外傷的意識不清病患。此類病患若血氧飽和度<90%，可能的問題是出現在哪兩種病理機轉？","options":{"A":"通氣與動力。","B":"灌流與擴散。","C":"擴散與通氣。","D":"動力與灌流。"},"answer":"C","manualChapter":"CH14"},{"id":2059,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"EMTP醫院實習常會遇到使用雙向正壓呼吸器（BiPAP）的病人。關於BiPAP，下列敘述正確的是？","options":{"A":"它是一種侵入性的正壓呼吸裝置。","B":"不論病人處於呼氣期或吸氣期，均提供一個氣道支持的壓力。","C":"適合使用在早期呼吸衰竭且意識不清的病患。","D":"美國EMS醫師學會（NAEMSP）建議不要在到院前使用此類呼吸器。"},"answer":"B","manualChapter":"CH51","matchedChapters":["CH51"]},{"id":2060,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"中年男性有缺血性胸痛症狀、心電圖如下，請問心肌梗塞（STEMI）在何處？","options":{"A":"心臟下壁及後壁。","B":"心臟前壁及側壁。","C":"心臟前壁及下壁。","D":"心臟側壁及後壁。"},"answer":"A","manualChapter":"CH33","image":"題庫圖片/2060.png"},{"id":2061,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"急性腎衰竭是指臨床上病人的腎功能發生了突然而顯著的惡化，常見的原因，下列敘述何者正確？","options":{"A":"腎前性的原因，例如輸尿管結石。","B":"腎性的原因，例如腎絲球腎炎。","C":"腎後性的原因，例如嚴重休克。","D":"老人家常見的攝護腺肥大並不會引起急性腎衰竭。"},"answer":"B","manualChapter":"CH41"},{"id":2062,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"急性白血病是指不成熟的白血球增生，侵入骨髓外的其他身體部位，這些常見會被侵犯而會變的腫大或疼痛的部位，不包括？","options":{"A":"淋巴結。","B":"關節。","C":"脾臟。","D":"腎臟。"},"answer":"D","manualChapter":"CH39"},{"id":2063,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列何者並非我國目前（2020年10月為準）之第一類法定傳染病？","options":{"A":"新冠肺炎（COVID-19；嚴重特殊傳染性肺炎）。","B":"狂犬病。","C":"鼠疫。","D":"嚴重急性呼吸道症候群。"},"answer":"A","manualChapter":"CH42"},{"id":2064,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"病人被119送達急診，EMT表示院前為無搏脈心律（a systole）。您們EMTP學員小組在醫院實習、協助醫師施行CPR、進行插管、並成功建立靜脈路徑。兩分鐘後胸外按壓暫停，此時心電圖如下。您立即該作的事是？","options":{"A":"靜脈給予epinephrine 1mg。","B":"靜脈給予atropine 1mg。","C":"使用經皮節律器（TCP）。","D":"檢查脈搏並替換壓胸人員。"},"answer":"D","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/2064.png"},{"id":2065,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列關於SOAP病況紀錄方式的描述，何者最不適當？","options":{"A":"Summary：包括目前傷病情的總結客觀描述，如受傷機轉、預估出血量，已給予的處置。","B":"Objective：主要是病人/傷患的生命徵象、身體診察。","C":"Assessment：指的是根據上面兩項收集到的資訊，所做出對於病情的評估與診斷。","D":"Plan：針對上面的診斷，預計給予傷病患的治療計畫。"},"answer":"A","manualChapter":"CH18"},{"id":2066,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"酒精成癮可利用”CAGE”四個問題進行篩檢，若其中有兩個陽性，則有約七成的機會為酒精成癮病人，下列關於這四個問題的描述何者不正確？","options":{"A":"C代表Cut down：必須詢問病人對於戒酒是否有困難。","B":"A代表Annoyance：必須詢問病人是否因喝酒而造成家人或朋友的厭惡。","C":"G代表Guilty：必須詢問病人是否覺得因長期喝酒而有罪惡感。","D":"E代表Everyday：必須詢問病人是否每天都要找酒喝。"},"answer":"D","manualChapter":"CH46"},{"id":2067,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"一名年38歲體重100Kg懷孕42週的經產婦（這是第四胎），到達現場時第一台救護車的夥伴已完成急產並正在進行新生兒急救。而你則被指派照顧產後的產婦。此時病人有意識有呼吸但很虛弱，臉色蒼白冒冷汗，胎盤已娩出但會陰部仍有大量持續性出血，血壓血氧量測發現BP: 80/50mmHg，HR: 150/min, SpO2: 96%，下列關於這位產婦的救護處置何者最不正確？","options":{"A":"用手在產婦下腹部進行按摩。","B":"讓胎兒吸允母親乳頭。","C":"若有外陰部撕裂傷合併大量出血應直接加壓止血。","D":"給予大量靜脈輸液維持灌流，並請求線上指導給予MgSO4幫助子宮收縮止血。"},"answer":"D","manualChapter":"CH49","matchedChapters":["CH49"]},{"id":2068,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"野外救護之困境之描敘，以下何者為非？","options":{"A":"野外救護很難第一次評估就能找出所有問題，因此建議使用SOAP方式持續記錄評估病人問題避免遺漏。","B":"長時間搬運可能會導致病人傷害如壓瘡，建議可以使用抽氣式護木代替長背板固定頸椎或長背板上加墊其他物品，但以不影響固定效果為原則。","C":"因野外救護時間較長，即便是靜脈出血，病人也可能因此失血過多，加上搬運過程之便利性，止血帶止血方式應優先於直接加壓止血法使用","D":"因野外救護送醫時間較長，應注意傷口是否感染，因此要預防感染的發生，對於有被泥土或其他東西污染的傷口，以及髒東西造成的穿刺傷，都需給予高壓沖洗；相對的，沒有污染的傷口，給予低壓沖洗即可。"},"answer":"C","manualChapter":"CH45"},{"id":2069,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"剛出生時新生兒抽吸口鼻會哭泣臉部也無表情，呼吸規則，且每分鐘約20下。脈搏微弱且約每分鐘80下，刺激時手腳僅有一些無的收縮。外觀發現四肢發紺，身體比較紅潤。請問其第一分鐘的APGAR分數是？ (多選)","options":{"A":"3。","B":"4。","C":"5。","D":"6。"},"answer":"B,C","manualChapter":"CH49"},{"id":2070,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列何者不是急性心肌梗塞的主要危險因子？","options":{"A":"糖尿病。","B":"高血壓。","C":"喝酒。","D":"抽菸。"},"answer":"C","manualChapter":"CH34"},{"id":2071,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"老年人隨著年紀的增長,可能會遇到視力、聽力和說話的問題，下列何者為非？","options":{"A":"老化容易得到青光眼。","B":"使用特殊藥物也會造成聽力問題。","C":"說話有問題時要考慮可能由於不合適的假牙。","D":"老年人的高熱症比低體溫症常見，主因為曝曬在高熱的環境中。"},"answer":"D","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":2072,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於老年人外傷的敘述，下列何者為非？","options":{"A":"任何受傷機轉所造成的胸部外傷在老年人中可能都有致命的危險。","B":"老年人骨質疏鬆容易產生骨折。","C":"胸壁的順應性增加。","D":"老年人需要更高的動脈壓來維持器官灌流。"},"answer":"C","manualChapter":"CH47"},{"id":2073,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於孕婦身體變化的敘述，下列何者為非？","options":{"A":"懷孕第三個月時可在恥骨上方可以檢查到增大的子宮。","B":"孕婦之心輸出量及總血量在34週時將可增加30%。","C":"孕婦之心跳於懷孕後期每分鐘可減少5到10下。","D":"孕婦之血壓在懷孕第二期將會下降10~15毫米汞柱。"},"answer":"C","manualChapter":"CH49"},{"id":2074,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"關於孕婦分娩的敘述，下列何者為非？","options":{"A":"急產定義為“規則陣痛開始至完成分娩時間”小於一個小時。","B":"規則陣痛之定義為兩次陣痛之間隔小於五分鐘。","C":"子宮頸的擴張速度在初產婦可達每小時五公分。","D":"子宮頸的擴張速度在經產婦（生第二胎以上）可達每小時十公分。"},"answer":"A","manualChapter":"CH49","explanation":"CH49 p1297 急產定義為「規則陣痛開始至完成分娩時間」小於3 個小時，而規則陣痛之定義為兩次陣痛之間隔小於5 分鐘。子宮頸的擴張速度在初產婦可達每小時5公分，而經產婦(生第二胎以上)每小時可達10公分。"},{"id":2075,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"29歲男性跟團攀登嘉明湖，第一天晚上在向陽山屋（海拔約2850公尺）過夜，第二天清晨起床後有輕微頭痛，並且合併有頭暈噁心及全身無力等症狀。你是隨行的救護技術員，以下作為何者為非？","options":{"A":"這個病人罹患了急性高山病，在症狀緩解前應避免上升高度。","B":"可以給予丹木斯（Diamox，Acetazolamide）以加速高度適應。","C":"可以給予威而鋼（Viagra）或犀利士（Cialis）來治療病人。","D":"病人如果執意繼續上升高度，則可能會進展成高海拔腦水腫。"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2076,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"33歲男性到蘭嶼水肺潛水，最後一次潛水後約13小時產生突發性下肢無力、完全無法走路的症狀，病人經海巡的船隻轉送回本島。救護隊奉派至港口將病人轉送適當醫院，以下敘述何者為是？","options":{"A":"轉送過程中需給予高濃度氧氣，並以頭低腳高的姿勢運送。","B":"病人可能罹患減壓病，需轉送至有高壓氧治療的適合醫院。","C":"病人可能罹患空氣栓塞，需轉送至有高壓氧治療的適合醫院。","D":"病人如需空中轉送，飛行器高度無需限制，但過程要給氧氣。"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2077,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"53歲男性在路程超過10小時的深山中遭百步蛇咬傷左小腿，傷患的左小腿立刻腫脹疼痛無法移動，您是到場支援的TP，奉派將傷患救出並轉送至適當醫院，以下作為何者為非？","options":{"A":"現場需要醫療指導醫師預立醫囑施打抗百步蛇毒蛇血清。","B":"使用彈繃以及副木固定可以有效減緩蛇毒系統性地吸收。","C":"使用彈繃的鬆緊度應該要和使用在肢體大出血的差不多。","D":"抗百步蛇蛇毒血清無法用其他出血性的蛇毒血清來代替。"},"answer":"C","manualChapter":"CH50"},{"id":2078,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"39歲男性在連續喝酒數日後，突然癲癇發作並失去意識。你是轄區救護隊，到現場發現病人完全昏迷、口吐白沫，整個臉都是汗水和口水，針狀瞳孔。有關此病人現場的發現與作為，以下敘述何者為是？(選擇［應該要特別注意病人的呼吸狀況，以免分泌物太多造成呼吸道阻塞。］也給分)","options":{"A":"應該要特別注意病人的呼吸狀況，以免分泌物太多造成呼吸道阻塞。","B":"這是有機磷除草劑中毒，應該要注射atropine以及PAM來當作解藥。","C":"在沒有安全的顧慮下，現場遺留的農藥瓶應該隨病人送至醫院以供參考。","D":"病人的瞳孔放大以及臉上的汗水停止分泌後，atropine就可停止使用。"},"answer":"C","manualChapter":"非創傷","matchedChapters":["Combine"]},{"id":2079,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列有關毒藥與解毒劑配對的組合，何者為非？","options":{"A":"鴉片類麻醉劑（Opiates）的解毒劑是Naloxone。","B":"BZD (Benzodiazepine)的解毒劑是N-Acetylcysteine（Fluimucil）。","C":"甲醇（Methanol）的解毒劑是乙醇（Ethanol）。","D":"有機磷的解毒劑是PAM。"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":2080,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"有關化學物質的標示，何者為非？","options":{"A":"每一個危害性化學品都有一個獨立的UN編號。","B":"依GHS制度，化學物質均應有安全資料表（Safety Data Sheet，SDS）。","C":"危險物運輸標示上附有聯合國之物質編號（UN number）危害物質分類及圖示，用以清楚標示運輸車輛、容器內含之危害物質。","D":"依照GHS的規定，化學物質可能有不只一種的危害類型，故可有一個以上的圖示。"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":2081,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"下列有關START檢傷法的限制，何者為非？","options":{"A":"START檢傷法所適用的對象主要是鈍傷的傷病患，對於穿刺傷、嗆傷、化災傷病患的分類就不是那麼可靠。","B":"START檢傷法容易「輕症重判」，而不會「重症輕判」。","C":"孕婦也很容易誤判嚴重度，因為懷孕期的生理變化使得她們相對上可以容忍較多的失血。","D":"氣溫偏低的狀況下，人體周邊血管會收縮以減少體熱散逸，因此正常人的微血管充填時間也很可能超過兩秒，造成輕症重判。"},"answer":"B","manualChapter":"CH52"},{"id":2082,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"事故指揮系統中，安全官的職責不包含以下哪個？","options":{"A":"緊急制止危險的救援行動。","B":"以對事故指揮官提出安全方面的建議。","C":"確保工作人員都能夠保護自己和民眾的安危。","D":"執行人員出入管制。"},"answer":"D","manualChapter":"CH52"},{"id":2083,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"美國國家醫學研究院提出的品質目標六大面向中，公平(equity)意指：","options":{"A":"病人傷患應接受相同的緊急醫療救護服務。","B":"緊急救護員應接受相同的緊急醫療救護訓練。","C":"國內各EMS系統應訂有相同的品管指標。","D":"屬性相同之EMS案件應接受相同強度品管稽核。"},"answer":"A","manualChapter":"CH09"},{"id":2084,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"以下關於天然災害的緊急應變，何者正確？","options":{"A":"嚴重地震發生後，內科疾病的發生率也會一同上升。","B":"現代都市建物抗震能力強，震災傷害的發生多半零星且四散於城市各地。","C":"震災可能傷及大都市的自來水管線而造成斷水，相對來說颱風過後都會區沒有缺水的問題。","D":"我國颱風警報時會先讓EMT停休在隊待命，因此風災發生時不致於會有救護車無法出車救援的狀況。"},"answer":"A","manualChapter":"CH57"},{"id":2085,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"你參與大型活動的醫療救護團隊，以下處置何者正確？","options":{"A":"醫療站動線必須事先測試，務必確認從傷害發生地到救護站都能夠允許救護車通行。","B":"傷患人數推估跟活動種類，持續時間，現場溫度與高度都有關，是可以事先大致預估的。","C":"大型活動的災難事件定義為15人以上或預估15人以上傷病患。","D":"我國目前對於大型集會活動的後送規劃與救護站裝備並沒有明文要求。"},"answer":"B","manualChapter":"CH54"},{"id":2086,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"以下關於危害物質應變，何者為是？ (多選)","options":{"A":"強鹼例如氫氧化鈉顆粒，應以刷子盡量移除後，使用大量清水來替病人除污。","B":"輻射事故應變人員的防護衣著考量以避免污染進入身體為主，其次才是阻擋幅射線。","C":"移除輻射事故傷患的衣物時，應保持衣物乾燥，防止污染物繼續附著。","D":"輻射除污必須持續到殘留劑量與背景輻射一致時，才能停止。ABC"},"answer":"A,B","manualChapter":"CH53","matchedChapters":["CH53"]},{"i
