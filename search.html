小時內合成新的膠原蛋白，但直到____個月後，受傷後修復的組織才會回到原本的強度韌性與功能","options":{"A":"48、4","B":"24、4","C":"48、1","D":"24、1"},"answer":"A","source":"大白","manualChapter":"CH30"},{"id":45735,"question":"填入空格：膠原蛋白是身體大多數組織的結構蛋白，所以膠原母細胞會在受傷的____小時內合成新的膠原蛋白，但直到____個月後，受傷後修復的組織才會回到原本的強度韌性與功能","options":{"A":"48、4","B":"24、4","C":"48、1","D":"24、1"},"answer":"A","source":"大白","manualChapter":"背誦題"},{"id":45736,"question":"下列何者非黏液性水腫(myxedema)的臨床症狀?","options":{"A":"臉部缺乏表情","B":"肌腱反射降低","C":"意識混亂","D":"皮膚黃褐粗糙"},"answer":"C","source":"大白p1000","manualChapter":"CH37"},{"id":45737,"question":"下列何者非黏液性水腫(myxedema)的臨床症狀?","options":{"A":"臉部缺乏表情","B":"肌腱反射降低","C":"意識混亂","D":"皮膚黃褐粗糙"},"answer":"C","source":"大白p1000","manualChapter":"背誦題"},{"id":45738,"question":"一位22 歲男性被1500 伏特的高壓電電傷送到急診室,最可能出現的心電圖表徵為何?","options":{"A":"PR interval shortening with RBBB","B":"QT prolongation","C":"peaked T wave, widened QRSs","D":"sinus tachycardia"},"answer":"C","source":"民國105進階專科護理/精神科考古題","manualChapter":"CH30","explanation":"高壓電電傷因組織破壞釋鉀,心電圖常呈高尖T波、QRS變寬(類高血鉀)。高壓電電傷造成廣泛組織壞死、細胞溶解釋出鉀離子，導致高血鉀；心電圖呈高尖對稱T波、QRS 增寬，並可致致命性心律不整或心臟停止；亦可直接造成心肌壞死與傳導損傷。處置須監測心電圖、血鉀並評估橫紋肌溶解與腎損傷。故處置須持續監測心電圖與血鉀，並評估合併的橫紋肌溶解與急性腎損傷。"},{"id":45739,"question":"關於心音聽診，下列何者不是居於S1 到S2 之間心收縮期的心雜音?","options":{"A":"三尖瓣閉鎖不全","B":"肺動脈瓣狹窄","C":"心室中膈缺損","D":"主動脈瓣閉鎖不全"},"answer":"D","source":"民國105專科護理通論考古題","manualChapter":"CH20","explanation":"主動脈瓣閉鎖不全為舒張期雜音,不在收縮期。心雜音時相判讀：收縮期(S1–S2 間)雜音見於三尖瓣/二尖瓣逆流、主動脈瓣/肺動脈瓣狹窄、VSD；舒張期雜音見於主動脈瓣/肺動脈瓣閉鎖不全、二尖瓣/三尖瓣狹窄。主動脈瓣閉鎖不全(AR)為舒張早期遞減型雜音，不在收縮期。　故主動脈瓣閉鎖不全為舒張早期的遞減型雜音，不屬於S1 至S2 之間的收縮期雜音。"},{"id":1234,"question":"下列心電圖為何種心律不整?","options":{"A":"病竇症候群","B":"竇性心律不整","C":"3 度房室傳導阻滯","D":"心房纖維顫動"},"answer":"C","source":"民國105專科護理通論考古題","manualChapter":"CH33","explanation":"心電圖 P 波與 QRS 各自獨立(無關聯)→第三度(完全性)房室傳導阻滯。完全性(第三度)房室傳導阻滯：心房(P波)與心室(QRS)各自獨立節律、P–R 無固定關係(房室分離)，心室由交界區或心室自主逸搏維持(率慢、QRS 可寬)。病灶多在希氏束以下，atropine 多無效，常需經皮/經靜脈節律器，確定者植入永久節律器。需與高度第二度阻滯區分。","image":"題庫圖片/1234.png"},{"id":45740,"question":"HCO3的正常值(mEq/L)在何者區間?","options":{"A":"22-26","B":"35-45","C":"70-80","D":"90-100"},"answer":"A","source":"大白","manualChapter":"CH51"},{"id":45741,"question":"HCO3的正常值(mEq/L)在何者區間?","options":{"A":"22-26","B":"35-45","C":"70-80","D":"90-100"},"answer":"A","source":"大白","manualChapter":"背誦題"},{"id":45742,"question":"正常成年人有幾顆牙齒?","options":{"A":"30","B":"32","C":"34","D":"36"},"answer":"B","source":"大白p744","manualChapter":"CH27"},{"id":45743,"question":"正常成年人有幾顆牙齒?","options":{"A":"30","B":"32","C":"34","D":"36"},"answer":"B","source":"大白p744","manualChapter":"背誦題"},{"id":45744,"question":"若病人有尿毒症病史，近日因故未能正常洗腎，其無脈搏電氣活動的原因下列何者為非?","options":{"A":"鉀離子過高","B":"酸血症","C":"低血容量","D":"體液容積過負荷引發心包填塞"},"answer":"C","source":"大白","manualChapter":"非創傷"},{"id":45745,"question":"若您需要進行氣切造口置入氣管內管處置，下列何者為非?","options":{"A":"置入深度應為氣切造口至劍肋角","B":"選擇之氣管內管管徑大小與氣切管相近","C":"置入深度應為氣切造口至胸骨角","D":"氣管內管置入後打上氣囊固定"},"answer":"A","source":"大白1384","manualChapter":"CH51"},{"id":45746,"question":"下列何者非右心室心肌梗塞病徵?","options":{"A":"低血壓","B":"頸靜脈怒張","C":"雙側肺音對稱、清楚","D":"意識混亂"},"answer":"D","source":"AI出題","manualChapter":"非創傷"},{"id":45747,"question":"腸音的聽診位置?","options":{"A":"只需要聽一個位置即可","B":"腹部四象限","C":"患者最痛的位子","D":"患者最痛的位子的斜對角度位子"},"answer":"A","source":"大白p549","manualChapter":"CH20"},{"id":45748,"question":"請問中耳的功能或敘述，下列何者正確?","options":{"A":"連接聽神經至大腦產生聽覺","B":"包含維持人體的平衡感的前庭組合構造","C":"收集音波傳到鼓膜","D":"有三塊聽小骨，收集微弱音波"},"answer":"D","source":"大白p296","manualChapter":"CH12"},{"id":45749,"question":"請問連接中耳腔與咽喉部的構造為下列何者?","options":{"A":"內耳","B":"聽骨","C":"耳咽管","D":"前庭組合"},"answer":"C","source":"大白p296","manualChapter":"CH12"},{"id":45750,"question":"請問連接中耳腔與咽喉部的構造為下列何者?","options":{"A":"內耳","B":"聽骨","C":"耳咽管","D":"前庭組合"},"answer":"C","source":"大白p296","manualChapter":"背誦題"},{"id":45751,"question":"若一個有糖尿病病史的老年病人，耳廓及附近的軟組織出現明顯紅腫熱痛發炎反應時，應該注意可能何種病狀?","options":{"A":"惡性外耳炎","B":"中耳炎","C":"顱底骨折","D":"聽神經瘤"},"answer":"A","source":"大白p529","manualChapter":"CH20"},{"id":45752,"question":"關於耳膜破裂的相關敘述，下列何者為非?","options":{"A":"壓力傷害可能導因於爆炸或潛水，通常這些傷害會自然恢復","B":"如果是異物穿刺，不應拔除，但避免進行固定及包紮，避免異物造成穿刺傷的深度更深","C":"若是嚴重穿刺傷，通常合併顴骨骨折","D":"若是嚴重穿刺傷，常見的併發症包括顏面神經麻痺、聽力喪失及眩暈"},"answer":"B","source":"大白p743","manualChapter":"CH27"},{"id":45753,"question":"正常腸音頻率範圍則約在每分鐘幾下之間屬正常?","options":{"A":"1-3","B":"20-50","C":"5-30","D":"50-100"},"answer":"C","source":"大白p550","manualChapter":"CH20"},{"id":45754,"question":"正常腸音頻率範圍則約在每分鐘幾下之間屬正常?","options":{"A":"1-3","B":"20-50","C":"5-30","D":"50-100"},"answer":"C","source":"大白p550","manualChapter":"背誦題"},{"id":45755,"question":"針對將火場救出的病人，下列敘述何者最不適當?","options":{"A":"在排除病人有脊椎的傷害下，應保持患者頭部抬高至少30度","B":"若胸腹部大面積灼傷，仍是應在傷口處黏貼生理監視器電極貼片以監視患者狀態","C":"經由潮濕瓶給予100％的氧氣","D":"若四肢軀幹皆灼傷，仍是需要量測血壓，於壓脈帶下置放無菌紗布直接量測即可"},"answer":"B","source":"大白P820","manualChapter":"CH31"},{"id":45756,"question":"有關區分周邊型和中樞型眩暈的症狀，下列何者為非?","options":{"A":"只要患者有任何耳朵症狀，如聽力減弱、耳鳴、耳痛及腫脹，即可排除中樞眩暈","B":"周邊型眩暈的持續時間較短","C":"僅中樞型眩暈會出現眼震，且持續時間少於一周","D":"若患者多次轉頭不會減輕眩暈程度，即是中樞型眩暈"},"answer":"C","source":"大白P977","manualChapter":"CH36"},{"id":45757,"question":"梅尼爾氏症是屬於何種疾病?","options":{"A":"內分泌疾病","B":"神經疾病","C":"內耳疾病","D":"精神疾病"},"answer":"C","source":"大白","manualChapter":"非創傷"},{"id":45758,"question":"在肩關節脫臼中，前脫位跟後脫位分別佔多少比例?","options":{"A":"50%、50%","B":"90%、10%","C":"30%、70%","D":"5%、95%"},"answer":"B","source":"大白P800","manualChapter":"CH30"},{"id":45759,"question":"在肩關節脫臼中，前脫位跟後脫位分別佔多少比例?","options":{"A":"50%、50%","B":"90%、10%","C":"30%、70%","D":"5%、95%"},"answer":"B","source":"大白P800","manualChapter":"背誦題"},{"id":45760,"question":"拳擊者骨折是因直接撞擊造成掌骨骨折，最常見為第幾掌骨折","options":{"A":"1","B":"3","C":"4","D":"5"},"answer":"D","source":"大白P800","manualChapter":"CH30"},{"id":45761,"question":"拳擊者骨折是因直接撞擊造成掌骨骨折，最常見為第幾掌骨折","options":{"A":"1","B":"3","C":"4","D":"5"},"answer":"D","source":"大白P800","manualChapter":"背誦題"},{"id":45762,"question":"膝部外傷常見的併發症不包含下列何者?","options":{"A":"十字韌帶損傷","B":"膕動脈損傷","C":"後脛神經損傷","D":"股動脈損傷"},"answer":"D","source":"大白P801","manualChapter":"CH30"},{"id":45763,"question":"如何使用碳酸氫鈉鹼化尿液可以減少腎衰竭的發生?","options":{"A":"將2 支針劑碳酸氫鈉(約35meq)加入生理食鹽水500 毫升，於半小時內滴注完畢","B":"將2 支針劑碳酸氫鈉(約35meq)加入生理食鹽水500 毫升，於一小時內滴注完畢","C":"將1 支針劑碳酸氫鈉(約35meq)加入生理食鹽水500 毫升，於半小時內滴注完畢","D":"將1 支針劑碳酸氫鈉(約35meq)加入生理食鹽水500 毫升，於一小時內滴注完畢"},"answer":"A","source":"大白p802","manualChapter":"CH30"},{"id":45764,"question":"骨折固定有直接的止血效果嗎?","options":{"A":"無直接的止血效果","B":"有相當良好的止血效果"},"answer":"A","source":"大白p798","manualChapter":"CH30"},{"id":45765,"question":"電傷害可分為的三種類型下列何者為非?","options":{"A":"直接接觸傷害","B":"閃燃燒傷","C":"放射線傷害","D":"電弧傷害"},"answer":"C","source":"大白p804","manualChapter":"CH30"},{"id":45766,"question":"填入空格：閃電可以傳遞電壓高達約____ 伏特以上，____安培的直流電流，溫度變化在攝氏8,800~33,300度之間。","options":{"A":"五千、1萬","B":"1億、20萬","C":"五千、20萬","D":"1億、1萬"},"answer":"B","source":"大白p804","manualChapter":"CH30"},{"id":45767,"question":"填入空格：閃電可以傳遞電壓高達約____ 伏特以上，____安培的直流電流，溫度變化在攝氏8,800~33,300度之間。","options":{"A":"五千、1萬","B":"1億、20萬","C":"五千、20萬","D":"1億、1萬"},"answer":"B","source":"大白p804","manualChapter":"背誦題"},{"id":45768,"question":"約多少比例被閃電擊中的人會併發心臟和呼吸驟停?","options":{"A":"10%","B":"30%","C":"60%","D":"90%"},"answer":"B","source":"大白p804","manualChapter":"CH30"},{"id":45769,"question":"約多少比例被閃電擊中的人會併發心臟和呼吸驟停?","options":{"A":"10%","B":"30%","C":"60%","D":"90%"},"answer":"B","source":"大白p804","manualChapter":"背誦題"},{"source":"EMT-P 第 46 章 P.1214","question":"在處理精神危機時，救護員建議與病人交談時保持的最佳社交距離是多少公尺？","options":{"A":"0.5~1.0公尺","B":"至少5公尺以上","C":"1.2~3.6公尺","D":"4.0~6.0公尺"},"answer":"C","matchedChapters":["CH46"],"manualChapter":"背誦題","id":45770},{"id":45771,"question":"壓碎傷症候群(Crush syndrome)的傷患，容易發生在事故後幾小時?","options":{"A":"1-2","B":"4-6","C":"10-12","D":"24-48"},"answer":"B","source":"大白801","manualChapter":"CH30"},{"id":45772,"question":"壓碎傷症候群(Crush syndrome)的傷患，容易發生在事故後幾小時?","options":{"A":"1-2","B":"4-6","C":"10-12","D":"24-48"},"answer":"B","source":"大白801","manualChapter":"背誦題"},{"id":45773,"question":"電傷害的致命性心律不整可以在幾小時內再度發生?","options":{"A":"1-2","B":"4-6","C":"10-12","D":"24-48"},"answer":"D","source":"大白807","manualChapter":"CH30"},{"id":45774,"question":"電傷害的致命性心律不整可以在幾小時內再度發生?","options":{"A":"1-2","B":"4-6","C":"10-12","D":"24-48"},"answer":"D","source":"大白807","manualChapter":"背誦題"},{"id":45775,"question":"關於 Aspirin 在抗血栓與抗發炎機轉上的差異，下列何者正確？","options":{"A":"每日低劑量能藉由不可逆抑制 COX-1 有效抑制血小板凝集","B":"低劑量主要透過干擾 COX-2 抑制 Prostacyclin 達到抗血栓作用","C":"高劑量透過乙醯化 COX-1 抑制 Thromboxane A2 達成抗發炎","D":"單次低劑量能藉由可逆結合COX-1 短暫抑制血小板凝集約一天"},"answer":"A","source":"AI","manualChapter":"CH16"},{"id":45776,"question":"有關閃電燒傷的敘述，下列何者錯誤?","options":{"A":"燒傷的形狀是水平線性及羽毛狀的","B":"受電擊的持續時間非常短暫( 0.01~0.001秒)","C":"約30％被閃電擊中的人會併發心臟和呼吸驟停","D":"電流通過路徑是覆蓋性地通過皮膚表面，非穿透皮膚及皮下組織"},"answer":"A","source":"大白p804","manualChapter":"CH30"},{"id":45777,"source":"大白","question":"當不同來源的病毒株同時感染同一宿主時，病毒於複製過程就可能產生基因段互換及重新排列組合(reassortment)，此時造成抗原的大改變稱作?","options":{"A":"病原轉變","B":"抗原漂變","C":"","D":""},"answer":"A","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":45778,"source":"大白","question":"何者乃病毒為了適應宿主產生的抗體而發生的改變，是每年季節性流感造成流行的原因。","options":{"A":"病原轉變","B":"抗原漂變","C":"","D":""},"answer":"B","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":45779,"source":"大白","question":"病毒基因每年累積的點突變，所造成的抗原的小改變稱作為何?","options":{"A":"病原轉變","B":"抗原漂變","C":"","D":""},"answer":"B","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":45780,"source":"大白","question":"關於腸病毒感染的敘述下列何者錯誤?","options":{"A":"腸病毒71型感染較易侵犯中樞神經系統，併發重症主要有腦幹腦炎、心臟衰竭、肺水腫與肺出血等表現","B":"潛伏期可長達3個月","C":"病人亦可經由接觸病人皮膚水泡的液體而受到感染","D":"病人可持續經由腸道釋出病毒，時間長達8~12週之久"},"answer":"B","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":45781,"source":"大白p908","question":"經驗豐富的急診醫師也往往被局部症狀誘導而無法在第一時間正確的診斷出來。甚至有報告顯示，第一時間的誤診率，可達多少比例?","options":{"A":"13%","B":"25%","C":"47%","D":"64%"},"answer":"C","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":45782,"source":"大白p908","question":"有關史丹福主動脈剝離分類法，下列敘述何者最正確？","options":{"A":"A 型主動脈剝離首選治療為積極降血壓藥物治療，手術僅保留給藥物無效者","B":"A 型患者接受手術治療，可大幅降低約一半的死亡率，且長期存活率優於單純藥物治療","C":"B 型急性主動脈剝離之標準首選為緊急開放性外科手術","D":"B 型急性主動脈剝離以藥物治療為主，其核心控制目標為提高心輸出量而非控制血壓"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":45783,"source":"大白p938","question":"下列有關會厭炎的敘述，下列何者錯誤?","options":{"A":"引起會厭發炎的原因有很多，可以分為感染以及外傷","B":"引起感染的病原菌，以B型嗜血桿菌最常見，其他的病原菌還有肺炎鏈球菌、A 型鏈球菌、B型鏈球菌、C型鏈球菌、念珠菌、水痘病毒","C":"給予高濃度的氧氣會有幫助","D":"會厭炎導致呼吸窘迫的患者給予類固醇可以很快地減輕水腫的現象"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":45784,"source":"大白p948","question":"有關肺炎的敘述，下列何者正確?","options":{"A":"由細菌引起的肺間質性發炎也容易讓病人罹患繼發性的病毒性肺炎","B":"由病毒引起的肺間質性發炎也容易讓病人罹患繼發性的細菌性肺炎"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":45785,"source":"大白p948","question":"下列有關病毒性肺炎的敘述，下列何者正確?","options":{"A":"引起肺炎的病毒並不多見，其中以流行性感冒病毒(即流感病毒)佔大多數","B":"大多發生於夏天季節","C":"近年來由於免疫抑制藥物廣泛應用於腫瘤、器官移植以及愛滋病人，所以發病人數逐年增多","D":"B型流感是最常見引發病毒性肺炎的原因"},"answer":"A","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":45786,"source":"大白p948","question":"在所有急性呼吸道感染中，病毒感染占絕大多數，在非細菌性肺炎中，病毒感染約占多少比例?","options":{"A":"5-10%","B":"30-70%","C":"25-50％","D":"80-90%"},"answer":"C","manualChapter":"CH35","matchedChapters":["CH35","背誦題"]},{"id":45787,"question":"清潔、消毒用漂白水(次氯酸鈉)皆應新鮮泡製，並於泡製後多久內使用完畢?","options":{"A":"1小時","B":"24小時","C":"3天","D":"7天"},"answer":"B","source":"大白p1122","manualChapter":"背誦題"},{"id":45788,"question":"清潔、消毒用漂白水(次氯酸鈉)皆應新鮮泡製，並於泡製後多久內使用完畢?","options":{"A":"1小時","B":"24小時","C":"3天","D":"7天"},"answer":"B","source":"大白p1122","manualChapter":"CH43"},{"id":45789,"question":"填入空格：胰腺位於____，右側鄰近____，並延伸至左側脾臟","options":{"A":"腹膜後、十二指腸","B":"腹膜後、肝臟","C":"腹膜前、肝臟","D":"腹膜前、十二指腸"},"answer":"A","source":"大白p987","manualChapter":"CH37"},{"id":45790,"question":"根據美國醫學研究院 (IOM) 的定義，下列哪一項「不符合」新興感染症 (Emerging Infectious Diseases) 的特徵？","options":{"A":"在過去 20 年內才出現在人類族群的疾病","B":"疾病的發生率在人群中呈現快速增加的趨勢","C":"疾病的宿主專一性極高，只侷限在單一特定地區，地理分布範圍不斷縮小","D":"微生物發展出新的抗藥性機制（如多重抗藥性結核菌）"},"answer":"C","explanation":"新興感染症的特徵包含地理分布「擴張」而非縮小。在全球化與交通發達的影響下，傳染病往往能在極短時間內跨國界傳播。","source":"AI","manualChapter":"CH43"},{"id":45791,"question":"阻斷傳染病傳播最有效且最容易介入的環節是「感染鏈 (Chain of Infection)」中的哪一個部分？","options":{"A":"易感宿主 (Susceptible host)","B":"傳染窩 (Reservoir)","C":"傳染途徑 (Modes of transmission)","D":"感染源釋出的出口 (Portals of exit)"},"answer":"C","explanation":"感染鏈包含六個要素，只要阻斷其中一項就能防止感染發生。其中「傳染途徑 (Modes of transmission)」是最容易透過公共衛生手段（如戴口罩防飛沫、洗手防接觸、隔離等）來打斷的環節。","source":"AI","manualChapter":"CH43"},{"id":45792,"question":"一名 3 歲幼童因突發性持續嘔吐與發燒求診。救護人員評估時發現幼童手掌、腳掌及口腔有散在性的小水泡。家屬表示幼童在睡覺時會出現「無故驚嚇、全身肌肉突然抖動」的現象。依據這些臨床表徵，救護員應高度懷疑此幼童面臨下列何種致命併發症的風險？","options":{"A":"天花病毒引發的敗血性休克","B":"腸病毒 71 型引發的腦幹腦炎與肺水腫","C":"鉤端螺旋體引發的急性腎衰竭","D":"流行性腦脊髓膜炎引發的瀰漫性血管內凝血 (DIC)"},"answer":"B","explanation":"手腳與口腔的水泡為「手足口病」特徵，主要由腸病毒 71 型或 A 族克沙奇病毒引起。若病童出現「嗜睡、持續嘔吐、肌躍型抽搐、無故心跳呼吸加快」四大前兆，代表病毒已侵犯中樞神經，極易引發致命的腦幹腦炎與肺水腫。","source":"AI","manualChapter":"CH43"},{"id":45793,"question":"在台灣南部，每逢颱風或嚴重水災過後，若民眾接觸受汙染的泥水與土壤，容易爆發一種被稱為「偉大摹仿者」的傳染病。此病可表現為皮膚潰瘍，嚴重時會引發猛爆性敗血症與肺炎。請問此新興傳染病為何？","options":{"A":"登革熱 (Dengue fever)","B":"類鼻疽 (Melioidosis)","C":"萊姆病 (Lyme disease)","D":"兔熱病 (Tularemia)"},"answer":"B","explanation":"類鼻疽 (Melioidosis) 是台灣南部風災水患後常見的土壤/水源傳染病，因其臨床症狀千變萬化（從皮膚潰瘍到敗血症），故有「偉大摹仿者 (The great imitator)」之稱。","source":"AI","manualChapter":"CH43"},{"id":45794,"question":"流感病毒之所以能屢次造成「世界性大流行 (Pandemic)」，主要是因為不同來源（如禽類、豬、人類）的病毒株在同一宿主體內發生了基因段互換與重新排列組合。這種導致抗原發生「大改變」的機制稱之為？","options":{"A":"抗原漂變 (Antigenic drift)","B":"抗原轉變 (Antigenic shift)","C":"基因重組 (Genetic cloning)","D":"潛伏期活化 (Reactivation)"},"answer":"B","explanation":"抗原轉變 (Antigenic shift)：基因段重新排列組合產生全新亞型，人類對其無抗體，導致「世界性大流行」。抗原漂變 (Antigenic drift)：基因點突變，抗原發生微小改變，導致每年的「季節性流行」。","source":"AI","manualChapter":"CH43"},{"id":45795,"question":"關於「鉤端螺旋體病 (Leptospirosis)」，下列敘述何者錯誤？","options":{"A":"主要傳染途徑是經由接觸受感染動物（如老鼠）尿液汙染的水或土壤","B":"臨床上一項非常具有特徵性的指標 (pathognomonic sign) 為「結膜充血」","C":"嚴重者會出現黃疸、急性腎衰竭及出血傾向，稱為威爾氏症候群 (Weil's syndrome)","D":"它是一種只會透過病媒蚊叮咬傳播的病毒性疾病"},"answer":"D","explanation":"鉤端螺旋體病是「人畜共通傳染病」，主要透過皮膚、黏膜傷口接觸到受感染動物（老鼠、狗等）「尿液汙染的水或泥土」而感染，並非透過病媒蚊叮咬傳播。","source":"AI","manualChapter":"CH43"},{"id":45796,"question":"在生物恐怖主義中，美國 CDC 將潛在的生物武器分為 A、B、C 三類。下列何者「不屬於」威脅最大、最優先防範的「A 類生物戰劑」？","options":{"A":"炭疽病 (Anthrax)","B":"鼠疫 (Plague)","C":"肉毒桿菌毒素 (Botulism)","D":"漢他病毒 (Hantavirus)"},"answer":"D","explanation":"美國 CDC 的 A 類生物戰劑包含：炭疽病、天花、鼠疫、肉毒桿菌毒素、兔熱病、病毒性出血熱。漢他病毒 (Hantavirus) 被歸類為 C 類戰劑。","source":"AI","manualChapter":"CH43"},{"id":45797,"question":"救護人員接獲通報前往處理一起疑似生化恐怖攻擊事件。多名病患同時出現「視力模糊、眼瞼下垂、吞嚥困難及口齒不清」，且症狀逐漸向下蔓延至四肢，導致無力與呼吸困難。所有病患皆「無發燒」且「意識完全清醒」。請問最可能是受到下列何種生物戰劑攻擊？","options":{"A":"炭疽桿菌 (Bacillus anthracis)","B":"天花病毒 (Smallpox virus)","C":"肉毒桿菌毒素 (Botulinum toxin)","D":"伊波拉病毒 (Ebola virus)"},"answer":"C","explanation":"肉毒桿菌毒素 (Botulinum toxin) 是強烈的神經毒素，會阻斷乙醯膽鹼釋放。典型特徵為「無發燒、意識清醒」，且呈現「由上而下（下行性）」的對稱性弛緩性麻痺，最先影響腦神經（眼瞼下垂、吞嚥/構音困難），最後死於呼吸衰竭。","source":"AI","manualChapter":"CH43"},{"id":45798,"question":"若恐怖份子將「炭疽桿菌芽孢」製成氣溶膠武器散佈在空氣中。病患吸入後，初期會出現類似感冒的症狀，隨後在 2~3 天內迅速惡化為嚴重的呼吸衰竭與休克。在急診拍攝胸部 X 光時，最可能發現下列哪一種極具特徵性的影像學異常？","options":{"A":"肺尖出現明顯空洞 (Apical cavitation)","B":"寬縱膈腔 (Widened mediastinum)","C":"雙側瀰漫性細小結節 (粟粒狀陰影)","D":"氣胸伴隨張力性氣腫"},"answer":"B","explanation":"吸入型炭疽病 (Inhalational anthrax) 發病極快且致命。炭疽桿菌芽孢在肺部與淋巴結大量繁殖並釋放毒素，導致嚴重的縱膈腔炎與出血。因此，胸部 X 光上呈現「寬縱膈腔 (Widened mediastinum)」是其極具代表性的早期指標。","source":"AI","manualChapter":"CH43"},{"id":45799,"question":"在歷史上已被宣布絕跡，但仍被視為極具威脅的 A 類生物戰劑「天花 (Smallpox)」，其出疹的特徵與常見的水痘 (Chickenpox) 有顯著不同。下列何者為「天花」的典型皮疹特徵？","options":{"A":"皮疹呈現「向心性分佈」，也就是軀幹的疹子比四肢多","B":"在同一身體部位，可以同時看到斑疹、水泡、膿皰與結痂等「不同階段」的皮疹混雜在一起","C":"所有皮疹的發展階段都是「同步」的，亦即同一區域的皮疹會同時變成水泡或同時化膿","D":"皮疹通常伴隨極度強烈的搔癢感，且絕不會長在手掌與腳底"},"answer":"C","explanation":"「天花」皮疹的兩大特徵為：(1) 離心性分佈（臉部、手腳掌極多）。(2) 所有皮疹的演化階段「同步」（同一區域的皮疹會一起變成水泡、一起結痂）。相對地，水痘則是「向心性分佈」，且同一區域可見「新舊雜陳、各個階段都有」的皮疹。","source":"AI","manualChapter":"CH43"},{"id":45800,"question":"關於防護裝備的等級分類，若救護技術員面對的是「未知種類、未知濃度」，且可能同時對呼吸道與皮膚造成極高危害的致命化學/生物物質外洩現場（熱區），必須穿著下列哪一個等級的防護裝備？","options":{"A":"等級 A (Level A)","B":"等級 B (Level B)","C":"等級 C (Level C)","D":"等級 D (Level D)"},"answer":"A","explanation":"等級 A (Level A) 提供最高等級的呼吸道、眼睛、黏膜與「皮膚」防護。使用全封閉氣密式防護衣與內置 SCBA。專門用於未知物質或已知會對皮膚與呼吸道造成極度致命危害的熱區。","source":"AI","manualChapter":"CH43"},{"id":45801,"question":"根據美國 CDC 針對傳播途徑所訂定的隔離防護措施，下列哪一組傳染病必須嚴格執行「空氣防護措施 (Airborne precautions)」，即病患需入住負壓隔離病房，且醫護人員必須配戴 N95 以上等級之口罩？","options":{"A":"流行性感冒、腸病毒、登革熱","B":"腦膜炎雙球菌、百日咳、退伍軍人症","C":"水痘、麻疹、開放性肺結核","D":"萊姆病、瘧疾、A型肝炎"},"answer":"C","explanation":"「空氣防護措施 (Airborne precautions)」適用於飛沫核 ≤5μm 的病原體。經典代表為：水痘、麻疹、開放性肺結核、SARS、天花。這些病原體會懸浮於空氣中，需 N95 口罩與負壓病房。","source":"AI","manualChapter":"CH43"},{"id":45802,"question":"救護車在載運完一名大量吐血的病患後，車廂地板與擔架上殘留了一大灘（約 50 cc）的血液。依據感染管制原則，救護員應如何正確泡製與使用漂白水（次氯酸鈉）來進行環境清消？","options":{"A":"血液量大於 10 cc，應直接使用低濃度 (1,000 ppm) 的漂白水進行覆蓋與擦拭","B":"血液量大於 10 cc，應先使用高濃度 (5,000 ppm) 的漂白水進行去汙，清除有機物質後再進行徹底清消","C":"為求方便，可一次泡製好大量 5,000 ppm 漂白水，分裝在噴霧罐中存放半年以便隨時使用","D":"為了達到「完全消毒 (Sterilization)」，必須將漂白水濃度提高至 10,000 ppm，才能殺死所有細菌內孢子"},"answer":"B","explanation":"大於 10 cc 的大量血液/有機物汙染，會消耗漂白水的有效成分，因此必須先用 5,000 ppm 的高濃度漂白水進行覆蓋與初步去汙。此外，漂白水極易自然衰減，必須「新鮮泡製」，且於 24 小時內使用完畢，不可久放。","source":"AI","manualChapter":"CH05"},{"id":45803,"question":"所謂的「中階滅菌 (Intermediate-level disinfection)」，其消毒能力與適用範圍為何？","options":{"A":"僅能殺死部分病毒與一般細菌，對結核分枝桿菌無效","B":"可以殺死包含結核桿菌在內的大部分病原體，但「無法」殺死細菌的內孢子 (Spores)","C":"可以完全殺滅所有微生物，包含高抵抗力的細菌內孢子","D":"屬於最高規格的滅菌法，通常用於會侵入病患體內無菌區域的手術器械"},"answer":"B","explanation":"「中階滅菌」能殺死包含結核桿菌 (Mycobacterium tuberculosis) 在內的大部分細菌、病毒與黴菌，但無法殺滅最高抵抗力的「細菌內孢子 (Spores)」。完全殺滅內孢子必須靠「完全消毒/滅菌 (Sterilization)」。","source":"AI","manualChapter":"CH43"},{"id":45804,"question":"「肺鼠疫 (Pneumonic plague)」若被作為生物武器發動攻擊，其威脅性極高。關於肺鼠疫的敘述，下列何者錯誤？","options":{"A":"潛伏期極短，通常為 16 天","B":"病患會出現嚴重的咳嗽，並咳出水樣、帶血色的泡沫痰或大量咯血","C":"原發性肺鼠疫無法透過人與人之間的「飛沫」傳染，必須被受感染的跳蚤叮咬才會致病","D":"若未及時給予適當的抗生素治療，死亡率可高達 90100%"},"answer":"C","explanation":"「腺鼠疫」通常由跳蚤叮咬傳播；但「肺鼠疫」可以直接透過病患咳嗽的飛沫，在「人與人之間」快速傳播，這也是它被視為極危險生物武器的原因。","source":"AI","manualChapter":"CH43"},{"id":45805,"question":"N95 口罩是應對空氣傳染病的重要防護裝具。關於 N95 口罩的規格意義，下列敘述何者正確？","options":{"A":"\"N\" 代表該口罩針對「油性懸浮微粒 (Oil-based particulates)」具有極佳的防護力","B":"\"95\" 代表該口罩能過濾掉空氣中至少 95% 的揮發性有機化學毒氣","C":"若執行高風險的呼吸道處置（如插管），即使戴了 N95 口罩，仍建議病患端加裝 HEPA 濾網以減少氣溶膠噴濺","D":"只要有配戴 N95 口罩，無須進行密合度測試 (Fit test) 即可保證達到 95% 的防護效果"},"answer":"C","explanation":"N 代表 \"Not resistant to oil\"（不防油性微粒）。它主要過濾非油性懸浮微粒（大於 0.3 微米，過濾效率 ≥95%），無法過濾化學毒氣。配戴 N95 必須經過密合度測試 (Fit test) 才能確保無漏氣。為減少氣溶膠噴濺，高風險呼吸道處置建議搭配 HEPA 濾網。","source":"AI","manualChapter":"CH43"},{"id":45806,"question":"嚴重急性呼吸道症候群 (SARS)、中東呼吸症候群 (MERS) 與嚴重特殊傳染性肺炎 (COVID-19) 皆屬於冠狀病毒感染。關於這三種疾病的共同點與相異點，下列敘述何者錯誤？","options":{"A":"這三種冠狀病毒的起源或中間宿主，研究皆指出與蝙蝠或其他野生動物有高度關聯","B":"它們皆會引發下呼吸道感染，嚴重時導致 ARDS (急性呼吸窘迫症候群)","C":"COVID-19 的致死率雖然低於 SARS 與 MERS，但因存在大量「無症狀感染者」，導致其傳播範圍最廣","D":"MERS 的主要動物宿主是果子狸，因此赴中東旅遊應避免接觸果子狸"},"answer":"D","explanation":"SARS 的可能中間宿主是果子狸 (Civet cats)；而 MERS 的主要動物宿主是中東地區的「單峰駱駝」。","source":"AI","manualChapter":"CH43"},{"id":45807,"question":"某些高危險性的傳染病病患在治療與運送時，必須穿戴特定等級的防護裝備。若救護員面對的是「已知濃度不高，且主要危害為呼吸道，對皮膚吸收危害極低」的生化事故（如在遠離熱區的溫區或冷區工作），通常最低應穿著何種等級的防護裝備？","options":{"A":"等級 A","B":"等級 B","C":"等級 C","D":"等級 D (一般制服)"},"answer":"C","explanation":"等級 C 防護服（C 級）提供與 B 級相近的皮膚防護（防潑濺），但使用 PAPR 或濾毒罐（而非 SCBA）作為呼吸防護。適用於「危害物質與濃度已知，不會透過皮膚大量吸收，且空氣中氧氣濃度足夠」的環境（如溫區除汙站）。","source":"AI","manualChapter":"CH43"},{"id":45808,"question":"在鑑別各類生物戰劑的臨床表徵時，如果病患出現「發燒、畏寒、局部出現會癢的丘疹，隨後發展成周圍嚴重水腫、中央帶有『黑色壞死焦痂 (Eschar)』的無痛性潰瘍」。請問這是哪一種生物戰劑感染的典型表現？","options":{"A":"天花病毒 (Smallpox)","B":"皮膚型炭疽病 (Cutaneous anthrax)","C":"兔熱病 (Tularemia)","D":"腺鼠疫 (Bubonic plague)"},"answer":"B","explanation":"接觸炭疽桿菌芽孢後，皮膚會出現水泡，隨後破裂形成中央凹陷、呈現黑色的「無痛性焦痂 (Eschar)」，這是「皮膚型炭疽病 (Cutaneous anthrax)」的經典特徵。","source":"AI","manualChapter":"CH43"},{"id":45809,"question":"當急救現場面臨疑似生物恐怖攻擊時，最難以在第一時間確認並啟動應變計畫的原因為何？","options":{"A":"生物戰劑通常會產生劇烈的爆炸聲與閃光，導致現場混亂無法評估","B":"生物武器的攻擊通常具有「長短不一的潛伏期」，病患往往在離開暴露現場數天後才在各地醫院陸續發病","C":"生物武器的散佈裝置龐大且極易被肉眼察覺，恐怖分子難以隱藏","D":"所有的生物戰劑皆會散發出濃烈的大蒜或芥末氣味，容易與化學毒氣混淆"},"answer":"B","explanation":"生物恐怖攻擊最大的威脅與偵測阻礙在於其「隱蔽性」與「潛伏期」。病原體通常無色無味，釋放時毫無動靜。受害者吸入後不會立刻發病，而是四散到各地，數天後才陸續湧入醫院，導致難以第一時間界定攻擊現場與暴露範圍。","source":"AI","manualChapter":"CH43"},{"id":45810,"question":"請問何謂Mallory-Weiss syndrome 的症狀?","options":{"A":"血糖濃度下降，鈉、鉀離子不平衡，身體含水量流失及血壓下降，使得身體無法維持正常的血液循環","B":"細胞外的體液滲透壓突然下降，對中樞神經細胞內以及腦脊髓液的滲透壓造成影響","C":"劇烈嘔吐造成食道裂傷出血","D":"高燒、黃疸、急性腎症衰竭、血液凝固異常、及多重器官病變及衰竭"},"answer":"C","source":"大白","manualChapter":"綜合題"},{"id":45811,"question":"請問何謂Mallory-Weiss syndrome 的症狀?","options":{"A":"血糖濃度下降，鈉、鉀離子不平衡，身體含水量流失及血壓下降，使得身體無法維持正常的血液循環","B":"細胞外的體液滲透壓突然下降，對中樞神經細胞內以及腦脊髓液的滲透壓造成影響","C":"劇烈嘔吐造成食道裂傷出血","D":"高燒、黃疸、急性腎症衰竭、血液凝固異常、及多重器官病變及衰竭"},"answer":"C","source":"大白","manualChapter":"背誦題"},{"id":45812,"question":"癌症病人中多少比例的人會發生腫瘤伴隨症候群?","options":{"A":"5%","B":"15%","C":"40%","D":"65%"},"answer":"B","source":"p1042","manualChapter":"CH39"},{"id":45813,"question":"癌症病人中多少比例的人會發生腫瘤伴隨症候群?","options":{"A":"5%","B":"15%","C":"40%","D":"65%"},"answer":"B","source":"p1042","manualChapter":"背誦題"},{"question":"小兒低血糖定義? 新生兒血糖值小於多少以及嬰兒血糖值小於多少?","options":{"A":"90、90","B":"45、60","C":"70、60","D":"70、70"},"answer":"B","source":"大白p1277","id":45814,"manualChapter":"背誦題"},{"question":"小兒低血糖定義? 新生兒血糖值小於多少以及嬰兒血糖值小於多少?","options":{"A":"90、90","B":"45、60","C":"70、60","D":"70、70"},"answer":"B","source":"大白p1277","id":45815,"manualChapter":"CH48"},{"question":"填入空格：大部分的人在____歲都有骨質疏鬆，因為這時候的骨質密度會減少____","options":{"A":"80、1/2","B":"80、1/3","C":"70、1/2","D":"70、1/3"},"answer":"D","source":"大白p1254","id":45816,"manualChapter":"CH47"},{"question":"填入空格：大部分的人在____歲都有骨質疏鬆，因為這時候的骨質密度會減少____","options":{"A":"80、1/2","B":"80、1/3","C":"70、1/2","D":"70、1/3"},"answer":"D","source":"大白p1254","id":45817,"manualChapter":"背誦題"},{"question":"血紅素中何種帶電的狀態稱為變性血紅素?","options":{"A":"鐵離子帶3價正電","B":"鐵離子帶3價負電","C":"鐵離子帶2價正電","D":"鐵離子帶2價負電"},"answer":"A","source":"大白","id":45818,"manualChapter":"CH50"},{"question":"血紅素中何種帶電的狀態稱為變性血紅素?","options":{"A":"鐵離子帶3價正電","B":"鐵離子帶3價負電","C":"鐵離子帶2價正電","D":"鐵離子帶2價負電"},"answer":"A","source":"大白","id":45819,"manualChapter":"背誦題"},{"question":"病人在食入毒物後幾小時內就接受處置，腸胃道除污是有用的","options":{"A":"1","B":"3","C":"5","D":"8"},"answer":"A","source":"大白p1318","id":45820,"manualChapter":"CH50"},{"question":"病人在食入毒物後幾小時內就接受處置，腸胃道除污是有用的","options":{"A":"1","B":"3","C":"5","D":"8"},"answer":"A","source":"大白p1318","id":45821,"manualChapter":"背誦題"},{"question":"有關活性碳進行腸胃道除污敘述，何者錯誤?","options":{"A":"活性碳在給予病人之前會先製備為水狀溶液並且視情況加入瀉劑","B":"併發症包含病人接受度很差(兒童尤其是如此)以及嘔吐","C":"活性碳加入瀉劑可以讓腸子的輸送時間降低，並且讓活性碳在很短的時間內排出體外","D":"活性碳是將木材稍微加熱後(約攝氏78度)所製成的，是一種惰性的、無毒的木質材質的產物"},"answer":"D","source":"大白p1318","id":45822,"manualChapter":"CH50"},{"question":"嚴重的鐵中毒指的是食入超過每公斤多少毫克(mg/kg)則會產生心血管衰竭以及死亡。","options":{"A":"10","B":"60","C":"100","D":"300"},"answer":"B","source":"大白","id":45823,"manualChapter":"CH50"},{"question":"嚴重的鐵中毒指的是食入超過每公斤多少毫克(mg/kg)則會產生心血管衰竭以及死亡。","options":{"A":"10","B":"60","C":"100","D":"300"},"answer":"B","source":"大白","id":45824,"manualChapter":"背誦題"},{"question":"對大部分的植物毒素來說，血液透析有移除效果嗎?","options":{"A":"有","B":"沒有","C":"","D":""},"answer":"B","source":"大白p1328","id":45825,"manualChapter":"CH50"},{"question":"對大部分的植物毒素來說，血液透析有移除效果嗎?","options":{"A":"有","B":"沒有","C":"","D":""},"answer":"B","source":"大白p1328","id":45826,"manualChapter":"背誦題"}];
    const searchInput = document.getElementById("search-input");
    const searchBtn = document.getElementById("search-btn");
    const resultsContainer = document.getElementById("results-container");

    function setTheme(themeName, btnElement) {
      if (themeName === "default") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", themeName);
      }
      document.querySelectorAll(".theme-btn").forEach(btn => btn.classList.remove("active"));
      btnElement.classList.add("active");
    }

    function doSearch() {
      const keyword = searchInput.value.trim().toLowerCase();
      resultsContainer.innerHTML = "";

      if (!keyword) {
        resultsContainer.innerHTML = '';
        return;
      }

      const results = questions.filter(q => {
        if (q.id && q.id.toString() === keyword) return true;
        if (q.question && q.question.toLowerCase().includes(keyword)) return true;
        if (q.options) {
          for (const key in q.options) {
            if (q.options[key] && q.options[key].toLowerCase().includes(keyword)) return true;
          }
        }
        if (q.explanation && q.explanation.toLowerCase().includes(keyword)) return true;
        return false;
      });

      if (results.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results">找不到符合的題目</div>';
        return;
      }

      function highlight(text, kw) {
        if (!kw) return text;
        const regex = new RegExp("(" + kw.replace(/[.*+?^${}()|[]\]/g, '\$&') + ")", "gi");
        return text.replace(regex, '<mark style="background-color: yellow; padding: 0 2px;">$1</mark>');
      }

      const html = results.map(q => {
        let html = '<div class="q-item">';
        html += '<div class="q-chapter">分類: ' + (q.manualChapter || '未分類') + ' | ID: ' + (q.id || 'N/A') + ' | 來源: ' + (q.source || '無') + '</div>';
        html += '<div class="q-text">' + highlight(q.question, keyword) + '</div>';
        if (q.options) {
          html += '<ul class="q-options">';
          Object.entries(q.options).forEach(([k, v]) => {
            html += '<li>' + k + '. ' + highlight(v, keyword) + '</li>';
          });
          html += '</ul>';
        }
        if (q.answer) {
          html += '<div style="margin-top: 1rem; font-weight: bold; color: var(--primary-color);">正確答案：' + q.answer + '</div>';
        }
        if (q.explanation) {
          let expHtml = q.explanation.replace(/\n/g, '<br>');
          html += '<div style="margin-top: 0.5rem; padding: 1rem; background-color: #f1f5f9; border-left: 4px solid var(--secondary-color); font-size: 0.95rem; border-radius: 4px;"><strong>💡 解析：</strong><br>' + highlight(expHtml, keyword) + '</div>';
        }
        html += '</div>';
        return html;
      }).join("");

      resultsContainer.innerHTML = '<div style="margin-bottom:1rem; color:var(--text-muted);">共找到 ' + results.length + ' 題</div>' + html;
    }

    searchBtn.addEventListener("click", doSearch);
    searchInput.addEventListener("input", doSearch); // 動態搜尋
    searchInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") doSearch();
    });
  </script>
</body>
</html>
