tion":"洗腎的病患，若需要設立靜脈路徑時，以下是需要注意的事項，何者為非？","options":{"A":"若沒有必要，不要滴注點滴，以免造成肺水腫","B":"要注意洗腎瘻管，儘量不要使用瘻管抽血或給藥","C":"若設立靜脈時失敗，須移除針具時，需特別注意要壓迫注射處較長的時間，以避免出血","D":"若不小心注射到洗腎瘻管，造成出血，務必用彈性繃帶緊緊的纏繞著出血處，以避免嚴重出血"},"answer":"D","manualChapter":"CH41"},{"id":337,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"關於台灣緊急醫療救護系統的設計，以下何者為是？","options":{"A":"台灣屬於歐陸體系","B":"台灣屬於北美體系","C":"北美體系為以醫師為主體執行到院前救護","D":"歐陸體系由受過不同等級訓練與授權的救護技術員做為醫師在到院前救護的延伸"},"answer":"B","manualChapter":"CH01"},{"id":339,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"根據傷病患與事故的類型，緊急醫療救護的現場治療原則，可以區分為兩種模式，亦即「心臟模式」與「創傷模式」，以下關於兩種模式的敘述何者為是？","options":{"A":"心臟模式的原則是盡速送醫（Load and Go）","B":"創傷模式的原則是現場穩定（Stay and Play）","C":"對於創傷傷患，救護技術員的任務在於提供確切醫療","D":"對於突發性心跳停止的病患，應盡量在到院前開始施行高級救命術"},"answer":"D","manualChapter":"CH01"},{"id":340,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"關於高級救護技術員的敘述，以下何者為是？","options":{"A":"高級救護技術員就是高級的中級救護技術員","B":"高級救護技術要能夠獨立完成高級救命術（Advanced Life Support）","C":"高級救護技術員執行高級救命術無法改善呼吸窘迫病患的出院存活率","D":"高級救護技術員沒有接受繼續教育的需要"},"answer":"B","manualChapter":"CH03"},{"id":345,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"派遣中心接到電話至救護人員到達現場的時間間距是屬於品質測量三大構面中的哪一面？","options":{"A":"結構面","B":"過程面","C":"結果面","D":"起始面"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":346,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"到院前心肺停止的病患在到院前回復自然心律的比例是屬於品質測量三大構面中的哪一面？","options":{"A":"結構面","B":"過程面","C":"結果面","D":"起始面"},"answer":"C","manualChapter":"CH09"},{"id":347,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"有健康的救護技術員，才能有健全的緊急醫療救護系統，為了保持身心健康，您接受定期體檢，養成良好的飲食與運動習慣，流感季節期間接受疫苗注射，並定期接受胸部X光篩檢，在工作中遇到無法排解的壓力，會尋求心理諮商來協助，以下有關疾病自然史與三段五級預防，下列敘述何者為非？","options":{"A":"「良好的飲食與運動習慣」屬於初段預防","B":"「流感季節期間接受疫苗注射」是在疾病的可感受期提供保護","C":"「定期接受胸部X光篩檢」屬於次段預防","D":"「尋求心理諮商協助」是屬於健康促進"},"answer":"D","manualChapter":"CH03"},{"id":348,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"王先生是一位肺癌末期的病患，因而早已預立不施行急救的意願書，您接獲家人報案後至現場，現場家屬表示王先生由於久病厭世，服用大量嗎啡企圖自殺，初步評估:病人意識不清GCS E1V2M4，成針孔瞳孔，呼吸次數8/分鐘，血氧濃度80%，現場家屬很多，但各持一方意見，有些要你趕快送醫，有些則希望遵從患者DNR的遺願阻止你送醫，下列敘述何者為是？","options":{"A":"遵從病患自主，解釋後不予送醫","B":"病患有自殺行為，採強迫同意，強制送醫","C":"依現場家屬在安寧療護法的順位（配偶、成年子女、父母⋯·），決定送醫與否","D":"請現場家屬盡速討論，待家屬有共識後，再決定是否送醫"},"answer":"B","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":349,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"有關2001年，美國國家醫學研究院（IOM）訂出醫療照護品質的六大面向和目標，何者為非？","options":{"A":"病患為中心（Patient-centeredness）","B":"有效（Effectiveness）","C":"效率（Effliciency）","D":"預後（Prognosis）"},"answer":"D","manualChapter":"CH09"},{"id":350,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"某縣市政府消防局救護科為了提升高級救護技術員到院前氣管内插管成功率，除進行標竿學習外，亦同時邀請高級救護技術員針對插管失敗原因進行分析，以作為後續教育訓練的參考。請問分析過程中，你會使用下列何種圖表，最方便清楚表達插管失敗各個原因百分比所占的比率高低，得以針對重點項目，提出改善插管成功率之教育訓練計畫?","options":{"A":"因果圖（Cause and effect diagram）","B":"流程圖（Flow chart）","C":"柏拉圖分析（Pareto analysis）","D":"組織圖（Organizational chart）"},"answer":"C","manualChapter":"CH09"},{"id":352,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"緊急醫療救護體系的醫療指導制度（EMS Medical Director）指導型式，按照時序，有三種方式，下列何者為非？","options":{"A":"救護技術員的教育訓練屬於前瞻性（prospective/offline）醫療指導模式的一種","B":"救護紀錄表回顧，屬於回溯性（retrospective/offline）醫療指導模式·相較其他模式，比較容易進行","C":"無線通訊指示，屬於即時性（concurrent/online）醫療指導模式，可以直接反映緊急救護品質，省時又省力","D":"預立醫療流程，屬於前瞻性（prospective/offline）醫療指導模式，可以事前確保人員的品質與救護流程的正確性"},"answer":"C","manualChapter":"CH02"},{"id":353,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"心臟模式是針對疾病患者的緊急醫療救護模式，而創傷模式則是針對創傷病患的緊急醫療救護模式，兩者的現場救護原則有否異同？","options":{"A":"前者為「現場穩定」（stay and play）；後者為「盡速送醫」（load and go）","B":"高级教技術員應依自身之經驗與能力，靈活運用。","C":"前者為「盡速送醫」（load and go）；後者為「現場穩定」（stay and play）","D":"高級救護技術員應依出勤人數與攜帶之救護器材，綜合判斷"},"answer":"A","manualChapter":"CH01"},{"id":354,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"有關緊急醫療救護系統下列何者為非？","options":{"A":"緊急醫療救護（Emergency Medical Service-EMS），指針對急重症的傷病患，在緊急傷病的現場、就醫的途中、乃至到達醫院急診部門所提供的醫療救護服務·在社區提供這些服務，結合各個要素，所成立的一套體系，則稱之為緊急醫療救護系統（Emergency Medical Services Systems-EMSS）","B":"救護技術員（Emergency Medical Technicians），簡稱為EMT，為受過不同等級訓練與授權的救護技術人員。作為緊急醫療救護的第一反應人員，或成為醫師在到院前救護的延伸（physician extenders），是緊急醫療救護體系的重要骨幹","C":"緊急醫療救護指揮中心（Emergency Medical Dispatch Center），可以透過有線與無線通訊，網際網路，地理資訊，來結合民眾的緊急救護需求，以及到院前救護和醫療資源。達到適當的傷病患，以適當的方式，在適當的時間，送達適當醫療機構的目的","D":"優先派遣（Priority Dispatch）是根據各地消防局訂定之關鍵問題（key questions）的詢問，在最短時間內派遣救護團隊前往現場進行救護"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":355,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"有關預防救護車意外，下列何者為非？","options":{"A":"盡情運用閃光與鳴笛","B":"適當的救優先派遣·救護案件，並非全是危急個案·非危急個案，則一般反應即可","C":"安全通過路口","D":"注意現場停車安全，必要時做安全警戒"},"answer":"A","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":356,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"下列何者非『過程面』之緊急救護體系品管指標？","options":{"A":"疑似因心疾病引起胸痛病患，有多少比例接受心電圖檢查","B":"出勤模式是否依據「緊急醫療救護派遣規則系統」","C":"實行氣管插管之傷病患中，誤插入食道但未被發現之比例為何","D":"每一千次出勤之交通事故比例"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":357,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"現代緊急醫療救護的濫觴，自於何種醫學？","options":{"A":"街道醫學","B":"重症醫學","C":"急診醫學","D":"軍陣醫學"},"answer":"D","manualChapter":"CH01"},{"id":358,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"下列關於台灣地區緊急醫療救護系統的描述，何者為非？","options":{"A":"突發性心跳停止，存活率每分鐘下降7~10%，因此採取儘速送醫（Load and Go）模式","B":"台灣的緊急醫療救護體系人力組成設計，是屬於北美體系（Anglo-American system）","C":"緊急醫療救護體系中的救護人員，包括醫師、護理師、及救護技術員","D":"台灣急救責任醫院分為三級，分別為一般級、中度級、及重度級"},"answer":"A","manualChapter":"CH01"},{"id":359,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"有關回溯性醫療指導（Retrospective Medical Direction）模式的敘述，下列何者為非？","options":{"A":"容易進行","B":"較不費時費力","C":"可以及時阻止錯誤發生","D":"是救護品質管理項目之一"},"answer":"C","manualChapter":"CH02"},{"id":360,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"有關醫學倫理的四個原則，最基本與最重要的原則為何？","options":{"A":"自主原則（Respect for Autonomy）","B":"不傷害原則（Do No Harm）","C":"行善原則（Beneficence）","D":"正義原則（Justice）"},"answer":"B","manualChapter":"CH03"},{"id":361,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"意外針扎後，門診追蹤檢驗有無感染受滋病，為疾病自然史與三段五級預防中的？","options":{"A":"初段預防","B":"次段預防","C":"三段預防","D":"特殊保護"},"answer":"B","manualChapter":"CH03"},{"id":362,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"下列敘述有關於緊急救護業務過失的構成要件，何者為非？","options":{"A":"有進行救護處置的義務","B":"救護處置未達標準","C":"對病患或他人造成傷害","D":"造成的傷害與所採取的救護處置無明顯因果關係"},"answer":"D","manualChapter":"CH04","matchedChapters":["CH04"]},{"id":363,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"下列關於品質管理的三大構面分析，何者為非？","options":{"A":"每一千次出勤之交通事故（EMS crashes）比例，屬於「過程面」","B":"疑似因心臟疾病引起之胸痛病患，有多少比例接受阿斯匹靈（aspirin）治療，屬於「過程面」","C":"EMS人員抵達現場後，若傷病患發生心肺功能停止（cardiac arrest），則傷病患能存活至離開急診部門及傷病患能存活至離開醫院之比例，屬於「過程面」","D":"實行氣管插管之傷病患中，誤插入食道但未被發現，屬於「過程面」"},"answer":"C","manualChapter":"CH09"},{"id":364,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"救護技術員執行業務時常會造成職傷害，以下何者為非？","options":{"A":"注射藥物時若發生針扎事件，會導致A型或C型肝炎，甚至HIV的感染可能性","B":"姿勢不良的搬運常會造成背痛，搬運過重傷患時建議以輔具協助","C":"若有暴露到水痘患者，僅配置口罩與手套無法保護自身安全而不被傳染","D":"執行業務導致之創傷後壓力症候群，為救護技術員職業傷害之一"},"answer":"A","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":365,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"醫療指導醫師每月到大隊主持案例討論會，針對案例内容與救護技術員進行一問一答的即時諮詢與討論，這是在進行那一類的醫療指導？","options":{"A":"前膽性","B":"即時性","C":"回溯性","D":"研究性"},"answer":"C","manualChapter":"CH02"},{"id":366,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"我國緊急醫療救護法，所指緊急醫療救護人員，以下何者為非？","options":{"A":"第一反應人員（First responder）","B":"護理人員","C":"救護技術員","D":"醫師"},"answer":"A","manualChapter":"CH01"},{"id":367,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"緊急救護之優先派遣，是以何者為主要判定優先與否之依據？","options":{"A":"病患年齡","B":"關鍵問題","C":"求救者之緊張程度","D":"求救者認定之嚴重度"},"answer":"B","manualChapter":"CH07"},{"id":368,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"民眾接觸緊急醫療救護系統的第一道窗口為何？","options":{"A":"第一反應人員","B":"緊急救護派遣員","C":"到現場之救護技術員","D":"旁觀者"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":369,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"何者不是緊急救護醫療指導醫師的工作範疇？","options":{"A":"緊急醫療救護體系的整體規劃","B":"教育訓練","C":"督導考核緊急救護派遣員","D":"救災救指揮中心值勤"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":370,"source":"第一章 系統運作與品質管理(2015-2018).doc","question":"緊急救護之「反應時間間距（Response Time Interval）」應為？","options":{"A":"以救災救護指揮中心接到電話至救護人員到現場之時間間距計算","B":"以通知出勤至救護人員到達傷病患身旁之時間間距計算","C":"以救災救護指揮中心接到電話至救護人員到達傷病患身旁之時間間距計算","D":"以出勤至救護人員到達傷病患身旁之時間間距計算"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":371,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"以大量傷病患事故，依據START（simple triage and rapid treatment，簡易分類並迅速治療）檢傷法，以下何者的判定最正確？","options":{"A":"12歲孩童，跑來跑去哭喊著找媽媽，呼吸每分鐘45次，微血管充填時間3秒，對工作人員的問話毫不理會，應該判定為紅色","B":"60歲女性，左右小腿均骨折，呼吸每分鐘20次，微血管充填時間1秒，可以和工作人員清楚對談，應該判定為重傷","C":"90歲老公公，左大腿骨折變形，呼吸每分鐘10次，微血管充填時間3秒，意識不清，應判定為黑色","D":"20歲男性，癱軟坐在地上，爬不起來，呼吸每分鐘20次，橈動脈脈搏很強，可以和工作人員清楚對談，應該判定為輕傷"},"answer":"A","manualChapter":"CH52"},{"id":372,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"核災除污的方式，與一般毒化災不一樣，以下何者敘述並不合適？","options":{"A":"外表遭受放射性物質污染者，只要去除衣物，並以肥皂水清洗，便可以達到有效的除污","B":"除污時應該要以硬質刷子大力刷洗皮膚，直到紅腫，才能有效除污","C":"對於輻傷病患，即使只是簡單的開放性傷口，也必須儘早縫合","D":"除污時，沖洗污染部位的液體要儘量避免滴入眼睛，嘴巴，耳道，或開放性傷囗","E":"受到中子照射的人，並未受到輻射污染，並不需要除污"},"answer":"B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":373,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於大型活動（mass gathering）的觀念，以下何者敘述最不正確？","options":{"A":"一般而言、大型活動是指群眾聚集人數超過500人的活動","B":"在1999年的英倫醫學雜誌建議、每千人需有一位急救人員，每二千人需有一輛有高級救護技術員的救護車，每五千人則需一位急診醫師","C":"每次醫療照護、無論是輕微的還是嚴重的案例，最好都能確實填寫一份醫療救護紀錄單","D":"一般建議、如現場無法在五分鐘內提供高級心臟救命術的醫療照顧，現場就必須準備自動體外電擊器"},"answer":"A","manualChapter":"CH54"},{"id":374,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"有關輻射污染現場處理步驟，何者有誤？","options":{"A":"以輻射偵檢器檢測現場所有病患，是否受到輻射物質污染。如無輻射污染，則以一般病患處理無須除污","B":"除污人員需戴雙層外科乳膠手套，外層手套一旦接觸污染即更換，任何的輻射污染物品均要仔細回收","C":"沖水時注意不可潑濺、污染之水要能良好收集、須用紗布棉籤來回擦拭，以免擴散污染，外層手套一旦接觸污染立即更換","D":"以輻射偵檢器檢測病患身上是否仍有輻射殘留。如果如污染區域之輻射劑量在背景值的2～3倍以上，則繼續上述清洗除污步驟"},"answer":"C","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":375,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"有關毒化災傷患緊急處理的現場處理步驟，何者有誤？","options":{"A":"在熱區中任何未著防護衣之人，均應視為受到污染，必須要除污","B":"緊急救護人員協助在熱區中無法行動之傷患脫困，儘量不在熱區中擔擱太多時間，醫療處置僅限於簡單呼吸道維持、頸椎固定及壓迫止血","C":"如眼有器傷口應先清洗，再以防水敷料包紮；眼睛受污染病人，應先以大量生理食鹽水用沖眼器沖洗","D":"如果是固體毒化物顆粒，以刷子儘量移除，再以清水沖洗，如強鹼氫氧化鈉顆粒"},"answer":"D","manualChapter":"CH53"},{"id":377,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"某次災難事件後，媒體盛讚某同仁擔任執行部門長官深具專業典範，該員同時掌控下屬11個單位的活動並達成救災任務。在災後內部討論中，身為事故指揮官的你會給什麼意見？","options":{"A":"欣賞同仁的傑出表現，但若日後遇到類似事故，建議採取「聯合指揮」原則，救災救難會更有效率","B":"欣賞同仁的傑出表現，但若日後遇到類似事故，建議採取「統一指揮」，讓下屬只跟一位上級報告，避免情報混亂","C":"欣賞同仁的傑出表現，但若日後遇到類似事故，建議採取「管理範疇」原則，避同掌控太多下屬單位","D":"欣賞同仁的傑出表現，但若日後遇到類似事故，建議採取「指揮鏈」原則，可以同時掌控更多下屬單位"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":378,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"以下災難應變的概念，何者正確？","options":{"A":"多重傷病患檢傷的概念是在資源嚴重不足下，盡可能使大多數的傷病患可以得到必要治療，START檢傷法是其中的代表","B":"根據事故指揮系統，第一台抵達的應變車輛應該查看現場安全，並等待事故指揮官抵達","C":"應用START檢傷法時，如果你遇到有一個病患無法自行行走且明顯有換氣過度症候群，呼吸速率高達40次／分鐘，應檢為紅色重傷","D":"當後送單位將病患送達醫院後，在醫院內應該進行次級檢傷以決定看診先後次序"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":379,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"下列關於防護衣的觀念何者正確？","options":{"A":"消防人員進入火場使用的的防護衣裝載有個人自給式呼吸系統，已經提供最高呼吸保護，遇到毒化災作業時可以直接當做B級防護衣使用","B":"C式防護衣可能是全身式或二截式，可以防液體潑濺，但無法阻止有毒液體滲入","C":"A級防護衣使用自給式呼吸設備，不會吸人空氣中的有毒物質，但無法阻擋空氣中的有毒物質接觸皮膚造成傷害","D":"輻射事故緊急應變跟一般毒化災應變不同，無論是熱區、暖區或安全區人員，依照規定均需使用A級防護衣"},"answer":"B","manualChapter":"CH53"},{"id":380,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於大型活動之緊急醫療救護，以下何者為是？","options":{"A":"現場醫療站的救護動線選擇，需同時考慮擔架與輪椅的寬度","B":"大型活動急症多屬於意外，依照目前的醫療科技無法預防","C":"若單一救護站遇到五名重傷患者，因為未達15人，所以不可以啟動大量傷患計","D":"規劃醫療作業時，救護站作業應與活動同步，同時開站，同時結束"},"answer":"A","matchedChapters":["CH10"],"manualChapter":"CH10"},{"id":381,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"我國某消防單位受命進行風災緊急應變，請問下列應變措施何者正確？","options":{"A":"在該地區唯一可用聯外道路上設立車輛待命區","B":"將所有的輕傷病患集中在一台巴士上後送是相當危險的作法","C":"無論病患狀況如何，所有後送均應送至最近急救責任醫院，不可聽任病患或家屬要求送往次近醫院","D":"若災區出現志工欲加入救災行列，若現場已成立計劃部門則向該部門報到，否則應指示該員向事故指揮官報到"},"answer":"D","manualChapter":"CH52"},{"id":382,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"根據以下ICS地圖，下列選項何者為是？","options":{"A":"◤是事故地點，可以看到周圍有基地B與營地C圍繞作業","B":"H是hospital的縮寫，指的就是位於山丘制高點的救護站，可以避免化學物質流入救護站","C":"S是staging area的縮寫，指的是待命區，必需有腹地且不會影響交通","D":"最左上角的X是後送站，最好設立在交通方便的市區內以便後送"},"answer":"C","image":"題庫圖片/382.png","manualChapter":"CH52"},{"id":383,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"你受命處理一件疑似化學物質災害事件，經由望遠鏡看到車輛上有以下圖示，請問以下敘述何者正確？","options":{"A":"這是第3類物質，為腐蝕性物質","B":"既然已經有4位數聯合國編號，直接查詢北美應變指南橘色區域，找到第1203個指南就是應變方法","C":"如果現場有煙霧但沒有聞到化學氣味，就代表沒有洩漏，1203可以安全進入現場處理","D":"如果該查詢該物質時，發現該物質名稱同時標有綠色底，表示該物質的揮發物有毒性，需要翻到綠色區域查詢所需的特別保護距離"},"answer":"D","manualChapter":"CH53","matchedChapters":["NeedImage"],"image":"題庫圖片/383.png"},{"id":384,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"某化工實驗室通報火警，抵達現場時看到如下的告示牌，請問以下敘述何者為是？","options":{"A":"此實驗室沒有依照規定提供4位數的聯合國編號，無法經由應變指南查詢，應該經由實驗室提供的物質安全資料表來查詢","B":"可以經由應變指南查詢該物質的4位數聯合國編號為1001（此數字為正確資料），翻到橘色區域編號1001就是該物質的應變指南","C":"應該立即聯絡衛生署毒藥物諮詢中心，依照地區派出相應之環境毒災應變隊","D":"若懷疑病患有遭化學物質污染但沒有立即生命危險，需先行集中於暖區，等待除污走廊設置完成進行除污之後才能後送"},"answer":"D","manualChapter":"CH53","matchedChapters":["NeedImage"],"image":"題庫圖片/384.png"},{"id":385,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於危害物質災難事件的處理，以下敘述何者為是？","options":{"A":"污染區（熱區）與控制區（暖區）的接界走道若可以選擇的話，應擇下風處","B":"如果可以選擇的話，應該經由上風處進入污染區（熱區）","C":"若該物質在北美應變指南中被畫上綠底，表示可能造成輻射傷害，需要立即疏下風處人員","D":"若病患身上有大量粉狀毒化物質，應使用大量清水除污，以免後送後污染醫療院所內部人員與環境"},"answer":"B","manualChapter":"CH53"},{"id":386,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於輻射事故緊急應變的處置，以下敘述何者為是？","options":{"A":"出現輻射傷害症狀的病患，身上必定有殘餘輻射，必須先進行除污之後才能進行醫療照護","B":"若發現病患衣物上有粉狀或固體之疑似輻射污染物質，切勿以水除污，以免產生化學反應","C":"為了避免帶有輻射之砂石顆粒殘留傷囗內，務必以紗布來回擦拭除污","D":"病患除污標準是手持式輻射偵測器檢測劑量在背景值的2～3倍以下即可"},"answer":"D","manualChapter":"CH53"},{"id":387,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"以下關於事故指揮系統中的發言官（public information officer）職掌，何者為是？","options":{"A":"批准新聞發佈","B":"作為事故應變的對口聯絡人，和相關機構交流資訊","C":"定時舉行記者會","D":"評估事故的安全環境與危害物質的狀況，依狀況擬定防護措施。"},"answer":"C","manualChapter":"CH52"},{"id":388,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"某炸彈爆炸案現場發現疑似未爆彈，現場救護指揮官決定跟國軍請求炸彈拆除小組前往處理，該小組成員均有炸彈拆除之處理能力，請問此小組編入現場ICS後可歸類於執行部門的何種單位？","options":{"A":"此小組屬於任務編組（task force）","B":"此小組屬於特勤小組（strike team）","C":"此小組屬於單一資源（single resource）","D":"此小組屬於臨時編組（temporary unit）"},"answer":"B","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":389,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於事故指揮系統的核心價値，以下敘述何者為是？","options":{"A":"共通詞彙（common terminology）：盡量使用當地方言溝通以避免誤解","B":"統一指揮（unity of command）：不同性質的機構進行合作，命令由統一的指揮中心發出","C":"管理範疇（span of command）：意思是指同一時間同時進行的任務，最好不要超過5個","D":"指揮（command）：事故ー開始就必須建立明確的指揮功能，指揮權可以經由書面或口頭轉移給更適任者"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":390,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"2013年4月15日美國波士頓馬拉松爆炸案，現場的醫療指導醫師指示EMT「不做現場檢傷」，以最快的速度將所有的傷者直接搬運到距離現場最近的醫療站，請問以下敘述何者為是？","options":{"A":"這是因為國際賽事現場有許多媒體，若從事現場檢傷會導致媒體圍觀，侵犯病患隱私","B":"這是因為爆炸傷害是特殊狀況，不適用大量傷患檢傷系統","C":"這是因為現場若有可能遭受再次恐怖攻擊，在檢傷之前先行移動傷病患是合理的","D":"這是因為檢傷比脫困更花時間，因此故意省略檢傷步驟"},"answer":"C","manualChapter":"CH52"},{"id":391,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於危險物質洩漏現場之救護，以下敘述何者為是？","options":{"A":"傷患於現場除污後，上救護車應以被單包裹全身，頭髮也必須包覆，擔架推床也須以塑膠袋包裹，盡量避免污染車廂","B":"若現場任何一位工作人員感到不適，應立刻休息並補上另一人員，以免救護工作被延遲","C":"在除污走廊進行除污之工作人員，至少需穿戴D級（級工作服）或以上之防護衣，抗化膠鞋與防毒面罩","D":"可能遭受輻射物質污染之傷口，需以生理食鹽水紗布反覆擦拭以確實除污"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":392,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"危害物質災難事件如果已經被限制在一定範圍內，事故現場可以劃分出污染區（或稱為熱區、紅區）、控制區（或稱為暖區、黃區）及安全區（或稱為冷區、綠區）三個區域，稱為層區管制。關於層區管制的觀念，以下何者敘述最不正確？","options":{"A":"事故周邊直接或間接（如受汙染之傷患及器材）受到危害物質影響之處，應劃定為熱區","B":"安全區在事件開始時即需建立，將支援人員器材集結於此，並設定由下風高處做為暖區及熱區的出入位置","C":"黃區為介於污染區及安全區之間的緩衝區域，作為除污及病人緊急醫療處理之處","D":"除污走廊應該位於暖區"},"answer":"B","manualChapter":"CH53"},{"id":393,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於輻災事故的應變觀念，以下何者敘述最不正確？","options":{"A":"輻射會影響傷囗癒合，所以輻射汙染病患的傷口應該儘可能延遲24小時後再進行縫合","B":"相較於化學物質事故，輻射事故通常不會造成受污染傷者立即性的危害，因此病患除污的急迫性較低","C":"在輻災事故，如果病患的衣物可能沾有輻射物質粉末，應該在移除病患衣物時，先將衣物潤濕，以防止輻射物質擴散至空氣中","D":"輻射污染可以用輻射偵檢器檢測出，通常可以精確地定出污染範圍"},"answer":"A","manualChapter":"CH53"},{"id":394,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於大型活動（mass gathering）的觀念，以下何者敘述最不正確？","options":{"A":"一般而言，大型活動是指群眾聚集人數超過1,000人的活動","B":"在1999年的英倫醫學雜誌建議，大型活動每五百人需有一位急救人員，每一千人需有一輛有高級救護技術員的救護車，每一萬人則需一位急診醫師","C":"無論輕症或重症，每次醫療照護需確實填寫一份醫療救護紀錄單，醫療人員也需要簽名","D":"現場應盡可能維持有救護車待命。若非病患的生命或肢體受威脅，儘量不要派用最後一輛救護車作轉送病患之用"},"answer":"B","manualChapter":"CH54"},{"id":395,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於生物戰劑的觀念，以下何者敘述最不正確？","options":{"A":"目對於傳統武器與其他大規模殺傷性武器，生物戰劑容易大量製造，也容易施放","B":"生物恐怖事故不易偵測，可能造成嚴重的心理衝擊","C":"同時間忽然出現許多相同臨床症候群病患，尤其出現在年輕人或原本健康狀人，應該懷疑生物恐怖事故","D":"炭疽病、肉毒桿菌、天花、蓖麻毒素都易於傳播，死亡率高，因此在美國疾病管制局的分類中，都屬於A類生物戰劑"},"answer":"D","manualChapter":"CH43"},{"id":396,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於空中救護的觀念，以下何者敘述最不正確？","options":{"A":"依照政府公告的「空中救護適應症」，創傷指數小於12，或年齡小於5歲，創傷指數小於9得以申請空中救護","B":"依照政府公告的「空中救護適應症」，昏迷指數小於10的傷病患得以申請空中救護","C":"依照政府公告的「空中救護適應症」，二度、三度燒傷面積達10％或特殊部位（如顏面、會陰）燒傷的傷病患得以申請空中救護","D":"符合空中救護適應症的傷病患，都應該啟動空中救護，預後會比較好"},"answer":"D","manualChapter":"CH58"},{"id":397,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"以下何者是事故指揮系統（incident command system，ICS）的基本架構？","options":{"A":"指揮，安全，有效，及時，公平","B":"指揮，安全警戒，災害控制，緊急救護，確適醫療","C":"指揮，執行，安全，聯絡，發言","D":"指揮，執行，計畫，後勤，財務行政"},"answer":"D","manualChapter":"CH52"},{"id":398,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"對於多重傷病患事故（multiple casualty incident）和大量傷病患事故（mass casualty incident）的觀念，以下何者最不正確？","options":{"A":"「多重病患事故」是指傷病患人數多於一人，但尚未超過該地區或系統所能負荷的能量重傷病","B":"依照「多重病患事故」的觀念，現場傷勢最嚴重的病患，即使已無呼吸心跳，也應該優先搶救","C":"依照「大量傷病患事故」檢傷分類的觀念，最應該優先處理的，是傷勢危急但是還可能得救的傷病患，而不是那些即使耗用很多資源也無法拯救生命的瀕死傷病患","D":"依照國際慣例，所有的「大量傷病患檢傷法」都把傷病患區分為黑、紅、黃、綠這四種顏色，優先搶救紅色病患"},"answer":"D","manualChapter":"CH52"},{"id":400,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"在事故應變中，有幾個應變地點相當重要，必須及早建立。以下關於事故指揮所（incident command post，ICP）的觀念，何者最不正確？","options":{"A":"事故指揮所最好可以位於事故現場附近，但又必須確保在危險區域之外","B":"隨著事故進展，事故指揮所可能必須變動位置","C":"尚未指派任務的工作人員或物資，必須先在事故指揮所裡集結，等候派遣","D":"無論事故的型態或規模，每個事故都必須建立某種形式的事故指揮所"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":401,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"在大量傷病患事故的檢傷分類，以下觀念何者最不適當？","options":{"A":"檢傷員應該盡可能在第一時間就完整處理傷病患的傷勢，嚴重傷病患應該立即實施氣管內管插管等等急救步驟，以免延誤病情","B":"如果事故的傷病患人數極多，事故應變的時間較長，那麼，應該考慮讓救護技術員輪流擔任檢傷員，避免同一個人長時間承受檢傷的心理壓力","C":"大量傷病患檢傷分類是非常表淺的診治方式，所著重的是在短時間內區別出病患的嚴重度，不能夠取代實際的診治病患","D":"檢傷之後，不同嚴重度的傷病患所得到的現場處置應該有所區別，檢傷這個步驟才會有所意義"},"answer":"A","manualChapter":"CH52"},{"id":403,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"對於災難的描述，以下觀念何者最不適當？","options":{"A":"自然災難時，通常民眾善良的本性會激發出來，自助互助的狀況非常常見","B":"目前的科技有很多方法可以協助鑑識大量屍體，應該儘可能鑑識屍體身分","C":"在自然災難中，最貧窮的區域通常死傷最嚴重","D":"災難後的大量屍體會造成瘟疫，處理大量屍體最有效的方法就是集體埋入土坑"},"answer":"D","matchedChapters":["CH10"],"manualChapter":"CH10"},{"id":404,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於事故應變，以下描述何者最不適當？","options":{"A":"在實際狀況下，抵達醫院的傷病患，絕大部分都已經經過檢傷、初步處理、和除污的步驟","B":"事故應變所動用的人力和物資是相當可觀的，如果在平時沒有釐清經費的限制，也沒有先訂定資源調度的機制，很可能會在事後面臨索償無門的窘境","C":"最初的現場搜救，大部分是由事故的生還者自行進行","D":"如果事故地點的交通順暢，那麼傷病患很可能會經由非救護車的交通工具，例如私人汽車、警車、巴士、計程車、甚至徒步到醫院"},"answer":"A","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":405,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"下列關於傷病患要求空中轉診的適應症描述，何者為非？","options":{"A":"頭部外傷，病患昏迷指數（GCS）為8分","B":"初評時GCS＝14分，送達醫院時GCS＝10分","C":"斷指需要緊急手術接回","D":"顏面大面積二度燒燙傷"},"answer":"C","manualChapter":"CH58"},{"id":406,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於空中救護之特色，何者為非？","options":{"A":"縮短治療時間","B":"降低死亡機率","C":"避免永久殘廢","D":"耗費醫療資源"},"answer":"D","manualChapter":"CH58"},{"id":407,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"以下關於地震災害的特性，何者為是？","options":{"A":"根據以往歷史經驗，超過60％以上的病患都是在平常醫療機構接受救治，因此如何將病患快速送往醫療機構是震災處理的重要議題","B":"地震中受災之傷患大部分都需要手術治療，因此除了就近送醫，也需要注意接收醫院的處置能力","C":"震災中大量死亡的屍體會帶來後續的傳染病群聚現象，因此需要快速集中火化","D":"地震強度大的災區會出現傷亡人數集中在特定地區的現象，這在全世界的地震中時常發生"},"answer":"D","manualChapter":"CH56"},{"id":408,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於颱風災害的敘述，以下何者為是？","options":{"A":"在台灣，颱風雨量多寡可能是引起傷害的主要決定因素，風力大小反而不見得跟傷亡數目相關","B":"道路交通中斷可以使用直升機救護，因此不應該成為延遲救護的藉囗","C":"醫療院所均有風災緊急應變計畫，因此醫療能量不受影響","D":"目前的自動體外去顫器（AED）均有短路保護設計，因此雨天中使用不受影響，可不用擦拭病患身體表面直接使用"},"answer":"A","manualChapter":"CH57"},{"id":409,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於生物恐怖主義威脅，以下敘述何者為是？","options":{"A":"由於20世紀生物科技進步可以做基因重組，所以近三十年來才有生物戰劑的研發，最有名的就是2001年的炭疽病信件事件，造成22人感染","B":"相較於其他恐怖活動使用的武器，生物戰劑最大的利基點在於可以快速且有效地散佈，短時間產生大量傷亡","C":"生物戰劑的分類中，A類的傳播速度與死亡率均高，而C類最難取得或製造","D":"等級A的個人防護裝備（PPE）用於處理未知濃度的未知化學物質，或是當處理有飛濺危害的已知液體或接觸皮膚有害的蒸汽時"},"answer":"D","matchedChapters":["CH43"],"manualChapter":"CH43"},{"id":410,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於生物戰劑的描述，何者為是？","options":{"A":"相較於高殺傷力的化學武器可以在短時間產生大量死亡人數，暴露生物戰劑之病患多半不會立即死亡，引此對於醫療與公衛處置能量的影響較小","B":"吸入型炭疽病、肉毒桿菌、原發性腺鼠疫、天花、兔熱病、病毒性出血熱、病毒性腦炎、Q熱、布魯氏菌病、鼻疽這十種生物戰劑，超過半數以上會人傳人傳染","C":"潛伏期長有利於施放生物戰劑者逃脫","D":"在相等面積區域造成同樣殺傷人數時，生物戰劑的成本比化學武器與核子武器來得高"},"answer":"C","manualChapter":"CH43"},{"id":411,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於大型活動的緊急醫療救護規劃，以下何者為是？","options":{"A":"大型活動要處理的是中暑，低體溫，急性心肌梗塞與外傷，不需要針對恐怖攻擊做準備","B":"跨年夜施放煙火活動結束散場時，請藝人繼續現場表演可以預防性減少外傷傷患人數","C":"為了保障病患隱私以及醫療人員安全，醫療站的位置不可公開於民眾可以取得的海報或手冊中","D":"單一醫療站同時接收到超過15名以上的傷病患，才會面臨災難狀況"},"answer":"B","manualChapter":"CH54"},{"id":412,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於大型活動緊急醫療規劃，以下敘述何者為是？","options":{"A":"規劃重點首重「保護自己安全」","B":"如果醫療站相距甚遠，可以大量部屬救護機車與救護單車，以快速將傷者送到醫療站","C":"醫療站器材應該依照活動參與對象來考量，例如聽障奧運的醫療規劃就不需要利用廣播系統引導傷病患就醫或後送","D":"大型戶外活動的傷病患人數推估，如果活動時間地點跟上一屆相同，那人數推估就應該一樣"},"answer":"A","manualChapter":"CH54"},{"id":413,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於毒化災醫療救護，以下敘述何者為是？","options":{"A":"若傷患自行由熱區逃出但未經除污，需藉由優勢警力將他們隔離回熱區","B":"任何一位工作人員不適，其他組員需團隊合作，暫時扛起此員工作，直到補員進入為止","C":"在暖區除污走廊負責替傷患除污的人員標準防護隔離設備是B級（或更高級）防護衣，或是確認物質性質濃度之後，也可使用C級防護衣","D":"應該儘速通知衛福部所轄毒災應變諮詢中心，啟動毒災應變隊抵達現場協助處理"},"answer":"C","manualChapter":"CH53"},{"id":414,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於START檢傷法，以下敘述何者為是？","options":{"A":"最開始第一步是評估呼吸是否超過30下，或是沒有呼吸","B":"明顯正在出血的開放性傷口可以請輕傷病患幫忙壓迫止血，檢傷人員則迅速移往下個需要檢傷之病患","C":"必須現場有超過15名傷病患才能夠使用此檢傷法","D":"根據以往實戰經驗，評估循環時，採用微血管回填時間比評估橈動脈的有無更為實用方便"},"answer":"B","manualChapter":"CH52"},{"id":415,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"在壓碎傷症候群（crush syndrome）患者，其抽血可見到下列變化，何者除外？","options":{"A":"肌肉酵素（如CK）上升","B":"嚴重者腎功能（如creatinine）會上升","C":"電解質異常：如高血鉀、高血鈣、高血磷","D":"酸鹼質異常：如代謝性酸中毒"},"answer":"C","manualChapter":"CH30"},{"id":416,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"就緊急醫療系統品管而言，「是否訂有大量傷患應變計畫」應是哪一層面的指標？","options":{"A":"結構面","B":"過程面","C":"結果面","D":"以上皆非"},"answer":"A","manualChapter":"CH09"},{"id":417,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"災難應變中，「事故」的周期包括：甲、應變；乙、準備；丙、復原；丁、減災。正確的順序是？","options":{"A":"甲→丁→丙→乙","B":"乙→丙→丁→甲","C":"乙→丁→丙→甲","D":"丁→乙→甲→丙"},"answer":"D","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":418,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"關於事故指揮系統的敘述，下列敘何者為是？","options":{"A":"事故指揮官必須由現場人員出任，而且必須是原本組織中行政位階最高者擔任","B":"聯絡官需依照事故指揮官的指示，設定可以發佈的新聞種類","C":"為了避免媒體散發不實消息，發言官要盡量避免召開記者會，最好等到事件結束後再來召開","D":"夜間高速公路發生連環車禍，現場安全官需確定每個救護人員都穿著反光背心，且協調高速公路警察設立安全錐，導引車流遠離救護現場"},"answer":"D","manualChapter":"CH52"},{"id":419,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"在事故發生時，按照事故指揮系統，可以分成多個部門及組別；其中建立文書資料彙整、管理的機制，負責保管及備份事故應變的相關文件工作至為重要，請問這屬於哪一個部門的任務？","options":{"A":"後勤部門","B":"計畫部門","C":"執行部門","D":"財務行政部門"},"answer":"B","manualChapter":"CH52"},{"id":420,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"據報在縣市郊區發生化學工廠爆炸，傷亡人數不明。為避免進行現場評估及救護時接觸到危害物質，緊急救護人員必須穿著為毒化災設計之防護衣。請問有關各級防護衣的敘述，下列何者為非？","options":{"A":"A級防護裝備提供最高等級之皮膚黏膜及呼吸保護，防護衣為全身氣密式，緊急救護人員背負自給式的呼吸設備","B":"B級防護裝備為氣密式防護衣，不會接觸到外界空氣，提供最高等級之呼吸保護。但皮膚黏膜保護比A級防護裝備差","C":"C級防護裝備為全身式或二截式，其無法阻止液體性毒物滲入。人員呼吸為經濾毒罐過攄之空氣，為負責後送在現場除污後之病患的工作人員所穿著","D":"D級防護裝備基本上是指工作服，穿著目的是避免髒污自己衣服，並未對毒化物有特別的防護力"},"answer":"B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":421,"source":"第七章 大量傷患與災難應變(2012-2014).doc","question":"所謂新興感染症（emerging infectious disease），如伊波拉病毒出血熱，在1992年美國醫學研究院提出的報告中是指「新近（通常指近20年內）出現於人類的疾病」，且需符合下列三項定義。請問下列定義何者為非？","options":{"A":"其發生率呈現快速增加之趨勢","B":"在地理分佈上之範圍擴張","C":"跨越多種族及人畜共通傳染","D":"增加或發展出新的抗藥性機制"},"answer":"C","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":422,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關如「八仙塵暴」大量傷患事故的描述，何者有誤？","options":{"A":"傷患人數與嚴重度大於區域救護資源，可稱為災難","B":"現場傷患，應先做適檢傷分類與處置後後送","C":"以改良式的START（Revised START）檢傷法，可以有效處理「八仙塵暴」大量傷患事故","D":"現場事故控制管理應優於個別傷患處置"},"answer":"C","manualChapter":"CH52"},{"id":423,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關事故應變管理週期之順序，何者為是？1.準備2.應變3.復原4.減災","options":{"A":"1234","B":"1243","C":"4231","D":"4123"},"answer":"D","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":424,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關事故指揮系統ICS（Incident Command System）的敘述，何者有誤？","options":{"A":"指揮架構應配合平時行政組織架構，以發揮指揮效能","B":"指揮權轉移，應轉給ICS運作經驗夠的適任人員，而不是以位階高的人員","C":"事故中指揮權轉移，不宜過於頻繁","D":"事故規模不大，未被指定的職位，由事故指揮官兼任"},"answer":"A","manualChapter":"CH52"},{"id":425,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"當災難發生時，你是第一輛救護車，由資深的你擔任事故指揮官。長官與支援同僚也陸續抵達，這時候指揮權的轉移，何者最不適當？","options":{"A":"由職級高者，層層轉移","B":"可轉移給對事故指揮系統熟悉經驗多之同僚","C":"事故中指揮權轉移，不宜過於頻繁","D":"指揮權的轉移必須依照事故應變的整體狀況來決定"},"answer":"A","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":426,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關單純輻射傷害的描述，何者有誤？","options":{"A":"在暴露輻射的短期間就發生頭痛或身體不適的情況，這多半是心理因素導致","B":"輻射傷害傷患，外表無皮膚缺損，仍須做適當除汙","C":"輻射污染可以用輻射偵檢器檢測出，並且可以精確的定出污染範圍","D":"輻射傷害傷患除汙中，皮膚開始出現破損，偵測輻射劑量在背景值的2～3倍以上，仍須繼續清洗除污步驟"},"answer":"D","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":427,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關大型活動緊急醫療救護的敘述，何者有誤？","options":{"A":"大型群眾聚集活動，傷病及心臟停止的機會較低","B":"心臟停止病患的救活率，比大多數先進的緊急醫療救護系統為高","C":"治療心臟停止病人，電擊去顫為生存之鏈（Chainofsurvival）中最重要且最有效的一環","D":"超過二個人有類似特殊病況、傳染性疾病、嚴重病患，都需通知醫務執行長及總指揮"},"answer":"A","manualChapter":"CH54"},{"id":429,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關生物恐怖攻擊的描述，何者有誤？","options":{"A":"生物戰劑容易大量製造","B":"生物恐怖事件不易偵測、不易預防、難於辨認","C":"蔓延性廣、滲透性強；可造成嚴重的心理衝擊；能催垮所有現有資源","D":"生物戰劑可以有效率的散播"},"answer":"D","manualChapter":"CH43"},{"id":430,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"下列對災難後的醫療需求的描述，何者為是？","options":{"A":"最大的醫療需求是在前24小時，高峰期：持續三至五天","B":"急性期內科和創傷病患為主","C":"大多數的受害者都是依靠外來的醫療隊伍支援","D":"災區裡的醫療體系不太會受到衝擊"},"answer":"A","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":431,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"一生產鐵片的工廠發生大爆炸，已知傷患有五百位，於檢傷分類時，下列何者為非？","options":{"A":"寬五公分的鐵片，貫穿頸部，病患無呼吸、無脈搏，給予傷票“黑”","B":"寬五公分的鐵片，一端刺穿入胸內，病患呼吸急迫，給予傷票“紅”","C":"寬五公分鐵片，貫穿右大腿，病患不能行走，紅色鮮血直流，給予傷票“黃”","D":"病患左小腿撕裂傷十公分，深可見肌肉，無法行走，給予傷票“黃”"},"answer":"C","manualChapter":"CH52"},{"id":432,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"在災難事故現場，下列何者不是在醫療站時決定病患治療優先順位的影響因素？","options":{"A":"年齡","B":"送達醫療站的先後順序","C":"預估的醫療資源消耗","D":"需要穩定的ABC異常"},"answer":"B","manualChapter":"CH52"},{"id":433,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關START的敘述，何者正確？","options":{"A":"觀察病患的意識狀況為第一步驟","B":"凡是沒有呼吸，可立刻判為黑色","C":"呼吸速度超過每分鐘30下，應判為紅色","D":"START的快速治療主要包括心肺復甦術"},"answer":"C","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":434,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"在現場進行的初級檢傷時，只能做某些拯救生命的必要措施，這些可歸納成囗訣BASIC，以下選項何者為非？","options":{"A":"Breathe呼吸","B":"Airway呼吸道","C":"Shock休克預防","D":"Classification分類"},"answer":"A","manualChapter":"CH52"},{"id":435,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"下列有關事故指揮系統的描述，下列何者為非？","options":{"A":"共通詞彙（Common terminolog）","B":"模組化（Modular）","C":"管理範疇（Span of Command）","D":"交叉指揮（Conjugated command）"},"answer":"D","manualChapter":"CH52"},{"id":436,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關北美緊急應變指南的使用，下列何者為非？","options":{"A":"可以利用UN編號，查詢到危害物質的應變指引","B":"兩種危害物質可能使用相同一種應變指引","C":"每一種危害地上風、下風處隔離距離都不同，需要查詢相關「初期隔離與保護距離表」","D":"解針對不明危害物質，北美緊急應變指南在應變指引111，有初步的建議行動"},"answer":"C","manualChapter":"CH53"},{"id":437,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於毒化災防護衣，下列敘述何者為是？","options":{"A":"A級和B級防護衣都屬於全罩式氣密式連身防護衣","B":"A級毒化災防護衣可保護眼睛、黏膜、皮膚，但卻不能提供好的呼吸保護","C":"第一時間消防人員在熱區面對仍不清楚的毒化物質及濃度下應該穿著B級防護衣","D":"A級和B級防護衣都包含自攜式空氣呼吸器（self-containedbreathingapparatus，SCBA）"},"answer":"D","manualChapter":"CH53"},{"id":438,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於生物恐怖事件（Bioterrism），下列敘述何者為非？","options":{"A":"施放的恐怖分子本身可能也受到感染","B":"可依恐怖分子規劃，進行有效率的散播","C":"造成大量傷亡所需費用較低，又稱為「窮人的原子彈」","D":"炭疽病、鼠疫、天花屬於最高優先級（A類）可能被使用的生物戰劑"},"answer":"B","manualChapter":"CH43"},{"id":439,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於生物恐怖事件發生的流行病學和臨床線索，下列何者為非？","options":{"A":"出現大量死亡個案","B":"同時出現許多相同臨床症狀病患","C":"本土流行之感染症個案數增加","D":"常見的感染出現在不尋常季節"},"answer":"C","manualChapter":"CH53"},{"id":440,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於颱風災害對醫療服務的影響，下列何者為非？","options":{"A":"道路中斷，可能需要空中運輸","B":"緊急救護時，行車安全的風險增加","C":"醫療院所淹水及交通阻斷，影響醫院運作","D":"造成新興傳染病盛行，耗費大量醫療資源"},"answer":"D","manualChapter":"CH57"},{"id":441,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"危物質災難事件如果已經被限制在一定範圍內，事故現場可以劃分出污染區（或為區、紅區）、控制區（或稱為暖區、黃區）及安全區（或稱為冷區、綠區）三個區峨、為層區管制·於層區管制的念，以下敘述何者為非？","options":{"A":"事故周直接或間接（如受污染之傷患及器材）受到危害物質影響之處，應劃定為熱區","B":"安全區在事件開始時即需建立，將支援人員器材集結於此，並設定由下風高處做為嵈區及熱區的出人位置","C":"黃區為介於污染區及安全區之間的緩衝區域，作為除污及病人緊急醫療處理之處","D":"除污走廊應該位於暖區"},"answer":"B","manualChapter":"CH52"},{"id":442,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於輻災事故的變觀念，以下敘述何者為非？","options":{"A":"輻射會影傷囗癒合，所以輻射汙染病患的傷囗應該儘可能延遲二十四小時後再進行縫合","B":"較於化學物質事故，輻射事故通常不會造成受污染傷者立即性的危害，因此病患除污的急迫性較低","C":"在輻災事故，如果病患的衣物可能沾有輻射物質粉末，應該在移除病患衣物時，先將衣物潤濕，以防止輻射物質擴散至空氣中","D":"輻射污染可以用輻射偵檢器檢測出，通常可以精確地定出污染範圍"},"answer":"A","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":445,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"在大量傷病患事故，依據START（Simple Triage And Rapid Treatment，簡易分類並迅速治療）檢傷法，以下判定何者為是？","options":{"A":"二十歲男性，癱軟坐在地上，爬不起來，呼吸每分鐘20次，橈動脈脈搏很強，可以和工作人員清楚對談，應該判定為輕傷","B":"十歲孩童，呼吸每分鐘42次，微血管充填時間3秒，對工作人員的問話毫不理會，跑來跑去哭喊著找媽媽，應該判定為紅色","C":"五十歲女性，左右小腿均骨折，呼吸每分鐘20次，微血管充填時間1秒，可以和工作人員清楚對談，應該判定為中傷","D":"一百歲老公公，左大腿骨折變形，呼吸每分鐘8次，微血管充填時間5秒，意識不清，應該判定為黑色"},"answer":"C","manualChapter":"CH52"},{"id":447,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"事故指揮系統（IncidentCommandsystem）創建於1970年代，目的是簡化溝通以及建立明確的指揮系統·以下相關敘述何者為非？","options":{"A":"災難事件指揮系統是由功能的需求·而非個人原有的頭銜，來組織整個架構","B":"災難事件指揮系統應該要等上級指示之後再啟動，越晚成立越能夠有完整的架構與功能，也旨發揮越大的作用","C":"不論災難的本質如何，災難事件指揮系統的架構都是類似的，差異主要是核心人士的特殊專業考量","D":"災難事件指揮系統中，安全官（Safety Officer）的主要任務是負責工作人員的安全，以及特殊災難所需要的特殊技術（例如輻射線偵測以及處理生物感染控制）"},"answer":"B","manualChapter":"CH52"},{"id":448,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於事故指揮系統（Incident Command system）中財務行政部門的功能，下列何為非？","options":{"A":"分析財務成本","B":"維護電力及衛生設備","C":"追蹤應變人員的工作時間","D":"負責與廠商或其它部門簽訂財務契約"},"answer":"B","manualChapter":"CH52"},{"id":449,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於事故指揮系統（Incident command system）的描述，簡稱ICS，下列何者為非？","options":{"A":"主要架構包含指揮、執行、計畫、後勤、財務行政等五個主要的部門","B":"實際使用時，不一定每一組都要成立，是需求及現有資源而決定","C":"ICS架構一旦確立後，就只能增加，不能減少","D":"ICS中一定要有的單位是指揮官"},"answer":"C","manualChapter":"CH52"},{"id":450,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於事故指揮系統（Incident Command system），以下敘述何者為是？","options":{"A":"監督者與下屬的人數比例，建議是1：8較為合適","B":"安全官除了要確保救災及災難受害者安全外，同時要定期向媒體發布相關訊息","C":"資訊（Information）、聯絡（Liaison）、安全（security）等三項是輔助指揮的功能，可以由專人負責，或是由指揮官兼任","D":"指揮官必須對所有的災難都有非常專業的了解，否則不能擔任指揮官"},"answer":"C","manualChapter":"CH52"},{"id":451,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於災害現場的現場救護，何者為非？","options":{"A":"主要重點包含檢傷、治療及後送","B":"治療區一定包含重傷、中傷及輕傷區","C":"救護車後送的傷患人數通常只佔所有就醫傷患的一部分，所以後送時儘可能將中傷與重傷病患分配至不同醫院以避免壅塞","D":"檢傷是動態的，在現場救護區進行的檢傷統稱為「次級檢傷」，與檢傷的次數無關"},"answer":"B","manualChapter":"CH52","matchedChapters":["CH52"]},{"id":452,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"有關院外災害現場緊急應變作業，下列敘述何者為非？","options":{"A":"在大量傷病患事故，可以簡易檢傷及快速治療法則（Simple Triage and Rapid Treatment,START）做檢傷分類","B":"在災害現場若有危及救護人員的情況，應以減少現場處置快速轉送為原則","C":"可將輕傷病人送往較遠的醫院，以免造成當地醫院急診壅塞，而無法有效處理重症病人","D":"為了儘速救災，指揮官應要求最近急救責任醫院派出醫療人員組成救護隊前往救援"},"answer":"D","manualChapter":"CH52"},{"id":453,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"在大量傷病事故，依照Simple Triage and Rapid Treatment（START）檢傷分類法評估以下病患：．中年女性：可行走，全身多處擦傷，包括兩側膝蓋與左側手掌，左小腿有4公分之撕裂傷持續出血中。．老年男性：意識不清對痛無反應，橈動脈摸得到。左頭皮有10公分撕裂傷，持續流血。．年輕女性：無法行走，意識清醒，血壓130/58 mmHg，脈搏126/分鐘，呼吸20/分鐘，跌倒後右膝蓋腫脹。．中年男性：無法行走，意識混亂，血壓130/60 mmHg，脈搏130/分鐘，呼吸36/分鐘，颜面部呈焦黑，眉毛被燒至焦黑，呼吸困難。．老年男性：四肢無力無法移動，不停呼叫求救，但可以配合簡單指令，血壓125/60 mmHg，脈搏90/分鐘，呼吸12/分鐘，除前額血腫外無其他明顯外傷。．年輕男性：可行走，意識清楚，血壓110/68 mmHg，心跳89/分鐘，呼吸16/分鐘，左小腿壓傷，輕微腫脹，表面擦傷約8公分×4公分，無變形或出血。．中年女性：無法行走，打開呼吸道後沒有呼吸，沒有脈搏。遭重物壓迫後左側小腿截肢，附近發現殘肢。經過你的檢傷分類後，請問分類的結果應該為何？","options":{"A":"2黑1紅2黃2綠","B":"1黑2紅2黃2綠","C":"1黑2紅1黃3綠","D":"2黑2紅1黃2綠"},"answer":"B","manualChapter":"CH52"},{"id":454,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"使用START（Simple Triage And Rapid Treatment）方法進行檢傷分類時，容易被「輕症重判」的病患，下列何者為非？","options":{"A":"失聰傷患","B":"嗆傷傷患","C":"過度換氣傷患","D":"下肢殘障傷患"},"answer":"B","manualChapter":"CH52"},{"id":455,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於毒性化學物質汙染的現場處置，何者為非？","options":{"A":"辨識危害物質並不容易，可能必須配合病患症狀以及現場資訊來一同判斷","B":"目前危害物質管轄的單位很多，包含環保署、勞動部、經濟部，消防署等等","C":"火災使用的防焰衣以及個人防護裝備，屬於B級的化災防護衣","D":"處理毒化災現場時，處理得「對」比處理得「快」還重要。如果沒有適當的防護，救災救護人員或病患都可能受到二次傷害"},"answer":"C","matchedChapters":["CH53"],"manualChapter":"CH53"},{"id":456,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於毒化災現場傷患緊急處理，下列何為非？","options":{"A":"污染傷囗應先清洗，再以防水敷料包紮","B":"傷患除污應在設置於暖區的除污走廊內進行","C":"呼吸裒竭傷患，應於熱區插管後，再送至暖區除污","D":"眼睛受污染傷患，可以大量生理食鹽水用沖眼器沖洗"},"answer":"C","manualChapter":"CH53"},{"id":457,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於危害物對健康的傷害，下列敘述何者為非？","options":{"A":"有機磷殺蟲可能造成意識障礙或痙攣","B":"氯氣主要傷害呼吸系統，嚴重可能造成呼吸衰竭","C":"氦氣度太高時，空氣中含氧量下降，造成缺氧性窒息","D":"氮氣造成紅血球破壞產生溶血，使細胞無法使用氧氣而窒息"},"answer":"D","manualChapter":"CH53"},{"id":458,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於生物恐怖事件（Bioterrism），下列敘述何者為非？","options":{"A":"可依規劃進行有效率的散播","B":"施放的恐怖分子本身可能也受到感染","C":"造成大量傷亡所需費用較低，又稱為「窮人的原子彈」","D":"炭疽病、鼠疫、天花屬於最高優先級（A類）可能被使用的生物戰劑"},"answer":"A","manualChapter":"CH43"},{"id":459,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於輻災事故的應變觀念，下列敘述何者為非？","options":{"A":"輻射物質如由吸人入方式進人人體，造成之傷害十分嚴重。所以切勿在管制區琙菸或飲食，以減少吸收輻射物質的機會","B":"以前曾參與輻災救災的工作人員，因為經驗較為豐富，應該儘可能派彺第一執行或除污的工作","C":"處理輻射事故之緊急救護人員應著長袖衣服，戴雙層手套、眼罩、口罩及帽子受到可能的輻射污染","D":"所有於輻射事故工作之人員，均須佩帶個人輻射計量器"},"answer":"B","manualChapter":"CH53"},{"id":460,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於大型活動的緊急醫療救護，何者為非？","options":{"A":"大型活動與一般緊急災害事件最大的不同，在於事先的規劃、減災措施可以減少災害發生的機率與可能的人命、財產損失","B":"醫療站設置的評估，需考慮活動的性質、地理資訊、參與人員的人數與特質、舉辦時間等","C":"大型活動的現場醫療最好可以與當地的醫療衛生資源建立合作機制，以利傷患的後送","D":"事故指揮系統（Incident Command system）僅適用於災難時候場景，在大型活動的現場醫療救護規劃不適用"},"answer":"D","manualChapter":"CH54"},{"id":461,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"關於大型活動的緊急醫療救護規劃，下列何者為非？","options":{"A":"應針對恐怖攻擊進行規劃","B":"「保護自己的安全」為首要規劃重點","C":"醫療站位置最好設置在五分鐘路程內可到所有活動區域處","D":"若無法在十分鐘內提供ACLS的醫療照顧，則現場必須準備自動體外電擊器"},"answer":"D","manualChapter":"CH54"},{"id":462,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"依國內災害防救法，下列哪一種災害應負責指揮、督導、協調之中央災害防救業務主管機關何者為非？","options":{"A":"重大火災為內政部","B":"毒性化學物質災害為經濟部","C":"土石流災害為行政院農業委員會","D":"震災為內政部"},"answer":"B","manualChapter":"CH53","matchedChapters":["CH53"]},{"id":463,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"地震災害對健康的衝擊，下列何者為非？","options":{"A":"流產及早產的比例增加","B":"急性心肌梗塞比例增加","C":"常因頭、胸部嚴重壓傷造成立即死亡","D":"大量死亡的屍體未清理，常造成疫病的盛行"},"answer":"D","manualChapter":"CH56"},{"id":464,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"事故指揮系統（ICS）各核心職位與任務的敘述，哪一個最不妥當？","options":{"A":"事故指揮官：監控各部門的應變效率","B":"聯絡官：聯絡安排參訪或訪談","C":"發言官：提供必要的消息給應變工作人員","D":"安全官：審核應變工作人員的醫療照護計畫"},"answer":"B","manualChapter":"CH52"},{"id":465,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"疑似輻射污染的現場，下列何種應變原則或作法是正確的？","options":{"A":"先確保必要的防護。若沒有鉛衣保護，對應變人員可能有風險，應該請隊上準備","B":"應常规服用碘片或含碘的藥物，用以拮抗輻射可能帶來的風險","C":"病輻射污染的考量不應優先於急救，若生命徵象不穩定應先急救病人","D":"輻射污染的患，不管污染或傷情嚴重程度，一律先送往輻傷/核災急救責任醫院以免污染擴大"},"answer":"C","manualChapter":"CH53"},{"id":466,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"化學槽車事故現場，槽車載運物質不明。下列應變作為何者最不妥當？","options":{"A":"出勤前和出勤中，持續指揮中心或派遣中心聯絡，以取得化學物資訊","B":"小心從上風、高處接近事件現場","C":"若環保署環境事故專業技術小組在現場，可依專業技術小組的建議進行現場分區和處置","D":"若傷患未除污就逃出管制範圍，救護技術員在完成防護之前接觸到此類傷患也必須進行除污和監測。若傷患沾染會和水反應的化學物質，可使用消毒用酒精來除污"},"answer":"D","matchedChapters":["CH05"],"manualChapter":"CH05"},{"id":467,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"大型活動緊急醫療救護的敘述，何者為是？","options":{"A":"在大型群眾聚集活動，心臟停止的發生機會較高，但救活率也比較高","B":"每千人的活動，建議配置一台有高級救護技術員的救護車","C":"每兩千人的活動，建議需有一位急診醫師在現場","D":"如果傷病患沒有超過15人，醫療站應該不會面臨大量傷患的問題"},"answer":"A","manualChapter":"CH54"},{"id":468,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"您出勤時載送全身黃疸及發燒的病人，疑似患有鉤端螺旋體病（Leptospirosis）關於鉤端螺旋體病，以下何者錯誤？","options":{"A":"是熱帶和亞熱帶常見的人畜共通感染病，台灣也有案例","B":"可經由動物尿液污染的水和土壤，進而感染人類","C":"極少見人傳人，若有帶手套和口罩處理病患基本上不會被感染","D":"直接接觸動物不會被傳染"},"answer":"D","manualChapter":"CH43"},{"id":469,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"炭疽病（Anthrax）是A級生物戰劑中，咸認最可能被用的病原體。關於炭疽病，何者正確？","options":{"A":"炭疽菌是專性嗜氧的格蘭氏陰性產孢桿菌，死亡率極高","B":"除皮膚性疽外，吸入型和腸胃道炭疽皆可能發生全身性炭疽症","C":"炭疽病沒有疫苗可施打","D":"炭疽病可能經由動物接觸而感染"},"answer":"D","manualChapter":"CH43"},{"id":470,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"颱風對緊急醫療救護的影響，何者為非？","options":{"A":"颱風時的緊急救護調度派遣會有風險，較不緊急的醫療情況可考慮風雨減緩後進行","B":"颱風時若交通中斷，風災後可考慮用直昇機進行救護","C":"颱風時，病患以外傷居多，颱風後，則可能出現胃腸道傳染病，甚至壓力造成的心理疾病","D":"颱風過後，傳染病都會增加，但與當地原有的傳染病型態沒有相關"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":471,"source":"第七章 大量傷患與災難應變(2015-2018).doc","question":"空中救護救護直昇機，管理辦法的規定，以下敘述何者錯誤？","options":{"A":"空中救護的範圍包括緊急救護、轉診和移植器官的緊急運送","B":"空中緊急救護，由當地欲轉診的醫院填具空中緊急救護申請表，直接傳真向內政部消防署救災救護指揮中心申請","C":"申請空中轉診的醫院，應與接受轉診的醫院先行聯絡協調，預作接受轉診的準備","D":"救護直昇機執行空中緊急救護或空中轉診時，除駕駛員外，應有空中救護人員隨機執行救護"},"answer":"B","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":472,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於聽診器的使用，以下敘述何者為非？","options":{"A":"聽診器除了用來評估臟器發出的聲音，同時也可以用來協助生命徵象的測量","B":"不管使用哪一種聽診器，隔著衣服聽診是相對錯誤的使用聽診器方式","C":"雙面聽診器聽筒表面可以分為鼓面以及膜面，鼓面適合收集高頻率與膜面適合收集低頻率的音波","D":"電子式聽診器放大聲音的效果有助於救護技術員克服現場環境噪音的干擾"},"answer":"C","manualChapter":"CH20"},{"id":473,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"一位肝癌末期患者的家屬打119求救，救護員抵達現場發現患者意識昏迷腹部腫脹，且無呼吸及脈搏，經CPR與電擊急救後回復自發心律（ROSC），此時頸動脈可以摸得到但橈動脈摸不到，以下敘述何者為非？","options":{"A":"若患者有腹水，腹部做叩診可能會出現濁音（dullness）","B":"病患意識不清可能是肝昏迷（hepatic encephalopathy），但也有可能是休克所致","C":"病患有可能為脾臟或肝臟破裂出血所導致","D":"此時病患的血壓降低，但脈搏壓（pulse pressure）可能較正常值為高"},"answer":"D","manualChapter":"非創傷"},{"id":474,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"一位30歲男性機車騎士被酒駕的汽車高速追撞後，彈飛撞碎另一輛汽車的擋風玻璃，救護員抵達現場看到患者鼻腔及口腔有出血，前額有血腫瘀青，以下到院前的理學及生命徵象評估何者較無法當作創傷性顱內出血診斷之參考線索？","options":{"A":"瞳孔大小及對光反射評估","B":"呼吸音及血氧濃度數值評估","C":"葛氏昏迷指數評估","D":"心跳速率及血壓數值評估"},"answer":"B","matchedChapters":["Combine"],"manualChapter":"創傷"},{"id":475,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"執行救護面對意識不清的糖尿病患者，倘若無法於到院前測量血糖，下列何種病史相對會讓救護員判定不似低血糖暫不施給糖粉（或暫不靜脈注射葡萄糖液）？","options":{"A":"47歲女性，經醫師建議下最近二天開始規則於皮下施打胰島素，20分鐘前剛注射完畢","B":"14歲男孩，持續不斷嘔吐，呼吸型態偏喘而深","C":"62歲阿婆，最近二天腹瀉不止且食慾不振","D":"72歲阿公，剛起床要去買早餐的路上，雙手緊張顫抖、全身冒冷汗後暈倒在地"},"answer":"B","manualChapter":"非創傷"},{"id":476,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"68歲阿公下腹脹，且上廁所時小便很難解出來，下列理學檢查會讓你合理推斷儘快幫他安排導尿對他將是最佳的處置？","options":{"A":"觸診：莫菲氏病徵（Murphy's sign）＋叩診：移動性濁音（shifting dullness）","B":"聽診：下腹部動脈嘈音（bruit）＋敲診：腰側敲擊痛（flank knocking pain）","C":"觸診：下腹部腫塊（palpable mass）＋叩診：恥骨上濁音（dullness percussion）","D":"觸診：反彈痛（rebound tenderness）＋叩診：恥骨上鼓音（tympanic percussion）"},"answer":"C","manualChapter":"CH20"},{"id":477,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"當您為一位75歲阿公聽診時聽到頸動脈嘈聲（bruits），請問以下何者為最可能的診斷？","options":{"A":"頸動脈狹窄","B":"頸靜脈栓塞","C":"心包膜填塞","D":"急性心肌梗塞"},"answer":"A","manualChapter":"CH20"},{"id":478,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"當救護員面對憤怒或具敵意病患時下列何種態度較為合適？","options":{"A":"查問衛生局是否為精神病患，並準備約束病患","B":"請指揮中心通知員警及衛生局人員來溝通","C":"先設定好可以接受的病患行為，在這個範圍之內，維持平靜且自信的態度來安撫病患","D":"如病患不願配合請病患簽名後離開"},"answer":"C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":479,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於體溫的說明何者為真？","options":{"A":"人體的體溫受到小腦的體溫調節中樞控制，因此可維持恆定","B":"人體核心溫度低於攝氏36度時，臨床上則定義為低體溫","C":"肛溫可以最正確反映人體的核心溫度，故一般救護時應常常使用","D":"一般而言，腋溫會低於核心溫度"},"answer":"D","manualChapter":"CH12"},{"id":480,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於庫斯毛耳氏呼吸（Kussmaul respiration）的敘述，何者為是？","options":{"A":"病人會出現這種呼吸型式大部分都是因為體內產生代謝性鹼性物質","B":"會出現這種呼吸型式主要是因為體內產生的代謝物質刺激了位在小腦的呼吸中樞，所引發的代償性深度呼吸型態","C":"這種呼吸型態的特色為呼吸淺而快","D":"甲醇中毒有可能在臨床上出現這種呼吸型態"},"answer":"D","manualChapter":"呼吸型態(含肺音)"},{"id":481,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列哪種疾病臨床上不易出現庫斯毛耳氏呼吸（Kussmaul respiration）型態？","options":{"A":"糖尿病酮酸中毒","B":"延腦損傷","C":"腎衰竭","D":"甲醇中毒"},"answer":"B","manualChapter":"呼吸型態(含肺音)"},{"id":482,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於瞳孔反射的描述何者為誤？","options":{"A":"兩側瞳孔放大且失去光反射，可能出現在抗乙烯膽鹼藥物中毒之病患身上","B":"兩側瞳孔放大且失去光反射，可能出現在嗎啡中毒之病患身上","C":"兩側瞳孔對稱縮小且失去光反射，可能出現在橋腦出血的病患身上","D":"兩眼瞳孔大小不等，可能出現在腦疝脫的病患身上"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":483,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於胸部檢查的描述何者為誤？","options":{"A":"在視診時發現病人胸部有蛛狀痣，在臨床上代表著病患可能有肝硬化的疾病","B":"在觸診時發現病人胸部有皮下氣腫，在臨床上代表著病患可能有氣胸的現象","C":"聽診時發現病人有喘鳴音（stridor）時，在臨床上代表的病人可能有下呼吸道疾病，例如氣喘的現象","D":"聽診時發現病人有哮鳴音（wheezes）時，在臨床上代表著病人可能有慢性阻塞性肺病"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":484,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於腸音的敘述何者為誤？","options":{"A":"每分鐘從5下到30下，均屬正常","B":"麻痺型腸阻塞可能出現低活動性腸音（hypoactive bowel sounds）","C":"敗血症病患末期可能出現高活動性腸音（hyperactive bowel sounds）","D":"大腸腫瘤所造成的腸阻塞在初期可能出現高活動性腸音（hyperactive bowel sounds）"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":485,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列呼吸型態的描述，何者見於糖尿病酮酸中毒的身上？","options":{"A":"逆理性呼吸（paradoxical respiration）","B":"噘嘴吐氣式呼吸（obstructive breathing）","C":"庫斯毛耳氏呼吸（Kussmaul respiration）","D":"陳施氏呼吸（Cheyne-stokes respiration）"},"answer":"C","manualChapter":"呼吸型態(含肺音)"},{"id":486,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於呼吸型態的描述何者為是？","options":{"A":"陳施氏呼吸（Cheyne-stokes respiration）常見於小腦損傷的病患","B":"喟嘆氏呼吸（Apneustic respiration）常見於大腦損傷的病患","C":"畢歐氏呼吸（Biot's respiration）常見於延腦損傷的病患","D":"庫斯毛耳氏呼吸（Kussmaul respiration）常見於橋腦損傷的病患"},"answer":"C","manualChapter":"呼吸型態(含肺音)"},{"id":487,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於喘鳴音（stridor）的描述何者為是？","options":{"A":"喘鳴音是屬於連續的肺內異常的肺音","B":"對於喘鳴音最清楚的聽診位置為肺部","C":"喘鳴音通常出現在呼氣期時","D":"喘鳴音可以出現在雙側聲帶麻痹的患者身上"},"answer":"D","manualChapter":"呼吸型態(含肺音)"},{"id":488,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列對於心臟的理學檢查何者為韭？","options":{"A":"當觸診時發現患者心臟最大搏動點消失時，有可能的臨床意義為大量心包膜積水","B":"當聽診時發現患者心音出現開放彈響時，有可能的臨床意義為僧帽瓣硬化","C":"當聽診時發現患者心音出現收縮期時的心雜音，有可能的臨床意義為二尖瓣閉鎖不全","D":"當聽診時發現患者心音出現舒張期時的心雜音，有可能的臨床意義為主動脈瓣狹窄"},"answer":"D","manualChapter":"CH20"},{"id":489,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列何者傷病患適用一於葉克膜（ECMO：Extracorporeal Membrane Oxygenation）？","options":{"A":"急性心肌炎","B":"多重器官衰竭","C":"末期惡性腫瘤","D":"缺氧至腦部嚴重受損"},"answer":"A","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":490,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"傷病患對於疾病症狀性質的描述，常常可以給我們有關傷病患所患疾病種類的判斷根據，下列哪一個疾病，通常不用突發性疼痛做為表現？","options":{"A":"腦膜炎","B":"蜘蛛膜下腔出血","C":"中空臟器破裂","D":"胸主動脈剝離"},"answer":"A","manualChapter":"非創傷"},{"id":491,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於醫病互動溝通的敘述何者為是？","options":{"A":"對於一個疑似開放性肺結核的病患，由於病菌傳播的風險甚高，為保護醫療人員的安全降低感染風險，因此必須採用「主動－被動模式」單向影響病患，病患完全沒有參與互動的空間","B":"醫療專業上的傲慢，是Beckman於1994年研究醫病關係建立溝通的四種缺失中最為常見的一種","C":"救護現場的溝通過程中，病患或其家屬常因文化語言背景的不同，或是因為選擇性的解讀，或是因為對醫療專業術語的不熟悉，而誤解救護人員原本所想要傳達的訊息","D":"現場病患及家屬常常因為緊張驚慌而無法配合緊急醫療人員的處置，這時高級救護技術員應該表現專業性與自信心，並利用「放心好了，應該不會有什麼問題的」這樣的語句，以給予病患及家屬適度的安撫"},"answer":"C","manualChapter":"CH18"},{"id":492,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於病史詢問的技巧，下列敘述何者正確？","options":{"A":"澄清（clarification）主要的目的是要對於病患含糊的描述加以釐清，應該使用病患可以理解的語言，並且不要用程度量化的問句來詢問，以避免產生引導式問句誤導病患對於自己症狀的描述","B":"重覆病患的最後一句話，可以鼓勵病患繼續陳述自己的症狀，是屬於病史詢問中「促進（facilitation）」的技巧","C":"適時的點頭或說「請繼續說」，是屬於病史詢問表現出你對患者的「同理心（empathic response）」的技巧","D":"發育遲滯的病患也可能可以適當的表達自己的不舒服並提供一定的臨床訊息，因此除非病患是重度心智發育遲滯的病患，否則高級救護員不應該放棄與他們溝通的機會"},"answer":"D","manualChapter":"CH19"},{"id":494,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於疼痛性質的描述，何者為非？","options":{"A":"漸進性持續性頭部劇痛，是蜘蛛網膜下腔出血的典型表現症狀","B":"急性下壁心肌梗塞的病患，可能以上腹疼痛不適作為主訴症狀","C":"病患描述突發性撕裂般胸口或腹部劇痛時，必須考慮主動脈剝離的可能性","D":"突發性的疼痛導致病患從睡夢中醒來，通常暗示病患可能出現比較嚴重的病變"},"answer":"A","manualChapter":"CH20"},{"id":495,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於不同器官病變的疼痛部位及轉移位置的敘述何者不正確？","options":{"A":"下顎、頸部、及左手臂內側是心肌缺氧性胸痛常見的轉移位置","B":"肝膿瘍病患可以因為發炎刺激橫隔膜，而出現左肩的轉移性疼痛","C":"急性胰臟炎除左上腹疼痛外，亦可以出現相對背痛位置的轉移痛","D":"輸尿管結石疼痛可以轉移造成同側鼠蹊部或睪丸的疼痛感"},"answer":"B","manualChapter":"CH20"},{"id":496,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列何種疾病不是低體溫病患的主要鑑別診斷？","options":{"A":"低血糖（hypoglycemia）","B":"嚴重敗血症（severe sepsis）","C":"肝腦病變（hepatic encephalopathy）","D":"甲狀腺黏液水腫性昏迷（myxedema coma）"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":497,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列何種病史或理學檢查發現，與嚴重肺栓塞沒有相關？","options":{"A":"反覆單側下肢腫脹","B":"脈搏壓（pulse pressure）降低","C":"中樞性發紺且對氧氣治療反應不佳","D":"頸靜脈怒張，且兩側呼吸音對稱且呈現細囉音（fine crackles）"},"answer":"D","manualChapter":"CH20"},{"id":498,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"出現下列理學檢查表現的病患必須考慮氣管內管插管治療，除了何者之外？","options":{"A":"頸部喘鳴音（stridor）","B":"逆理性呼吸（paradoxical respiration）","C":"庫斯毛耳氏呼吸（Kussmaul respiration）","D":"意識不清（昏迷指數（GCS）：8分）且呼吸速率每分鐘十下之病患"},"answer":"C","manualChapter":"呼吸型態(含肺音)"},{"id":499,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於理學檢查發現的判斷，何者為是？","options":{"A":"病患眼眶周圍瘀青（浣熊眼徵候）、耳後瘀青（貝特氏徵候）以及腦脊髓液耳漏常常一起出現於顱底骨折的病患","B":"顱內出血病患出現心搏加速且血壓上升時，稱為庫欣氏反射（Cushing reflex），代表此時患者因為顱內壓上升，可能出現腦疝脫（brain herniation）的現象","C":"腹部反彈痛（rebound tenderness）徵候代表病患腹膜受到刺激而出現炎症反應，此時細菌感染造成的腹膜炎是唯一需要考慮的鑑別診斷","D":"肚臍周邊瘀青（Cullen's sign）代表患者腹腔內的大量出血，而腰側瘀青（Gray-Turner’s sign）則是代表後腹腔出血，兩者均可以是急性胰臟炎以及主動脈瘤破裂病患的臨床表現"},"answer":"D","manualChapter":"CH20"},{"id":500,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於聽診的敘述，何者為是？","options":{"A":"聽診器的使用，鼓面適合聽低頻的心音或呼吸音，使用時需要用力貼緊患者胸壁皮膚，才可以有最佳的收音效果","B":"張力性氣胸、胸部創傷合併大量血胸、腫瘤病患合併大量肋膜積液病患，胸部聽診時均可能出現單側呼吸音降低，在理學檢查上並沒有辦法進一步加以區分","C":"一位過去有氣喘病史的病患，主訴呼吸困難，若理學檢查時兩側肺部聽診沒有聽到明顯的哮喘音（wheezes），即可完全排除氣喘發作的可能性，而另行尋找其他可能的疾病診斷","D":"急性心包膜炎病患，會因為心包膜腔發炎積水（pericardial effusion）的出現，而使得心包膜摩擦音消失，因此心臟聽診沒有發現心包膜摩擦音，並無法排除急性心包膜炎的可能性"},"answer":"D","manualChapter":"CH20"},{"id":501,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列病患需要考慮放置氣管內管（endotracheal intubation），何者除外？","options":{"A":"頸部深部感染出現喘鳴音（stridor）","B":"火場傷患出現聲音沙啞（hoarseness）且咳出含碳塵痰液","C":"藥物過敏性產生眼眶周邊水腫、上呼吸道沒有喘鳴音（stridor）但有細支氣管痙攣收縮造成雙側瀰漫性哮喘（wheezes），血壓為140/92毫米汞柱，指尖血氧濃度為93%之病患","D":"上述病患均需立即放置氣管內管以保護呼吸道的暢通"},"answer":"C","manualChapter":"CH15"},{"id":502,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列何種理學檢查發現，與後腹腔的疾病或損傷沒有關係？","options":{"A":"腰側瘀青","B":"蛇女頭徵候（caput medusae）","C":"腰大肌徵候（psoas sign）","D":"肋脊角敲擊痛（costovertebral angle knocking pain）"},"answer":"B","manualChapter":"CH20"},{"id":503,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列何者非創傷病患初步評估之項目？","options":{"A":"頸椎固定及維持呼吸道通暢","B":"呼吸及換氣功能","C":"循環及控制出血","D":"病史詢問"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":504,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"高級救護技術員的關鍵思考步驟順序為何？（a）應用原則，（b）資料判讀，（c）反應評估，（d）概念形成，（e）事後回顧","options":{"A":"a，b，c，d，e","B":"b，d，c，a，e","C":"d，a，b，c，e","D":"d，b，a，c，e"},"answer":"D","manualChapter":"CH22"},{"id":506,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"一位30歲男性病人，在被蜜蜂叮到胸部之後，突發性呼吸困難，聲音沙啞，眼眶周邊組織血管性水腫、發紺、呼吸輔助肌使用、喘鳴、肺部吐氣期哮鳴音，請問他最可能是以下何種疾病？","options":{"A":"嚴重氣喘發作","B":"張力性氣胸","C":"頸部深部感染","D":"嚴重過敏合併咽喉水腫"},"answer":"D","manualChapter":"非創傷"},{"id":507,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於醫病關係與溝通的敘述，下列何者為是？","options":{"A":"因為不適當的承諾導致病患或家屬對治療結果有過高的期待，是Beckman於1994年研究醫病關係建立與溝通中四種常見缺失中，最為常見的一種","B":"對於一個疑似H7N9禽流感感染的發燒病患，為保護醫療人員的安全降低感染風險，因此必須採用以醫師為中心的「主動一被動模式」單向影響病患，病患完全沒有參與互動的空間","C":"現場病患及家屬常常因為緊張驚慌而無法配合緊急醫療人員的處置，這時高級救護技術員應該表現專業性與自信心，使用「放心好了，不會有什麼問題的」這樣的語句，以給予病患及家屬適度的安撫","D":"高級救護技術員必須對病患的情緒反應採取開放的態度，並用正向或接納的語言表達同理心"},"answer":"D","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":508,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於病史詢問的原則與技巧，下列敘述何者為是?","options":{"A":"發育遲滯的病患因為無法表達自己的症狀並提供可靠的臨床訊息，因此為求訊正確性，高級救護員不應採用這類病患本人所提供的病史，而需轉由詢問主要彟者獲得正確病史","B":"澄清（clarification）主要的目的是要對於病患含糊的描述加以釐清，應該使用病可以理解的語言，並且不要用程度量化的問句來詢問，以避免產生引導式問句誤導病患對於自己症狀的描述","C":"重覆病患的最後一句話，可以鼓勵病患繼續陳述自己的症狀，是屬於病史詢問中「反射（reflection）」的技巧","D":"緊急救護現場因為時間的限制，高級救護技術員必須先使用專一性的問句以求迅速獲臨床上的重要病史訊息，再用廣泛性的問句來詢問有沒有出現其他的相關症狀"},"answer":"C","manualChapter":"CH19"},{"id":510,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於轉移性疼痛的考量，何者為非？","options":{"A":"右肩的轉移性疼痛，需要考慮肝膿瘍、肝腫瘤、及右側橫隔膜下膿瘍等疾病","B":"胃食道逆流可以往上轉移到脖子及下巴","C":"主動脈剝離的疼痛可以傳到背後，甚至由胸口轉移到腹部","D":"輸尿管結石疼痛可以轉移造成同側鼠蹊部或睪丸的疼痛感"},"answer":"B","manualChapter":"CH20"},{"id":511,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於周邊脈搏及血壓的評估及測量，下列敘述何者為非？","options":{"A":"左右手脈搏強度不對稱，必須考慮主動脈剝離、游離性血栓導致血管阻塞、周邊血管動脈硬化或是血管炎之可能","B":"使用同一血壓計測量四肢血壓，若雙側下肢血壓測量結果均比上肢低，需考慮腹部主動脈瘤破裂、主動脈剝離、及腹部主動脈血栓阻塞之可能","C":"脈搏壓（pulse pressure）變窄減小，常見於鬱血性心衰竭、嚴重主動脈瓣膜狹窄、早期敗血症、心包膜填塞、及嚴重肺栓塞等疾病病患身上","D":"脈搏壓增加變寬，可見於嚴重主動脈瓣膜閉鎖不全之病患"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":512,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於理學檢查的評估，下列敘述何者為是？","options":{"A":"大量心包膜積液導致心包膜填塞之病患，理學會出現頸靜脈怒張、肺部呼吸音亁淨對稱、心臟最大搏動點（point of maximal impulse）外移、心音呈現遙遠模糊（distant heart sound）、且脈搏壓下降窄小","B":"後腹腔出血之病患，可於肚臍周邊呈現瘀青，稱為Cullen’s sign","C":"病患出現收縮期心雜音，需要鑑別主動脈瓣狹窄、僧帽瓣逆流、三尖瓣狹窄、以及肺動脈瓣逆流等心臟瓣膜疾病","D":"病患於右上肺野處持續出現鼾音（rhonchi）且不隨身體位置或咳痰而改變，代表有固定性氣管內狹窄如腫瘤之可能性"},"answer":"D","manualChapter":"CH20"},{"id":514,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於傳染性病患處置的敘述，下列何者為是？","options":{"A":"對於一個疑似中東呼吸症候群冠狀病毒感染症（MERS）感染的發燒病患，為降低醫療人員的遭受感染及病毒在社區間傳播的風險，因此必須採用以醫師為中心的「主動一動模式」，此時醫療作為上必需滿足病患醫療基本需求","B":"醫療人員因為希望傳染病患可以在醫療上及隔離上的配合，往往會對這類病的病債出過度的承諾，是Beckman等人於1994年發表的研究中四種常見的缺失之一","C":"針對發燒或呼吸道疾病詢問TOCC（旅遊、職業、接觸、群聚）病史，可以有助於到院前緊急救護人員早期警覺可能的特殊傳染性疾病病患。例如賴比瑞亞及獅子山近期出現伊波拉病毒出血熱疫情，而中東地區國家則傳出中東呼吸症候群冠狀病毒疫情","D":"生物恐怖戰劑分為A、B、C三大類，主要是依據其流行病學上的傳播途徑來區分，其中A類的生物恐怖戰劑均為空氣傳播，可以很容易的藉由人與人傳播"},"answer":"C","manualChapter":"CH43","explanation":"Beckman發現在醫病關係的建立與溝通上，有四種常見的缺失：\n1. 覺得被遺棄。\n2. 覺得認知或觀點不被尊重 。\n3. 訊息傳達不良 。\n4. 缺乏同理心"},{"id":515,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於病史詢問的原則與技巧，下列敘述何者為是？","options":{"A":"緊急救護現場因為時間的限制，高級救護技術員必須先有效率的使用專一性的問句迅速獲得臨床上的重要病史訊息，再用廣泛性的問句來綜合詢問病患有沒有遺漏其他重要的相關症狀","B":"重覆病患的最後一句話末尾幾個字，可以鼓勵病患繼續陳述自己的症狀，同時避免扭曲病患的所想要表達的意思，是屬於病史詢問中「反射（reflection）」的技巧","C":"澄清（clarification）主要的目的是要對於病患含糊的描述加以釐清，應該使用病患可以理解的語言，並且不要用程度量化的問句來詢問，以避免產生引導式問句誤導病患對於自己症狀的描述","D":"由於酒精或物質濫用病患的行為反應往往會出現難以預期的攻擊行為，因此救護技術員必須對病患加以適當的約束，並避免反覆接近病患進行病情評估，以減少給病患攻擊的機會"},"answer":"B","manualChapter":"CH19"},{"id":517,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於相關症狀的加劇與緩解因子的敘述，何者為是？","options":{"A":"急性胰臟炎病患因胰臟發炎導致腹膜刺激，因此習慣保持平躺以減輕腹部疼痛","B":"心包膜炎病患保持平躺姿勢，可以減少心包膜與心包膜間摩擦的程度，進而緩解胸痛的程度","C":"顱內靜脈竇血栓所引起的頭痛，會因為平躺後血液較容易回流心臟，進而降低腦壓，所以可以緩解頭痛的嚴重度","D":"顱內壓上升之病患因為入睡後呼吸速率降低，血液內二氧化碳濃度上升刺激顱內血管擴張，進而使得更多血液流入顱內，導致腦壓的進一步上升，因此會加劇頭痛的程度，而往往導致病患中斷睡眠"},"answer":"D","manualChapter":"CH19"},{"id":518,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列疾病病患可能在理學檢查時出現肋脊角敲擊痛，其中何者為非？","options":{"A":"肝膿瘍","B":"急性膽囊炎","C":"主動脈瘤破裂","D":"急性腎盂性腎炎"},"answer":"B","manualChapter":"CH20"},{"id":519,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於周邊脈搏及血壓的評估及測量，下列敘述何者正確？","options":{"A":"評估病患脈搏的強弱，反應的是病患血壓的高低","B":"脈搏壓（pulse pressure）增加變寬，可見於孕婦、嚴重貧血、甲狀腺機能亢進、及嚴重主動脈瓣膜閉鎖不全之病患","C":"脈搏壓變窄減小，常見於鬱血性心衰竭、嚴重主動脈瓣膜狹窄、早期敗血症、心包膜填塞、及嚴重肺栓塞等疾病病患身上","D":"使用同一血壓計測量四肢血壓，若雙側上肢血壓測量結果均比雙側下肢為低，則需考慮主動脈剝離或心包膜填塞之可能性"},"answer":"B","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":520,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於理學檢查的評估，下列敘述何者為非？","options":{"A":"腹腔內大量出血之病患，可於肚臍周邊呈現瘀青，稱為Cullen’s sign","B":"胸部呼吸音聽診時於病患右上肺野處出現鼾音（rhonchi），但隨身體位置或拍痰動作後消失，代表有氣管內痰液梗塞或出現非固定性氣管內異物","C":"病患出現收縮期心雜音，需要鑑別主動脈瓣狹窄、僧帽瓣逆流、肺動脈瓣狹窄、以及三尖瓣逆流等心臟瓣膜疾病","D":"大量心包膜積液導致心包膜填塞之病患，理學會出現頸靜脈怒張、肺部呼吸音乾淨對稱、心臟最大搏動點（point of maximal impulse）外移、心音呈現遙遠模糊（distant heart sound）、且脈搏壓下降窄小"},"answer":"D","manualChapter":"CH20"},{"id":521,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列關於聽診的敘述，何者為是？","options":{"A":"張力性氣胸、胸部創傷合併大量血胸、腫瘤病患合併大量肋膜積液病患，胸部聽診時均可能出現單側呼吸音降低，在理學檢查上並沒有辦法進一步加以區分","B":"心臟聽診可以藉由調整病患的姿勢來加強特定心音的聽診，如病患左側躺可以加強主動脈瓣的聽診，而讓病患坐姿身體前傾則可以加強僧帽瓣的聽診","C":"急性心包膜炎病患，會因為心包膜表面發炎出現積液導致心包膜摩擦音的消失，因此即使心臟聽診沒有出現心包膜摩擦音，仍然不可以完全排除急性心包膜炎的可能性，此時要注意的反而是有無出現心包膜填塞的可能性","D":"一位過去有氣喘病史的病患，主訴呼吸困難，若理學檢查時兩側肺部聽診沒有聽到明顯的哮喘音（wheezes），即可完全排除氣喘發作的可能性，而另行尋找其他可能的疾病診斷"},"answer":"C","manualChapter":"CH20"},{"id":522,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"年輕病患若出現下列理學檢查發現時，代表患者出現免疫功能低下，而需考慮有後天免疫不全症候群（AIDS）之可能性，何者為非？","options":{"A":"囗腔內卡波西氏瘤（Kaposi'ssarcoma）","B":"口腔或食道念珠菌感染（oralcandidiasis）","C":"舌頭側邊出現毛樣白斑症（hairyleukoplakia）","D":"全身四肢多處靜脈注射針孔疑似毒癮患者"},"answer":"D","manualChapter":"CH20"},{"id":525,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下面關於成功的公共場所設置自動體外去顫器計畫，何者是錯誤的？","options":{"A":"必須由消防專業人員規畫與監督整個計畫的進行","B":"應該給予施救者心肺復甦術加自動體外去顫器的訓練","C":"需要與當地的緊急醫療救護系統緊密配合","D":"要有定期的品管回顧檢討改進"},"answer":"A","manualChapter":"CH03"},{"id":527,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"與盲腸炎有關的理學檢查，不包括下列哪一項？","options":{"A":"莫菲氏徵象（Murphy's sign）","B":"洛夫辛徵象（Rovsing's sign）","C":"腰大肌徵象（psoas sign）","D":"閉孔肌徵象（obturator sign）"},"answer":"A","manualChapter":"CH20"},{"id":528,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"兒童的生命之鏈五環中，不包括下列哪一項？","options":{"A":"事故預防","B":"儘早心肺復甦術（CPR）","C":"儘早使用自動體外電擊器電擊（AED）","D":"儘早有效的高級小兒救命術（ALS）"},"answer":"C","manualChapter":"CH23"},{"id":529,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"猝死（OHCA）急救成功（ROSC）後進行低溫治療（therapeutic hypothermia）的原理，不包括下列哪一項？","options":{"A":"治療性低體溫能減少大腦代謝率","B":"治療性低體溫能減少急救後的細菌感染","C":"治療性低體溫能減少組織再灌流的免疫反應","D":"治療性低體溫能減少多器官衰竭的發生"},"answer":"B","matchedChapters":["CH24"],"manualChapter":"CH24"},{"id":530,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"據報在高速公路上發生了小客車追撞車禍，身為高級救護技術員的你到達現場後發現，有一名年約40歲的男性病患正呆坐在車道上，囗中喃喃自語，在確認現場環境安全及詢問病史後，發現此名傷患是其中一台小客車的副駕駛座乘客，同一台的駕駛因嚴重外傷在駕駛座上沒有生命跡象。請問下列有關此病患的敘述，何者有誤？","options":{"A":"若此名病患神智清楚，生命徵象穩定，仍需因其屬於嚴重創傷機轉而儘速送創傷中心。","B":"若此名病患開始抱怨胸囗會痛且有點呼吸不過來，理學檢查時發現其胸骨上方有一瘀青，聽診時心音遙遠，要小心心包膜填塞的可能性。","C":"此名病患在轉送過程中，突然發生心跳停止，聽診發現右側沒有呼吸音，視診發現其頸靜脈怒張及氣管偏移，此時應開始心肺復甦術且儘速行針刺減壓，因這名病患很有可能產生右側張力性氣胸。","D":"現場評估病患時，發現其腰側有一瘀青，要小心這可能是腹腔出血所造成的Cullen's sign"},"answer":"D","manualChapter":"呼吸型態(含肺音)"},{"id":531,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"下列有關成人及小兒基本救命術的敘述，何者為非？","options":{"A":"成人生命之鏈的第一個環，為儘早辨認及啟動緊急醫療應變系統","B":"小兒生命之鏈的第一個環是強調事故預防","C":"成人生命之鏈及小兒生命之鏈，均為先啟動緊急醫療應變系統然後儘早CPR","D":"成人生命之鏈及小兒生命之鏈的最後一環，均是病患須接受整合性復甦後照護"},"answer":"C","manualChapter":"CH23"},{"id":532,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"關於病史詢問的技巧，下列敘述何者不正確？","options":{"A":"適當的問候病人並且有自信地自我介紹是非常重要的第一步","B":"先問廣泛性的問題，再問專一性的問題","C":"使用開放性的問題比引導性的問題好","D":"重覆病患的最後一句話，是屬於病史詢問中「促進（facilitation）」的技巧。"},"answer":"D","manualChapter":"CH19"},{"id":533,"source":"第三章 病患評估與理學檢查(2012-2014).doc","question":"人體的中樞神經系統，不包括：","options":{"A":"交感神經系統","B":"小腦","C":"脊髓","D":"延腦"},"answer":"A","manualChapter":"CH12"},{"id":534,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"EMTP使用醫學上常用的結構式溝通S-O-A-P模式，不包括下列哪一項？","options":{"A":"S：surrounding data環境安全與對病患及施救者之影響","B":"O：objective data病患身體評估的結果","C":"A：assessment data綜合上述結果形成的臨床判斷","D":"P：plan of management根據臨床判斷所形成的治療計畫"},"answer":"A","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":538,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"關於EMTP使用聽診器進行聽診的說明，何者為是？","options":{"A":"聽診的原理，是利用空氣或液體的流動所發出的聲響判斷身體部位哪裏有異常","B":"雙面聽診器的膜面，是為了收集較低頻率的聲音，所以使用膜面聽診時應輕放在皮膚表面即可","C":"若是EMTP聽診時發現病患有哮喘音（wheezes），就代表病患的呼吸窘迫一定是氣喘或肺氣腫所引起","D":"聽診在到院前環境中很難執行，故聽診檢查並非EMTP訓練及理學檢查的重點"},"answer":"A","manualChapter":"CH20"},{"id":539,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"各種到院前情境處理時所需要的個人防護裝備說明，下列何者為非？","options":{"A":"小出血止血不用穿隔離衣","B":"急產接生不用戴護目鏡","C":"氣插管不用穿隔離衣","D":"建立靜脈注射管路不用戴護目鏡"},"answer":"B","matchedChapters":["CH22"],"manualChapter":"CH22"},{"id":542,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"下列病患何者並非醫學上建議使用葉克膜（ECMO）進行急救之對象？","options":{"A":"剛發生車禍、頭部外傷併嚴重顱內出血的心跳停止病患","B":"心臟衰竭末期、經醫師評估有換心手術適應症的心跳停止病患","C":"火場剛剛救出、嚴重吸道灼傷導致窒息的心跳停止病患","D":"近一週內出現心肌炎導致心衰竭及心律不整的心跳停止病患"},"answer":"A","manualChapter":"CH24"},{"id":544,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關低溫治療可能發生的併發症影響或副作用，下列何者為是？","options":{"A":"心搏過慢","B":"可能影響免疫系統與電解質，包括高血鈉、低血鉀、低血鎂、低血磷、低血鈣等","C":"顫抖或出血","D":"以上皆是"},"answer":"D","manualChapter":"CH24"},{"id":546,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"指端血氧飽和度監視器會受到許多因素的影響，下列何者為非？","options":{"A":"膚色差異、黃疸","B":"指甲油塗抹、異常血紅素過多","C":"可偵測反應血液中的變性血紅素、一氧化碳血紅素","D":"休克、周邊動脈阻塞性疾病"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"]},{"id":547,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"病人評估的優先順序，下列排序何者為是？1.重點式的病史詢問與理學檢查：測量生命徵象，並進行病史詢問與重點性的理學檢查，必要時並開始治療。2.初級評估：發現並處理所有危及生命的狀況，如果有必要的話，立刻給予急救。3.詳細理學檢查：以進一步獲得疾病診斷的其他相關資訊。4.繼續評估：在到院前持續監控病情，並給予適當的治療。","options":{"A":"1→2→3→4","B":"1→3→2→4","C":"2→3→1→4","D":"2→1→3→4"},"answer":"D","manualChapter":"CH19"},{"id":548,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關昏迷指數（Glasgowcomascale，GCS），下列何者為非？","options":{"A":"昏迷指數針對病患的睜眼、運動以及說話三個方面來評估計分，加總後病患意識介於3分到15分，最低為3分，代表病患完全喪失意識，而最好的意識狀態為15分","B":"運動反應，對疼痛刺激肢體會回縮躲避為5分","C":"運動反應，對疼痛刺激產生肢體伸直反應為2分","D":"說話反應，發出不連貫而無意義的字句為3分"},"answer":"B","manualChapter":"CH20"},{"id":549,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關到院前緊急醫療救護之病史詢問，下列何者為是？","options":{"A":"SAMPLE乃應用於主訴導向式系統檢閱","B":"OPQRST乃針對創傷傷患評估設計","C":"對發燒病患詢問TOCC四史指的是（旅遊史Travel history、職業別Occupationn、接觸史Contacthistory及群聚Cluster情形）","D":"現場救護往往會遭遇特殊的病患或狀況影響病患溝通與評估，高級救護技術員除了必須熟悉各種特殊狀況的溝通技巧外，應該儘量承諾來顯現自信以符合病患或家屬的期待"},"answer":"C","manualChapter":"CH19"},{"id":550,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關醫病與救護溝通可能會遇到的困境導致溝通無效或失敗，下列何者為非？","options":{"A":"接受者的背景或特質（Attributes of the receiver）：例如與外傭詢問是否應停止病患之現場急救復甦（TOR）","B":"選擇性的解讀（Selective perception）：例如某些宗教的病患對於肢體接觸感到被冒犯","C":"語義不清（Semantic problems）：例如救護技術員通知醫院關於病患意識不清的狀況","D":"時間壓力（Time pressure）：例如對於OHCA病患救護處置AED的使用訊息傳遞不足"},"answer":"B","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":551,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關醫療救護與病患互動的模式，下列敘述何者為是？","options":{"A":"高級救護技術員EMTP對於OHCA病患進行AED去顫是指導－合作模式","B":"高級救護技術員EMTP對於GCS 6分，呈呼吸衰竭徵狀，SpO2：78%的病患進行氣管內管插管是主動－被動模式","C":"高級救護技術員EMTP對於精神急症病患進行強制就醫是共同參與模式","D":"高級救護技術員EMTP對於GCS 15分，E4V5M6主訴頭暈肢體無力病患進行血糖機one touch血糖檢測是主動－被動模式"},"answer":"B","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":552,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關醫療救護與病患溝通四步驟與技巧（The Four Habits Model），下列何者為是？1.展現同理心（Demonstrate Empathy）2.開場（Invest the Beginning）3.確認病患認知（Elicitthe Patient's Perspective）4.結論與總結（Invest in the End）。","options":{"A":"1→2→4→3","B":"1→3→2→4","C":"2→3→1→4","D":"3→2→1→4"},"answer":"C","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":553,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關到院前緊急救護臨床決策的六個元素，要將這些有效率的臨床決策付諸行動與綜合運用，下列執行順序何者為是？（1）評估環境（Read the scene）。（2）評估病患（Read the patient）。（3）診斷治療（React）。（4）回顧事件（Review performance）。（5）重新評估（Revaluate）。（6）修改計畫（Revise management plan）","options":{"A":"2→1→3→5→4→6","B":"1→2→3→4→5→6","C":"1→2→3→4→6→5","D":"2→1→3→5→6→4"},"answer":"D","manualChapter":"CH01","matchedChapters":["CH01"]},{"id":555,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"關於理學檢查的基本描述，下列敘述何者為非？","options":{"A":"理學檢查基本的四大技術，分別是視診、觸診、扣診以及聽診","B":"生命徵象的檢測，也包括在理學檢查的項目當中","C":"神經學檢查因為太過複雜，一般救護現場都不施行","D":"重點性的理學檢查，通常都是配合病史詢問"},"answer":"C","manualChapter":"CH20"},{"id":559,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"以下配對，何者為非？","options":{"A":"主動脈剝離－突發性撕裂或刀割般的尖銳疼痛，偶爾合併前胸到後背的轉移痛","B":"急性心肌梗塞－急性左前胸壓迫或悶痛感，常合併下巴或左上肢的轉移痛","C":"自發性氣胸－急性單側胸痛，深呼吸時可減緩疼痛感","D":"輸尿管結石－急性單側腰痛，常合併後腰到鼠蹊部的轉移痛"},"answer":"C","manualChapter":"CH20"},{"id":560,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"72歲男性突然左側肢體無力，理學檢查發現病患會自發性睜眼，左側上下肢肌肉力量僅2分，且明顯失語症無法發出任何字句，但病患可用右手握筆跟你筆談。請問該病患的GCS昏迷指數為何？","options":{"A":"E4M2V1","B":"E4M6VA","C":"E4M6V1","D":"E4M2VA"},"answer":"B","manualChapter":"CH20"},{"id":561,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關於救護出勤時，醫病溝通過程的描述，下列何者為非？","options":{"A":"若懷疑病患有急性傳染病時，救護人員要求病患合作，此模式為指導－合作模式","B":"在一開始接觸病人時，應迅速建立和諧的氣氛，並採取開放式的問題搜集資訊","C":"在醫病關係的建立與溝通上，訊息傳達不良及缺乏同理心是常見的缺失","D":"適度讓病患或家屬參與醫療決策是完全沒有幫助的"},"answer":"D","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":562,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"高級救護技術員在緊急狀況下，為確保訊息傳遞的完整性與品質，其中一個常被使用的模式是SOAP模式，關於SOAP模式，以下敘述何者為非？","options":{"A":"S：病患的主觀症狀與資訊，其中包括家屬或目擊者提供的資訊","B":"0：客觀的評估觀察結果","C":"A：病患自覺的疾病","D":"P：已經進行中的治療及其他進一步治療計劃"},"answer":"C","manualChapter":"CH18"},{"id":563,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"下列關於病患主訴的症狀，高級救護技術員在評估過後的初步臨床判斷，下列何者是最不合理的初步臨床判斷？","options":{"A":"一位80歲的男性病患，描述在早上起床時，發現右側肢體無力，此時可能要懷疑病人有腦血管性疾病","B":"一位20歲的男性病患，描述昨晚去吃到飽的餐廳大吃大喝，今天早上起床時發現雙下肢無力，此時可能要懷疑病人有週期性低血鉀麻痺等疾病","C":"一位60歲的男性，描述左胸悶痛，平常有抽菸的習慣，最近在運動時會感到胸口有沈重壓迫感，並會延伸到左邊肩膀，休息時會緩解，此時可能要懷疑病人有氣胸等肺部疾病","D":"一位40歲的男性，描述咳嗽時會右邊胸痛，最近有發高燒及痰多的症狀，此時可能要懷疑病人有肺炎等肺部疾病"},"answer":"C","manualChapter":"非創傷"},{"id":564,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"給藥途徑縮寫〔I.H.〕指的是？","options":{"A":"皮下注射","B":"舌下含藥","C":"霧氣吸入","D":"氣管內管給藥"},"answer":"C","manualChapter":"CH16"},{"id":565,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"EMTP使用醫學上常用的結構式溝通S-O-A-P模式，不包括下列哪一項？","options":{"A":"S：surrounding data環境安全與對病患及施救者之影響","B":"0：objective data病患身體評估的結果","C":"A：assessment data綜合上述結果形成的臨床判斷","D":"P：plan of management根據臨床判斷所形成的治療計畫"},"answer":"A","manualChapter":"CH18"},{"id":566,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"除夕前一天，救護台通報有名女生打電話求救，表示頭很暈，全身全力。EMT到現場破門而入時，發現有三名女大學生倒在臥室，身邊沒有藥品。理學檢查病患身上無明顯外傷，但都呈現意識不清，心跳偏快。以下何者為是？","options":{"A":"若使用指端血氧飽和度監視器，應打開室內電燈，否則光線太暗，其數值會受到影響","B":"若使用指端血氧飽和度監視器，不需要避開量測血壓的肢體","C":"雖然指端血氧飽和度監視器呈現98%，該病患仍應提供高濃度氧氣治療","D":"女大學生指甲上的指甲油不會影響指端血氧飽和度監視器的數值"},"answer":"C","manualChapter":"CH20"},{"id":567,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關於轉移痛，以下何者為是？","options":{"A":"急性闌尾炎，一開始會痛在右下腹，之後會轉移至肚臍周邊","B":"急性膽囊炎會有轉移痛到左側肩胛骨下方","C":"左側輸尿管結石引起疼痛，會轉移到腹股溝或左側睪丸處","D":"急性心肌梗塞，轉移痛會痛到右側肩膀的"},"answer":"C","manualChapter":"CH38"},{"id":568,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"一名65歲病患，因身體不適由119送醫。病患表示全身酸痛，有寒顫，有一點咳。血壓120/80mmHg、心跳120/min、呼吸22/min、體溫39℃。有關於病史詢問以及理學檢查，那一項較不重要？","options":{"A":"病患疼痛指數，自1分～10分","B":"病患最近有沒有到那裡旅遊，包含國內或國外","C":"病患周邊同住的人是否有類似的症狀或發燒","D":"病患的職業是什麼"},"answer":"A","manualChapter":"CH19"},{"id":569,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"有關理學檢查，請問以下何者為是？","options":{"A":"胸部理學檢查的順序是視、觸、叩、聽","B":"心臟理學檢查的順序是視、聽、叩、觸","C":"腹部理學檢查的順序是視、叩、觸、聽","D":"病患的所有理學檢查步驟都必須在救護現場完成以正確診斷病情"},"answer":"A","manualChapter":"CH20"},{"id":570,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"一名老年男性，過去有糖尿病與高血壓病史。病患主訴忽然視力不佳，看東西會複視（diplopia）。119送醫時進行評估，發現病患的眼睛也是怪怪的，以下是病患往正前方看的圖片，請問以下的敘述，何者為是？","options":{"A":"病患有可能第三對腦神經病變","B":"病患有可能第四對腦神經病變","C":"病患有可能第六對腦神經病變","D":"病患有可能第七對腦神經病變"},"answer":"A","manualChapter":"CH12","matchedChapters":["需要圖片"],"image":"題庫圖片/570.png"},{"id":571,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"某高中教官制止學生不常行為，被學生用刀刺在左側後背上方。119到達現場時，發現傷患的背部傷口一直在流血，理學檢查發現有兩道傷口長度各約4公分，凶器找不到。下圖照片為傷患臉朝下躺著，自背部拍攝的位置，右上方是頸部。以下敘述，何者為非？","options":{"A":"若是兩側胸部以下都會發麻，有可能傷到脊柱神經（spinal cord）","B":"若發現傷囗周邊有皮下氣腫，血壓下降，表示有刺到肺部造成氣胸，應立即針刺減壓","C":"若是有頸靜脈怒張，血壓下降，氣管沒有偏移，要高度懷疑是心包膜填塞","D":"若是頸靜脈沒有怒張，血壓下降，氣管沒有明顯偏移，要高度懷疑是大量血胸"},"answer":"B","manualChapter":"CH28","image":"題庫圖片/571.png"},{"id":573,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"醫病之間互動與溝通的技巧是非常重要的。高級救護技術員在救護的過程中，關於展現同心的技巧，下列何者為非？","options":{"A":"注意病患或家屬肢體或語調所展現的情緒反應，並對些情緒反應採取開放的態度看待","B":"用適度的肢體語言表達同理心，例如：臉部的表情、適度的接觸，如輕拍肩膀等等","C":"根據病患或家屬的情緒回饋適度調整自己的應對，必要時以適時的沈默面對也無妨","D":"病患或家屬表現緊張情緒時，利用「放心好了，不會有什麼問題」類似語句加以安撫"},"answer":"D","matchedChapters":["CH18"],"manualChapter":"CH18"},{"id":574,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"下列症狀何者是典型的蜘蛛網膜下腔出血？","options":{"A":"昨天咳嗽、流鼻水、喉嚨痛，今天整個頭劇痛，還高燒到39度","B":"一小時前頭劇痛，三個月前騎機車出車禍有撞到頭，期間一直沒不舒服","C":"一小時前忽然左側顳葉處搏動性劇痛，痛到噁心但沒吐，而且會怕光","D":"一小時前忽然整個頭痛欲裂，這輩子沒這麼痛過，痛到吐了兩次，頸部覺得僵硬怪怪的"},"answer":"D","manualChapter":"CH27","matchedChapters":["CH27"]},{"id":575,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"下列病患在未給氧時的血氧濃度都是100%，但以下的理學檢查發現，何者最需考慮盡速給予氣管內管插管？","options":{"A":"火場救出顏面燒傷傷患，頸部明顯喘鳴音（stridor），眉毛鼻毛燒焦捲曲","B":"過去病史心臟衰竭患者，兩側明顯濕囉音（crackles），使用輔助呼吸肌","C":"患者出現庫斯毛耳氏（Kussmaul respiration），呼吸每分鐘次數32下","D":"意識不清患者，瞳孔不等大，呼吸每分鐘次數12下，血壓200/120mmHg"},"answer":"A","manualChapter":"CH20"},{"id":576,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"你接派遣出勤酒醉路的患者。到達現場時病患渾身酒味，意識對聲音有反應，呼吸型態快且每都進行深度換氣、下列敘述何者為是？","options":{"A":"此種呼吸為陳施氏呼吸（Cheyne-Stokes respiration）","B":"此種呼吸型態為畢歐氏呼吸（Biot's respiration）","C":"應考慮病患可能為甲醇中毒引起的代謝性鹼中毒","D":"需對病患驗血糖，因有可能是糖尿病酮酸中毒引起"},"answer":"D","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":578,"source":"第三章 病患評估與理學檢查(2015-2018).doc","question":"根據AHA 2015年規範，關於小兒生命之鏈的敘述何者為是？","options":{"A":"第一個環為早期辨識心跳停止並啟動緊急醫療應變網","B":"與成人不同的地方在於強調需盡早取得AED並啟動緊急醫療應變網","C":"第三個環與成人OHCA生命之鏈不同","D":"與成人相同的地方在於先啟動緊急醫療應變系統接著盡快開始CPR"},"answer":"C","manualChapter":"CH48"},{"id":579,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"有關頸椎神經控制之範圍，以下何者為非？","options":{"A":"抓手功能是由C7、C8所控制","B":"乳頭感覺是由T4所控制","C":"肚臍感覺是由T10所控制","D":"呼吸功能是由T4所控制"},"answer":"D","manualChapter":"CH27"},{"id":580,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位45歲病患因呼吸急促以及胸痛休克需要急救，且頸靜脈鼓張，病患最不可能出現的狀況","options":{"A":"心因性休克","B":"心包膜填塞","C":"肺炎敗血性休克","D":"張力性氣胸"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":581,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位35歲病患車禍後，發現兩大腿開放性骨折合併肢體疼痛無力。現場血壓80／40毫米汞柱，心跳50下／分鐘，最可能為何種休克？","options":{"A":"過敏性休克","B":"低血容性休克","C":"敗血性休克","D":"神經性休克"},"answer":"D","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":582,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"肥胖的54歲男性病患飯後在餐桌上與友人閒聊抽煙時發生胸悶，但使用硝化甘油舌下含片三次才可緩解。現場十二導程心電圖沒有ST波段改變，此病患最可能的診斷為何？","options":{"A":"穩定性心絞痛","B":"不穩定性心絞痛","C":"ST節段上升心肌梗塞","D":"張力性氣胸"},"answer":"B","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":583,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位45歲高血壓及糖尿病病患今晨人意識不清，血壓220/130 mmHg，心跳50下/min，最可能為何種原因？","options":{"A":"低血糖昏迷","B":"心肌梗塞","C":"糖尿病高滲透壓昏迷","D":"腦出血合併腦壓上升"},"answer":"D","manualChapter":"非創傷"},{"id":584,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"50歲女士唱歌時突發劇烈頭痛，整顆頭都痛到要爆炸開來一般。救護車現場吐了兩次，且血壓明顯升高（180／120 mmHg）。現場理學檢查脖子時發現頸部僵硬。請問最可能的診斷是？","options":{"A":"硬腦膜上出血","B":"硬腦膜下出血","C":"蜘蛛膜下腔出血","D":"小腦出血"},"answer":"C","manualChapter":"CH20"},{"id":585,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位45歲頭部外傷病患，數小時前人還清楚，之後意識越來越模糊，關於針對意識不清病患進行腦幹功能的神經學檢查，何者為非？","options":{"A":"角膜反射","B":"瞳孔反射","C":"Babinski sign的檢查","D":"Doll's eye sign的檢查"},"answer":"C","manualChapter":"CH36"},{"id":586,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"依據加拿大頸椎守則（Canadian C-spine Rule），下列何種情況不需要上頸圈？","options":{"A":"兩公尺高處落下","B":"肢體麻木或無力","C":"酒醉併意識昏迷","D":"頸部側邊有壓痛"},"answer":"D","manualChapter":"CH25"},{"id":587,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"45歲病患因騎摩托車車禍撞到後腦，到達現場時，發現病患無酒醉，四肢運動正常，但走路會搖晃不穩。關於本病患小腦的神經學檢查，何者為非？","options":{"A":"腳跟接腳尖走直線檢查平衡（Tandem Gait）","B":"指尖－鼻尖－指尖的檢查（Finger-Nose-Finger）","C":"看病患坐著會不會歪一邊（Sitting Balance）","D":"眼睛上下左右看眼球運動是否受到限制（EOM）"},"answer":"D","manualChapter":"CH36"},{"id":588,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位45歲病患因呼吸急促合併有休克的症狀，且頸靜脈明顯鼓張，請問他最不可能出現的狀況是？","options":{"A":"張力性氣胸（tension pneumothorax）","B":"心包膜填塞（cardiac tamponade）","C":"大量血胸（massive hemo-thorax）","D":"大片肺栓塞（massive pulmonary embolism）"},"answer":"C","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":589,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位65歲長年高血壓病史之病患，發生摩托車自摔後，出現右上臂閉鎖性骨折合併胸口疼痛，現場血壓80／40毫米汞柱，心跳50下／分鐘，請問他最不可能出現下列何種休克？","options":{"A":"心因性休克","B":"出血性休克","C":"神經性休克","D":"藥物過量引發休克"},"answer":"B","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":591,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"以下有關細胞的描述，何者為錯誤？","options":{"A":"細胞核含有存放遺傳訊息的物質，也就是DNA","B":"核糖體（ribosome）的主要功能是內製造蛋白質，主要附著在粒線體（mitochondria）內","C":"溶小體（lysosome），可清除胞內的細菌及各種細胞碎屑","D":"高基氏體（Golgi apparatus）合成糖化蛋白囊泡，可經由胞吐作用而分泌至細胞外"},"answer":"B","manualChapter":"CH12"},{"id":592,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"以下有關於血液中的鈉、鉀離子平衡的描述，何者為是？","options":{"A":"細胞內鈉離子濃度較高、鉀離子濃度較低","B":"當我們為病患注入大量的碳酸氫納（NaHCO3），鉀離子將由細胞內轉到細胞外","C":"細胞膜上具有一個「鈉一鉀交換幫浦」不斷的消耗ATP以維持細胞內外鈉、鉀的平衡。這就是物質運輸中的「被動運輸」","D":"物質由低濃度往高濃度的移動，是「主動運輸」"},"answer":"D","manualChapter":"CH39"},{"id":593,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一位長期高血壓的老先生因為新發生的眩暈感、步態不穩東倒西歪而求救。他的四肢肌肉力量都是正常，但無法站穩。你覺得他中樞神經的哪一部位最可能發生了問題？","options":{"A":"小腦或腦幹","B":"大腦的額葉","C":"大腦的頂葉","D":"大腦的顳葉"},"answer":"A","manualChapter":"CH12"},{"id":594,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"此病患左側臉部疑似有帶狀疱疹發作。請問依據各位所學，其影響的神經是那一條？","options":{"A":"三叉神經","B":"視神經","C":"面神經","D":"聽神經"},"answer":"A","manualChapter":"CH12","image":"題庫圖片/594.png"},{"id":595,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"交感神經受到刺激者，以下何者為錯誤的反應？","options":{"A":"增加血糖濃度","B":"延遲排尿","C":"增加腸胃道蠕動","D":"心跳變快"},"answer":"C","manualChapter":"CH12"},{"id":596,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"對於左右大腦半球的敘述，何者為是？","options":{"A":"語言功能主要由右大腦半球負責","B":"算數能力主要由右大腦半球負責","C":"空間認知主要由左大腦半球負責","D":"書寫能力主要由左大腦半球負責"},"answer":"D","manualChapter":"CH12"},{"id":597,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"血紅素（紅血球）將氧氣運送至週邊組織後，會將它釋放至組織，而釋放過程是依「血紅素與氧氣」的親和力決定。以下何種情況，氧合血紅素飽合度曲線往左移？","options":{"A":"PCO2上升","B":"pH值下降","C":"溫度下降","D":"一氧化碳中毒"},"answer":"C","manualChapter":"CH12"},{"id":598,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"冠狀動脈的左前降支阻塞時，心電圖較可能會出現什麼變化？","options":{"A":"V1-V4 ST段上昇","B":"Ⅰ，AVL，V5，V6 ST段上昇","C":"Ⅱ，Ⅲ，AVF ST段上昇","D":"AVR ST段上昇"},"answer":"A","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":599,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"作頸動脈按摩術可以治療部份心律不整，請問其原理為何？","options":{"A":"刺激頸動脈竇，啟動間腦的心臟抑制中樞，經由交感神經，使心跳變慢","B":"刺激頸動脈竇，啟動延腦的心臟抑制中樞，經由副交感神經，使心跳變慢","C":"刺激主動脈竇，啟動間腦的心臟刺激中樞，經由交感神經，使心跳變快","D":"刺激頸動脈竇，啟動延腦的心臟刺激中樞，經由副交感神經，使心跳變快"},"answer":"B","manualChapter":"CH34"},{"id":600,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"影響血壓的因子，以下敘述何者為非？","options":{"A":"週邊血管阻力上昇、血壓會上昇","B":"回心血量增加，則單次心搏量會增加","C":"心跳速率越快，則單次心搏量越會增加","D":"心輸出量增加，則血壓會上昇"},"answer":"C","manualChapter":"CH12"},{"id":601,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"有一年約18歲的女生，在校園裡呼叫119救護，主訴呼吸喘，四肢發麻，但呼吸音正常。到院時抽動脈血，發現病患的pH7.01、［HCO3-］下降、PaCO2 15毫米汞柱，請問您認為這位病患最可能出現的狀況是？","options":{"A":"過度換氣症候群","B":"大量嘔吐所致","C":"糖尿病合併酮酸中毒","D":"氣喘急性發作"},"answer":"C","manualChapter":"CH51","matchedChapters":["CH15"]},{"id":602,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"以下有關於藥物機轉的敘述，何者為是？","options":{"A":"腎上腺素作用於受體和非選擇性β受體。當作用於β，受體時，會增加心跳速率及增加心臟收縮力，使心臟輸出上昇","B":"Propranolol（Inderal）是一種選擇性β2受體拮抗劑，氣喘病患不適合使用，而心跳過慢的病患則較不會影響","C":"Dobutamine低劑量（1～5μg／kg／min）可活化D1受體，擴張腎臟和腸繫膜血管，增加腎臟灌流。中劑量（5～10μg／kg／min），活化β1，受體，增強心臟收縮力","D":"正腎上腺素作用於α受體和非選擇性β受體，故該藥作用時，氣管平滑肌會收縮"},"answer":"A","manualChapter":"CH16"},{"id":603,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"張力性氣胸病患進行針刺減壓時，為何針要放置在肋骨的上緣？","options":{"A":"預防針刺減壓刺傷希氏束（bundle of His）","B":"預防傷害到肋骨的神經，靜脈及動脈","C":"為了在進針時在胸部上有依靠","D":"為了使肺部可以完全膨脹"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":604,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"57歲男性已抽煙35年，EMTP發覺病人吐氣時總是會噘嘴，請問他噘嘴的原因為何？","options":{"A":"幫助維持氣管和肺泡內的壓力","B":"急速用力呼氣，使肺泡內的空氣吐出","C":"只是顯示病人可以控制呼吸，沒有特別用途","D":"增加病人過度換氣"},"answer":"A","manualChapter":"CH35"},{"id":605,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一歲半的兒童發現單側肺部有哮鳴音，最有可能的原因為何？","options":{"A":"氣喘","B":"異物阻塞支氣管","C":"心臟衰竭","D":"會厭炎"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":606,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"EMTP到達現場，發現病人意識不清，開始呼吸淺慢，以後逐漸加快加深，達高潮後，又逐漸變淺變慢，而後呼吸暫停數秒（約5～30秒）後，再次出現上述狀態的呼吸，如此週而復始的呼吸變化稱為？","options":{"A":"瀕死呼吸（agonal respirations）","B":"陳施氏呼吸（潮氏呼吸）（Cheyne-stokes respirations）","C":"庫斯毛耳氏呼吸（Kussmaul's respirations）","D":"畢歐氏呼吸（Biot's respiration）"},"answer":"B","manualChapter":"呼吸型態(含肺音)"},{"id":607,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"下列何種因素會使病患呼吸更加費力？","options":{"A":"缺乏肺泡表面活性劑（surfactant）","B":"氣道內阻力減少","C":"肺部順應性（compliance）增加","D":"體溫下降"},"answer":"A","manualChapter":"CH35"},{"id":608,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"給藥途徑縮寫［I.H.］指的是？","options":{"A":"皮下注射","B":"舌下含藥","C":"霧氣吸入","D":"氣管內管給藥"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":609,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"細胞內進行有氧呼吸產生三磷酸腺苷（ATP）的場所是？","options":{"A":"核糖體","B":"粒腺體","C":"溶小體","D":"高基氏體"},"answer":"B","manualChapter":"CH12"},{"id":610,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"車禍現場一位背部受到撞擊的傷患表示「肚臍以下都麻痹了!」請問可能受傷的脊神經高度","options":{"A":"頸神經第6節","B":"胸神經第4節","C":"胸神經第10節","D":"腰神經第3節"},"answer":"C","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":612,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"心臟的傳導系統如圖示。請問由傳導系統造成心電圖上變化的敘述，錯誤的是？","options":{"A":"甲出問題，心電圖上會沒有正常的P波","B":"乙出問題，心電圖上的P波的數目會大於QRS波的數目丁","C":"丁出問題，心電圖上將呈現雙峰形的rSR'波","D":"當高位傳導系統失能時，戊將以固有節律每分鐘60下跳動"},"answer":"D","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/612.png"},{"id":613,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"當某樣自主神經系統的藥物作用點是β1＝β2＞α時，它對人會造成的影響，正確的是？","options":{"A":"血管舒張","B":"心跳減緩","C":"氣管收縮","D":"血糖上昇"},"answer":"D","manualChapter":"CH16"},{"id":615,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"評估呼吸的品質要注意「深淺快慢」，所以「每分鐘肺泡通氣量」的算法應該是？","options":{"A":"（病患呼吸速率－無效呼吸速率）╳最大吸氣容積","B":"（最大吸氣容積－無效容積）╳呼吸速率","C":"（病患呼吸速率－正常呼吸速率（12））╳潮氣容積","D":"（潮氣容積－無效腔）╳呼吸速率"},"answer":"D","manualChapter":"CH14"},{"id":616,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"你出勤救護一位呼吸困難的病患。現場家屬表示：「病患有發燒多痰現象及慢性阻塞性肺病（COPD），最近因天氣冷常反覆COPD發作進出醫院。」病患目前血壓120／60 mmHg，心跳每分鐘102下、呼吸淺快每分鐘20下，血氧值SpO2為80%，意識為E3M6V5。請問下列敘述，正確的是？","options":{"A":"此病患維持呼吸剌激的趨力主要是靠血中paC02值","B":"若病患意識不清，應使用高濃度氧氣面罩，持續維持病患到院前血氧值SpO2 100%","C":"若病患意識清楚，應使用一般氧氣面罩、流速開2～3L／min，以減少過度換氣效應","D":"若病患由E3M6V5轉為E2M4V2，應使用袋瓣罩（BVM）裝置進行過度換氣"},"answer":"D","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":617,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"以下有關於交感神經的敘述，何者為非？","options":{"A":"氣管擴張","B":"腸胃道蠕動增加","C":"心跳加快","D":"延遲排尿"},"answer":"B","manualChapter":"CH12"},{"id":618,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"以下有關於人類細胞的敘述，何者為是？","options":{"A":"高基氏體可產生許多ATP，提供能量","B":"細胞核是細胞中唯一有具有DNA的部位","C":"溶小體可以提供細胞做為合成碳水化合物的場所","D":"核醣體負責合成蛋白質"},"answer":"D","manualChapter":"CH12"},{"id":620,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"以下有關氣體交換的敘述，何者為是？","options":{"A":"氧氣主要是溶於血漿內，再由動脈血液帶至週邊血管","B":"二氧化碳主要是溶於血漿內，再由靜脈帶至肺部進行氣體交換","C":"每一個血紅素分子可以攜帶四個分子的氧氣","D":"氧氣比一氧化碳對於血紅素親和力更強"},"answer":"C","manualChapter":"CH12","matchedChapters":["CH12"]},{"id":621,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"高級救護技術員需了解插管的程序，一般我們以來協助記憶。請問以下有關的順序，何者為是？","options":{"A":"準備（preparation）→前置給氧（preoxygenation）→前置給藥（pretreatment）→給藥（paralysis）→插管（placement）→插管後處置（postintubation management）","B":"前置給氧（preoxygenation）→準備（preparation）→前置給藥（pretreatment）→給藥（paralysis）→插管（placement）→插管後處置（postintubation management）","C":"前置給氧（preoxygenation）→準備（preparation）→給藥（paralysis）→前置給藥（pretreatment）→插管（placement）→插管後處置（postintubationmanagement）","D":"前置給氧（preoxygenation）→前置給藥（pretreatment）→準備（preparation）→給藥（paralysis）→插管（placement）→插管後處置（postintubation management）"},"answer":"A","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":622,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"副交感神經受到刺激之後所造成的生理反應，何者為是？","options":{"A":"支氣管收縮","B":"心跳變快","C":"血壓上昇","D":"瞳孔變大"},"answer":"A","manualChapter":"CH16"},{"id":623,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"下圖的敘述，何者為是？","options":{"A":"左側第三對腦神經麻痺","B":"週邊型面神經麻痺","C":"中樞型面神經麻痺","D":"若發生在三小時內，應考慮血栓溶解劑治療"},"answer":"B","manualChapter":"CH36","matchedChapters":["需要圖片"],"image":"題庫圖片/623.png"},{"id":624,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"下圖是一張心電圖，請問最可能是心臟的那個部位出了問題，出了什麼問題？","options":{"A":"心臟的左主冠狀動脈阻塞，併發心肌梗塞","B":"心臟的右冠狀動脈及左旋支阻塞，併發心肌梗塞","C":"心臟的左冠狀動脈，左旋支阻塞，併發心肌梗塞","D":"心臟的左冠狀動脈，左前降支阻塞，併發心肌梗塞"},"answer":"B","manualChapter":"CH33","matchedChapters":["需要圖片"],"image":"題庫圖片/624.png"},{"id":625,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一名病患在山區被蜂螫，發生過敏性休克。您是EMT-P，所屬縣市預立醫可以給瞽上腺（epinephrine）以及給予點滴（normal saline）。請問您會如何處理此一病患，請選擇最適的答案？","options":{"A":"打上16號I.V.，立即給予normal saline 500 ml以及epinephrine 1 mg I.V push","B":"立即給予epinephrine 1 mg舌下含","C":"打上16號I.V.，立即給予normal saline 500 ml以及epinephrine 0.3 mg I.M.","D":"立即給予epinephrine 0.3 mg I.V. push"},"answer":"C","manualChapter":"CH40","matchedChapters":["CH40"]},{"id":626,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"一名50歲病患在慢跑時發生心臟猝死，您是EMT-P，所屬縣市預立醫囑可以給腎上腺素（epinephrine），給予點滴（normal saline），骨針以及插管。您在為這位病患打點滴，無法打上，請問epinephrine該如何給予是最有效的？","options":{"A":"Epinephrine 1：1,000，10倍的劑量經稀釋後從氣管內容給予","B":"Epinephrine 1：1,000，2～3倍的劑量經稀釋後從氣管內容給予","C":"Epinephrme 1：1,000，從肛門給予","D":"立即操作骨針，epinephrine 1：1,000，1 mg經由骨針給予"},"answer":"D","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":627,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"呼吸衰竭病患，長期需要插管及呼吸器維持呼吸，醫師會建議做氣切。請問氣切是切在呼吸道的那個部位？","options":{"A":"支氣管","B":"聲帶以上的氣管","C":"聲帶以下的氣管","D":"細支氣管"},"answer":"C","manualChapter":"CH51","matchedChapters":["CH51"]},{"id":628,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"給藥途徑縮寫［P.O.］指的是？","options":{"A":"皮下注射","B":"舌下含藥","C":"霧氣吸入","D":"口服給藥"},"answer":"D","manualChapter":"CH16"},{"id":629,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"相同成份劑量的藥物，口服有時效果不如靜脈注射，最大的原因是？","options":{"A":"儲存效應（drug reservoirs）","B":"屏障效應（barriers to drug distribution）","C":"首渡效應（first-pass metabolism）","D":"拮抗效應（antagonism）"},"answer":"C","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":630,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"EMTP若要使用肌肉注射，最佳的位置是？","options":{"A":"肩三角肌","B":"肱三頭肌","C":"肩斜方肌","D":"肱二頭肌"},"answer":"A","manualChapter":"CH16","matchedChapters":["CH16"]},{"id":631,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"將紅血球置入甲乙丙三種溶液中的結果如圖示，請問下列敘述完成正確的是？","options":{"A":"甲是0.45%食鹽水，乙是5%葡萄糖水，丙是3%食鹽水","B":"甲是10%葡萄糖水，乙是0.9%食鹽水，丙是0.9%食鹽水","C":"甲是5%葡萄糖水，乙是10%葡萄糖水，丙是0.9%食鹽水","D":"甲是10%葡萄糖水，乙是5%葡萄糖水，丙是0.45%食鹽水"},"answer":"A","manualChapter":"CH12","image":"題庫圖片/631.png"},{"id":632,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"呼吸道異物阻塞，最常見卡在何處？","options":{"A":"喉部或聲帶","B":"右側主支氣管","C":"左側主支氣管","D":"氣管"},"answer":"B","manualChapter":"CH35","matchedChapters":["CH35"]},{"id":633,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"兒童的呼吸道解剖構造和成人有許多不同之處，關於兒童呼吸道的描述何者為非？","options":{"A":"較為脆弱容易受傷","B":"兒童的上呼吸道較狹窄，舌頭相對較大","C":"喉部相對於舌根的位置較為往後往下","D":"環狀軟骨是兒童呼吸道最狹窄的部位"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":634,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"有關潮氣末二氧化碳偵測器（end-tidal CO2，ETCO2）的描述，何者為非？","options":{"A":"用來偵測呼出氣體中的二氧化碳濃度","B":"可用來判斷氣管內管是否正確置於氣管內，或是在食道","C":"可作為急救是否有效的重要指標","D":"氣管內管插入食道，二氧化碳濃度應為零"},"answer":"D","manualChapter":"CH14","matchedChapters":["CH14"]},{"id":635,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"有關「喉罩呼吸道（LMA）」的描述，何者為非？","options":{"A":"在侷限空間及外傷頸椎固定的考量下，喉罩呼吸道有其獨到的優點","B":"無法使用潮氣末二氧化碳偵測器來偵測位置是否正確","C":"不適用於意識清醒或尚有嘔吐反射的病患","D":"可用來協助氣管內管的置放"},"answer":"B","manualChapter":"CH15"},{"id":636,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"有關自律神經系統的功能，以下敘述何者為非？","options":{"A":"交感神經作用會造成瞳孔擴大，副交感神經則造成瞳孔縮小","B":"交感神經作用會造成心跳加速氣管擴張，副交感神經則造成心跳變慢氣管收縮","C":"交感神經作用會造成腸蠕動增加，副交感神經則造成腸蠕動減少","D":"交感神經作用會停止唾液分泌，副交感神經則會分泌唾液"},"answer":"C","manualChapter":"CH12"},{"id":637,"source":"第二章 基礎醫學與呼吸處置(2012-2014)#98560.doc","question":"有關急救藥物腎上腺素（epinephrine）的敘述，下列何者為是？","options":{"A":"會增加心臟收縮力以及心搏速率，但不會提高心臟的耗氧量","B":"可以收縮小動脈以及皮膚黏膜的血管，造成收縮壓上升，但無法增加冠狀動脈之血液灌流","C":"可以使支氣管平滑肌鬆弛，支氣管擴張，但無法治療嚴重過
