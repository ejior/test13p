,"matchedChapters":["CH60"]},{"question":"在《EMS agenda 2050》提出的「安全與有效」指導原則中，為了建立安全的系統文化，下列哪一項做法最符合其核心願景？","options":{"A":"全面取消救護車的閃燈與鳴笛以降低交通意外發生率","B":"要求救護人員在抵達現場後才開始收集環境安全資訊以避免預判偏差","C":"僅針對造成實質病人傷害的嚴重醫療疏失進行懲處","D":"建立匿名通報機制以紀錄並分析「跡近錯誤」"},"answer":"D","source":"圖片匯入","manualChapter":"CH01","id":3567,"matchedChapters":["CH01"]},{"question":"世界衛生組織緊急醫療照護系統架構中，何者不屬於「照護現場」範圍？","options":{"A":"巡迴","B":"旁觀者應變","C":"救護人員應變","D":"病人轉送"},"answer":"D","source":"圖片匯入","manualChapter":"CH01","id":3568,"matchedChapters":["CH01"]},{"question":"下列何者為「額葉」掌管的功能？","options":{"A":"聽覺、認知、情緒、記憶","B":"視覺空間處理","C":"情緒、認知、注意力、問題解決、推理能力、行為策劃","D":"感覺與運動行為、訊息整合、空間知覺"},"answer":"C","source":"圖片匯入","manualChapter":"CH06","id":3569,"matchedChapters":["CH06"]},{"question":"孕婦外傷中，哪一種指標可以用來作為判斷母體早期休克的良好參考？","options":{"A":"母體的血壓","B":"母體的體溫","C":"胎兒的心率","D":"母體的尿量"},"answer":"C","source":"圖片匯入","manualChapter":"CH32","id":3570,"matchedChapters":["CH32"]},{"question":"請問胸壁上的孔洞直徑大於氣管直徑多少會造成開放性氣胸？","options":{"A":"1/2","B":"1/4","C":"1/3","D":"1/5"},"answer":"A","source":"圖片匯入","manualChapter":"CH26","id":3571,"matchedChapters":["CH26"]},{"question":"關於中央脊髓症候群 (Central Cord Syndrome) 的敘述，下列何者正確？","options":{"A":"會導致完全的運動喪失，但保留所有感覺功能","B":"預後非常良好，通常在 24 小時內完全恢復","C":"症狀表現為下肢癱瘓比上肢嚴重","D":"常見於已有頸椎狹窄的老年人發生過度伸展傷害"},"answer":"D","source":"圖片匯入","manualChapter":"CH27","id":3572,"matchedChapters":["CH27"]},{"question":"關於第二型糖尿病 (Type 2 Diabetes Mellitus) 的敘述，下列何者正確？","options":{"A":"主要是因胰島β細胞完全無法分泌胰島素所造成","B":"約占所有確診糖尿病病例的 90～95%，且多與胰島素阻抗有關","C":"僅發生於40歲以上成年人，兒童不會罹患","D":"所有患者皆需終身注射胰島素治療"},"answer":"B","source":"圖片匯入","manualChapter":"CH37","id":3573,"matchedChapters":["CH37"]},{"question":"據現行診斷 ST 節段上升型心肌梗塞 (STEMI) 的心電圖標準，年齡與性別會影響特定導程的判讀閾值。一名 35 歲男性因突發性劇烈胸痛被送至急診，其十二導程心電圖顯示 V2 及 V3 導程的 J 點 (J-point) 有明顯上升。若要符合 STEMI 的診斷標準，此病患在 V2 及 V3 導程的 ST 節段(J 點)上升幅度至少需達到多少？","options":{"A":"> 0.1 mV (1 mm)","B":"> 0.15 mV (1.5 mm)","C":"> 0.2 mV (2 mm)","D":"≥ 0.25 mV (2.5 mm)"},"answer":"D","source":"圖片匯入","manualChapter":"CH34","id":3574,"matchedChapters":["CH34"]},{"question":"下列何者非凝血機制內在途徑？","options":{"A":"凝血因子12","B":"凝血因子7","C":"凝血因子11","D":"凝血因子9"},"answer":"B","source":"圖片匯入","manualChapter":"CH39","id":3575,"matchedChapters":["CH39"]},{"question":"有關口罩分類的規範，下列敘述何者正確？","options":{"A":"歐盟規格的 FFP2 等級口罩約等同於美國的 N95 口罩。","B":"醫療用拋棄式口罩的使用時間通常不建議超過 24 小時。","C":"N95 口罩代表其具備高度抗油污性。","D":"1/4 罩式面罩必須能涵蓋到口、鼻及下頷顎。"},"answer":"A","source":"圖片匯入","manualChapter":"CH42","id":3576,"matchedChapters":["CH42"]},{"question":"何者非左心衰竭臨床表現？","options":{"A":"陣發性夜間呼吸困難","B":"頸靜脈怒張","C":"心包膜炎","D":"心律不整"},"answer":"C","source":"圖片匯入","manualChapter":"CH34","id":3577,"matchedChapters":["CH34"]},{"question":"下列關於急性腦中風敘述何者錯誤？","options":{"A":"出血性腦中風發生率大約占所有腦中風病人的15%，可分為腦內出血(ICH)和蜘蛛網膜下腔出血(SAH)","B":"缺血性腦中風發生率約占所有腦中風病人的85%","C":"缺血性腦中風有兩種,一為腦血管(動脈)發生硬化狹窄而產生血栓。另一原因為栓子(如血塊、硬化塊、細菌贅生物、脂肪、氣泡等)堵塞","D":"暫時性腦缺血發作(TIA)，每次發作的時間從數秒鐘至12小時，不超過24小時。約有20%的病人於一個月內變成腦中風"},"answer":"D","source":"圖片匯入","manualChapter":"CH36","id":3578,"matchedChapters":["CH36"]},{"question":"呼吸道疾病可分為通氣、擴散、灌流三大類，請問以下配對哪一個錯誤？","options":{"A":"灌流-肺栓塞","B":"通氣-肺水腫","C":"擴散-一氧化碳中毒","D":"通氣-會厭炎"},"answer":"B","source":"圖片匯入","manualChapter":"CH35","id":3579,"matchedChapters":["CH35"]},{"question":"在到院前詢問腫瘤病人病史時，下列哪項資訊最能協助判斷是否為化療併發症？","options":{"A":"病人最初被診斷出癌症的年份","B":"病人罹癌前的生活習慣","C":"最後一次接受化療的時間","D":"腫瘤發生的原始部位"},"answer":"C","source":"圖片匯入","manualChapter":"CH39","id":3580,"matchedChapters":["CH39"]},{"question":"泌尿道感染 (Urinary Tract Infection, UTI)的定義是細菌在泌尿道滋生而產生感染的症狀，大多是逆行性感染。下列何者為非？","options":{"A":"尿道炎","B":"膀胱炎","C":"腎絲球腎炎","D":"腎盂腎炎"},"answer":"C","source":"圖片匯入","manualChapter":"CH41","id":3581,"matchedChapters":["CH41"]},{"question":"愛滋病(AIDS) 主要攻擊人體免疫系統中的哪一種細胞，導致病人容易出現伺機性感染？","options":{"A":"B 淋巴球","B":"CD4 淋巴球","C":"白血球","D":"血小板"},"answer":"B","source":"圖片匯入","manualChapter":"CH42","id":3582,"matchedChapters":["CH42"]},{"question":"根據 2025 年版指導原則，缺血性腦中風病人在到達急診室後，應在幾分鐘內完成電腦斷層 (CT) 掃描？","options":{"A":"10分鐘","B":"60分鐘","C":"45分鐘","D":"25分鐘"},"answer":"D","source":"圖片匯入","manualChapter":"CH11","id":3583,"matchedChapters":["CH11"]},{"question":"關於「體內物質隔離措施 (BSI)」的原則，下列敘述何者正確？","options":{"A":"只針對愛滋病病人","B":"將所有病人的體液、分泌物均列為感染源","C":"只有在看到血液時才穿戴防護裝備","D":"接觸病人的汗液不需要任何防護"},"answer":"B","source":"圖片匯入","manualChapter":"CH42","id":3584,"matchedChapters":["CH42"]},{"question":"有關自體免疫系統疾病敘述，何者正確？","options":{"A":"系統性紅斑性狼瘡，台灣全民健保資料庫顯示盛行率約每10 萬人中有8人，男女發病比約7.3:1","B":"類風濕性關節炎 (Rheumatoid arthritis , RA)是一種以關節病變為主的自體免疫系統疾病，全球盛行率約1%、好發年齡為35～50 歲，女性罹病率較高","C":"修格蘭氏症候群可分為原發性(primary)及繼發性(secondary)，繼發性最常見合併系統性紅斑性狼瘡及類風濕性關節炎，好發於40～50 男性(男：女約4-5:1)","D":"僵直性脊椎炎(Ankylosing spondylitis)是中軸骨的慢性發炎疾病，屬於血清陰性脊椎病變(seronegative spondyloarthropathy , SpA)的一種，在台灣人口一般盛行率可達2%。目前認為與遺傳強烈相關，但實際機轉不明，男女罹病比約1:3"},"answer":"B","source":"圖片匯入","manualChapter":"CH40","id":3585,"matchedChapters":["CH40"]},{"question":"關於「肺順應性（Compliance）」與呼吸做功的敘述，下列何者最為正確？","options":{"A":"肺順應性愈好代表肺部質地愈硬，吸氣時越需要動用輔助呼吸肌才能擴張胸腔。","B":"正常人在安靜平靜呼吸時，呼吸所消耗的能量約占全身總能量消耗的 30% 左右。","C":"當病患缺乏肺泡表面活性劑（Surfactant）或發生肺水腫時，會導致肺順應性下降，使呼吸耗能大幅增加。","D":"氣喘與肺氣腫發作時，只會增加呼吸道阻力，對肺部的順應性與吸氣做功完全沒有影響。"},"answer":"C","source":"AI出題","manualChapter":"CH14","matchedChapters":["CH14"],"id":3586},{"question":"評估一名急性呼吸困難病患，發現病患顯得相當倦怠、額頭冒汗，且已動用「輔助呼吸肌（Accessory muscles）」。請問下列何者不屬於常見的輔助吸氣或輔助呼氣肌群？","options":{"A":"頸部的胸鎖乳突肌（Sternocleidomastoid）與斜角肌（Scalenes）","B":"腹部的腹直肌（Rectus abdominis）與腹斜肌（Obliques）","C":"橫膈膜（Diaphragm）與外肋間肌（External intercostals）","D":"背部的斜方肌（Trapezius）與背闊肌（Latissimus dorsi）"},"answer":"C","source":"AI出題","manualChapter":"CH14","matchedChapters":["CH14"],"id":3587},{"question":"一名 11 歲男童體重約 37 公斤，雙下肢發生二度灼傷。依據「十的法則 (Rule of TENS) 」，其初始輸注速率應如何決定？","options":{"A":"以 20×3=60 mL/hr 作為第一小時給予量","B":"應改用帕克蘭公式或修正後布魯克公式計算","C":"輸注速率為灼傷面積 14%×10=140 mL/hr","D":"以 20×10=200 mL/hr 進行初始輸注"},"answer":"B","source":"圖片匯入","manualChapter":"CH31","id":3588,"matchedChapters":["CH31"]},{"question":"下列何者為良好的外傷照護體系（外傷登錄、品質管理、研究）：A對的病人、B對的時間、C對的醫院、D好的預後。","options":{"A":"AB","B":"ABC","C":"ACD","D":"ABCD"},"answer":"D","source":"圖片匯入","manualChapter":"CH25","id":3589,"matchedChapters":["CH25"]},{"question":"「腔室症候群」與「壓砸傷症候群」的主要區別在於？","options":{"A":"腔室症候群是指局部腔室壓力上升導致缺血；壓砸傷症候群則是全身性系統問題","B":"兩者完全相同，只是名稱不同","C":"腔室症候群只發生在頭部","D":"只有壓砸傷症候群會痛"},"answer":"A","source":"圖片匯入","manualChapter":"CH30","id":3590,"matchedChapters":["CH30"]},{"question":"血液透析病人常見急症中，關於「不平衡症候群」的敘述何者正確？","options":{"A":"只會發生在剛結束血液透析 24 小時後的病人","B":"其臨床症狀主要表現為下肢麻木與肌肉萎縮","C":"成因是水分及滲透壓快速的變化，造成腦部內細胞水腫、顱內壓上升","D":"長期洗腎多年的病患發生的機率最高"},"answer":"C","source":"圖片匯入","manualChapter":"CH41","id":3591,"matchedChapters":["CH41"]},{"question":"一位收縮性心衰竭病人，出現心房顫動併快速心室反應(atrial fibrillation with rapid ventricular Tesponse) 心電圖顯示矯正後的QTc > 500 milliseconds 為避免心衰竭惡化也避免 QTc進一步延長，可考慮何種藥物治療？","options":{"A":"Adenosine","B":"Amiodarone","C":"Diltiazem","D":"Digoxin"},"answer":"D","source":"圖片匯入","manualChapter":"CH07","id":3592,"matchedChapters":["CH07"]},{"question":"關於頸動脈竇按摩，下列敘述何者正確？","options":{"A":"適用於穩定的規則寬QRS波頻脈。","B":"對於中止上心室頻脈，既安全又少副作用。","C":"正確的頸動脈竇按摩，應按摩右側頸動脈竇，每次按摩不應超過10秒。","D":"如果有adenosine,建議按摩後再給藥，避免藥物副作用。"},"answer":"C","source":"圖片匯入","manualChapter":"CH34","id":3593,"matchedChapters":["CH34"]},{"question":"持續性的鈍痛，好像戴著一頂過緊的帽子或頭箍，常常和持續的壓力或緊繃的頭頸部肌肉有關，大部分會自己改善，為哪一種原發性頭痛？","options":{"A":"張力性頭痛","B":"偏頭痛","C":"叢聚性頭痛","D":"心理性頭痛"},"answer":"A","source":"圖片匯入","manualChapter":"CH36","id":3594,"matchedChapters":["CH36"]},{"question":"一位 55 歲男性因突發性胸口「撕裂般」劇痛呼叫救護車，理學檢查發現雙手收縮壓差達 25 mmHg 且左手橈動脈搏動較弱。關於此病患的到院前處置，下列敘述何者最適當？","options":{"A":"應立即採取平躺姿勢並抬高下肢，以確保腦部灌流並預防休克發生。","B":"若病患感到焦慮，可常規給予高流量氧氣 (15 L/min) 以提升心肌含氧量。","C":"應維持病患於舒適姿勢，並監測心電圖及血氧，若無低血壓可給予舌下 NTG。","D":"為了預防血栓擴大，應立即協助病患服用高劑量阿斯匹靈 325 mg。"},"answer":"C","source":"圖片匯入","manualChapter":"CH34","id":3595,"matchedChapters":["CH34"]},{"question":"一名病患主訴「上腹部」疼痛，且疼痛感輻射至「左肩膀與左手」。作為 EMTP，您必須高度懷疑下列哪一種情況？","options":{"A":"膽囊炎","B":"輸尿管結石","C":"心肌梗塞或缺血","D":"盲腸炎"},"answer":"C","source":"圖片匯入","manualChapter":"CH38","id":3596,"matchedChapters":["CH38"],"explanation":"p1013"},{"question":"下列關於內分泌與代謝急症之敘述何者錯誤？","options":{"A":"異化作用是可對大分子進行分解，同化作用則是利用能量合成細胞中各分子。","B":"胰島細胞分別製造分泌為:α胰島素、β升糖素、δ荷爾蒙生長段素。","C":"糖尿病長期合併失明、周邊神經病變、自主神經病變及周邊血管疾病。","D":"尿崩症也稱水糖尿病，分別中樞性及腎性，常見原因是缺乏血管加壓素。"},"answer":"B","source":"圖片匯入","manualChapter":"CH37","id":3597,"matchedChapters":["CH37"]},{"question":"119接獲通報，72歲男性，有糖尿病史，EMT到現場發現有Kussmaul呼吸、噁心、嘔吐、全身無力症狀，血糖機顯示HIGH。現場EMT2警消高度懷疑DKA，但EMTP義消卻建議要求做EKG。EMT2警消當場不耐煩表示，就明顯是DKA，又沒有胸痛，做什麼心電圖啊？浪費時間，不僅不要裝懂，造成現場一度尷尬。請問下列何者非誘發DKA常見原因？？","options":{"A":"嚴重肺部感染","B":"急性腦中風","C":"急性心肌梗塞","D":"忘記服用Propranolol"},"answer":"D","source":"圖片匯入","manualChapter":"CH37","id":3598,"matchedChapters":["CH37"]},{"question":"急性肺水腫無合併低血壓及休克的第一線治療，下列何者最不適當？","options":{"A":"Lasix：劑量為0.5~1.0mg/kg快速靜脈注射。","B":"NTG：可於間隔5~10分鐘內給予一顆0.4毫克的舌下含片。","C":"Morphine：劑量為2~4mg/每5分鐘。","D":"氧氣的使用以40% FiO2開始，根據需求可以調至100%的非再吸入型面罩。"},"answer":"B","source":"圖片匯入","manualChapter":"CH34","id":3599,"matchedChapters":["CH34"]},{"question":"在台灣，哪種毒蛇咬傷的發生率最高，且傷口常表現為一路往軀幹延伸的腫脹？","options":{"A":"雨傘節","B":"百步蛇","C":"鎖鏈蛇","D":"赤尾鮐"},"answer":"D","source":"圖片匯入","manualChapter":"CH50","id":3600,"matchedChapters":["CH50"]},{"question":"一名登山民眾遭蛇咬傷，現場描述該蛇頭呈三角形，身體較粗。咬傷後局部快速出現腫脹、疼痛、出血及皮下瘀血，送醫後發現凝血功能異常，到院後疑似出現肢體麻痺或覺異常等神經症狀。依據症狀判斷，最可能為下列何種毒蛇咬傷？","options":{"A":"飯匙倩（眼鏡蛇）","B":"雨傘節","C":"鎖鏈蛇","D":"赤尾青竹絲"},"answer":"C","source":"圖片匯入","manualChapter":"CH50","id":3601,"matchedChapters":["CH50"]},{"question":"有關增加熱產生的代償機轉，下列何者為是？","options":{"A":"發抖","B":"周邊血管收縮","C":"減少散熱表面積","D":"豎立汗毛"},"answer":"A","source":"圖片匯入","manualChapter":"CH44","id":3602,"matchedChapters":["CH44"]},{"question":"關於新生兒正壓通氣的效能評估，若前 15 秒通氣後心跳無上升且胸部無起伏，下一步應為何？","options":{"A":"增加氧氣濃度至 100%","B":"執行通氣校正步驟","C":"直接進行氣管內插管","D":"立即開始胸部按壓"},"answer":"B","source":"圖片匯入","manualChapter":"CH48","id":3603,"matchedChapters":["CH48"]},{"question":"危機處置是在病人急性混亂期間，需主動採取的短暫動作。其處置目標為：穩定情勢或病人情緒、動員現場人力資源、使病人情緒緒恢復正常。下列步驟何者為是？","options":{"A":"第一步建立心理接觸 第二步是藉由詢問以瞭解目前情勢和發現過去病史以探索問題 第三步是分析此次狀況可能的解決辦法 第四步採取具體行動 第五步為個案追蹤並確認所選方案有成果","B":"第一步是藉由詢問以瞭解目前情勢和發現過去病史以探索問題 第二步建立心理接觸 第三步是分析此次狀況可能的解決辦法 第四步採取具體行動 第五步為個案追蹤並確認所選方案有成果","C":"第一步是分析此次狀況可能的解決辦法 第二步建立心理接觸 第三步藉由詢問以瞭解目前情勢和發現過去病史以探索問題 第四步採取具體行動 第五步為個案追蹤並確認所選方案有成果","D":"第一步是藉由詢問以瞭解目前情勢和發現過去病史以探索問題 第二步是分析此次狀況可能的解決辦法 第三步建立心理接觸 第四步採取具體行動 第五步為個案追蹤並確認所選方案有成果"},"answer":"A","source":"圖片匯入","manualChapter":"CH46","id":3604,"matchedChapters":["CH46"]},{"question":"有關約束病人的適應症下列何者最不適當？","options":{"A":"防止病人傷害自己","B":"防止病人傷害現場其他人員(家屬、警察、救護技術員、社福人員……等等)","C":"防止病人對現場所有人造成心理創傷","D":"防止對環境的嚴重干擾或破壞"},"answer":"C","source":"圖片匯入","manualChapter":"CH46","id":3605,"matchedChapters":["CH46"]},{"question":"先兆性流產或自然流產多發於懷孕前20週，其中最常見的發生時段為何？","options":{"A":"第1~4週","B":"第18~20週","C":"第6~12週","D":"第14~18週"},"answer":"C","source":"圖片匯入","manualChapter":"CH49","id":3606,"matchedChapters":["CH49"]},{"question":"乙二醇中毒的臨床徵候通常分為三階段，其中第三階段主要影響哪一個系統？","options":{"A":"造血系統，出現溶血性貧血","B":"中樞神經系統，出現運動失調與昏迷","C":"腎臟系統，出現結晶尿與急性腎衰竭","D":"心肺系統，出現肺水腫與心臟衰竭"},"answer":"C","source":"圖片匯入","manualChapter":"CH50","id":3607,"matchedChapters":["CH50"]},{"question":"急產的臨床核心特性（辨識警訊）：下列何者正確？","options":{"A":"正常柔和的子宮收縮","B":"產婦對痛有較高知覺","C":"很高的產道阻力","D":"發生率約為2%"},"answer":"D","source":"圖片匯入","manualChapter":"CH49","id":3608,"matchedChapters":["CH49"]},{"question":"有關懷孕婦女在第三個孕期（第 7 到 9 個月）的生理變化，下列敘述何者最適當？","options":{"A":"心跳速率維持穩定，不隨懷孕週數增加而改變","B":"血壓在第二期下降後，末期會回升至正常血壓","C":"呼吸深度不變，但每分鐘換氣量會因代償而下降","D":"心輸出量與總血量的可增加 10% 至 15%"},"answer":"B","source":"圖片匯入","manualChapter":"CH49","id":3609,"matchedChapters":["CH49"]},{"question":"關於腸胃道除汙(gastrointestinal decontamination)，下列敘述何者錯誤？","options":{"A":"病人在食入毒物後1小時內就接受處置，腸胃道除污是有用的。1小時以後，食入的毒物就會由胃中進入小腸，然後在小腸被吸收，這時候中毒病人需要的主要支持性治療","B":"洗胃 (gastric lavage)是腸胃道除污的一種方式，洗胃可以提供一個讓我們立刻知道一部分胃內容物的方法，當食入的是具有強烈毒性，如鈣離子通道阻斷劑或三環抗憂鬱劑(TCA)，並且食入的時間在3小時內的，洗胃這種方式在急診室還是有其效果的。","C":"洗胃的禁忌症：病人意識不清而且呼吸道無法保護，食入的毒素是低黏度的碳氫化合物(例如：汽油、煤油、家具亮光劑或無機醇)或腐蝕性的物質","D":"全腸灌洗(whole-bowel irrigation)是另一種在醫院內使用的腸胃道除污的醫療方式，他的方法是利用快速灌入大量的平衡式溶液來沖洗腸胃道，溶液的注入可以經由口服的方式或是經由鼻胃管"},"answer":"B","source":"圖片匯入","manualChapter":"CH50","id":3610,"matchedChapters":["CH50"]},{"question":"在台灣的區域毒物中心設置中，北部地區是由哪家醫院負責 24 小時諮詢業務？","options":{"A":"台北榮民總醫院","B":"輔大醫院","C":"林口長庚醫院","D":"台大醫院"},"answer":"A","source":"圖片匯入","manualChapter":"CH50","id":3611,"matchedChapters":["CH50"]},{"question":"足月懷孕婦女在平躺時容易發生低血壓的情況，其主要生理機制為何？","options":{"A":"橫膈膜上提壓迫胸腔導致回心血減少","B":"懷孕末期血管過度擴張導致相對性低血壓","C":"子宮壓迫下腔靜脈造成回心血量下降","D":"增大的子宮壓迫腹主動脈導致心輸出量減少"},"answer":"C","source":"圖片匯入","manualChapter":"CH49","id":3612,"matchedChapters":["CH49"]},{"source":"EMT-P 第 16 章 P.401","question":"當某藥物活化了 α 受體時，最可能出現下列哪種生理反應？","options":{"A":"支氣管平滑肌舒張，增加換氣量。","B":"腸胃道蠕動增加以促進消化。","C":"心跳減慢且心肌收縮力減弱。","D":"周邊小動脈收縮，導致血壓上升。"},"answer":"D","matchedChapters":["CH16"],"manualChapter":"CH16","id":3613},{"source":"EMT-P 第 12 章 P.264","question":"有關周邊神經系統的敘述何者最為正確？","options":{"A":"12對腦神經的功能是控制頭部各器官與感覺(眼、耳、鼻、舌、面)","B":"脊神經的頸神經支配頸、肩和上肢，胸神經支配軀幹，腰神經支配下肢及骨盆腔","C":"交感神經的節前、節後的傳導物質都是為乙醯膽鹼","D":"副交感神經節前傳遞主要為乙醯膽鹼為主、傳給反應器以正腎上腺素為主"},"answer":"B","matchedChapters":["CH12"],"manualChapter":"CH12","id":3614},{"source":"EMT-P 第 20 章 P.513","question":"使用聽診器時，下列何者正確？","options":{"A":"可隔著厚衣服聽診，以保護病人隱私。","B":"鼓面應用力壓住皮膚。","C":"膜面需緊貼皮膚，以收集高頻音。","D":"現場環境吵雜時應放棄聽診。"},"answer":"C","matchedChapters":["CH20"],"manualChapter":"CH20","id":3615},{"source":"EMT-P 第 12 章 P.275","question":"關於此代償機制中的神經與激素調控，下列敘述何者最適當？","options":{"A":"副交感神經會釋放乙醯膽鹼，刺激心臟加速跳動以維持心輸出量","B":"大腦皮質會直接發送運動指令，促使周邊微血管平滑肌主動舒張","C":"腎上腺髓質會分泌正腎上腺素與腎上腺素，促使周邊小動脈收縮","D":"胰島會大量分泌胰島素，引導血糖進入細胞以轉化為血管內水分"},"answer":"C","matchedChapters":["CH12"],"manualChapter":"CH12","id":3616},{"source":"EMT-P 第 12 章 P.261","question":"視覺投射路徑的敘述，何者正確。","options":{"A":"對側鼻部影像及同側顳部影像投射於同側枕部大腦皮質","B":"同側鼻部影像及對側顳部影像投射於對側枕部大腦皮質","C":"同側鼻部影像及對側顳部影像投射於同側枕部大腦皮質","D":"同側鼻部影像及同側顳部影像投射於對側枕部大腦皮質"},"answer":"C","matchedChapters":["CH12"],"manualChapter":"CH12","id":3617},{"source":"EMT-P 第 16 章 P.401","question":"一名患者因重症肌無力 (Myasthenia gravis) 接受乙醯膽鹼酯酶抑制劑治療。若藥物過量，最可能出現下列哪一種症狀？","options":{"A":"心跳加快、瞳孔放大、口乾","B":"支氣管擴張、血壓上升","C":"心跳減慢、流口水、支氣管分泌增加","D":"腸胃蠕動減少、尿瀦留"},"answer":"C","matchedChapters":["CH16"],"manualChapter":"CH16","id":3618},{"source":"EMT-P 第 19 章 P.491","question":"器官對應之體表轉移痛配對，下列何者不正確？","options":{"A":"心臟，後背痛","B":"肝臟，肩膀痛","C":"心臟，肩膀痛","D":"以上皆正確"},"answer":"D","matchedChapters":["CH19"],"manualChapter":"CH19","id":3619},{"source":"EMT-P 第 16 章 P.388","question":"重複使用同一藥物後，需要增加劑量才能維持原有效果，此現象稱為何者？","options":{"A":"過敏反應","B":"適應性(Tolerance)","C":"禁忌症","D":"累積效應"},"answer":"B","matchedChapters":["CH16"],"manualChapter":"CH16","id":3620},{"source":"EMT-P 第 46 章 P.1214","question":"在處理精神危機時，救護員建議與病人交談時保持的最佳社交距離是多少公尺？","options":{"A":"0.5~1.0公尺","B":"至少5公尺以上","C":"1.2~3.6公尺","D":"4.0~6.0公尺"},"answer":"C","matchedChapters":["CH46"],"manualChapter":"CH46","id":3621},{"source":"EMT-P 第 50 章 P.1337","question":"發現典型的標靶狀的外觀(bull's eye appearance) ，請推斷病人發生什麼事。","options":{"A":"褐色隱蛛咬傷","B":"黑寡婦蜘蛛咬傷","C":"雨傘節咬傷","D":"龜殼花咬傷"},"answer":"A","matchedChapters":["CH50"],"manualChapter":"CH50","id":3622},{"source":"EMT-P 第 51 章 P.1400","question":"在判讀胸部 X 光時，為何 PA view (後前照) 通常優於 AP view (前後照) ?","options":{"A":"PA view 中，心臟緊貼底板，能減少心臟投影放大，呈現更真實的大小。","B":"AP view 輻射劑量較高，對病人的傷害較大。","C":"PA view 能讓胃部氣泡呈現黑色，方便診斷腹腔積氣。","D":"PA view 的解析度較高，能看清楚微小的肋骨裂痕。"},"answer":"A","matchedChapters":["CH51"],"manualChapter":"CH51","id":3623},{"source":"EMT-P 第 50 章 P.1339","question":"一名農夫整理果園時右手遭毒蛇咬傷。10分鐘後傷口疼痛腫脹。救護人員抵達現場，下列處置何者最適當？","options":{"A":"使用止血帶完全阻斷血流，避免毒液擴散","B":"切開傷口並吸出蛇毒","C":"保持患者安靜，固定患肢並儘速送醫","D":"使用冰敷降低毒素活性"},"answer":"C","matchedChapters":["CH50"],"manualChapter":"CH50","id":3624},{"source":"EMT-P 第 50 章 P.1344","question":"有機磷 (organophosphate) 中毒的臨床症狀可以使用 SLUDGE 口訣來記憶，其中字母「E」代表什麼？","options":{"A":"水腫(Edema)","B":"眼睛發紅(Erythema of eyes)","C":"癲癇(Epilepsy/seizure)","D":"嘔吐(Emesis)"},"answer":"D","matchedChapters":["CH50"],"manualChapter":"CH50","id":3625},{"source":"APLS 第 14 章 P.93","question":"一位 10 歲病童因車禍造成嚴重出血性休克 (Hemorrhagic shock) 。已給予總計 60 mL/kg 等張晶體液，但病童血壓依然偏低，心跳持續加快，且血紅素持續下降。此時最優先的血液動力學處置為何？","options":{"A":"繼續給予晶質溶液，總量可達80 mL/kg","B":"給予等張晶質溶液合併高張食鹽水","C":"使用升壓劑 (如Dopamine)以維持血壓","D":"輸注濃厚紅血球 (PRBCs) 10-20ml/kg"},"answer":"D","matchedChapters":["APLS"],"manualChapter":"CH48","id":3626},{"source":"EMT-P 第 48 章 P.1288","question":"依據「TEN-4 瘀傷準則」，下列哪位兒童須高度懷疑兒虐？","options":{"A":"4個月大的嬰兒手肘瘀青","B":"3歲的小兒前額頭瘀傷","C":"1歲小兒小腿前側有瘀傷","D":"4歲的小兒膝蓋及手掌根有瘀青"},"answer":"A","matchedChapters":["CH48"],"manualChapter":"CH48","id":3627},{"source":"EMT-P 第 51 章 P.1400 - 1401","question":"關於電腦斷層 (CT) 之敘述，下列何者正確？","options":{"A":"不可將金屬製品帶入檢查室。","B":"主要用於拍攝肌腱、韌帶、脊髓或椎間盤之影像。","C":"因不需使用顯影劑，為腎功能不佳之患者較常使用之檢查法。","D":"若是重症肌無力或懷孕及哺乳嬰兒之病人，需與醫師討論是否可施打顯影劑。"},"answer":"D","matchedChapters":["CH51"],"manualChapter":"CH51","id":3628},{"source":"EMT-P 第 44 章 P.1155","question":"凍傷對身體產生的最主要傷害性影響為何？","options":{"A":"神經傳導過速","B":"組織缺血","C":"脂肪栓塞","D":"血管過度擴張"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"],"id":3629},{"source":"EMT-P 第 46 章 P.1219","question":"關於化學鎮靜藥物Haloperidol的敘述何者最正確？","options":{"A":"通常給予3劑(2.5mg~7.5mg)，每隔30~60分鐘重複給予，藥物半衰期為10~19小時","B":"椎體外症候群EPS是使用Haldol的潛在副作用，治療副作用時應避免使用BZD類藥物","C":"許多研究指出 Haloperidol治療甲基安非他命中毒的病人是有害的，因為這類病人常在約束過程中發生橫紋肌溶解、心肌缺血及心律不整等症狀","D":"同時使用Haloperidol與Lorazepam可以加速鎮靜生效，且發生EPS的機率比單獨使用Haloperidol更低"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3630},{"source":"EMT-P 第 51 章 P.1381","question":"關於鼻胃管（NG tube）滑脫的處理，根據救護技術員管理辦法，下列敘述何者正確？","options":{"A":"只要管路尖端還有潤滑劑，即可嘗試重新插入","B":"應將病人送回醫院由醫護人員進行評估與重新放置","C":"救護員應立即在現場將滑脫的管路推回原位","D":"告知家屬在家自行觀察，無需就醫"},"answer":"B","manualChapter":"CH51","matchedChapters":["CH51"],"id":3631},{"source":"EMT-P 第 50 章 P.1338","question":"蠍子毒液注入後的症狀以及徵候何者為非？","options":{"A":"併發的眼睛活動（顱神經功能不良）","B":"抽筋、心律不整","C":"起初是心搏過速，緊接著心搏過緩","D":"膽鹼性中毒"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"],"id":3632},{"source":"EMT-P 第 44 章 P.1165","question":"高海拔肺水腫初期症狀，通常在到高地，多久內開始出現？","options":{"A":"6小時","B":"12小時","C":"22小時","D":"24-72小時"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3633},{"source":"EMT-P 第 47 章 P.1256","question":"下列哪一項不屬於「性虐待」的症狀和徵候？","options":{"A":"無法解釋的陰道或肛門出血","B":"無法解釋的性病","C":"乳房或生殖器附近瘀青","D":"突然出現無關的親屬"},"answer":"D","manualChapter":"CH47","matchedChapters":["CH47"],"id":3634},{"source":"EMT-P 第 50 章 P.1319","question":"在急診毒物處置中，「洗胃（Gastric lavage）」有其嚴格的適應症與風險評估。下列哪一種臨床情境為執行洗胃的「禁忌症」？","options":{"A":"吞服大量三環抗憂鬱劑(TCA)，且確認食入時間在1小時內。","B":"食入具強烈毒性的鈣離子通道阻斷劑，且到院時間距離食入未滿1小時。","C":"昏迷病患在執行洗胃前，已先使用快速引導插管（RSI）置入氣管內管以保護呼吸道。","D":"意識不清且呼吸道無法保護，食入低黏度的碳氫化合物（如汽油、煤油）。"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3635},{"source":"EMT-P 第 44 章 P.1153","question":"針對瑞士體溫分級，下列何者錯誤？","options":{"A":"輕度：體溫32度-35度","B":"中度：意識清楚、不發抖","C":"重度：第三級低體溫","D":"極重度：無生命徵象"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"],"id":3636},{"source":"EMT-P 第 50 章 P.1316","question":"救護車到場，一名50歲男性，誤服抗膽鹼性藥物（anticholinergic agents）過量，出現散瞳、皮膚乾燥、心跳加速、意識混亂（Mad as a hatter）。抗膽鹼性藥物中毒的正確解毒劑為何？","options":{"A":"Flumazenil","B":"Naloxone","C":"Physostigmine","D":"Calcium"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"],"id":3637},{"source":"EMT-P 第 48 章 P.1264","question":"大白課本中，以下相對之日數何者正確","options":{"A":"兒童：介於1歲和青春期的孩童","B":"早產兒：出生時懷孕週數小於36週之嬰兒","C":"新生兒：為出生滿30天內之嬰兒","D":"嬰兒：年齡超過2個月但未超過1歲的幼兒"},"answer":"A","manualChapter":"CH48","matchedChapters":["CH48"],"id":3638},{"source":"EMT-P 第 50 章 P.1319","question":"關於活性炭劑量相關內容何者錯誤？","options":{"A":"劑量計算：1～4克/公斤 (以體重來算)","B":"成人劑量：30～100公克","C":"兒童劑量：15～30公克","D":"使用方法：將活性炭和生理食鹽水、水或軟便劑製備成泥漿狀，由嘴巴或胃管置入胃中"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"],"id":3639},{"source":"EMT-P 第 44 章 P.1147","question":"以下何者不是熱散失的機轉？","options":{"A":"傳導","B":"輻射","C":"代謝","D":"呼吸"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3640},{"source":"EMT-P 第 50 章 P.1315","question":"下列何者不是毒物進入人體的途徑？","options":{"A":"食入 (ingestion)","B":"吸入 (inhalation)","C":"皮膚吸收 (absorption)","D":"放射治療 (radiation)"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3641},{"source":"EMT-P 第 44 章 P.1159-1162","question":"潛水員在上升時如果恐慌或空氣用盡而憋氣，會導致肺部氣體膨脹甚至破裂，產生肺過度受壓症候群（POPS）。這種因周圍壓力降低導致氣體體積膨脹的物理現象，主要是根據下列哪一個氣體定律？","options":{"A":"亨利定律（Henry's law）","B":"道耳頓定律（Dalton's law）","C":"查理定律（Charles's law）","D":"波以耳定律（Boyle's law）"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3642},{"source":"EMT-P 第 44 章 P.1154-1156-1158","question":"關於體溫調節與環境急症之處置，下列敘述何者最適當？","options":{"A":"發生凍瘡（Frostbite）時，應立即以 50℃ 以上的高溫熱水進行快速復溫","B":"溺水（Drowning）病患最主要的生理變化為缺氧，到院前急救應優先給予高濃度氧氣與供氧","C":"潛水急症中的減壓病，主要原因來在深水區加壓溶解在組織或血液中的二氧化碳形成氣泡","D":"高海拔疾病之預防，最有效的根本治療為立即給予高濃度純氧且留在原高度觀察"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"],"id":3643},{"source":"EMT-P 第 48 章 P.1265","question":"新生兒離開母體後，為了生存會產生重要的生理轉變，下列何者為非？","options":{"A":"排除肺部的水分並開始進行通氣","B":"由胎兒循環轉變成近似於成人的循環","C":"維持體溫恆定","D":"PACO2累積後刺激呼吸中樞"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"],"id":3644},{"source":"EMT-P 第 45 章 P.1191","question":"在執行野外醫療檢傷評估時，下列哪種情況會使病患被視為「不可信賴」，導致物理理學檢查結果不可採信？","options":{"A":"病患出現急性壓力反應，表現出焦慮","B":"病患因手腕骨折感到疼痛，但在夾板固定後疼痛感已大幅減緩","C":"病患承認有少量飲酒，現場能夠配合指令","D":"病患在事發過程中曾出現短暫失憶，目前意識狀態完全清醒"},"answer":"A","manualChapter":"CH45","matchedChapters":["CH45"],"id":3645},{"source":"EMT-P 第 48 章 P.1271","question":"關於兒童解剖構造對急救的影響，下列敘述何者正確？","options":{"A":"兒童呼吸道最狹窄處位於聲門聲帶處","B":"小於3歲孩童平躺時應在肩膀下方墊薄毯以維持呼吸道暢通","C":"兒童喉部位置相較於成人較低且靠後","D":"兒童舌頭比例較小，不易造成呼吸道阻塞"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"],"id":3646},{"source":"EMT-P 第 50 章 P.1316","question":"有機磷中毒常使用下列哪一組藥物？","options":{"A":"Atropine + PAM","B":"Calcium + Glucagon","C":"Flumazenil + Naloxone","D":"Digoxin immune Fab + Calcium"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"],"id":3647},{"source":"EMT-P 第 44 章 P.1164","question":"根據台灣本土研究，不同體態的人在高海拔缺氧環境中發生急性高山病的機率不同，下列哪一個BMI組別發生急性高山病的機率高達80%？","options":{"A":"過輕","B":"正常","C":"過重","D":"肥胖"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3648},{"source":"EMT-P 第 46 章 P.1227","question":"一位患者自述腦海中一直有個迷之音要他自殺，其家屬表示願意陪伴及提供需要的支持，患者欲尋求幫助卻表現出猶豫不決的樣子。請依「精神病人高風險檢傷評估量表」決定這位患者是否需要立即送醫?","options":{"A":"7分，門診或居家治療即可","B":"9分，若患者不配合須強制送醫","C":"8分，立即送醫","D":"6分，公衛護理師或關訪員或心理衛生社工訪視"},"answer":"C","manualChapter":"CH46","matchedChapters":["CH46"],"id":3649},{"source":"EMT-P 第 46 章 P.1232","question":"當懷疑病人有酒精成癮問題時，可以使用CAGE篩檢法，只要符合兩項，就有七成機率為酒精成癮患者，請問以下檢測項目何者錯誤？","options":{"A":"C(Cut down):詢問病人對於戒酒是否有困難。","B":"A(Annoyance):詢問病人是否因喝酒而造成家人或朋友的厭惡。","C":"G(Guilty):詢問病人是否覺得因長期喝酒而有罪惡感。","D":"E(Excited):詢問病人是否對喝酒這件事始終保持興奮感，不喝就會情緒低落。"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3650},{"source":"EMT-P 第 49 章 P.1301","question":"關於生產急症的敘述，下列何者錯誤？","options":{"A":"產後子宮收縮不良、嚴重產道撕裂傷、胎盤不完全脫離、凝血異常、胎盤組織殘留體內皆可能造成產後大出血，其中以子宮收縮不良最常見。","B":"當遇到臍帶脫出時，應手扶胎兒頭部，並使患者的胸部高於臀部，以減少臍帶壓力。","C":"遇到羊膜囊完整分娩時，可以在避免傷害胎兒的前提下，將羊水膜刺開。","D":"以上皆錯"},"answer":"B","manualChapter":"CH49","matchedChapters":["CH49"],"id":3651},{"source":"EMT-P 第 50 章 P.1332","question":"在氰化物 (Cyanide) 中毒的傳統三步驟解毒套件中，給予亞硝酸鈉 (Sodium Nitrite) 的主要生理目的為何？？","options":{"A":"補充維生素 B12","B":"直接與氰離子結合為硫氰酸鹽","C":"矯正代謝性酸中毒","D":"產生變性血紅素"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3652},{"source":"EMT-P 第 47 章 P.1250","question":"高齡病人高血壓定義為休息時血壓持續大於多少？","options":{"A":"血壓持續大於 120/70 mmHg","B":"血壓持續大於 130/80 mmHg","C":"血壓持續大於 140/90 mmHg","D":"血壓持續大於 110/60 mmHg"},"answer":"B","manualChapter":"CH47","matchedChapters":["CH47"],"id":3653},{"source":"EMT-P 第 46 章 P.1214","question":"在與行為急症病人對話時，為了給予病人尊重並減少其心理負擔與敵意，根據文化人類學家提出的社交距離，建議至少保持多少公尺以上？","options":{"A":"0.5","B":"1.2","C":"4.5","D":"6"},"answer":"B","manualChapter":"CH46","matchedChapters":["CH46"],"id":3654},{"source":"EMT-P 第 46 章 P.1212","question":"依據精神衛生法第3條，下列哪一項特稱不包刮在法律定義的精神疾病範疇內？","options":{"A":"反社會人格違常者","B":"精神官能症","C":"物質使用障礙症","D":"思覺失調症"},"answer":"A","manualChapter":"CH46","matchedChapters":["CH46"],"id":3655},{"source":"EMT-P 第 44 章 P.1165","question":"一名登山客在海拔3500公尺處出現嚴重呼吸困難、咳出粉紅色泡沫痰、聽診有明顯濕囉音以及發紺。應高度懷疑其罹患何種高海拔急症？","options":{"A":"急性高山病","B":"高海拔腦水腫","C":"高海拔肺水腫","D":"換氣過度"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3656},{"source":"EMT-P 第 48 章 P.1290-1293","question":"面對有特殊醫療需要兒童 (CSHCN) 遭遇管路緊急情況時，救護技術員可使用「DOPE」口訣來進行臨床評估與故障排除。其中字母 「P」 代表的臨床意義為何？","options":{"A":"Displacement (管路滑動移位)","B":"Obstruction (管路堵住或阻塞)","C":"Equipment failure (機械故障)","D":"Complications (各種併發症，如氣胸、心包膜填塞等)"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"],"id":3657},{"source":"EMT-P 第 48 章 P.1268","question":"建議35週以下早產兒正壓通氣應給予多少%的FiO²?","options":{"A":"17~21%","B":"21~30%","C":"30~45%","D":"100%"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"],"id":3658},{"source":"EMT-P 第 45 章 P.1204","question":"下列何者不是野外不實施CPR的建議？","options":{"A":"水下淹沒超過一小時(使用水肺)","B":"雪崩掩埋超過35分鐘且呼吸道被雪阻塞","C":"胸部結凍僵硬","D":"明顯致命傷"},"answer":"A","manualChapter":"CH45","matchedChapters":["CH45"],"id":3659},{"source":"APLS 第 2 章 P.11","question":"嬰兒(小於1歲)與小兒CPR比較不同之處，下列選項何者不正確?","options":{"A":"摸脈搏之處不同","B":"壓胸的深度","C":"人工呼吸為口對口","D":"壓胸位置為兩乳頭連線中央下緣之胸骨處"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH2","APLS"],"id":3660},{"source":"EMT-P 第 48 章 P.1267","question":"在評估一名剛出生的新生兒是否需要立即急救時，根據新生兒急救流程，下列哪一項不是初步評估的三個核心問題之一？","options":{"A":"新生兒是否會哭跟呼吸","B":"新生兒的膚色是否紅潤","C":"新生兒是否為足月產","D":"新生兒的肌肉張力是否良好"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"],"id":3661},{"source":"EMT-P 第 44 章 P.1146","question":"當身體面臨嚴重的寒冷刺激時，骨骼肌會透過發抖來代償。請問發抖機轉最大可增加約多少百分比的熱產生？","options":{"A":"100%","B":"200%","C":"400%","D":"800%"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3662},{"source":"EMT-P 第 44 章 P.1149","question":"熱衰竭病患的中心體溫通常會升高到攝氏多少度左右？","options":{"A":"43°C","B":"39°C","C":"37°C","D":"41°C"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"],"id":3663},{"source":"EMT-P 第 49 章 P.1297","question":"針對懷孕超過 20 週的孕婦進行心肺復甦術（CPR）時，下列處置何者最能有效緩解下腔靜脈受壓迫？","options":{"A":"將子宮手動向左側推移（Left Uterine Displacement）。","B":"維持標準仰臥姿勢，但增加壓胸的深度至 6cm。","C":"墊高產婦的臀部，使其呈現頭低腳高的姿勢。","D":"讓孕婦維持右側躺姿勢進行壓胸。"},"answer":"A","manualChapter":"CH49","matchedChapters":["CH49"],"id":3664},{"source":"EMT-P 第 48 章 P.1283","question":"關於小兒急救，下列何者錯誤？","options":{"A":"小兒OHCA時第一次電擊應用 2 J/KG","B":"小兒OHCA給予氣管內管Bosmin，劑量應為 0.01mg/kg","C":"給予氣管內管時，ETCO2可以用來確認氣管內管位置","D":"小兒與大人亦同，皆須高品質CPR"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"],"id":3665},{"source":"EMT-P 第 44 章 P.1153","question":"關於低體溫患者的回溫處置，下列何者非屬主動回溫?","options":{"A":"照射烤燈","B":"蓋上溫暖的毛毯等","C":"灌注熱空氣","D":"靜脈注射溫的點滴"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"],"id":3666},{"source":"EMT-P 第 48 章 P.1288","question":"根據「TEN-4 瘀傷準則」，下列何種情況應高度懷疑為身體虐待？","options":{"A":"6歲兒童在膝蓋處有瘀青","B":"5歲兒童在手肘處有擦傷","C":"2歲兒童在額頭正中央有單一瘀青","D":"3個月大的嬰兒大腿處有不明瘀青"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"],"id":3667},{"source":"EMT-P 第 48 章 P.1279","question":"小兒童節中，對於病童常造成心搏過緩的原因以下何者為非","options":{"A":"毒藥物中毒","B":"低體溫","C":"低血糖","D":"缺氧"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"],"id":3668},{"source":"EMT-P 第 44 章 P.1155 - 1156","question":"冬季山區搜救現場，EMT-P 正要處置一名因山難受困導致低體溫且疑似合併凍瘡的男性病人。病人神智不清、對疼痛刺激僅有微弱、無發抖現象。題目：根據環境急症之病理生理學及到院前處置原則，下列哪一項敘述是「錯誤」的？","options":{"A":"當病人中心體溫降到 30°C 以下時，發抖反應就會停止，主要是因為體內葡萄糖、肝醣消耗殆盡，或胰島素無法被葡萄糖利用所致。","B":"若心電圖上看到 Osborn 波（駱駝峰突起），代表低體溫已影響心臟傳導，此時病人隨時有發生自發性心室纖維顫動（VF）的風險，必須全時全心電圖監看。","C":"到院前針對局部凍瘡，若可能發生「肢體再冰凍」的狀況，只要救護車上有保暖器材，仍應積極使用 37～39°C 的溫水進行部分且緩慢的快速回溫，以保存活組織。","D":"低體溫病人的呼吸與脈搏不易偵測，到院前評估脈搏應長達 30～45 秒以決定是否進行 CPR；若病人發生心臟停止且體溫高於30°C，給予 epinephrine 的間隔時間須延長為原本的兩倍。"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3669},{"source":"EMT-P 第 50 章 P.1338","question":"下列毒蛇何者不是出血性毒蛇？","options":{"A":"雨傘節","B":"龜殼花","C":"青竹絲","D":"百步蛇"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"],"id":3670},{"source":"EMT-P 第 44 章 P.1146","question":"下列調節熱產生的代償機轉，何者變化與其他機轉不一樣？","options":{"A":"周邊血管收縮","B":"發抖","C":"增加自主性活動","D":"增加食慾"},"answer":"A","manualChapter":"CH44","matchedChapters":["CH44"],"id":3671},{"source":"EMT-P 第 50 章 P.1351","question":"Naloxone對於鴉片類藥物中毒患者，主要作用為何？","options":{"A":"讓病人完全清醒，並且能清楚對答","B":"劑量不需太多，只需足夠重建立病人的呼吸道反射及維持適當呼吸","C":"應持續施打至瞳孔恢復正常大小","D":"為防止病人再度睡著，應一次給予最大劑量"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"],"id":3672},{"source":"EMT-P 第 49 章 P.1303","question":"下列何者為子癇前症 (pre-eclampsia) 的典型表現？","options":{"A":"低血壓、低血糖、發燒","B":"高血壓、水腫、尿蛋白","C":"心搏過慢、低體溫、腹瀉","D":"高血壓、低血糖、尿蛋白"},"answer":"B","manualChapter":"CH49","matchedChapters":["CH49"],"id":3673},{"source":"EMT-P 第 44 章 P.1163","question":"當高海拔疾病病患出現「步態不穩、判斷力變差、沒有方向感」等症狀時，應強烈懷疑病情已惡化為下列何種狀況？","options":{"A":"嚴重熱衰竭","B":"氮醉","C":"高海拔肺水腫 (HAPE)","D":"高海拔腦水腫 (HACE)"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3674},{"source":"EMT-P 第 48 章 P.1264","question":"下列選項哪個錯誤？ 1.新生兒為出生21天內嬰兒 2.早產兒為年齡超過1個月 3.兒童介於一歲與青春期的兒童 4.嬰兒為超過一個月但未超過一歲的幼兒","options":{"A":"1.3.4","B":"1.2.3.4","C":"1.2.4","D":"1.2"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH48"],"id":3675},{"source":"EMT-P 第 50 章 P.1315","question":"病人出現呼吸抑制特別是在美國，應考慮使用下列何種藥物同時也可以是診斷性治療？","options":{"A":"Atropine","B":"Flumazenil","C":"Naloxone","D":"Calcium"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"],"id":3676},{"source":"EMT-P 第 46 章 P.1215","question":"EMT-P 在現場運用「眼、耳、鼻、舌、身、意」評估病人的暴力風險，下列對應何者正確？","options":{"A":"舌：評估病人是否有幻聽或因症狀干擾而聽不到外界聲音","B":"鼻：觀察病人是否呼吸急促、焦躁不安無法緩解","C":"身：評估病人的敵意用詞、喃喃自語或妄想內容","D":"意：評估病人是否有攻擊舉動、揮拳或用拳頭打東西"},"answer":"B","manualChapter":"CH46","matchedChapters":["CH46"],"id":3677},{"source":"EMT-P 第 48 章 P.1282","question":"關於到院前兒童急性病態生理的評估、休克輸液處置、心律不整給藥以及兒虐辨識，下列敘述何者最不適當？","options":{"A":"評估兒童休克時切勿只依賴血壓作為唯一指標。若遇到嚴重低血容休克病童，到院前可快速給予0.9%生理食鹽水，其初始劑量為20mL/kg","B":"當病童持續呈現有症狀之心搏過緩且伴隨循環不良，若通暢呼吸道與給氧後心跳仍小於每分鐘60下，應給予腎上腺素或實施胸外按壓","C":"治療兒童上心室頻脈(Supraventricular Tachycardia)時，腺苷酸(Adenosine)為首選藥物，其第一劑給藥劑量為快速推注1.0mg/kg","D":"依據TEN-4瘀傷準則，若發現4個月以下嬰兒全身任一處出現瘀傷，或4歲以下兒童在軀幹、耳朵及脖子有瘀傷，應高度懷疑身體虐待"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"],"id":3678},{"source":"EMT-P 第 46 章 P.1214","question":"當 EMT-P 抵達行為急症現場，使用「DEFUSE」言語降階技巧時，下列哪一項處置不當？","options":{"A":"Decide：先判斷病人是否能參與對話，若完全失去理智且有即時威脅則不適合降階","B":"Ensure Safety：清除現場可能被用作武器的物品，並保持至少兩個手臂的距離","C":"Set Limits：明確設定會談界限，並以事實描述後果而非進行恐嚇","D":"Form Relationship：為了表示親近與建立信任，應主動觸摸病人或保持在 0.5 公尺內對話"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3679},{"source":"EMT-P 第 49 章 P.1303","question":"新生兒急救，救護技術員必須熟記：(1)氣溫、(2)呼吸、(3)循環、(4)乾燥、(5)環境、(6)家人，以上哪幾點？","options":{"A":"1、2、3、4、5","B":"1、2、3、4、6","C":"1、2、3、5、6","D":"1、2、3、4、5、6"},"answer":"D","manualChapter":"CH49","matchedChapters":["CH49"],"id":3680},{"source":"EMT-P 第 46 章 P.1217","question":"執行行為急症救護時，經由衛生所駐點人員判定有必要強制就醫，需物理約束時，下列行為較為正確？","options":{"A":"可將患者背部朝上並以身體部位壓著以確保約束帶綁好後再移開","B":"患者在約束後仍暴躁可到院後再由院方評估生命徵象","C":"約束上肢時建議將患者雙手皆向上擺放約束，可使患者難以產生力道掙脫","D":"若需要四肢以外的額外約束可在胸部附近放置一條床單綁在擔架上，但不可以綁太緊影響呼吸時胸部擴張"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3681},{"source":"EMT-P 第 49 章 P.1305","question":"在婦科急症中，「卵巢囊腫破裂」最常發生的時機或情境為何？","options":{"A":"通常伴隨長期慢性的發燒與體重減輕。","B":"經期來潮前一週或激烈的性行為後。","C":"更年期後的婦女因荷爾蒙流失所致。","D":"懷孕初期（前四週）的正常生理反應。"},"answer":"B","manualChapter":"CH49","matchedChapters":["CH49"],"id":3682},{"source":"EMT-P 第 44 章 P.1153","question":"在處理「第二級(HT II)」低體溫病人（意識變差、無發抖）時，救護技術員應特別注意什麼以避免誘發心室顫動(VF)？","options":{"A":"給予大量冰冷輸液","B":"強制病人起身運動","C":"搬運時動作應極度輕柔，避免過度震動病人","D":"立即進行插管"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3683},{"source":"EMT-P 第 49 章","question":"關於妊娠期間的生理變化與相關定義，下列哪一項敘述「錯誤」","options":{"A":"妊娠 20 週以上的孕婦若平躺，可能因增大的子宮壓迫下腔靜脈導致「仰臥位低血壓綜合症」","B":"「早產」是指妊娠滿 20 週但未滿 37 週時的分娩","C":"懷孕期間心跳通常會增加，每分鐘約比平時多出 15-20次","D":"「流產」是指妊娠 24 週以前胎兒死亡或自然終止妊娠"},"answer":"D","manualChapter":"CH49","matchedChapters":["CH49"],"id":3684},{"source":"EMT-P 第 46 章 P.1232","question":"準自殺行為及自殺的危險因素不包括下列何者？","options":{"A":"執行一次或多次的準自殺行為","B":"單身，分居或離婚","C":"沒有職業或退休","D":"與家人或社會相處融洽"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3685},{"source":"EMT-P 第 50 章 P.1318","question":"下列哪一項化學毒素被人類誤食後可以使用活性碳去吸附？","options":{"A":"氰化物(cyanide)","B":"鋰鹽(lithium)","C":"甲醇(methanol)","D":"茶鹼(theophyline)"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3686},{"source":"EMT-P 第 44 章 P.1146","question":"減少熱散失的機轉，有哪些？","options":{"A":"周邊血管收縮","B":"減少散熱表面積","C":"豎立汗毛","D":"以上皆是"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3687},{"source":"EMT-P 第 50 章 P.1344","question":"高級救護技術員（EMT-P）救護一名疑似農藥中毒患者，現場發現病人呈現大量流涎（Salivation）、流淚（Lacrimation）、瞳孔極度縮小（Pinpoint pupils）、呼吸道分泌物極多且伴隨明顯的肌肉纖維顫動（Fasciculations）。關於該病人的病理生理機轉與解毒劑處置，下列敘述何者最為正確？","options":{"A":"該病人的症狀屬於典型的抗膽鹼性中毒症候群（Anticholinergic toxidrome）","B":"施打阿托品（Atropine）的主要目的是為了逆轉造成肌肉無力與呼吸肌麻痺的菸鹼鹼（Nicotinic）症狀","C":"解磷定（PAM/Pralidoxime）的作用是與被有機磷結合的乙醯膽鹼酯酶結合，使其「重新活化」，但必須在酶發生「老化（Aging）」前給予才有效","D":"評估阿托品（Atropine）是否達到足夠劑量的臨床終點（Endpoint），最主要是觀察病人的瞳孔是否完全放大（Mydriasis）以及心跳是否大於 100 次/分"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"],"id":3688},{"source":"APLS 第 23 章 P.999","question":"一位 2 歲男孩被母親帶來急診，主訴是嘔吐不止，腹痛安排檢查後，X 光有 Meniscus or Crescent Sign：","options":{"A":"巨結腸症 megacolon","B":"腸扭轉 Midgut volvulus","C":"麥克氏憩室炎 Meckel diverticulitis","D":"腸套疊 intussusception"},"answer":"D","manualChapter":"CH48","matchedChapters":["CH23","APLS"],"id":3689},{"source":"EMT-P 第 44 章 P.1148","question":"天氣炎熱，小明運動不小心發生熱痙攣，在極高溫環境下，流汗每小時可達1~3公升，請問每一公升的汗水約含幾毫克的氯化鈉？","options":{"A":"30~50","B":"100~200","C":"80~90","D":"800~900"},"answer":"A","manualChapter":"CH44","matchedChapters":["CH44"],"id":3690},{"source":"EMT-P 第 50 章 P.1359","question":"有關普拿疼中毒的病生理階段，肝損傷的高峰通常發生在第幾個階段？","options":{"A":"第一階段 (0~24小時)","B":"第二階段 (24~48小時)","C":"第四階段 (4~14天)","D":"第三階段 (72~96小時)"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3691},{"source":"EMT-P 第 45 章 P.1204","question":"請問有關野外骨折復位的部位，何者最不適合操作？","options":{"A":"髕骨","B":"手指、腳趾","C":"肩部","D":"腕關節"},"answer":"D","manualChapter":"CH45","matchedChapters":["CH45"],"id":3692,"explanation":"野外脫臼復位的適用適用時機為肩部、髕骨和手指、腳趾間接受力(槓桿、扭轉、拉扯)造成的脫臼，這些部位的脫臼通常是單純的且關節內部血管神經分布不錯縱複雜。至於遭受直接撞擊力量以及腕關節、肘關節、踝關節、膝關節、髖關節的脫臼則不適用，必須與不穩定的關節傷害處置相同，需要用夾板原姿勢固定，保持傷肢穩定性和CSM正常"},{"source":"EMT-P 第 50 章 P.1369","question":"在處理有機磷 (Organophosphate) 中毒時，醫護人員常用「SLUDGE」口訣來辨識症狀，其中「L」代表什麼？","options":{"A":"嗜睡 (Lethargy)","B":"肝腫大 (Liver enlargement)","C":"淚 (Lacrimation)","D":"腰痛 (Loin pain)"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"],"id":3693},{"source":"EMT-P 第 44 章 P.1149","question":"關於熱衰竭 (heat exhaustion)之描述，下列何者正確？","options":{"A":"因血管內容積減少，突然坐起來時，可能發生姿勢性低血壓或姿勢性頭暈。","B":"體溫可能會上升至41度以上。","C":"流汗每小時可達1-3公升","D":"因水分和鹽缺乏可能導致肌肉痙攣。"},"answer":"A","manualChapter":"CH44","matchedChapters":["CH44"],"id":3694},{"source":"EMT-P 第 49 章 P.1297","question":"孕婦的心輸出量及總血量大約在懷孕第幾週時會增加約30%？","options":{"A":"第20週","B":"第12週","C":"第34週","D":"第40週"},"answer":"C","manualChapter":"CH49","matchedChapters":["CH49"],"id":3695},{"source":"EMT-P 第 44 章 P.1148-1150","question":"關於\"熱痙攣\"的病因與處置方式，下列敘述何者正確？","options":{"A":"病患通常會出現神智不清，且中心體溫會產生顯著升高。","B":"痙攣主因為鈣離子流失，應優先透過口服鈣片進行補充。","C":"應優先給予口服鹽片，以加速身體電解質水平之平衡。","D":"主因為鈉與水流失，建議給予補充等張之含鹽飲料。"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3696},{"source":"EMT-P 第 50 章 P.1318","question":"腸胃道除污、在病人食入毒物後多久內實施，效果最好？","options":{"A":"1小時內","B":"2小時內","C":"3小時內","D":"4小時內"},"answer":"A","manualChapter":"CH50","matchedChapters":["CH50"],"id":3697},{"source":"EMT-P 第 48 章 P.1270","question":"若要經由骨內輸液 (IO) 給予新生兒腎上腺素，建議的劑量與濃度為何？","options":{"A":"1:10000，0.5～1 cc/kg","B":"1:1000，0.5～1 cc/kg","C":"1:10000，0.1～0.3cc/kg","D":"1:1000，0.1～0.3cc/kg"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"],"id":3698},{"source":"EMT-P 第 49 章","question":"子癇前症 (Pre-eclampsia) 的三大典型症狀不包括下列何者？","options":{"A":"尿蛋白","B":"水腫","C":"全身性癲癇大發作","D":"高血壓 (收縮壓 ≥140mmHg)"},"answer":"C","manualChapter":"CH49","matchedChapters":["CH49"],"id":3699},{"source":"APLS 第 12 章 P.74","question":"在急救進行 RSI 時，針對臨床情境選擇適當的鎮靜或麻醉藥物，下列何者處置「最不適當」？","options":{"A":"對於低血壓、休克或氣喘發作的兒童，選用 Ketamine 作為鎮靜劑","B":"對於頭部創傷且懷疑腦壓上升的兒童，事先給予 Lidocaine 以減緩腦壓升高","C":"對於嚴重低血容或休克的病人，選用 Thiopental 作為首選鎮靜引導藥物","D":"對於大面積燒傷或嚴重肌肉受傷的病人，應避免使用 Succinylcholine 以免引發致命性高血鉀"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH12","APLS"],"id":3700},{"source":"EMT-P 第 44 章 P.1153","question":"請問體溫26度達到低體溫的哪一個嚴重程度？","options":{"A":"輕度","B":"中度","C":"重度","D":"極重度"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3701},{"source":"EMT-P 第 48 章 P.1280","question":"評估兒童休克時，微血管充填時間 (CRT) 是一個極佳的初期生理徵候。在正常環境下輕壓病童手掌或腳背後放開，當超過幾秒才恢復顏色時，即代表病童可能處於休克狀態？","options":{"A":"超過 1 秒","B":"超過 2 秒","C":"超過 3 秒","D":"超過 5 秒"},"answer":"C","manualChapter":"CH48","matchedChapters":["CH48"],"id":3702},{"source":"EMT-P 第 44 章 P.1146","question":"調節熱產生的代償機轉，下列哪一個會造成減少熱散失的狀態？","options":{"A":"發抖","B":"增加荷爾蒙分泌","C":"周邊血管收縮","D":"增加食慾"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3703},{"source":"EMT-P 第 50 章 P.1339","question":"下列哪種毒蛇為神經性毒？","options":{"A":"百步蛇","B":"眼鏡蛇","C":"赤尾青竹絲","D":"龜殼花"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"],"id":3704},{"source":"EMT-P 第 50 章 P.1372","question":"EMT-P 小組接獲通報前往救治一名誤服鹽酸（強酸）的病人。抵達現場時病人痛苦萬分，家屬急切詢問是否可以趕快灌一大杯牛奶或檸檬汁來中和。針對此狀況，下列到院前處置原則何者正確？","options":{"A":"立即給予大量活性碳溶液，以吸附殘餘強酸","B":"著重於維持呼吸道暢通、點滴給予並安全快速送醫，禁止進行中和嘗試","C":"立刻給予果汁或醋進行酸鹼中和，以減低毒性","D":"當場使用粗口胃管進行洗胃，迅速移除胃內強酸"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"],"id":3705},{"source":"EMT-P 第 44 章 P.1153","question":"請問瑞士低體溫分級系統，臨床表徵意識不清、不發抖為第幾級低體溫？","options":{"A":"第一級","B":"第二級","C":"第三級","D":"第四級"},"answer":"B","manualChapter":"CH44","matchedChapters":["CH44"],"id":3706},{"source":"EMT-P 第 49 章 P.1295 - 1297","question":"關於婦產急症中孕婦的敘述以下何者錯誤？","options":{"A":"孕期主要分為三期，主要以三個月為一期，分為第一期、第二期及第三期。","B":"子癇前症亦稱為妊娠毒血症，發生原因不明，通常發生於第一胎。病人在懷孕時會出現高血壓(收縮壓≥140mmHg或舒張壓≥90mmHg)、水腫及尿蛋白，通常發生在懷孕第二期。","C":"羊水栓塞 (amniotic fluid embolism)：羊水栓塞是指在分娩前後羊水進入母體血管循環引發肺栓塞導致出血、休克和瀰漫性血管內凝血異常 (DIC) 等一系列病變","D":"孕婦在懷孕第二期時，血壓會上升10～15mmHg，而在懷孕末期血壓會降回正常血壓。"},"answer":"D","manualChapter":"CH49","matchedChapters":["CH49"],"id":3707},{"source":"EMT-P 第 50 章 P.1377","question":"在毒物學評估中，將毒性物質依據臨床表現分類，可以幫助救護技術員更有效率地評估與處置病人。下列哪一項不屬常見的中毒症候群（toxic syndrome）範疇？","options":{"A":"膽鹼性中毒症候群 (Cholinergic)","B":"抗膽鹼性中毒症候群 (Anticholinergic)","C":"鴉片類止痛劑中毒症候群 (Opioid)","D":"缺氧性中毒症候群 (Hypoxic)"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3708},{"source":"EMT-P 第 51 章 P.1402","question":"關於CT和MRI的兩者比較，何者配對正確？","options":{"A":"對於金屬物質進入檢查環境有極大風險為CT","B":"患者接受檢查完全不會接收到任何輻射劑量為CT","C":"對於軟組織、脊髓位置判讀較佳為MRI","D":"檢查環境噪音較小為MRI"},"answer":"C","manualChapter":"CH51","matchedChapters":["CH51"],"id":3709},{"source":"EMT-P 第 50 章 P.1316","question":"甲醇中毒之解毒劑為","options":{"A":"atropin","B":"naloxone","C":"乙醇","D":"重碳酸根"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"],"id":3710},{"source":"EMT-P 第 44 章 P.1164 - 1165","question":"依據路易絲湖急性高山症之評分項目，何項病徵為定義急性高山症之必要病徵？","options":{"A":"噁心、嘔吐","B":"疲憊虛弱","C":"頭暈/頭重腳輕","D":"頭痛"},"answer":"D","manualChapter":"CH44","matchedChapters":["CH44"],"id":3711},{"source":"EMT-P 第 46 章 P.1214","question":"請問以下哪一樣不屬於精神危機的態樣？","options":{"A":"失去現實感","B":"失去希望","C":"失去控制","D":"失去自我"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3712},{"source":"EMT-P 第 44 章 P.1155","question":"凍瘡造成最主要的傷害性影響為何","options":{"A":"低血壓","B":"心跳慢","C":"組織缺血","D":"發燒"},"answer":"C","manualChapter":"CH44","matchedChapters":["CH44"],"id":3713},{"source":"EMT-P 第 49 章 P.1294","question":"一名孕婦G3P2（懷孕 3 次，分娩 2 次），妊娠34週，因劇烈腹痛、子宮持續緊繃、血壓下降送醫，陰道僅有少量出血，但胎心音持續下降。下列何者最能解釋此病人的臨床表現？","options":{"A":"前置胎盤","B":"胎盤早期剝離","C":"子宮外孕","D":"子癇前症"},"answer":"B","manualChapter":"CH49","matchedChapters":["CH49"],"id":3714},{"source":"EMT-P 第 46 章 P.1214","question":"在面對精神危機的時候，救護人員不需要精確診斷疾病，但要能分辨病人是否陷入危機。當發現病人表現為不成比例的焦慮、緊張、恐慌時，是處於何種精神危機態樣？","options":{"A":"為失去現實感","B":"失去希望","C":"失去控制","D":"失去穩定的想法"},"answer":"D","manualChapter":"CH46","matchedChapters":["CH46"],"id":3715},{"source":"EMT-P 第 50 章 P.1318","question":"活性碳的適應症下列何者為非？","options":{"A":"卡馬西平","B":"鴉片類止痛藥","C":"茶鹼","D":"氰化物"},"answer":"D","manualChapter":"CH50","matchedChapters":["CH50"],"id":3716},{"id":3717,"source":"背誦題","question":"人體會有自動調節的機制讓平均動脈壓上升以維持腦部灌流壓力在多少左右?","options":{"A":"60mmHg","B":"70mmHg","C":"80mmHg","D":"90mmHg"},"answer":"C","matchedChapters":["CH36","背誦題"],"manualChapter":"CH36"},{"source":"EMT-P 第 20 章 P.527","question":"一名顏面嚴重外傷的機車騎士，EMT在視診時發現他有一側的眼球明顯突出，而且仔細觀察，這個突出的眼球竟然會「跟著心跳的頻率搏動」，並合併結膜充血。這最可能是下列哪一種急症？","options":{"A":"葛瑞夫茲氏病 (Graves' disease)","B":"頸動脈海綿竇廔管 (Carotid-cavernous fistula)","C":"眼窩蜂窩性組織炎 (Orbital cellulitis)","D":"急性細菌性眼內炎 (Endophthalmitis)"},"answer":"B","id":3718,"manualChapter":"CH20","matchedChapters":["CH20"]},{"source":"EMT-P 第 16 章 P.389","question":"有關藥物給予途徑之敘述，何者為經肺部給藥？","options":{"A":"S.L.","B":"PR","C":"SUPP","D":"ETT"},"answer":"D","id":3719,"manualChapter":"CH16","matchedChapters":["CH16"]},{"source":"EMT-P 第 20 章 P.539","question":"胸部身體診察，以下徵候所表現出的臨床意義之配對何者錯誤？","options":{"A":"扣診發現共鳴過度其臨床意義可能為COPD","B":"視診發現蛛狀痣其臨床意義可能為肝硬化","C":"聽診兩側肺部粗囉音其臨床意義可能為肺纖維化","D":"觸診發現皮下氣腫其臨床意義可能為嚴重氣喘"},"answer":"C","id":3720,"manualChapter":"CH20","matchedChapters":["CH20"]},{"source":"EMT-P 第 20 章 P.538","question":"比較「哮鳴音(Wheezes)」與「鼾音(Rhonchi)」的音質特性，下列敘述何者正確？","options":{"A":"兩者皆為高頻，僅出現時機不同","B":"哮鳴音是不連續的爆裂聲；鼾音是連續的音樂聲","C":"哮鳴音聲音粗糙；鼾音聽起來像揉頭髮","D":"哮鳴音為高頻輕柔多人口哨聲；鼾音為中低頻單音"},"answer":"D","id":3721,"manualChapter":"呼吸型態(含肺音)","matchedChapters":["CH20"]},{"source":"EMT-P 第 16 章 P.397","question":"一般認為，藥物經過幾個半衰期後，可視為已從體內全部清除？","options":{"A":"10個半衰期","B":"5個半衰期","C":"3個半衰期","D":"1個半衰期"},"answer":"B","id":3722,"manualChapter":"CH16","matchedChapters":["CH16"]},{"source":"EMT-P 第 50 章 P.1324","question":"當幼兒誤食超過60mg/kg鐵離子時，最可能出現哪種危險的併發症？","options":{"A":"心血管衰竭與死亡","B":"嚴重的低血糖症","C":"慢性肌肉萎縮","D":"視神經萎縮"},"answer":"A","id":3723,"manualChapter":"CH50","matchedChapters":["CH50"]},{"source":"EMT-P 第 51 章 P.1387","question":"洗腎管路中何者是將非慣用手的橈動脈與頭靜脈之間接合，讓動脈血流入靜脈的方式。","options":{"A":"AV fistula","B":"AV graft","C":"Perm cath","D":"Double lumen catheter"},"answer":"A","id":3724,"manualChapter":"CH51","matchedChapters":["CH51"]},{"source":"EMT-P 第 51 章 P.1401","question":"在常見的放射線檢查中，下列哪一項檢查的輻射劑量「最高」？","options":{"A":"胸部 X 光檢查 (CXR)","B":"牙科 X 光","C":"腹部電腦斷層掃描 (Abdomen CT)","D":"肢體骨折 X 光"},"answer":"C","id":3725,"manualChapter":"CH51","matchedChapters":["CH51"]},{"source":"EMT-P 第 46 章 P.1218","question":"面對具備暴力傾向的行為急症病人，且病人持續對抗物理約束時，病人可能發生何種併發症，以下何者為非？","options":{"A":"姿勢性窒息","B":"高體溫","C":"副交感神經興奮","D":"代謝性酸中毒"},"answer":"C","id":3726,"manualChapter":"CH46","matchedChapters":["CH46"]},{"source":"EMT-P 第 46 章 P.1216","question":"關於DEFUSE言語降階技巧中的E步驟，下列何者最適當？","options":{"A":"確保有足夠後援、清除現場武器物品、保持適當距離","B":"直接靠近病人已建立信任感","C":"告訴病人他是精神病需要吃藥","D":"立即使用物理約束控制病人"},"answer":"A","id":3727,"manualChapter":"CH46","matchedChapters":["CH46"]},{"source":"EMT-P 第 50 章 P.1320","question":"一名病人於45分鐘前吞服大量強鹼性水管清潔劑，目前口咽明顯灼傷且吞嚥困難。下列何項最符合院前處置？","options":{"A":"立即給予活性碳降低吸收","B":"給予牛奶或大量清水稀釋，再以醋中和強鹼","C":"優先維持呼吸道與通氣，快速送醫","D":"立即催吐以降低胃內毒物濃度"},"answer":"C","id":3728,"manualChapter":"CH50","matchedChapters":["CH50"]},{"source":"EMT-P 第 54 章 P.1485","question":"當熱中暑危險係數大於多少時，教材建議主辦單位應設置冷水槽、碎冰等降溫設備？","options":{"A":"45","B":"35","C":"30","D":"40"},"answer":"B","id":3729,"manualChapter":"CH54","matchedChapters":["CH54"]},{"source":"EMT-P 第 53 章 P.1456","question":"有關B級防護裝備的防護特性與主要應用位置，下列敘述何者正確？","options":{"A":"提供最高等級的皮膚黏膜保護，但呼吸保護較差，一般用於冷區","B":"在不知道化學品任何性質與高濃度氣體下，B級比A級更適合直接進入熱區源頭止漏","C":"防護衣只能防止液體潑濺且無法阻止液體滲入，人員呼吸為濾毒罐純化之空氣","D":"防護衣為全身式且非氣密，可防止液體毒物滲入但會接觸到外界空氣，一般由暖區除污人員穿著"},"answer":"D","id":3730,"manualChapter":"CH53","matchedChapters":["CH53"]},{"source":"EMT-P 第 56 章 P.1541","question":"移除重物壓困下列何者為非?","options":{"A":"在移除病人身上的重物之前應確保脫困路線暢通","B":"不須要在移除重物前就開始治療病人","C":"病人的狀況(生命徵象)可能會在重物移除之後開始變得不穩定","D":"救援組應和醫療組應一起討論移除重物的時機"},"answer":"B","id":3731,"manualChapter":"CH56","matchedChapters":["CH56"]},{"source":"EMT-P 第 57 章 P.1551","question":"地震發生，建築物內的電梯感應到P波緊急停止運作，避免人員被困在電梯內。下列關於P波 (Primary wave) 的特性，何者正確？","options":{"A":"P波即橫波或剪力波，質點運動與傳播方向垂直","B":"P波速度在地震波中最慢","C":"P波只能在地球表層傳播，無法在地球內部傳播","D":"P波為縱波或壓縮波，性質與音波類似，質點運動和波的傳播方向一致，移動速度最快"},"answer":"D","id":3732,"manualChapter":"CH57","matchedChapters":["CH57"]},{"source":"EMT-P 第 53 章 P.無","question":"下列何種毒物主要藉由抑制氧氣利用而造成化學性窒息效應？","options":{"A":"Nitrogen (氮氣)","B":"Carbon dioxide (二氧化碳)","C":"Cyanide (氰化物)","D":"Chlorine (氯氣)"},"answer":"C","id":3733,"manualChapter":"CH53","matchedChapters":["CH53"]},{"source":"EMT-P 第 52 章 P.1440","question":"災難檢傷區的主要目的為何？","options":{"A":"決定脫困的優先順序及給予傷患","B":"決定醫療優先順序或後送優先順序","C":"初次辨識死者身份","D":"給予救護處置"},"answer":"B","id":3734,"manualChapter":"CH52","matchedChapters":["CH52"]},{"source":"EMT-P 第 55 章 P.1505","question":"耐力型馬拉松選手若在賽後出現頭暈、噁心並伴隨肌肉抽筋，但已排除熱衰竭，救護人員應警覺是否為哪種情況？","options":{"A":"高鉀血症","B":"低血糖","C":"腦震盪","D":"運動型低血鈉"},"answer":"D","id":3735,"manualChapter":"CH55","matchedChapters":["CH55"]},{"source":"EMT-P 第 58 章 P.1572","question":"在相同的壓力條件下，氣體的體積與溫度成正比，如果壓力條件不變，則環境的溫度上升，氣體的體積會隨溫度的升高而膨脹，是什麼定律？","options":{"A":"查理定律。","B":"波以耳定律。","C":"亨利定律。","D":"道爾頓定律。"},"answer":"A","id":3736,"manualChapter":"CH58","matchedChapters":["CH58"]},{"source":"EMT-P 第 53 章 P.1466","question":"某輻射災害事故，部分患者灼燙傷皮膚外觀呈蒼白色澤，似乎感受不到痛覺；部分患者肢體對刺激有超乎預期且不成比例的疼痛。試問現場有可能為何種輻射？","options":{"A":"中子束","B":"伽瑪射線 γ rays","C":"β粒子","D":"α粒子"},"answer":"B","id":3737,"manualChapter":"CH53","matchedChapters":["CH53"]},{"source":"EMT-P 第 53 章 P.1457","question":"某日傍晚，一輛運送化學物質的槽車在公路上發生車禍並起火燃燒，救護人員（EMT-P）獲報前往現場救援。現場有數名傷患倒地，且槽車上有明顯的菱形「危險物運輸標示」及聯合國物質編號（UN number）。在未知該化學物質具體特性的情況下，若救護人員欲進入現場「熱區（紅區）」進行緊急救護工作，下列敘述何者錯誤？？","options":{"A":"救護人員必須穿著A級之防護衣，若尚未確定化學氣體種類或無法確定安全，應穿著 A 級防護衣才能進入熱區。","B":"消防隊員若僅穿著日常消防工作服（免責實裝/救災服）並背負自給式呼吸設備（SCBA），因已具備最高等級之呼吸保護，可直接等同於毒化災 B 級以上的充足皮膚與黏膜防護，安全無虞。","C":"現場管制應依事故地點遠近及風向考量，劃分為熱區（紅區）、暖區（黃區）及冷區（綠區），且救護人員應小心地從「上風高處」接近事件現場。","D":"對於熱區內生命徵象不穩定（如失去呼吸、脈搏）的疑似化災傷患，原則上應「先救命、再除污」，快速將傷患移出污染區至安全空氣處，並在緊急狀況下以脫除全身衣物的方式進行初步除污與急救。"},"answer":"B","id":3738,"manualChapter":"CH53","matchedChapters":["CH53"]},{"source":"EMT-P 第 58 章 P.1572","question":"40 歲阿伯在偏遠離島因嚴重的「腸阻塞」併發腸穿孔，急需由民用航空業者派遣醫療專機轉診至本島醫學中心進行緊急手術。在飛行前，高級救護技術員已為阿伯完成氣管內管（ETT）插管，並置入鼻胃管（NG）與導尿管。當航機從海平面高度爬升至巡航高度時，阿伯突然主訴腹部脹痛劇烈，且呼吸變得急促、呼吸器顯示氣道壓力（Airway Pressure）顯著上升。根據教科書第 58 章所述，下列關於此現象的病生理分析與醫療決策，何者最為正確？","options":{"A":"根據「查理定律 (Charles's Law)」，高空低溫導致氧氣瓶內的氧氣分子收縮，造成氧氣讀數誤判而使病人缺氧，應立即將氧氣流量調高 1.5 倍。","B":"根據「道爾頓定律 (Dalton's Law)」，氧分壓隨高度上升而下降，引發組織缺氧，此時應要求飛行員下降至海平面壓力高度 (Sea Level Flight) 飛行。","C":"根據「波以耳定律 (Boyle's Law)」，隨高度上升氣壓下降，阿伯腸道內與氣管內管氣囊 (Cuff) 的氣體發生膨脹；應立即抽吸鼻胃管釋放腸內壓力，並使用「氣囊壓力監測計」調整氣囊壓力，以防氣管受損。","D":"根據「亨利定律 (Henry's Law)」，此現象為溶解在血液中的氮氣因壓力變小而變成氣泡，引發「高空減壓症」，應立即靜脈注射大量生理食鹽水以預防休克。"},"answer":"C","id":3739,"manualChapter":"CH58","matchedChapters":["CH58"]},{"source":"EMT-P 第 54 章 P.1492","question":"關於舉辦大型活動，請問熱中暑危險係數大於多少，主辦單位必須停止活動？","options":{"A":"38","B":"39","C":"40","D":"41"},"answer":"C","id":3740,"manualChapter":"CH54","matchedChapters":["CH54"]},{"source":"EMT-P 第 53 章 P.1449","question":"依據我國現行《毒性及關注化學物質管理法》，主管機關將毒性化學物質劃分為四大類。下述關於各類毒化物之定義與病理生理機轉之敘述，何者最適當？","options":{"A":"第一類毒化物為在環境中不易分解或會產生生物堆積者","B":"第二類毒化物為曝露後立即會危害人體生命安全者","C":"第三類毒化物為具有致癌性或導致基因突變與慢性疾病者","D":"第四類毒化物為放射性物質意外事件造成之安全危害者"},"answer":"A","id":3741,"manualChapter":"CH53","matchedChapters":["CH53"]},{"source":"EMT-P 第 57 章 P.802","question":"關於地震引起的壓傷症候群，下列何種物質釋放是導致病人腎衰竭的主因？","options":{"A":"乳酸","B":"鉀離子","C":"尿酸","D":"肌紅蛋白"},"answer":"D","id":3742,"manualChapter":"CH57","matchedChapters":["CH57"]},{"source":"EMT-P 第 54 章 P.1485","question":"路跑活動當日活動區域之預測空氣品質指標達多少時，主辦單位應停止活動？","options":{"A":"151","B":"125","C":"101","D":"75"},"answer":"A","id":3743,"manualChapter":"CH54","matchedChapters":["CH54"]},{"source":"EMT-P 第 57 章 P.1553","question":"天然災害中，有許多因素影響傷亡數目，哪個選項錯誤","options":{"A":"地震強度","B":"海水倒灌","C":"地震發生的時間","D":"天候因素"},"answer":"B","id":3744,"manualChapter":"CH57","matchedChapters":["CH57"]},{"source":"EMT-P 第 55 章 P.1503","question":"柔道與角力選手因其耳翼與地面反覆摩擦出血導致的特徵俗稱為何？","options":{"A":"兔耳朵","B":"外耳道炎","C":"菜花耳","D":"招風耳"},"answer":"C","id":3745,"manualChapter":"CH55","matchedChapters":["CH55"]},{"source":"EMT-P 第 56 章 P.1533","question":"在「熱區」執行救護的主要目標是什麼？","options":{"A":"進行詳細的病人全身評估與病史詢問","B":"建立進階呼吸道並給予藥物治療","C":"脫離危險環境、減低傷亡、讓應變人員消除威脅","D":"執行複雜的外交與法律程序"},"answer":"C","id":3746,"manualChapter":"CH56","matchedChapters":["CH56"]},{"source":"EMT-P 第 54 章 P.1485","question":"下列關於路跑活動敘述何者錯誤？","options":{"A":"熱中暑危險係數 = 室外溫度(°C) + 室外相對濕度(%)x0.1","B":"熱中暑危險係數大於35者，主辦單位應設置冷水槽、防水帆布、碎冰或其他降溫設備","C":"熱中暑危險係數大於 50者，主辦單位應停止活動。","D":"路跑活動當日活動區域之預測空氣品質指標(AQI)達151以上時，主辦單位宜停止活動。"},"answer":"C","id":3747,"manualChapter":"CH54","matchedChapters":["CH54"]},{"source":"EMT-P 第 54 章 P.1491","question":"關於大型活動醫療配置原則，下列何者最能反映「風險導向」概念？","options":{"A":"所有路段平均配置相同資源","B":"依主辦單位預算隨機調整","C":"對高風險區域增加醫療人力與設備","D":"僅配置終點醫療站"},"answer":"C","id":3748,"manualChapter":"CH54","matchedChapters":["CH54"]},{"id":3749,"source":"TP題庫","question":"下列針對理學檢查扣診回音特性的配對，何者正確?","options":{"A":"肋膜腔積液：濁音","B":"大葉性肺炎：濁音","C":"大量氣胸：共鳴過度","D":"慢性支氣管炎：鼓音"},"answer":"B","manualChapter":"CH20","matchedChapters":["CH20"]},{"source":"TP題庫","question":"下列哪項病徵的脈搏壓不會變寬?","options":{"A":"早期敗血症","B":"心臟衰竭","C":"貧血","D":"甲狀腺機能亢進"},"answer":"B","manualChapter":"CH20","matchedChapters":["CH20"],"id":3750},{"source":"TP題庫","question":"下列哪項病徵的脈搏壓不會變窄?","options":{"A":"心包膜填塞","B":"心臟衰竭","C":"肺栓塞","D":"貧血"},"answer":"D","manualChapter":"CH20","matchedChapters":["CH20"],"id":3751,"explanation":"A心臟衰竭：心肌收縮力大幅衰退，每搏輸出量（SV）極低導致收縮壓（SBP）偏低；同時交感神經與 RAAS 系統代償性使周邊血管強烈收縮，舒張壓（DBP）相對維持，造成脈搏壓變窄。\n\n心包膜填塞：心包腔內高壓限制心室舒張充盈（Preload 嚴重受限），每搏輸出量急劇崩跌，為典型狹窄脈壓表現（貝克氏三聯徵常伴隨低收縮壓與脈搏壓變窄）。\n\n肺栓塞：肺動脈主幹或大分支急性阻塞引發急性右心後負荷飆升，右心衰竭導致左心回血量（Preload）銳減，每搏輸出量驟降，伴隨周邊代償性血管收縮，呈現脈搏壓變窄。"},{"source":"TP題庫","question":"量測體溫時所量測的數值高低，下列何者正確?","options":{"A":"肛溫>舌下溫度>腋溫","B":"舌下溫度>腋溫>肛溫","C":"肛溫>腋溫>舌下溫度","D":"腋溫>肛溫>舌下溫度"},"answer":"A","manualChapter":"CH20","matchedChapters":["CH20"],"id":3752},{"source":"TP題庫","question":"下列哪項病徵不會造成低體溫?","options":{"A":"低血糖","B":"嚴重敗血症","C":"甲狀腺功能低下","D":"先天性心臟病"},"answer":"D","manualChapter":"非創傷","matchedChapters":["CH20"],"id":3753,"explanation":"敗血症雖然常以發燒表現，但在年長者、免疫低下族群或新生兒/嬰幼兒身上，常因體溫調節中樞失調、全身血管劇烈擴張導致體熱大量散失，而表現為反常性低體溫（體溫<36度），在 qSOFA / SIRS 診斷標準中即包含低體溫，且低體溫往往代表預後極差。\n\n葡萄糖是大腦下視丘（Hypothalamus）體溫調節中樞及全身骨骼肌顫抖產熱（Shivering）最重要的能量基質。當發生嚴重低血糖時，中樞調節功能停擺且細胞代謝受抑、無法有效產熱，常合併冒冷汗加速體表散熱，極易引發低體溫。\n\n甲狀腺素是主導全身基礎代謝率（BMR）與細胞產熱（Thermogenesis）的關鍵荷爾蒙。甲狀腺功能低下會導致代謝率大幅滑落，最嚴重的情況可併發黏液水腫性昏迷（Myxedema coma），典型特徵即為重度低體溫、心搏過緩與意識改變。"},{"source":"TP題庫","question":"下肢脈搏消失但上肢脈搏仍然清楚的病人，不會考慮下列哪種病因?","options":{"A":"急性腹部主動脈血栓性阻塞","B":"主動脈剝離","C":"敗血症","D":"腹部主動脈瘤破裂"},"answer":"C","manualChapter":"CH20","matchedChapters":["CH20"],"id":3754},{"id":3755,"source":"TP題庫","question":"下列何者不會造成低血氧?","options":{"A":"肺栓塞","B":"肺炎","C":"DKA","D":"心臟衰竭"},"answer":"C","manualChapter":"非創傷","matchedChapters":["CH20"],"explanation":"DKA 本質上是代謝性疾病，因體內酮酸大量堆積導致嚴重的高陰離子間隙代謝性酸中毒（Metabolic acidosis）。病患最典型的臨床表現為庫斯毛耳氏呼吸（Kussmaul breathing，深且快的代償性換氣），目的是將體內的過量CO2排出以提高血液 pH 值。除非合併吸入性肺炎、急性肺水腫或敗血症引發的 ARDS，否則單純的 DKA 患者肺泡氣體交換功能完全正常，肺泡與動脈血氧分壓皆足夠，血氧飽和度（SpO2 / PaO2）通常是正常甚至偏高的，不會直接造成低血氧。\n\n其他選項會造成低血氧的原因：\n心臟衰竭：左心衰竭會引發肺靜脈壓力上升及肺微血管滲出，導致急性肺水腫。肺泡充斥液體妨礙氣體擴散，並造成通氣/血流比例失衡（V/Q mismatch 與 Shunt），引起顯著低血氧。\n肺炎：肺泡內充滿炎性滲出物、濃稠分泌物與實質化（Consolidation），導致灌流的血液無法接觸新鮮空氣，形成嚴重的肺內分流（Intrapulmonary shunt），是臨床上造成低血氧的常見原因。\n肺栓塞：血栓阻塞肺動脈分支後，該區域有通氣卻無血液灌流（形成無效腔死腔），其餘肺組織因血流代償性過度灌注而產生顯著的 V/Q 比例不均（V/Q mismatch），伴隨反射性肺泡塌陷與動靜脈分流，引起急性突發性低血氧。"},{"id":3756,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"50歲男性，通報意識不清，現場發現全身冒汗且呼吸明顯有雜音，血壓160/80 mmHg、脈搏70次/分鐘、呼吸26次/分鐘、體溫36.5°C，血氧濃度92%，GCS: E3V4M5，雙側瞳孔大小1mm且對光有反應。身旁有一罐名為達馬松的農藥空罐，依你對藥理學的認識，下列敘述何者為非？","options":{"A":"病患的血壓偏高是由於菸鹼受體（nicotinic receptor）受到毒物的作用。","B":"病患的瞳孔偏小是由於蕈毒鹼受體（muscarinic receptor）受到毒物的作用。","C":"病患全身冒汗且呼吸有雜音是由於菸鹼受體（nicotinic receptor）受到毒物的作用。","D":"可以給予Atropine作為解毒劑，用以緩解毒物對呼吸道的影響。"},"answer":"C","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":3757,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"以下有關骨折及脫臼部位合併之常見周邊神經損傷，何者為非？","options":{"A":"肘關節脫臼→尺神經。","B":"遠端肱骨骨折→橈神經。","C":"膝關節脫臼→腓神經。","D":"髖關節脫臼→坐骨神經。"},"answer":"C","manualChapter":"CH30","matchedChapters":["CH30"]},{"question":"當病人生急性心肌梗塞時，因心肌細胞壞死會將特定酵素釋放至血液中。下列哪一項「不屬於」目前台灣醫院在急診或臨床上最常用於評估此類心肌損傷的血清檢查項目？","options":{"A":"肌酸酐磷酸酵素 (Creatine Phosphokinase, CPK)","B":"CPK的同位酵素 CK-MB","C":"腦鈉肽 (Brain Natriuretic Peptide, BNP)","D":"肌鈣蛋白 (Troponin-C, Troponin-T)"},"answer":"C","manualChapter":"CH34","source":"TPP","id":3758,"matchedChapters":["CH34"]},{"question":"不規則心搏過速中，病人Atrial fibrillation超過幾個小時？會增加形成血栓的風險，不建議電擊或藥物整流。","options":{"A":"9小時","B":"24小時","C":"36小時","D":"48小時"},"answer":"D","manualChapter":"CH33","source":"TPP","id":3759,"matchedChapters":["CH33"]},{"question":"一名患者因高燒、肌肉痠痛、出血傾向就醫，經檢驗確認感染 伊波拉病毒感染症 (Ebola virus disease) ，依我國法定傳染病分類及通報規定，下列何者正確？","options":{"A":"屬第五類法定傳染病，應於24小時內通報","B":"屬第五類法定傳染病，應於7日內通報","C":"屬第一類法定傳染病，應立即通報並採取嚴格隔離","D":"不需通報，僅症狀治療即可"},"answer":"A","manualChapter":"CH42","source":"TPP","id":3760,"matchedChapters":["CH42"]},{"question":"下列有關內分泌系統名稱的描述，何者錯誤？","options":{"A":"昇糖素：一種由胰臟胰島β細胞分泌出的荷爾蒙，能將肝臟中的肝醣轉化為葡萄糖。","B":"高滲透壓高血糖症候群(Hyperosmolar Hyperglycemic Syndrome，HHS)：由於高血糖造成血液中的高滲透性，且通常酮體數值正常或稍微偏高，並導致細胞內脫水及後續休克、昏迷之糖尿病急症。","C":"糖尿病酮酸血症(Diabetic Ketoacidosis，DKA)：會危及生命的急性糖尿病併發症，其特徵為高血糖，脫水，電解質不平衡和游離脂肪酸的分解所引起的酸中毒。","D":"妊娠期糖尿病(Gestational diabetes mellitus GDM)：因妊娠期間體內激素變化影響胰島素作用而產生的糖尿病，通常在分娩後消退，但病人日後罹患糖尿病的風險較一般人高。"},"answer":"A","manualChapter":"CH37","source":"TPP","id":3761,"matchedChapters":["CH37"]},{"question":"在「救急救難一站通」的主要功能中，哪一項是為了確保醫院急診與到院前救護的檢傷標準一致？","options":{"A":"輔助五級檢傷系統","B":"視訊指導功能","C":"醫療指導醫師資訊整合系統","D":"標準化電子病歷"},"answer":"A","manualChapter":"CH04","source":"TPP","id":3762,"matchedChapters":["CH04"]},{"question":"心房顫動時，心房電活動可能非常快速且混亂，甚至達每分鐘600下。正常情況下，心室不會完全效頻此速度收縮，主要原因為何？","options":{"A":"心室肌完全不會接受來自心房的任何訊號","B":"竇房結會阻止所有心房訊號傳入心室","C":"房室結具有生理性傳導延遲及不反應期，可阻擋部分訊號往下傳","D":"浦金氏纖維會將心房電活動全部轉變為正常竇性節律"},"answer":"C","manualChapter":"CH33","source":"TPP","id":3763,"matchedChapters":["CH33"]},{"question":"有關胰島素(Insulin)的生理功能與缺乏時的影響，下列何者正確？","options":{"A":"胰島素主要由胰臟α細胞分泌，其功能為提高血糖濃度","B":"腦細胞對葡萄糖的利用高度依賴胰島素，因此缺乏胰島素時腦細胞無法獲得能量","C":"當胰島素嚴重不足時，脂肪大量分解產生酮體，可能導致酸中毒與昏迷","D":"肌肉肝醣可直接轉換成葡萄糖供全身各器官利用"},"answer":"C","manualChapter":"CH37","source":"TPP","id":3764,"matchedChapters":["CH37"]},{"question":"心律調節器 (Pacemaker) 若出現「輸出故障 (Failure to Pace)」，心電圖會觀察到下列何者異常？","options":{"A":"異常多起搏點","B":"找不到起搏脈衝且心率緩慢","C":"QRS波過寬","D":"多導程ST節段上升"},"answer":"B","manualChapter":"CH51","source":"TPP","id":3765,"matchedChapters":["CH51"]},{"question":"有關兒童(Child)與成人在解剖構造及生理功能上的相異性，關於高級救護技術員的到院前臨床處置考量，下列敘述何者最適當？","options":{"A":"小於三歲的孩童因枕部較為突出，平躺時需於肩膀下方放置捲筒狀薄毯以維持呼吸道暢通","B":"兒童呼吸道最狹窄的位置與成人相同，皆位於聲帶發育不健全的環狀軟骨上方聲門處","C":"兒童肋骨含有較少的軟骨且膠質比例極低，故胸部遭受鈍傷時非常容易發生多發性肋骨骨折","D":"一歲以下之嬰兒在評估循環與脈搏速率時，應以頸動脈作為第一線最安全且最優先的觸摸部位"},"answer":"A","manualChapter":"CH48","source":"TPP","id":3766,"matchedChapters":["CH48"]},{"question":"對於中重度低體溫病人發生心室顫動，到院前急救應如何考慮電擊次數？","options":{"A":"每2分鐘電擊一次，直到恢復心律","B":"嚴格禁止使用任何型式的電擊規範中允許嘗試初步電擊。","C":"電擊一次後，第二次電擊原則應延後","D":"連續電擊三次，無效後即停止復甦"},"answer":"C","manualChapter":"CH44","source":"TPP","id":3767,"matchedChapters":["CH44"]},{"question":"對於體內中樞溫度接收器的敘述，下列何者錯誤？","options":{"A":"是對溫度改變非常敏感的神經元，直接對血液溫度的改變產生反應","B":"這些神經元由中樞神經系統送訊息到骨骼肌","C":"經由交感神經輸出訊號到皮膚的小血管、汗腺及腎上腺皮質","D":"影響血管的張力、出汗、代謝速率。維持體溫在攝氏37度左右"},"answer":"C","manualChapter":"CH44","source":"TPP","id":3768,"matchedChapters":["CH44"]},{"question":"下列哪種物質中毒時，給予活性碳 (Activated charcoal) 是無效且不被建議？","options":{"A":"阿斯匹林 (Aspirin)","B":"鴉片類藥物 (Opioids)","C":"甲醇 (Methanol)","D":"三環抗憂鬱劑 (TCA)"},"answer":"C","manualChapter":"CH50","source":"TPP","id":3769,"matchedChapters":["CH50"]},{"question":"為肺部進行通氣，是新生兒急救術中最重要及有效的急救步驟*新生兒須接受正壓呼吸的適應症，何者適當？","options":{"A":"呼吸暫停 (apnea)","B":"呼吸窘迫致瀕死式呼吸 (gasp)","C":"心跳小於100下每分鐘","D":"以上皆正確"},"answer":"D","manualChapter":"CH48","source":"TPP","id":3770,"matchedChapters":["CH48"]},{"question":"教材中提到的「CHAMP」記憶口訣，主要用於判斷哪些碳氫化合物食入後可能需要考慮洗胃？","options":{"A":"強酸、強鹼與醇類混合物","B":"含有重金屬、芳香環或殺蟲劑成分的碳氫化合物","C":"僅限於醫療用的液態石蠟","D":"低黏稠度、高揮發性的所有家用油類"},"answer":"B","manualChapter":"CH50","source":"TPP","id":3771,"matchedChapters":["CH50"]},{"question":"新生兒急救流程中，所謂的「黃金1分鐘」是指在出生後缺氧且心跳小於每分鐘100下，需於多久應開始給予正壓通氣？","options":{"A":"出生後30秒內","B":"心跳停止後1分鐘","C":"出生後1分鐘內","D":"完成胸部按壓後1分鐘"},"answer":"C","manualChapter":"CH48","source":"TPP","id":3772,"matchedChapters":["CH48"]},{"question":"在野外急救環境中，當高級救護技術員完成初級評估並針對傷患最嚴重的脊椎損傷風險時，關於後續執行「詳細地脊椎檢測」的適當時機，下列敘述何者最適當？","options":{"A":"應於患者評估系統 (PAS) 中的二次評估之後再行執行","B":"在給予高劑量抗生素靜脈注射滿二十四小時後再行執行","C":"應在接觸傷患的第一秒鐘，與暢通呼吸道同時強制執行","D":"只需在傷患由直升機吊掛撤退並安全抵達急診室後才執行"},"answer":"A","manualChapter":"CH45","source":"TPP","id":3773,"matchedChapters":["CH45"]},{"question":"在野外執行長時間病人照護 (PFC) 時，針對眼部穿刺異物的處置，下列原則何者正確？","options":{"A":"若病人需自行步行撤離，應同時包覆兩眼以減少眼球連動產生的再傷害。","B":"不論運送方式為何，均應立即將穿刺異物移除以減少眼球風阻並清創。","C":"固定異物後應將另一隻眼睛一起包覆，但前提是病人由他人搬運且隨時有人在旁。","D":"在擔架內運送時，應使用眼罩來限制病人頭部轉動，避免眼部異物晃動。"},"answer":"C","manualChapter":"CH45","source":"TPP","id":3774,"matchedChapters":["CH45"]},{"question":"請病人說「啊」，然後觀察懸雍垂有無偏向及軟顎上升是否對稱。以上描述是測試哪一對腦神經?","options":{"A":"第九對，舌咽神經","B":"第十對，迷走神經","C":"第十一對，副神經","D":"第十二對，舌下神經"},"answer":"B","manualChapter":"CH20","source":"TP題庫","id":3775,"matchedChapters":["CH20"]},{"question":"要求病人轉頭與聳肩，分別觀察病人的胸鎖乳突肌及斜方肌功能是測試哪一對腦神經?","options":{"A":"第九對，舌咽神經","B":"第十對，迷走神經","C":"第十一對，副神經","D":"第十二對，舌下神經"},"answer":"C","manualChapter":"CH20","source":"TP題庫","id":3776,"matchedChapters":["CH20"]},{"question":"下列關於「出血」的敘述，何者正確？","options":{"A":"靜脈出血的失血速度最快，最不容易止血","B":"內出血因為血液流失於體腔內，較難從外觀判斷，通常有較高的致死率","C":"大部分外出血無法透過直接加壓方式止血","D":"微血管出血通常會快速噴濺，難以透過人體凝血機轉止血"},"answer":"B","manualChapter":"CH26","source":"AI出題","id":3777,"matchedChapters":["CH26"]},{"question":"人體受傷後的凝血機制是一個複雜的化學反應，下列關於凝血基本步驟的順序，何者正確？","options":{"A":"凝血酶原活化因子形成 → 凝血酶原轉化為凝血酶 → 纖維蛋白原轉換為纖維蛋白絲","B":"凝血酶轉化為凝血酶原 → 凝血酶原活化因子形成 → 纖維蛋白絲轉換為纖維蛋白原","C":"纖維蛋白原轉換為纖維蛋白絲 → 凝血酶原轉化為凝血酶 → 凝血酶原活化因子形成","D":"凝血酶原轉化為凝血酶 → 纖維蛋白原轉換為纖維蛋白絲 → 凝血酶原活化因子形成"},"answer":"A","manualChapter":"CH26","source":"AI出題","id":3778,"matchedChapters":["CH26"]},{"question":"當外傷病人因失血過多，身體的代償機制已無法負荷，此時「血壓開始下降（收縮壓下降、脈搏壓變小）」，心輸出量更低，意識狀態變差，這屬於休克的哪一個分期？","options":{"A":"代償性休克","B":"失償性休克","C":"不可逆休克","D":"神經性休克"},"answer":"B","manualChapter":"CH26","source":"AI出題","id":3779,"matchedChapters":["CH26"]},{"question":"目前對於嚴重外傷出血病患的「控制性急救輸液（或稱允許性低血壓，Permissive hypotension）」，其主要目的為何？","options":{"A":"快速將血壓拉高至正常值，以確保所有器官的絕對灌流","B":"完全不給予任何點滴輸液，以免造成低體溫","C":"藉由維持比正常稍微低的血壓，避免過高血壓沖刷掉剛形成的血塊而造成再度大出血","D":"利用大量晶質液稀釋血液，以促進凝血因子的生成"},"answer":"C","manualChapter":"CH26","source":"AI出題","id":3780,"matchedChapters":["CH26"]},{"question":"一名車禍病患受困於車內，雙側大腿嚴重變形，腹部有大面積瘀傷。病患表現出：意識模糊、皮膚濕冷蒼白、呼吸 30 次/分、脈搏 135 次/分、血壓 80/50 mmHg。在到院前的處置中，下列哪一項作法「最不適當」？","options":{"A":"優先考量其為低血容性休克，應利用骨盆固定帶或長背板等器材固定患肢，減少骨折造成的二次傷害與內出血。","B":"若建立靜脈管路，應給予大量且快速的林格氏乳酸溶液（>3公升），直到其血壓恢復至 120/80 mmHg 以上，以確保腦部灌流。","C":"可考慮在受傷後 3 小時內，給予靜脈注射傳明酸（TXA）1公克，以抑制纖維蛋白分解，減少血塊崩解。","D":"應積極預防病患失溫，若需要輸注晶質液，應盡可能將輸液預先加熱至 39℃。"},"answer":"B","manualChapter":"CH26","source":"AI出題","id":3781,"matchedChapters":["CH26"]},{"question":"戰術或緊急醫療中常使用各類「止血敷料（Hemostatic Dressing）」來處理軀幹交界處或深部傷口的嚴重出血。關於這些敷料的作用機制與特性，下列敘述何者正確？","options":{"A":"QuikClot（第一代）是由沸石（Zeolite）製成，藉由快速吸收血液中的水分使血液濃稠，但在吸水過程中會產生放熱反應，有導致灼傷的風險。","B":"Celox 是由甲殼素（Chitosan）製成，其主要作用原理是透過活化血纖維蛋白溶解酶，加速血塊崩解。","C":"TraumaDEX 屬於強效的化學血管收縮劑，會劇烈收縮動脈，因此使用時需嚴格監測病患的中心血壓。","D":"X-stat 是一種粉狀的傳明酸製劑，專門設計用於大面積的淺層擦傷。"},"answer":"A","manualChapter":"CH26","source":"AI出題","id":3782,"matchedChapters":["CH26"]},{"question":"在休克發展的「第二期：微血管及小靜脈舒張」階段，微循環會發生顯著的變化。下列對於此階段生理機制的描述，何者最精確？","options":{"A":"小動脈前的動靜脈分流血管（arteriovenous shunt）大量打開，血液完全不經過微血管而直接進入靜脈端。","B":"微血管前括約肌舒張，導致微血管內容積相對增加，血液淤滯於微血管及小靜脈，使靜脈回流量降低。","C":"組織內 pH 值上升，導致微血管通透性降低，進而將大量水分保留在血管內。","D":"微血栓開始大量形成，消耗體內凝血因子，直接導致多重器官衰竭。"},"answer":"B","manualChapter":"CH26","source":"AI出題","id":3783,"matchedChapters":["CH26"]},{"question":"關於小兒外傷的呼吸道與通氣處置，下列敘述何者最為正確？","options":{"A":"嬰兒平躺時因後腦勺較為平坦，為維持頸椎中立，應在頸部下方墊高 2-3 公分。","B":"兒童舌頭占口腔比例較大，若無意識且無嘔吐反射，置入口咽呼吸道時應先反向插入再旋轉 180 度。","C":"體重小於 30 公斤的兒童，建議使用兒童專用的甦醒球，以避免過度通氣導致胃脹氣或張力性氣胸。","D":"針對 10 歲兒童，若無法進行氣管插管，首選的救援呼吸道處置為針刺環甲膜切開術。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3784,"matchedChapters":["CH32"]},{"question":"關於小兒休克與循環評估，下列敘述何者最不適當？","options":{"A":"兒童的血循代償能力佳，在休克初期血壓通常不會改變，直到流失超過 45% 的血量才會出現明顯低血壓。","B":"對於兒童外傷出血性休克，初始輸液急救建議給予溫熱靜脈輸液，劑量為每公斤 20 毫升。","C":"嬰兒因為顱骨縫尚未閉合，大量的顱內出血可能導致低血容性休克，這點與成人單純頭部外傷不同。","D":"兒童發生張力性氣胸時，因胸廓較具彈性，針刺減壓的位置與成人相同，皆為腋前線第五肋間。"},"answer":"D","manualChapter":"CH32","source":"AI出題","id":3785,"matchedChapters":["CH32"]},{"question":"關於兒童神經學與暴露評估，下列敘述何者正確？","options":{"A":"4歲以下兒童的 GCS 評估中，最佳運動反應（M）的給分標準與成人完全不同，需依據其哭鬧程度判斷。","B":"兒童體表面積與體重比率較高，且皮下組織較薄，容易快速失溫，在初步評估暴露後必須立即保暖。","C":"評估兒童灼傷面積時，因兒童軀幹比例較大，故採用九則算法（Rule of Nines）比隆德-布勞德圖更準確。","D":"若 1 歲嬰兒遭受嚴重頭部鈍傷，因其囟門未閉合，顱內壓升高的早期症狀會比成人更早、更明顯出現。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3786,"matchedChapters":["CH32"]},{"question":"隨著年紀增長，老年人生理機能退化會影響外傷的評估與預後。下列關於老年外傷病人生理變化的敘述，何者正確？","options":{"A":"老年人心血管系統退化，血管硬化導致脈壓平時較窄，這會使休克初期的脈壓縮小症狀更為明顯。","B":"腦部萎縮使得大腦與顱骨之間空間增加，發生硬腦膜下出血時，症狀可能相對輕微或延遲出現。","C":"由於腎臟功能退化，給予大量輸液急救時，老年人能更快速排出多餘水分，不易發生肺水腫。","D":"肌肉量減少使得發抖產熱能力降低，但因為皮下脂肪較厚，老年外傷病人反而不易發生低體溫。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3787,"matchedChapters":["CH32"]},{"question":"在評估老年外傷病人時，用藥史是一個極為重要的關鍵。下列哪一種藥物與其潛在風險的配對「最不相關」？","options":{"A":"乙型交感神經阻斷劑（Beta-blockers）－ 掩蓋出血性休克初期的心搏過速代償反應。","B":"抗凝血劑（如 Warfarin）－ 輕微頭部外傷也可能導致嚴重的延遲性顱內出血。","C":"降血壓藥物－ 導致姿勢性低血壓，成為老人跌倒受傷的潛在原因。","D":"氣管擴張劑－ 導致老年人對疼痛的敏感度大幅降低，掩蓋骨折症狀。"},"answer":"D","manualChapter":"CH32","source":"AI出題","id":3788,"matchedChapters":["CH32"]},{"question":"孕婦在懷孕期間的生理變化，對外傷的耐受度與臨床表現有顯著影響。下列敘述何者「錯誤」？","options":{"A":"懷孕期間母體血量會增加近 50%，因此在出現休克症狀前，可能已經流失相當大量的血液。","B":"第三孕期的孕婦若平躺，膨脹的子宮會壓迫下腔靜脈，導致靜脈回流減少、心輸出量下降而產生低血壓。","C":"胎兒的血液循環優先於母體，當母體失血時，會先犧牲母體周邊血管灌流以維持胎盤的血液供應。","D":"懷孕期間呼吸道黏膜微血管會擴張導致水腫，加上腸胃蠕動變慢，使得孕婦發生呼吸道阻塞及吸入性肺炎的風險增加。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3789,"matchedChapters":["CH32"]},{"question":"針對懷孕晚期（第三孕期）孕婦的外傷急救處置，下列哪一項操作「最不適當」？","options":{"A":"若孕婦因車禍導致頸椎受傷疑慮，使用長背板固定時，應在長背板右側墊高 10~15 公分，使孕婦向左側傾斜。","B":"評估孕婦的呼吸與血氧時，若血氧偏低，應給予高濃度氧氣，目標是維持血氧濃度在 95% 以上，以確保胎兒供氧。","C":"孕婦發生低血容性休克時，因胎兒心跳變化比母體血壓變化晚發生，故應以母體血壓下降作為判斷胎兒窘迫的早期指標。","D":"若孕婦無法翻身，救護技術員可嘗試用雙手將其子宮向左側推移，以減緩對下腔靜脈的壓迫。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3790,"matchedChapters":["CH32"]},{"question":"Broselow 量尺（急救測量尺）是兒科急診常用的工具。關於其使用及兒童體重估算，下列敘述何者最精確？","options":{"A":"Broselow 量尺是直接測量兒童的體重，以決定急救藥物的劑量。","B":"研究指出，對於年齡小於 1 歲的嬰兒，使用「新版 APLS 公式」估算體重的準確度，優於最佳猜測法（Best Guess）。","C":"在肥胖率高的族群中，基於身高的估算方法（如 Broselow 量尺）通常會高估兒童的實際體重。","D":"兒童氣管內管的尺寸選擇，若使用 Broselow 量尺評估，通常無法同時建議相對應的喉頭鏡葉片尺寸。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3791,"matchedChapters":["CH32"]},{"question":"關於親密伴侶暴力（Intimate Partner Violence, IPV）的辨識與處置，身為第一線救護人員，下列哪種情況「最不」應被視為疑似暴力的潛在警訊？","options":{"A":"病人對自己受傷的過程輕描淡寫，且描述的受傷機轉與實際傷勢嚴重程度明顯不符。","B":"病人的伴侶堅持在整個面談和身體檢查過程中陪同，並主導大部分的對話與回答。","C":"孕婦發生外傷，但傷勢僅集中或單獨出現在腹部。","D":"病人主動詳細說明跌倒的每個細節，且伴侶在旁表現出適度的焦慮與關心。"},"answer":"D","manualChapter":"CH32","source":"AI出題","id":3792,"matchedChapters":["CH32"]},{"question":"一名 75 歲男性從樓梯上摔落，意識清醒，主訴胸痛與右髖部疼痛。過去病史有高血壓（平時收縮壓約 160 mmHg）並規律服用藥物。現場測量血壓為 110/70 mmHg，心跳 85 次/分。關於這名病患的評估，下列何者「最不適當」？","options":{"A":"病患的收縮壓為 110 mmHg，在大眾標準屬正常範圍，因此可初步排除出血性休克的可能性。","B":"考慮到病患平時的高血壓，目前的 110 mmHg 可能已經代表他正處於低血容性休克的狀態。","C":"病患的心跳正常（85 次/分），可能是因為服用了乙型交感神經阻斷劑，抑制了代償性心跳加快的反應。","D":"老年人的胸廓彈性較差，即使是相對低能量的跌倒，也極有可能造成肋骨骨折甚至心臟挫傷。"},"answer":"A","manualChapter":"CH32","source":"AI出題","id":3793,"matchedChapters":["CH32"]},{"question":"小兒急救時，呼吸道的處置至關重要。下列關於兒童呼吸道特徵的描述，哪一項「不正確」？","options":{"A":"兒童的會厭較長且較大，插管時常需留意會厭可能遮擋聲門視線。","B":"嬰幼兒呼吸道最狹窄的部位是環狀軟骨處，而非像成人一樣位於聲門（聲帶）處。","C":"兒童的氣管較短，若插管過深，極容易滑入左側支氣管，造成右側肺部塌陷。","D":"嬰兒主要依賴鼻子呼吸，若鼻腔被分泌物阻塞，可能會迅速導致嚴重的呼吸窘迫。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3794,"matchedChapters":["CH32"]},{"question":"兒童在外傷時若發生張力性氣胸，其臨床表現與成人有所不同。下列哪項原因最能解釋此差異？","options":{"A":"兒童肺部容積較小，氣胸不易造成縱膈腔偏移。","B":"兒童胸廓較柔軟，張力性氣胸易導致心血管衰竭，在正壓通氣時需特別提高警覺。","C":"兒童心肌收縮力較強，對張力性氣胸引起的靜脈回流減少有完全的代償作用。","D":"兒童發生氣胸時，橫膈膜會自動下移代償，因此不會出現呼吸急促的症狀。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3795,"matchedChapters":["CH32"]},{"question":"孕婦發生嚴重車禍外傷，在進行心肺復甦術（CPR）時，下列處置何者「錯誤」？","options":{"A":"應盡量將孕婦左側傾斜，或以手將子宮向左推，以解除下腔靜脈壓迫。","B":"由於孕婦橫膈膜上移，按壓胸部的位點應比一般成人稍微偏下一至兩指幅。","C":"孕婦發生 OHCA，若符合適應症，母體仍可正常使用 AED 進行電擊去顫。","D":"孕婦的需氧量增加且肺容積減少，急救過程中的通氣支持與給氧極為重要。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3796,"matchedChapters":["CH32"]},{"question":"關於老年人頭部外傷的特點，下列敘述何者正確？","options":{"A":"老年人腦部萎縮，硬腦膜外出血（EDH）發生的機率大幅增加。","B":"由於顱內空間增加，發生硬腦膜下出血（SDH）時，病人很快就會出現明顯的顱內壓增高症狀。","C":"老年人經常合併失智或聽力、視力障礙，使得判斷意識改變是因為急性外傷還是慢性退化變得困難。","D":"老年人跌倒造成頭部外傷，最常見的原因為突發性低血糖，故所有老年創傷患者首要處置是給予葡萄糖。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3797,"matchedChapters":["CH32"]},{"question":"有關小兒燒燙傷的評估與處置，下列敘述何者最為適當？","options":{"A":"由於小兒體表面積比例與成人不同，使用「九的法則」估算 2 歲幼童的燒傷面積時，頭部應算為 9%。","B":"兒童體表面積相對於體重較大，燒燙傷後散失液體與體溫的速度極快，因此預防失溫非常重要。","C":"小於 30 公斤的幼童，燒傷輸液急救時不應給予含糖輸液，以免造成高血糖滲透壓利尿。","D":"兒童呼吸道較短，吸入性嗆傷的熱氣不易到達下呼吸道，故幾乎不會引起氣道水腫阻塞。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3798,"matchedChapters":["CH32"]},{"question":"救護人員抵達家庭暴力現場，發現一名女性身上有多處瘀傷。下列哪一項詢問方式或作為「最符合」安全評估與保護病人的原則？","options":{"A":"在其伴侶面前直接詢問：「這些傷是你先生打的嗎？」以觀察伴侶的反應。","B":"趁伴侶不在場時，以不帶評判的語氣詢問：「您目前是否處於即時危險中？是否有安全的地方可以去？」","C":"認為這是家庭私事，只要處理好外傷即可，不需在救護紀錄表上多做註記，以免惹禍上身。","D":"強制要求伴侶離開現場，並警告若不離開將立即以現行犯逮捕。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3799,"matchedChapters":["CH32"]},{"question":"老年人骨骼系統退化對外傷的影響，下列敘述何者錯誤？","options":{"A":"骨質疏鬆使得老年人即使遇到低能量機轉（如平地跌倒），也極易發生骨折。","B":"退行性脊椎疾病（如骨刺、脊椎僵硬）會增加頸椎受傷的風險，搬運時需特別注意固定。","C":"由於神經退化，老年人對疼痛的敏感度增加，輕微的骨折也會引發劇烈的疼痛與休克。","D":"長期駝背或四肢攣縮變形的老年患者，在固定於長背板時，應使用護墊或棉被填補空隙，避免強行拉直。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3800,"matchedChapters":["CH32"]},{"question":"評估一名 1 歲大、體重約 10 公斤的外傷男嬰，發現其心跳 170 次/分、微血管充填時間（CRT） 4 秒、皮膚有大理石斑、血壓 85/50 mmHg、且幾乎無尿。此病患最可能處於下列何種狀態？","options":{"A":"輕度休克（失血量 < 30%）","B":"中度休克（失血量 30% ~ 45%）","C":"重度休克（失血量 > 45%）","D":"神經性休克"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3801,"matchedChapters":["CH32"]},{"question":"當懷孕超過 20 週的孕婦發生創傷而無意識時，在急救處置上「不應該」採用下列哪一種方法？","options":{"A":"為預防吸入性肺炎，若無法插管，使用 BVM 給氧時應備妥抽吸器材。","B":"讓孕婦完全平躺於擔架上，以利心肺復甦術的胸外按壓達到最大深度。","C":"若需使用長背板，可將長背板的右側墊高，使病患呈現左側傾斜。","D":"若無頸椎受傷疑慮，可直接讓孕婦採取左側臥姿，以減少下腔靜脈壓迫。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3802,"matchedChapters":["CH32"]},{"question":"針對特殊外傷族群（小兒、老人、孕婦）的初步評估 XABCDE，下列總結何者最為正確？","options":{"A":"由於解剖生理的差異，這三類族群的初步評估順序應調整為 XCABDE。","B":"在處理小兒致命性大出血（X）時，止血帶的效果通常優於直接加壓，應為首選。","C":"老年人因代償能力差，少量出血即可能引發休克；相對地，兒童代償能力極佳，血壓下降通常是休克晚期（失償）的表現。","D":"孕婦發生車禍時，胎兒受子宮與羊水保護，即使母體休克，胎兒通常也不會受到影響。"},"answer":"C","manualChapter":"CH32","source":"AI出題","id":3803,"matchedChapters":["CH32"]},{"question":"一名 2 歲男童（體重約 12 公斤）在一起嚴重的對撞車禍中被救出，他未正確乘坐安全座椅。病童臉色蒼白、嗜睡且發出呻吟聲。生命徵象：心跳 165 次/分，呼吸 45 次/分，血壓 75/40 mmHg。微血管充填時間（CRT）為 4 秒，皮膚有大理石斑且冰冷，前囟門有膨出跡象。關於此病童的到院前評估與處置，下列敘述何者「最不適當」？","options":{"A":"病童呈現心搏過速、微血管充填時間延長及皮膚大理石斑，且血壓已低於正常值下限，顯示其代償機制可能已失效，處於失償性低血容休克。","B":"嬰幼兒因顱骨縫與囟門未完全閉合，對顱內壓升高的耐受性較大，但大量的顱內出血仍可能成為導致其低血容性休克的主要原因之一。","C":"若嘗試兩次靜脈注射（IV）失敗，應立即考慮建立骨針（IO）途徑，並快速給予 240 mL（20 mL/kg）的溫熱晶質液進行急救復甦。","D":"病童有明顯的意識改變與呼吸窘迫，為了徹底解決呼吸道問題並防止腦壓飆高，應直接在現場實施針頭環甲膜穿刺術（Needle cricothyrotomy）建立呼吸道。"},"answer":"D","manualChapter":"CH32","source":"AI出題","id":3804,"matchedChapters":["CH32"]},{"question":"一名 6 歲女童（體重約 20 公斤）騎腳踏車時遭小客車撞擊。病童意識清醒但極度躁動、大聲哭鬧。她的腹部有一道明顯的橫向挫傷痕跡（類似安全帶勒痕），且主訴胸部劇痛。生命徵象：心跳 140 次/分，呼吸 35 次/分，血壓 100/60 mmHg，血氧 93%。在進行初步評估與處置時，下列哪一項作法「最符合」小兒外傷的處置原則？","options":{"A":"兒童的心理恐懼會加劇生命徵象的不穩定，在處置過程中應盡可能讓父母在場陪伴，有助於減少病童的恐懼和焦慮以利評估。","B":"因病童胸部受創且血氧偏低，若聽診發現單側呼吸音減弱，應立即使用 14 號針頭於腋前線第五肋間進行針刺減壓。","C":"病童的心跳高達 140 次/分，加上腹部有明顯鈍傷痕跡，血壓 100/60 mmHg 顯示其已處於重度休克狀態，應避免給予晶質液，直接要求醫院備血。","D":"評估其意識狀態時，因 6 歲兒童尚無法準確回答人事物等定向感問題，應直接給予 GCS 語言評分（V）最低分 1 分。"},"answer":"A","manualChapter":"CH32","source":"AI出題","id":3805,"matchedChapters":["CH32"]},{"question":"一名 5 個月大的男嬰從火災現場被救出，其整個頭部、臉部、雙臂及前胸腹部皆受到二度燒燙傷。男嬰哭聲微弱，鼻毛有燒焦痕跡且口鼻周圍有碳灰。關於此燒燙傷嬰兒的評估與急救處置，下列敘述何者正確？","options":{"A":"若採用成人的「九的法則（Rule of Nines）」估算，此嬰兒的頭臉部占全身面積為 9%，前軀幹為 18%。","B":"嬰兒體表面積比例與成人不同，頭部占比較大，加上皮膚薄、皮下脂肪少，極易發生嚴重失溫，暴露檢查後必須立刻給予適當包覆保暖。","C":"嬰兒氣道短且狹窄，吸入性嗆傷會迅速導致呼吸道阻塞。若現場無小兒專用氣管內管，應立即執行外科環甲膜切開術（Surgical cricothyroidotomy）。","D":"考量燒傷面積廣大且嬰兒血容量少，應大量且快速灌注常溫的生理食鹽水，且絕對禁止給予含糖輸液以免造成高血糖滲透壓利尿。"},"answer":"B","manualChapter":"CH32","source":"AI出題","id":3806,"matchedChapters":["CH32"]},{"id":3807,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"關於12導程心電圖的判讀，下列敘述何者正確？","options":{"A":"右心房擴大的變化主要為P波變寬(>0.12秒)，形成所謂的P mitrale。","B":"有意義的ST-T波變化必須有連續三個或以上的導程出現變化。","C":"V3、V4導極對應到的心臟解剖位置為左心室側壁。","D":"急性心肌缺血的表現會出現高聳的T波，稱之為hyperacute T。"},"answer":"D","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":3808,"source":"AI出題","question":"對於疑似頸椎受傷的患者，下列哪一項理學檢查徵候最具特異性，可用於評估脊髓損傷？","options":{"A":"格拉斯哥昏迷指數 (GCS) 滿分","B":"瞳孔對光反應消失","C":"肛門反射 (anal wink) 消失","D":"血壓升高伴隨心跳緩慢"},"answer":"C","manualChapter":"CH27","matchedChapters":["未分類"]},{"id":3809,"source":"AI出題","question":"一名 30 歲男性因車禍造成「雙側股骨幹閉鎖性骨折」，於受傷後 24 小時突然出現呼吸窘迫（低血氧）、意識混亂以及胸前與頸部點狀出血（Petechiae）。此時最可能的診斷為何？","options":{"A":"肺動脈血栓栓塞（Pulmonary Embolism, PE）","B":"脂肪栓塞症候群（Fat Embolism Syndrome, FES）","C":"創傷性心肌挫傷（Myocardial Contusion）","D":"急性心包填塞（Cardiac Tamponade）"},"answer":"B","manualChapter":"創傷","matchedChapters":["CH30"]},{"question":"在第一型（立即型）過敏反應中，扮演最關鍵角色的抗體與細胞配對，下列何者正確？","options":{"A":"IgG 與 巨噬細胞","B":"IgE 與 肥大細胞 (Mast cell) 及嗜鹼性球 (Basophil)","C":"IgM 與 T淋巴球","D":"IgA 與 嗜酸性球 (Eosinophil)"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3810},{"question":"關於過敏反應的「敏感化 (Sensitization)」過程，下列敘述何者最為正確？","options":{"A":"第一次接觸過敏原時，即會引發嚴重的全身性過敏反應","B":"敏感化是指人體再次接觸過敏原時，IgE抗體開始大量製造的過程","C":"第一次接觸過敏原時，免疫系統會製造特異性IgE抗體附著於肥大細胞上，通常不會有明顯過敏症狀","D":"敏感化過程主要由T細胞直接吞噬過敏原所引起"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3811},{"question":"在嚴重過敏反應中，肥大細胞去顆粒化 (Degranulation) 會釋放多種化學介質。下列何種化學介質是引起早期嚴重血管擴張、血管通透性增加與支氣管平滑肌收縮的最主要且作用最快的物質？","options":{"A":"類胰蛋白酶 (Tryptase)","B":"白三烯素 (Leukotrienes)","C":"組織胺 (Histamine)","D":"前列腺素 (Prostaglandins)"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3812},{"question":"關於嚴重過敏反應 (Anaphylaxis) 引起的病生理變化，下列敘述何者錯誤？","options":{"A":"血管通透性增加會導致液體從血管內移至間隙空間，引起相對性低血容","B":"白三烯素 (Leukotrienes) 是強效的支氣管收縮劑，反應時間通常比組織胺慢，但持續時間更長","C":"全身性的血管擴張會導致心臟前負荷 (Preload) 大幅增加","D":"嚴重過敏反應可能引起心律不整及心肌缺血"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3813},{"question":"依據世界過敏組織 (WAO) 的臨床準則，下列哪一種情境最符合「嚴重過敏反應」的診斷？","options":{"A":"病人吃完花生後，全身出現大量蕁麻疹且極度搔癢，但生命徵象穩定，無呼吸道症狀","B":"病人被蜜蜂螫傷後數分鐘，僅出現突發性低血壓 (收縮壓降至 80 mmHg)，無皮膚或呼吸道症狀","C":"病人吸入花粉後，出現頻繁打噴嚏、流鼻水及眼結膜紅腫","D":"病人注射青黴素後，手臂注射部位出現局部紅腫熱痛，且持續擴大"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3814},{"question":"救護人員到達現場，發現一名60歲男性在餐廳用餐到一半突然倒下。病人全身潮紅、嘴唇腫脹，呼吸有明顯喘鳴音 (stridor)，血壓 70/40 mmHg。病人的妻子表示他沒有任何過敏史。此時救護人員最優先的處置藥物與途徑為何？","options":{"A":"靜脈推注 (IV bolus) Epinephrine 1 mg (1:10,000)","B":"肌肉注射 (IM) Epinephrine 0.3~0.5 mg (1:1,000) 於大腿中外側","C":"肌肉注射 (IM) Diphenhydramine (抗組織胺) 50 mg","D":"靜脈滴注 (IV infusion) Dopamine 5~20 mcg/kg/min"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3815},{"question":"承上題，病人在接受首劑藥物治療後 5 分鐘，血壓仍只有 75/45 mmHg，呼吸道水腫未見改善。下列哪一項後續處置「最不適當」？","options":{"A":"準備執行早期氣管內管插管，甚至準備環甲狀軟骨切開術","B":"快速給予大量生理食鹽水靜脈輸液 (1~2公升)","C":"再次肌肉注射 (IM) Epinephrine 0.3~0.5 mg","D":"立即靜脈推注 (IV bolus) Epinephrine 1 mg 以快速提升血壓"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3816},{"question":"嚴重過敏反應病人在症狀緩解後，即使沒有再次接觸過敏原，仍有高達 20% 的機率在 8~72 小時內再次發作。此現象稱之為：","options":{"A":"反彈性休克 (Rebound shock)","B":"延遲性自體免疫反應 (Delayed autoimmune reaction)","C":"雙相反應 (Biphasic reaction)","D":"交叉過敏反應 (Cross-allergic reaction)"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3817},{"question":"一名25歲女性被黃蜂螫傷後出現全身蕁麻疹、呼吸困難與頭暈。血壓 85/50 mmHg。在給予肌肉注射 Epinephrine 卻發現效果極差時，詢問病史得知病人因甲狀腺亢進，長期服用 Propranolol (一種乙型阻斷劑，Beta-blocker)。此時最適合考慮給予下列何種藥物來突破乙型阻斷劑的影響？","options":{"A":"升糖素 (Glucagon)","B":"鈣離子通道阻斷劑 (Calcium channel blocker)","C":"高劑量抗組織胺 (Diphenhydramine)","D":"類固醇 (Dexamethasone)"},"answer":"A","source":"AI出題","manualChapter":"CH40","id":3818},{"question":"關於嚴重過敏反應的呼吸道評估與處置，下列敘述何者錯誤？","options":{"A":"喘鳴音 (stridor) 或聲音沙啞代表上呼吸道腫脹，有完全阻塞的風險","B":"若病人出現嚴重的喉頭水腫，應盡快嘗試建立進階呼吸道","C":"過敏引發的支氣管痙攣 (下呼吸道阻塞)，主要表現為哮喘音 (wheezing)","D":"嚴重的血管性水腫 (angioedema) 通常發生在皮膚表面淺層，伴隨強烈搔癢，但不影響呼吸道"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3819},{"question":"在鑑別診斷時，必須將嚴重過敏反應與其他疾病區分。若病人突然出現呼吸急促、血壓下降，但皮膚「溫暖乾燥」、心跳「緩慢」，最可能是下列哪一種狀況？","options":{"A":"敗血性休克","B":"心因性休克","C":"神經性休克","D":"嚴重氣喘發作"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3820},{"question":"關於腎上腺素 (Epinephrine) 用於治療嚴重過敏反應的藥理作用，下列敘述何者正確？","options":{"A":"作用於 Alpha 受體造成血管擴張，增加組織血流","B":"作用於 Beta-1 受體降低心率，減少心肌耗氧","C":"作用於 Beta-2 受體造成支氣管平滑肌舒張，緩解呼吸困難","D":"直接抑制肥大細胞生成 IgE 抗體"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3821},{"question":"系統性紅斑性狼瘡 (SLE) 是一種自體免疫疾病，會對全身多個器官造成影響。若一名年輕女性 SLE 病人突然主訴劇烈胸痛與呼吸喘，到院前救護人員應高度懷疑下列哪一種潛在的致命併發症？","options":{"A":"氣胸","B":"早期動脈硬化引發的急性冠心症 (心肌梗塞)","C":"胃食道靜脈曲張破裂","D":"僵直性脊椎炎引發的肋骨骨折"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3822},{"question":"類風濕性關節炎 (RA) 病人除了關節變形外，在到院前進行「氣管內管插管」或「建立呼吸道」時，最需要注意下列哪一種潛在致命風險？","options":{"A":"下顎骨質疏鬆易造成骨折","B":"寰樞關節半脫位 (Atlantoaxial subluxation) 導致頸部過度伸展時壓迫脊髓","C":"聲帶麻痺導致插管空間狹小","D":"頸動脈狹窄引發腦缺血"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3823},{"question":"一名45歲男性病人，病史有僵直性脊椎炎 (Ankylosing spondylitis)，因在家中浴室滑倒背部著地，主訴雙下肢麻木無法移動。對於此類病人的處置，下列考量何者最正確？","options":{"A":"僵直性脊椎炎病人的脊椎韌性極佳，跌倒通常只會造成肌肉拉傷","B":"病人脊椎已完全黏連成竹竿狀，即使輕微機轉的跌倒也極易造成嚴重的脊椎骨折","C":"因為脊椎已經僵硬固定，所以搬運時不需使用長背板或限制頸椎移動","D":"此疾病好發於女性，男性極少見，應懷疑其他診斷"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3824},{"question":"修格蘭氏症候群 (Sjögren syndrome，乾燥症) 的病人，若突發全身無力甚至癱瘓，除了懷疑腦中風外，救護技術員應高度懷疑下列何種電解質異常？","options":{"A":"高血鈣","B":"高血鈉","C":"低血鉀","D":"低血鎂"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3825},{"question":"下列何種自體免疫疾病的典型臨床表徵為臉部出現「蝴蝶斑 (Butterfly rash)」，且常伴隨光敏感及關節發炎？","options":{"A":"類風濕性關節炎 (RA)","B":"僵直性脊椎炎 (AS)","C":"系統性紅斑性狼瘡 (SLE)","D":"修格蘭氏症候群 (Sjögren syndrome)"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3826},{"question":"關於使用「腎上腺素自動注射筆 (EpiPen / 艾筆)」的敘述，下列何者正確？","options":{"A":"應注射於臀部外上四分之一處","B":"兒童專用劑量通常為 0.3 mg","C":"注射後應在該部位停留約數秒鐘以確保藥物完全注入","D":"若無 EpiPen，成人可直接口服 1 mg 腎上腺素安瓿液體"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3827},{"question":"在嚴重過敏反應中，若病人心跳停止 (OHCA)，關於其急救處置之考量，下列何者「錯誤」？","options":{"A":"上呼吸道水腫可能導致傳統氣管內管插管極度困難","B":"嚴重血管擴張會造成體液大量滯留周邊，因此需要快速且大量的靜脈輸液","C":"首選急救藥物仍為腎上腺素 (Epinephrine)","D":"由於過敏原仍在體內，急救無效機率極高，不建議進行長時間的 CPR 搶救"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3828},{"question":"一位病人在接受顯影劑靜脈注射後 5 分鐘，出現全身紅疹、嚴重呼吸喘鳴及血壓降至 60/40 mmHg。此時給予第一線急救藥物 (腎上腺素) 的「最大禁忌症」為何？","options":{"A":"病人患有嚴重的冠狀動脈疾病","B":"病人為懷孕第三孕期的孕婦","C":"病人年齡超過 80 歲","D":"在危及生命的嚴重過敏性休克中，腎上腺素沒有絕對的禁忌症"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3829},{"question":"所謂「血管性水腫 (Angioedema)」最常侵犯的解剖部位「不包括」下列何者？","options":{"A":"嘴唇與舌頭","B":"肺泡微血管","C":"眼眶周圍","D":"咽喉與聲帶"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3830},{"question":"在嚴重過敏反應中，組織胺的作用會導致多種臨床症狀。下列哪一項症狀「並非」主要由組織胺的直接作用所引起？","options":{"A":"全身性血管擴張","B":"胃液與淚液分泌增加","C":"微血管通透性增加導致蕁麻疹","D":"補體系統活化導致的紅血球溶解"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3831},{"question":"一名兒童不慎誤食含花生餅乾後，出現嚴重過敏反應。救護人員欲以 1:1,000 的腎上腺素安瓿抽出藥物進行肌肉注射。若該名兒童體重為 20 公斤，應抽取的正確體積為多少毫升 (mL)？","options":{"A":"0.02 mL","B":"0.2 mL","C":"2.0 mL","D":"0.5 mL"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3832},{"question":"若成人病人因嚴重過敏反應引發休克，在肌肉注射首劑腎上腺素後，仍持續低血壓。建立靜脈管路後，建議的初始快速輸液 (生理食鹽水) 量大約為何？","options":{"A":"250 ~ 500 mL","B":"1 ~ 2 公升","C":"3 ~ 4 公升","D":"50 ~ 100 mL"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3833},{"question":"下列何種自體免疫疾病，其主要侵犯目標為淚腺與唾液腺，導致嚴重的眼乾與口乾症狀？","options":{"A":"類風濕性關節炎","B":"僵直性脊椎炎","C":"修格蘭氏症候群 (Sjögren syndrome)","D":"系統性紅斑性狼瘡"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3834},{"question":"一名30歲男性被蜜蜂螫傷，主訴皮膚癢，身體理學檢查發現雙手臂有數個膨疹(蕁麻疹)，但呼吸平順、無喘鳴音、血壓 120/80 mmHg、意識清楚。依據 WAO 準則與急救原則，下列處置何者最為適切？","options":{"A":"立即肌肉注射 Epinephrine 0.3 mg，預防休克","B":"立即靜脈推注 Epinephrine 1 mg","C":"將病人留在現場，告知若變嚴重再自行就醫","D":"持續監測生命徵象，評估是否進展為嚴重過敏反應，可考慮給予抗組織胺並送醫觀察"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3835},{"question":"關於靜脈注射 (IV bolus) 腎上腺素在過敏反應的應用，下列敘述何者最為正確？","options":{"A":"為了讓藥效更快發揮，所有嚴重過敏反應皆應優先使用靜脈注射","B":"靜脈注射腎上腺素風險極高，易引發致命心律不整及高血壓，僅限於心跳停止或對IM完全無效的極重度休克使用","C":"靜脈注射的標準劑量與肌肉注射完全相同，皆為 0.3~0.5 mg","D":"若病人意識清醒但有低血壓，應立刻給予 1 mg (1:10,000) 靜脈推注"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3836},{"question":"一名類風濕性關節炎 (RA) 病人，其手部外觀最常出現下列何種特徵性的變形？","options":{"A":"扳機指 (Trigger finger)","B":"杵狀指 (Clubbing finger)","C":"天鵝頸變形 (Swan neck deformity)","D":"腕隧道症候群引起的魚際肌萎縮"},"answer":"C","source":"AI出題","manualChapter":"CH40","id":3837},{"question":"嚴重過敏反應中出現的「潮紅(Flushing)」，其主要病生理機轉為何？","options":{"A":"表皮下微血管強烈收縮","B":"組織胺引發的全身性血管擴張","C":"缺氧導致的代償性微循環增加","D":"血小板凝集引發的局部充血"},"answer":"B","source":"AI出題","manualChapter":"CH40","id":3838},{"question":"關於「蕁麻疹(Urticaria)」與「血管性水腫(Angioedema)」的比較，下列敘述何者錯誤？","options":{"A":"兩者皆與組織胺造成的血管擴張及通透性增加有關","B":"蕁麻疹通常位於表皮層，常伴隨嚴重的搔癢感","C":"血管性水腫通常位於皮膚或黏膜較深層，常表現為疼痛或壓力感而非搔癢","D":"血管性水腫外觀必定會呈現明顯的鮮紅色且伴隨水泡"},"answer":"D","source":"AI出題","manualChapter":"CH40","id":3839},{"id":3840,"source":"109年度EMTP筆試題目卷(100題)(含答案)(1091224修訂)","question":"一輛滿載遊客的遊覽巴士，與載運危害物質的化學槽車發生車禍，導致危害物質外洩，多位遊客受困於翻覆變形的巴士內。對於此大量傷病患事故的「初級檢傷」，正確的作法是？(選擇「若化學槽車開始冒煙，即將起火，則所有人員立即撤離，並放棄移動傷患。」也給分)","options":{"A":"先脫困車禍的遊客，再執行傷患的侷限空間醫療。","B":"「初級檢傷」的主要目的在於決定脫困的優先順序，也就是說，是決定要轉送到現場救護區或接受除污的優先順序，而不是接受醫療處理的優先順序。","C":"若化學槽車開始冒煙，即將起火，則所有人員立即撤離，並放棄移動傷患。","D":"如果車禍傷患沒有意識，則最後再對此傷患執行初級檢傷。"},"answer":"B","manualChapter":"CH58"},{"question":"為了利於評估，可將頸部依水平位置分為三區，關於此三區的敘述下列何者正確?","options":{"A":"第一區(ZoneⅠ)為頸部的上段，從下顎骨角以上至枕骨大孔","B":"第二區(ZoneⅡ)為頸部的中段，從環狀軟骨到下顎骨角","C":"第三區(ZoneⅢ)為頸部的下半段，從鎖骨到環狀軟骨","D":"第三區域涵蓋範圍較廣，所以是最容易受傷的一區。"},"answer":"B","source":"同學出題","manualChapter":"CH27","id":3841},{"question":"關於醫者在告知病患或家屬壞消息時，所使用的SPIKES原則，下列敘述何者錯誤？","options":{"A":"S:Setting up（營造），營造一個適當的環境有助於壞消息的告知。","B":"P: Precise（精確），如實告知患者或家屬精確的診斷，增加對於病情的了解與接受度。","C":"E:Emotions（情感），同理病患或家屬的心情，其中包括觀察、嘗試訴說情緒、確定情緒原因以及給予對方時間並作出適當回應。","D":"S: Strategy and Summary（策略與總結），病人或家屬認知到壞消息之後，接下來應該嘗試給予一個可以執行的計畫，把病人或家屬拉回現實上應該要面對的問題，讓病人或家屬聚焦到現況。"},"answer":"B","source":"同學出題","manualChapter":"CH18","id":3842},{"question":"下列何者最不可能是高齡病人患有甲狀腺亢進的症狀？","options":{"A":"體重減輕","B":"心律不整","C":"精神亢奮","D":"心臟衰竭"},"answer":"C","source":"同學出題","manualChapter":"CH47","id":3843},{"question":"臨床上一般的貧血病不會干擾到脈衝式血氧計的判讀，但是如果血紅素太低(＜___g/dL)仍有可能會造成血氧濃度的低估","options":{"A":"1","B":"6","C":"10","D":"50"},"answer":"B","source":"填空題","manualChapter":"CH39","id":3844},{"id":3845,"source":"AI出題","question":"關於敗血症 (Sepsis) 與敗血性休克的最新國際定義 (Sepsis-3)，下列敘述何者最為正確？","options":{"A":"敗血症被定義為單純由微生物感染所引起的全身性發炎反應症候群 (SIRS)","B":"敗血性休克的診斷標準之一為：在給予足夠液體復甦後，仍需使用血管收縮劑以維持平均動脈壓 (MAP) ≥ 65 mmHg，且血清乳酸值 > 2 mmol/L","C":"qSOFA 評估項目包含：心跳速率、收縮壓、呼吸速率","D":"敗血性休克的血清乳酸鹽濃度標準必須低於 2 mmol/L"},"answer":"B","manualChapter":"CH42"},{"id":3846,"source":"AI出題","question":"救護技術員在院前評估疑似感染的病人時，常使用 qSOFA 進行快速篩檢。若一名病人的呼吸速率為 24 次/分，收縮壓為 90 mmHg，格拉斯哥昏迷指數 (GCS) 為 13 分。此病人的 qSOFA 分數為何？","options":{"A":"1 分","B":"2 分","C":"3 分","D":"4 分"},"answer":"C","manualChapter":"CH42"},{"id":3847,"source":"AI出題","question":"在傳染性疾病的傳播途徑中，下列哪一種疾病與其主要傳播途徑的配對是「錯誤」的？","options":{"A":"流行性腦脊髓膜炎：飛沫傳染","B":"疥瘡：接觸傳染","C":"開放性肺結核：飛沫傳染","D":"霍亂：食物或水源傳染"},"answer":"C","manualChapter":"CH42"},{"id":3848,"source":"AI出題","question":"關於救護設備與環境的消毒滅菌，下列敘述何者最為正確？","options":{"A":"低階滅菌 (Low-level disinfection) 可以有效殺死結核桿菌，適用於一般環境消毒","B":"中階滅菌 (Intermediate-level disinfection) 能夠殺死所有細菌的內孢子 (Spores)","C":"被血液或體液汙染的救護車環境表面，建議至少使用「中階滅菌法」進行消毒","D":"喉頭鏡葉片接觸病人黏膜，僅需使用一般清潔劑進行低階消毒即可"},"answer":"C","manualChapter":"CH42"},{"id":3849,"source":"AI出題","question":"依據台灣現行法定傳染病分類，下列哪一組疾病「皆」屬於第二類法定傳染病，且須於24小時內通報？","options":{"A":"嚴重急性呼吸道症候群 (SARS)、天花","B":"登革熱、流行性腦脊髓膜炎","C":"結核病、日本腦炎","D":"嚴重特殊傳染性肺炎 (
