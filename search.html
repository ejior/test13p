適當的聲波傳導介質。","D":"橫向掃描恥骨上區域發現有低回音成像，便可診斷為腹腔內積液。"},"answer":"C","manualChapter":"CH21","matchedChapters":["CH21"]},{"id":2584,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"68歲男性，主訴呼吸困難。意識清楚，呼吸30次/min，使用輔助呼吸肌；S p O 2 89%，給予氧氣後提升至94%，血壓88/54 mmHg，心跳132次/min；聽診雙側均有哮喘音（wheezing），此時最適當的現場處置與後續決策為何？","options":{"A":"立即給予支氣管擴張劑霧化治療，觀察15分鐘後再決定是否送醫。","B":"判斷為哮喘急性發作，給予氧氣即可，持續監測。","C":"依臨床表現判斷為COPD惡化，無需立即送醫。","D":"初步穩定呼吸後，因合併低血壓與頻脈，應立即送往急診並通報可能之重症。"},"answer":"D","manualChapter":"呼吸急症","matchedChapters":["Combine"]},{"id":2585,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"75歲男性由鄰居報案，表示病人今早言語混亂、走路不穩且對時間、地點搞混。屋內空氣異常悶濁，暖爐運轉中。你發現其後腦勺有一處小擦傷，正持續滲血。藥袋上顯示他服用多種處方藥（含鎮靜劑與降壓藥）。根據上述情境，初步鑑別與處置中，何者最適當？","options":{"A":"現場應優先處理後腦出血點給予加壓止血，因其為最可能造成意識混亂的主因。","B":"若該老年人有失智症病史，可能症狀起起伏伏，評估後應送至附近本來長期就醫的精神專科醫院調整藥物。","C":"現場環境與病史提示可能有一氧化碳中毒，應考慮開窗通風，並給予病人高濃度氧氣。","D":"如病人有服用propranolol（beta blocker），低血糖時會有明顯心跳加快和手抖，有助於現場辨識。"},"answer":"C","manualChapter":"非創傷"},{"id":2586,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"65歲男性因昏厥冒冷汗叫救護車，EMT - P進行病人評估為GCS E4V5M6、呼吸12次/min、濕囉音（crackles）、血壓80/40mmHg、脈搏60次/min、SpO 2 92%、下肢水腫，病人於車上抽搐後呈現VF心律。請問病人最可能是5H5T哪個原因？","options":{"A":"低血容積（Hypovolemia）。","B":"張力性氣胸（Tension pneumothorax）。","C":"中毒（Toxins）。","D":"冠狀動脈血栓（Thrombosis/Coronary）。"},"answer":"D","manualChapter":"非創傷"},{"id":2587,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"專業醫療或救護人員執行基本救命術時，大多採取C - A - B順序，下列哪兩種情境仍建議維持傳統的A-B-C順序？","options":{"A":"溺水病人與新生兒。","B":"心因性猝死病人與創傷病人。","C":"藥物過量病人和CO中毒病人。","D":"雷擊病人和低體溫病人。"},"answer":"A","matchedChapters":["CH24"],"manualChapter":"CH24"},{"id":2588,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"根據最新的復甦後照護指引，目標體溫管理（TTM）的主要臨床目的，何者為是？","options":{"A":"減少大腦代謝與缺血再灌流傷害。","B":"降低血壓，避免腦部再灌流受損。","C":"預防低血氧，確保氧合足夠。","D":"增加藥物代謝速度以改善心肺功能。"},"answer":"A","manualChapter":"CH24"},{"id":2589,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"以下關於復甦後照護、目標體溫管理議題之敘述，何者最適當？","options":{"A":"目標體溫管理之溫度為：32-34ºC。達到目標溫度後，持續目標體溫達48小時。","B":"復甦後血中CO 2濃度：45-55mmHg。研究顯示，輕度高碳酸血症相較於正常碳酸血症有更好的預後。","C":"復甦後的血氧濃度：建議在92~98%。臨床試驗結果表明，低血氧與較差的預後相關。","D":"血壓管理：建議SBP維持120mmHg以上、MAP維持65mmHg以上為宜。"},"answer":"C","manualChapter":"CH24","matchedChapters":["CH24"]},{"id":2590,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"以下爆炸傷之描敘，何者最適當？","options":{"A":"爆裂飛散物擊中為第一級爆炸傷，中空器官受傷，包含耳膜破裂、肺挫傷等屬於此類。","B":"爆裂物的添加物造成的傷害為第二級爆炸傷，可能會導致細菌、化學物質或放射物質造成人體傷害。","C":"空氣震波或其他物體噴濺為第三級爆炸傷，常導致穿刺傷或鈍傷。","D":"爆炸產生的熱能及火焰為第四級爆炸傷，可能導致燒傷、壓碎傷、呼吸道的吸入性傷害。"},"answer":"D","manualChapter":"CH25","matchedChapters":["CH25"]},{"id":2591,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"以下創傷休克之急救處置，何者最適當？","options":{"A":"應該要予以適當的通氣及給氧，以維持血氧濃度（SpO 2）大於90%。","B":"對於出血性休克之傷患，建議以溫暖的林格氏乳酸溶液為輸液首選。成人首次輸液量為2公升。","C":"若大出血處無法做到確實止血前，「允許性低血壓（permissive hypotension）」是可接收之作法。","D":"若創傷患者合併合併腦損傷，為維持腦部灌流，建議收縮壓維持120mmHg。"},"answer":"C","manualChapter":"CH26"},{"id":2592,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於出血在院前的處置方式，下列敘述何者正確？","options":{"A":"執行加壓止血時，手持一般敷料於出血處加壓，3到5分鐘後須打開確認是否已止血。","B":"在到院前早期使用骨盆固定帶，雖能減少骨盆出血量，但無法改善病人預後。","C":"研究證實，出血病人即使在休克後再打上止血帶，存活率仍然相當良好。","D":"肢體出血致病人生命危急時，應盡快剪除衣服，快速打上止血帶以求確實止血。"},"answer":"B","manualChapter":"CH26","matchedChapters":["CH26"]},{"id":2593,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"50歲男性，6公尺高處墜落，有頭部外傷，身上無明顯外出血，意識不清，現場對痛刺激僅能發出呻吟聲，血壓190/60mmHg，心跳50次/min，血氧88%，呼吸8次/min關於此病人的敘述下列何者最適當？","options":{"A":"低血氧是創傷性腦傷的危險因子，根據EPIC-TBI，建議血氧應維持在98%以上。","B":"維持呼吸道暢通部分，不建議使用聲門上呼吸道。","C":"若要進行氣管內管置入，可以考慮施打lidocaine，以避免顱內壓的上升。","D":"若病人沒有躁動，可以考慮解開頸圈。"},"answer":"D","manualChapter":"創傷"},{"id":2594,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"30歲男性車禍，顏面鈍挫傷合併大量口鼻出血、口腔有血塊，發出咕嚕聲；生命徵象：對痛睜眼，無法正確定位，會發出呻吟聲，SpO 2 84%，呼吸10次/min、不規則；血壓148/72 mmHg，HR 72次/min，根據以上資訊，下列處置何者最優先？","options":{"A":"徒手頸椎減移，建立聲門上呼吸道，進行輕度過度通氣，維持EtCO 2 25–35 mmHg。","B":"徒手頸椎減移，以大口徑抽吸管清除血塊、考慮準備插管保護呼吸道。","C":"徒手頸椎減移，抽吸血塊暢通呼吸道，置入鼻咽呼吸道，再以BVM正壓給氧。","D":"徒手頸椎減移，以BVM正壓給氧，血氧上升後，進行抽吸以暢通呼吸道。"},"answer":"B","manualChapter":"創傷"},{"id":2595,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"對於開放性氣胸的院前處置，下列何者最適當？","options":{"A":"以透氣敷料覆蓋傷口。","B":"使用不透氣敷料封三邊、留一邊開放。","C":"立即給予正壓通氣。","D":"將外露臟器推回胸腔。"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2596,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"25歲男性，在KTV與人起口角，遭人使用水果刀襲擊，到場時發現頸部皮下氣腫、頸靜脈怒張，左前胸及左後背均有長而深的傷口，病人意識略為躁動，一直喊不舒服，呼吸困難，冒冷汗，生命徵象為血壓120/80mmHg，心跳130次/min，血氧82%，關於此病人，下列處置最為適當？","options":{"A":"病人血氧不佳，應及早建立聲門上呼吸道及正壓通氣。","B":"須懷疑開放性氣胸，於左前胸、左後背傷口貼上胸封。","C":"病人已經頸靜脈怒張，故不建議再給予輸液。","D":"執行E-FAST若有barcode sign，可以證實血胸的存在。"},"answer":"B","manualChapter":"創傷"},{"id":2597,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"30歲男性騎乘機車自摔，主訴左上腹疼痛，理學檢查發現左側第十肋骨處壓痛變形，且疼痛轉移至左肩。此傷患最可能傷及下列哪個器官？","options":{"A":"肝臟。","B":"脾臟。","C":"腎臟。","D":"胰臟。"},"answer":"B","manualChapter":"CH20"},{"id":2598,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"32歲男性機車車禍，病人躺在地上清醒但皮膚蒼白濕冷出汗，主訴下腹與會陰疼痛。身體檢查發現會陰及陰囊瘀青，無其他明顯外出血。此時最優先的處置為何？","options":{"A":"反覆測試確認骨盆不穩定後再使用骨盆固定帶。","B":"若有商品化骨盆固定帶，立即使用骨盆固定帶。","C":"先建立兩條大號靜脈管路給予大量輸液。","D":"若病人意識清醒且骨盆外觀無明顯變形可不急著固定。"},"answer":"B","manualChapter":"創傷"},{"id":2599,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"你抵達現場發現一名男子被貨車輪胎壓住右大腿超過6小時，現場準備脫困。以下哪一項處置最為適當？","options":{"A":"立即移開重物讓病人脫困，再開始輸液。","B":"儘可能在脫困前先給予大量靜脈輸液，再鬆開壓迫。","C":"優先給予止痛藥後再考慮輸液。","D":"等病人完全脫困後再觀察是否出現休克再給輸液。"},"answer":"B","manualChapter":"CH30"},{"id":2600,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"高壓電廠工人維修時發生爆炸，現場有多名傷者，關於現場敘述何者最適當？","options":{"A":"靠近現場時，遠離高壓電線或金屬物3~9公尺，大於400伏特的高壓電會使乾燥樹枝也導電，確定電流切斷前不可輕易接觸傷患。","B":"現場可能產生高壓電弧致發生爆炸，傷患可能有氣胸，到第四階段可能直接撞擊地面造成肝臟損傷。","C":"電傷害可引起廣泛的血管壞死，這種傷害立即的內出血，動脈或靜脈血管的血栓與隨後的病發生，在救護現場很容易被發現。","D":"身體檢查查看有無電流入口及出口，高壓電經過人體時可能有多處傷口，會在皮膚上產生親吻型灼傷，常見於腋下、前臂及手肘。"},"answer":"D","manualChapter":"CH30","matchedChapters":["CH30"],"explanation":"CH30 p806\n處理電傷害過程中需警戒環境中的金屬物及高壓電線，至少遠離3 ~ 9 公尺，以免過於靠近引發電弧傷害。另外要注意，大於600伏特的高壓電，會使乾燥樹枝也能導電\n\n高壓電弧還會使周圍環境溫度急遽升高，會使空氣急遽膨脹而發生爆炸，病人可能被彈飛跌落，導致內臟鈍傷以及多處骨折，還可能噴飛週遭物體造成噴濺傷害\n\n電傷害可引起廣泛的血管壞死，血管的傷害一開始多半不明顯，所以在救護現場難以察覺。然而，這種傷害可導致立即或延遲性的內出血，動脈或靜脈血管的血栓和栓塞與隨後的併發症。"},{"id":2601,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"35歲男性廚師，前臂不慎被滾燙的熱油潑灑，產生數個巨大水泡，皮膚呈現紅色且傷患主訴劇烈疼痛。此類灼傷的深度分級為何者最適當？","options":{"A":"表淺性灼傷(一度)。","B":"淺層灼傷(二度)。","C":"全層灼傷(三度)。","D":"四度灼傷。"},"answer":"B","matchedChapters":["CH31"],"manualChapter":"CH31"},{"id":2602,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"35歲女性，體重約50公斤火場救出後經初步評估為整隻右手臂及整隻右腿的深度灼傷（皆為二度或三度灼傷），根據修正後布魯克公式(modified Brooke formula)前八小時應給予多少輸液量？","options":{"A":"1,350ml。","B":"1,800ml。","C":"2,700ml。","D":"3,600ml。"},"answer":"A","manualChapter":"背誦題","matchedChapters":["背誦題"]},{"id":2603,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"為一位失去意識且無嘔吐反射的3歲兒童放置口咽呼吸道（OPA），何者最適當？","options":{"A":"反向插入達軟顎後旋轉180度。","B":"應使用壓舌板輔助平行置入。","C":"尺寸應選擇更大號避免脫落。","D":"兒童舌頭小不易造成呼吸道阻塞。"},"answer":"B","manualChapter":"CH48","matchedChapters":["CH48"]},{"id":2604,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"照護老年外傷病人時，何者最適當？","options":{"A":"老年人的呼吸肌力減弱及脊椎彎曲駝背，都會導致胸壁順應性（compliance）降低，進而容易出現呼吸窘迫。","B":"老年人腦部萎縮，會使顱內出血或腦腫脹的症狀比一般成人更早、更明顯地表現出來。","C":"老年病人因血管硬化，脈壓平時較窄，這是休克初期的重要判斷依據。","D":"維持呼吸道時，應避免移除活動假牙，移除會造成臉部凹陷的情況，會容易導致BVM通氣時密閉不完全漏氣。"},"answer":"A","manualChapter":"CH47"},{"id":2605,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於心電圖出現有意義ST - T波變化的所在導極與心臟解剖位置的相關性配對，下列何者正確？","options":{"A":"中隔區為導極V3, V4。","B":"前壁為導極V5, V6。","C":"側壁為導極V1, V2。","D":"下壁為導極II, III, aVF。"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":2606,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"下列哪一種心電圖變化最符合「心室顫動」(Ventricular Fibrillation, VF)的特徵？","options":{"A":"連續而快速，規律一致，寬QRS波、無P波。","B":"連續而快速，無規則節律，大小、寬窄不一的QRS波。","C":"快而規則的連續波型，伴隨高尖ST段。","D":"可見P波與QRS波一一對應。"},"answer":"B","manualChapter":"CH33","matchedChapters":["CH33"]},{"id":2607,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"病人突發「撕裂樣胸痛、放射至背部」，到達現場評估發現雙側上肢血壓差異大於20 mmHg，最需要考慮什麼診斷？","options":{"A":"急性心肌梗塞。","B":"主動脈剝離。","C":"張力性氣胸。","D":"心包填塞。"},"answer":"B","manualChapter":"CH28"},{"id":2608,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"56歲男性餐後出現胸悶、血壓84/52mmHg、脈搏54次/min、血氧96％、體溫36.5ºC。十二導程心電圖結果如下圖，依據此心電圖變化，對於判斷病變位置及正確的到院前處置下列何者最適當？","options":{"A":"前壁STEMI，立即給予硝化甘油與高流量氧氣。","B":"下壁STEMI，避免硝化甘油並維持靜脈輸液。","C":"前壁NSTEMI，給予腎上腺素與阿斯匹靈。","D":"下壁NSTEMI，給予硝化甘油並將病人採半坐臥姿勢。"},"answer":"B","manualChapter":"CH34","image":"題庫圖片/2608.png","matchedChapters":["CH34"]},{"id":2609,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"一名頻脈且有血行動力學「不穩定」的病人，依據最新版本的ACLS建議，同步心臟整律(synchronized cardioversion)的初始劑量配對何者正確？","options":{"A":"窄波且規則：同步整律120J雙相，或200J單相。","B":"窄波且不規則：同步整律50~100J。","C":"寬波且規則：同步整律100J。","D":"寬波且不規則：同步整律150J。"},"answer":"C","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":2610,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於心包膜填塞（cardiac tamponade）的敘述，下列何者最適當？","options":{"A":"有可能出現頸靜脈怒張，如果血流動力學不穩定，可以給予靜脈輸液。","B":"心包膜腔積液過多，會先壓迫左心房以及左心室，造成無脈性的電氣活動（PEA）。","C":"低血壓的產生是因為在心臟收縮期時，影響到回心血流。","D":"典型的貝克氏三症狀(Beck's triad)於大多數心包膜填塞的病人都可見到。"},"answer":"A","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2611,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於急性冠心症中「非ST段上升心肌梗塞」與「不穩定心絞痛」之差異，下列何者正確？","options":{"A":"兩者心肌酵素皆不會上升。","B":"後者12導程心電圖會出現Q波。","C":"兩者皆需於到院90分鐘內完成心導管治療。","D":"前者因心肌壞死，血中心肌酵素上升。"},"answer":"D","manualChapter":"CH34","matchedChapters":["CH34"]},{"id":2612,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"呼吸系統疾病可歸因為通氣、擴散、灌流三大致病機轉，下列有關於三大致病機轉與所出現的呼吸系統疾病配對，何者正確？ (多選)","options":{"A":"肌肉萎縮導致的呼吸衰竭為擴散所造成的問題。","B":"火災現場，一氧化碳中毒為擴散所造成的問題。","C":"急性肺水腫導致的低血氧為通氣所造成的問題。","D":"嚴重的肺動脈粥狀硬化為灌流所造成的問題。"},"answer":"B,D","manualChapter":"CH14"},{"id":2613,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"60歲男性到院前心臟停止（OHCA），心電圖監視器有看到波形，但脈搏摸不到。施行重點式心臟超音波是發現病人右心室明顯擴大，下列何者為最可能診斷？","options":{"A":"心包膜填塞（cardiac tamponade）。","B":"張力性氣胸（tension pneumothorax）。","C":"急性心肌梗塞（myocardial infarction）。","D":"肺動脈栓塞（pulmonary embolism)。"},"answer":"D","manualChapter":"CH21","matchedChapters":["CH21"]},{"id":2614,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"60男性主訴呼吸困難，下列哪一項發現最需考慮是「張力性氣胸」？","options":{"A":"雙側呼吸音減弱，雙側扣診呈現為實音。","B":"單側呼吸音減弱，氣管偏移合併低血壓。","C":"雙側哮鳴音(wheezing)，有粉紅色泡沫痰。","D":"心音聽診時非常小聲，合併頸靜脈怒張。"},"answer":"B","manualChapter":"CH28","matchedChapters":["CH28"]},{"id":2615,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"有關腦幹功能的理學檢查評估，下面敘述何者為非？","options":{"A":"照光的一眼瞳孔沒有如同另一眼同時縮小時，表示該側的第三對腦神經受損或是中腦、腦幹有病兆。","B":"洋娃娃眼徵象陽性是指，轉動頭部時眼球會往頭轉動方向對側移動，代表腦幹反射正常。","C":"巴賓斯基反射如果單側呈現陽性時，代表著對側的腦部有受損的情形。","D":"痛刺激後雙側的上、下肢皆呈伸張的僵直姿勢，代表大腦半球皮質受到傷害。"},"answer":"D","manualChapter":"CH36"},{"id":2616,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"有關重症肌無力(Myasthenia gravis)之敘述，下列敘述何者最不適當？","options":{"A":"是一種自體免疫疾病。","B":"有些病人會合併胸腺瘤（thymoma），治療時可能需要手術處理。","C":"如果發生肌無力危象時，會緊急進行血漿置換術和靜脈注射免疫球蛋白。","D":"眼皮下垂通常是對稱的，如果是單側眼皮下垂，則不考慮是重症肌無力。"},"answer":"D","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":2617,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"左側中大腦動脈第一分支阻塞的腦中風病人，下列何者為最可能出現的臨床表現？","options":{"A":"左側無力、眼睛往右看。","B":"右側無力、眼睛往左看。","C":"左側無力、眼睛往左看。","D":"右側無力、眼睛往右看。"},"answer":"B","manualChapter":"CH36"},{"id":2618,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"下列何者無法用來區分「中樞性顏面麻痺」與「周邊性顏面麻痺」？","options":{"A":"是否上下半部臉部肌群都受影響。","B":"是否有聽覺過敏或耳朵內部症狀。","C":"是否合併語言功能損傷症狀。","D":"症狀是否持續超過一週。"},"answer":"D","manualChapter":"CH36"},{"id":2619,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於腎上腺體急症的敘述，下列敘述何者最不適當？","options":{"A":"庫欣氏症候群是因為血液內存在過高的腎上腺髓質素。","B":"庫欣氏症候群最常見的是因為腎上腺腫瘤引發。","C":"庫欣氏症候群典型症狀包含月亮臉、水牛肩、皮膚變薄。","D":"愛迪生病臨床表現包含體重減輕、低血壓、低血鈉。"},"answer":"A","matchedChapters":["CH41"],"manualChapter":"CH41"},{"id":2620,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"68歲女性，有糖尿病病史，朋友表示病人意識不清約4小時。現場生命徵象如下：體溫36.4度、脈搏112 bpm、CRT<2秒、血壓100/70 mmHg、呼吸24次/min、GCS：E4V4M5、血氧93%。下列評估及處置，何者最不適當？","options":{"A":"病人意識不清，需排除低血糖或高滲透壓高血糖症候群導致。","B":"病人呼吸偏快，可進一步評估呼吸是否有丙酮味來鑑別糖尿病酮酸血症。","C":"病人脈搏偏快，CRT<2秒，應先補充大量輸液再量測血糖。","D":"病人血氧偏低，可給予氧氣鼻導管2 L/min。"},"answer":"C","manualChapter":"CH37"},{"id":2621,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"60歲男性，在家中突然吐血，到達時發現浴室滿地都是血，病人意識清楚，呼吸淺快、膚色蒼白，血壓為70/40mmHg，針對病患的評估及處置，下列敘述何者最適當？","options":{"A":"如果吐出的血為鮮紅色，則可判定為下消化道出血。","B":"如果病人有肝硬化病史，最可能為食道動脈破裂導致出血。","C":"可以讓病人呈半坐臥以保護呼吸道。","D":"若給予輸液無效，可以給予Transamine靜脈滴注。"},"answer":"C","manualChapter":"非創傷"},{"id":2622,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"在到院前評估和處置急性腹痛病人時，下列評估或處置何者最適當？","options":{"A":"腹痛超過6小時應考慮給予止痛，避免病人因疼痛加劇而休克。","B":"即使生命徵象穩定，仍應囑咐病人禁食，以降低到院後緊急手術的麻醉風險。","C":"可以透過聽診腸音確定病因，例如腸音太快即表示腸胃炎，腸音太慢則表示腹膜炎。","D":"急性腹痛患者常有脫水或出血的風險，應積極給予20mL/kg的等張溶液。"},"answer":"B","manualChapter":"CH29","matchedChapters":["CH29"]},{"id":2623,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"對於血液疾病的敘述，下列敘述何者最適當？","options":{"A":"地中海型貧血屬於大球性貧血。","B":"缺乏第八因子稱為B型血友病。","C":"血小板小於50,000/uL，就會引起重要器官自發性出血。","D":"非何杰金氏淋巴癌早期通常沒有明顯症狀。"},"answer":"D","manualChapter":"CH39","matchedChapters":["CH39"]},{"id":2624,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"腫瘤溶解症候群（Tumor Lysis Syndrome, TLS）是腫瘤細胞快速被破壞後，細胞內物質大量釋放所導致的嚴重併發症，可能引起下列哪一組代謝性異常？","options":{"A":"低尿酸血症、低血鉀症、低磷酸血症、高血鈣症。","B":"高尿酸血症、高血鉀症、高磷酸血症、低血鈣症。","C":"高尿酸血症、低血鉀症、高磷酸血症、高血鈣症。","D":"低尿酸血症、高血鉀症、低磷酸血症、低血鈣症。"},"answer":"B","manualChapter":"CH39"},{"id":2625,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"40歲男性，被蜜蜂螫傷後約5分鐘，主訴：喉嚨緊、呼吸困難，並出現全身性蕁麻疹。初步評估：意識對聲音有反應但躁動不安，呼吸音有明顯喘鳴（Stridor），橈動脈微弱，皮膚潮紅、濕冷，下列何者為最優先的關鍵處置？","options":{"A":"建立靜脈輸液並快速輸注生理食鹽水1至2公升。","B":"將病人擺位後給予高濃度氧氣，並於大腿中外側肌肉注射腎上腺素。","C":"將病人送醫，同時監測生命徵象，並在送醫途中準備好氣管內管以防呼吸道完全阻塞。","D":"考慮給予抗組織胺藥物（如Diphenhydramine）緩解皮膚症狀。"},"answer":"B","manualChapter":"CH40"},{"id":2626,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"一名病人因不明原因導致嘴唇和舌頭腫大，但外觀皮膚顏色正常。下列敘述何者最適當？","options":{"A":"可能是血管性水腫，病人經常會主訴疼痛或壓力感。","B":"血管性水腫是因為組織胺刺激皮膚淺層血管擴張所致。","C":"由於沒有合併出現蕁麻疹，可以排除是過敏反應導致。","D":"由於病人腫脹位於臉部，發生上呼吸道阻塞的風險極低。"},"answer":"A","manualChapter":"CH35"},{"id":2627,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"68歲男性，因末期腎病變每週一、三、五規律血液透析。今天（星期日）聚餐吃了火鍋與水果。晚間突然呼吸困難、出現口周麻木與手部肌肉顫抖。現場評估：病人意識清楚，呼吸28次/min，心率52次/min，血壓158/94 mmHg，SpO 2 95%，肺部有濕囉音，下肢明顯水腫。心電圖顯示高尖T波、PR間隔延長。下列何者為最合理的鑑別診斷？","options":{"A":"體液過量造成左心衰竭與急性肺水腫，繼發低氧性心搏過緩。","B":"代謝性酸中毒引起中樞性過度換氣與低血磷症狀。","C":"高血鉀合併體液過量，導致膜電位不穩與傳導遲滯。","D":"透析後不平衡症候群造成顱內壓上升與交感活化反射。"},"answer":"C","manualChapter":"CH41","matchedChapters":["CH41"]},{"id":2628,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"58歲男性，突發左側腰痛2小時，疼痛劇烈，伴隨噁心、尿意頻繁但解尿量少。抵達時病人滿頭冷汗、面色蒼白。病人表示一週因呼吸道感染，有曾口服感冒藥但已停藥三日，左側後腰部敲痛，下腹輕度壓痛但無明顯腫脹。下列何者為最適當的鑑別診斷？","options":{"A":"服用感冒藥後誘發尿滯留導致膀胱脹痛。","B":"結石阻塞輸尿管造成腎絞痛，並出現反射性頻尿。","C":"泌尿道感染併發腎盂腎炎，導致單側腰痛與發燒。","D":"由長期攝護腺肥大引起慢性尿滯留急性惡化。"},"answer":"B","manualChapter":"CH41","matchedChapters":["CH41"]},{"id":2629,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"疑似疥瘡的救護案件，在個人防護與後續除污方面，最為完整且正確的處理流程為何？","options":{"A":"佩戴N95口罩與隔離衣，避免飛沫傳染；處置結束後，使用酒精性乾洗手消毒雙手，並將壓脈帶以低階滅菌法處理。","B":"佩戴外科口罩、長袖隔離衣與手套，避免皮膚直接接觸；處置結束後，立即使用清水與肥皂徹底洗手，並將壓脈帶以中階滅菌法處理。","C":"佩戴外科口罩與手套，避免體液接觸；處置結束後，將手套丟棄並使用酒精消毒雙手，將壓脈帶以清水擦拭。","D":"僅佩戴手套，減少皮膚接觸；處置結束後，立即用清水與肥皂洗手，並將所有與病人接觸的裝備以高階滅菌法處理。"},"answer":"B","matchedChapters":["CH05"],"manualChapter":"CH42"},{"id":2630,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"季節性流感每年都需要更新疫苗，主要是因為病毒發生了抗原漂變（Antigenic Drift）。關於抗原漂變與抗原轉變（Antigenic Shift）之間的病理差異，下列敘述何者最適當？","options":{"A":"漂變是病毒基因組發生大段落互換，轉變是基因的點突變。","B":"漂變是造成季節性流行的機制，轉變是造成世界性大流行的機制。","C":"漂變影響的是病毒的傳染力，轉變影響的是病毒的適應力。","D":"漂變是人類流感病毒株與動物流感病毒株的重新組合。"},"answer":"B","manualChapter":"CH43","matchedChapters":["CH43"]},{"id":2631,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"關於鉤端螺旋體病感染、下列描述何者最不適當？","options":{"A":"我國為第四類法定傳染病，應於24小時內通報。","B":"黃疸性比無黃疸性鉤端螺旋病死亡率高。","C":"病人可能出現結膜充血但無膿狀分泌物。","D":"病人必須在單人病室進行隔離。"},"answer":"D","manualChapter":"CH43"},{"id":2632,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"您在環境溫度為零下3度的高山上進行山難搜救，發現一名登山客倒臥在空曠處，中心體溫為攝氏30度，下列處置步驟何者最適當？","options":{"A":"必須先採取被動回溫、減少病人的熱散失，同時動作應保持輕柔，避免誘發Vf。","B":"病人發生OHCA，AED顯示為Vf，此時急救重點應該是心肺復甦術、回溫及去顫，並在每次分析需要電擊時都及時電擊、不可延誤。","C":"病人經過處置後中心體溫回升至攝氏32度，若仍然OHCA，可每3分鐘給予Epinephrine 1mg IVP。","D":"經過復甦後病人ROSC，但此時心律顯示為竇性心搏過緩，建議立即使用心臟節律器，避免再次OHCA。"},"answer":"A","manualChapter":"CH44","matchedChapters":["CH44"]},{"id":2633,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"在野外救援中，決定是否立即接近病人做處置前，環境風險評估的三項（3P）原則及順序以下何者最適當？","options":{"A":"Patient、Public、Personal。","B":"Personal、Public、Patient。","C":"Position、Pressure、Protection。","D":"Pace、Plan、Proceed。"},"answer":"B","manualChapter":"CH45"},{"id":2634,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"考量野外醫療針對傷患的照護，下列敘述何者最適當？","options":{"A":"考量到傷患在抵達醫院時可能需要接受手術或檢查，在下撤的過程中不能讓傷患喝水或吃東西，水分補充可以透過靜脈輸液進行。","B":"傷患的眼睛被樹木穿刺傷，應使用輕巧的物品固定穿刺物；若傷患能自行行走，可僅包紮受傷單眼，另一未受傷眼睛保持直視。","C":"針對穿刺傷口伴隨有泥土髒汙，可採用1%優碘水搭配注射器和靜脈留置針軟管，在傷口上施加壓力往內灌洗，避免長途運送感染。","D":"對於腕關節的脫臼，因該處解剖構造單純，根據野外醫療協定，可以進行復位後，利用夾板固定避免再次脫臼。"},"answer":"B","manualChapter":"CH45","explanation":"在醫院清創會使用無菌等張的溶液，像是生理食鹽水，但是將這些具有重量與體積的沖洗液帶到野外時並不實際，臨床上研究顯示，可以拿來喝的水就可以用來沖洗傷口，至於野外的水源像是溪水、雪水、河水經過處理後，到達可以飲用的標準時，就可以使用。水的處理以煮沸冷卻後的最好，次之可以選擇透過戶外商品化的攜帶式濾水器、淨水藥劑(如氯化銀)、戶外攜帶式紫外線燈來處理。若無上述物資可淨水濾水，將優碘加入水中製成1％的優碘水可以達到抑菌的效果。"},{"id":2635,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"EMT-P出勤疑似藥物過量患者，病人表現與現實脫節及易怒衝動，伴隨自傷意圖，現場環境混亂。需配合動員警察及衛生人員處理護送就醫及穩定情勢。下列配合方式，何者最適當？","options":{"A":"病人失去理智，無法進行任何形式的交流，就應尋求警察額外的支援，採取必要的約束措施。","B":"約束患者時，至少3人團隊，上肢約束時，一臂向上、一臂向下，通常左上右下。","C":"使用Haloperidol注射對於安非他命中毒患者無益，會增加橫紋肌溶解、高血壓急症與心律不整的風險。","D":"抗精神病藥物（antipsychotic）是緊急醫療救護中常使用的藥物，但常常合併高成癮性風險。"},"answer":"A","matchedChapters":["CH06"],"manualChapter":"CH06"},{"id":2636,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"下列針對高齡患者的慢性阻塞性肺病（COPD），何者最適當？ (多選)","options":{"A":"COPD在高齡病人的症狀包含過度焦慮、發紺、異常或消失的呼吸音。","B":"COPD的患者發現消失的呼吸音合併明顯呼吸困難，應考慮使用epinephrine inhalation。","C":"代謝性酸中毒及低血氧會使COPD的病人病情迅速惡化。","D":"當患者意識改變時，應該考慮使用非侵襲性正壓給氧呼吸機（Non-Invasive Postive Pressure Ventilator）。"},"answer":"A,C","manualChapter":"CH47","matchedChapters":["CH47"]},{"id":2637,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"34週新生兒急救，剛剛已經給過15秒甦醒球正壓通氣，你發現雖然bagging時新生兒胸部有起伏，但心跳數卻與正壓通氣前一樣約45次/min，請問下一步急救措施何者最適當？","options":{"A":"抽吸口鼻分泌物。","B":"檢查面罩是否有漏氣。","C":"開始3:1壓胸與吹氣。","D":"再bagging15秒。"},"answer":"D","matchedChapters":["CH48"],"manualChapter":"CH48"},{"id":2638,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"院前急產38週約3公斤之新生兒進行急救，關於下列急救步驟的描述，何者最適當？","options":{"A":"若羊水為黃色，高度懷疑有胎便吸入症，須立即插管。","B":"正壓呼吸時建議給予低濃度氧氣（1-3 L/min）。","C":"雙手環抱壓胸時，拇指並排頂端切齊兩乳頭連線。","D":"從氣管內管給Epinephrine時，以1:1,000濃度給0.3cc。"},"answer":"C","manualChapter":"CH48"},{"id":2639,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"對於遭受性侵害女性病人之院前處置，下列何者最不適當？","options":{"A":"將病人移至救護車上再進行理學檢查，以提供病人隱私。","B":"溫柔詢問病人受侵害之身體部位有哪些，以利紀錄詳實可提供法院做為日後證據。","C":"除了骨盆腔之外傷，也要注意口腔或其他身體部位有無外傷。","D":"即使病人身上有抓傷與咬傷等易感染傷口，也不建議以生理食鹽水沖洗。"},"answer":"B","manualChapter":"CH49"},{"id":2640,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"一名農夫疑似有機磷（Organophosphate）中毒，出現流涎、縮瞳、支氣管分泌物增多。下列描述何者最適當？","options":{"A":"常見症狀為急性癲癇發作。","B":"以阿托品（Atropine）治療。","C":"給予活性碳協助吸附除汙。","D":"大量輸液以促進腎臟排毒。"},"answer":"B","manualChapter":"CH50","matchedChapters":["CH50"]},{"id":2641,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"懷疑下列何者中毒時，使用活性碳(activated charcoal）最適當？","options":{"A":"氰化物（cyanide）。","B":"酒精中毒（ethanol intoxication）。","C":"甲醇（methanol）。","D":"鴉片類止痛藥（opioids）。"},"answer":"D","manualChapter":"CH50"},{"id":2642,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"對於氣切管（Tracheostomy tube）病人出現呼吸窘迫時，最優先處置為何？","options":{"A":"嘗試更換新的相同尺寸的氣切管。","B":"需要拔除氣切管利於觀察氣切口。","C":"移除所有配件確認氣切管是否阻塞。","D":"從口鼻給氧，氣切口能使用的機會很低。"},"answer":"C","manualChapter":"CH51","matchedChapters":["CH51"]},{"id":2643,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"有關SALT檢傷法之敘述，下列何者最適當？","options":{"A":"第一步先對病人進行整體分類，靜止不動以及有明顯生命垂危的病人應該列為最優先評估順位。","B":"個別評估實施有限的救命措施，係指僅可使用止血帶來控制大出血，其他處置待檢傷分類後再操作。","C":"SALT檢傷法將傷患分為立即、預期、延遲、輕微等4個類別。","D":"當現有資源不足以應付病人傷勢而預期無法生存，則應將其分類為預期，並標記為黑色。"},"answer":"A","manualChapter":"CH52"},{"id":2644,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"指揮中心接獲核電廠反應槽墜落事件，現場一名疑似放射性污染合併外傷患者，下列應變措施何者最適當？","options":{"A":"在現場完成患者全身去污後再後送，避免輻射物質污染後送載具與接收醫院。","B":"進入熱區對患者進行救治時，救護人員須穿著鉛衣以減少輻射傷害。","C":"偵檢發現同仁防護裝備有輻射反應，應以大量溫水做沖洗除污。","D":"患者於後送途中陷入昏迷，應就近送至適當急救責任醫院，不限於核災急救責任醫院。"},"answer":"D","matchedChapters":["CH53"],"manualChapter":"CH53"},{"id":2645,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"戶外活動現場氣溫為33°C，相對濕度75%，多名觀眾出現中暑前兆。此時主辦單位詢問你是否應該暫停活動，請問下列選擇何者最適當？","options":{"A":"係數為33 + 75×0.1 = 40.5，危險係數已達標準，應建議停止活動。","B":"係數為33 + 75×0.1 = 40.5，僅需增加醫護人員與救護車數量即可。","C":"係數為33 + 75×0.1 = 40.5，應設置冷水槽與冰袋降溫即可繼續活動。","D":"係數低於45，屬可接受範圍，可正常進行活動。"},"answer":"A","manualChapter":"CH54","matchedChapters":["CH54"]},{"id":2646,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"在一場全國大專院校田徑賽中，醫療救護站同時接獲三個傷病事件，在評估後，應採取何種處置策略及後送順序？個案甲完成10,000公尺長跑後倒臥終點，意識不清，全身溼透癱軟，嘔吐，疑似中暑或熱衰竭。個案乙在跳遠時發生右腳踝脫臼，疼痛劇烈，但生命徵象穩定。個案丙在場外摔車，臉部多處擦傷，但可自行走動。","options":{"A":"優先後送個案乙，因為脫臼會造成劇烈疼痛，應儘速送醫止痛後復位。","B":"優先後送個案丙，因摔車可能伴隨頭部外傷，雖然意識清醒，但潛在危險最高。","C":"應優先後送個案甲，因其意識不清且嘔吐，合併熱傷害風險，需立即後送至醫院。","D":"個案乙的脫臼應在現場嘗試復位以減少痛苦，個案甲應在場邊進行積極降溫，然後再將兩位病人一同後送。"},"answer":"C","manualChapter":"CH55"},{"id":2647,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"依據INSARAG Guideline，「由42名以上搜救隊員組成，具備於1個災害現場連續7天每日24小時，執行災點倒塌或失效的重型木造和鋼混結構搜索和救援的能力」為下列何者的標準？","options":{"A":"緊急醫療隊特殊照護小組（Specialized care teams）。","B":"緊急醫療隊第一型機動式（Type 1 Mobile）。","C":"城市搜救隊中型救援隊伍（Medium USAR teams）。","D":"城市搜救隊重型救援隊伍（Heavy USAR teams）。"},"answer":"C","manualChapter":"CH56","matchedChapters":["CH45"]},{"id":2648,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"大型槍擊事件中倒地的傷患，意識不清、呼吸時伴隨明顯的鼾聲與血色泡沫。當您準備處理其呼吸道時，發現腹股溝處正迅速被鮮血浸濕，於地面形成一小灘血泊。根據戰術緊急病人救護（TECC）的原則，在當前「暖區」環境下，您的首要行動應為下列何者？","options":{"A":"執行環甲膜切開術，因為傷患的臉部創傷已無法使用基本或聲門上呼吸道處置。","B":"嘗試以含止血敷料的紗布對腹股溝的傷口進行加壓填塞。","C":"考量現場為暖區且傷患意識不清，優先將傷患快速拖行至後方更安全的集結點（冷區）再進行處置。","D":"使用鼻咽呼吸道並側臥傷患，以處理呼吸道阻塞，並準備BVM給予輔助通氣。"},"answer":"B","manualChapter":"CH56"},{"id":2649,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"深夜發生規模7.3地震，多棟建物倒塌，地區停電且道路受阻。部分傷患受困於瓦礫中，另有居民集中於臨時安全區。災難醫療救護隊到達後，關於初期緊急醫療運作，下列何者最適當？ (多選)","options":{"A":"立即投入倒塌現場搜救，爭取受困傷患的黃金救援時間。","B":"優先架設臨時醫療區域，進行檢傷分類與公共衛生監測。","C":"立即通報區域指揮中心，等待後續專責搜救隊接手進駐。","D":"儘速協調收容所安置，防止疫情與群聚感染進一步擴散。"},"answer":"B,C","matchedChapters":["CH07"],"manualChapter":"CH07"},{"id":2650,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"一名多重外傷傷患需以空中後送至本島醫院，預計飛行高度約6,000英呎。胸部X光顯示有小量氣胸。依空中救護原則，下列處置何者最適當？","options":{"A":"直接以直昇機轉送，於途中密切觀察氣胸變化。","B":"先給予高濃度氧氣，並於飛行中持續監測血氧。","C":"改以加壓艙固定翼機轉送，可避免氣壓變化影響。","D":"縱使生命徵象穩定也應考慮在起飛前先置放胸管，以避免氣體膨脹造成惡化。"},"answer":"D","manualChapter":"CH58"},{"id":2652,"source":"114年度EMTP筆試-題目卷(100題)(含答案)-1141226公告版","question":"某一EM T - P訓練課程的核心目標是確保所有新進人員在執行救護時，都能達到一致且明確的標準化操作，以確保醫療品質與病人安全。下列哪一種課程設計模式最符合此次訓練課程的需求？","options":{"A":"歷程模式（Process model）。","B":"情境模式（Situation model）。","C":"目標模式（Objective model）。","D":"ERCP模式（ERCP model）。"},"answer":"C","manualChapter":"CH60","explanation":"目標模式（Objective model / Tyler model）以「明確的學習目標與可測量的績效標準」為核心，強調標準化操作與統一品質，最適合用於需要所有人員達到相同標準的救護技術員訓練。\n選項A（歷程模式）強調學習過程與經驗；\n選項B（情境模式）強調情境脈絡學習；\n選項D（ERCP模式）非標準課程設計模式（ERCP為消化道內視鏡手術縮寫，非教學模式）。\n記憶技巧：要求「一致標準化」的訓練→目標模式（Objective model），把目標和標準定清楚再設計課程。"},{"id":2981,"source":"111年度EMTP筆試-題目卷(100題)(含答案)1120113公告","question":"家屬報案，50歲男性癲癇持續發作，過去有創傷性腦傷與癲癇的病史；您到達現場，發現病患倒臥在客廳地上，意識不清，膚色發紺，持續抽搐中，最優先的處置為？","options":{"A":"測量血氧，使用BVM給氧。","B":"確認意識，施打Midazolam。","C":"給予口咽呼吸道，保護頸椎。","D":"打開呼吸道，確認脈搏。"},"answer":"D","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":3306,"source":"使用者新增","question":"下列哪一年急診被正式列為署定專科醫師？","options":{"A":"1998","B":"1999","C":"2005","D":"2017"},"answer":"A","manualChapter":"CH01"},{"id":3307,"source":"使用者新增","question":"台灣的緊急醫療救護體系由多個專責單位協同運作，任何涉及消防局的流程變更，需經由下列何者單位批准，否則可能因未符合法律程序而無效?","options":{"A":"緊急醫療救護諮詢委員會","B":"醫療顧問委員會","C":"醫療指導醫師會議","D":"急救責任醫院"},"answer":"A","manualChapter":"CH01"},{"id":3317,"question":"急性壓力症(ASD)症狀維持時間？","options":{"A":"1到3天","B":"3到6天","C":"3到15天","D":"3天到1個月"},"answer":"D","source":"TP題庫","manualChapter":"CH06"},{"id":3308,"source":"AI出題","manualChapter":"創傷","question":"一輛小貨車在公路上高速翻覆，25歲男性駕駛受困車內。EMT抵達現場時，傷患已由消防同仁救出。初步評估：傷患意識清醒但極度焦躁（GCS: E4V4M6），主訴右側胸痛、呼吸極度困難。理學檢查發現：右側胸壁有明顯的連枷胸（Flail chest）且有逆向呼吸運動，頸靜脈怒張，氣管稍微向左側偏移，右側呼吸音幾乎聽不到，脈搏每分鐘 125 次（微弱），血壓 82/50 mmHg。請問下列現場處置，何者最為適當？","options":{"A":"立即使用沙包或厚敷料加壓固定右側連枷胸壁，以穩定呼吸","B":"立即協助建立高級呼吸道（如插管），並給予正壓針刺減壓","C":"針對右側鎖骨中線第二肋間或腋前線第四/五肋間進行針刺減壓（Needle decompression）","D":"因傷患意識仍清醒且血壓尚能維持，應立刻使用長背板固定後，火速後送"},"answer":"C"},{"id":3309,"source":"AI出題","manualChapter":"CH16","question":"在執行緊急救護時，面對心律不整傷患的藥物使用，下列敘述何者錯誤？","options":{"A":"當面對規則且穩定的寬 QRS 波心搏過速（懷疑單型性室性心搏過速 VT）時，若病患無禁忌症，可考慮給予 Amiodarone 或 Procainamide 治療","B":"Amiodarone（胺碘酮）屬於第三類抗心律不整藥物，主要機轉為阻斷鉀離子通道，但在心跳停止（Cardiac Arrest）的 VF/pVT 流程中，首劑給藥劑量為 300 mg IV/IO","C":"對於不穩定（Unstable）且有嚴重症狀的陣發性室上性心搏過速（PSVT）傷患，應絕對優先建立靜脈管路並快速推注 Adenosine 6 mg 治療","D":"Magnesium sulfate（硫酸鎂）是治療尖端扭轉型室速（Torsades de Pointes）的首選藥物"},"answer":"C"},{"id":3310,"source":"AI出題","manualChapter":"非創傷","question":"62歲男性，有高血壓、高血脂病史，被家屬發現在房間內行為怪異、流口水、全身大汗淋漓。EMT到場時，傷患神智不清（GCS: E2V2M4），檢查發現瞳孔極度縮小（針狀瞳孔）、肌肉局部抽搐（Fasciculations），且不斷有稀水便與嘔吐物排出，床邊散落著數瓶未知的農用化學製劑。現場生命徵象：心跳每分鐘 48 次、呼吸每分鐘 26 次且滿是濕囉音（Wheezing/Rales）、血壓 90/50 mmHg。請問下列關於此病患的評估與救護處置，何者最不適當？","options":{"A":"此症狀為典型的膽鹼性症候群（Cholinergic toxidrome），主因是體內乙醯膽鹼大量累積所致","B":"第一線救護人員應在確保自身防護（PPE）安全後再接觸病患，避免經皮吸收二次中毒","C":"到院前應遵照醫囑，立即給予解毒劑 Atropine，其主要目的是為了讓瞳孔放大以利觀察意識","D":"應維持呼吸道暢通，並隨時準備進行口鼻腔分泌物之抽吸（Suction）"},"answer":"C"},{"id":3311,"source":"AI出題","manualChapter":"CH52","question":"關於大型災害事故現場的事故指揮體系（ICS）與地點建立觀念，下列敘述何者正確？","options":{"A":"人員裝備集結區（Staging Area）應該設在危險的黃區（管制區），以便資源能在第一時間衝入紅區救援","B":"醫療救護站（Treatment Area）應區分為紅、黃、綠區，通常會選擇設置在交通便利、安全且與事故指揮所（ICP）保持適當距離的冷區","C":"為了簡化通訊，事故現場的最高指揮官（IC）必須親自兼任所有幕僚長與各組組長職務，不應轉授權","D":"當多個跨單位（如消防、警察、衛生局）共同進駐事故指揮所時，應採取各自獨立指揮模式，不需建立聯合指揮（Unified Command）"},"answer":"B"},{"id":3313,"source":"AI出題","manualChapter":"PHTLS","question":"根據最新 ATLS 關於「避免插管周圍心跳停止（Peri-intubation arrest）」的生理學原則，在推注藥物並進行插管的瞬間，下列何種生理變化是導致傷患極易發生 Cardiac Arrest 的最主要原因？","options":{"A":"鎮靜藥物直接抑制了延腦的呼吸中樞，導致血液中二氧化碳分壓（PaCO2）驟升","B":"肌肉鬆弛劑導致全身骨骼肌放鬆，使周邊動脈阻力（SVR）代償性暴增","C":"正壓通氣使胸腔內壓上升，導致腔靜脈回心血量（Preload）雪崩式下跌","D":"錄影喉頭鏡刺激咽喉，引發強烈的迷走神經反射，導致心跳驟停"},"answer":"C"},{"id":3314,"source":"AI出題","manualChapter":"PHTLS","question":"依據最新 ATLS 指引，在準備將插管導管送入氣管前，下列何項處置最符合「優化血流動力學與氧合（Resuscitate Before Intubate）」的精神？","options":{"A":"為了避免大失血休克惡化，應拒絕給予任何鎮靜藥物，直接進行強行插管（Crash intubation）","B":"先以高流量氧氣或 BVM 進行積極預氧合（Pre-oxygenation），並同步實施容量復甦或建立血管收縮劑輸注，使收縮壓盡可能提升再推藥插管","C":"立即給予高劑量的 Propofol（普洛福）以達到深層麻醉，防止插管時的血壓反彈","D":"為了爭取時間，應略過所有預氧合與點滴輸注步驟，在 30 秒內直接完成盲插"},"answer":"B"},{"id":3316,"question":"高級救護技術員肩負的社會責任，請問下列敘述何者為非?","options":{"A":"自由選擇權","B":"公衛責任","C":"尊重權益","D":"永續與效益"},"answer":"D","source":"TP題庫","manualChapter":"CH03"},{"id":3318,"question":"請問大量輸血定義為多少小時內輸血量足以置換全身的血液？","options":{"A":"8","B":"12","C":"24","D":"48"},"answer":"C","source":"TP題庫","manualChapter":"CH26"},{"id":3319,"question":"下列何者屬於「阻塞性休克 ( Obstructive shock )」的常見原因？","options":{"A":"嚴重感染導致敗血症","B":"脊髓損傷導致血管擴張","C":"張力性氣胸","D":"心肌梗塞導致收縮力下降"},"answer":"C","source":"TP題庫","manualChapter":"CH26"},{"id":3320,"question":"關於十二導程心電圖的基本組成與生理意義，下列敘述何者正確？","options":{"A":"體表心電圖的第一個正向波為竇房結（SA node）去極化與再極化所產生的直接電生理訊號。","B":"PR區間（PR interval）包含了心房去極化的時間與房室結的生理性延遲，正常範圍應介於 0.12 至 0.20 秒之間。","C":"PR節段（PR segment）代表心室去極化完成後至再極化開始前的生理性延遲。","D":"正常情形下，胸前導程由 V1 移行至 V6 的過程中，S波會逐漸變大而R波逐漸變小。"},"answer":"B","source":"TP題庫","manualChapter":"CH33"},{"id":3321,"question":"接受血液透析的末期腎病變患者，若在透析後出現頭痛、噁心、意識混亂甚至抽搐，應優先考慮何種急症？","options":{"A":"敗血性休克","B":"不平衡症候群 (Disequilibrium syndrome)","C":"腎上腺危象","D":"低血糖昏迷"},"answer":"B","source":"TP題庫","manualChapter":"CH41"},{"id":3322,"question":"對於海洋生物螫傷，若病患遭水母螫傷產生局部風疹塊與劇痛，下列何種處理方式有助於避免毒素進一步釋放？","options":{"A":"使用乾沙用力摩擦受傷區域以移除觸手","B":"使用 4~6% 的醋酸溶液 (醋) 沖洗患部","C":"利用大量淡水沖洗傷口","D":"立即使用冰袋強力冰敷患部"},"answer":"B","source":"TP題庫","manualChapter":"CH50"},{"id":3323,"question":"當肺泡壁變厚產生的變化，請問下列敘述何者為非","options":{"A":"氧氣交換減少","B":"呼吸困難","C":"二氧化碳排出減少","D":"順應性變好"},"answer":"D","source":"TP題庫","manualChapter":"CH14"},{"id":3324,"question":"軟組織及肌肉骨骼外傷到院前處置中，控制致命性外出血的優先順序與正確方式，下列何者正確？","options":{"A":"肢體穿刺傷或嚴重鈍挫傷若無明顯外出血，可先不做止血處置","B":"加壓止血優先，但若為嚴重快速外出血（如手腕以上截肢），應儘早使用止血帶並送外傷中心","C":"為避免組織壞死，止血帶使用後必須在 15 分鐘內鬆開","D":"對於明顯休克病人，應優先大量輸液再考慮止血，以免延誤循環重建"},"answer":"B","source":"TP題庫","manualChapter":"CH30"},{"id":3325,"question":"愛滋病患者在 CD4 淋巴球總數下降到約多少範圍時，會開始出現正常人少見的伺機性感染（如肺囊蟲肺炎）？","options":{"A":"800~1200 顆/μL","B":"10~50 顆/μL","C":">500 顆/μL","D":"200~350 顆/μL"},"answer":"D","source":"TP題庫","manualChapter":"CH42"},{"id":3326,"question":"現場評估的重點包含4個S，請問下列何者為非?","options":{"A":"確保安全(Safety)","B":"分類(Sort)","C":"狀況回報(Send Information)","D":"建立指揮(Set up)"},"answer":"B","source":"TP題庫","manualChapter":"CH52"},{"question":"有關於爆炸傷的分級，何者有誤？","options":{"A":"第一級：中空器官受傷、腸子破裂","B":"第二級：穿刺傷","C":"第三級：鈍傷","D":"第四級：細菌級化學物質造成人體傷害"},"answer":"D","manualChapter":"CH25","id":3327,"source":"TP題庫 (圖片匯入)"},{"question":"行人被機車碰撞導致頭部撞擊出血，腦壓升高出現庫欣氏徵象，非應採取處置？","options":{"A":"大量輸液","B":"給予輕度過度通氣 Etco2=30~35mmHg","C":"降腦壓藥物","D":"肌肉鬆弛劑"},"answer":"A","manualChapter":"CH27","id":3328,"source":"TP題庫 (圖片匯入)"},{"question":"在自主神經系統中，受體活化會引起不同的生理反應。下列關於腎上腺素受體亞型的敘述，何者正確？","options":{"A":"β2受體活化會造成支氣管平滑肌收縮，惡化氣喘","B":"α1受體活化會引起周邊小動脈收縮，進而使血壓上升","C":"α1受體主要分佈在心臟，活化後增加心跳速率","D":"α2受體主要存在於骨骼肌，負責維持肌肉張力"},"answer":"B","manualChapter":"CH16","id":3329,"source":"TP題庫 (圖片匯入)"},{"question":"根據呼吸調節的負回饋路徑，當機體發生「減少換氣」導致酸中毒時，下列神經傳導路徑何者正確？","options":{"A":"頸動脈體化學感受器經由面神經 (CN VII) 傳遞訊號至延腦。","B":"主動脈體化學感受器經由舌咽神經 (CN IX) 傳遞訊號至延腦。","C":"延腦呼吸中樞經由橫膈神經 (Phrenic nerve) 傳導運動訊號至呼吸肌。","D":"血液 pH 值上升會直接刺激運動神經元，增加呼吸頻率。"},"answer":"C","manualChapter":"CH29","id":3330,"source":"TP題庫 (圖片匯入)"},{"question":"在創傷病患的快速身體診察中，評估肢體時常用的口訣 D-B-P-C-T-M-A-L-S-P-S，其中「M」代表什麼？","options":{"A":"藥物 (Medication)","B":"機轉 (Mechanism)","C":"運動 (Motor)","D":"肌肉 (Muscle)"},"answer":"C","manualChapter":"CH30","id":3331,"source":"TP題庫 (圖片匯入)"},{"question":"小維在醫院實習遇到一名患者，在醫生旁聽見，患者器官功能無法恢復了，而且血壓下降、心跳減緩、多重器官衰竭、心肺功能隨時停止及死亡，請問患者在休克分期是第幾期？","options":{"A":"第一期代償性休克","B":"第二期失常償性休克","C":"第三期不可逆休克","D":"第四期低血容休克"},"answer":"C","manualChapter":"CH26","id":3332,"source":"TP題庫 (圖片匯入)"},{"question":"在進行「觸診 (Palpation)」時，下列操作原則何者正確？","options":{"A":"為了搶時間，對意識清楚的病人可直接實施觸診不需告知。","B":"應直接以深觸診開始，以確保能摸到深層器官。","C":"一般使用指腹或手掌接觸病人，蒐集皮膚特性或器官外廓。","D":"觸診是完全非侵入性的檢查方式。"},"answer":"C","manualChapter":"CH20","id":3333,"source":"TP題庫 (圖片匯入)"},{"question":"有關輸血時，血品的選擇，下列何者不正確？","options":{"A":"一般人，優先使用交叉配對完成的同血型血液。","B":"一般人，次優先為使用 O型血。","C":"有懷孕能力者，使用Rh陰性血。","D":"全血適合給外傷患者使用。"},"answer":"B","manualChapter":"CH26","id":3334,"source":"TP題庫 (圖片匯入)"},{"question":"下列何者正確?","options":{"A":"最主要灼傷型態是燒灼傷，研究顯示身體接觸攝氏44度以上的物品不會造成傷害","B":"接觸物品溫度攝氏44~51度間，每上升1度，造成身體表皮壞死速度減緩","C":"傑克森灼傷理論 (Jackson's Burn Model) 將燒燙傷區分為三層病理區域，用以說明傷口會隨時間惡化","D":"化學灼傷一定會產生熱能"},"answer":"C","manualChapter":"CH31","id":3335,"source":"TP題庫 (圖片匯入)"},{"question":"下列哪一個器官是腹部槍傷最容易受損的器官？","options":{"A":"小腸","B":"大腸","C":"十二指腸","D":"膽囊"},"answer":"A","manualChapter":"CH29","id":3336,"source":"TP題庫 (圖片匯入)"},{"question":"依據ATLS建議，以下何者不用送往灼傷中心照護？","options":{"A":"十歲男童會陰部淺層灼傷。","B":"60歲老先生手掌三度灼傷。","C":"被雷擊中的20歲男性登山客。","D":"剛泡完熱泉，體表面積8%二度灼傷的男子。"},"answer":"D","manualChapter":"CH31","id":3337,"source":"TP題庫 (圖片匯入)"},{"question":"微血管在組織細胞於休克時出現循環血流緩慢，甚至停滯，氧氣、養分供應遠不及組織細胞的需求，細胞進行無氧代謝，導致酸性代謝產物堆積，是在那個時期？","options":{"A":"血管收縮","B":"微血管及小靜脈舒張","C":"瀰漫性血管內凝血病變","D":"多重器官衰竭"},"answer":"B","manualChapter":"CH26","id":3338,"source":"TP題庫 (圖片匯入)"},{"question":"以下關於小兒呼吸道構造的敘述，何者錯誤？","options":{"A":"舌頭占比較大","B":"會厭較大且軟","C":"氣管較長","D":"呼吸道較細"},"answer":"C","manualChapter":"CH32","id":3339,"source":"TP題庫 (圖片匯入)"},{"question":"下列何者「不是」小兒外傷病人院前照護重點？","options":{"A":"頭部及意識評估","B":"循環系統、體表面積","C":"呼吸道、呼吸","D":"暴露（懷疑兒虐與疏忽）"},"answer":"D","manualChapter":"CH32","id":3340,"source":"TP題庫 (圖片匯入)"},{"question":"肋骨骨折最常見的位置為中段第幾肋骨的側面？","options":{"A":"3至8根","B":"4至9根","C":"2至7根","D":"5至10根"},"answer":"A","manualChapter":"CH28","id":3341,"source":"TP題庫 (圖片匯入)"},{"question":"有關主動脈剝離 (aortic dissection) 之陳述，下列何者為非？","options":{"A":"(A) 可能造成心肌梗塞，急性心包膜填塞或主動脈破裂。","B":"(B) 所有主動脈剝離皆應早期施行外科手術治療。","C":"(C) 電腦斷層攝影有相當高的診斷率。","D":"(D) 血壓過高建議使用交感神經乙型阻斷劑控制血壓。"},"answer":"B","manualChapter":"CH34","id":3342,"source":"TP題庫 (圖片匯入)"},{"question":"在區分急性副睪炎與睪丸扭轉時，若將病人的睪丸向上抬起後疼痛可減輕，這被稱為什麼徵象？","options":{"A":"正 Prehn's sign","B":"McBurney's sign","C":"Murphy's sign","D":"負 Prehn's sign"},"answer":"A","manualChapter":"CH41","id":3343,"source":"TP題庫 (圖片匯入)"},{"question":"病人主訴上腹痛且轉移背部，彎腰有時會緩解疼痛，請問以下何者最可能為病人疼痛原因?","options":{"A":"腹膜炎","B":"胰臟炎","C":"急性肝炎","D":"膽囊炎"},"answer":"B","manualChapter":"CH38","id":3344,"source":"TP題庫 (圖片匯入)"},{"question":"一名已知患有 Wolff-Parkinson-White (WPW) 症候群的病患，因心悸與頭暈被送至急診。心電圖顯示為不規則的寬 QRS 波頻脈，強烈懷疑為心房顫動 (Atrial Fibrillation) 合併附屬路徑傳導 (Accessory pathway conduction)。在藥物治療的選擇上，下列何種藥物絕對禁忌使用，以免誘發心室顫動 (Ventricular Fibrillation) 導致猝死？","options":{"A":"Amiodarone (胺碘酮)","B":"Procainamide (普魯卡因胺)","C":"Diltiazem (地爾硫草)","D":"Labetalol (拉貝洛爾)"},"answer":"C","manualChapter":"CH34","id":3345,"source":"TP題庫 (圖片匯入)"},{"question":"救護人員在執行氣管內管插管前進行口腔檢查，若發現病人舌頭或上顎出現「一塊塊白色膜狀物且可輕易刮除」，這通常代表病人患有口腔念珠菌感染，這項發現最重要的臨床意義為何？","options":{"A":"病人最近剛服用完抗生素","B":"病人有嚴重的口腔衛生問題","C":"病人可能處於免疫功能低下狀態（如未控制的糖尿病或愛滋病）","D":"病人有長期的吸菸習慣"},"answer":"C","manualChapter":"CH40","id":3346,"source":"TP題庫 (圖片匯入)"},{"question":"關於急性腎衰竭的描述，下列何者錯誤？","options":{"A":"急性腎衰竭可能在數小時或數天內發生，臨床上症狀較明顯且危急，是漸進性、不可逆的腎臟病變。","B":"腎前性因子：因腎臟血液灌流不足所造成的急性腎衰竭，如心臟衰竭、消化道出血、血管內水分容積不足。","C":"腎性因子：因腎實質本身受到傷害所造成的急性腎衰竭，如腎毒性物質造成腎臟細胞壞死、自體免疫疾病所造成的腎絲球腎炎。","D":"腎後因子：因泌尿道的阻塞造成尿液的累積，進而壓迫正常的腎臟組織所造成的急性腎衰竭，如輸尿管結石、泌尿道腫瘤、攝護腺肥大。"},"answer":"A","manualChapter":"CH41","id":3347,"source":"TP題庫 (圖片匯入)"},{"question":"何者不是造成右心房擴大的先天性心臟病？","options":{"A":"心房中隔缺損","B":"肺動脈狹窄","C":"法洛氏四重症候群","D":"慢性阻塞性肺病"},"answer":"D","manualChapter":"CH33","id":3348,"source":"TP題庫 (圖片匯入)"},{"question":"關於後腹腔（Retroperitoneum）器官受損與相關徵候的敘述，下列何者正確？","options":{"A":"後腹腔器官僅包含胰臟與十二指腸，受損時主要表現為急性腹膜炎","B":"Grey Turner's sign 指的是肚臍周圍出現瘀青，代表可能有後腹腔出血","C":"骨盆或腰椎骨折可能導致後腹腔大量出血，進而引發嚴重的休克症狀","D":"Cullen's sign 與 Grey Turner's sign 通常在受傷後 1 小時內會立即顯現"},"answer":"C","manualChapter":"CH29","id":3349,"source":"TP題庫 (圖片匯入)"},{"question":"患者若出現大量血胸，以下何者錯誤？","options":{"A":"咳血及泡沫的痰","B":"呼吸困難","C":"脈搏增快","D":"頸靜脈怒張"},"answer":"D","manualChapter":"CH26","id":3350,"source":"TP題庫 (圖片匯入)"},{"question":"以下休克敘述何者正確？","options":{"A":"神經性休克有心跳增快，皮膚冰冷情形","B":"低血容性休克有血壓低，皮膚濕冷情形","C":"心因性休克有意識清楚，皮膚蒼白情形","D":"阻塞型休克有血壓升高，頸靜脈一定怒張情形"},"answer":"B","manualChapter":"CH26","id":3351,"source":"TP題庫 (圖片匯入)"},{"question":"根據我國《毒性及關注化學物質管理法》，若某化學物質在曝露後立即會對人體造成危害，該物質屬於哪一類？","options":{"A":"第二類","B":"第三類","C":"第一類","D":"第四類"},"answer":"B","manualChapter":"CH53","id":3352,"source":"TP題庫 (圖片匯入)"},{"question":"1. 關於TECC（Tactical Emergency Casualty Care）的敘述，下列何者最正確？","options":{"A":"TECC最早由軍方戰場醫療體系提出，主要適用於純軍事作戰環境","B":"TECC委員會於首次會議後，建立適用民間高風險戰術與救援行動的照護指引","C":"TECC目的在取代所有傳統EMT與院前救護流程，以統一全球創傷處置模式","D":"TECC第一版指引強調一般門診與常規急診醫療環境的病患分類系統"},"answer":"B","manualChapter":"CH56","id":3353,"source":"TP題庫 (圖片匯入)"},{"question":"根據氣體定律，夏季陽光直射使機艙溫度上升，可能對醫療設備造成何種誤判風險？","options":{"A":"溫度上升使氧氣瓶體積壓縮，引發操作人員誤判","B":"溫度上升使氧氣瓶壓力增加，引發殘餘讀數誤判","C":"溫度上升使氧氣瓶體積膨脹，引發鋼瓶嚴重破裂","D":"溫度上升使氧氣瓶壓力驟降，引發結構安全危害"},"answer":"B","manualChapter":"CH58","id":3354,"source":"TP題庫 (圖片匯入)"},{"question":"負責提供事故應變所需的資源與服務，且支援的對象為工作人員，並非事故中的傷病患，為ICS架構中的？","options":{"A":"後勤部門","B":"計劃部門","C":"執行部門","D":"以上皆非"},"answer":"A","manualChapter":"CH52","id":3355,"source":"TP題庫 (圖片匯入)"},{"question":"依照 [毒性及關注化學物質管理法] ，若某種化學物質曝露後會立即危害人體健康，應歸類為哪一類毒性化學物質？","options":{"A":"第一類","B":"第三類","C":"第四類","D":"第二類"},"answer":"B","manualChapter":"CH53","id":3356,"source":"TP題庫 (圖片匯入)"},{"question":"窒息劑(Asphyxiants)對人體造成傷害的機轉不同。下列何種物質會使血液無法攜帶氧氣或細胞無法利用氧氣？","options":{"A":"氮氣","B":"二氧化碳","C":"氰化物","D":"氦氣"},"answer":"C","manualChapter":"CH53","id":3357,"source":"TP題庫 (圖片匯入)"},{"question":"比較成人5H5T與小孩6H5T有何不同？","options":{"A":"Toxins中毒","B":"Hypothermia低體溫","C":"Thrombosis，coronary 栓塞,心肌梗塞","D":"Hypoglycemia低血糖"},"answer":"D","manualChapter":"CH48","id":3358,"source":"TP題庫 (圖片匯入)"},{"question":"一名病人氣喘急性發作，經短效型支氣管擴張劑治療後， EtCO2 從 35 逐漸上升至 50 mmHg下列臨床思維何者為是？","options":{"A":"氣喘症狀改善。","B":"需考慮其他藥物治療如：albuterol等。","C":"氣喘導致的代謝性酸中毒惡化。","D":"氣喘惡化導致灌流不佳進而使EtCO2 上升，需靜脈輸液。"},"answer":"B","manualChapter":"未指定章節","id":3359,"source":"TP題庫 (圖片匯入)"},{"question":"關於新生兒氣管插管深度的鼻耳屏長度法( NTL method)，下列何者正確？","options":{"A":"僅適用於足月兒","B":"僅適用於早產兒","C":"適用於足月兒與早產兒","D":"僅適用於低出生體重兒"},"answer":"C","manualChapter":"CH48","id":3360,"source":"TP題庫 (圖片匯入)"},{"question":"台灣地處亞熱帶，森林茂密，氣候溫暖潮濕，是毒蛇生長繁殖的最佳環境。台灣疾管署之抗蛇毒血清的製備中，除了鎖鏈蛇血清(出血性及神經性混合毒)外，何種血清亦可抗鎖鏈蛇蛇毒？","options":{"A":"抗百步蛇蛇毒血清","B":"抗雨傘節及飯匙倩蛇毒血清","C":"抗龜殼花及赤尾鮐蛇毒血清","D":"抗蛇毒血清有專一性，無法併用"},"answer":"D","manualChapter":"CH50","id":3361,"source":"TP題庫 (圖片匯入)"},{"question":"有關小兒解剖生理構造，何者為是？","options":{"A":"肝和小腸所相對體積較大","B":"3歲以上平躺時需墊肩以維持呼吸道暢通","C":"會厭傾斜45度","D":"最狹窄處在聲門"},"answer":"C","manualChapter":"CH48","id":3362,"source":"TP題庫 (圖片匯入)"},{"question":"小兒癲癇重積狀態原因會因年齡有所不同，請問跟新生兒有關的原因，何者敘述有錯？","options":{"A":"代謝疾患","B":"感染","C":"先天性不正常","D":"大腦退化性疾病"},"answer":"D","manualChapter":"CH48","id":3363,"source":"TP題庫 (圖片匯入)"},{"question":"關於TEN-4瘀傷準則與兒童虐待通報標準，下列何者正確？","options":{"A":"TEN-4指的是：10歲以下兒童任何部位超過4處瘀傷即通報","B":"TEN-4指的是：4歲以下兒童軀幹、耳朵、脖子的瘀傷；或4個月以下嬰兒全身任一處瘀傷，應高度懷疑身體虐待","C":"符合下列任意一項即應通報：①超過三次以上急診外傷就醫紀錄；②病史不一致；③延遲就醫","D":"2歲以下任何骨折才需通報，1歲以下頭部外傷不在通報條件內"},"answer":"B","manualChapter":"CH48","id":3364,"source":"TP題庫 (圖片匯入)"},{"question":"當 EMT-P 抵達現場發現氣切病人呼吸困難，且氣切管已「完全脫落」時，下列處置何者最「不適當」？","options":{"A":"應切記不可隨意將脫落之氣切管直接放回造口，避免誤入假腔造成皮下氣腫","B":"若單位流程允許，可考慮從氣切造口置入管徑大小相近或略小的氣管內管（ET tube）","C":"若需經氣切造口置入氣管內管，其置入深度應為造口至胸骨角 (Louis angle) 的距離","D":"若病人為「全喉切除術 (Total Laryngectomy) 」患者，應蓋住造口改從口鼻進行甦醒球正壓給氣"},"answer":"D","manualChapter":"CH51","id":3365,"source":"TP題庫 (圖片匯入)"},{"question":"根據老年抑鬱量表（GDS）的篩檢流程，當分數切點落在幾分以上時，會被評估為「重度憂鬱」，並建議轉介醫療系統與相關資源？","options":{"A":"5分以上","B":"7分以上","C":"10分以上","D":"11分以上"},"answer":"D","manualChapter":"CH47","id":3366,"source":"TP題庫 (圖片匯入)"},{"question":"有關高齡患者神經系統疾病，下列何者敘述錯誤？","options":{"A":"譫妄是一種急性發作的症候群。","B":"譫妄通常與器質性腦病變有關。","C":"譫妄發生原因可能與發燒有關。","D":"譫妄患者通常持續保持清醒但容易妄想。"},"answer":"D","manualChapter":"CH47","id":3367,"source":"TP題庫 (圖片匯入)"},{"question":"關於婦產急症，下列何者正確？","options":{"A":"羊水栓塞指的是嬰兒於分娩時，將羊水吸入肺部引發肺栓塞導致出血、休克和瀰漫性血管內凝血異常等一系列病變。","B":"子癲前症亦稱為妊娠毒血症，發生原因不明，通常發生於孕婦生產雙胞胎、三胞胎時。","C":"子癲前症在懷孕時會出現高血壓、水腫及蛋白尿，通常發生在懷孕第三期。","D":"先兆性流產為常見懷孕婦女陰道出血的原因，多發生於懷孕前20週，通常在第6-12週，合併陰道出血及腹部絞痛，可能有下部酸痛的原因。"},"answer":"D","manualChapter":"CH49","id":3368,"source":"TP題庫 (圖片匯入)"},{"question":"以下關於生產相關急症及處置，何者正確？","options":{"A":"在擴張的子宮頸見到脫出及因頭夾住而發紺的臍帶，須以手指伸入子宮頸托住胎兒頭部避免缺氧。需先通知醫療指定才能進行。","B":"新生兒急救：(1) 氣道、(2) 呼吸、(3) 循環、(4) 乾燥、(5) 環境、(6) 家人等六點重點。其中最重要的是判斷新生兒的心跳或臍動脈脈搏每分鐘小於60下時須正壓給氣，每分鐘臍動脈脈搏小於50下時必須執行CPR。","C":"子癲前症亦稱為妊娠毒血症，通常發生於第一胎。病人在懷孕時會出現高血壓(收縮壓≥140mmHg或舒張壓≥90mmHg)、水腫及尿蛋白，通常發生在懷孕第三期。","D":"產後大出血定義為自然產後24小時內出血量大於1,000cc、剖腹生產超過2,000cc的出血。變大的子宮排空後必須收縮控制出血，產後子宮收縮不良(uterine atony)是出血最常見原因。"},"answer":"A","manualChapter":"CH49","id":3369,"source":"TP題庫 (圖片匯入)"},{"question":"在輸血反應中，TRALI (輸血相關急性肺損傷) 與 TACO (輸血相關循環負荷過重) 臨床表現相似，下列何者是區分兩者的關鍵？","options":{"A":"TRALI 患者通常會伴隨血壓升高與頸靜脈怒張","B":"TRALI 是免疫介導的非心因性肺水腫，而 TACO 是容量過載","C":"兩者皆是因 ABO 血型不合引起","D":"TACO 患者給予利尿劑後症狀不會改善"},"answer":"B","manualChapter":"CH39","id":3370,"source":"TP題庫 (圖片匯入)"},{"question":"關於缺血性中風與出血性中風的臨床特徵，下列敘述何者錯誤？","options":{"A":"暫時性腦缺血發作（TIA）不會留下後遺症","B":"出血性腦中風絕少在睡眠中發作","C":"蜘蛛膜下腔出血 (SAH) 常見於高齡且伴隨糖尿病的病人","D":"缺血性腦中風約占所有腦中風的 85%"},"answer":"C","manualChapter":"CH36","id":3371,"source":"TP題庫 (圖片匯入)"},{"question":"關於「食道與胃靜脈曲張」的成因與緊急處置，下列敘述何者錯誤？","options":{"A":"其出血風險與體循環之全身性動脈血壓成正比，故控制高血壓是預防破裂的主要手段。","B":"病人若發生大量吐血，到院前應協助其採取半坐臥姿，以降低血液嗆入氣道的風險。","C":"靜脈曲張破裂出血量極大，到院前需即時監測生命徵象並視情況執行靜脈輸液治療。","D":"此類疾病之靜脈曲張主要肇因於肝門靜脈高壓，導致消化系統血液回流受阻。"},"answer":"A","manualChapter":"CH38","id":3372,"source":"TP題庫 (圖片匯入)"},{"question":"下列有關賀爾蒙(Hormone)的描述何者錯誤？","options":{"A":"胰島素對於腦部細胞的糖分吸收及儲存幾乎沒有效果。","B":"生長激素的功能主要是作為胰島素的拮抗物質，可以減少胰島素在細胞膜上的作用。","C":"低血清葡萄糖濃度會刺激交感神經系統分泌腎上腺素。","D":"升糖素由胰臟胰島β細胞分泌出的荷爾蒙，能將肝臟中的肝醣轉化為葡萄糖。"},"answer":"D","manualChapter":"CH37","id":3373,"source":"TP題庫 (圖片匯入)"},{"question":"如果高尖P波出現，可能是什麼疾病，下列何者唯非？","options":{"A":"心中隔缺損","B":"急性肺栓塞","C":"COPD","D":"冠狀動脈心臟病"},"answer":"D","manualChapter":"CH33","id":3374,"source":"TP題庫 (圖片匯入)"},{"question":"關於藥物中毒與解毒劑的配對下列何者不正確??","options":{"A":"乙醯胺酚與Fluimucil","B":"BZD與Flumazenil","C":"甲醇與乙醇","D":"Beta-blockers與Atropine"},"answer":"D","manualChapter":"CH50","id":3375,"source":"TP題庫 (圖片匯入)"},{"question":"有關剛出生的新生兒若需插管注意事項，下列描述何者正確？","options":{"A":"懷孕30週新生兒使用內徑2.5mm的氣管內管","B":"鼻兒屏長度法為測量鼻中隔至耳屏長度，此為氣管適當深度","C":"插管過程不應超過15秒","D":"體重1500公克新生兒使用內徑3mm的氣管內管"},"answer":"D","manualChapter":"CH48","id":3376,"source":"TP題庫 (圖片匯入)"},{"question":"胸部X光的簡易判讀順序有相當多口訣，目的在於有系統性的判讀，其中有ABCDEFGHI口訣，請問下列何者錯誤？","options":{"A":"Diaphragm 橫膈膜","B":"Gastric bubble 胃部氣體(游離空氣)","C":"Esophagus 食道","D":"Bone 骨骼"},"answer":"C","manualChapter":"CH51","id":3377,"source":"TP題庫 (圖片匯入)"},{"question":"一名患者因蓄意吞服大量不明藥物被送至急診。在考慮給予活性碳（Activated charcoal）進行腸胃道除污時，下列哪一種物質的攝入為使用活性碳的「絕對禁忌症」？","options":{"A":"卡馬西平 (Carbamazepine)","B":"硫酸亞鐵或其他金屬鹽類 (Ferrous sulfate or other iron salts)","C":"茶鹼 (Theophylline)","D":"苯巴比妥 (Phenobarbital)"},"answer":"B","manualChapter":"CH50","id":3378,"source":"TP題庫 (圖片匯入)"},{"question":"下列何者不是酒精依賴症候群？","options":{"A":"會有規律的物質使用模式","B":"會有生理上的物質耐受性","C":"戒斷後容易再次上癮","D":"會有心理上的耐受性"},"answer":"D","manualChapter":"CH46","id":3379,"source":"TP題庫 (圖片匯入)"},{"question":"對於「熱區」的目標與處置重點，下列敘述何者錯誤？","options":{"A":"應儘量讓應變人員消除威脅","B":"無論任何情況，止血帶均是唯一可行止血方式","C":"執行救護對救援人員與病人都有極高風險","D":"目標在於脫離危險環境，減低傷亡"},"answer":"B","manualChapter":"CH56","id":3380,"source":"TP題庫 (圖片匯入)"},{"question":"在暖區（Warm zone）進行傷患照護時，應遵循 MARCH 口訣。其中字母「R」代表的臨床處置與評估重點為何？","options":{"A":"胸部外傷急症處置與呼吸處置 (Respiration)","B":"維持呼吸道與保護 (Airway)","C":"辨識休克與建立輸液管路 (Circulation)","D":"預防低體溫與頭部外傷評估 (Head injury/Hypothermia)"},"answer":"A","manualChapter":"CH56","id":3381,"source":"TP題庫 (圖片匯入)"},{"question":"輻射防護最重要的原則何者為非？","options":{"A":"時間","B":"距離","C":"屏蔽","D":"隔絕"},"answer":"D","manualChapter":"CH53","id":3382,"source":"TP題庫 (圖片匯入)"},{"question":"根據「路跑活動參與者安全維護及權益保障應注意事項」，關於熱中暑危險係數之判斷與應變，下列敘述何者正確？","options":{"A":"熱中暑危險係數 = 室外溫度(°C) + 室外相對濕度(%) × 1.0","B":"當危險係數大於 35 時，主辦單位應設置降溫設備（如冷水槽、碎冰）協助降溫","C":"當危險係數大於 35 時，主辦單位「宜」停止活動","D":"只有在危險係數大於 40 時，才需要開始配置醫師、護理人員或救護技術員"},"answer":"B","manualChapter":"CH54","id":3383,"source":"TP題庫 (圖片匯入)"},{"question":"某年大會調查一起奧運選手突發的集體食物中毒事件，患者皆在進食冷盤雞肉沙拉與卡士達塔後 2 小時內出現劇烈噴射狀嘔吐與上腹痙攣劇痛，全體無發燒。衛生單位將現場殘留的該批食物進行 100°C 加熱煮沸 30 分鐘處置後，送往實驗室化驗，結果未分離出任何致病活菌。請問該起食物中毒的致病機轉與病原為何？","options":{"A":"仙人掌桿菌（B. cereus）在腸道內增殖並釋放熱不穩定毒素","B":"仙人掌桿菌（B. cereus）在食物中預先產生的嘔吐毒素","C":"金黃葡萄球菌（S. aureus）吞入後在小腸定殖並分泌毒素","D":"金黃葡萄球菌（S. aureus）在食物中預先產生的耐熱腸毒素"},"answer":"D","manualChapter":"CH55","id":3384,"source":"TP題庫 (圖片匯入)"},{"question":"下列何種傷口特別需要注意破傷風感染？","options":{"A":"無出血傷口","B":"超過6小時未處理的污染傷口","C":"已癒合傷口","D":"小於0.5公分傷口"},"answer":"B","manualChapter":"CH57","id":3385,"source":"TP題庫 (圖片匯入)"},{"question":"在空中救護過程中，根據波以耳定律（Boyle's Law），當航空器海拔高度上升時，對患有氣胸的病人會產生什麼影響？","options":{"A":"大氣壓力增加，導致肺部塌陷更嚴重","B":"溫度下降導致氣體溶解度增加，緩解氣壓傷","C":"體內腔室氣體體積膨脹，可能惡化為張力性氣胸","D":"氧氣分壓降低，導致血氧濃度計讀數偏高"},"answer":"C","manualChapter":"CH58","id":3386,"source":"TP題庫 (圖片匯入)"},{"question":"輻射防護的原則，何者為非？","options":{"A":"時間(time)","B":"空間(space)","C":"距離(distance)","D":"屏蔽(shielding)"},"answer":"B","manualChapter":"CH53","id":3387,"source":"TP題庫 (圖片匯入)"},{"question":"有關城市搜救隊等級說明，下列何者錯誤","options":{"A":"輕型救援隊伍由21名以上搜救隊員組成","B":"中型救援隊伍由42名以上搜救隊員組成","C":"輕型救援隊伍具備於1個災害現場連續3天每日12小時，執行災點淺層的救援能力。","D":"中型救援隊伍具備於1個災害現場連續7天每日24小時，執行災點倒塌或失效的重型木造和鋼混結構搜索和救援的能力。"},"answer":"A","manualChapter":"CH56","id":3388,"source":"TP題庫 (圖片匯入)"},{"question":"救護車到場，一名32歲男性潛水者，在接近水面時突發意識喪失，懷疑為空氣栓塞。下列關於空氣栓塞院前處置的敘述，何者不正確？","options":{"A":"高級救護技術員應立即施行BLS及ALS處置","B":"病人應盡速轉送到有加壓艙治療的醫院","C":"插管時充氣囊（Cuff）建議注入生理食鹽水而不要充入空氣","D":"懷疑空氣栓塞的病人，應立即以坐姿運送，使氣泡盡快排出"},"answer":"D","manualChapter":"CH44","id":3389,"source":"TP題庫 (圖片匯入)"},{"question":"三環抗憂鬱劑常被處方來治療憂鬱症以及某些疼痛症候群，下列何者「非為」嚴重的三環抗憂鬱劑中毒的症狀？","options":{"A":"呼吸抑制","B":"昏迷","C":"口腔濕潤","D":"腸胃道不適"},"answer":"C","manualChapter":"CH50","id":3390,"source":"TP題庫 (圖片匯入)"},{"question":"有關癲癇重積處置流程何者正確？","options":{"A":"靜脈注射lorazepam 0.1mg/kg，單次最大劑量2mg","B":"靜脈注射diazepam 0.1-0.3mg/kg,單次最大劑量5mg","C":"靜脈注射midazolam 0.1mg/kg，單次最大劑量10mg","D":"若在使用過phenobarbital後，痙攣仍持續10分鐘，可考慮以10mg/kg的劑量再給予一次，直到達到最大劑量40mg/kg"},"answer":"D","manualChapter":"CH48","id":3391,"source":"TP題庫 (圖片匯入)"},{"question":"關於高齡病人的腎臟生理變化，從 30 歲到 80 歲，平均腎血流量 (Renal Blood Flow) 會降低約多少比例？","options":{"A":"50%","B":"35%","C":"25%","D":"70%"},"answer":"A","manualChapter":"CH47","id":3392,"source":"TP題庫 (圖片匯入)"},{"question":"何者不是新生兒 (第一個月) 癲癇重積狀態之原因","options":{"A":"生產受傷(缺氧、出血)","B":"天生的代謝錯誤","C":"大腦退化性疾病","D":"腦膜炎"},"answer":"C","manualChapter":"CH48","id":3393,"source":"TP題庫 (圖片匯入)"},{"question":"根據新生兒急救流程，若新生兒出生後心跳低於每分鐘 100 次且有呼吸暫停(apnea) 現象，應在多久時間內開始提供正壓通氣 (PPV) ？","options":{"A":"出生後 1 分鐘內","B":"出生後 2 分鐘內","C":"出生後 30 秒內","D":"出生後 5 分鐘內"},"answer":"A","manualChapter":"CH48","id":3394,"source":"TP題庫 (圖片匯入)"},{"question":"野外脊椎評估通過的標準「不包括」下列何者？","options":{"A":"精神狀態正常且可信賴","B":"脊柱觸診無明顯變形且無壓痛","C":"四肢感覺運動檢測正常","D":"即使有輕微麻木感但力量正常"},"answer":"D","manualChapter":"CH45","id":3395,"source":"TP題庫 (圖片匯入)"},{"question":"在辨識膽鹼性中毒時，口訣「SLUDGE」中的「S」代表什麼？","options":{"A":"流口水 (Salivation)","B":"癲癇 (Seizure)","C":"震顫 (Spasm)","D":"嗜睡 (Sleepiness)"},"answer":"A","manualChapter":"CH50","id":3396,"source":"TP題庫 (圖片匯入)"},{"question":"熱痙攣常發生在高溫且運動的時候，伴隨著大量流失的水與鈉，如不及時補充就可能發生熱痙攣，請問熱痙攣通常沒有好發於下列哪個部位？","options":{"A":"大腿","B":"小腿","C":"手臂","D":"腹部"},"answer":"D","manualChapter":"CH44","id":3397,"source":"TP題庫 (圖片匯入)"},{"question":"下列何者錯誤？","options":{"A":"兒童遭受胸部外傷後易產生肺挫傷","B":"兒童的縱膈腔比較具活動性","C":"兒童胸壁較薄，因此比較好確認氣管內管位置","D":"嬰幼兒用橫膈呼吸"},"answer":"C","manualChapter":"CH48","id":3398,"source":"TP題庫 (圖片匯入)"},{"question":"下列哪一項不是甲狀腺亢進可能伴隨的症狀？","options":{"A":"比較腫的脖子","B":"凸出的眼睛","C":"心悸","D":"體重增加"},"answer":"D","manualChapter":"CH37","id":3399,"source":"TP題庫 (圖片匯入)"},{"question":"有關急性心肌梗塞之心電圖判讀下列何者正確？","options":{"A":"Q波之出現，代表心肌細胞已發生不可逆的死亡，可確立已發生過心肌梗塞或有心肌正在發生壞死。","B":"心肌梗塞心電圖變化為 超急性T波>ST段上升>T波反轉>ST段下降回基準線>新Q波出現","C":"若左心室前壁發生急性心肌梗塞，往往是II、III、aVF導程有最為明顯之ST段上升情形","D":"T波反轉只會出現在心肌梗塞患者的心電圖，故可以利用T波反轉作為心肌梗塞的判斷標準"},"answer":"A","manualChapter":"CH33","id":3400,"source":"TP題庫 (圖片匯入)"},{"question":"關於傳染病敘述，以下何者正確？","options":{"A":"腸病毒為RNA病毒，為單一病毒的簡稱","B":"黑死病的自然傳染途徑主要為老鼠與人之間的直接感染","C":"結核病分為開放性與非開放性兩種，非開放性的結核病不治療也不會傳染給其他人。","D":"生物戰劑的意思為：以病原及毒素為主，可做為攻擊人類及其農產或畜產的武器。"},"answer":"D","manualChapter":"CH42","id":3401,"source":"TP題庫 (圖片匯入)"},{"question":"關於血友病（Hemophilia）的致病機轉與臨床特徵，下列敘述何者正確？","options":{"A":"血友病病人受傷時，其最大的問題是容易有自發性出血的危險，且中樞神經（顱內）出血是造成這類病人死亡的最主要原因","B":"血友病是一種後天因化療藥物所引起的血小板破壞疾病","C":"缺乏第八凝血因子的稱為B型血友病；缺乏第九凝血因子的稱為A型血友病","D":"血友病主要發生於女性，受傷時的出血速度比一般人快上數倍"},"answer":"A","manualChapter":"CH39","id":3402,"source":"TP題庫 (圖片匯入)"},{"question":"急性膽囊炎是指導管或膽囊發炎，好發於 30-50 歲的肥胖女性。關於膽結石在東方人與西方人的成分差異，下列敘述何者正確？","options":{"A":"東方人常見的是膽固醇結石，與高脂肪飲食有關","B":"東方人常見的是色素結石，與遺傳因子及代謝有關","C":"西方人常見的是色素結石，與西方人常吃油膩有關","D":"東方人與西方人最常見的皆為草酸鈣結石"},"answer":"B","manualChapter":"CH38","id":3403,"source":"TP題庫 (圖片匯入)"},{"question":"有關洛杉磯到院前腦中風評量表(LAPSS) 與辛辛那提到院前中風指標(CPSS)的敘述下列何者為是?","options":{"A":"意識不清需要快速評估病人是否急性腦中風更適合使用CPSS。","B":"CPSS中風指標3項全數符合陽性預測值高達97%。","C":"CPSS同時也需要檢查動眼測試以及檢測血糖。","D":"LAPSS單側不對稱這一項只需要符合臉部、握力或手臂力量強度其中之一即可。"},"answer":"D","manualChapter":"CH36","id":3404,"source":"TP題庫 (圖片匯入)"},{"question":"下列哪個情況符合代謝總合症？","options":{"A":"男士腰圍40英寸或以上","B":"女士腰圍40英寸或以上","C":"空腹血糖濃度110 mg/dl以上","D":"血壓升至150/95mm/hg或以上"},"answer":"A","manualChapter":"CH37","id":3405,"source":"TP題庫 (圖片匯入)"},{"question":"下列關於腹部觸診之鑑別診斷,何者非右上腹之腹痛表現?","options":{"A":"膽囊炎","B":"食道炎","C":"肝炎","D":"胰臟炎"},"answer":"B","manualChapter":"CH38","id":3406,"source":"TP題庫 (圖片匯入)"},{"question":"心電圖的動態變化指ST段上升心肌梗塞的心電圖變化會隨時間進行有所不同，下列何者非ST段上升心肌梗塞演進變化？","options":{"A":"ST段上升是常見的心電圖變化，也是心電圖上第一個出現的異常","B":"超級性T波是ST段上升心肌梗塞心電圖的第一個變化","C":"超過前WRS幅度75%可視為超級性T波","D":"ST段上升後若出現T波倒置表示有重注灌流現象，是好的現象"},"answer":"A","manualChapter":"CH34","id":3407,"source":"TP題庫 (圖片匯入)"},{"question":"何者最可能造成腎後性腎衰竭？","options":{"A":"脫水","B":"輸尿管結石","C":"心衰竭","D":"血管內水分容積不足"},"answer":"B","manualChapter":"CH41","id":3408,"source":"TP題庫 (圖片匯入)"},{"question":"在台灣，下列哪一種新興感染症常發生於南台灣地區，且特別容易在水災過後出現？","options":{"A":"SARS","B":"類鼻疽","C":"退伍軍人症","D":"腸病毒71型"},"answer":"B","manualChapter":"CH43","id":3409,"source":"TP題庫 (圖片匯入)"},{"question":"有關腎臟衰竭敘述下列何者錯誤？","options":{"A":"不論慢性或急性，腎功能喪失或幾乎完全喪失均稱為末期腎病變(end-stage renal disease)","B":"腎性因子為腎臟血液灌流不足導致","C":"慢性腎臟病 (Chronic Kidney Disease)會導致eGFR下降、尿蛋白排泄增加","D":"急性腎臟衰竭定義為，血清肌酐酸在48小時內上升0.3mg/dL、7天內上升1.5倍的基準值"},"answer":"B","manualChapter":"CH41","id":3410,"source":"TP題庫 (圖片匯入)"},{"question":"心電圖上PR節段的上升可能為何種情況？","options":{"A":"心房梗塞","B":"急性心包膜填塞","C":"房室傳導阻塞","D":"心室顫動"},"answer":"A","manualChapter":"CH33","id":3411,"source":"TP題庫 (圖片匯入)"},{"question":"下列四個機制血糖調節，何者錯誤？","options":{"A":"肝臟具有血糖緩衝系統的作用。","B":"胰島素和升糖素作為正向回饋系統的功能。","C":"低血清葡萄糖濃度刺激交感神經系統分泌腎上腺素。","D":"生長激素和皮質醇在血糖濃度較低的即時調節中起作用。"},"answer":"B","manualChapter":"未指定章節","id":3412,"source":"TP題庫 (圖片匯入)"},{"question":"關於這兩類阻塞性肺病病人的呼吸阻力比較，下列何者符合來源內容？","options":{"A":"肺氣腫病人在吸氣跟吐氣時都有阻力升高現象","B":"慢性支氣管炎病人在吸氣跟吐氣時都有呼吸道阻力升高的現象","C":"肺氣腫病人主要在吸氣時感到困難","D":"兩者都只有在吐氣時才會感到呼吸困難"},"answer":"B","manualChapter":"CH35","id":3413,"source":"TP題庫 (圖片匯入)"},{"question":"下列哪種物質被認為在支氣管收縮的作用時間上比組織胺「更長」？","options":{"A":"肝素","B":"白三烯素","C":"類胰蛋白酶","D":"補體蛋白質"},"answer":"B","manualChapter":"CH40","id":3414,"source":"TP題庫 (圖片匯入)"},{"question":"下列何者不是DKA和HHS共同的常見原因？","options":{"A":"過量胰島素自殺者","B":"胰島素使用習慣不佳者","C":"糖尿病合併感染者","D":"酒精性胰臟炎惡化者"},"answer":"A","manualChapter":"CH37","id":3415,"source":"TP題庫 (圖片匯入)"},{"question":"關於「主動脈剝離的診斷方式」何者為非？","options":{"A":"經食道心臟超音波檢查","B":"電腦斷層掃描","C":"核磁共振攝影","D":"血液生化檢查"},"answer":"D","manualChapter":"CH34","id":3416,"source":"TP題庫 (圖片匯入)"},{"question":"常見的腦中風症狀，何者為不是？","options":{"A":"失語症","B":"視野缺損","C":"顱神經障礙","D":"全身肢體無力"},"answer":"D","manualChapter":"CH36","id":3417,"source":"TP題庫 (圖片匯入)"},{"question":"針對呼吸困難之病人，儘量以氧氣面罩維持血氧濃度大於幾％即可？","options":{"A":"93%","B":"94%","C":"95%","D":"96%"},"answer":"B","manualChapter":"CH35","id":3418,"source":"TP題庫 (圖片匯入)"},{"question":"高級救護技術員 (EMT-P) 接獲一通急病救護指派，現場為一名68歲男性病人，家屬主訴病人今日突然出現劇烈的上腹部疼痛，在到院前的病史詢問與身體診察中，發現病人過去病史包含常年酗酒、第二型糖尿病以及慢性胃衰竭(常年洗腎，右手留有廔管)。目前病人面色蒼白、額頭滿是汗水，雙手緊緊捂著上腹部，並主訴疼痛會轉移至背部。彎腰時疼痛稍微緩解。現場生命徵象評估：意識對痛有反應、呼吸淺快(約24次/分鐘)、脈搏145下/分鐘且微弱、血壓74/55 mmHg、SpO2 94%、指尖血糖值 (BHI) 顯示為「LOW」。關於此病人的臨床診斷、病理生理學機制以及到院前處置，下列敘述何者「錯誤」？","options":{"A":"病人表現出「彎腰護食稍微緩解疼痛，躺下會更加劇疼痛」的特徵，高度暗示其病因可能為急性胰臟炎，而此疾病在台灣最常見的兩大誘發因子恰好與酒精濫用及膽道管結石有關。","B":"面對病人血壓 74/55 mmHg 與機動脈摸不到的休克狀態，在建立周邊靜脈輸液管道 (IV) 給予體液補充時，由於病人右手留有洗腎廔管，應嚴格避免在右手執行靜脈穿刺，且須隨時注意兩側肺底是否出現濕囉音。","C":"病人的血糖值顯示為「LOW」，且呼吸呈現「淺快」而非「深且快(Kussmaul 呼吸)」，這在病理生理學上完全排除了病人同時併發糖尿病酮酸血症(DKA)或高滲透壓高血糖症候群(HHS)這兩種急性糖尿病代償失調病症的可能性。","D":"對於此意識不清且合併休克的低血糖病人，若現場嘗試建立周邊靜脈輸液管道失敗，EMT-P 可依預立醫囑嘗試改用皮下或肌肉注射升糖素 (Glucagon) 來加速肝糖分解，但必須預期此處置對這名常年酗酒的病人可能效果不彰。"},"answer":"C","manualChapter":"CH37","id":3419,"source":"TP題庫 (圖片匯入)"},{"question":"關於救急救難一站通計畫，下列哪一個單位負責建置資料交換平台？","options":{"A":"國家災害防救科技中心","B":"內政部消防署","C":"衛生福利部","D":"交通部"},"answer":"A","manualChapter":"CH10","id":3420,"source":"TP題庫 (圖片匯入)"},{"question":"下列何者不是副交感神經節前神經元的來源？","options":{"A":"滑車神經","B":"顏面神經","C":"舌咽神經","D":"迷走神經"},"answer":"A","manualChapter":"CH16","id":3421,"source":"TP題庫 (圖片匯入)"},{"question":"到院前救護需根據科學證據來進行救護處置，關於高級救護員於研究科學文獻時，要如何判斷其科學證據力，下列何者正確？","options":{"A":"回溯性方法(retrospective method)，在研究開始前，特定的問題、假設、和資料收集的方式早就被定義好","B":"研究假設(hypothesis)通常包含P-I-C-O四個成分，分別為：(Population)研究對象、(Inversion)逆向推論、(comparator)對照組、(Outcome)設定預後","C":"所謂橫斷面方法，是研究在一個特定時間點或一段很短時期內的一群人","D":"統計可分為「描述性統計」及「推論性統計」，後者再分為質性分析與量性分析"},"answer":"C","manualChapter":"CH11","id":3422,"source":"TP題庫 (圖片匯入)"},{"question":"當肺音在急性發作期常常出現如氣喘病人吐氣期哮喘音，但也可以同時因為次發性的感染發炎痰液而增加吸氣期粗囉音的是什麼肺病？","options":{"A":"肺氣腫","B":"肋膜炎","C":"血胸","D":"慢性支氣管炎"},"answer":"A","manualChapter":"呼吸型態(含肺音)","id":3423,"source":"TP題庫 (圖片匯入)"},{"question":"關於自殺分類，下列何者為「意圖與計畫造成死亡的行為」？","options":{"A":"自殺意念","B":"自我傷害","C":"自殺企圖","D":"自殺死亡"},"answer":"C","manualChapter":"CH06","id":3424,"source":"TP題庫 (圖片匯入)"},{"question":"口咽、鼻咽呼吸道使用後不可以如何處理？","options":{"A":"使用75%酒精擦拭。","B":"使用後即丟棄","C":"以1000ppm濃度次氯酸鈉溶液擦拭","D":"浸泡於1000ppm濃度次氯酸鈉溶液至少30分鐘後再以清水沖洗"},"answer":"A","id":3425,"source":"TP題庫 (圖片匯入)","matchedChapters":["CH05"],"manualChapter":"CH05"},{"question":"台灣的緊急醫療救護體系由多個專責單位協同運作，任何涉及消防局的流程變更，需經由下列何者單位批准，否則可能因未符合法律程序而無效？","options":{"A":"緊急醫療救護諮詢委員會","B":"醫療顧問委員會","C":"醫療指導醫師會議","D":"急救責任醫院"},"answer":"A","manualChapter":"CH02","id":3426,"source":"TP題庫 (圖片匯入)"},{"question":"高級救護技術員 (EMT-P) 若想要進行一項研究，其具體做法是「先在研究開始前，就定義好特定的研究問題、假設以及資料收集方式」，隨後才開始招募病人並收集數據。根據教科書所述，這種在時間軸觀點下屬於哪一種研究方法？","options":{"A":"橫斷面 (Cross-sectional) 方法","B":"回溯性 (Retrospective) 方法","C":"前瞻性 (Prospective) 方法","D":"質性型 (Qualitative) 方法"},"answer":"C","manualChapter":"CH11","id":3427,"source":"TP題庫 (圖片匯入)"},{"question":"目標體溫管理，過去是希望病人維持低體溫，現在則把目標轉為避免發燒 (32~37.5)，這種管理行為的目的何者為非？","options":{"A":"抑制刺激性胺基酸","B":"避免粒線體活化","C":"減少氧化自由基形成","D":"抑制細胞凋亡"},"answer":"B","manualChapter":"CH24","id":3428,"source":"TP題庫 (圖片匯入)"},{"question":"在救護車內部清潔時，若車內地板與設備表面附著可見血液已凝固，最適當的處理方式為何？","options":{"A":"先用清水沖洗，再用酒精消毒","B":"先用雙氧水分解血液，再用 1000 ppm 次氯酸鈉消毒","C":"直接用酒精擦拭","D":"直接使用高壓水槍沖洗"},"answer":"B","id":3429,"source":"TP題庫 (圖片匯入)","matchedChapters":["CH05"],"manualChapter":"CH05"},{"question":"在情緒內容及配合度量表 (ECCS)中，一名「正常對話」的報案者其評分為1分，而 OHCA 案件報案者的平均得分為何？","options":{"A":"4.5分","B":"2.1分","C":"1.0分","D":"3.2分"},"answer":"B","manualChapter":"CH07","id":3430,"source":"TP題庫 (圖片匯入)"},{"question":"陳姓士官長為ALS團隊一員，現場判定病人經搶救後無效，欲終止急救的準則，下列何者正確","options":{"A":"無任何目擊心搏停止","B":"完整ALs急救後,未曾ROSC","C":"無旁觀者CPR","D":"以上皆是"},"answer":"D","manualChapter":"CH23","id":3431,"source":"TP題庫 (圖片匯入)"},{"question":"細胞是由細胞核、細胞質、細胞壁組成，下列何者不屬於細胞質的組成要素？","options":{"A":"胞漿","B":"包涵體/細胞內液","C":"胞器","D":"胞蒂"},"answer":"D","manualChapter":"CH02","id":3432,"source":"TP題庫 (圖片匯入)"},{"question":"嬰兒與幼兒都會用腹式呼吸，他們的橫膈膜需要完全的向下移動來幫助正常呼吸。這樣使用腹部肌肉來呼吸的方式會持續到幾歲才會逐漸轉變成胸式呼吸？","options":{"A":"5歲","B":"6歲","C":"7歲","D":"8歲"},"answer":"C","manualChapter":"CH13","id":3433,"source":"TP題庫 (圖片匯入)"},{"question":"學齡兒童 (6-12 歲) 的神經系統發育中，頭顱骨的發育約在何時已完成95%？","options":{"A":"12歲","B":"10歲","C":"青春期","D":"6歲"},"answer":"B","manualChapter":"CH13","id":3434,"source":"TP題庫 (圖片匯入)"},{"question":"Midazolam DAI使用劑量為何？","options":{"A":"0.1mg/kg","B":"0.1mcg/kg","C":"0.3mg/kg","D":"0.3mcg/kg"},"answer":"C","manualChapter":"CH16","id":3435,"source":"TP題庫 (圖片匯入)"},{"question":"關於胸部聽診中的「正常肺音」，下列敘述何者正確？","options":{"A":"若在周邊肺葉聽到支氣管音，屬於正常生理發現","B":"支氣管音分布於周邊肺野，音調低而輕柔","C":"支氣管肺泡音僅出現於背部肩胛骨之間","D":"肺泡音的吸氣期明顯長於呼氣期"},"answer":"D","manualChapter":"CH20","id":3436,"source":"TP題庫 (圖片匯入)"},{"question":"派遣員協助心肺復甦術 (DA-CPR) 的流程主要是由哪三個階段依序完成的？","options":{"A":"辨識、指導、監控","B":"詢問、派遣、到達前指導","C":"評估、給藥、電擊","D":"檢傷、通報、後送"},"answer":"A","manualChapter":"CH07","id":3437,"source":"TP題庫 (圖片匯入)"},{"question":"脈搏壓變窄常見於下列哪種臨床狀況","options":{"A":"甲狀腺機能亢進","B":"早期敗血症","C":"心包膜填塞","D":"主動脈瓣閉鎖不全"},"answer":"C","manualChapter":"CH20","id":3438,"source":"TP題庫 (圖片匯入)","matchedChapters":["CH20"]},{"question":"詳細身體診察項目中下列何者不屬於意識評估？","options":{"A":"步態動作","B":"思考與認知","C":"記憶力","D":"病識感"},"answer":"A","manualChapter":"CH22","id":3439,"source":"TP題庫 (圖片匯入)"},{"question":"你到院前接觸一名 24 歲女性，因嚴重氣喘發作呼吸困難。給予多次 salbutamol 後症狀仍無明顯改善。病史顯示她平時有偏頭痛，固定服用某種藥物。下列哪種藥物最可能造成支氣管擴張效果不佳？","options":{"A":"Acetaminophen","B":"Propranolol","C":"Atropine","D":"Furosemide"},"answer":"B","manualChapter":"CH16","id":3440,"source":"TP題庫 (圖片匯入)"},{"question":"在評估一歲以內的小嬰兒時，高級救護技術員通常會藉由觸診「前囟門(Anterior fontanelle)」來初步評估其體液狀態。請問前囟門通常會在出生後多久時間閉合？","options":{"A":"出生後 2~3 歲","B":"出生後 9~18 個月","C":"出生後 3 個月內","D":"出生後 7 歲左右"},"answer":"B","manualChapter":"CH13","id":3441,"source":"TP題庫 (圖片匯入)"},{"question":"抗血栓藥物可分成三大類：拮抗血小板藥物、血栓溶解藥物和抗凝血劑，下面配對何者正確？","options":{"A":"抗凝血劑-Aspirin","B":"抗凝血劑-Abciximab","C":"抗血小板-Clopidogrel","D":"血栓溶解劑-Heparin"},"answer":"C","manualChapter":"CH16","id":3442,"source":"TP題庫 (圖片匯入)"},{"question":"「收斂式」資料判讀通常適合用在什麼情況？","options":{"A":"主訴腹痛的患者","B":"心跳停止的病人","C":"多重主訴的老人","D":"胡言亂語的患者"},"answer":"B","manualChapter":"CH22","id":3443,"source":"TP題庫 (圖片匯入)"},{"question":"肺泡的空間由一群細胞撐著圍起，表面纏繞著微血管進行物質交換。這層「球狀立體拼圖」就是解剖生理學所稱呼吸膜，下列何者為非？","options":{"A":"單層鱗狀肺泡上皮 (第一型肺泡細胞)","B":"微血管的內皮細胞","C":"肺泡與微血管融合的基底膜","D":"肺泡巨噬細胞"},"answer":"D","manualChapter":"CH12","id":3444,"source":"TP題庫 (圖片匯入)"},{"question":"超音波機器上的「影像凍結鍵(Freeze)」除了擷取畫面外，還有什麼實際好處？","options":{"A":"調整影像的增益值","B":"延長探頭壽命並防止過熱","C":"自動診斷內出血","D":"提升訊號穿透力"},"answer":"B","manualChapter":"CH21","id":3445,"source":"TP題庫 (圖片匯入)"},{"question":"甲狀腺素的主要功能為何？","options":{"A":"調節血糖","B":"調節代謝速率","C":"調節血鈣濃度","D":"增加尿量"},"answer":"B","manualChapter":"CH12","id":3446,"source":"TP題庫 (圖片匯入)"},{"question":"關於人體內分泌腺體的功能與激素調節，下列敘述何者正確？","options":{"A":"內分泌腺體如汗腺與消化腺，皆透過輸送管將激素運送至目標器官。","B":"腦下垂體位於腦基底部，因能分泌多種激素調控其他內分泌腺，故有「內分泌總指揮」之稱。","C":"腎上腺皮質分泌的正腎上腺素主要負責抗發炎反應，並協助身體應付緊急情況。","D":"甲狀腺素主要調節鈣的吸收，若在兒童時期分泌不足，會導致發育遲緩。"},"answer":"B","manualChapter":"CH12","id":3447,"source":"TP題庫 (圖片匯入)"},{"question":"病人因支氣管受到刺激而發生劇烈收縮(如氣喘發作) 時，其呼吸道的氣流阻力會大幅增加，導致呼吸肌必須作更多功才能維持換氣。此時，救護技術員在臨床理學檢查中，觀察到病人因換氣耗能上升而使用輔助呼吸肌 (accessory muscle) 的現象，何者最適當？","options":{"A":"觀察到病人的鼻腔阻力大幅下降，且全肺量 (total lung capacity) 呈現等比例上升","B":"觀察到病人胸骨上凹口、鎖骨上凹窩、肋間肌及肋下肌等處出現明顯的肌肉內縮凹陷。","C":"觀察到病人的潮氣末二氧化碳(end-tidal CO2) 波形呈現快速上升且立刻進入水平高原期。","D":"觀察到病人的解剖死腔(anatomical dead space) 範圍擴大至原本正常生理狀態的十倍以上。"},"answer":"B","manualChapter":"呼吸型態(含肺音)","id":3448,"source":"TP題庫 (圖片匯入)"},{"question":"關於氧合血紅素飽和度與動脈血氧分壓的關係，下列何種情況會使氧氣解離曲線「右移」，導致血紅素與氧氣親和力下降？","options":{"A":"二氧化碳分壓降低","B":"血液 pH 值上升","C":"體溫升高","D":"2,3-DPG 物質水平降低"},"answer":"C","manualChapter":"CH12","id":3449,"source":"TP題庫 (圖片匯入)"},{"question":"根據《高級救護技術員教科書》下列關於人體中水分比例的敘述，何者正確？","options":{"A":"細胞內液佔總人體體液三分之一","B":"細胞外液佔總人體體液三分之二","C":"血管循環佔細胞外液的三分之一","D":"組織間液佔細胞內液三分之二"},"answer":"C","manualChapter":"CH12","id":3450,"source":"TP題庫 (圖片匯入)"},{"question":"關於TECC (Tactical Emergency Casualty Care) 的敘述，下列何者最正確？","options":{"A":"TECC最早由軍方戰場醫療體系提出，主要適用於純軍事作戰環境","B":"TECC委員會於首次會議後，建立適用民間高風險戰術與救援行動的照護指引","C":"TECC目的在取代所有傳統EMT與院前救護流程，以統一全球創傷處置模式","D":"TECC第一版指引強調一般門診與常規急診醫療環境的病患分類系統"},"answer":"B","manualChapter":"CH56","id":3452,"source":"TP題庫 (圖片匯入)"},{"question":"依照[毒性及關注化學物質管理法]，若某種化學物質曝露後會立即危害人體健康，應歸類為哪一類毒性化學物質？","options":{"A":"第一類","B":"第三類","C":"第四類","D":"第二類"},"answer":"B","manualChapter":"CH53","id":3455,"source":"TP題庫 (圖片匯入)"},{"question":"一名病人氣喘急性發作，經短效型支氣管擴張劑治療後， EtCO2 從 35 逐漸上升至 50 mmHg下列臨床思路何者為是？","options":{"A":"氣喘症狀改善。","B":"需考慮其他藥物治療如：albuterol等。","C":"氣喘導致的代謝性酸中毒惡化。","D":"氣喘惡化導致灌流不佳進而使EtCO2 上升，需靜脈輸液。"},"answer":"B","manualChapter":"CH35","id":3458,"source":"TP題庫 (圖片匯入)"},{"question":"關於外傷懷孕患者的評估及處置，請問下列敘述何者為非","options":{"A":"在孕婦生命徵象改變前，需因孕婦心輸出量會隨懷孕週數增加，應注意孕婦是否有休克的可能並加以處置，以防發生胎兒窘迫","B":"減緩子宮壓迫的方法除讓孕婦左側躺外，還可嘗試讓其右腳抬高使子宮向左移","C":"第三孕期的孕婦肺容積較少及需負擔胎兒氧氣消耗，遇外傷時更容易缺氧","D":"隨著懷孕週數增加，孕婦的腸胃道蠕動變快，胃較快排空，較不會嘔吐"},"answer":"D","manualChapter":"CH49","id":3459,"source":"TP題庫 (圖片匯入)"},{"question":"當病人腦內壓過高，出現庫欣氏徵象情況時，可以採取解開頸圈、給予輕度過度通氣及給予藥物來稍微降低腦壓，請問給予輕度過度通氣維持EtCO2的目標值為何？","options":{"A":"30~35mmHg","B":"35~40mmHg","C":"35~45mmHg","D":"40~45mmHg"},"answer":"A","manualChapter":"CH27","id":3460,"source":"TP題庫 (圖片匯入)"},{"question":"研究者透過臨床觀察發現某職業勞工常有晚婚與離婚率高的現象，則「婚姻」屬於下列何者？","options":{"A":"題目(Item)","B":"變項(Variable)","C":"向度(Dimension)","D":"指標(Index)"},"answer":"C","manualChapter":"CH11","source":"TP題庫 (圖片匯入) - EMT-P 第 11 章 P.239","id":3461},{"question":"關於肺泡構造與「呼吸膜」(Respiratory membrane)的敘述，下列何者「錯誤」？","options":{"A":"呼吸膜包含單層鱗狀肺泡上皮、微血管內皮細胞及兩者融合的基底膜","B":"第一型肺泡細胞（Type I cell）主要負責分泌表面張力素，防止肺泡塌陷","C":"第二型肺泡細胞（Type II cell）又稱中隔細胞，能分泌油性物質減少表面張力","D":"肺泡巨噬細胞（Dust cell）負責吞噬進入肺部的外來顆粒或病原菌"},"answer":"B","manualChapter":"CH12","source":"TP題庫 (圖片匯入) - EMT-P 第 12 章 P.267","id":3462},{"question":"關於藥物在胃腸道的吸收（Enteral route），下列敘述何者正確？","options":{"A":"硝化甘油舌下片（NTG）由口腔黏膜吸收，必須先經過肝臟的首渡效應才能發揮效果","B":"阿斯匹靈（Aspirin）是弱鹼性藥物，因此在胃部的酸性環境中吸收最佳","C":"小腸液為鹼性，小腸有十分豐富的血管網和表面積，大部份口服藥物在小腸上段吸收","D":"直腸吸收的藥物有100%不用經過肝臟的首渡效應，其吸收穩定度優於口腔內給藥"},"answer":"C","manualChapter":"CH16","source":"TP題庫 (圖片匯入) - EMT-P 第 16 章 P.389~390","id":3463},{"question":"血液中的二氧化碳可透過多種方式運輸，其中在血液中比例最高的形式為何？","options":{"A":"以碳酸氫根子形式存在","B":"溶解於血漿","C":"與血紅素結合形成碳胺血紅素","D":"與氧氣結合"},"answer":"A","manualChapter":"CH14","source":"TP題庫 (圖片匯入) - EMT-P 第 14 章 P.337","id":3464},{"question":"根據解剖學姿勢，描述人體位置時的標準狀態為何？","options":{"A":"自然站立、雙手插腰、目視前方","B":"自然站立、雙手掌心向前、垂放於大腿兩側","C":"平躺、雙手掌心向上、雙腿併攏","D":"自然站立、雙手掌心向後、垂放於大腿兩側"},"answer":"B","manualChapter":"CH12","source":"TP題庫 (圖片匯入) - EMT-P 第 12 章 P.251","id":3465},{"question":"身體診察中，基本心音之成因原理，下列何者為非？","options":{"A":"第一心音：僧帽瓣關閉","B":"第二心音：主動脈瓣關閉","C":"第三心音：心室血流填充","D":"第四心音：心房舒張"},"answer":"D","manualChapter":"CH20","source":"TP題庫 (圖片匯入) - EMT-P 第 20 章 P.542","id":3466},{"question":"一名急性肺水腫病人到院時 SpO2 82%，呼吸頻率 32 次/分，ABG 顯示 PaO2 明顯下降，但 PaCO2 仍在正常範圍。下列何者最能解釋此現象？","options":{"A":"肺泡內液體堆積使氣體交換面積增加，因此氧氣消耗速度快於二氧化碳排除速度。","B":"肺部病變雖影響氣體交換，但病人增加呼吸驅動後，仍足以維持部分氣體的排除功能。","C":"二氧化碳主要透過主動運輸排出，因此較不受肺泡病變影響。","D":"氧氣與二氧化碳皆受到相同程度影響，但氧氣需求量較大，因此先出現低氧血症。"},"answer":"B","manualChapter":"CH14","source":"TP題庫 (圖片匯入) - EMT-P 第 14 章 P.349","id":3467},{"question":"火場救出的成年患者，全胸部、左下肢以及會陰部有3度燒燙傷，請問燒燙傷面積為何?","options":{"A":"19%","B":"28%","C":"27%","D":"37%"},"answer":"B","manualChapter":"CH31","source":"TP題庫 (圖片匯入) - EMT-P 第 31 章 P.818","id":3468},{"question":"有關體內荷爾蒙的分泌調節機制，下列敘述何者最適當？","options":{"A":"負向回饋機制會在荷爾蒙濃度上升時抑制其分泌","B":"催產素（oxytocin）的分泌主要受負向回饋控制","C":"血液中葡萄糖濃度下降會刺激胰臟β細胞分泌胰島素","D":"體內恆定的維持主要仰賴正向回饋系統進行調控"},"answer":"A","manualChapter":"CH37","source":"TP題庫 (圖片匯入) - EMT-P 第 37 章 P.986","id":3469},{"question":"下列敘述何者錯誤？","options":{"A":"懷疑心肌梗塞患者，過多的氧氣有害無益，血氧小於90%才考慮使用氧氣，但呼吸困難者，應給予高流量氧氣。","B":"懷疑主動脈剝離患者，過多的氧氣有害無益，血氧小於90%才考慮使用氧氣，但呼吸困難者，應給予高流量氧氣。","C":"懷疑肺動脈栓塞患者，過多的氧氣有害無益，血氧小於90%才考慮使用氧氣，但呼吸困難者，應給予高流量氧氣。","D":"以上皆是"},"answer":"C","manualChapter":"CH34","source":"TP題庫 (圖片匯入) - EMT-P 第 34 章 P.912","id":3470},{"question":"關於疑似主動脈剝離病患的到院前氧氣給予原則，下列何者正確？","options":{"A":"氧氣飽和度應盡可能維持在100%,以減少心肌耗氧量","B":"無論血氧飽和度為何,皆應常規以氧氣鼻管給予每分鐘4公升氧氣","C":"只有在病人血氧飽和度小於94%時才考慮使用,目標維持在94~98%","D":"為了預防缺氧,所有病患皆應給予高流量氧氣"},"answer":"C","manualChapter":"CH34","source":"TP題庫 (圖片匯入) - EMT-P 第 34 章 P.907","id":3471},{"question":"關於高齡病患的生理變化，從 30 歲到 80 歲，其腎血流量平均約下降多少百分比？","options":{"A":"20%","B":"50%","C":"80%","D":"100%"},"answer":"B","manualChapter":"CH47","source":"TP題庫 (圖片匯入) - EMT-P 第 47 章 P.1240","id":3472},{"question":"下列事故指揮系統的核心價值，何者不是?","options":{"A":"共通詞彙","B":"指揮","C":"模組化","D":"人員安全"},"answer":"D","manualChapter":"CH52","source":"TP題庫 (圖片匯入) - EMT-P 第 52 章 P.1413","id":3473},{"question":"關於睪丸扭轉與急性副睪炎的鑑別診斷，下列敘述何者錯誤？","options":{"A":"急性副睪炎病患若將患側睪丸向上抬起，其疼痛感通常會獲得舒緩，稱為 Positive Prehn’s sign。","B":"睪丸扭轉較常發生於青春期男性，且臨床表現往往伴隨噁心與嘔吐感。","C":"睪丸扭轉病患將患側睪丸輕輕抬高後，通常能有效減輕其突發性的劇烈疼痛。","D":"睪丸扭轉為真正的泌尿急症，若未即時手術復位可能導致組織缺血性壞死。"},"answer":"C","manualChapter":"CH41","source":"TP題庫 (圖片匯入) - EMT-P 第 41 章 P.1078","id":3474},{"question":"流感病毒的「抗原轉變」(Antigenic shift) 與「抗原漂變」(Antigenic drift)之間的主要區別為何？","options":{"A":"抗原轉變僅發生在 B 型流感病毒上","B":"抗原漂變會導致完全喪失流行的季節性","C":"抗原轉變涉及基因段互換，導致抗原大改變","D":"抗原轉變是年度季節性流感的主因"},"answer":"C","manualChapter":"CH43","source":"TP題庫 (圖片匯入) - EMT-P 第 43 章 P.1119","id":3475},{"question":"常見傳染途徑其相關疾病下列何者錯誤？","options":{"A":"接觸傳染: 急性結膜炎、帶狀泡疹、抗藥性黃金葡萄球菌感染、疥瘡","B":"空氣傳染: 水痘、麻疹、開放性肺結核、嚴重特殊傳染性肺炎","C":"食物或水源傳染: 桿菌性痢疾、霍亂、A型肝炎","D":"血液或體液傳染: 登革熱、B型肝炎、愛滋病"},"answer":"D","manualChapter":"CH42","source":"TP題庫 (圖片匯入) - EMT-P 第 42 章 P.1092","id":3476},{"question":"有機磷中毒產生的「SLUDGE」症狀群，主要是由於哪一種物質堆積所致？","options":{"A":"Norepinephrine","B":"Acetylcholine","C":"Dopamine","D":"MAO"},"answer":"B","manualChapter":"CH50","source":"TP題庫 (圖片匯入) - EMT-P 第 50 章 P.1344","id":3478},{"question":"下列何者為活性碳的禁忌症？","options":{"A":"茶鹼中毒","B":"Carbamazepine中毒","C":"Phenobarbital中毒","D":"強酸或強鹼中毒"},"answer":"D","manualChapter":"CH50","source":"TP題庫 (圖片匯入) - EMT-P 第 50 章 P.1318","id":3479},{"question":"根據教材內容，關於「子癇症（Eclampsia）」與「子癇前症（Pre-eclampsia）」的區別與處置，下列敘述何者正確？","options":{"A":"子癇症病人的死亡率極低，在現場給予氧氣即可，不需送醫","B":"子癇症是指在子癇前症的基礎上，同時發生了癲癇抽搐的情況","C":"子癇症抽搐發生時，醫療救護人員應優先給予阿斯匹靈治療","D":"子癇前症的主要症狀僅有高血壓，不會出現尿蛋白或水腫"},"answer":"B","manualChapter":"CH49","source":"TP題庫 (圖片匯入) - EMT-P 第 49 章","id":3480},{"question":"根據《奧林匹克運動會醫療準則》，醫療救護團隊應在每日賽前多久進行緊急應變計畫（EAP）的演練？","options":{"A":"1小時","B":"2小時","C":"30分鐘","D":"15分鐘"},"answer":"A","manualChapter":"CH55","source":"TP題庫 (圖片匯入) - EMT-P 第 55 章 P.1500","id":3481},{"question":"以下何者正確？","options":{"A":"情緒內容及配合度量表(ECCS): 將報案者的情緒反應量化，最高 5分(正常對話)最低0分(歇斯底里)。","B":"醫療優先派遣原則為詢問、派遣和指導三部曲","C":"國際緊急醫療派遣協會把派遣模式分成O.B. R .A V E六個等級","D":"派遣模式中的連結派遣模式(PA)適合應用於偏遠地區、醫療院所分散不均"},"answer":"B","manualChapter":"CH07","source":"TP題庫 (圖片匯入) - EMT-P 第 7 章 P.132.155.157.168","id":3482},{"question":"第一反應員的受訓內容，不包含下列何者?","options":{"A":"辨識病人疾病的嚴重程度或受傷的情形","B":"評估病人是否需要緊急醫療照顧","C":"能提供因呼吸道、通氣及循環等問題而導致危及生命的病人適當之緊急醫療照顧。","D":"安撫現場患者之家屬"},"answer":"D","manualChapter":"CH08","source":"TP題庫 (圖片匯入) - EMT-P 第 8 章 P.177","id":3483},{"question":"二氧化碳在人體血液中的運輸形式多樣，下列敘述何者最正確？","options":{"A":"大部分的二氧化碳（約 72%）是直接溶解於血漿中運輸","B":"約有 20% 的二氧化碳會與血漿蛋白或血紅素結合，形成碳胺血紅素","C":"二氧化碳直接溶解於血漿的比例（8%）高於與蛋白質結合的比例","D":"在組織中，已與氧氣結合的血紅素比空載的血紅素更易接受二氧化碳"},"answer":"B","manualChapter":"CH14","source":"TP題庫 (圖片匯入) - EMT-P 第 14 章 P.337","id":3484},{"question":"關於呼吸生理與氣體交換的細節，下列敘述何者錯誤？","options":{"A":"正常成人吸氣 500 毫升中，只有約 350 毫升進入肺泡交換，其餘 150 毫升留在「解剖性死腔」。","B":"換氣作用（Ventilation）氣體經由呼吸道進出肺臟的物理作用。","C":"「內呼吸」是指氣體經由呼吸道進出肺臟的物理作用，靠胸腔壓力變化完成。","D":"血液中氧氣分壓(PaO2)是決定肺泡微血管間的氧分子擴散速率的重要因素。"},"answer":"C","manualChapter":"CH12","source":"TP題庫 (圖片匯入) - EMT-P 第 12 章 P.267","id":3485},{"question":"組織產生的二氧化碳主要由哪種方式傳輸？","options":{"A":"與紅血素直接結合","B":"直接溶於血漿","C":"在紅血球轉為碳酸，再分解成氫離子與重碳酸根離子後進入血漿","D":"以上三者比例差不多"},"answer":"C","manualChapter":"CH12","source":"TP題庫 (圖片匯入) - EMT-P 第 12 章 P.269","id":3486},{"question":"下列何者不是人體四種基本組織？","options":{"A":"上皮組織","B":"結締組織","C":"淋巴組織","D":"神經組織"},"answer":"C","manualChapter":"CH12","source":"TP題庫 (圖片匯入) - EMT-P 第 12 章 P.257","id":3487},{"question":"關於嚴重鈍傷（如高速車禍的加速/減速機制）所引起之「外傷性主動脈斷裂（Traumatic aortic rupture）」，下列關於其好發的解剖位置及臨床表現，何者最為正確？","options":{"A":"最常斷裂於升主動脈，並大量出血至心包膜腔導致填塞。","B":"最常斷裂於主動脈弓，臨床上必定伴隨嚴重的右側血胸。","C":"最常斷裂於動脈韌帶（Ligamentum arteriosum）處，且約 80~90%會將血液積存於左側胸腔。","D":"最常發生於橫膈膜以下的腹主動脈，表現為無預警的腹內出血與休克。"},"answer":"C","manualChapter":"CH28","source":"TP題庫 (圖片匯入) - EMT-P 第 28 章 P.768","id":3488},{"question":"關於創傷及壓力相關障礙症的病因起源，下列敘述何者錯誤？","options":{"A":"創傷後壓力疾患 (PTSD) 通常源自於目擊或經歷創傷事件。","B":"急性壓力症 (ASD) 的病因與 PTSD 相似，皆為目擊或經歷創傷事件。","C":"適應障礙症 (AD) 的病因起源於一般壓力源產生。","D":"只有創傷後壓力疾患 (PTSD) 的病因是來自於重大創傷，ASD 與 AD 皆不是。"},"answer":"D","manualChapter":"CH06","source":"AI出題","id":3489},{"question":"某位患者在經歷一場重大車禍後，持續出現害怕、恐懼、無法經驗到正向情緒以及失去現實感的症狀。根據表格特徵，且無出現自我傷害行為，此患者最符合下列何種診斷的「現象與行為」？","options":{"A":"創傷後壓力疾患 (PTSD)","B":"急性壓力症 (ASD)","C":"適應障礙症 (AD)","D":"泛焦慮症 (GAD)"},"answer":"B","manualChapter":"CH06","source":"AI出題","id":3490},{"question":"創傷後壓力疾患 (PTSD) 與急性壓力症 (ASD) 在「症狀維持時間」上的主要判定區別為何？","options":{"A":"ASD 的症狀維持時間為 3 天到 1 個月，而 PTSD 為 1 個月以上。","B":"ASD 的症狀維持時間為 6 個月內，而 PTSD 為 3 天到 1 個月。","C":"ASD 的症狀維持時間為 1 個月以上，而 PTSD 為 3 天到 1 個月。","D":"兩者的症狀維持時間皆為 1 個月以上，僅在症狀嚴重度上不同。"},"answer":"A","manualChapter":"CH06","source":"AI出題","id":3491},{"question":"若病患的病因是來自於日常的「壓力源產生」，且主要表現為擔心焦慮、失眠、心情低落及人際相處困難，症狀維持時間在 6 個月內，最可能的診斷為何？","options":{"A":"急性壓力症 (ASD)","B":"創傷後壓力疾患 (PTSD)","C":"重度憂鬱症 (MDD)","D":"適應障礙症 (AD)"},"answer":"D","manualChapter":"CH06","source":"AI出題","id":3492},{"question":"下列關於「創傷後壓力疾患 (PTSD)」的現象與行為特徵，何者描述最符合內容？","options":{"A":"主要特徵為單純的人際相處困難與心情低落。","B":"出現創傷經驗再現、過度警覺、逃避或麻木等情況。","C":"無法回憶起創傷事件是其最核心的特徵。","D":"會出現失去現實感，但絕對不會出現與創傷事件相關的負向認知。"},"answer":"B","manualChapter":"CH06","source":"AI出題","id":3493},{"id":3494,"source":"醫/護考古題","question":"有關重症肌無力之敘述，下列何者正確？①屬於自體免疫疾病，體內產生攻擊Ach接受器的抗體　②第一型僅侵犯眼肌，造成複視和眼瞼下垂　③四肢肌肉的無力發生在遠端和下肢且為不對稱　④當侵犯肋間肌，通氣容積會減少，嚴重呼吸困難致死","options":{"A":"①②③","B":"①②④","C":"①③④","D":"②③④"},"answer":"B","manualChapter":"CH36"},{"id":3495,"source":"醫/護考古題","question":"若未適當處置，下列何者為盧德威氏口峽炎（Ludwig's angina）最常見的併發症？","options":{"A":"海綿竇栓塞","B":"肺栓塞","C":"呼吸道阻塞","D":"廣泛性血管栓塞"},"answer":"C","manualChapter":"CH20"},{"id":3496,"source":"醫/護考古題","question":"關於 DNR（do not resuscitate），下列何者錯誤？","options":{"A":"國內的 DNR 法律文件包括有病人自己簽署的「預立安寧緩和醫療暨維生醫療抉擇意願書」和病人無法表達意見時由家屬代為簽署的「不施行心肺復甦術同意書」","B":"安寧緩和醫療意願書和不施行心肺復甦術同意書的執行條件，都只有在病人已經被兩位相關專科醫師診斷為「末期病人」，即罹患嚴重傷病不可治癒，且近期內病程會進行至死亡者","C":"成年且具有完全行為能力的人，得預立選擇安寧緩和醫療意願書，可親自簽名或蓋章者，不需在場見證人簽名即可完成","D":"DNR是「不施行心肺復甦術」的英語縮寫，指的是當末期病人臨終時，不以電擊、強心劑、心臟按壓、呼吸道插管等措施恢復或維持病人的呼吸心跳"},"answer":"C","manualChapter":"CH01"},{"id":3498,"source":"醫/護考古題","question":"病人從密閉火場被救出，臉部燒傷，口鼻處有燻黑炭渣，鼻毛燒焦，聲音沙啞，有喘鳴聲（wheezing），其他皮膚無明顯燒傷，下列那項處置最不適當？","options":{"A":"置放氣管內管以保護呼吸道","B":"給與 100% 潮濕氧氣","C":"給與大量輸液","D":"檢驗血中一氧化碳濃度"},"answer":"C","manualChapter":"CH31"},{"id":3499,"source":"AI出題","question":"關於庫欣氏反射（Cushing reflex）的機轉描述，下列何者最符合生理現況？","options":{"A":"副交感神經直接興奮血管平滑肌導致收縮壓上升","B":"大腦皮質主動發出運動訊號導致心跳代償性減慢","C":"呼吸變快且變深是為了排除二氧化碳降低顱內壓","D":"延腦血管舒縮中心受壓迫引發交感神經高度興奮"},"answer":"D","manualChapter":"CH20"},{"id":3500,"source":"AI出題","question":"一名氣喘患者使用短效型 β 2 促效劑吸入劑，其引起氣管平滑肌舒張的神經生理途徑屬於下列何者？","options":{"A":"體神經系統中的隨意運動控制部分","B":"自主神經系統中的不隨意運動部分","C":"抑制 α 1受體使微血管通透性降低","D":"副交感神經釋放乙醯膽鹼作用於毒蕈鹼受體"},"answer":"B","manualChapter":"CH16"},{"id":3501,"source":"AI出題","question":"一名脊髓損傷（T6 以上）患者出現嚴重的自主神經反射異常（Autonomic Dysreflexia），下列哪項生理現象最不可能出現？","options":{"A":"收縮壓顯著上升（甚至超過 200 mmHg）","B":"損傷平面以下的皮膚發紅且多汗","C":"劇烈搏動性的頭痛（Throbbing headache）","D":"心率產生代償性的過緩（Bradycardia）"},"answer":"B","manualChapter":"CH26"},{"id":3502,"source":"AI出題","question":"對於正常人而言，調節呼吸頻率與深度的最主要化學驅動力為何？","options":{"A":"血液中氧氣分壓（PaO2）微量下降","B":"肺部組織對機械性擴張產生的本體感覺","C":"血液中血紅素（Hemoglobin）濃度的變化","D":"動脈血中二氧化碳分壓（PaO2）的升高"},"answer":"D","manualChapter":"CH12"},{"id":3503,"source":"AI出題","question":"關於神經系統評估中的反射行為，下列哪項敘述是正確的？","options":{"A":"格拉斯哥昏迷指數（GCS）中，眼睛對疼痛有反應評為 3 分","B":"成人出現巴賓斯基徵象（Babinski sign）代表上運動神經元受損","C":"瞳孔對光反射完全由交感神經控制縮瞳肌","D":"膝跳反射屬於一種複雜的多突觸自主神經反射"},"answer":"B","manualChapter":"CH36","matchedChapters":["CH36"]},{"id":3504,"source":"AI出題","question":"對病患實施 12 導程心電圖（12-lead ECG）檢查以排除急性心肌梗塞時，您觀察到心電圖呈現：心跳每分鐘 115 次，P波在第 II、III、aVF 導程的振幅大於 2.5 mm（P pulmonale），且心電圖軸向右偏（Right axis deviation）。下列臨床推論何者最適當？","options":{"A":"這些波形改變強烈提示患者目前正處於急性左心室衰竭引發的肺水腫。","B":"此心電圖表現很可能是由於長期 COPD 導致肺動脈高壓與右心室肥大/超載的慢性變化。","C":"出現這些波形代表病患一定合併了急性前壁 ST 段上升型心肌梗塞（STEMI）。","D":"心電圖波形完全正常，上述特徵是正常成年人常見的生理表現。"},"answer":"B","manualChapter":"CH33"},{"id":3505,"source":"AI出題","question":"病患在霧化治療過程中突然出現劇烈胸痛，隨後呼吸困難極度惡化，面色發紺，聽診時發現右側肺部呼吸音完全消失，氣管有向左側偏移的現象，血壓由 130/80 mmHg 驟降至 82/50 mmHg。此時最可能發生的併發症及應採取的急救處置為何？","options":{"A":"急性肺栓塞；應立即給予抗凝血藥物或血栓溶解劑。","B":"張力性氣胸（Tension pneumothorax）；應立即於右側進行針刺減壓術（Needle decompression）。","C":"左側大片肺炎；應立即協助病患採取左側臥位以利引流。","D":"急性心包填塞；應立即準備進行心包膜穿刺放液術。"},"answer":"B","manualChapter":"呼吸急症"},{"id":3506,"source":"AI出題","question":"當協助一名意識不清的 COPD 惡化病患進行氣管插管後，您連接了波形吐氣末二氧化碳監測儀（Waveform Capnography）。監測儀顯示出標準的「鯊魚鰭樣波形（Shark-fin appearance）」，且End-tidal CO2數值高達 65 mmHg。關於此波形與數值的解讀，下列敘述何者正確？","options":{"A":"鯊魚鰭樣波形代表氣管內管放錯位置，誤入食道，應立即拔除重插。","B":"鯊魚鰭波形反映了呼吸道存在嚴重的「吐氣受阻/支氣管痙攣」；End-tidal CO2升高提示高碳酸血症，應給予過度通氣（Hyperventilation）將數值快速降至 20 mmHg 以下。","C":"鯊魚鰭波形反映了小呼吸道阻塞（如 COPD 或氣喘的氣流受限）；此時通氣策略應注意給予足夠的吐氣時間，避免過度通氣造成動態肺過度充氣（Auto-PEEP）。","D":"End-tidal CO2達 65 mmHg 說明患者體內完全沒有二氧化碳滯留，復甦非常成功。"},"answer":"C","manualChapter":"CH14"},{"id":3507,"source":"AI出題","question":"45歲女性，有第 1 型糖尿病病史，因連續幾天噁心、嘔吐、腹痛與全身無力，被家人送醫。現場評估：病人神志清醒但反應遲鈍（GCS：E4V5M6），呼吸急促且深快（呼吸 28次/min），呼氣帶有水果甜味，皮膚乾燥，脈搏 124 bpm，血壓 94/62 mmHg，現場血糖機顯示為 \"High\"（超過 $600\\text{ mg/dL}$）。下列敘述何者最不適當？","options":{"A":"病人的呼吸型態符合庫斯莫爾氏呼吸（Kussmaul respiration），是身體試圖代償代謝性酸中毒的表現。","B":"病人可能正處於糖尿病酮酸血症（DKA），現場應立即協助病人施打平時使用的皮下胰島素（Subcutaneous Insulin）以降低血糖。","C":"病人脈搏快、血壓偏低且皮膚乾燥，提示有嚴重脫水風險，建立靜脈通路並給予等滲透壓晶體輸液（如 N/S）是適當的院前處置。","D":"面對高血糖危象且神志改變的病人，維持呼吸道暢通（Airway）、確保適當通氣（Ventilation）與維持灌流（Perfusion）仍是現場救護的最高原則。"},"answer":"B","manualChapter":"CH37"},{"id":3508,"source":"AI出題","question":"32歲男性，因行車糾紛胸部遭鈍器重擊。現場評估：病人呼吸極度困難、面色蒼白、神志躁動。生命徵象：脈搏 128 bpm（微弱）、血壓 84/50 mmHg、呼吸 28次/min、血氧 88%。救護人員進行身體檢查時，視診發現病人有頸靜脈怒張（JVD）。為了鑑別此病人是「急性心包填塞」還是「張力性氣胸」，下列哪一個評估線索最關鍵？","options":{"A":"觸診其遠端肢體是否發紺、微血管充填時間（CRT）是否延長。","B":"觸診病人的氣管位置是否偏移（Tracheal deviation），並配合聽診兩側肺泡呼吸音是否對稱。","C":"觸診前胸壁是否有肋骨斷裂導致的骨摩擦音（Crepitus）。","D":"量測病人是否有微弱的脈搏與心搏過速。"},"answer":"B","manualChapter":"CH28"},{"id":3509,"source":"TP題庫","question":"在到院前救護研究中，若根據病人出現的順序進行分組，這種稱為什麼抽樣法？","options":{"A":"系統性抽樣","B":"便利抽樣","C":"隨機抽樣","D":"輪流時間抽樣"},"answer":"A","manualChapter":"CH11"},{"id":3510,"source":"TP題庫","question":"負責協助提供醫療資訊與品質管制建議，必要時將討論的個案提交至緊急醫療諮詢委員會，以進行政策決議。上列描述屬於台灣緊急醫療救護的架構裡面哪個部分所負責的？","options":{"A":"緊急醫療諮詢委員會","B":"醫療顧問委員會","C":"醫療指導醫生會議","D":"急救責任醫院"},"answer":"B","manualChapter":"CH02"},{"id":3511,"source":"TP題庫","question":"根據心理健康三級預防理論，下列哪一項活動屬於「三級預防(Tertiary Prevention)」的主要範疇？","options":{"A":"針對高危險群進行性暴力或家暴防治的追蹤教育","B":"提供職能治療、工作訓練並協助個案回歸社會生活","C":"在社區心理衛生中心進行壓力調適與大眾教育","D":"透過「張老師」或「生命線」等機構進行早期發現與早期治療"},"answer":"B","manualChapter":"CH06"},{"id":3512,"source":"TP題庫","question":"下列哪個不是EMS Agenda 2050的特性","options":{"A":"安全與有效","B":"整合與無縫","C":"依賴與準備","D":"溝通與協調"},"answer":"D","manualChapter":"CH03"},{"id":3513,"source":"TP題庫","question":"在建立緊急醫療救護（EMS）研究假說時，研究者常利用「P-I-C-O」四個模組組成要素。根據教科書內容，下列關於PICO字母與其代表意義的配對，何者正確？","options":{"A":"O 代表 Observation，指該研究屬於到院前救護的觀察型研究方法。","B":"P 代表 Protocol，指救護技術員在現場執行的標準救護流程。","C":"I 代表 Intervention，指研究主要想檢查或施作的介入措施或因子。","D":"C 代表 Conclusion，指研究最終預期達成的科學結論。"},"answer":"C","manualChapter":"CH11"},{"id":3514,"source":"TP題庫","question":"緊急救護員最常見的職業傷害事件為何？","options":{"A":"過度疲勞","B":"其他常見傷害事故有暴力","C":"有害暴露","D":"救護車事故"},"answer":"A","manualChapter":"CH06"},{"id":3515,"source":"TP題庫","question":"STEMI 治療研究，救護人員在到院前行心電圖檢查可增加多少存活率？","options":{"A":"20~30%","B":"100%","C":"50%","D":"5~10%"},"answer":"A","manualChapter":"CH08"},{"id":3516,"source":"TP題庫","question":"有關TRM團隊資源管理的四大模組，下列何者為非？","options":{"A":"心理支持(Mental Support)","B":"領導能力(Leadership)","C":"有效溝通(Communication)","D":"狀況監控(Situation Monitoring)。"},"answer":"A","manualChapter":"CH39"},{"id":3517,"source":"TP題庫","question":"請問心臟衰竭、大腦損傷的患者會出現什麼樣的呼吸型態？","options":{"A":"畢歐式呼吸","B":"庫斯毛耳式呼吸","C":"陳施氏呼吸","D":"逆理氏呼吸"},"answer":"C","manualChapter":"呼吸型態(含肺音)"},{"id":3518,"source":"TP題庫","question":"腹部急性闌尾炎可使用何種特殊身體診察進行？","options":{"A":"洛夫辛徵象（Rovsing's sign）","B":"莫菲氏病徵（Murphy's sign）","C":"腰大肌徵候（psoas Sign）","D":"閉孔肌徵候（obturator Sign）"},"answer":"B","manualChapter":"CH20","explanation":"CH20 p556"},{"id":3519,"source":"TP題庫","question":"交感神經系統，傳遞反應器以正腎上腺素為主，但有三處反應器是由乙醯膽鹼傳遞，何者為非？","options":{"A":"汗腺","B":"骨骼肌小動脈","C":"豎毛肌","D":"擴約肌"},"answer":"D","manualChapter":"CH12"},{"id":3520,"source":"TP題庫","question":"當車禍導致患者前胸部直接撞擊方向盤，EMT-P 評估時發現病人血壓下降、心跳過速、伴隨明顯的頸靜脈怒張，但聽診雙側肺泡呼吸音清楚且對稱。依據生理與解剖構造，此患者最可能發生下列哪一種危急病況？","options":{"A":"左側張力性氣胸（Tension Pneumothorax），因為氣體累積在肋膜腔壓迫大靜脈","B":"大腦皮質受損引發的腦中風，進而干擾了延腦的循環血流量控制中心","C":"急性心包膜填塞（Cardiac Tamponade），因液體在雙層膜狀（心包膜腔）中壓迫心臟","D":"腹腔內盲腸炎發炎引發的感染性休克，導致上下腔靜脈血液無法回流"},"answer":"C","manualChapter":"綜合題"},{"id":3521,"source":"TP題庫","question":"針對「ST段上升之急性心肌梗塞」病患，在什麼樣的時間條件下，可於執行心導管前注射血栓溶解劑？","options":{"A":"症狀開始到預期血管打通時間為 6~12 小時","B":"症狀開始到預期血管打通時間超過 24 小時","C":"症狀開始到預期血管打通時間為 3~6 小時","D":"症狀開始到預期血管打通時間為 1~3 小時"},"answer":"A","manualChapter":"CH16"},{"id":3522,"source":"TP題庫","question":"請問嗅覺受損，顱底骨折會影響第幾對腦神經？","options":{"A":"第一對腦神經","B":"第二對腦神經","C":"第三對腦神經","D":"第四對腦神經"},"answer":"A","manualChapter":"CH27"},{"id":3523,"source":"TP題庫","question":"為了精進重大外傷後傷情準度，我們可以增加更多客觀或先進的儀器判斷，下列哪個是可以協助我們評估的檢查方式？","options":{"A":"超音波掃瞄","B":"組織血氧分壓","C":"到院前抽血檢測乳酸","D":"以上皆是"},"answer":"D","manualChapter":"CH25"},{"id":3525,"source":"TP題庫","question":"高滲透壓高血糖症候群(HHS)是急性糖尿病代謝失調的一種病症，其特徵在於明顯的高血糖，高滲透性和脫水，以及可能導致昏迷的視力下降，關於此症候群的原因為下列哪一項？","options":{"A":"高血壓","B":"甲狀腺亢進","C":"發燒","D":"腸阻塞"},"answer":"D","manualChapter":"CH37"},{"id":3526,"source":"TP題庫","question":"指揮中心來電45歲女性表示急性右上腹痛。到達現場初步評估時發現病人身上黃黃的。量測耳溫微燒39.2度。且有噁心嘔吐情形，請問患者最有可能的急病為何？","options":{"A":"胰臟炎","B":"腎盂腎炎","C":"急性膽囊炎","D":"猛爆性肝炎"},"answer":"C","manualChapter":"CH38"},{"id":3527,"source":"TP題庫","question":"流感病毒發生「抗原轉變」而引發全世界大流行的主要機制為何？","options":{"A":"單一病毒株內基因每年累積的點突變","B":"病毒從人類傳染給禽鳥的過程發生突變","C":"病毒與抗體結合後產生的變異","D":"不同來源病毒株在同一宿主體內進行基因段互換"},"answer":"D","manualChapter":"CH43"},{"id":3528,"source":"TP題庫","question":"下列敘述何者正確","options":{"A":"當嬰兒臍帶被夾住後，全身循環壓力上升，心臟右半部壓力升高導致卵圓孔關閉","B":"懷孕滿四十周出生稱為足月兒","C":"新生兒極易產生缺氧、酸血症、低血糖、心搏過速所以要多加注意。","D":"新生兒體表面積的三倍體積比例為頭頸臉部的水分開始增加，胎兒循環變成成人循環，體溫恆定"},"answer":"D","manualChapter":"CH48"},{"id":3529,"source":"TP題庫","question":"下列關於孕婦懷孕第三期何者錯誤？","options":{"A":"潮氣容積及每分鐘換氣量 (第三期多 30%)","B":"心跳變快 (第三期多 10-20下)","C":"心輸出量及總血量變高 (第三期多 30%)","D":"血壓變高 (第三期多 30%)"},"answer":"D","manualChapter":"CH49"},{"id":3530,"source":"TP題庫","question":"在野外執行 CPR30分鐘後，若持續無脈搏，下列何種情況「不建議」停止復甦術？","options":{"A":"病人的核心體溫極低，處於嚴重低體溫狀態","B":"因嚴重外傷導致的大量出血與心跳停止","C":"心因性內科疾病導致的心跳停止","D":"救援者已出現嚴重體力透支，且現場無人可替換"},"answer":"A","manualChapter":"CH45"},{"id":3531,"source":"TP題庫","question":"若某大型活動位於室外，熱中暑危險係數 36，同時，空氣品質指標 (AQI) 指數為 106。綜合這些數據，該活動在安全管理上可能面臨哪些主要挑戰？","options":{"A":"需同時應對熱危害與空氣品質風險","B":"熱中暑危險係數過高，需停止活動","C":"空氣品質指標過高，需停止活動","D":"環境條件良好，無需特別關注"},"answer":"A","manualChapter":"CH54"},{"id":3532,"source":"TP題庫","question":"每日至少提供7台重大外傷手術或15台一般手術，且具備全天候(24/7)手術能力，並提供每日100人次以上之急診量，及最少20張住院病床，並對部署後維持至少3週的工作能力。為WHO定義的緊急醫療團隊的分級？","options":{"A":"第一型機動式","B":"第一型固定式","C":"第二型住院及緊急手術照護","D":"第三型住院及專科照護"},"answer":"C","manualChapter":"CH56"},{"id":3533,"source":"TP題庫","question":"地震波中的 P 波與 S 波在物理特性上有顯著差異，下列關於這兩種波的敘述何者正確？","options":{"A":"P 波的質點運動方向與傳播方向垂直，容易造成建築的水平位移傷害","B":"P 波為縱波且移動速度最快，而 S 波為橫波並產生水平振動","C":"S 波的移動速度高於 P 波，因此常被用於發報機的緊急停止裝置","D":"P 波與 S 波皆屬於表面波，僅在地球表層與界面之間傳送"},"answer":"B","manualChapter":"CH57"},{"id":3534,"source":"AI出題","question":"急性肝炎（Acute Hepatitis）最常見的致病原因及傳染途徑?","options":{"A":"病毒性，血液或體液傳染","B":"細菌性，血液或體液傳染","C":"病毒性，接觸傳染","D":"細菌性，接觸傳染"},"answer":"A","manualChapter":"背誦題","matchedChapters":["背誦題"]},{"id":3560,"source":"AI出題","question":"一名 35 歲女性駕駛汽車遭側撞，救護人員抵達現場時，傷者受困車內。脫困後評估：意識清醒但主訴劇烈左側腰腹部疼痛，皮膚蒼白、濕冷，呼吸每分鐘 28 下，脈搏每分鐘 135 下，血壓 88/52 mmHg。腹部理學檢查發現左上腹有明顯瘀傷，且叩診（Percussion）呈現移動性濁音（Shifting Dullness）。請問下列關於該傷者的評估與處置敘述，何者最為正確？","options":{"A":"叩診呈現濁音主要提示腹腔內有大量積氣，應懷疑胃部破裂。","B":"傷者的生命徵象提示處於代償性休克階段，應優先給予口服補充水分。","C":"傷者最可能遭遇實質器官（如脾臟）破裂導致腹內出血，應立即給予高濃度氧氣、保暖並快速送往創傷中心。","D":"腹部瘀傷（Grey Turner's sign）通常在創傷發生後數分鐘內立即出現，是評估急性腹內出血最敏感的指標。"},"answer":"C","manualChapter":"創傷"},{"id":3561,"question":"下列關於「糖尿病酮酸中毒（DKA）」與「高血糖高滲透壓狀態（HHS / HHNK）」臨床特徵與急救處置的敘述，何者最為正確？","options":{"A":"DKA 病患由於缺乏胰島素導致脂肪分解產生大量酮體，臨床上常出現深且快的庫斯莫爾氏呼吸（Kussmaul breathing），且發病速度通常比 HHS 更加緩慢。","B":"HHS 病患因為體內完全沒有任何胰島素存在，因此更容易發生嚴重的酮酸中毒與代償性呼吸。","C":"DKA 病患常見於第一型糖尿病，其血糖值通常顯著高於 HHS，且脫水程度也比 HHS 病患更為嚴重。","D":"對於疑似高血糖急症且生命徵象不穩定（如休克、嚴重脫水）的病患，現場 EMS 處置的核心首重呼吸道維持與適當的靜脈晶體液（如生理食鹽水）補充，而非在現場盲目給予降血糖藥物。"},"answer":"D","source":"AI出題","manualChapter":"CH37","matchedChapters":["CH37"]},{"question":"民眾向指揮中心報案，稱一名路人倒臥在人行道上，派遣員接下來應該進行何種作為？","options":{"A":"詢問報案人所在位置的地址","B":"向報案人確認連絡方式","C":"請報案人先確認意識及正常呼吸","D":"啟動DACPR流程"},"answer":"A","source":"圖片匯入","manualChapter":"CH07","id":3562,"matchedChapters":["CH07"]},{"question":"所謂冗餘系統 (Redundant System) 主要目的為何？","options":{"A":"減少設備數量","B":"降低教育需求","C":"災害或故障時維持運作","D":"減少人力配置"},"answer":"C","source":"圖片匯入","manualChapter":"CH01","id":3563,"matchedChapters":["CH01"]},{"question":"台灣現代緊急醫療救護系統的起源可追溯至 1968 年，當時救護車的主要來源為何？","options":{"A":"民間慈善團體捐贈","B":"日本引進的先進救護設備","C":"衛生福利部自行採購","D":"美軍捐贈的改裝廂型車"},"answer":"D","source":"圖片匯入","manualChapter":"CH02","id":3564,"matchedChapters":["CH02"]},{"question":"下列何者不屬於高級救護技術員的任務流程？","options":{"A":"預防","B":"紀錄","C":"教育","D":"準備"},"answer":"A","source":"圖片匯入","manualChapter":"CH03","id":3565,"matchedChapters":["CH03"]},{"question":"在教育專業領域中，哪一種課程設計模式最核心的概念是「需要有明確一致的教育目標」，且其步驟包含「目標、選擇、組織、評鑑」，被形容為如同加工生產線？","options":{"A":"目標模式","B":"歷程模式","C":"情境模式","D":"文化分析模式"},"answer":"A","source":"圖片匯入","manualChapter":"CH60","id":3566
